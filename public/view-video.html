<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Video</title>
<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
video{
  width:100%;
  height:100%;
  object-fit:contain; /* makes it match screen without cropping */
}
.back-btn{
  position:absolute;
  top:20px;
  left:20px;
  color:white;
  font-size:24px;
  cursor:pointer;
  z-index:100;
}
</style>
</head>
<body>

<div class="back-btn" onclick="history.back()">&#8592;</div>
<video id="videoPlayer" controls autoplay></video>

<script>
const urlParams = new URLSearchParams(window.location.search);
const videoSrc = urlParams.get('src');

const video = document.getElementById('videoPlayer');
if(videoSrc){
  video.src = videoSrc;
  video.play();
}
</script>

</body>
</html>
