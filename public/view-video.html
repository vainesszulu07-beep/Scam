<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Video</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
}

.video-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
}

video {
  width: 100%;
  height: auto;
  max-height: 100%;
  background: black;
}

.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  background: rgba(0,0,0,0.5);
  border: none;
  padding: 8px 12px;
  color: white;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="video-container">
  <video id="video" controls autoplay></video>
  <button class="back-btn" onclick="history.back()">Back</button>
</div>

<script>
function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

const videoURL = getQueryParam('video');
const video = document.getElementById('video');

if(videoURL){
  video.src = decodeURIComponent(videoURL);
  video.play();
}
</script>

</body>
</html>
