
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Advertisement</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 450px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

h2 {
    color: #171717;
    margin-top: 0;
}

p {
    color: #777;
    font-size: 14px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    border: 1px dashed #aaa;
    border-radius: 7px;
}

#preview {
    display: none;
    margin-top: 20px;
}

#preview img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 8px;
    background: #eee;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

#uploadBtn {
    margin-top: 15px;
    background: #171717;
    color: white;
}

#uploadBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 8px;
}

#imageUrl {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: white;
}

#viewLink {
    display: inline-block;
    margin: 12px 0;
    color: #1769d2;
}

#copyBtn {
    background: #e5e5e5;
    color: #171717;
}

</style>

</head>

<body>

<div class="container">

    <h2>Upload Advertisement</h2>

    <p>Select an advertisement picture to upload.</p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div id="preview">

        <h3>Advertisement preview</h3>

        <img
            id="previewImage"
            alt="Advertisement preview"
        >

    </div>

    <button
        type="button"
        id="uploadBtn"
        disabled
    >
        Upload Advertisement
    </button>

    <div id="message" role="status"></div>

    <div id="result">

        <strong>Uploaded image URL:</strong>

        <input
            type="text"
            id="imageUrl"
            readonly
        >

        <a
            href="#"
            id="viewLink"
            target="_blank"
            rel="noopener noreferrer"
        >
            View image
        </a>

        <button type="button" id="copyBtn">
            Copy Image URL
        </button>

    </div>

</div>


<!-- SUPABASE CLIENT -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// =====================================
// CONFIGURATION
// =====================================

const API_URL = "/api/upload-ad";

const SUPABASE_URL =
    "https://eimecuiixwgmpfpedxpr.supabase.co";

const SUPABASE_PUBLIC_KEY =
    "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";

const RPC_FUNCTION =
    "save_app_pic_url";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
);


// =====================================
// ELEMENTS
// =====================================

const imageInput = document.getElementById("imageInput");

const preview = document.getElementById("preview");

const previewImage = document.getElementById("previewImage");

const uploadBtn = document.getElementById("uploadBtn");

const message = document.getElementById("message");

const result = document.getElementById("result");

const imageUrl = document.getElementById("imageUrl");

const viewLink = document.getElementById("viewLink");

const copyBtn = document.getElementById("copyBtn");


let selectedFile = null;

let previewURL = null;


// =====================================
// ERROR DISPLAY
// =====================================

function showError(error) {

    message.style.color = "red";

    message.textContent =
        "ERROR:\n\n" + error;

    console.error("FULL ERROR:", error);

}


// =====================================
// IMAGE SELECTION
// =====================================

imageInput.addEventListener("change", () => {

    const file = imageInput.files[0];

    message.textContent = "";

    result.style.display = "none";

    uploadBtn.disabled = true;

    selectedFile = null;

    if (previewURL) {

        URL.revokeObjectURL(previewURL);

        previewURL = null;

    }

    if (!file) {

        preview.style.display = "none";

        return;

    }

    if (!file.type.startsWith("image/")) {

        showError("Please select a valid image.");

        imageInput.value = "";

        preview.style.display = "none";

        return;

    }

    if (file.size > 10 * 1024 * 1024) {

        showError("Maximum image size is 10MB.");

        imageInput.value = "";

        preview.style.display = "none";

        return;

    }

    selectedFile = file;

    previewURL = URL.createObjectURL(file);

    previewImage.src = previewURL;

    preview.style.display = "block";

    uploadBtn.disabled = false;

});


// =====================================
// UPLOAD AND SAVE IMAGE URL
// =====================================

uploadBtn.addEventListener("click", async () => {

    if (!selectedFile) {

        return;

    }

    // Check Supabase configuration

    if (
        SUPABASE_URL.includes("YOUR_") ||
        SUPABASE_PUBLIC_KEY.includes("YOUR_")
    ) {

        showError(
            "Please configure your Supabase URL and public key."
        );

        return;

    }

    // =====================================
    // GET USER ID FROM LOCAL STORAGE
    // =====================================

    const userId = localStorage.getItem("user_id");

    if (!userId || !userId.trim()) {

        showError(
            "USER ID ERROR:\n" +
            "Your user ID was not found. Please log in first."
        );

        return;

    }

    uploadBtn.disabled = true;

    uploadBtn.textContent = "Uploading...";

    message.style.color = "#777";

    message.textContent = "Uploading advertisement...";

    result.style.display = "none";

    let uploadedUrl = null;

    try {

        // =====================================
        // STEP 1: UPLOAD IMAGE TO BACKEND
        // =====================================

        const formData = new FormData();

        formData.append("user_id", userId.trim());

        formData.append("file", selectedFile);

        const response = await fetch(API_URL, {

            method: "POST",

            body: formData

        });

        const rawResponse = await response.text();

        let data;

        try {

            data = JSON.parse(rawResponse);

        } catch {

            throw new Error(
                "SERVER RESPONSE IS NOT VALID JSON\n\n" +
                "HTTP STATUS: " + response.status + "\n\n" +
                rawResponse
            );

        }

        if (!response.ok || !data.success) {

            throw new Error(
                "IMAGE UPLOAD FAILED:\n\n" +
                JSON.stringify(data, null, 2)
            );

        }

        if (
            !data.url ||
            typeof data.url !== "string"
        ) {

            throw new Error(
                "Backend did not return a valid image URL."
            );

        }

        uploadedUrl = data.url;

        message.textContent =
            "Image uploaded. Saving URL to database...";


        // =====================================
        // STEP 2: CALL SUPABASE RPC FUNCTION
        // =====================================

        const {
            data: saveResult,
            error: saveError
        } = await supabaseClient.rpc(
            RPC_FUNCTION,
            {
                p_user_id: userId.trim(),

                p_app_pic_url: uploadedUrl
            }
        );


        // =====================================
        // STEP 3: CHECK DATABASE RESPONSE
        // =====================================

        if (saveError) {

            throw new Error(
                "DATABASE SAVE FAILED:\n\n" +
                saveError.message
            );

        }

        if (
            !saveResult ||
            saveResult.success !== true
        ) {

            throw new Error(
                "DATABASE REJECTED THE REQUEST:\n\n" +
                (
                    saveResult?.message ||
                    JSON.stringify(saveResult)
                )
            );

        }


        // =====================================
        // STEP 4: DISPLAY SUCCESS
        // =====================================

        imageUrl.value = uploadedUrl;

        viewLink.href = uploadedUrl;

        result.style.display = "block";

        message.style.color = "green";

        message.textContent =
            "Advertisement uploaded and saved successfully!\n" +
            "Database ID: " + saveResult.ad_id;

        // Prevent an accidental second upload
        selectedFile = null;

        imageInput.value = "";

        uploadBtn.disabled = true;

    } catch (error) {

        let errorMessage =
            error.message || String(error);

        if (uploadedUrl) {

            errorMessage +=
                "\n\nThe image was uploaded to Cloudinary, " +
                "but its database save did not complete.\n\n" +
                "Uploaded image URL:\n" + uploadedUrl;

            imageUrl.value = uploadedUrl;

            viewLink.href = uploadedUrl;

            result.style.display = "block";

        }

        showError(errorMessage);

    } finally {

        uploadBtn.textContent = "Upload Advertisement";

        if (selectedFile) {

            uploadBtn.disabled = false;

        }

    }

});


// =====================================
// COPY IMAGE URL
// =====================================

copyBtn.addEventListener("click", async () => {

    const url = imageUrl.value;

    if (!url) {

        return;

    }

    try {

        await navigator.clipboard.writeText(url);

        copyBtn.textContent = "Copied!";

        setTimeout(() => {

            copyBtn.textContent = "Copy Image URL";

        }, 2000);

    } catch (error) {

        showError(
            "COPY ERROR:\n" +
            (error.message || String(error))
        );

    }

});


// =====================================
// CLEAN UP PREVIEW
// =====================================

window.addEventListener("beforeunload", () => {

    if (previewURL) {

        URL.revokeObjectURL(previewURL);

    }

});

</script>

</body>
</html>
