
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Advertisement</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 450px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

h2 {
    color: #171717;
    margin-top: 0;
}

p {
    color: #777;
    font-size: 14px;
}

input[type="file"] {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    border: 1px dashed #aaa;
    border-radius: 7px;
}

#preview {
    display: none;
    margin-top: 20px;
}

#preview img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 8px;
    background: #eee;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

#uploadBtn {
    margin-top: 15px;
    background: #171717;
    color: white;
}

#uploadBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

#result {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 8px;
}

#imageUrl {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: white;
}

#viewLink {
    display: inline-block;
    margin: 12px 0;
    color: #1769d2;
}

#copyBtn {
    background: #e5e5e5;
    color: #171717;
}
</style>
</head>

<body>

<div class="container">

    <h2>Upload Advertisement</h2>

    <p>Select an advertisement picture to upload.</p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div id="preview">
        <h3>Advertisement preview</h3>
        <img id="previewImage" alt="Advertisement preview">
    </div>

    <button
        type="button"
        id="uploadBtn"
        disabled
    >
        Upload Advertisement
    </button>

    <div id="message" role="status"></div>

    <div id="result">

        <strong>Uploaded image URL:</strong>

        <input
            type="text"
            id="imageUrl"
            readonly
        >

        <a
            href="#"
            id="viewLink"
            target="_blank"
            rel="noopener noreferrer"
        >
            View image
        </a>

        <button type="button" id="copyBtn">
            Copy Image URL
        </button>

    </div>

</div>

<script>

// =====================================
// BACKEND CONFIGURATION
// =====================================

// Your backend file: api/upload-ad.js
const API_URL = "/api/upload-ad";

// =====================================
// ELEMENTS
// =====================================

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");
const uploadBtn = document.getElementById("uploadBtn");
const message = document.getElementById("message");
const result = document.getElementById("result");
const imageUrl = document.getElementById("imageUrl");
const viewLink = document.getElementById("viewLink");
const copyBtn = document.getElementById("copyBtn");

let selectedFile = null;
let previewURL = null;

// =====================================
// IMAGE SELECTION
// =====================================

imageInput.addEventListener("change", () => {

    const file = imageInput.files[0];

    message.textContent = "";
    result.style.display = "none";
    uploadBtn.disabled = true;
    selectedFile = null;

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
        previewURL = null;
    }

    if (!file) {
        preview.style.display = "none";
        return;
    }

    if (!file.type.startsWith("image/")) {
        message.style.color = "red";
        message.textContent = "Please select a valid image.";
        imageInput.value = "";
        preview.style.display = "none";
        return;
    }

    if (file.size > 10 * 1024 * 1024) {
        message.style.color = "red";
        message.textContent = "Maximum image size is 10MB.";
        imageInput.value = "";
        preview.style.display = "none";
        return;
    }

    selectedFile = file;

    previewURL = URL.createObjectURL(file);

    previewImage.src = previewURL;

    preview.style.display = "block";

    uploadBtn.disabled = false;

});

// =====================================
// UPLOAD ADVERTISEMENT
// =====================================

uploadBtn.addEventListener("click", async () => {

    if (!selectedFile) {
        return;
    }

    // Get user ID saved during login
    const userId = localStorage.getItem("user_id");

    if (!userId) {
        message.style.color = "red";
        message.textContent =
            "Your user ID was not found. Please log in first.";
        return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = "Uploading...";

    message.style.color = "#777";
    message.textContent = "Uploading advertisement...";

    result.style.display = "none";

    try {

        // Create multipart form data
        const formData = new FormData();

        // Send user_id to backend
        formData.append("user_id", userId);

        // Send selected image
        formData.append("file", selectedFile);

        // Call upload-ad.js
        const response = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Advertisement upload failed."
            );
        }

        // Display returned Cloudinary URL
        imageUrl.value = data.url;

        viewLink.href = data.url;

        result.style.display = "block";

        message.style.color = "green";
        message.textContent =
            "Advertisement uploaded successfully!";

    } catch (error) {

        console.error("Advertisement upload error:", error);

        message.style.color = "red";
        message.textContent =
            error.message || "Something went wrong.";

    } finally {

        uploadBtn.disabled = !selectedFile;
        uploadBtn.textContent = "Upload Advertisement";

    }

});

// =====================================
// COPY IMAGE URL
// =====================================

copyBtn.addEventListener("click", async () => {

    const url = imageUrl.value;

    if (!url) return;

    try {

        await navigator.clipboard.writeText(url);

        copyBtn.textContent = "Copied!";

        setTimeout(() => {
            copyBtn.textContent = "Copy Image URL";
        }, 2000);

    } catch (error) {

        message.style.color = "red";
        message.textContent = "Unable to copy image URL.";

    }

});

</script>

</body>
</html>
