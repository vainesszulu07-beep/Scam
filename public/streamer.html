<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; margin-bottom: 10px; transition: opacity 0.3s ease; }
  button, select { padding: 12px; width: 90%; margin: 10px; border: none; border-radius: 8px; font-weight: bold; }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #cameraSelect { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<select id="cameraSelect"><option>Loading cameras...</option></select>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;
let activeCustomTrack = null;

// Attach participant video
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream([stream.track]);
      video.srcObject = mediaStream;
      video.play();
      video.style.opacity = "1";
      status.textContent = "🔴 LIVE";
    }
  });
}

// Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Load cameras
async function loadCameras() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    cameraSelect.innerHTML = "";

    if (!cameras.length) {
      cameraSelect.innerHTML = "<option>No cameras found</option>";
      return;
    }

    cameras.forEach((cam, index) => {
      const option = document.createElement("option");
      option.value = cam.deviceId;
      option.textContent = cam.label || `Camera ${index+1}`;
      cameraSelect.appendChild(option);
    });

  } catch (err) {
    console.error(err);
    cameraSelect.innerHTML = "<option>Permission denied</option>";
  }
}

// Start Stream
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: true // Important for Warm Switch
    });

    meeting.join();
    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      attachVideo(meeting.localParticipant);
      await loadCameras();
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// Stop Stream
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping...";
    if (meeting) { meeting.leave(); meeting = null; }
    if (activeCustomTrack) { activeCustomTrack.stop(); activeCustomTrack = null; }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    status.textContent = "🛑 Stopped";
  } catch (err) {
    status.textContent = "❌ " + err.message;
  }
};

// Warm Instant Camera Switch
cameraSelect.addEventListener("change", async (e) => {
  const selectedId = e.target.value;
  if (!meeting || !selectedId) return;

  try {
    status.textContent = "Switching instantly...";
    video.style.opacity = "0.5";

    // 1️⃣ Create new custom track (warm)
    const newCustomTrack = await VideoSDK.createCameraVideoTrack({
      webcamId: selectedId,
      optimizationMode: "motion",
      encoderConfig: "h540p_w960p"
    });

    // 2️⃣ Instant local preview
    const rawTrack = newCustomTrack.track || (newCustomTrack.stream && newCustomTrack.stream.getVideoTracks()[0]);
    if (rawTrack) {
      const mediaStream = new MediaStream([rawTrack]);
      video.srcObject = mediaStream;
      video.play();
    }

    // 3️⃣ Switch for viewers
    await meeting.changeWebcam(newCustomTrack);

    // 4️⃣ Cleanup old track
    if (activeCustomTrack) { activeCustomTrack.stop(); }
    activeCustomTrack = newCustomTrack;

    status.textContent = "🔴 LIVE";
    video.style.opacity = "1";

  } catch (err) {
    console.error("Warm switch failed:", err);
    status.textContent = "❌ Switch failed";
    video.style.opacity = "1";
  }
});
</script>

</body>
</html>
