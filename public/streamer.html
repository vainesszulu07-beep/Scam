<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoSDK Live Stream</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    video {
      width: 100%;
      height: 55vh;
      background: black;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #start { background: #007bff; color: white; }
    #stop { background: #dc3545; color: white; }

    #output {
      margin-top: 15px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎥 VideoSDK Live Stream</h2>

  <video id="videoElement" autoplay muted playsinline></video>

  <div class="controls">
    <button id="start">Start Stream</button>
    <button id="stop" disabled>Stop Stream</button>
  </div>

  <div id="output">Ready...</div>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("videoElement");
const output = document.getElementById("output");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null;

// ✅ helper: attach camera to UI
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);

      video.srcObject = mediaStream;
      video.play();

      output.textContent += "\n✅ Camera Stream Active!";
    }
  });
}

async function getUserSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("❌ Please log in first.");
  return session.user.id;
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    output.textContent = "🎬 Creating room...";

    const userId = await getUserSession();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Backend error");

    VideoSDK.config(data.hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: true
    });

    meeting.join();

    // ✅ when meeting joins
    meeting.on("meeting-joined", () => {
      output.textContent += "\n🎥 Joined Room";

      stopBtn.disabled = false;

      // 🔥 CRITICAL FIX: attach immediately
      if (meeting.localParticipant) {
        attachVideo(meeting.localParticipant);
      }
    });

    // ✅ backup: if event fires later
    meeting.on("participant-joined", (participant) => {
      if (participant.id === meeting.localParticipant.id) {
        attachVideo(participant);
      }
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      output.textContent = "🛑 Stream Ended";

      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

  } catch (err) {
    output.textContent = "❌ " + err.message;
    startBtn.disabled = false;
    console.error(err);
  }
};

stopBtn.onclick = () => {
  if (meeting) meeting.leave();

  video.srcObject = null;
  output.textContent += "\n🛑 Stopped";

  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>

</body>
</html>
