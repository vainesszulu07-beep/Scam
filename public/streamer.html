<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live with Server Recording</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #frontCam, #backCam { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
  #uploadProgressOverlay {
    display:none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    color: white; font-size: 20px;
    justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<h2>🎥 Go Live with Server Recording</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="frontCam">Front Camera</button>
<button id="backCam">Back Camera</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const frontBtn = document.getElementById("frontCam");
const backBtn = document.getElementById("backCam");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

let meeting = null;
let currentUserId = null;
let customTrack = null;
let currentFacing = "user";
let currentXHR = null;

// Attach participant video
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// Camera switching
async function switchCamera(facingMode) {
  try {
    if (!meeting) return;
    status.textContent = `Switching to ${facingMode} camera...`;

    if (customTrack) {
      await meeting.disableWebcam();
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
    }

    customTrack = await VideoSDK.createCameraVideoTrack({
      optimizationMode: "detail",
      encoderConfig: "h1080p_w1920p",
      multiStream: false,
      facingMode
    });

    await meeting.enableWebcam(customTrack);
    attachVideo(meeting.localParticipant);
    status.textContent = `🔄 Switched to ${facingMode} camera`;
  } catch (err) {
    console.error("Camera switch failed:", err);
    status.textContent = `❌ Camera switch error: ${err.message}`;
  }
}

frontBtn.onclick = () => switchCamera("user");
backBtn.onclick = () => switchCamera("environment");

// Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Save stream to DB
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

// Clear stream from DB
async function clearStreamFromDB(userId) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId);
  if (error) throw error;
}

// START STREAM
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    const userId = await getUser();
    currentUserId = userId;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);

    // Start server-side recording
    await fetch("/api/start-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: data.roomId })
    });

    customTrack = await VideoSDK.createCameraVideoTrack({
      optimizationMode: "detail",
      encoderConfig: "h1080p_w1920p",
      multiStream: false,
      facingMode: "user"
    });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;
      while (!meeting.localParticipant) await new Promise(r => setTimeout(r, 50));
      await meeting.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);
      await saveStreamToDB(userId, data);
    });

    meeting.on("participant-joined", participant => {
      if (participant.id === meeting.localParticipant.id) attachVideo(participant);
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// STOP STREAM
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    // Stop server-side recording
    const recordRes = await fetch("/api/stop-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: meeting.roomId })
    });
    const text = await recordRes.text();
    let recordingData;
    try {
      recordingData = JSON.parse(text);
    } catch (err) {
      console.error("Stop recording failed. Raw response:", text);
      throw new Error("Stop recording failed. See console for raw server response.");
    }

    const { recordingUrl } = recordingData;

    // Upload to Cloudinary
    if (recordingUrl) {
      await uploadToCloudinary(recordingUrl);
    }

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended and Recorded";
    startBtn.disabled = false;
    stopBtn.disabled = true;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Error stopping stream: " + err.message;
  }
};

// Upload server-side recorded video to Cloudinary
async function uploadToCloudinary(url) {
  try {
    status.textContent = "Uploading recorded video...";
    uploadProgressOverlay.style.display = "flex";

    const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());
    const formData = new FormData();
    formData.append("file", url);
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder", "videos");

    currentXHR = new XMLHttpRequest();
    currentXHR.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
    currentXHR.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressPercent.textContent = percent + "%";
      }
    };

    const uploadPromise = new Promise((resolve, reject) => {
      currentXHR.onload = () => {
        if (currentXHR.status >= 200 && currentXHR.status < 300)
          resolve(JSON.parse(currentXHR.responseText));
        else reject(new Error("Upload failed"));
      };
      currentXHR.onerror = () => reject(new Error("Upload error"));
      currentXHR.send(formData);
    });

    const videoData = await uploadPromise;

    const { error } = await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);
    if (error) throw error;

    console.log("Upload complete!", videoData);
    alert("Video uploaded and saved to posts table!");
    window.location.href = "profile.html";

  } catch (err) {
    console.error(err);
    alert("Error uploading video: " + err.message);
  } finally {
    uploadProgressOverlay.style.display = "none";
    currentXHR = null;
  }
}
</script>
</body>
  </html>
