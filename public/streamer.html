<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Room Creator</title>
<style>
  body {
    font-family: system-ui;
    background: #f0f2f5;
    padding: 20px;
  }
  input, button {
    padding: 10px;
    margin-right: 10px;
    font-size: 1rem;
  }
  #output {
    margin-top: 15px;
    white-space: pre-wrap;
    background: #fff;
    padding: 10px;
    border-radius: 6px;
  }
</style>
</head>
<body>

<h2>🎥 VideoSDK Room Creator</h2>

<input type="text" id="userId" placeholder="Enter your User ID" />
<button id="createBtn">Create Room</button>

<div id="output">Room info will appear here...</div>

<script>
const BACKEND_URL = "https://scamming-lg3v.onrender.com"; // change if deployed

const output = document.getElementById("output");
document.getElementById("createBtn").onclick = async () => {
  const userId = document.getElementById("userId").value.trim();
  if (!userId) {
    output.textContent = "❌ Please enter a user ID";
    return;
  }

  output.textContent = "Creating room...";

  try {
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await resp.json();

    if (!data.success) {
      output.textContent = "❌ Error:\n" + JSON.stringify(data, null, 2);
      return;
    }

    output.textContent = `✅ Room created!\n\nUser ID: ${userId}\nRoom ID: ${data.roomId}\nHost Token: ${data.hostToken || "Not generated yet"}`;

  } catch (err) {
    output.textContent = "❌ Network error:\n" + err.message;
  }
};
</script>

</body>
  </html>
