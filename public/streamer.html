<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Minimal</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; margin-top: 10px; }
  button { padding: 10px 16px; font-size: 14px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<h2>Streamer Minimal</h2>
<button id="startBtn">Start / Update Stream</button>
<button id="stopBtn">Stop Stream</button>
<div id="msg">Press button to start or stop your stream...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase frontend key ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
let userId = null;

// --- Render backend URL ---
const BACKEND_URL = "https://scamming-lg3v.onrender.com";

// --- Get current logged-in user ---
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    msgEl.textContent = "Login required";
    return false;
  }
  userId = session.user.id;
  return true;
}

// --- Start / Update Stream ---
async function startStream() {
  if (!userId) {
    const ok = await getUser();
    if (!ok) return;
  }

  try {
    const res = await fetch(`${BACKEND_URL}/api/start-stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } 
    catch(e) { msgEl.textContent = "Non-JSON response:\n" + text; return; }

    if (data.success) {
      msgEl.textContent = "Stream started successfully!\n" + JSON.stringify(data, null, 2);
    } else {
      msgEl.textContent = "Error starting stream:\n" + JSON.stringify(data.error, null, 2);
    }
  } catch(err) {
    msgEl.textContent = "Network / JS error:\n" + err.message;
  }
}

// --- Stop Stream ---
async function stopStream() {
  if (!userId) {
    const ok = await getUser();
    if (!ok) return;
  }

  try {
    const res = await fetch(`${BACKEND_URL}/api/stop-stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } 
    catch(e) { msgEl.textContent = "Non-JSON response:\n" + text; return; }

    if (data.success) {
      msgEl.textContent = "Stream stopped successfully!\n" + JSON.stringify(data, null, 2);
    } else {
      msgEl.textContent = "Error stopping stream:\n" + JSON.stringify(data.error, null, 2);
    }
  } catch(err) {
    msgEl.textContent = "Network / JS error:\n" + err.message;
  }
}

// --- Button events ---
startBtn.onclick = startStream;
stopBtn.onclick = stopStream;

// --- Initialize ---
getUser();
</script>

</body>
</html>
