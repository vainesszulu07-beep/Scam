<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live with Recording</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #switchCam { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>

<h2>🎥 Go Live with Recording</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="switchCam">Switch Camera</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const switchBtn = document.getElementById("switchCam");

let meeting = null;
let currentUserId = null;
let customTrack = null;
let currentFacing = "user"; // front camera

function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

async function clearStreamFromDB(userId) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId);
  if (error) throw error;
  return true;
}

// Switch camera
async function switchCamera() {
  if (!meeting) return;
  try {
    currentFacing = currentFacing === "user" ? "environment" : "user";
    status.textContent = `Switching to ${currentFacing} camera...`;

    if (customTrack) {
      await meeting.disableWebcam();
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
    }

    customTrack = await VideoSDK.createCameraVideoTrack({
      optimizationMode: "detail",
      encoderConfig: "h1080p_w1920p",
      multiStream: false,
      facingMode: currentFacing
    });

    await meeting.enableWebcam(customTrack);
    attachVideo(meeting.localParticipant);
    status.textContent = `🔄 Switched to ${currentFacing} camera`;
  } catch (err) {
    console.error("Camera switch failed:", err);
    status.textContent = `❌ Camera switch error: ${err.message}`;
  }
}

switchBtn.onclick = switchCamera;

// Start stream
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    const userId = await getUser();
    currentUserId = userId;

    const res = await fetch("/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);

    // Start cloud recording server-side
    await fetch("/api/start-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: data.roomId })
    });

    customTrack = await VideoSDK.createCameraVideoTrack({
      optimizationMode: "detail",
      encoderConfig: "h1080p_w1920p",
      multiStream: false,
      facingMode: "user"
    });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;

      let waited = 0;
      while (!meeting.localParticipant && waited < 5000) {
        await new Promise(r => setTimeout(r, 50));
        waited += 50;
      }

      await meeting.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);
      await saveStreamToDB(userId, data);
    });

    meeting.on("participant-joined", participant => {
      if (participant.id === meeting.localParticipant.id) attachVideo(participant);
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// Stop stream
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    // Stop server-side recording
    const recordRes = await fetch("/api/stop-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: meeting.roomId })
    });
    const { recordingUrl } = await recordRes.json();

    // Upload to Cloudinary
    if (recordingUrl) {
      const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());
      const formData = new FormData();
      formData.append("file", recordingUrl);
      formData.append("api_key", apiKey);
      formData.append("timestamp", timestamp);
      formData.append("signature", signature);
      formData.append("folder", "videos");

      await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
        method: "POST",
        body: formData
      });
    }

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended and Recorded";
    startBtn.disabled = false;
    stopBtn.disabled = true;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Error stopping stream: " + err.message;
  }
};
</script>

</body>
  </html>
