<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; object-fit: contain; }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #frontCam, #backCam { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
  #uploadProgressOverlay {
    display:none; position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5); color: white; font-size: 20px;
    justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<select id="cameraSelect"></select>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="frontCam">Front Camera</button>
<button id="backCam">Back Camera</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const frontBtn = document.getElementById("frontCam");
const backBtn = document.getElementById("backCam");
const cameraSelect = document.getElementById("cameraSelect");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

let meeting = null;
let currentUserId = null;
let customTrack = null;
let mediaRecorder = null;
let recordedChunks = [];
let currentCameraId = null;
const sessionId = crypto.randomUUID();
let segmentNumber = 1;

// --- Helpers ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

function attachStream(stream, isFrontCamera) {
  video.srcObject = stream;
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "none";
  video.play();
}

async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d => d.kind === "videoinput");
}

async function populateCameraList() {
  const cameras = await getCameras();
  cameraSelect.innerHTML = "";
  let defaultDeviceId = null;
  cameras.forEach(cam => {
    const option = document.createElement("option");
    option.value = cam.deviceId;
    option.text = cam.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
    if (!defaultDeviceId && cam.label.toLowerCase().includes("back")) {
      defaultDeviceId = cam.deviceId;
    }
  });
  cameraSelect.value = defaultDeviceId || (cameras[0] && cameras[0].deviceId);
  currentCameraId = cameraSelect.value;
}

// --- Supabase ---
async function saveStreamToDB(userId, data) {
  const { error } = await supabase.from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    }).eq("id", userId);
  if (error) throw error;
}

async function clearStreamFromDB(userId) {
  const { error } = await supabase.from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    }).eq("id", userId);
  if (error) throw error;
}

// --- Recording ---
function startRecording(track) {
  const stream = new MediaStream([track.track]);
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start(2000);
}

async function stopAndUploadRecording(cameraId) {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;
  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      if (recordedChunks.length > 0) {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        recordedChunks = [];
        uploadProgressOverlay.style.display = "flex";
        try {
          const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());
          const formData = new FormData();
          formData.append("file", blob, `camera-${cameraId}-segment.webm`);
          formData.append("api_key", apiKey);
          formData.append("timestamp", timestamp);
          formData.append("signature", signature);
          formData.append("folder", "videos");

          const xhr = new XMLHttpRequest();
          xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
          };

          await new Promise((res, rej) => {
            xhr.onload = () => xhr.status < 400 ? res() : rej("Upload failed");
            xhr.onerror = () => rej("Upload error");
            xhr.send(formData);
          });

        } catch(err) { alert("Upload failed: " + err); }
        finally { uploadProgressOverlay.style.display = "none"; resolve(); }
      } else resolve();
    };
    mediaRecorder.stop();
  });
}

// --- Camera switching ---
async function switchCamera(deviceId) {
  await stopAndUploadRecording(currentCameraId);
  if (customTrack) customTrack.stop();

  const videoConfigs = [
    { encoderConfig: "h1080p_w1920p", multiStream: false },
    { encoderConfig: "h720p_w1280p", multiStream: false }
  ];

  for (let cfg of videoConfigs) {
    try {
      customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "detail", cameraId: deviceId, ...cfg });
      break;
    } catch(err) { /* fallback */ }
  }

  if (!customTrack) return status.textContent = "❌ Camera switch failed";
  await meeting.enableWebcam(customTrack);

  const isFront = cameraSelect.selectedOptions[0].text.toLowerCase().includes("front");
  attachStream(new MediaStream([customTrack.track]), isFront);
  currentCameraId = deviceId;
  startRecording(customTrack);
  status.textContent = "🔄 Switched Camera";
}

// --- Buttons ---
cameraSelect.onchange = () => switchCamera(cameraSelect.value);
frontBtn.onclick = async () => {
  const cams = await getCameras();
  const front = cams.find(c => c.label.toLowerCase().includes("front"));
  if (front) switchCamera(front.deviceId);
};
backBtn.onclick = async () => {
  const cams = await getCameras();
  const back = cams.find(c => c.label.toLowerCase().includes("back"));
  if (back) switchCamera(back.deviceId);
};

// --- Start Stream ---
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);

    // Create initial camera track
    const videoConfigs = [
      { encoderConfig: "h1080p_w1920p", multiStream: false },
      { encoderConfig: "h720p_w1280p", multiStream: false }
    ];
    for (let cfg of videoConfigs) {
      try {
        customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "detail", cameraId: currentCameraId, ...cfg });
        break;
      } catch(err) { console.warn(err); }
    }
    if (!customTrack) throw new Error("No compatible camera track available");

    const isFront = cameraSelect.selectedOptions[0].text.toLowerCase().includes("front");
    attachStream(new MediaStream([customTrack.track]), isFront);
    startRecording(customTrack);

    // Init meeting
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      await meeting.enableWebcam(customTrack);
      status.textContent = "🔴 LIVE";
      await saveStreamToDB(currentUserId, data);
    });

    meeting.on("participant-joined", (p) => {
      if (p.id === meeting.localParticipant?.id) attachStream(new MediaStream([customTrack.track]), isFront);
    });

  } catch(err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// --- Stop Stream ---
stopBtn.onclick = async () => {
  stopBtn.disabled = true;
  await stopAndUploadRecording(currentCameraId);

  if (meeting) {
    await meeting.disableWebcam();
    meeting.leave();
    meeting = null;
  }
  if (customTrack) customTrack.stop();
  video.srcObject = null;
  status.textContent = "🛑 Stream Ended";
  startBtn.disabled = false;

  await clearStreamFromDB(currentUserId);

  // Merge segments (optional)
  try {
    const mergeRes = await fetch("/api/video_merge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
    });
    const mergeData = await mergeRes.json();
    if (mergeData.merged_url) alert("✅ Merged video uploaded successfully!");
  } catch {}
};

// --- Init ---
await populateCameraList();
</script>
</body>
  </html>
