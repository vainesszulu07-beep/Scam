<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>VideoSDK Live Stream</title>  

  <style>  
    body { font-family: system-ui; padding: 15px; background: #f4f4f4; }  
    .container { max-width: 800px; margin: auto; }  

    video {  
      width: 100%;  
      height: 55vh;  
      background: black;  
      border-radius: 12px;  
      margin-bottom: 10px;  
    }  

    button {  
      padding: 12px;  
      border: none;  
      border-radius: 8px;  
      font-weight: bold;  
      width: 48%;  
    }  

    #start { background: #007bff; color: white; }  
    #stop { background: red; color: white; }  

    #output {  
      background: white;  
      padding: 10px;  
      border-radius: 8px;  
      font-size: 13px;  
      white-space: pre-wrap;  
    }  

    .controls { display: flex; gap: 4%; }  
  </style>  
</head>  
<body>  

<div class="container">  
  <h3>🎥 Live Stream</h3>  

  <video id="videoElement" autoplay muted playsinline></video>  

  <div class="controls">  
    <button id="start">Start</button>  
    <button id="stop" disabled>Stop</button>  
  </div>  

  <div id="output">Ready...</div>  
</div>  

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>  

<script type="module">  
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";  

const supabase = createClient(  
  "https://eimecuiixwgmpfpedxpr.supabase.co",  
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"  
);  

const video = document.getElementById("videoElement");  
const output = document.getElementById("output");  
const startBtn = document.getElementById("start");  
const stopBtn = document.getElementById("stop");  

let meeting = null;  
let localTrack = null;  

async function getUserSession() {  
  const { data: { session } } = await supabase.auth.getSession();  
  if (!session) throw new Error("Login first.");  
  return session.user.id;  
}  

startBtn.onclick = async () => {  
  try {  
    startBtn.disabled = true;  
    output.textContent = "🔐 Requesting permission...";  

    // ✅ FORCE CAMERA PERMISSION (IMPORTANT FOR PHONE)
    let tempStream;  
    try {  
      tempStream = await navigator.mediaDevices.getUserMedia({  
        video: true,  
        audio: true  
      });  
    } catch (e) {  
      throw new Error("Permission denied ❌");  
    }  

    // stop temp stream
    tempStream.getTracks().forEach(t => t.stop());  

    output.textContent = "✅ Permission granted\nChecking user...";  

    const userId = await getUserSession();  

    output.textContent += "\nConnecting to backend...";  

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {  
      method: "POST",  
      headers: { "Content-Type": "application/json" },  
      body: JSON.stringify({ userId })  
    });  

    const data = await res.json();  
    if (!data.success) throw new Error("Backend error");  

    output.textContent += "\nInitializing camera...";  

    // ✅ CREATE TRACK SAFELY
    localTrack = await VideoSDK.createCameraVideoTrack({  
      facingMode: "user"  
    });  

    if (!localTrack || !localTrack.track) {  
      throw new Error("Camera failed ❌");  
    }  

    // ✅ SHOW PREVIEW
    const stream = new MediaStream();  
    stream.addTrack(localTrack.track);  
    video.srcObject = stream;  

    // ✅ INIT SDK
    VideoSDK.config(data.hostToken);  

    meeting = VideoSDK.initMeeting({  
      meetingId: data.roomId,  
      name: "Host",  
      micEnabled: true,  
      webcamEnabled: false,  
      customVideoTrack: localTrack  
    });  

    meeting.join();  

    meeting.on("meeting-joined", () => {  
      output.textContent += "\n🎥 LIVE!";  
      stopBtn.disabled = false;  
    });  

  } catch (err) {  
    output.textContent = err.message;  
    startBtn.disabled = false;  
    if (localTrack) localTrack.stop();  
  }  
};  

stopBtn.onclick = () => {  
  if (meeting) meeting.leave();  
  if (localTrack) localTrack.stop();  

  if (video.srcObject) {  
    video.srcObject.getTracks().forEach(t => t.stop());  
  }  

  video.srcObject = null;  
  output.textContent = "🛑 Stopped";  

  startBtn.disabled = false;  
  stopBtn.disabled = true;  
};  

</script>  

</body>  
  </html>
