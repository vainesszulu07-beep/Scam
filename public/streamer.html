<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 16px; margin-right: 6px; cursor: pointer; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<h2>Streamer</h2>
<video id="localVideo" autoplay muted playsinline></video>
<div id="msg">Initializing...</div>
<button id="startBtn">Start Stream</button>
<button id="stopBtn">Stop Stream</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const BACKEND_URL = "https://scamming-lg3v.onrender.com";

// --- Supabase client ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou" // You can use anon key here for frontend session
);

const videoEl = document.getElementById('localVideo');
const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let localStream;
let pc;

// ----------------------------
// Get user session
// ----------------------------
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  msgEl.textContent = "You must be logged in to stream.";
  startBtn.disabled = true;
  stopBtn.disabled = true;
  throw new Error("Not logged in");
}
const userId = session.user.id;

// ----------------------------
// Start Stream
// ----------------------------
startBtn.onclick = async () => {
  try {
    // 1. Get camera + mic
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    videoEl.srcObject = localStream;

    // 2. Request persistent room & host token
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);

    const { roomId, hostToken } = data;
    msgEl.textContent = `Streaming in room: ${roomId}`;

    // 3. Connect to VideoSDK via WebRTC
    pc = new RTCPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = async (event) => {
      if (!event.candidate) return;
      // VideoSDK automatically handles ICE for persistent rooms
      // You can ignore sending ICE manually here
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send SDP offer to VideoSDK
    const sdpResp = await fetch(`https://api.videosdk.live/v2/rooms/${roomId}/webrtc`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${hostToken}`,
        "Content-Type": "application/sdp"
      },
      body: offer.sdp
    });
    const answerSdp = await sdpResp.text();
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    msgEl.textContent += "\nServer-side broadcast started ✅";

  } catch(err) {
    msgEl.textContent = "Error: " + err.message;
  }
};

// ----------------------------
// Stop Stream
// ----------------------------
stopBtn.onclick = async () => {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();

  await fetch(`${BACKEND_URL}/api/stop-stream`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId })
  });
  msgEl.textContent = "Stream stopped";
};
</script>

</body>
</html>
