<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 16px; margin-right: 6px; cursor: pointer; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<h2>Streamer</h2>
<video id="localVideo" autoplay muted playsinline></video>
<div id="msg">Initializing...</div>
<button id="startBtn">Start Stream</button>
<button id="stopBtn">Stop Stream</button>

<script type="module">
let localStream;
const videoEl = document.getElementById('localVideo');
const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

const BACKEND_URL = "https://scamming-lg3v.onrender.com";

// Replace with logged-in user id
const userId = "077c64ed-3e42-421a-92be-f8fff271d3a6";

startBtn.onclick = async () => {
  try {
    // 1. Get camera + mic
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    videoEl.srcObject = localStream;

    // 2. Request host token + persistent room
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.error);

    const { roomId, hostToken } = data;
    msgEl.textContent = `Streaming in room: ${roomId}`;

    // 3. Connect to VideoSDK via WebRTC
    const pc = new RTCPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = async (event) => {
      if (!event.candidate) return;
      await fetch(`${BACKEND_URL}/api/send-ice`, { 
        method: "POST",
        body: JSON.stringify({ candidate: event.candidate, roomId, token: hostToken }),
        headers: { "Content-Type": "application/json" }
      });
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send SDP offer to VideoSDK
    const sdpResp = await fetch(`https://api.videosdk.live/v2/rooms/${roomId}/webrtc`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${hostToken}`,
        "Content-Type": "application/sdp"
      },
      body: offer.sdp
    });
    const answerSdp = await sdpResp.text();
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    msgEl.textContent += "\nServer-side broadcast started ✅";

  } catch(err) {
    msgEl.textContent = "Error: " + err.message;
  }
};

stopBtn.onclick = async () => {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  await fetch(`${BACKEND_URL}/api/stop-stream`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId })
  });
  msgEl.textContent = "Stream stopped";
};
</script>

</body>
</html>
