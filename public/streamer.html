<title>Live Studio</title>

<style>    
    :root {    
        --bg: #0b0b0f;    
        --card: #16161d;    
        --accent: #6366f1;    
        --danger: #ef4444;    
        --success: #22c55e;    
        --text: #ffffff;    
    }  

    body {    
        margin: 0;    
        background-color: var(--bg);    
        color: var(--text);    
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;    
        display: flex;    
        justify-content: center;    
        align-items: center;    
        min-height: 100vh;    
    }    
    
    .studio-container {    
        width: 95%;    
        max-width: 1100px;    
        background: var(--card);    
        border-radius: 20px;    
        overflow: hidden;    
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);    
    }    

    .top-bar {    
        padding: 15px 25px;    
        display: flex;    
        justify-content: space-between;    
        align-items: center;    
        border-bottom: 1px solid rgba(255,255,255,0.05);    
    }    

    .brand { font-weight: 800; font-size: 1.2rem; }    
    .brand span { color: var(--accent); }    

    .status-badge {    
        font-size: 12px;    
        font-weight: 700;    
        padding: 6px 12px;    
        border-radius: 6px;    
        background: rgba(255,255,255,0.05);    
    }    

    .status-badge.live { color: var(--danger); }    
    .status-badge.success { color: var(--success); }    

    .viewport {    
        position: relative;    
        width: 100%;    
        background: #000;    
        aspect-ratio: 16/9;    
    }    

    video { width: 100%; height: 100%; object-fit: cover; }    

    .overlay {    
        position: absolute;    
        inset: 0;    
        background: rgba(0,0,0,0.8);    
        display: none;    
        justify-content: center;    
        align-items: center;    
    }    

    .controls {    
        padding: 25px;    
        display: flex;    
        justify-content: center;    
        gap: 15px;    
        flex-wrap: wrap;    
    }    

    .btn {    
        border: none;    
        padding: 12px 24px;    
        border-radius: 10px;    
        cursor: pointer;    
    }    

    .btn-main { background: var(--accent); color: white; }    
    .btn-stop { background: var(--danger); color: white; }    

</style>    
</head>    

<body>  

<div class="studio-container">    
    <div class="top-bar">    
        <div class="brand">STREAM<span>STUDIO</span></div>    
        <div id="status" class="status-badge">Ready</div>    
    </div>  

    <div class="viewport">    
        <video id="video" autoplay muted playsinline></video>    
        
        <div id="brbOverlay" class="overlay">    
            <h2>Stream Paused</h2>    
        </div>    
    </div>    

    <div class="controls">    
        <button id="startBtn" class="btn btn-main">Start</button>    
        <button id="stopBtn" class="btn btn-stop" disabled>End</button>    
    </div>  
</div>
