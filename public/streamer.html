<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video {
    width: 100%;
    max-height: 55vh;
    background: black;
    object-fit: contain; /* preserves aspect ratio */
    transform: none;
  }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #mute { background: orange; color: white; }
  #status { padding: 10px; background: white; }
  #uploadProgressOverlay {
    display:none;
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    color: white; font-size: 20px;
    justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<select id="cameraSelect"></select>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="mute">Mute</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");
const muteBtn = document.getElementById("mute");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

let meeting = null;
let currentUserId = null;
let currentStream = null;
let roomIdGlobal = null;
let mediaRecorder = null;
let recordedChunks = [];
let isMuted = false;
const sessionId = crypto.randomUUID();

// --- Get Supabase user ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- Attach stream and mirror if front camera ---
function attachStream(stream, isFrontCamera) {
  video.srcObject = stream;
  video.play();
  video.style.transform = isFrontCamera ? "scaleX(-1)" : "none";
}

// --- Get available cameras ---
async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d => d.kind === "videoinput");
}

// --- Populate camera select dropdown ---
async function populateCameraList() {
  const cameras = await getCameras();
  cameraSelect.innerHTML = "";
  let defaultDeviceId = null;
  cameras.forEach(cam => {
    const option = document.createElement("option");
    option.value = cam.deviceId;
    option.text = cam.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
    if (!defaultDeviceId && cam.label.toLowerCase().includes("back")) {
      defaultDeviceId = cam.deviceId;
    }
  });
  cameraSelect.value = defaultDeviceId || (cameras[0] && cameras[0].deviceId);
}

// --- START: New reliable recording functions --- //

// Start recording using working MediaRecorder method
async function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "video/webm;codecs=vp8,opus",
    videoBitsPerSecond: 2500000,
    audioBitsPerSecond: 128000
  });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.start(2000); // collect chunks every 2s
}

// Stop recording and return combined Blob
async function stopRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder) return resolve(null);
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      recordedChunks = [];
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

// Upload recorded video
async function uploadRecordedVideo(blob) {
  try {
    uploadProgressOverlay.style.display = "flex";
    const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

    const formData = new FormData();
    formData.append("file", blob, "recorded-video.webm");
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder", "videos");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

    xhr.upload.onprogress = e => {
      if (e.lengthComputable) progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
    };

    const uploadPromise = new Promise((resolve, reject) => {
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
        else reject(new Error("Upload failed"));
      };
      xhr.onerror = () => reject(new Error("Upload error"));
      xhr.send(formData);
    });

    const videoData = await uploadPromise;

    await supabase.from("video_segments").insert([{
      session_id: sessionId,
      user_id: currentUserId,
      video_url: videoData.secure_url,
      public_id: videoData.public_id
    }]);

    alert("✅ Video uploaded successfully!");
  } catch (err) {
    alert("❌ Upload failed: " + err.message);
  } finally {
    uploadProgressOverlay.style.display = "none";
  }
}
// --- END: New recording functions --- //

// --- Get user media ---
async function getUserMedia(deviceId) {
  return navigator.mediaDevices.getUserMedia({
    video: {
      deviceId: { exact: deviceId },
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30 }
    },
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      sampleRate: 48000,
      channelCount: 2
    }
  });
}

// --- Camera switch ---
cameraSelect.onchange = async () => {
  if (currentStream) {
    const blob = await stopRecording();
    if (blob) await uploadRecordedVideo(blob);
    currentStream.getTracks().forEach(t => t.stop());
  }

  currentStream = await getUserMedia(cameraSelect.value);
  const isFront = cameraSelect.selectedOptions[0].text.toLowerCase().includes("front");
  attachStream(currentStream, isFront);
  await startRecording(currentStream);
};

// --- Join meeting ---
async function joinMeeting(stream) {
  meeting = VideoSDK.initMeeting({
    meetingId: roomIdGlobal,
    name: "Host",
    participantId: currentUserId,
    micEnabled: true,
    webcamEnabled: true,
    webcamStream: stream
  });
  await meeting.join();
  meeting.on("meeting-joined", () => {
    status.textContent = "🔴 LIVE";
  });
}

// --- Start button ---
startBtn.onclick = async () => {
  startBtn.disabled = true;
  currentUserId = await getUser();

  const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUserId })
  });

  const data = await res.json();
  roomIdGlobal = data.roomId;

  await VideoSDK.config(data.hostToken);

  const selectedDeviceId = cameraSelect.value;
  currentStream = await getUserMedia(selectedDeviceId);
  const isFront = cameraSelect.selectedOptions[0].text.toLowerCase().includes("front");
  attachStream(currentStream, isFront);

  await startRecording(currentStream); // ✅ New working recording

  await joinMeeting(currentStream);
  stopBtn.disabled = false;
};

// --- Stop button ---
stopBtn.onclick = async () => {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());

  const blob = await stopRecording();
  if (blob) await uploadRecordedVideo(blob);

  stopBtn.disabled = true;
  startBtn.disabled = false;
};

// --- Mute button ---
muteBtn.onclick = () => {
  if (!currentStream) return;
  currentStream.getAudioTracks().forEach(track => track.enabled = isMuted);
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? "Unmute" : "Mute";
};

// --- Initialize ---
populateCameraList();
</script>
</body>
  </html>
