<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #frontCam, #backCam { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
  #uploadProgressOverlay {
    display:none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    color: white; font-size: 20px;
    justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="frontCam">Front Camera</button>
<button id="backCam">Back Camera</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase setup ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// --- DOM Elements ---
const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const frontBtn = document.getElementById("frontCam");
const backBtn = document.getElementById("backCam");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

// --- Global variables ---
let meeting = null;
let currentUserId = null;
let mediaRecorder = null;
let recordedChunks = [];
let currentStream = null;
let currentCamera = "user";

// --- Get current user ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- Save stream info to DB ---
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

// --- Clear stream info from DB ---
async function clearStreamFromDB(userId) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId);
  if (error) throw error;
}

// --- Start recording ---
async function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "video/webm;codecs=vp8,opus",
    audioBitsPerSecond: 128000,
    videoBitsPerSecond: 2500000
  });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.start(2000);
}

// --- Stop recording ---
async function stopRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder) return resolve(null);
    mediaRecorder.onstop = () => resolve(new Blob(recordedChunks, { type: "video/webm" }));
    mediaRecorder.stop();
  });
}

// --- Attach video to <video> element ---
function attachStreamToVideo(stream) {
  video.srcObject = stream;
  video.play();
}

// --- Switch camera live ---
async function switchCamera(facingMode) {
  if (!meeting) return;
  try {
    status.textContent = `Switching to ${facingMode} camera...`;

    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 48000 }
    });

    // Stop old tracks
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());

    currentStream = newStream;
    attachStreamToVideo(currentStream);

    // Restart MediaRecorder
    if (mediaRecorder && mediaRecorder.state === "recording") {
      await stopRecording();
      await startRecording(currentStream);
    }

    // Replace webcam track in VideoSDK
    const videoTrack = currentStream.getVideoTracks()[0];
    await meeting.enableWebcam(videoTrack);

    currentCamera = facingMode;
    status.textContent = `🔄 Switched to ${facingMode} camera`;
  } catch (err) {
    console.error("Camera switch failed:", err);
    status.textContent = `❌ Camera switch error: ${err.message}`;
  }
}

frontBtn.onclick = () => switchCamera("user");
backBtn.onclick = () => switchCamera("environment");

// --- Start live stream ---
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);
    status.textContent = "Accessing camera...";

    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentCamera },
      audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 48000 }
    });

    attachStreamToVideo(currentStream);
    await startRecording(currentStream);

    const videoTrack = currentStream.getVideoTracks()[0];

    // ✅ Init meeting with webcam enabled
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: true,
      webcamStream: new MediaStream([videoTrack])
    });

    await meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "🔴 LIVE";
      stopBtn.disabled = false;
      await saveStreamToDB(currentUserId, data);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", (err) => {
      console.error("SDK Error:", err);
      status.textContent = "❌ Connection error";
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// --- Stop live stream ---
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    const recordedBlob = await stopRecording();

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;

    if (recordedBlob) await uploadRecordedVideo(recordedBlob);

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }
};

// --- Upload recorded video ---
async function uploadRecordedVideo(blob) {
  try {
    status.textContent = "Uploading recorded video...";
    uploadProgressOverlay.style.display = "flex";

    const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

    const formData = new FormData();
    formData.append("file", blob, "recorded-video.webm");
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder", "videos");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
      }
    };

    const uploadPromise = new Promise((resolve, reject) => {
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300)
          resolve(JSON.parse(xhr.responseText));
        else reject(new Error("Upload failed"));
      };
      xhr.onerror = () => reject(new Error("Upload error"));
      xhr.send(formData);
    });

    const videoData = await uploadPromise;

    const { error } = await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);

    if (error) throw error;

    console.log("Upload complete!", videoData);
    alert("Video uploaded successfully!");
    window.location.href = "profile.html";

  } catch (err) {
    console.error(err);
    alert("Error uploading video: " + err.message);
  } finally {
    uploadProgressOverlay.style.display = "none";
  }
}
</script>
</body>
  </html>
