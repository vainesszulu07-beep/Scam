<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>

<body>

<h2>🎥 Go Live</h2>

<video id="video" autoplay muted playsinline></video>

<div id="status">Ready...</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null;
let currentUserId = null;
let customStream = null;

// 🎥 Attach camera
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// 👤 Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// 💾 Save stream to DB
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);

  if (error) throw error;
}

// 🧹 Clear stream from DB
async function clearStreamFromDB(userId) {
  const { data, error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId)
    .select();

  if (error) throw error;

  const updated = data[0];
  if (
    updated.is_live === false &&
    updated.videosdk_room_id === null &&
    updated.videosdk_host_token === null &&
    updated.videosdk_viewer_token === null &&
    updated.stream_camera_on === false &&
    updated.stream_mic_on === false
  ) {
    return true;
  } else {
    throw new Error("Database cleanup failed");
  }
}

// 🚀 START STREAM (HD/1080p logic)
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Starting HD stream...";

    const userId = await getUser();
    currentUserId = userId;

    // 1. Force high-res camera track
    customStream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: { ideal: 1920 }, // Try 1080p
        height: { ideal: 1080 },
        frameRate: { ideal: 30 }
      },
      audio: true
    });

    // 2. Create room on backend
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Failed to create stream");

    await saveStreamToDB(userId, data);

    VideoSDK.config(data.hostToken);

    // 3. Init meeting with high-quality settings
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: {
        resolution: "fullhd",
        multiStream: false
      }
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Applying HD Video...";
      stopBtn.disabled = false;

      const videoTrack = customStream.getVideoTracks()[0];
      const audioTrack = customStream.getAudioTracks()[0];

      // Use high-quality custom tracks
      await meeting.localParticipant.enableWebcam(videoTrack);
      await meeting.localParticipant.enableMic(audioTrack);

      if (meeting.localParticipant) {
        attachVideo(meeting.localParticipant);
      }
    });

    meeting.on("participant-joined", participant => {
      if (participant.id === meeting.localParticipant.id) {
        attachVideo(participant);
      }
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// 🛑 STOP STREAM
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";

    const success = await clearStreamFromDB(currentUserId);

    if (success) {
      if (meeting) {
        meeting.leave();
        meeting = null;
      }

      // Stop custom camera tracks
      if (customStream) {
        customStream.getTracks().forEach(track => track.stop());
        customStream = null;
      }

      video.srcObject = null;
      status.textContent = "🛑 Stream Ended";
    }

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }

  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>

</body>
  </html>
