<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { font-family: Arial; text-align: center; margin: 0; background: #f4f4f4; }
  video { width: 100%; height: 55vh; background: black; }
  button, select { padding: 10px; margin: 10px; border-radius: 8px; font-weight: bold; }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #frontCam, #backCam { background: #007bff; color: white; }
  #status { padding: 10px; background: white; margin-bottom: 10px; }
  #uploadProgressOverlay {
    display: none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    color: white; font-size: 20px;
    justify-content: center; align-items: center;
    display: flex;
  }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>

<select id="cameraSelect"></select>
<br>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<button id="frontCam">Front Camera</button>
<button id="backCam">Back Camera</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase setup ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// --- DOM Elements ---
const video = document.getElementById("video");
const status = document.getElementById("status");
const cameraSelect = document.getElementById("cameraSelect");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const frontBtn = document.getElementById("frontCam");
const backBtn = document.getElementById("backCam");
const uploadOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

// --- Global variables ---
let currentStream = null;
let meeting = null;
let currentUserId = null;
let roomIdGlobal = null;
let mediaRecorder = null;
let recordedChunks = [];
let currentCamera = "user"; // front by default

// --- Helper functions ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

async function saveStreamToDB(userId, data) {
  await supabase.from("profile").update({
    is_live: true,
    stream_started_at: new Date().toISOString(),
    videosdk_room_id: data.roomId,
    videosdk_host_token: data.hostToken,
    videosdk_viewer_token: data.viewerToken,
    stream_camera_on: true,
    stream_mic_on: true
  }).eq("id", userId);
}

async function clearStreamFromDB(userId) {
  await supabase.from("profile").update({
    is_live: false,
    stream_ended_at: new Date().toISOString(),
    videosdk_room_id: null,
    videosdk_host_token: null,
    videosdk_viewer_token: null,
    stream_camera_on: false,
    stream_mic_on: false
  }).eq("id", userId);
}

function attachStreamToVideo(stream) {
  video.srcObject = stream;
  video.play();
}

// --- Recording ---
async function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp8,opus" });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start(2000);
}

async function stopRecording() {
  return new Promise(resolve => {
    if (!mediaRecorder) return resolve(null);
    mediaRecorder.onstop = () => resolve(new Blob(recordedChunks, { type: "video/webm" }));
    mediaRecorder.stop();
  });
}

// --- Cameras ---
async function listCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoInputs = devices.filter(d => d.kind === "videoinput");
  cameraSelect.innerHTML = "";
  videoInputs.forEach(cam => {
    const option = document.createElement("option");
    option.value = cam.deviceId;
    option.text = cam.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
  });
}

async function startCamera(deviceIdOrFacing) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  const constraints = deviceIdOrFacing.startsWith("user") || deviceIdOrFacing.startsWith("environment")
    ? { video: { facingMode: deviceIdOrFacing }, audio: true }
    : { video: { deviceId: deviceIdOrFacing }, audio: true };
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  attachStreamToVideo(currentStream);
  return currentStream;
}

async function switchCamera(deviceIdOrFacing) {
  if (!meeting) return;
  const newStream = await startCamera(deviceIdOrFacing);
  await meeting.disableWebcam();
  await meeting.enableWebcam(newStream);
}

// --- Start Stream ---
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");
    roomIdGlobal = data.roomId;

    await VideoSDK.config(data.hostToken);

    const stream = await startCamera(currentCamera);
    await startRecording(stream);

    meeting = VideoSDK.initMeeting({
      meetingId: roomIdGlobal,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: true,
      webcamStream: stream
    });

    await meeting.join();
    status.textContent = "🔴 LIVE";
    stopBtn.disabled = false;

    await saveStreamToDB(currentUserId, data);
  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// --- Stop Stream & Upload ---
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    const recordedBlob = await stopRecording();

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;

    if (recordedBlob) await uploadRecordedVideo(recordedBlob);

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop: " + err.message;
  }
};

// --- Upload Recorded Video to Cloudinary ---
async function uploadRecordedVideo(blob) {
  try {
    status.textContent = "Uploading recorded video...";
    uploadOverlay.style.display = "flex";

    const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

    const formData = new FormData();
    formData.append("file", blob, "recorded-video.webm");
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder", "videos");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
    };

    const uploadPromise = new Promise((resolve, reject) => {
      xhr.onload = () => xhr.status >= 200 && xhr.status < 300
        ? resolve(JSON.parse(xhr.responseText))
        : reject(new Error("Upload failed"));
      xhr.onerror = () => reject(new Error("Upload error"));
      xhr.send(formData);
    });

    const videoData = await uploadPromise;
    await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);

    alert("Video uploaded successfully!");
    window.location.href = "profile.html";

  } catch (err) {
    console.error(err);
    alert("Upload error: " + err.message);
  } finally {
    uploadOverlay.style.display = "none";
  }
}

// --- Camera buttons ---
frontBtn.onclick = () => { currentCamera = "user"; switchCamera(currentCamera); };
backBtn.onclick = () => { currentCamera = "environment"; switchCamera(currentCamera); };

// --- Camera select dropdown ---
cameraSelect.onchange = () => switchCamera(cameraSelect.value);

// --- Init ---
listCameras();
</script>
</body>
  </html>
