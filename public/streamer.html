<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
  #uploadProgressOverlay {
    display:none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    color: white; font-size: 20px;
    justify-content: center; align-items: center;
  }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<select id="cameraSelect"></select>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase setup ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// --- DOM Elements ---
const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

// --- Global variables ---
let meeting = null;
let currentUserId = null;
let currentStream = null;
let roomIdGlobal = null;
let mediaRecorder = null;
let recordedChunks = [];
let isRecordingStopping = false;
let segmentNumber = 1;
const sessionId = crypto.randomUUID(); // unique session for this streaming session

// --- Get current user ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- Attach stream to video ---
function attachStream(stream) {
  video.srcObject = stream;
  video.play();
}

// --- Get cameras ---
async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d => d.kind === "videoinput");
}

// --- Populate camera dropdown ---
async function populateCameraList() {
  const cameras = await getCameras();
  cameraSelect.innerHTML = "";
  let defaultDeviceId = null;
  cameras.forEach(cam => {
    const option = document.createElement("option");
    option.value = cam.deviceId;
    option.text = cam.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
    if (!defaultDeviceId && cam.label.toLowerCase().includes("back")) {
      defaultDeviceId = cam.deviceId;
    }
  });
  cameraSelect.value = defaultDeviceId || (cameras[0] && cameras[0].deviceId);
}

// --- Stop recording and upload chunk ---
async function stopAndUploadRecording(cameraId) {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;

  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      if (recordedChunks.length > 0) {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        recordedChunks = [];

        uploadProgressOverlay.style.display = "flex";

        try {
          // Get Cloudinary signature from backend
          const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

          // Prepare FormData
          const formData = new FormData();
          formData.append("file", blob, `camera-${cameraId}-segment.webm`);
          formData.append("api_key", apiKey);
          formData.append("timestamp", timestamp);
          formData.append("signature", signature);
          formData.append("folder", "videos");

          // Upload using XHR
          const xhr = new XMLHttpRequest();
          xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
          };

          const uploadPromise = new Promise((res, rej) => {
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) res(JSON.parse(xhr.responseText));
              else rej(new Error("Upload failed"));
            };
            xhr.onerror = () => rej(new Error("Upload error"));
            xhr.send(formData);
          });

          const videoData = await uploadPromise;

          // Save to video_segments table
          const { error } = await supabase.from("video_segments").insert([{
            session_id: sessionId,
            segment_number: segmentNumber++,
            camera_id: cameraId,
            user_id: currentUserId,
            video_url: videoData.secure_url,
            public_id: videoData.public_id,
            duration_seconds: blob.size / (1024*1024*2) // rough estimate
          }]);
          if (error) console.error("Error saving video segment:", error);

          console.log("Segment uploaded:", videoData.secure_url);

        } catch (err) {
          console.error("Upload error:", err);
          alert("Upload failed: " + err.message);
        } finally {
          uploadProgressOverlay.style.display = "none";
          resolve();
        }
      } else {
        resolve();
      }
    };
    mediaRecorder.stop();
  });
}

// --- Start recording ---
function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp8,opus" });
  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.start(2000);
}

// --- Switch camera ---
cameraSelect.onchange = async () => {
  const deviceId = cameraSelect.value;

  // Stop current recording and upload first
  await stopAndUploadRecording(deviceId);

  // Stop old stream
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());

  // Start new stream
  currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } }, audio: true });
  attachStream(currentStream);
  startRecording(currentStream);

  if (meeting) {
    await meeting.disableWebcam();
    await meeting.enableWebcam(currentStream);
  }
};

// --- Join meeting ---
async function joinMeeting(stream) {
  meeting = VideoSDK.initMeeting({
    meetingId: roomIdGlobal,
    name: "Host",
    participantId: currentUserId,
    micEnabled: true,
    webcamEnabled: true,
    webcamStream: stream
  });
  await meeting.join();
  meeting.on("meeting-joined", () => {
    status.textContent = "🔴 LIVE";
    startRecording(currentStream);
  });
}

// --- Start streaming ---
startBtn.onclick = async () => {
  startBtn.disabled = true;
  status.textContent = "Authorizing...";
  currentUserId = await getUser();

  const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUserId })
  });
  const data = await res.json();
  if (!data.success) throw new Error("Failed to create room");
  roomIdGlobal = data.roomId;

  await VideoSDK.config(data.hostToken);

  const selectedDeviceId = cameraSelect.value;
  currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedDeviceId } }, audio: true });
  attachStream(currentStream);
  startRecording(currentStream);

  await joinMeeting(currentStream);

  stopBtn.disabled = false;
};

// --- Stop streaming ---
stopBtn.onclick = async () => {
  if (meeting) {
    await meeting.disableWebcam();
    meeting.leave();
    meeting = null;
  }
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());

  video.srcObject = null;
  status.textContent = "🛑 Stream Ended";
  startBtn.disabled = false;
  stopBtn.disabled = true;

  // Stop last recording and upload
  await stopAndUploadRecording(cameraSelect.value);

  // Call merge backend
  const mergeRes = await fetch("/api/video_merge.js", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
  });
  const mergeData = await mergeRes.json();
  if (mergeData.merged_url) {
    alert("✅ Merged video uploaded successfully!");
    console.log("Merged video URL:", mergeData.merged_url);
  } else {
    alert("❌ Merge failed");
  }
};

// --- Initialize camera list ---
populateCameraList();
</script>
</body>
  </html>
