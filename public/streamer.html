<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live with Camera Select</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<select id="cameraSelect"></select>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase setup ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;
let currentStream = null;
let roomIdGlobal = null;

// --- Get current user ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- Attach stream to video ---
function attachStream(stream) {
  video.srcObject = stream;
  video.play();
}

// --- Get available cameras ---
async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d => d.kind === "videoinput");
}

// --- Populate camera dropdown ---
async function populateCameraList() {
  const cameras = await getCameras();
  cameraSelect.innerHTML = "";
  cameras.forEach(cam => {
    const option = document.createElement("option");
    option.value = cam.deviceId;
    option.text = cam.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
  });
}

// --- Start camera with selected device ---
async function startCamera(deviceId) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  currentStream = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: { exact: deviceId } },
    audio: true
  });
  attachStream(currentStream);
  return currentStream;
}

// --- Join meeting ---
async function joinMeeting(stream) {
  meeting = VideoSDK.initMeeting({
    meetingId: roomIdGlobal,
    name: "Host",
    participantId: currentUserId,
    micEnabled: true,
    webcamEnabled: true,
    webcamStream: stream
  });
  await meeting.join();
  meeting.on("meeting-joined", () => status.textContent = "🔴 LIVE");
  meeting.on("meeting-left", () => status.textContent = "Stream ended");
}

// --- Switch camera ---
async function switchCamera(deviceId) {
  if (!meeting) return;
  status.textContent = "Switching camera...";
  const newStream = await startCamera(deviceId);
  if (meeting) {
    await meeting.disableWebcam();
    await meeting.enableWebcam(newStream);
  }
  status.textContent = "🔄 Camera switched";
}

// --- Start streaming ---
startBtn.onclick = async () => {
  startBtn.disabled = true;
  status.textContent = "Authorizing...";
  currentUserId = await getUser();

  const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ userId: currentUserId })
  });
  const data = await res.json();
  if (!data.success) throw new Error("Failed to create room");
  roomIdGlobal = data.roomId;

  await VideoSDK.config(data.hostToken);

  const selectedDeviceId = cameraSelect.value;
  const stream = await startCamera(selectedDeviceId);
  await joinMeeting(stream);

  stopBtn.disabled = false;
};

// --- Stop streaming ---
stopBtn.onclick = async () => {
  if (meeting) {
    await meeting.disableWebcam();
    meeting.leave();
    meeting = null;
  }
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  status.textContent = "🛑 Stream Ended";
  startBtn.disabled = false;
};

// --- Handle camera selection ---
cameraSelect.onchange = () => switchCamera(cameraSelect.value);

// --- Initialize camera list ---
populateCameraList();
</script>
</body>
  </html>
