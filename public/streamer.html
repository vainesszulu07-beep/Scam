<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
video { width: 100%; height: 55vh; background: black; }
button {
  padding: 12px; width: 90%; margin: 10px;
  border: none; border-radius: 8px; font-weight: bold;
}
#start { background: green; color: white; }
#stop { background: red; color: white; }
#status { padding: 10px; background: white; }
#recordingUrl { margin-top: 15px; color: blue; word-break: break-word; }
</style>

</head>
<body>

<h2>🎥 Go Live</h2>

<video id="video" autoplay muted playsinline></video>

<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<div id="recordingUrl"></div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const recordingUrlDiv = document.getElementById("recordingUrl");

let meeting = null;
let currentUserId = null;
let customTrack = null;

// Attach participant video
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const ms = new MediaStream();
      ms.addTrack(stream.track);
      video.srcObject = ms;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Wait for recording to be ready (polling)
async function waitForRecording(roomId, maxAttempts = 20, intervalMs = 3000) {
  for (let i = 0; i < maxAttempts; i++) {
    const res = await fetch("/api/stop-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId })
    });
    const data = await res.json();
    if (data.recordingUrl) return data.recordingUrl;
    await new Promise(r => setTimeout(r, intervalMs));
  }
  throw new Error("Recording not ready after multiple attempts");
}

// START STREAM + SERVER RECORD
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    const userId = await getUser();
    currentUserId = userId;

    // 1️⃣ Create room from backend
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    // 2️⃣ Configure SDK
    await VideoSDK.config(data.hostToken);
    status.textContent = "Setting up camera...";

    // 3️⃣ Start server recording
    await fetch("/api/start-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: data.roomId })
    });

    // 4️⃣ Initialize meeting
    customTrack = await VideoSDK.createCameraVideoTrack({ facingMode: "user" });
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      await meeting.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);
      status.textContent = "🔴 LIVE & Recording";
    });

  } catch (err) {
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// STOP STREAM + SHOW RECORDING URL
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";

    // Stop server recording and wait for recording URL
    const recordingUrl = await waitForRecording(meeting.roomId);
    status.textContent = "Stream stopped!";

    // Display recording URL on page
    recordingUrlDiv.innerHTML = `Recording URL: <a href="${recordingUrl}" target="_blank">${recordingUrl}</a>`;

    // CLEANUP
    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }
    if (customTrack) {
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
      customTrack = null;
    }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
  }
};
</script>

</body>
</html>
