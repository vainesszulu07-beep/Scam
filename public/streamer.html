<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Go Live</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; background: #121212; color: white; text-align: center; }
  video { width: 100%; height: 60vh; background: #000; border-bottom: 2px solid #333; object-fit: contain; }
  .controls { padding: 20px; }
  button {
    padding: 15px; width: 80%; max-width: 300px; margin: 10px;
    border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s;
  }
  #start { background: #00c853; color: white; box-shadow: 0 4px 15px rgba(0,200,83,0.3); }
  #stop { background: #ff1744; color: white; }
  button:disabled { background: #444 !important; color: #888; cursor: not-allowed; box-shadow: none; }
  #status { font-size: 0.9em; color: #aaa; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<div class="controls">
  <button id="start">GO LIVE</button>
  <button id="stop" disabled>END STREAM</button>
  <div id="status">System Ready</div>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null, videoTrack = null, audioTrack = null, currentUserId = null;

function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      video.srcObject = new MediaStream([stream.track]);
      video.play();
      status.innerHTML = "<span style='color:#00c853'>●</span> LIVE - HD ADAPTIVE";
    }
  });
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error("Login required");
    currentUserId = session.user.id;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Room creation failed");

    await VideoSDK.config(data.hostToken);
    status.textContent = "Optimizing for your network...";

    // 🔥 BEST QUALITY + ADAPTIVE SCALING
    videoTrack = await VideoSDK.createCameraVideoTrack({
      encoderConfig: "h1080p_30fps",
      bitrateMode: "high_quality",
      multiStream: true,
      maxLayer: 3
    });

    // 🎤 HIGH QUALITY AUDIO
    audioTrack = await VideoSDK.createMicrophoneAudioTrack({
      encoderConfig: "music_standard",
      noiseConfig: { noiseSuppression: true, echoCancellation: true }
    });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: false,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      while (!meeting.localParticipant) await new Promise(r => setTimeout(r, 100));

      await meeting.enableWebcam(videoTrack);
      await meeting.enableMic(audioTrack);

      meeting.localParticipant.setQuality("high");

      attachVideo(meeting.localParticipant);
      await supabase.from("profile").update({
        is_live: true,
        videosdk_room_id: data.roomId
      }).eq("id", currentUserId);
    });

    meeting.on("error", (err) => {
      status.textContent = "Error: " + err.message;
      startBtn.disabled = false;
    });

  } catch (err) {
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

stopBtn.onclick = async () => {
  status.textContent = "Closing...";
  await supabase.from("profile").update({ is_live: false }).eq("id", currentUserId);
  if (meeting) meeting.leave();
  if (videoTrack) videoTrack.stop();
  if (audioTrack) audioTrack.stop();
  video.srcObject = null;
  status.textContent = "Stream Ended";
  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>
</body>
</html>
