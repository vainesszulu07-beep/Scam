<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream & Recorder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 20px 0;
      color: #333;
    }

    video {
      width: 90%;
      max-width: 800px;
      height: auto;
      background: black;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    #status {
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 15px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      transition: background-color 0.2s;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background-color: #0056b3;
    }

    #uploadProgressOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-size: 1.5em;
      z-index: 1000;
    }

    #progressPercent {
      margin-top: 10px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <h1>Live Stream & Video Recorder</h1>

  <video id="video" autoplay muted playsinline></video>
  <div id="status">⚪ Idle</div>

  <div class="controls">
    <button id="start">Start Stream</button>
    <button id="stop" disabled>Stop Stream</button>
    <button id="frontCam">Front Camera</button>
    <button id="backCam">Back Camera</button>
  </div>

  <div id="uploadProgressOverlay">
    Uploading video...
    <div id="progressPercent">0%</div>
  </div>

  <script type="module">
    // --- Your existing JS code ---
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const frontBtn = document.getElementById("frontCam");
    const backBtn = document.getElementById("backCam");
    const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
    const progressPercent = document.getElementById("progressPercent");

    let meeting = null;
    let currentUserId = null;
    let customTrack = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStream = new MediaStream();
    let videoSenderTrack = null;
    let currentXHR = null;

    function attachVideo(participant) {
      participant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(stream.track);
          video.srcObject = mediaStream;
          video.play();
          status.textContent = "🔴 LIVE";

          if (!videoSenderTrack) {
            recordingStream.addTrack(stream.track);
            videoSenderTrack = stream.track;
            startRecording(recordingStream);
          } else {
            recordingStream.removeTrack(videoSenderTrack);
            recordingStream.addTrack(stream.track);
            videoSenderTrack = stream.track;
          }
        }
      });
    }

    function startRecording(stream) {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: "video/webm;codecs=vp8,opus"
      });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.start(2000);
      console.log("Recording started...");
    }

    async function stopRecording() {
      return new Promise((resolve) => {
        if (!mediaRecorder) return resolve(null);
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: "video/webm" });
          resolve(blob);
        };
        mediaRecorder.stop();
      });
    }

    async function switchCamera(facingMode) {
      try {
        if (!meeting) return;
        status.textContent = `Switching to ${facingMode} camera...`;

        if (customTrack) {
          await meeting.disableWebcam();
          if (typeof customTrack.stop === "function") customTrack.stop();
          if (typeof customTrack.close === "function") customTrack.close();
        }

        customTrack = await VideoSDK.createCameraVideoTrack({
          optimizationMode: "detail",
          encoderConfig: "h1080p_w1920p",
          multiStream: false,
          facingMode
        });

        await meeting.enableWebcam(customTrack);
        attachVideo(meeting.localParticipant);
        status.textContent = `🔄 Switched to ${facingMode} camera`;

      } catch (err) {
        console.error("Camera switch failed:", err);
        status.textContent = `❌ Camera switch error: ${err.message}`;
      }
    }

    frontBtn.onclick = () => switchCamera("user");
    backBtn.onclick = () => switchCamera("environment");

    async function getUser() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("Login required");
      return session.user.id;
    }

    async function saveStreamToDB(userId, data) {
      const { error } = await supabase.from("profile").update({
        is_live: true,
        stream_started_at: new Date().toISOString(),
        videosdk_room_id: data.roomId,
        videosdk_host_token: data.hostToken,
        videosdk_viewer_token: data.viewerToken,
        stream_camera_on: true,
        stream_mic_on: true
      }).eq("id", userId);
      if (error) throw error;
    }

    async function clearStreamFromDB(userId) {
      const { error } = await supabase.from("profile").update({
        is_live: false,
        stream_ended_at: new Date().toISOString(),
        videosdk_room_id: null,
        videosdk_host_token: null,
        videosdk_viewer_token: null,
        stream_camera_on: false,
        stream_mic_on: false
      }).eq("id", userId);
      if (error) throw error;
      return true;
    }

    startBtn.onclick = async () => {
      try {
        startBtn.disabled = true;
        status.textContent = "Authorizing...";
        const userId = await getUser();
        currentUserId = userId;

        const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId })
        });
        const data = await res.json();
        if (!data.success) throw new Error("Failed to create room");

        await VideoSDK.config(data.hostToken);
        status.textContent = "Setting up camera...";

        customTrack = await VideoSDK.createCameraVideoTrack({
          optimizationMode: "detail",
          encoderConfig: "h1080p_w1920p",
          multiStream: false,
          facingMode: "user"
        });

        meeting = VideoSDK.initMeeting({
          meetingId: data.roomId,
          name: "Host",
          participantId: userId,
          micEnabled: true,
          webcamEnabled: false
        });

        meeting.join();

        meeting.on("meeting-joined", async () => {
          status.textContent = "Connecting stream...";
          stopBtn.disabled = false;

          await meeting.enableWebcam(customTrack);
          attachVideo(meeting.localParticipant);

          await saveStreamToDB(userId, data);
        });

        meeting.on("meeting-left", () => {
          video.srcObject = null;
          status.textContent = "Stream ended";
          startBtn.disabled = false;
          stopBtn.disabled = true;
        });

      } catch (err) {
        console.error("Stream Start Error:", err);
        status.textContent = "❌ " + err.message;
        startBtn.disabled = false;
      }
    };

    stopBtn.onclick = async () => {
      try {
        status.textContent = "Stopping stream...";
        await clearStreamFromDB(currentUserId);

        const recordedBlob = await stopRecording();

        if (meeting) {
          await meeting.disableWebcam();
          meeting.leave();
          meeting = null;
        }

        if (customTrack) {
          if (typeof customTrack.stop === "function") customTrack.stop();
          if (typeof customTrack.close === "function") customTrack.close();
          customTrack = null;
        }

        video.srcObject = null;
        status.textContent = "🛑 Stream Ended";
        startBtn.disabled = false;
        stopBtn.disabled = true;

        if (recordedBlob) await uploadRecordedVideo(recordedBlob);

      } catch (err) {
        console.error(err);
        status.textContent = "❌ Failed to stop cleanly: " + err.message;
      }
    };

    async function uploadRecordedVideo(blob) {
      try {
        status.textContent = "Uploading recorded video...";
        uploadProgressOverlay.style.display = "flex";

        if (!navigator.onLine) {
          alert("No internet. Upload may fail.");
        }

        const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

        const formData = new FormData();
        formData.append("file", blob, "recorded-video.webm");
        formData.append("api_key", apiKey);
        formData.append("timestamp", timestamp);
        formData.append("signature", signature);
        formData.append("folder", "videos");

        currentXHR = new XMLHttpRequest();
        currentXHR.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

        currentXHR.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressPercent.textContent = percent + "%";
          }
        };

        const uploadPromise = new Promise((resolve, reject) => {
          currentXHR.onload = () => {
            if (currentXHR.status >= 200 && currentXHR.status < 300)
              resolve(JSON.parse(currentXHR.responseText));
            else reject(new Error("Upload failed"));
          };
          currentXHR.onerror = () => reject(new Error("Upload error"));
          currentXHR.send(formData);
        });

        const videoData = await uploadPromise;

        const { error } = await supabase.from("posts").insert([{
          user_id: currentUserId,
          video_url: videoData.secure_url,
          video_public_id: videoData.public_id
        }]);

        if (error) throw error;

        alert("Video uploaded and saved!");
        window.location.href = "profile.html";

      } catch (err) {
        console.error(err);
        alert("Error uploading video: " + err.message);
      } finally {
        uploadProgressOverlay.style.display = "none";
        currentXHR = null;
      }
    }

  </script>

</body>
</html>
