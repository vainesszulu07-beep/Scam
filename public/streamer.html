<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VideoSDK Auto Room</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
    }
    button {
      padding: 10px;
      margin: 5px 0;
      width: 250px;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h2>Auto Create Your Room + Host Token</h2>

<button id="createBtn">Create My Room</button>

<div id="output"></div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.30.0/dist/supabase.min.js";

  // Initialize Supabase
  const supabaseUrl = "https://eimecuiixwgmpfpedxpr.supabase.co";
  const supabaseKey = "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";
  const supabase = createClient(supabaseUrl, supabaseKey);

  const btn = document.getElementById("createBtn");
  const output = document.getElementById("output");

  btn.onclick = async () => {
    output.innerText = "Getting your user ID from Supabase...";

    try {
      // 1️⃣ Get current session user
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;

      const session = data.session;
      if (!session) throw new Error("No active user session");

      const userId = session.user.id;
      output.innerText = "✅ User ID: " + userId + "\nCreating room...";

      // 2️⃣ Call backend to create room using this userId
      const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId })
      });

      const dataRoom = await res.json();
      if (!dataRoom.success) throw new Error(JSON.stringify(dataRoom));

      // 3️⃣ Display room info
      output.innerText =
        "✅ Room Created!\n\n" +
        "User ID: " + dataRoom.userId + "\n" +
        "Room ID: " + dataRoom.roomId + "\n\n" +
        "Host Token:\n" + dataRoom.hostToken;

      console.log("ROOM ID:", dataRoom.roomId);
      console.log("HOST TOKEN:", dataRoom.hostToken);

    } catch (err) {
      output.innerText = "❌ Error: " + err.message;
      console.error(err);
    }
  };
</script>

</body>
</html>
