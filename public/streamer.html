<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Stream</title>
<style>
  body { font-family: Arial; padding: 20px; background: #f4f4f4; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
  #output { margin-top: 10px; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>🎥 VideoSDK Live Stream</h2>
<video id="video" autoplay muted playsinline></video>
<div>
  <button id="start">Start Stream</button>
  <button id="stop">Stop Stream</button>
</div>
<div id="output">Ready...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Supabase client
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const output = document.getElementById("output");

let stream, pc;

async function getUserSession() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!session) throw new Error("No active session");
  return session.user.id;
}

document.getElementById("start").onclick = async () => {
  try {
    output.textContent = "Getting session...";
    const userId = await getUserSession();
    output.textContent = `✅ Session found! UserID: ${userId}\nCreating room...`;

    // Get room + host token from backend
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error(JSON.stringify(data));

    output.textContent = `✅ Room created!\nRoomID: ${data.roomId}`;

    // Start camera + mic
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    video.srcObject = stream;

    // Setup WebRTC
    pc = new RTCPeerConnection();
    stream.getTracks().forEach(track => pc.addTrack(track, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // Send SDP to VideoSDK
    const sdpResp = await fetch(`https://api.videosdk.live/v2/rooms/${data.roomId}/webrtc`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${data.hostToken}`,
        "Content-Type": "application/sdp"
      },
      body: offer.sdp
    });

    const answer = await sdpResp.text();
    if (!answer.startsWith("v=")) throw new Error("Invalid SDP response:\n" + answer);

    await pc.setRemoteDescription({ type: "answer", sdp: answer });
    output.textContent += "\n✅ LIVE!";
  } catch (err) {
    output.textContent = "❌ ERROR:\n" + err.message;
    console.error(err);
  }
};

document.getElementById("stop").onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (pc) pc.close();
  output.textContent = "🛑 Stopped";
};
</script>

</body>
</html>
