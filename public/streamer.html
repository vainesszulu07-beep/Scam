<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Stream + Recording</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #video-container {
    position: relative;
    width: 80%;
    max-width: 900px;
    margin-top: 20px;
  }
  video {
    width: 100%;
    border-radius: 12px;
    background: black;
  }
  #controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button, select {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover {
    background-color: #ddd;
  }
  #status {
    margin-top: 10px;
    font-size: 14px;
    color: #333;
  }
</style>
</head>
<body>

<h1>Live Stream Recorder</h1>

<div id="video-container">
  <video id="main-video" autoplay muted playsinline></video>
</div>

<div id="controls">
  <button id="start-stream">Start Stream</button>
  <button id="stop-stream">Stop Stream</button>
  <button id="toggle-mic">Mute/Unmute Mic</button>
  <button id="toggle-video">Hide/Show Video</button>
  <select id="camera-select"></select>
</div>

<div id="status">Status: Idle</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase Client ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// --- STATE ---
let meeting = null;
let currentUserId = "user123"; // example ID, replace with actual
let videoTrack = null;
let audioTrack = null;
let currentCameraId = null;
let isMicMuted = false;
let isVideoHidden = false;

let mediaRecorder = null;
let recordedChunks = [];
let segmentNumber = 1;
const sessionId = crypto.randomUUID();
let activeUploads = [];

const videoEl = document.getElementById("main-video");
const cameraSelect = document.getElementById("camera-select");
const statusEl = document.getElementById("status");

// --- RECORDING & UPLOAD ---
function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "video/webm;codecs=vp8,opus",
    videoBitsPerSecond: 2000000,
    audioBitsPerSecond: 128000
  });
  mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.start(2000); // chunk every 2s
}

async function stopAndUpload() {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;

  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      if (recordedChunks.length === 0) return resolve();

      const blob = new Blob(recordedChunks, { type: "video/webm" });
      recordedChunks = [];

      try {
        const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

        const formData = new FormData();
        formData.append("file", blob, `HD-rec-${segmentNumber}.webm`);
        formData.append("api_key", apiKey);
        formData.append("timestamp", timestamp);
        formData.append("signature", signature);
        formData.append("folder", "videos");

        const xhr = new XMLHttpRequest();
        xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

        const uploadPromise = new Promise((res, rej) => {
          xhr.onload = () => (xhr.status < 300 ? res(JSON.parse(xhr.responseText)) : rej(new Error("Upload failed")));
          xhr.onerror = () => rej(new Error("Upload error"));
          xhr.send(formData);
        });

        const trackedUpload = (async () => {
          const videoData = await uploadPromise;
          await supabase.from("video_segments").insert([{
            session_id: sessionId,
            segment_number: segmentNumber++,
            user_id: currentUserId,
            video_url: videoData.secure_url,
            public_id: videoData.public_id
          }]);
          statusEl.innerText = `Uploaded segment ${segmentNumber-1}`;
        })();

        activeUploads.push(trackedUpload);
        await trackedUpload;
      } catch (err) {
        console.error("Upload failed", err);
        statusEl.innerText = "Upload failed";
      } finally { resolve(); }
    };

    mediaRecorder.requestData();
    mediaRecorder.stop();
  });
}

// --- CAMERA SWITCH ---
async function switchCamera(deviceId) {
  currentCameraId = deviceId;
  if (isVideoHidden) return;

  try {
    if (videoTrack) videoTrack.getTracks().forEach(t => t.stop());
    if (mediaRecorder && mediaRecorder.state !== "inactive") await stopAndUpload();

    const newTrack = await window.VideoSDK.createCameraVideoTrack({
      cameraId: deviceId,
      optimizationMode: "motion",
      encoderConfig: "h1080p_w1920p",
      multiStream: true
    });

    await meeting.changeWebcam(newTrack);
    videoTrack = newTrack;

    const combined = new MediaStream([videoTrack.getVideoTracks()[0], audioTrack.getAudioTracks()[0]]);
    videoEl.srcObject = combined;
    startRecording(combined);
  } catch (err) {
    console.error("Switch Failed", err);
    statusEl.innerText = "Camera switch failed";
  }
}

// --- START STREAM ---
async function startStream() {
  statusEl.innerText = "Starting stream...";
  const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId: currentUserId })
  });
  const data = await res.json();

  window.VideoSDK.config(data.hostToken);

  videoTrack = await window.VideoSDK.createCameraVideoTrack({
    optimizationMode: "motion",
    encoderConfig: "h1080p_w1920p",
    facingMode: "user",
    multiStream: true
  });

  currentCameraId = videoTrack.getVideoTracks()[0].getSettings().deviceId;

  audioTrack = await window.VideoSDK.createMicrophoneAudioTrack({
    encoderConfig: "high_quality",
    noiseConfig: { noiseSuppression: true, echoCancellation: true, autoGainControl: true }
  });

  meeting = window.VideoSDK.initMeeting({
    meetingId: data.roomId,
    name: "Host",
    participantId: currentUserId,
    micEnabled: true,
    webcamEnabled: true,
    customCameraVideoTrack: videoTrack,
    customMicrophoneAudioTrack: audioTrack
  });

  await meeting.join();

  const combined = new MediaStream([videoTrack.getVideoTracks()[0], audioTrack.getAudioTracks()[0]]);
  videoEl.srcObject = combined;
  startRecording(combined);

  await supabase.from("profile").update({
    is_live: true,
    stream_started_at: new Date().toISOString(),
    videosdk_room_id: data.roomId,
    stream_camera_on: true,
    stream_mic_on: true
  }).eq("id", currentUserId);

  statusEl.innerText = "Live streaming...";
}

// --- STOP STREAM ---
async function stopStream() {
  statusEl.innerText = "Stopping stream...";
  if (mediaRecorder && mediaRecorder.state !== "inactive") await stopAndUpload();

  if (meeting) meeting.leave();
  if (videoTrack) videoTrack.getTracks().forEach(t => t.stop());
  if (audioTrack) audioTrack.getTracks().forEach(t => t.stop());

  await Promise.all(activeUploads);

  await supabase.from("profile").update({
    is_live: false,
    stream_ended_at: new Date().toISOString(),
    videosdk_room_id: null,
    stream_camera_on: false,
    stream_mic_on: false
  }).eq("id", currentUserId);

  try {
    const mergeRes = await fetch("/api/video_merge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
    });
    const mergeData = await mergeRes.json();
    statusEl.innerText = mergeData.merged_url ? "✅ Merged successfully!" : "❌ Merge failed";
  } catch (err) {
    console.error(err);
    statusEl.innerText = "❌ Merge failed";
  }
}

// --- MUTE/UNMUTE ---
async function toggleMic() {
  if (!meeting) return;
  if (isMicMuted) await meeting.unmuteMic();
  else await meeting.muteMic();
  isMicMuted = !isMicMuted;
}

// --- VIDEO VISIBILITY ---
function toggleVideoVisibility() {
  isVideoHidden = !isVideoHidden;
  if (videoEl.srcObject) videoEl.srcObject.getVideoTracks()[0].enabled = !isVideoHidden;
}

// --- GET CAMERA LIST ---
async function populateCameraList() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  cameraSelect.innerHTML = "";
  devices.filter(d => d.kind === "videoinput").forEach(d => {
    const option = document.createElement("option");
    option.value = d.deviceId;
    option.innerText = d.label || `Camera ${cameraSelect.length + 1}`;
    cameraSelect.appendChild(option);
  });
}

// --- EVENT LISTENERS ---
document.getElementById("start-stream").addEventListener("click", startStream);
document.getElementById("stop-stream").addEventListener("click", stopStream);
document.getElementById("toggle-mic").addEventListener("click", toggleMic);
document.getElementById("toggle-video").addEventListener("click", toggleVideoVisibility);
cameraSelect.addEventListener("change", e => switchCamera(e.target.value));

populateCameraList();

</script>
</body>
  </html>
