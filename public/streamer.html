<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Adaptive HD Stream</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #121212; color: white; text-align: center; }
  video { width: 100%; height: 55vh; background: #000; object-fit: contain; }
    
  .quality-container { padding: 10px; background: #1e1e1e; border-bottom: 1px solid #333; }
  #quality-bar { height: 8px; width: 100%; background: #444; border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
  #quality-fill { height: 100%; width: 0%; background: #ff1744; transition: 0.5s ease; }
  #quality-label { font-size: 12px; font-weight: bold; text-transform: uppercase; }

  .controls { padding: 20px; }
  button {
    padding: 15px; width: 80%; max-width: 300px; border: none; border-radius: 50px;   
    font-weight: bold; cursor: pointer; transition: 0.3s;
  }
  #start { background: #00c853; color: white; }
  #stop { background: #ff1744; color: white; margin-top: 10px; }
  button:disabled { background: #444; color: #888; }
</style>
</head>
<body>

<div class="quality-container">
  <div id="quality-bar"><div id="quality-fill"></div></div>
  <div id="quality-label">SIGNAL: READY</div>
</div>

<video id="video" autoplay muted playsinline></video>

<div class="controls">
  <button id="start">GO LIVE (SMOOTH HD)</button>
  <button id="stop" disabled>END STREAM</button>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const qualityFill = document.getElementById("quality-fill");
const qualityLabel = document.getElementById("quality-label");

let meeting = null, videoTrack = null, audioTrack = null, currentUserId = null;

function updateQualityUI(quality) {
  const levels = {   
    'high': { width: '100%', color: '#00c853', text: 'SIGNAL: EXCELLENT (HD+)' },
    'medium': { width: '66%', color: '#ffea00', text: 'SIGNAL: GOOD (720P)' },
    'low': { width: '33%', color: '#ff1744', text: 'SIGNAL: POOR (SD)' }
  };
  const config = levels[quality] || levels['low'];
  qualityFill.style.width = config.width;
  qualityFill.style.background = config.color;
  qualityLabel.textContent = config.text;
  qualityLabel.style.color = config.color;
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    qualityLabel.textContent = "AUTHORIZING...";
    
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error("Login required");
    currentUserId = session.user.id;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();

    await VideoSDK.config(data.hostToken);

    // ✅ FIX: "Motion" mode stops the lag, 720p base is more stable for "Searching"
    videoTrack = await VideoSDK.createCameraVideoTrack({
      encoderConfig: "h720p_30fps", 
      optimizationMode: "motion", // Prioritizes smooth movement over static detail
      multiStream: true,          // Allows searching for 1080p if net is great
      maxLayer: 2                 // Switches faster between 720p and 360p
    });

    audioTrack = await VideoSDK.createMicrophoneAudioTrack({ 
      encoderConfig: "high_quality" 
    });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: false,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      qualityLabel.textContent = "SEARCHING FOR BEST SIGNAL...";
      
      while (!meeting.localParticipant) await new Promise(r => setTimeout(r, 100));

      // Enable tracks
      await meeting.enableWebcam(videoTrack);
      await meeting.enableMic(audioTrack);

      // ✅ FIX: Listen for real-time quality changes to update the bar
      meeting.localParticipant.on("video-quality-changed", (quality) => {
        updateQualityUI(quality);
      });

      meeting.localParticipant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          video.srcObject = new MediaStream([stream.track]);
          // Use "balanced" to start; the SDK will push to "high" automatically if it can
          meeting.localParticipant.setQuality("balanced");   
          updateQualityUI("medium");
        }
      });

      await supabase.from("profile").update({ 
        is_live: true, 
        videosdk_room_id: data.roomId 
      }).eq("id", currentUserId);
    });

    meeting.on("error", (err) => {
      qualityLabel.textContent = "❌ ERROR: " + err.message;
      startBtn.disabled = false;
    });

  } catch (err) {
    qualityLabel.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

stopBtn.onclick = async () => {
  qualityLabel.textContent = "STOPPING...";
  await supabase.from("profile").update({ is_live: false }).eq("id", currentUserId);
  if (meeting) meeting.leave();
  if (videoTrack) videoTrack.stop();
  if (audioTrack) audioTrack.stop();
  video.srcObject = null;
  qualityLabel.textContent = "STREAM ENDED";
  qualityFill.style.width = "0%";
  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>
</body>
</html>
