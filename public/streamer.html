<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; margin-bottom: 10px; transition: opacity 0.3s ease; }
  button, select { padding: 12px; width: 90%; margin: 10px; border: none; border-radius: 8px; font-weight: bold; }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #cameraSelect { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>

<body>

<h2>🎥 Go Live</h2>

<video id="video" autoplay muted playsinline></video>

<div id="status">Ready...</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<select id="cameraSelect">
  <option>Loading cameras...</option>
</select>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;

// Attach video stream
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      video.style.opacity = "1";
      status.textContent = "🔴 LIVE";
    }
  });
}

// Get user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Load cameras (FIXED PROPERLY)
async function loadCameras() {
  try {
    // Force permission
    await navigator.mediaDevices.getUserMedia({ video: true });

    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");

    cameraSelect.innerHTML = "";

    if (!cameras.length) {
      cameraSelect.innerHTML = "<option>No cameras found</option>";
      return;
    }

    cameras.forEach((cam, index) => {
      const option = document.createElement("option");
      option.value = cam.deviceId;
      option.textContent = cam.label || `Camera ${index + 1}`;
      cameraSelect.appendChild(option);
    });

  } catch (err) {
    console.error(err);
    cameraSelect.innerHTML = "<option>Permission denied</option>";
  }
}

// START STREAM
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Room failed");

    await VideoSDK.config(data.hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: true
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;

      attachVideo(meeting.localParticipant);

      await loadCameras();
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// STOP STREAM
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping...";

    if (meeting) {
      meeting.leave();
      meeting = null;
    }

    video.srcObject = null;

    startBtn.disabled = false;
    stopBtn.disabled = true;
    status.textContent = "🛑 Stopped";

  } catch (err) {
    status.textContent = "❌ " + err.message;
  }
};

// SWITCH CAMERA (NO BLACK SCREEN VERSION)
cameraSelect.addEventListener("change", async (e) => {
  const selectedId = e.target.value;

  if (meeting && selectedId) {
    try {
      status.textContent = "Switching camera...";

      // Fade instead of black screen
      video.style.opacity = "0.3";

      await meeting.changeWebcam(selectedId);

      // Wait for REAL new stream
      let tries = 0;

      const waitForStream = setInterval(() => {
        const stream = meeting.localParticipant.streams.get("video");

        if (stream && stream.track.readyState === "live") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(stream.track);

          video.srcObject = mediaStream;
          video.play();

          video.style.opacity = "1";
          status.textContent = "🔴 LIVE";

          clearInterval(waitForStream);
        }

        tries++;
        if (tries > 20) {
          clearInterval(waitForStream);
          video.style.opacity = "1";
          status.textContent = "⚠️ Slow camera switch";
        }

      }, 100);

    } catch (err) {
      console.error(err);
      video.style.opacity = "1";
      status.textContent = "❌ Switch failed";
    }
  }
});
</script>

</body>
  </html>
