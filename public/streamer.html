<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer</title>

<style>
  body {
    font-family: system-ui;
    padding: 20px;
    background: #f0f2f5;
  }

  video {
    width: 100%;
    height: 60vh;
    background: black;
    margin-bottom: 10px;
  }

  button {
    padding: 10px 16px;
    margin-right: 6px;
    cursor: pointer;
  }

  #msg {
    white-space: pre-wrap;
    background: #fff;
    padding: 10px;
    border-radius: 6px;
  }
</style>
</head>

<body>

<h2>Streamer</h2>

<video id="localVideo" autoplay muted playsinline></video>

<div id="msg">Initializing...</div>

<button id="startBtn">Start Stream</button>
<button id="stopBtn">Stop Stream</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 🔥 CHANGE THIS TO YOUR BACKEND
const BACKEND_URL = "https://scamming-lg3v.onrender.com";

// Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const videoEl = document.getElementById("localVideo");
const msgEl = document.getElementById("msg");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let localStream;
let pc;

// ==========================
// GET USER SESSION
// ==========================
const { data: { session } } = await supabase.auth.getSession();

if (!session) {
  msgEl.textContent = "You must be logged in.";
  startBtn.disabled = true;
  throw new Error("No session");
}

const userId = session.user.id;

// ==========================
// START STREAM
// ==========================
startBtn.onclick = async () => {
  try {
    msgEl.textContent = "Starting stream...";

    // 1. Camera + mic
    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    videoEl.srcObject = localStream;

    // 2. Create room
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ userId })
    });

    const data = await resp.json();

    if (!data.success) {
      console.error("BACKEND ERROR:", data);
      throw new Error(data.error || JSON.stringify(data));
    }

    const { roomId, hostToken } = data;

    msgEl.textContent = `Room created: ${roomId}`;

    // 3. WebRTC
    pc = new RTCPeerConnection();

    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // 4. Send SDP to VideoSDK
    const sdpResp = await fetch(
      `https://api.videosdk.live/v2/rooms/${roomId}/webrtc`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${hostToken}`,
          "Content-Type": "application/sdp"
        },
        body: offer.sdp
      }
    );

    const answerSdp = await sdpResp.text();

    console.log("VideoSDK RAW RESPONSE:", answerSdp);

    // ❌ Catch HTML errors
    if (!answerSdp.startsWith("v=")) {
      throw new Error("Invalid SDP received:\n\n" + answerSdp);
    }

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerSdp
    });

    msgEl.textContent += "\n\n✅ Streaming started successfully";

  } catch (err) {
    console.error("STREAM ERROR:", err);
    msgEl.textContent = "❌ ERROR:\n\n" + err.message;
  }
};

// ==========================
// STOP STREAM
// ==========================
stopBtn.onclick = async () => {
  try {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
    }

    if (pc) pc.close();

    const resp = await fetch(`${BACKEND_URL}/api/stop-stream`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ userId })
    });

    const data = await resp.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    msgEl.textContent = "🛑 Stream stopped";

  } catch (err) {
    console.error(err);
    msgEl.textContent = "Stop error:\n" + err.message;
  }
};
</script>

</body>
  </html>
