<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoSDK Live Stream</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: #f4f4f4;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    video {
      width: 100%;
      height: 55vh;
      background: black;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #start { background: #007bff; color: white; }
    #stop { background: #dc3545; color: white; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #output {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎥 VideoSDK Live Stream</h2>
  <video id="videoElement" autoplay muted playsinline></video>
  
  <div class="controls">
    <button id="start">Start Stream</button>
    <button id="stop" disabled>Stop Stream</button>
  </div>
  
  <div id="output">Ready...</div>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://eimecuiixwgmpfpedxpr.supabase.co",
    "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
  );

  const video = document.getElementById("videoElement");
  const output = document.getElementById("output");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");

  let meeting = null;

  async function getUserSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error("❌ Please log in first.");
    return session.user.id;
  }

  startBtn.onclick = async () => {
    try {
      startBtn.disabled = true;
      output.textContent = "🎬 Opening Camera...";

      // 1️⃣ Native preview (instant)
      const nativeStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 1280, height: 720 },
        audio: true
      });
      video.srcObject = nativeStream;
      output.textContent = "✅ Camera Ready. Connecting...";

      // Stop native stream before SDK takes over
      nativeStream.getTracks().forEach(track => track.stop());

      // 2️⃣ Backend call to create room
      const userId = await getUserSession();
      const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId })
      });
      const data = await res.json();
      if (!data.success) throw new Error("Backend error");

      output.textContent += "\n✅ Room ready. Initializing VideoSDK...";

      // 3️⃣ Initialize VideoSDK meeting (SDK handles camera)
      VideoSDK.config(data.hostToken);
      meeting = VideoSDK.initMeeting({
        meetingId: data.roomId,
        name: "Host",
        micEnabled: true,
        webcamEnabled: true // SDK will request camera
      });

      meeting.join();

      meeting.on("meeting-joined", () => {
        output.textContent += "\n🎥 LIVE! Streaming...";
        stopBtn.disabled = false;
      });

      meeting.on("meeting-left", () => {
        output.textContent = "🛑 Stream Ended.";
        startBtn.disabled = false;
        stopBtn.disabled = true;
        video.srcObject = null;
      });

    } catch (err) {
      output.textContent = "❌ " + err.message;
      startBtn.disabled = false;
      console.error(err);
    }
  };

  stopBtn.onclick = () => {
    if (meeting) meeting.leave();
    video.srcObject = null;
    output.textContent += "\n🛑 Stream manually stopped.";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  };
</script>

</body>
</html>
