<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoSDK Room Creator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    input, button { padding: 10px; margin: 5px 0; font-size: 16px; }
    #output { margin-top: 20px; padding: 10px; background: #fff; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>VideoSDK Room Creator</h2>
  <label for="userId">User ID:</label><br>
  <input type="text" id="userId" placeholder="Enter your user ID" /><br>
  <button id="createRoomBtn">Create Room</button>

  <div id="output"></div>

  <script>
    const createBtn = document.getElementById('createRoomBtn');
    const output = document.getElementById('output');

    createBtn.addEventListener('click', async () => {
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert("Please enter a user ID");
        return;
      }

      output.innerHTML = "Creating room...";

      try {
        const res = await fetch('https://scamming-lg3v.onrender.com/api/create-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await res.json();

        if (!data.success) {
          output.innerHTML = `<strong>Error:</strong> ${data.error}<br><pre>${JSON.stringify(data.raw || {}, null, 2)}</pre>`;
          return;
        }

        output.innerHTML = `
          <strong>Room Created!</strong><br>
          User ID: ${data.userId} <br>
          Room ID: ${data.roomId} <br>
          Server Token: <code>${data.serverToken}</code>
        `;

      } catch (err) {
        output.innerHTML = `<strong>Unexpected Error:</strong> ${err.message}`;
      }
    });
  </script>
</body>
</html>
