<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoSDK Host - Cloudinary Upload</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        #video-container { position: relative; width: 100%; max-width: 800px; margin: auto; background: black; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; display: block; object-fit: contain; }
        #status { padding: 10px; font-weight: bold; }
        .controls { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        #start { background: #4caf50; } #stop { background: #f44336; }
        .action-btn { background: #333; display: none; }
        #uploadProgressOverlay {
            display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            justify-content: center; align-items: center; z-index: 10; font-size: 1.2rem;
        }
        #brb-overlay { display: none; position: absolute; inset: 0; background: black; justify-content: center; align-items: center; z-index: 5; }
        #camListOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
        #camItemsContainer { background: #222; padding: 20px; border-radius: 10px; }
        .cam-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; }
    </style>
</head>
<body>

<div id="status">Connecting...</div>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="brb-overlay">BRB</div>
    <div id="uploadProgressOverlay">Uploading: <span id="progressPercent">0%</span></div>
</div>

<div class="controls">
    <button id="start" disabled>START</button>
    <button id="stop" disabled>STOP</button>
    <button id="switch" class="action-btn">Switch Cam</button>
    <button id="mute" class="action-btn">Mute</button>
    <button id="brb" class="action-btn">BRB</button>
</div>

<div id="camListOverlay"><div id="camItemsContainer"></div></div>

<script src="https://jsdelivr.net"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// UI Elements
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const switchBtn = document.getElementById("switch");
const muteBtn = document.getElementById("mute");
const brbBtn = document.getElementById("brb");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");
const brbOverlay = document.getElementById("brb-overlay");
const camListOverlay = document.getElementById("camListOverlay");
const camItemsContainer = document.getElementById("camItemsContainer");

// State
let meeting = null;
let currentUserId = null;
let videoTrack = null; 
let audioTrack = null;
let mediaRecorder = null;
let recordedChunks = [];
let segmentNumber = 1;
const sessionId = crypto.randomUUID();
let currentCameraId = null;
let isMicMuted = false;
let isVideoHidden = false;

window.onload = () => { if (window.VideoSDK) { statusEl.textContent = "✅ Ready"; startBtn.disabled = false; } };

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- EXACT UPLOAD LOGIC FROM YOUR CODE ---
function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start(2000); // 2-second buffer checks
}

async function stopAndUploadRecording(cameraId) {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;

  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      if (recordedChunks.length > 0) {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        recordedChunks = [];
        uploadProgressOverlay.style.display = "flex";

        try {
          const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());
          const formData = new FormData();
          formData.append("file", blob, `camera-${cameraId}-segment.webm`);
          formData.append("api_key", apiKey);
          formData.append("timestamp", timestamp);
          formData.append("signature", signature);
          formData.append("folder", "videos");

          const xhr = new XMLHttpRequest();
          xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
          };

          const uploadPromise = new Promise((res, rej) => {
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) res(JSON.parse(xhr.responseText));
              else rej(new Error("Upload failed"));
            };
            xhr.onerror = () => rej(new Error("Upload error"));
            xhr.send(formData);
          });

          const videoData = await uploadPromise;

          await supabase.from("video_segments").insert([{
            session_id: sessionId,
            segment_number: segmentNumber++,
            camera_id: cameraId,
            user_id: currentUserId,
            video_url: videoData.secure_url,
            public_id: videoData.public_id
          }]);

        } catch (err) { console.error("Upload failed: ", err); } 
        finally { uploadProgressOverlay.style.display = "none"; resolve(); }
      } else resolve();
    };
    mediaRecorder.stop();
  });
}

// --- START ---
startBtn.onclick = async () => {
  startBtn.disabled = true;
  try {
    currentUserId = await getUser();
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    
    window.VideoSDK.config(data.hostToken);

    videoTrack = await window.VideoSDK.createCameraVideoTrack({ encoderConfig: "h1080p_w1920p", facingMode: "user" });
    audioTrack = await window.VideoSDK.createMicrophoneAudioTrack({ encoderConfig: "high_quality" });
    currentCameraId = videoTrack.getVideoTracks()[0].getSettings().deviceId;

    meeting = window.VideoSDK.initMeeting({
      meetingId: data.roomId, name: "Host", participantId: currentUserId,
      webcamEnabled: true, customCameraVideoTrack: videoTrack, customMicrophoneAudioTrack: audioTrack
    });

    meeting.join();
    meeting.on("meeting-joined", async () => {
      statusEl.textContent = "🔴 LIVE";
      stopBtn.disabled = false;
      [switchBtn, muteBtn, brbBtn].forEach(b => b.style.display = "inline-block");

      const stream = new MediaStream([videoTrack.getVideoTracks()[0], audioTrack.getAudioTracks()[0]]);
      video.srcObject = stream;
      startRecording(stream);

      await supabase.from("profile").update({ is_live: true, videosdk_room_id: data.roomId }).eq("id", currentUserId);
    });
  } catch (err) { alert(err.message); startBtn.disabled = false; }
};

// --- CAMERA SWITCH ---
switchBtn.onclick = async () => {
  const cameras = await window.VideoSDK.getCameras();
  camItemsContainer.innerHTML = "";
  cameras.forEach(cam => {
    const btn = document.createElement("div");
    btn.className = "cam-item";
    btn.textContent = cam.label || `Camera ${cam.deviceId.substring(0,5)}`;
    btn.onclick = () => changeCamera(cam.deviceId);
    camItemsContainer.appendChild(btn);
  });
  camListOverlay.style.display = "flex";
};

async function changeCamera(deviceId) {
  camListOverlay.style.display = "none";
  statusEl.textContent = "Switching...";

  // 1. Stop and Upload current recording before switch
  await stopAndUploadRecording(currentCameraId);

  try {
    const newTrack = await window.VideoSDK.createCameraVideoTrack({ cameraId: deviceId, encoderConfig: "h1080p_w1920p" });
    await meeting.changeWebcam(newTrack);
    
    videoTrack = newTrack;
    currentCameraId = deviceId;
    const stream = new MediaStream([videoTrack.getVideoTracks()[0], audioTrack.getAudioTracks()[0]]);
    video.srcObject = stream;

    // 2. Restart recording with new camera
    startRecording(stream);
    statusEl.textContent = "🔴 LIVE";
  } catch (err) { statusEl.textContent = "❌ Error"; }
}

// --- STOP ---
stopBtn.onclick = async () => {
  stopBtn.disabled = true;
  statusEl.textContent = "Finalizing...";

  // 1. Stop and upload final segment
  await stopAndUploadRecording(currentCameraId);

  if (meeting) meeting.leave();
  video.srcObject = null;
  statusEl.textContent = "🛑 Ended";

  await supabase.from("profile").update({ is_live: false }).eq("id", currentUserId);

  // 2. Trigger Merge and Success Message
  const mergeRes = await fetch("/api/video_merge", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
  });
  const mergeData = await mergeRes.json();
  
  if (mergeData.merged_url) alert("✅ Merged video uploaded successfully!");
  else alert("❌ Merge failed");

  startBtn.disabled = false;
  [switchBtn, muteBtn, brbBtn].forEach(b => b.style.display = "none");
};

// Utilities
muteBtn.onclick = () => { isMicMuted ? meeting.unmuteMic() : meeting.muteMic(); isMicMuted = !isMicMuted; muteBtn.textContent = isMicMuted ? "Unmute" : "Mute"; };
brbBtn.onclick = () => { if(isVideoHidden){ meeting.enableWebcam(); brbOverlay.style.display="none"; } else { meeting.disableWebcam(); brbOverlay.style.display="flex"; } isVideoHidden = !isVideoHidden; };
</script>
</body>
</html>
