<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live with Camera Switch</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #cameraSelect { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<select id="cameraSelect">
  <option value="">Select Camera</option>
</select>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;
let customTrack = null;

// --- Attach video ---
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// --- Get user ---
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// --- Save/Clear stream in Supabase ---
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

async function clearStreamFromDB(userId) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId);
  if (error) throw error;
}

// --- Populate camera dropdown ---
async function populateCameraDropdown() {
  try {
    // Trigger permissions
    if (!customTrack) customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "motion" });

    const cameras = await VideoSDK.getCameras(); // Get available cameras
    cameraSelect.innerHTML = '<option value="">Select Camera</option>';
    cameras.forEach(cam => {
      const opt = document.createElement("option");
      opt.value = cam.deviceId; // store deviceId
      opt.textContent = cam.label || `Camera ${cam.deviceId}`;
      cameraSelect.appendChild(opt);
    });
  } catch (err) {
    console.error("Failed to get cameras:", err);
  }
}

// --- Switch camera ---
async function switchCamera(deviceId) {
  if (!meeting || !customTrack || !deviceId) return;
  try {
    // Using custom track (recommended if you want advanced control)
    const newTrack = await VideoSDK.createCameraVideoTrack({
      cameraId: deviceId, // deviceId from selection
      optimizationMode: "motion"
    });
    await meeting.disableWebcam();         // stop old track in meeting
    await meeting.changeWebcam(newTrack);  // swap to new track live
    customTrack.stop();
    customTrack = newTrack;                // update reference
    console.log("✅ Camera switched:", deviceId);
  } catch (err) {
    console.error("Camera switch failed:", err);
  }
}

// --- START STREAM ---
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);
    status.textContent = "Setting up camera...";

    // Trigger permissions & populate dropdown
    if (!customTrack) customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "motion" });
    await populateCameraDropdown();

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;

      let waited = 0;
      while (!meeting.localParticipant && waited < 5000) {
        await new Promise(r => setTimeout(r, 50));
        waited += 50;
      }
      if (!meeting.localParticipant) throw new Error("Local participant not ready");

      try { await meeting.enableWebcam(customTrack); }
      catch (err) { status.textContent = "❌ Camera Error"; return; }

      attachVideo(meeting.localParticipant);
      await saveStreamToDB(currentUserId, data);
    });

    meeting.on("participant-joined", (participant) => {
      if (participant.id === meeting.localParticipant.id) attachVideo(participant);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", (err) => {
      console.error("SDK Error:", err);
      status.textContent = "❌ Connection error";
    });

  } catch (err) {
    console.error("Stream Start Error:", err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// --- STOP STREAM ---
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      customTrack.stop();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }
};

// --- Camera selection ---
cameraSelect.onchange = (e) => switchCamera(e.target.value);

</script>
</body>
  </html>
