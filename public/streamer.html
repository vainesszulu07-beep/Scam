<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null;
let currentUserId = null;
let customTrack = null;

// 🎥 Attach video track to local video element
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// 👤 Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// 💾 Save stream to Supabase DB
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

// 🧹 Clear stream from Supabase DB
async function clearStreamFromDB(userId) {
  const { data, error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId)
    .select();
  if (error) throw error;
  return true;
}

// 🚀 START STREAM (HD/1080p fallback to 720p)
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    const userId = await getUser();
    currentUserId = userId;

    // 1. Get room data from backend
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    // 2. Configure SDK BEFORE creating track
    await VideoSDK.config(data.hostToken);

    status.textContent = "Setting up HD Camera...";

    // 3. Create custom video track (1080p if possible, fallback 720p)
    try {
      customTrack = await VideoSDK.createCameraVideoTrack({
        optimizationMode: "detail",
        encoderConfig: "h1080p_w1920p",
        multiStream: false
      });
    } catch {
      console.warn("Falling back to 720p for stability");
      customTrack = await VideoSDK.createCameraVideoTrack({
        optimizationMode: "detail",
        encoderConfig: "h720p_w1280p",
        multiStream: false
      });
    }

    // 4. Initialize meeting (mic enabled automatically)
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: false // attach manually
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;

      // Wait for localParticipant to exist
      while (!meeting.localParticipant) await new Promise(r => setTimeout(r, 50));

      // Attach video track
      await meeting.localParticipant.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);

      // Save stream info in Supabase
      await saveStreamToDB(userId, data);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", (err) => {
      console.error("SDK Error:", err);
      status.textContent = "❌ Connection error";
    });

  } catch (err) {
    console.error("Stream Start Error:", err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// 🛑 STOP STREAM
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    if (meeting) {
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      customTrack.stop();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }
};
</script>

</body>
  </html>
