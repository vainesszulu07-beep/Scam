<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
video { width: 100%; height: 55vh; background: black; }
button {
  padding: 12px; width: 90%; margin: 10px;
  border: none; border-radius: 8px; font-weight: bold;
}
#start { background: green; color: white; }
#stop { background: red; color: white; }
#status { padding: 10px; background: white; }
#uploadProgressOverlay {
  display:none;
  position: fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  color:white; font-size:20px;
  justify-content:center; align-items:center;
}
</style>

</head>
<body>

<h2>🎥 Go Live</h2>

<video id="video" autoplay muted playsinline></video>

<div id="status">Ready...</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<div id="uploadProgressOverlay">
  Uploading: <span id="progressPercent">0%</span>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

let meeting = null;
let currentUserId = null;
let customTrack = null;
let currentXHR = null;

// Attach participant video
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const ms = new MediaStream();
      ms.addTrack(stream.track);
      video.srcObject = ms;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Wait for recording to be ready (polling)
async function waitForRecording(roomId, maxAttempts = 20, intervalMs = 3000) {
  for (let i = 0; i < maxAttempts; i++) {
    const res = await fetch("/api/stop-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId })
    });
    const data = await res.json();
    if (data.recordingUrl) return data.recordingUrl;
    await new Promise(r => setTimeout(r, intervalMs));
  }
  throw new Error("Recording not ready after multiple attempts");
}

// START STREAM + SERVER RECORD
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    const userId = await getUser();
    currentUserId = userId;

    // 1️⃣ Create room from backend
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    // 2️⃣ Configure SDK
    await VideoSDK.config(data.hostToken);
    status.textContent = "Setting up camera...";

    // 3️⃣ Start server recording
    await fetch("/api/start-recording", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomId: data.roomId })
    });

    // 4️⃣ Initialize meeting
    customTrack = await VideoSDK.createCameraVideoTrack({ facingMode: "user" });
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: false
    });
    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      await meeting.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);
      status.textContent = "🔴 LIVE & Recording";
    });

  } catch (err) {
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// STOP STREAM + CLOUDINARY UPLOAD
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";

    // 1️⃣ Stop server recording and wait for recording URL
    const recordingUrl = await waitForRecording(meeting.roomId);
    status.textContent = "Recording ready, uploading...";
    uploadProgressOverlay.style.display = "flex";
    progressPercent.textContent = "0%";

    // 2️⃣ Download recording blob
    const videoRes = await fetch(recordingUrl);
    const blob = await videoRes.blob();

    // 3️⃣ Get Cloudinary signature
    const sig = await fetch("/api/video.js").then(r => r.json());

    const formData = new FormData();
    formData.append("file", blob);
    formData.append("api_key", sig.apiKey);
    formData.append("timestamp", sig.timestamp);
    formData.append("signature", sig.signature);
    formData.append("folder", "videos");

    // 4️⃣ Upload using XHR to track progress
    currentXHR = new XMLHttpRequest();
    currentXHR.open("POST", `https://api.cloudinary.com/v1_1/${sig.cloudName}/video/upload`);
    currentXHR.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const percent = Math.round((e.loaded / e.total) * 100);
        progressPercent.textContent = percent + "%";
      }
    };

    const uploadPromise = new Promise((resolve, reject) => {
      currentXHR.onload = () => {
        if (currentXHR.status >= 200 && currentXHR.status < 300)
          resolve(JSON.parse(currentXHR.responseText));
        else reject(new Error("Upload failed"));
      };
      currentXHR.onerror = () => reject(new Error("Upload error"));
      currentXHR.send(formData);
    });

    const videoData = await uploadPromise;

    // 5️⃣ Save to Supabase
    const { error } = await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);
    if (error) throw error;

    status.textContent = "✅ Uploaded!";
    alert("Video uploaded and saved to posts table!");

    // CLEANUP
    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }
    if (customTrack) {
      if (typeof customTrack.stop === "function") customTrack.stop();
      if (typeof customTrack.close === "function") customTrack.close();
      customTrack = null;
    }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    uploadProgressOverlay.style.display = "none";
    currentXHR = null;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    uploadProgressOverlay.style.display = "none";
    currentXHR = null;
  }
};
</script>

</body>
  </html>
