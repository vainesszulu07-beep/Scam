<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Live</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    video {
      width: 100%;
      height: 55vh;
      background: black;
      object-fit: contain;
    }

    button, select {
      padding: 12px;
      width: 90%;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    #start { background: green; color: white; }
    #stop { background: red; color: white; }
    #frontCam, #backCam { background: #007bff; color: white; }
    #status { padding: 10px; background: white; }

    #uploadProgressOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 20px;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      flex-direction: column;
      gap: 10px;
    }

    #camListOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    #camListContent {
      background: white;
      width: 80%;
      max-width: 400px;
      padding: 20px;
      border-radius: 12px;
    }

    .cam-item {
      padding: 15px;
      margin: 5px 0;
      background: #eee;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
    }
  </style>
</head>
<body>

  <h2>🎥 Go Live</h2>
  <video id="video" autoplay muted playsinline></video>

  <div id="status">Ready...</div>

  <select id="cameraSelect"></select>

  <button id="start">Start Stream</button>
  <button id="stop" disabled>Stop Stream</button>
  <button id="frontCam">Front Camera</button>
  <button id="backCam">Back Camera</button>

  <div id="uploadProgressOverlay">
    <div>Uploading...</div>
    <div id="progressPercent">0%</div>
  </div>

  <div id="camListOverlay">
    <div id="camListContent">
      <h3>Select Camera</h3>
      <div id="camItemsContainer"></div>
      <button
        onclick="document.getElementById('camListOverlay').style.display='none'"
        style="background:#666;color:white;width:100%;margin:10px 0 0 0;"
      >
        Cancel
      </button>
    </div>
  </div>

  <script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const frontBtn = document.getElementById("frontCam");
    const backBtn = document.getElementById("backCam");
    const cameraSelect = document.getElementById("cameraSelect");
    const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
    const progressPercent = document.getElementById("progressPercent");
    const camListOverlay = document.getElementById("camListOverlay");
    const camItemsContainer = document.getElementById("camItemsContainer");

    let meeting = null;
    let currentUserId = null;
    let currentStream = null;
    let roomIdGlobal = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let segmentNumber = 1;
    const sessionId = crypto.randomUUID();
    let currentCameraId = null;
    let isMicMuted = false;
    let isVideoHidden = false;
    let activeUploads = [];

    async function getUser() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("Login required");
      return session.user.id;
    }

    async function saveStreamToDB(userId, roomId) {
      const { error } = await supabase
        .from("profile")
        .update({
          is_live: true,
          stream_started_at: new Date().toISOString(),
          videosdk_room_id: roomId,
          stream_camera_on: true,
          stream_mic_on: true
        })
        .eq("id", userId);

      if (error) throw error;
    }

    async function clearStreamFromDB(userId) {
      const { error } = await supabase
        .from("profile")
        .update({
          is_live: false,
          stream_ended_at: new Date().toISOString(),
          videosdk_room_id: null,
          stream_camera_on: false,
          stream_mic_on: false
        })
        .eq("id", userId);

      if (error) throw error;
      return true;
    }

    function attachStream(stream, isFrontCamera) {
      video.srcObject = stream;
      video.play();
      video.style.transform = isFrontCamera ? "scaleX(-1)" : "none";
    }

    async function getCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      return devices.filter(d => d.kind === "videoinput");
    }

    async function populateCameraList() {
      const cameras = await getCameras();
      cameraSelect.innerHTML = "";

      let defaultDeviceId = null;

      cameras.forEach((cam, index) => {
        const option = document.createElement("option");
        option.value = cam.deviceId;
        option.text = cam.label || `Camera ${index + 1}`;
        cameraSelect.appendChild(option);

        if (!defaultDeviceId && cam.label && cam.label.toLowerCase().includes("back")) {
          defaultDeviceId = cam.deviceId;
        }
      });

      cameraSelect.value = defaultDeviceId || (cameras[0] && cameras[0].deviceId);
      currentCameraId = cameraSelect.value;
    }

    function startRecording(stream) {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: "video/webm;codecs=vp8,opus",
        videoBitsPerSecond: 2000000,
        audioBitsPerSecond: 128000
      });

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.start(2000);
    }

    async function stopAndUpload(cameraId = currentCameraId) {
      if (!mediaRecorder || mediaRecorder.state === "inactive") return;

      return new Promise(resolve => {
        mediaRecorder.onstop = async () => {
          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: "video/webm" });
            recordedChunks = [];

            uploadProgressOverlay.style.display = "flex";
            progressPercent.textContent = "0%";

            try {
              const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());

              const formData = new FormData();
              formData.append("file", blob, `camera-${cameraId}-segment.webm`);
              formData.append("api_key", apiKey);
              formData.append("timestamp", timestamp);
              formData.append("signature", signature);
              formData.append("folder", "videos");

              const uploadPromise = new Promise((res, rej) => {
                const xhr = new XMLHttpRequest();
                xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

                xhr.upload.onprogress = e => {
                  if (e.lengthComputable) {
                    progressPercent.textContent = Math.round((e.loaded / e.total) * 100) + "%";
                  }
                };

                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) {
                    res(JSON.parse(xhr.responseText));
                  } else {
                    rej(new Error("Upload failed"));
                  }
                };

                xhr.onerror = () => rej(new Error("Upload error"));
                xhr.send(formData);
              });

              const trackedUpload = (async () => {
                const videoData = await uploadPromise;

                const { error } = await supabase.from("video_segments").insert([{
                  session_id: sessionId,
                  segment_number: segmentNumber++,
                  camera_id: cameraId,
                  user_id: currentUserId,
                  video_url: videoData.secure_url,
                  public_id: videoData.public_id
                }]);

                if (error) throw error;
              })();

              activeUploads.push(trackedUpload);
              await trackedUpload;
            } catch (err) {
              console.error("Upload failed", err);
            } finally {
              uploadProgressOverlay.style.display = "none";
              resolve();
            }
          } else {
            resolve();
          }
        };

        mediaRecorder.requestData();
        mediaRecorder.stop();
      });
    }

    async function switchCamera(deviceId) {
      if (isVideoHidden) return;

      try {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          await stopAndUpload(currentCameraId);
        }

        if (videoTrack) {
          videoTrack.getTracks().forEach(t => t.stop());
        }

        const newTrack = await window.VideoSDK.createCameraVideoTrack({
          cameraId: deviceId,
          optimizationMode: "motion",
          encoderConfig: "h1080p_w1920p",
          multiStream: true
        });

        await meeting.changeWebcam(newTrack);
        videoTrack = newTrack;

        const combined = new MediaStream([
          videoTrack.getVideoTracks()[0],
          audioTrack.getAudioTracks()[0]
        ]);

        video.srcObject = combined;
        video.play();
        startRecording(combined);
      } catch (err) {
        console.error("Switch Failed", err);
        status.textContent = "❌ Switch Failed";
      }
    }

    async function startStream(userId) {
      currentUserId = userId;

      const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId })
      });

      const data = await res.json();
      window.VideoSDK.config(data.hostToken);

      videoTrack = await window.VideoSDK.createCameraVideoTrack({
        optimizationMode: "motion",
        encoderConfig: "h1080p_w1920p",
        facingMode: "user",
        multiStream: true
      });

      currentCameraId = videoTrack.getVideoTracks()[0].getSettings().deviceId;

      audioTrack = await window.VideoSDK.createMicrophoneAudioTrack({
        encoderConfig: "high_quality",
        noiseConfig: {
          noiseSuppression: true,
          echoCancellation: true,
          autoGainControl: true
        }
      });

      meeting = window.VideoSDK.initMeeting({
        meetingId: data.roomId,
        name: "Host",
        participantId: userId,
        micEnabled: true,
        webcamEnabled: true,
        customCameraVideoTrack: videoTrack,
        customMicrophoneAudioTrack: audioTrack
      });

      await meeting.join();

      const combined = new MediaStream([
        videoTrack.getVideoTracks()[0],
        audioTrack.getAudioTracks()[0]
      ]);

      video.srcObject = combined;
      video.play();
      startRecording(combined);

      await saveStreamToDB(currentUserId, data.roomId);

      roomIdGlobal = data.roomId;
      status.textContent = "🔴 LIVE";
    }

    async function stopStream() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        await stopAndUpload(currentCameraId);
      }

      await Promise.all(activeUploads);
      activeUploads = [];

      if (meeting) {
        meeting.leave();
      }

      if (videoTrack) {
        videoTrack.getTracks().forEach(t => t.stop());
      }

      if (audioTrack) {
        audioTrack.getTracks().forEach(t => t.stop());
      }

      if (currentUserId) {
        await clearStreamFromDB(currentUserId);
      }

      try {
        const mergeRes = await fetch("/api/video_merge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            user_id: currentUserId
          })
        });

        const mergeData = await mergeRes.json();

        alert(
          mergeData.merged_url
            ? "✅ Merged video uploaded successfully!"
            : "❌ Merge failed"
        );
      } catch (err) {
        console.error(err);
        alert("❌ Merge failed due to network error");
      }
    }

    window.onload = async () => {
      try {
        status.textContent = "✅ SDK Ready";
        status.className = "success";
        await populateCameraList();
      } catch (err) {
        status.textContent = "❌ Camera list unavailable";
      }
    };

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      await startStream("demo-user");
      stopBtn.disabled = false;
      switchBtn.style.display = "inline-block";
      muteBtn.style.display = "inline-block";
      brbBtn.style.display = "inline-block";
    };

    stopBtn.onclick = async () => {
      await stopStream();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      switchBtn.style.display = "none";
      muteBtn.style.display = "none";
      brbBtn.style.display = "none";
      brbOverlay.style.display = "none";
      uploadProgressOverlay.style.display = "none";
      status.textContent = "🛑 Stream Ended";
    };

    switchBtn.onclick = async () => {
      const cameras = await window.VideoSDK.getCameras();
      camItemsContainer.innerHTML = "";

      cameras.forEach(cam => {
        const btn = document.createElement("div");
        btn.className = "cam-item";
        btn.textContent = cam.label || `Camera ${cam.deviceId.substring(0, 5)}`;
        btn.onclick = async () => {
          camListOverlay.style.display = "none";
          cameraSelect.value = cam.deviceId;
          await switchCamera(cam.deviceId);
        };
        camItemsContainer.appendChild(btn);
      });

      camListOverlay.style.display = "flex";
    };

    cameraSelect.onchange = async () => {
      await switchCamera(cameraSelect.value);
    };

    frontBtn.onclick = async () => {
      const cameras = await getCameras();
      const front = cameras.find(c => c.label && c.label.toLowerCase().includes("front"));
      if (front) {
        cameraSelect.value = front.deviceId;
        await switchCamera(front.deviceId);
      }
    };

    backBtn.onclick = async () => {
      const cameras = await getCameras();
      const back = cameras.find(c => c.label && c.label.toLowerCase().includes("back"));
      if (back) {
        cameraSelect.value = back.deviceId;
        await switchCamera(back.deviceId);
      }
    };

    brbBtn.onclick = () => {
      isVideoHidden = !isVideoHidden;
      brbOverlay.style.display = isVideoHidden ? "flex" : "none";
    };

    muteBtn.onclick = async () => {
      if (!meeting) return;

      if (isMicMuted) {
        await meeting.unmuteMic();
      } else {
        await meeting.muteMic();
      }

      isMicMuted = !isMicMuted;
      muteBtn.textContent = isMicMuted ? "🔇 Unmute" : "🎤 Mute Mic";
    };
  </script>
</body>
  </html>
