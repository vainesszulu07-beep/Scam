<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - High Quality</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; object-fit: contain; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
  }
  #start { background: #28a745; color: white; }
  #stop { background: #dc3545; color: white; }
  #start:disabled, #stop:disabled { background: #ccc; cursor: not-allowed; }
  #status { padding: 10px; background: white; font-weight: bold; color: #333; }
</style>
</head>
<body>

<h2>🎥 HD Live Stream</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready to Stream</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null;
let currentUserId = null;
let videoTrack = null;
let audioTrack = null;

function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE (HD Mode)";
    }
  });
}

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

async function saveStreamToDB(userId, data) {
  await supabase.from("profile").update({
    is_live: true,
    stream_started_at: new Date().toISOString(),
    videosdk_room_id: data.roomId,
    videosdk_host_token: data.hostToken,
    videosdk_viewer_token: data.viewerToken,
    stream_camera_on: true,
    stream_mic_on: true
  }).eq("id", userId);
}

async function clearStreamFromDB(userId) {
  await supabase.from("profile").update({
    is_live: false,
    stream_ended_at: new Date().toISOString(),
    videosdk_room_id: null,
    videosdk_host_token: null,
    videosdk_viewer_token: null,
    stream_camera_on: false,
    stream_mic_on: false
  }).eq("id", userId);
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    const userId = await getUser();
    currentUserId = userId;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);
    status.textContent = "Optimizing Media...";

    // UPDATED: High Quality Config with Bandwidth limits to prevent crashes
    videoTrack = await VideoSDK.createCameraVideoTrack({
      encoderConfig: {
        resolution: "h1080p_w1920p",
        maxBitrate: 4000, // 4Mbps for HD
        minBitrate: 600,  // Drops quality if net slows down
        frameRate: 30,
      },
      optimizationMode: "detail",
      multiStream: true // Allows viewers to pull different qualities automatically
    });

    audioTrack = await VideoSDK.createMicrophoneAudioTrack({
      encoderConfig: "high_quality",
      noiseConfig: { noiseSuppression: true, echoCancellation: true }
    });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: false,
      webcamEnabled: false,
      quality: "high" // Start with high quality request
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Finalizing Stream...";
      stopBtn.disabled = false;

      while (!meeting.localParticipant) {
        await new Promise(r => setTimeout(r, 100));
      }

      try {
        await meeting.enableWebcam(videoTrack);
        await meeting.enableMic(audioTrack);
        
        // This is crucial: ensures the host pushes HD
        meeting.localParticipant.setQuality("high");
      } catch (err) {
        console.error(err);
        status.textContent = "❌ Media Error";
      }

      // ADDED: Network Quality Monitor to prevent "Bad Network" crashes
      meeting.on("network-quality-changed", (event) => {
        if (event.participantId === meeting.localParticipant.id) {
            // Quality scale: 0 (poor) to 5 (excellent)
            if (event.uploadQuality < 3) {
                status.textContent = "⚠️ Network Weak - Lowering Quality";
                meeting.localParticipant.setQuality("balanced");
            } else {
                status.textContent = "🔴 LIVE (HD Mode)";
                meeting.localParticipant.setQuality("high");
            }
        }
      });

      attachVideo(meeting.localParticipant);
      await saveStreamToDB(userId, data);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream Ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", (err) => {
      status.textContent = "❌ Error: " + err.message;
      startBtn.disabled = false;
    });

  } catch (err) {
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping...";
    await clearStreamFromDB(currentUserId);
    if (meeting) meeting.leave();
    if (videoTrack) videoTrack.stop();
    if (audioTrack) audioTrack.stop();
    video.srcObject = null;
    status.textContent = "🛑 Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  } catch (err) {
    status.textContent = "❌ Stop Error";
  }
};
</script>

</body>
</html>
