<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Minimal</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  #controls { margin-bottom: 10px; }
  button { padding: 10px 16px; margin-right: 6px; cursor: pointer; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<h2>Streamer Minimal</h2>
<div id="controls">
  <button id="cameraBtn">Stop Camera</button>
  <button id="micBtn">Mute Mic</button>
  <button id="endBtn">End Stream</button>
</div>
<video id="localVideo" autoplay muted playsinline></video>
<div id="msg">Initializing...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase frontend client ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('msg');
const videoEl = document.getElementById('localVideo');
const cameraBtn = document.getElementById('cameraBtn');
const micBtn = document.getElementById('micBtn');
const endBtn = document.getElementById('endBtn');

let userId = null;
let localStream = null;
let cameraOn = true;
let micOn = true;

// --- Get logged-in user ---
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    msgEl.textContent = "Login required";
    return false;
  }
  userId = session.user.id;
  return true;
}

// --- Start stream: get camera/mic and update table ---
async function startStream() {
  if (!userId) {
    const ok = await getUser();
    if (!ok) return;
  }

  try {
    // Request camera and mic
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    videoEl.srcObject = localStream;

    // Update Supabase profile table
    const { data, error } = await supabase
      .from('profile')
      .update({
        is_live: true,
        stream_started_at: new Date(),
        stream_room_id: userId,
        stream_camera_on: true,
        stream_mic_on: true
      })
      .eq('id', userId);

    if (error) {
      msgEl.textContent = "Error updating stream info:\n" + JSON.stringify(error);
      return;
    }

    msgEl.textContent = "Stream started! Room ID: " + userId;
  } catch(err) {
    msgEl.textContent = "Camera/mic error:\n" + err.message;
  }
}

// --- Button controls ---
cameraBtn.onclick = () => {
  if (!localStream) return;
  cameraOn = !cameraOn;
  localStream.getVideoTracks()[0].enabled = cameraOn;
  cameraBtn.textContent = cameraOn ? "Stop Camera" : "Start Camera";
};

micBtn.onclick = () => {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks()[0].enabled = micOn;
  micBtn.textContent = micOn ? "Mute Mic" : "Unmute Mic";
};

endBtn.onclick = async () => {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  const { data, error } = await supabase
    .from('profile')
    .update({
      is_live: false,
      stream_ended_at: new Date(),
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq('id', userId);

  if (error) msgEl.textContent = "Error ending stream:\n" + JSON.stringify(error);
  else msgEl.textContent = "Stream ended.";
};

// --- Initialize ---
getUser().then(ok => {
  if (ok) startStream();
});

</script>
</body>
</html>
