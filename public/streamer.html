<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Room Test</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  button { padding: 10px 16px; cursor: pointer; }
  #output { margin-top: 20px; white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<h2>🎬 VideoSDK Room Test</h2>

<input type="text" id="userId" placeholder="Enter your User ID" style="padding: 8px; width: 200px;">
<button id="createRoomBtn">Create Room & Get Token</button>

<div id="output">Room info will appear here...</div>

<script>
const BACKEND_URL = "https://scamming-lg3v.onrender.com"; // Replace with your deployed backend

document.getElementById("createRoomBtn").onclick = async () => {
  const userId = document.getElementById("userId").value.trim();
  const output = document.getElementById("output");

  if (!userId) {
    output.textContent = "❌ Please enter a User ID";
    return;
  }

  output.textContent = "Creating room...";

  try {
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await resp.json();

    if (!data.success) {
      output.textContent = "❌ Error creating room:\n" + JSON.stringify(data, null, 2);
      return;
    }

    // Display room ID and host token
    output.textContent = `✅ Room created!\n\nRoom ID: ${data.roomId}\nHost Token: ${data.hostToken}\n\nUse these for connecting via WebRTC/SDP.`;

  } catch (err) {
    output.textContent = "❌ Fetch error:\n" + err.message;
  }
};
</script>

</body>
  </html>
