<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoSDK Stream</title>
  <!-- 1. Include VideoSDK Library -->
  <script src="https://videosdk.live"></script>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; border-radius: 8px; }
    button { padding: 12px 20px; margin-right: 10px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #output { margin-top: 15px; white-space: pre-wrap; background: #fff; padding: 15px; border: 1px solid #ddd; border-left: 5px solid #007bff; }
  </style>
</head>
<body>

<h2>🎥 VideoSDK Live Stream</h2>
<video id="localVideo" autoplay muted playsinline></video>
<div>
  <button id="startBtn">Start Stream</button>
  <button id="stopBtn" disabled>Stop Stream</button>
</div>
<div id="output">Ready to start...</div>

<script type="module">
import { createClient } from "https://jsdelivr.net";

// Supabase client (Ensure RLS is ON in your dashboard)
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const videoElement = document.getElementById("localVideo");
const output = document.getElementById("output");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let meeting = null;

async function getUserSession() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!session) throw new Error("No active session found. Please log in.");
  return session.user.id;
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    output.textContent = "Checking session...";
    const userId = await getUserSession();
    
    output.textContent = "Creating room...";
    const res = await fetch("https://onrender.com", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    
    const data = await res.json();
    if (!data.success) throw new Error(data.message || "Failed to create room");

    output.textContent = `✅ Room: ${data.roomId}\nJoining meeting...`;

    // 2. Initialize VideoSDK Meeting
    VideoSDK.config(data.hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host User", // Can be dynamic
      micEnabled: true,
      webcamEnabled: true,
    });

    meeting.join();

    // 3. Handle Stream Events
    meeting.on("local-participant-joined", (participant) => {
      output.textContent += "\n✅ Joined as Host!";
      stopBtn.disabled = false;

      participant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(stream.track);
          videoElement.srcObject = mediaStream;
          output.textContent += "\n🎥 Camera LIVE!";
        }
      });
    });

    meeting.on("meeting-left", () => {
      output.textContent = "🛑 Meeting ended.";
      videoElement.srcObject = null;
    });

  } catch (err) {
    output.textContent = "❌ ERROR: " + err.message;
    startBtn.disabled = false;
    console.error(err);
  }
};

stopBtn.onclick = () => {
  if (meeting) {
    meeting.leave();
    meeting = null;
  }
  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>

</body>
</html>
