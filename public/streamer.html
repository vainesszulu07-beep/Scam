<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Live Stream + Supabase</title>
<style>
  body { font-family: Arial; padding: 20px; background: #f4f4f4; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
  #output { margin-top: 10px; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>🎥 VideoSDK Live Stream</h2>
<video id="video" autoplay playsinline muted></video>
<div>
  <button id="start">Start Stream</button>
  <button id="stop">Stop Stream</button>
</div>
<div id="output">Ready...</div>

<!-- VideoSDK JS SDK -->
<script src="https://videosdk.live/js-sdk/latest/VideoSDK.min.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const output = document.getElementById("output");
let meeting = null;

async function getUserId() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!session) throw new Error("No active session");
  return session.user.id;
}

document.getElementById("start").onclick = async () => {
  try {
    output.textContent = "✅ Getting user session...";
    const userId = await getUserId();
    output.textContent += `\nUser ID: ${userId}\nCreating room...`;

    // Call backend to create room + host token
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();
    if (!data.success) throw new Error(JSON.stringify(data));

    output.textContent += `\n✅ Room created: ${data.roomId}`;

    // Initialize VideoSDK meeting
    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: session.user.email || "Host User",
      micEnabled: true,
      webcamEnabled: true,
      token: data.hostToken
    });

    meeting.join();

    meeting.on("local-participant-joined", (participant) => {
      output.textContent += "\n✅ LIVE!";
      participant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(stream.track);
          video.srcObject = mediaStream;
        }
      });
    });

  } catch (err) {
    output.textContent = "❌ ERROR: " + err.message;
    console.error(err);
  }
};

document.getElementById("stop").onclick = () => {
  if (meeting) meeting.leave();
  video.srcObject = null;
  output.textContent = "🛑 Stopped";
};
</script>

</body>
</html>
