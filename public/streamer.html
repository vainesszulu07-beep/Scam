<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Live Stream</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 16px; margin-right: 6px; cursor: pointer; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; margin-top: 10px; }
</style>
</head>
<body>

<h2>🎥 Live Stream</h2>
<video id="localVideo" autoplay muted playsinline></video>
<div>
  <button id="startBtn">Start Stream</button>
  <button id="stopBtn">Stop Stream</button>
</div>
<div id="msg">Ready...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 🔥 Replace with your backend URL
const BACKEND_URL = "https://scamming-lg3v.onrender.com";

// Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const videoEl = document.getElementById("localVideo");
const msgEl = document.getElementById("msg");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let localStream;
let pc;

// =====================
// GET USER SESSION
// =====================
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  msgEl.textContent = "❌ Not logged in";
  startBtn.disabled = true;
  stopBtn.disabled = true;
  throw new Error("No session");
}
const userId = session.user.id;

// =====================
// START STREAM
// =====================
startBtn.onclick = async () => {
  try {
    msgEl.textContent = "Starting...";

    // 1. Get camera + mic
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    videoEl.srcObject = localStream;

    // 2. Request persistent room & host token
    const resp = await fetch(`${BACKEND_URL}/api/create-room`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await resp.json();

    if (!data.success) {
      console.error("CREATE ROOM ERROR:", data);
      throw new Error(JSON.stringify(data, null, 2));
    }

    const { roomId, hostToken } = data;
    msgEl.textContent = `Room ID: ${roomId}\nHost Token: ${hostToken}`;

    // 3. Start WebRTC
    pc = new RTCPeerConnection();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = async (event) => {
      if (event.candidate) return;
      // VideoSDK handles ICE automatically for persistent rooms
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdpResp = await fetch(`https://api.videosdk.live/v2/rooms/${roomId}/webrtc`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${hostToken}`,
        "Content-Type": "application/sdp"
      },
      body: offer.sdp
    });

    const answerSdp = await sdpResp.text();
    if (!answerSdp.startsWith("v=")) {
      throw new Error("Invalid SDP:\n" + answerSdp);
    }
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    msgEl.textContent += "\n\n✅ Live stream started";

  } catch (err) {
    console.error("STREAM ERROR:", err);
    msgEl.textContent = "❌ ERROR:\n" + err.message;
  }
};

// =====================
// STOP STREAM
// =====================
stopBtn.onclick = async () => {
  try {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (pc) pc.close();

    await fetch(`${BACKEND_URL}/api/stop-stream`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });

    msgEl.textContent = "🛑 Stream stopped";

  } catch (err) {
    msgEl.textContent = "Stop error:\n" + err.message;
  }
};
</script>

</body>
</html>
