<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - Cloudinary Upload</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        #video-container { position: relative; width: 100%; max-width: 800px; margin: auto; background: black; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; display: block; object-fit: contain; }
        #status { padding: 10px; font-weight: bold; }
        .success { color: #4caf50; }
        .controls { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        #start { background: #4caf50; }
        #stop { background: #f44336; }
        #switch, #mute, #brb { background: #333; }
        #uploadProgressOverlay {
            display: none; position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; font-size: 12px; z-index: 10;
        }
        #brb-overlay {
            display: none; position: absolute; inset: 0; background: black;
            justify-content: center; align-items: center; font-size: 24px; z-index: 5;
        }
        #camListOverlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center; flex-direction: column; z-index: 100;
        }
        .cam-item { background: #222; padding: 15px; margin: 5px; cursor: pointer; border-radius: 8px; width: 280px; text-align: left; }
    </style>
</head>
<body>

<div id="status">Initializing...</div>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="brb-overlay">BRB - Back Soon</div>
    <div id="uploadProgressOverlay">Uploading: <span id="progressPercent">0%</span></div>
</div>

<div class="controls">
    <button id="start" disabled>START</button>
    <button id="stop" disabled>STOP</button>
    <button id="switch" style="display:none;">Switch Cam</button>
    <button id="mute" style="display:none;">Mute</button>
    <button id="brb" style="display:none;">BRB</button>
</div>

<div id="camListOverlay"><div id="camItemsContainer"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@videosdk.live/js-sdk@0.7.0/videosdk.min.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
    "https://eimecuiixwgmpfpedxpr.supabase.co",
    "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// UI Elements
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const switchBtn = document.getElementById("switch");
const muteBtn = document.getElementById("mute");
const brbBtn = document.getElementById("brb");
const overlay = document.getElementById("uploadProgressOverlay");
const progressText = document.getElementById("progressPercent");
const brbOverlay = document.getElementById("brb-overlay");

// State
let meeting = null;
let currentUserId = null;
let videoTrack = null;
let audioTrack = null;
let mediaRecorder = null;
let recordedChunks = [];
let segmentNumber = 1;
const sessionId = crypto.randomUUID();
let isMicMuted = false;
let isVideoHidden = false;

window.onload = () => {
    if (window.VideoSDK) {
        statusEl.textContent = "✅ Ready";
        startBtn.disabled = false;
    }
};

// --- CLOUDINARY UPLOAD LOGIC ---
async function uploadSegment(blob) {
    overlay.style.display = "block";
    try {
        // 1. Get Signature from your backend
        const signData = await fetch("/api/video.js").then(r => r.json());

        const formData = new FormData();
        formData.append("file", blob);
        formData.append("api_key", signData.apiKey);
        formData.append("timestamp", signData.timestamp);
        formData.append("signature", signData.signature);
        formData.append("folder", "live_streams");

        const xhr = new XMLHttpRequest();
        xhr.open("POST", `https://api.cloudinary.com/v1_1/${signData.cloudName}/video/upload`);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                progressText.textContent = Math.round((e.loaded / e.total) * 100) + "%";
            }
        };

        const res = await new Promise((resolve, reject) => {
            xhr.onload = () => resolve(JSON.parse(xhr.responseText));
            xhr.onerror = () => reject("Upload Failed");
            xhr.send(formData);
        });

        // 2. Save Reference to Supabase
        await supabase.from("video_segments").insert([{
            session_id: sessionId,
            segment_number: segmentNumber++,
            user_id: currentUserId,
            video_url: res.secure_url,
            public_id: res.public_id
        }]);

    } catch (err) {
        console.error("Upload Error:", err);
    } finally {
        overlay.style.display = "none";
    }
}

// --- RECORDING ---
function startRecording(stream) {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });

    mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
        if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: "video/webm" });
            recordedChunks = [];
            uploadSegment(blob);
        }
    };

    // Auto-segment every 10 seconds
    mediaRecorder.start(10000);
    setInterval(() => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            mediaRecorder.start(10000);
        }
    }, 10000);
}

// --- START LIVE ---
startBtn.onclick = async () => {
    startBtn.disabled = true;
    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error("Login Required");
        currentUserId = session.user.id;

        const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: currentUserId })
        });
        const roomData = await res.json();

        window.VideoSDK.config(roomData.hostToken);

        videoTrack = await window.VideoSDK.createCameraVideoTrack({
            encoderConfig: "h1080p_w1920p",
            facingMode: "user"
        });
        
        audioTrack = await window.VideoSDK.createMicrophoneAudioTrack({
            encoderConfig: "high_quality"
        });

        meeting = window.VideoSDK.initMeeting({
            meetingId: roomData.roomId,
            name: "Host",
            participantId: currentUserId,
            webcamEnabled: true,
            customCameraVideoTrack: videoTrack,
            customMicrophoneAudioTrack: audioTrack
        });

        meeting.join();

        meeting.on("meeting-joined", async () => {
            statusEl.textContent = "🔴 LIVE";
            stopBtn.disabled = false;
            [switchBtn, muteBtn, brbBtn].forEach(b => b.style.display = "inline-block");

            const stream = new MediaStream([videoTrack.getVideoTracks()[0], audioTrack.getAudioTracks()[0]]);
            video.srcObject = stream;
            
            startRecording(stream);

            await supabase.from("profile").update({ is_live: true, videosdk_room_id: roomData.roomId }).eq("id", currentUserId);
        });

    } catch (err) {
        alert(err.message);
        startBtn.disabled = false;
    }
};

// --- STOP LIVE ---
stopBtn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    if (meeting) meeting.leave();

    video.srcObject = null;
    statusEl.textContent = "🛑 Ended";
    
    [startBtn, stopBtn].forEach(b => b.disabled = !b.disabled);
    [switchBtn, muteBtn, brbBtn].forEach(b => b.style.display = "none");

    await supabase.from("profile").update({ is_live: false }).eq("id", currentUserId);

    // Final Merge
    await fetch("/api/video_merge", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
    });
};

// Mute & BRB Handlers
muteBtn.onclick = () => {
    isMicMuted ? meeting.unmuteMic() : meeting.muteMic();
    isMicMuted = !isMicMuted;
    muteBtn.textContent = isMicMuted ? "Unmute" : "Mute";
};

brbBtn.onclick = () => {
    if (isVideoHidden) {
        meeting.enableWebcam();
        brbOverlay.style.display = "none";
    } else {
        meeting.disableWebcam();
        brbOverlay.style.display = "flex";
    }
    isVideoHidden = !isVideoHidden;
    brbBtn.textContent = isVideoHidden ? "Resume" : "BRB";
};
</script>
</body>
</html>
