<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; object-fit: contain; }
  button, select {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>

<body>

<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>

<select id="cameraSelect"></select>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let customTrack = null;
let currentCameraId = null;

// ---------------- CAMERA ----------------

async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d => d.kind === "videoinput");
}

async function populateCameraList() {
  const cams = await getCameras();
  cameraSelect.innerHTML = "";

  cams.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.deviceId;
    opt.text = cam.label || "Camera";
    cameraSelect.appendChild(opt);
  });

  if (cams.length > 0) {
    currentCameraId = cams[0].deviceId;
    cameraSelect.value = currentCameraId;
  }
}

// ---------------- VIDEO DISPLAY ----------------

function attachStream(track) {
  if (!track) {
    status.textContent = "❌ Camera not ready";
    return;
  }

  const stream = new MediaStream([track]); // ✅ CORRECT

  video.srcObject = stream;
  video.play();
}

// ---------------- SWITCH CAMERA ----------------

async function switchCamera(deviceId) {
  try {
    if (!meeting) return;

    if (customTrack) customTrack.stop();

    customTrack = await createTrack(deviceId);

    await meeting.enableWebcam(customTrack);
    attachStream(customTrack);

    currentCameraId = deviceId;
    status.textContent = "🔄 Camera switched";

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Switch failed";
  }
}

cameraSelect.onchange = () => switchCamera(cameraSelect.value);

// ---------------- TRACK CREATION ----------------

async function createTrack(deviceId) {
  const configs = [
    { encoderConfig: "h1080p_w1920p" },
    { encoderConfig: "h720p_w1280p" }
  ];

  for (let cfg of configs) {
    try {
      return await VideoSDK.createCameraVideoTrack({
        cameraId: deviceId,
        optimizationMode: "detail",
        ...cfg
      });
    } catch (err) {
      console.warn("Fallback...", cfg);
    }
  }

  throw new Error("No camera resolution supported");
}

// ---------------- AUTH ----------------

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// ---------------- START ----------------

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Starting...";

    const userId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ userId })
    });

    const data = await res.json();

    await VideoSDK.config(data.hostToken);

    customTrack = await createTrack(currentCameraId);

    attachStream(customTrack);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      micEnabled: true,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      await meeting.enableWebcam(customTrack);
      status.textContent = "🔴 LIVE";
      stopBtn.disabled = false;
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// ---------------- STOP ----------------

stopBtn.onclick = async () => {
  try {
    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      customTrack.stop();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Ended";

    startBtn.disabled = false;
    stopBtn.disabled = true;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Stop failed";
  }
};

// ---------------- INIT ----------------

await populateCameraList();

</script>
</body>
</html>
