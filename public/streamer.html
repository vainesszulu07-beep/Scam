<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Stream Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@videosdk.live/js-sdk@0.7.0/videosdk.min.js"></script>
<style>
    body { background: #0f0f13; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .video-container { position: relative; width: 80%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video { width: 100%; height: 100%; object-fit: cover; }
    .controls { margin-top: 20px; display: flex; gap: 10px; }
    button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    #startBtn { background: #6366f1; color: white; }
    #stopBtn { background: #ef4444; color: white; }
    #switchBtn { background: #10b981; color: white; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #9ca3af; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; }
    .cam-list { position: absolute; top: 50px; background: #1f1f25; padding: 10px; border-radius: 8px; display: none; flex-direction: column; gap: 5px; z-index: 100; }
    .cam-list button { background: #6366f1; color: white; font-size: 14px; padding: 6px; }
</style>
</head>
<body>

<div id="status">Ready to Stream</div>
<div class="video-container">
    <video id="video" autoplay muted playsinline></video>
    <div id="uploadOverlay" class="overlay">
        <p>Uploading HD Segment...</p>
        <p id="progress">0%</p>
    </div>
</div>

<div class="controls">
    <button id="startBtn">START BROADCAST</button>
    <button id="stopBtn" disabled>STOP</button>
    <button id="switchBtn">SWITCH CAMERA</button>
</div>

<div id="camListOverlay" class="cam-list"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// Elements
const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const switchBtn = document.getElementById("switchBtn");
const uploadOverlay = document.getElementById("uploadOverlay");
const progressPercent = document.getElementById("progress");
const camListOverlay = document.getElementById("camListOverlay");

// State
let meeting = null;
let currentUserId = null;
let sharedStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let segmentNumber = 1;
let sessionId = crypto.randomUUID();
let currentCameraId = null;
let isVideoHidden = false;

// --- Helpers ---
window.onload = () => { if (window.VideoSDK) statusEl.textContent = "✅ SDK Ready"; };

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

function applySmartMirror(stream) {
  if (!stream) return;
  const tracks = stream.getVideoTracks();
  const settings = tracks[0].getSettings();
  video.style.transform = settings.facingMode === 'environment' ? "none" : "scaleX(-1)";
}

// --- Recording ---
function startRecording(stream) {
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: 'video/webm;codecs=vp8,opus',
    videoBitsPerSecond: 2_000_000,
    audioBitsPerSecond: 128_000
  });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.start(10000); // 10s chunks
}

async function stopAndUpload() {
  if (!mediaRecorder || mediaRecorder.state === "inactive") return;
  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      if (recordedChunks.length > 0) {
        const blob = new Blob(recordedChunks, { type: "video/webm" });
        recordedChunks = [];
        uploadOverlay.style.display = "flex";
        try {
          const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r => r.json());
          const formData = new FormData();
          formData.append("file", blob, `HD-rec-${segmentNumber}.webm`);
          formData.append("api_key", apiKey);
          formData.append("timestamp", timestamp);
          formData.append("signature", signature);
          formData.append("folder", "videos");
          const xhr = new XMLHttpRequest();
          xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);
          xhr.upload.onprogress = e => { if(e.lengthComputable) progressPercent.textContent = Math.round((e.loaded/e.total)*100) + "%"; };
          const uploadPromise = new Promise((res, rej) => {
            xhr.onload = () => xhr.status < 300 ? res(JSON.parse(xhr.responseText)) : rej();
            xhr.onerror = rej;
            xhr.send(formData);
          });
          const videoData = await uploadPromise;
          await supabase.from("video_segments").insert([{
            session_id: sessionId,
            segment_number: segmentNumber++,
            user_id: currentUserId,
            video_url: videoData.secure_url,
            public_id: videoData.public_id
          }]);
        } catch (err) { console.error("Upload failed", err); }
        finally { uploadOverlay.style.display = "none"; resolve(); }
      } else resolve();
    };
    mediaRecorder.stop();
  });
}

// --- Main Stream Logic ---
async function startStream() {
  try {
    startBtn.disabled = true;
    statusEl.textContent = "Connecting...";
    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    window.VideoSDK.config(data.hostToken);

    // Start with default camera
    sharedStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, frameRate: { ideal: 30, max: 30 } },
      audio: true
    });

    currentCameraId = sharedStream.getVideoTracks()[0].getSettings().deviceId;

    const videoTrackSource = sharedStream.getVideoTracks()[0];
    const audioTrackSource = sharedStream.getAudioTracks()[0];

    meeting = window.VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: true,
      customCameraVideoTrack: videoTrackSource,
      customMicrophoneAudioTrack: audioTrackSource
    });

    video.srcObject = new MediaStream([videoTrackSource]);
    video.play();
    applySmartMirror(sharedStream);

    startRecording(sharedStream);
    meeting.join();

    meeting.on("meeting-joined", async () => {
      statusEl.textContent = "🔴 LIVE (HD Recording & Broadcast)";
      stopBtn.disabled = false;
      await supabase.from("profile").update({
        is_live: true,
        stream_started_at: new Date().toISOString(),
        videosdk_room_id: data.roomId
      }).eq("id", currentUserId);
    });

  } catch (err) {
    statusEl.textContent = `❌ ${err.name}: ${err.message}`;
    startBtn.disabled = false;
  }
}

async function stopStream() {
  statusEl.textContent = "Finalizing...";
  stopBtn.disabled = true;
  await stopAndUpload();
  if (meeting) meeting.leave();
  if(sharedStream) sharedStream.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  statusEl.textContent = "🛑 Stream Ended";
  await supabase.from("profile").update({
    is_live: false,
    stream_ended_at: new Date().toISOString(),
    videosdk_room_id: null
  }).eq("id", currentUserId);
  fetch("/api/video_merge", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, user_id: currentUserId })
  });
  startBtn.disabled = false;
}

// --- CAMERA SWITCH LOGIC ---
async function changeCamera(selectedDeviceId) {
  camListOverlay.style.display = "none";
  const previousCameraId = currentCameraId;
  currentCameraId = selectedDeviceId;

  if (isVideoHidden) return;

  statusEl.textContent = "Switching Camera...";
  try {
    await stopAndUpload();
    if (sharedStream) sharedStream.getTracks().forEach(t => t.stop());

    sharedStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: selectedDeviceId }, width: 1280, height: 720, frameRate: { ideal: 30 } },
      audio: true
    });

    const videoTrackSource = sharedStream.getVideoTracks()[0];
    const audioTrackSource = sharedStream.getAudioTracks()[0];

    await meeting.changeWebcam(videoTrackSource);
    video.srcObject = sharedStream;
    applySmartMirror(sharedStream);
    startRecording(sharedStream);
    statusEl.textContent = "🔴 LIVE";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ Switch Failed";
  }
}

// --- CAMERA LIST UI ---
switchBtn.onclick = async () => {
  camListOverlay.innerHTML = "";
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoInputs = devices.filter(d => d.kind === "videoinput");
  videoInputs.forEach(cam => {
    const btn = document.createElement("button");
    btn.textContent = cam.label || `Camera ${cam.deviceId}`;
    btn.onclick = () => changeCamera(cam.deviceId);
    camListOverlay.appendChild(btn);
  });
  camListOverlay.style.display = "flex";
};

// Close overlay on outside click
document.addEventListener("click", e => {
  if (!camListOverlay.contains(e.target) && e.target !== switchBtn) {
    camListOverlay.style.display = "none";
  }
});

// --- Event Bindings ---
startBtn.onclick = startStream;
stopBtn.onclick = stopStream;

</script>
</body>
</html>
