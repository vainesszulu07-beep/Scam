<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Live</title>
  <style>
    body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
    video { width: 100%; height: 55vh; background: black; margin-bottom: 10px; transition: opacity 0.3s ease; }
    button, select { padding: 12px; width: 90%; margin: 10px; border: none; border-radius: 8px; font-weight: bold; }
    #start { background: green; color: white; }
    #stop { background: red; color: white; }
    #cameraSelect { background: #007bff; color: white; }
    #status { padding: 10px; background: white; }
  </style>
</head>
<body>
  <h2>🎥 Go Live</h2>
  <video id="video" autoplay muted playsinline></video>
  <div id="status">Ready...</div>
  <button id="start">Start Stream</button>
  <button id="stop" disabled>Stop Stream</button>
  <select id="cameraSelect">
    <option>Loading cameras...</option>
  </select>

  <script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const video = document.getElementById("video");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const cameraSelect = document.getElementById("cameraSelect");

    let meeting = null;
    let currentUserId = null;
    let customTrack = null;

    // Attach participant video to <video>
    function attachVideo(participant) {
      participant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          const rawTrack = stream.track;
          if (rawTrack) {
            const mediaStream = new MediaStream([rawTrack]);
            video.srcObject = mediaStream;
            video.play();
            status.textContent = "🔴 LIVE";
          }
        }
      });
    }

    // Get logged-in user
    async function getUser() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("Login required");
      return session.user.id;
    }

    // Stop a custom track safely
    function stopCustomTrack(track) {
      if (!track) return;

      if (track.track && typeof track.track.stop === "function") {
        track.track.stop();
      } else if (track.stream) {
        track.stream.getTracks().forEach(t => t.stop());
      } else if (track instanceof MediaStreamTrack) {
        track.stop();
      }
    }

    // Load cameras for dropdown
    async function loadCameras() {
      try {
        const cameras = await VideoSDK.getCameras();
        cameraSelect.innerHTML = "";
        if (!cameras || cameras.length === 0) {
          cameraSelect.innerHTML = "<option>No cameras found</option>";
          return;
        }
        cameras.forEach(cam => {
          const option = document.createElement("option");
          option.value = cam.deviceId;
          option.textContent = cam.label || "Unknown Camera";
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error("Failed to get cameras:", err);
        cameraSelect.innerHTML = "<option>No cameras found</option>";
      }
    }

    // Start Stream
    startBtn.onclick = async () => {
      try {
        startBtn.disabled = true;
        status.textContent = "Authorizing...";

        currentUserId = await getUser();

        const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: currentUserId })
        });
        const data = await res.json();
        if (!data.success) throw new Error("Failed to create room");

        await VideoSDK.config(data.hostToken);
        status.textContent = "Setting up camera...";

        customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "motion" });

        meeting = VideoSDK.initMeeting({
          meetingId: data.roomId,
          name: "Host",
          participantId: currentUserId,
          micEnabled: true,
          webcamEnabled: false // We'll enable manually
        });

        meeting.join();

        meeting.on("meeting-joined", async () => {
          status.textContent = "Connecting stream...";
          stopBtn.disabled = false;

          // Wait for local participant
          let waited = 0;
          while (!meeting.localParticipant && waited < 5000) {
            await new Promise(r => setTimeout(r, 50));
            waited += 50;
          }
          if (!meeting.localParticipant) throw new Error("Local participant not ready");

          await meeting.enableWebcam(customTrack);
          attachVideo(meeting.localParticipant);

          // Load cameras AFTER permissions granted
          await loadCameras();
        });

        meeting.on("participant-joined", participant => {
          if (participant.id === meeting.localParticipant.id) attachVideo(participant);
        });

        meeting.on("meeting-left", () => {
          video.srcObject = null;
          status.textContent = "Stream ended";
          startBtn.disabled = false;
          stopBtn.disabled = true;
        });

        meeting.on("error", err => {
          console.error("SDK Error:", err);
          status.textContent = "❌ Connection error";
        });

      } catch (err) {
        console.error("Stream Start Error:", err);
        status.textContent = "❌ " + err.message;
        startBtn.disabled = false;
      }
    };

    // Stop Stream
    stopBtn.onclick = async () => {
      try {
        status.textContent = "Stopping stream...";
        if (meeting) {
          await meeting.disableWebcam();
          meeting.leave();
          meeting = null;
        }
        stopCustomTrack(customTrack);
        customTrack = null;
        video.srcObject = null;

        status.textContent = "🛑 Stream Ended";
        startBtn.disabled = false;
        stopBtn.disabled = true;
      } catch (err) {
        console.error(err);
        status.textContent = "❌ Failed to stop cleanly: " + err.message;
      }
    };

    // Camera switch with delay for reliable hardware release
    cameraSelect.addEventListener("change", async (e) => {
      const selectedId = e.target.value;
      if (!meeting || !selectedId) return;

      try {
        status.textContent = "Switching camera...";

        // 1. Disable old camera
        await meeting.disableWebcam();
        stopCustomTrack(customTrack);

        // 2. Wait 500ms for hardware to release
        await new Promise(resolve => setTimeout(resolve, 500));

        // 3. Create new custom track
        const newCustomTrack = await VideoSDK.createCameraVideoTrack({
          webcamId: selectedId,
          optimizationMode: "motion"
        });

        // 4. Enable new camera
        await meeting.enableWebcam(newCustomTrack);

        // 5. Update local preview
        const rawTrack = newCustomTrack.track || (newCustomTrack.stream && newCustomTrack.stream.getVideoTracks()[0]);
        if (rawTrack) {
          const mediaStream = new MediaStream([rawTrack]);
          video.srcObject = mediaStream;
          video.load();
          await video.play();
        }

        customTrack = newCustomTrack;
        status.textContent = "🔴 LIVE";
        console.log("Camera switched to:", selectedId);

      } catch (err) {
        console.error("Failed to switch camera:", err);
        status.textContent = "❌ Switch failed: " + err.message;

        // Fallback: restore previous camera
        if (customTrack) await meeting.enableWebcam(customTrack);
      }
    });

  </script>
</body>
</html>
