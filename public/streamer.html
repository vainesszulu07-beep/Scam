<!DOCTYPE html>  
<html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>VideoSDK Live Stream</title>  

  <style>  
    body { font-family: system-ui; padding: 15px; background: #f4f4f4; }  
    .container { max-width: 800px; margin: auto; }  

    video {  
      width: 100%;  
      height: 55vh;  
      background: black;  
      border-radius: 12px;  
      margin-bottom: 10px;  
    }  

    button {  
      padding: 12px;  
      border: none;  
      border-radius: 8px;  
      font-weight: bold;  
      width: 48%;  
    }  

    #start { background: #007bff; color: white; }  
    #stop { background: red; color: white; }  

    #output {  
      background: white;  
      padding: 10px;  
      border-radius: 8px;  
      font-size: 13px;  
      white-space: pre-wrap;  
    }  

    .controls { display: flex; gap: 4%; }  
  </style>  
</head>  
<body>  

<div class="container">  
  <h3>🎥 Live Stream</h3>  

  <video id="videoElement" autoplay muted playsinline></video>  

  <div class="controls">  
    <button id="start">Start</button>  
    <button id="stop" disabled>Stop</button>  
  </div>  

  <div id="output">Ready...</div>  
</div>  

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>  

<script type="module">  
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";  

const supabase = createClient(  
  "https://eimecuiixwgmpfpedxpr.supabase.co",  
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"  
);  

const video = document.getElementById("videoElement");  
const output = document.getElementById("output");  
const startBtn = document.getElementById("start");  
const stopBtn = document.getElementById("stop");  

let meeting = null;  
let nativeStream = null;  

async function getUserSession() {  
  const { data: { session } } = await supabase.auth.getSession();  
  if (!session) throw new Error("Login first.");  
  return session.user.id;  
}  

startBtn.onclick = async () => {  
  try {  
    startBtn.disabled = true;  
    output.textContent = "🎬 Opening Camera...";  

    // ✅ 1. NATIVE CAMERA (MOST RELIABLE)
    nativeStream = await navigator.mediaDevices.getUserMedia({  
      video: { width: 1280, height: 720, facingMode: "user" },  
      audio: true  
    });  

    // ✅ 2. SHOW PREVIEW INSTANTLY
    video.srcObject = nativeStream;  
    output.textContent = "✅ Camera Ready. Connecting...";  

    // ✅ 3. BACKEND
    const userId = await getUserSession();  

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {  
      method: "POST",  
      headers: { "Content-Type": "application/json" },  
      body: JSON.stringify({ userId })  
    });  

    const data = await res.json();  
    if (!data.success) throw new Error("Backend error");  

    // ✅ 4. CONVERT TO VIDEOSDK TRACK
    const videoTrack = nativeStream.getVideoTracks()[0];  

    if (!videoTrack) {  
      throw new Error("No camera track found ❌");  
    }  

    const sdkTrack = new VideoSDK.CustomVideoTrack(videoTrack, {  
      optimizationMode: "motion",  
    });  

    // ✅ 5. INIT VIDEOSDK
    VideoSDK.config(data.hostToken);  

    meeting = VideoSDK.initMeeting({  
      meetingId: data.roomId,  
      name: "Host",  
      webcamEnabled: false,  
      micEnabled: true,  
      customVideoTrack: sdkTrack,  
    });  

    meeting.join();  

    meeting.on("meeting-joined", () => {  
      output.textContent = "🎥 LIVE! Streaming...";  
      stopBtn.disabled = false;  
    });  

    meeting.on("meeting-left", () => {  
      output.textContent = "🛑 Stream Ended";  
    });  

  } catch (err) {  
    output.textContent = "❌ " + err.message;  
    startBtn.disabled = false;  
    console.error(err);  
  }  
};  

stopBtn.onclick = () => {  
  if (meeting) meeting.leave();  

  // ✅ STOP CAMERA COMPLETELY
  if (nativeStream) {  
    nativeStream.getTracks().forEach(t => t.stop());  
    nativeStream = null;  
  }  

  video.srcObject = null;  

  output.textContent = "🛑 Stopped";  
  startBtn.disabled = false;  
  stopBtn.disabled = true;  
};  

</script>  

</body>  
</html>
