<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; }
  button {
    padding: 12px; width: 90%; margin: 10px;
    border: none; border-radius: 8px; font-weight: bold;
  }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>

<body>

<h2>🎥 Go Live</h2>

<video id="video" autoplay muted playsinline></video>

<div id="status">Ready...</div>

<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

let meeting = null;
let currentUserId = null;

// 🎥 Attach camera
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);

      video.srcObject = mediaStream;
      video.play();

      status.textContent = "🔴 LIVE";
    }
  });
}

// 👤 Get user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// 🚀 START STREAM
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Starting stream...";

    const userId = await getUser();
    currentUserId = userId;

    // 🔥 Backend call
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Failed to create stream");

    // ✅ SAVE TO SUPABASE (🔥 THIS IS THE NEW PART)
    const { error } = await supabase
      .from("profile")
      .update({
        is_live: true,
        stream_started_at: new Date().toISOString(),
        videosdk_room_id: data.roomId,
        videosdk_host_token: data.hostToken,
        videosdk_viewer_token: data.viewerToken,
        stream_camera_on: true,
        stream_mic_on: true
      })
      .eq("id", userId);

    if (error) throw error;

    // 🎥 Start VideoSDK
    VideoSDK.config(data.hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: true
    });

    meeting.join();

    meeting.on("meeting-joined", () => {
      status.textContent = "Connecting camera...";
      stopBtn.disabled = false;

      if (meeting.localParticipant) {
        attachVideo(meeting.localParticipant);
      }
    });

    meeting.on("participant-joined", (participant) => {
      if (participant.id === meeting.localParticipant.id) {
        attachVideo(participant);
      }
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

  } catch (err) {
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// 🛑 STOP STREAM
stopBtn.onclick = async () => {
  if (meeting) meeting.leave();

  video.srcObject = null;
  status.textContent = "Stopping stream...";

  // ✅ UPDATE SUPABASE (end stream)
  await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", currentUserId);

  status.textContent = "🛑 Stream Ended";

  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>

</body>
</html>
