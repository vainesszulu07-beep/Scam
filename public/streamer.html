<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; margin-bottom: 10px; }
  button, select { padding: 12px; width: 90%; margin: 10px; border: none; border-radius: 8px; font-weight: bold; }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #cameraSelect { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>
<h2>🎥 Go Live</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<select id="cameraSelect">
  <option>Loading cameras...</option>
</select>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;
let customTrack = null;

// Attach participant video to <video>
function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const mediaStream = new MediaStream();
      mediaStream.addTrack(stream.track);
      video.srcObject = mediaStream;
      video.play();
      status.textContent = "🔴 LIVE";
    }
  });
}

// Get logged-in user
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Save stream to Supabase
async function saveStreamToDB(userId, data) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: true,
      stream_started_at: new Date().toISOString(),
      videosdk_room_id: data.roomId,
      videosdk_host_token: data.hostToken,
      videosdk_viewer_token: data.viewerToken,
      stream_camera_on: true,
      stream_mic_on: true
    })
    .eq("id", userId);
  if (error) throw error;
}

// Clear stream from Supabase
async function clearStreamFromDB(userId) {
  const { error } = await supabase
    .from("profile")
    .update({
      is_live: false,
      stream_ended_at: new Date().toISOString(),
      videosdk_room_id: null,
      videosdk_host_token: null,
      videosdk_viewer_token: null,
      stream_camera_on: false,
      stream_mic_on: false
    })
    .eq("id", userId);
  if (error) throw error;
  return true;
}

// Load cameras for dropdown (call AFTER permissions granted)
async function loadCameras() {
  try {
    const cameras = await VideoSDK.getCameras();
    cameraSelect.innerHTML = "";

    if (cameras.length === 0) {
      cameraSelect.innerHTML = "<option>No cameras found</option>";
      return;
    }

    cameras.forEach(cam => {
      const option = document.createElement("option");
      option.value = cam.deviceId;
      option.textContent = cam.label || "Unknown Camera";
      cameraSelect.appendChild(option);
    });
  } catch (err) {
    console.error("Failed to get cameras:", err);
    cameraSelect.innerHTML = "<option>No cameras found</option>";
  }
}

// Start Stream
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";

    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });

    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);

    status.textContent = "Setting up camera...";

    // Create first track (default camera)
    customTrack = await VideoSDK.createCameraVideoTrack({ optimizationMode: "motion" });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;

      // Wait for local participant
      let waited = 0;
      while (!meeting.localParticipant && waited < 5000) {
        await new Promise(r => setTimeout(r, 50));
        waited += 50;
      }
      if (!meeting.localParticipant) throw new Error("Local participant not ready");

      await meeting.enableWebcam(customTrack);
      attachVideo(meeting.localParticipant);

      // Save stream info to Supabase
      await saveStreamToDB(currentUserId, data);

      // Load cameras AFTER permissions granted
      await loadCameras();
    });

    meeting.on("participant-joined", participant => {
      if (participant.id === meeting.localParticipant.id) attachVideo(participant);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", err => {
      console.error("SDK Error:", err);
      status.textContent = "❌ Connection error";
    });

  } catch (err) {
    console.error("Stream Start Error:", err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// Stop Stream
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    await clearStreamFromDB(currentUserId);

    if (meeting) {
      await meeting.disableWebcam();
      meeting.leave();
      meeting = null;
    }

    if (customTrack) {
      customTrack.stop();
      customTrack = null;
    }

    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;

  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }
};

// Switch camera (corrected)
cameraSelect.addEventListener("change", async (e) => {
  const selectedId = e.target.value;
  if (meeting && selectedId) {
    try {
      status.textContent = "Switching camera...";

      // Correct parameter name: webcamId
      const newTrack = await VideoSDK.createCameraVideoTrack({
        webcamId: selectedId,
        optimizationMode: "motion"
      });

      await meeting.changeWebcam(newTrack);

      // Reattach to video element to avoid black screen
      const mediaStream = new MediaStream();
      mediaStream.addTrack(newTrack);
      video.srcObject = mediaStream;
      await video.play();

      // Stop old track
      if (customTrack) customTrack.stop();
      customTrack = newTrack;

      status.textContent = "🔴 LIVE";
      console.log("Camera switched to:", selectedId);

    } catch (err) {
      console.error("Failed to switch camera:", err);
      status.textContent = "❌ Switch failed: " + err.message;
    }
  }
});
</script>
</body>
</html>
