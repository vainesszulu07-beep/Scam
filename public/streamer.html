<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Token Test</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  button { padding: 10px 16px; cursor: pointer; }
  #output { margin-top: 10px; white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>

<h2>🎯 Token Generator Test</h2>
<button id="getTokenBtn">Get Token</button>
<div id="output">Token will appear here...</div>

<script type="module">
const BACKEND_URL = "https://scamming-lg3v.onrender.com"; // replace with your backend

const output = document.getElementById("output");
document.getElementById("getTokenBtn").onclick = async () => {
  try {
    output.textContent = "Fetching token...";

    // Example payload — userId & roomId can be anything for test
    const payload = {
      userId: "test-user-123",
      roomId: "test-room-456",
      role: "host"
    };

    const resp = await fetch(`${BACKEND_URL}/api/token`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();

    if (!data.success) {
      output.textContent = "❌ Error:\n" + JSON.stringify(data, null, 2);
      return;
    }

    output.textContent = "✅ Token generated:\n" + data.token + "\n\nPayload:\n" + JSON.stringify(data.payload, null, 2);

  } catch (err) {
    output.textContent = "❌ Fetch error:\n" + err.message;
  }
};
</script>

</body>
</html>
