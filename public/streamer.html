<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live Instant Switch (Native)</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; text-align: center; }
  video { width: 100%; height: 55vh; background: black; margin-bottom: 10px; }
  button, select { padding: 12px; width: 90%; margin: 10px; border: none; border-radius: 8px; font-weight: bold; }
  #start { background: green; color: white; }
  #stop { background: red; color: white; }
  #cameraSelect { background: #007bff; color: white; }
  #status { padding: 10px; background: white; }
</style>
</head>
<body>
<h2>🎥 Go Live Instant Switch</h2>
<video id="video" autoplay muted playsinline></video>
<div id="status">Ready...</div>
<button id="start">Start Stream</button>
<button id="stop" disabled>Stop Stream</button>
<select id="cameraSelect"><option>Loading cameras...</option></select>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const status = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraSelect = document.getElementById("cameraSelect");

let meeting = null;
let currentUserId = null;
let customTrack = null;

// Stop track safely
async function stopCustomTrack(track) {
  if (!track) return;
  try {
    if (track.track) track.track.stop();
    else if (track.stream) track.stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    console.warn("Failed to stop track:", err);
  }
}

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

// Load cameras into dropdown
async function loadCameras() {
  try {
    const cameras = await VideoSDK.getCameras();
    cameraSelect.innerHTML = "";
    if (!cameras || cameras.length === 0) {
      cameraSelect.innerHTML = "<option>No cameras found</option>";
      return;
    }
    cameras.forEach(cam => {
      const option = document.createElement("option");
      option.value = cam.deviceId;
      option.textContent = cam.label || "Unknown Camera";
      cameraSelect.appendChild(option);
    });
  } catch (err) {
    console.error("Failed to get cameras:", err);
    cameraSelect.innerHTML = "<option>No cameras found</option>";
  }
}

function attachVideo(participant) {
  participant.on("stream-enabled", (stream) => {
    if (stream.kind === "video") {
      const rawTrack = stream.track;
      if (rawTrack) {
        video.srcObject = new MediaStream([rawTrack]);
        video.play();
        status.textContent = "🔴 LIVE";
      }
    }
  });
}

// Start Stream
startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    status.textContent = "Authorizing...";
    currentUserId = await getUser();

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();
    if (!data.success) throw new Error("Failed to create room");

    await VideoSDK.config(data.hostToken);
    status.textContent = "Setting up camera...";

    // Initial track
    const initTrack = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720 },
      audio: false
    });
    const rawTrack = initTrack.getVideoTracks()[0];
    customTrack = { track: rawTrack };

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: true,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      status.textContent = "Connecting stream...";
      stopBtn.disabled = false;

      let waited = 0;
      while (!meeting.localParticipant && waited < 5000) {
        await new Promise(r => setTimeout(r, 50));
        waited += 50;
      }
      if (!meeting.localParticipant) throw new Error("Local participant not ready");

      await meeting.replaceVideoTrack({ track: rawTrack });
      video.srcObject = new MediaStream([rawTrack]);
      video.play();

      await loadCameras();
    });

    meeting.on("participant-joined", participant => {
      if (participant.id === meeting.localParticipant.id) attachVideo(participant);
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      status.textContent = "Stream ended";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    meeting.on("error", err => {
      console.error("SDK Error:", err);
      status.textContent = "❌ Connection error";
    });

  } catch (err) {
    console.error(err);
    status.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// Stop Stream
stopBtn.onclick = async () => {
  try {
    status.textContent = "Stopping stream...";
    if (meeting) meeting.leave();
    await stopCustomTrack(customTrack);
    customTrack = null;
    video.srcObject = null;
    status.textContent = "🛑 Stream Ended";
    startBtn.disabled = false;
    stopBtn.disabled = true;
  } catch (err) {
    console.error(err);
    status.textContent = "❌ Failed to stop cleanly: " + err.message;
  }
};

// Instant Camera Switch (native getUserMedia)
cameraSelect.addEventListener("change", async (e) => {
  const selectedId = e.target.value;
  if (!meeting || !selectedId) return;

  const oldTrack = customTrack;
  status.textContent = "Switching...";

  try {
    // Get new track natively
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: selectedId }, width: 1280, height: 720 }
    });
    const newRawTrack = newStream.getVideoTracks()[0];

    // Update YOUR preview immediately
    video.srcObject = new MediaStream([newRawTrack]);
    await video.play();

    // Swap for viewers
    await meeting.replaceVideoTrack({ track: newRawTrack });

    // Update reference
    customTrack = { track: newRawTrack };

    // Stop old track after new one is live
    if (oldTrack) await stopCustomTrack(oldTrack);

    status.textContent = "🔴 LIVE";
    console.log("Switch complete");
  } catch (err) {
    console.error("Instant switch failed:", err);
    status.textContent = "❌ Camera Error";
    if (oldTrack && oldTrack.track) video.srcObject = new MediaStream([oldTrack.track]);
  }
});
</script>
</body>
</html>
