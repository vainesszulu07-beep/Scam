<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoSDK Live Stream</title>
<style>
  body { font-family: Arial; padding: 20px; background: #f4f4f4; }
  video { width: 100%; height: 60vh; background: black; margin-bottom: 10px; }
  button { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
  #output { margin-top: 10px; white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>🎥 VideoSDK Live Stream</h2>
<video id="video" autoplay muted playsinline></video>

<div>
  <button id="start">Start Stream</button>
  <button id="stop">Stop Stream</button>
</div>

<div id="output">Ready...</div>

<!-- ✅ Correct VideoSDK JS library -->
<script src="https://videosdk.live"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// -------------------------
// Supabase
// -------------------------
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const video = document.getElementById("video");
const output = document.getElementById("output");
let meeting = null;

// -------------------------
// Get current user session
// -------------------------
async function getUserSession() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error) throw error;
  if (!session) throw new Error("❌ No active session found");
  return session.user.id;
}

// -------------------------
// Start Stream
// -------------------------
document.getElementById("start").onclick = async () => {
  try {
    output.textContent = "Getting session...";
    const userId = await getUserSession();
    output.textContent = `✅ Session found! UserID: ${userId}\nCreating room...`;

    // Call your backend to get roomId + hostToken
    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error(JSON.stringify(data));

    const { roomId, hostToken } = data;
    output.textContent = `✅ Room created!\nRoomID: ${roomId}`;

    // Initialize VideoSDK meeting directly
    VideoSDK.config(hostToken);

    meeting = VideoSDK.initMeeting({
      meetingId: roomId,
      name: "Host User",
      micEnabled: true,
      webcamEnabled: true,
      participantId: userId
    });

    await meeting.join();

    meeting.on("local-participant-joined", (participant) => {
      output.textContent += "\n✅ LIVE!";

      participant.on("stream-enabled", (streamObj) => {
        if (streamObj.kind === "video") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(streamObj.track);
          video.srcObject = mediaStream;
        }
      });
    });

  } catch (err) {
    output.textContent = "❌ ERROR: " + err.message;
    console.error(err);
  }
};

// -------------------------
// Stop Stream
// -------------------------
document.getElementById("stop").onclick = async () => {
  if (meeting) await meeting.leave();
  video.srcObject = null;
  output.textContent = "🛑 Stopped";
};
</script>

</body>
</html>
