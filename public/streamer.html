<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Load VideoSDK</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f0f0; }
        #status { font-weight: bold; padding: 20px; border-radius: 8px; display: inline-block; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div id="status" class="loading">⏳ Attempting to force-load VideoSDK v0.7.0...</div>

    <script>
        (function() {
            const statusEl = document.getElementById('status');
            const sdkUrl = "https://sdk.videosdk.live/js-sdk/0.7.0/videosdk.js";

            // Force dynamic injection
            const script = document.createElement('script');
            script.src = sdkUrl;
            script.type = 'text/javascript';
            script.async = true;

            script.onload = function() {
                if (window.VideoSDK) {
                    statusEl.textContent = "✅ VideoSDK v0.7.0 loaded successfully!";
                    statusEl.className = "success";
                    console.log("VideoSDK Object:", window.VideoSDK);
                } else {
                    statusEl.textContent = "⚠️ Script loaded but 'VideoSDK' object is missing.";
                    statusEl.className = "error";
                }
            };

            script.onerror = function() {
                statusEl.textContent = "❌ Failed to load SDK. Check your network or if the CDN is blocked.";
                statusEl.className = "error";
            };

            document.head.appendChild(script);
        })();
    </script>

</body>
</html>
