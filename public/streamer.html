<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaptive HD Stream with Quality Bar</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #121212; color: white; text-align: center; }
  video { width: 100%; height: 55vh; background: #000; object-fit: contain; }
    
  /* Quality Bar Styling */
  .quality-container { padding: 10px; background: #1e1e1e; border-bottom: 1px solid #333; }
  #quality-bar {   
    height: 8px; width: 100%; background: #444; border-radius: 4px; overflow: hidden; margin-bottom: 5px;  
  }
  #quality-fill {   
    height: 100%; width: 33%; background: #ff1744; transition: 0.5s ease; /* Starts low, climbs high */  
  }
  #quality-label { font-size: 12px; font-weight: bold; text-transform: uppercase; }

  .controls { padding: 20px; }
  button {
    padding: 15px; width: 80%; max-width: 300px; border: none; border-radius: 50px;   
    font-weight: bold; cursor: pointer; transition: 0.3s;
  }
  #start { background: #00c853; color: white; }
  #stop { background: #ff1744; color: white; margin-top: 10px; }
  button:disabled { background: #444; color: #888; }
</style>
</head>
<body>

<div class="quality-container">
  <div id="quality-bar"><div id="quality-fill"></div></div>
  <div id="quality-label">SIGNAL: SEARCHING...</div>
</div>

<video id="video" autoplay muted playsinline></video>

<div class="controls">
  <button id="start">GO LIVE (ADAPTIVE HD)</button>
  <button id="stop" disabled>END STREAM</button>
</div>

<script src="https://videosdk.live"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co", // FULL Supabase URL
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou" // FULL Supabase Publishable Key
);

const video = document.getElementById("video");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const qualityFill = document.getElementById("quality-fill");
const qualityLabel = document.getElementById("quality-label");

let meeting = null, videoTrack = null, audioTrack = null, currentUserId = null;

// Updates the visual bar based on SDK quality layers
function updateQualityUI(quality) {
  const levels = {   
    'HIGH': { width: '100%', color: '#00c853', text: 'SIGNAL: EXCELLENT (1080P)' },
    'MEDIUM': { width: '66%', color: '#ffea00', text: 'SIGNAL: GOOD (720P)' },
    'LOW': { width: '33%', color: '#ff1744', text: 'SIGNAL: POOR (360P)' }
  };
  const config = levels[quality] || levels['LOW'];
  qualityFill.style.width = config.width;
  qualityFill.style.background = config.color;
  qualityLabel.textContent = config.text;
  qualityLabel.style.color = config.color;
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error("Login required");
    currentUserId = session.user.id;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", { // FULL room creation URL
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUserId })
    });
    const data = await res.json();

    await VideoSDK.config(data.hostToken);

    // 1. Force the highest track but enable 3 layers for "dripping"
    videoTrack = await VideoSDK.createCameraVideoTrack({
      encoderConfig: "h1080p_30fps",
      bitrateMode: "high_quality",
      multiStream: true, // Key for searching the best quality
      maxLayer: 3        // High, Med, Low
    });

    audioTrack = await VideoSDK.createMicrophoneAudioTrack({ encoderConfig: "high_quality" });

    meeting = VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: currentUserId,
      micEnabled: false,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      stopBtn.disabled = false;
      while (!meeting.localParticipant) await new Promise(r => setTimeout(r, 100));

      await meeting.enableWebcam(videoTrack);
      await meeting.enableMic(audioTrack);

      // 2. SEARCH & MONITOR: Listen for automatic quality shifts
      meeting.localParticipant.on("video-quality-changed", (data) => {
        updateQualityUI(data.currentQuality);
      });

      meeting.localParticipant.on("stream-enabled", (stream) => {
        if (stream.kind === "video") {
          video.srcObject = new MediaStream([stream.track]);
          // Force attempt the highest tier once joined
          meeting.localParticipant.setQuality("high");   
          updateQualityUI("HIGH");
        }
      });

      await supabase.from("profile").update({ is_live: true, videosdk_room_id: data.roomId }).eq("id", currentUserId);
    });

  } catch (err) {
    qualityLabel.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

stopBtn.onclick = async () => {
  await supabase.from("profile").update({ is_live: false }).eq("id", currentUserId);
  if (meeting) meeting.leave();
  if (videoTrack) videoTrack.stop();
  if (audioTrack) audioTrack.stop();
  video.srcObject = null;
  qualityLabel.textContent = "STREAM ENDED";
  qualityFill.style.width = "0%";
  startBtn.disabled = false;
  stopBtn.disabled = true;
};
</script>
</body>
</html>
