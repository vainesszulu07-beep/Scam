
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: Arial, sans-serif;
}

.login-container {
    width: 90%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
    color: #171717;
}

p {
    color: #777;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 7px;
    background: #171717;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="login-container">

    <h2>Dashboard Login</h2>
    <p>Enter your account number and password.</p>

    <form id="loginForm">

        <input
            type="text"
            id="number"
            placeholder="Account Number"
            inputmode="numeric"
            pattern="[0-9]+"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" role="status"></div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// SUPABASE CREDENTIALS
const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";

// INITIALIZE SUPABASE
const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const number = document.getElementById("number").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Checking...";

    try {

        // CALL YOUR POSTGRES FUNCTION
        const { data, error } = await supabase.rpc(
            "get_dashboard_user_id",
            {
                p_password: password,
                p_number: number
            }
        );

        if (error) {
            throw error;
        }

        // RETURNS TABLE produces an array of rows
        const user = data?.[0];

        if (!user?.user_id) {

            message.style.color = "red";
            message.textContent =
                "Login failed. Check your details or contact the administrator.";

            return;
        }

        // STORE USER ID
        localStorage.setItem(
            "user_id",
            user.user_id
        );

        message.style.color = "green";
        message.textContent = "Login successful!";

        // OPEN DASHBOARD
        window.location.href = "user_id.html";

    } catch (error) {

        console.error("Login error:", error);

        message.style.color = "red";
        message.textContent =
            "Unable to connect. Please try again.";

    } finally {

        button.disabled = false;
        button.textContent = "Login";

    }

});

</script>

</body>
</html>
