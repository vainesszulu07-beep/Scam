<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f0f2f5;
  height:100vh;
  display:flex;
  justify-content:center;
}

.chat-container{
  width:100%;
  max-width:500px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:white;
  position:relative;
}

/* HEADER */

.chat-header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid #ddd;
  background:white;
  flex-shrink:0;
  position:sticky;
  top:0;
  z-index:2;
}

.back-btn{
  font-size:22px;
  margin-right:10px;
  cursor:pointer;
}

.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}

.chat-header h3{
  margin:0;
  font-size:16px;
}

/* NEW TYPING INDICATOR */

.typing-indicator{

  position:absolute;
  bottom:75px;
  left:12px;

  display:none;
  align-items:center;
  gap:8px;

  padding:6px 10px;
  border-radius:18px;

  background:#f1f5f9;

  font-size:13px;
  color:#333;

}

.typing-avatar{
  width:24px;
  height:24px;
  border-radius:50%;
  object-fit:cover;
}

.typing-name{
  font-weight:600;
}

/* animated dots */

.typing-dots span{
  animation: blink 1.4s infinite;
}

.typing-dots span:nth-child(2){ animation-delay:0.2s }
.typing-dots span:nth-child(3){ animation-delay:0.4s }

@keyframes blink{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:#f0f2f5;
}

.message{
  max-width:70%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;
  word-wrap:break-word;
}

.sent{
  align-self:flex-end;
  background:#1877f2;
  color:white;
}

.received{
  align-self:flex-start;
  background:#e4e6eb;
  color:black;
}

.message img{
  max-width:100%;
  border-radius:12px;
  margin-top:6px;
}

.timestamp{
  display:block;
  font-size:10px;
  margin-top:4px;
  opacity:0.7;
  text-align:right;
}

.read-tick{
  font-size:12px;
  margin-left:4px;
  color:#4fc3f7;
}

/* INPUT */

.chat-input{
  height:65px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  border-top:1px solid #ddd;
  background:white;
  gap:8px;
  position:sticky;
  bottom:0;
}

.chat-input input{
  flex:1;
  border:none;
  background:#f0f2f5;
  padding:12px 16px;
  border-radius:25px;
  outline:none;
}

.chat-input button{
  border:none;
  cursor:pointer;
}

#sendBtn{
  background:#1877f2;
  color:white;
  padding:10px 18px;
  border-radius:25px;
}

</style>
</head>

<body>

<div class="chat-container">

<div class="chat-header">
<div class="back-btn" onclick="history.back()">←</div>
<img id="avatar" src="https://via.placeholder.com/40">
<h3 id="username">Loading...</h3>
</div>

<div class="typing-indicator" id="typingIndicator"></div>

<div class="messages" id="messages"></div>

<div class="chat-input">
<input id="messageInput" placeholder="Message...">
<button id="sendBtn">Send</button>
</div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const typingIndicator = document.getElementById("typingIndicator");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();
if(!session) window.location.href="login.html";

const userId = session.user.id;

let conversationData;
let typingTimeout;

/* LOAD USER */

async function loadUser(){

const { data } = await supabase
.from("conversations")
.select(`
user1_id,
user2_id,
typing,
user1:profile!user1_id(full_name,avatar_url),
user2:profile!user2_id(full_name,avatar_url)
`)
.eq("id", conversationId)
.single();

conversationData = data;

const other = data.user1_id === userId ? data.user2 : data.user1;

username.textContent = other.full_name || "User";
avatar.src = other.avatar_url || "https://via.placeholder.com/40";

}

/* LOAD MESSAGES */

async function loadMessages(){

const { data } = await supabase
.from("messages")
.select("*")
.eq("conversation_id", conversationId)
.order("created_at",{ascending:true});

messagesDiv.innerHTML = "";

data.forEach(addMessage);

}

/* ADD MESSAGE */

function addMessage(msg){

const div = document.createElement("div");

div.classList.add("message");
div.classList.add(msg.sender_id===userId ? "sent" : "received");

div.innerHTML = `
${msg.content || ""}
<span class="timestamp">
${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
</span>
`;

messagesDiv.appendChild(div);

messagesDiv.scrollTop = messagesDiv.scrollHeight;

}

/* SEND */

async function sendMessage(){

const text = input.value.trim();

if(!text) return;

await supabase.from("messages").insert({
conversation_id:conversationId,
sender_id:userId,
content:text
});

input.value="";

}

/* TYPING INPUT EVENT */

input.addEventListener('input', async () => {

const newTyping = { ...(conversationData.typing || {}) };

newTyping[userId] = true;

await supabase.from('conversations')
.update({ typing: newTyping })
.eq('id', conversationId);

clearTimeout(typingTimeout);

typingTimeout = setTimeout(async () => {

const resetTyping = { ...(conversationData.typing || {}) };

resetTyping[userId] = false;

await supabase.from('conversations')
.update({ typing: resetTyping })
.eq('id', conversationId);

}, 1000);

});

/* REALTIME MESSAGES */

supabase.channel("chat-"+conversationId)
.on("postgres_changes",
{event:"INSERT", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}`},
payload => addMessage(payload.new)
).subscribe();

/* REALTIME TYPING */

supabase.channel("conversations")
.on('postgres_changes',
{event:'UPDATE', schema:'public', table:'conversations', filter:`id=eq.${conversationId}`},
payload => {

conversationData.typing = payload.new.typing || {};

const typingUsers = Object.keys(conversationData.typing)
.filter(uid => conversationData.typing[uid]);

if(typingUsers.length){

const uid = typingUsers.find(id => id !== userId) || typingUsers[0];

const user = uid === conversationData.user1_id ? conversationData.user1 : conversationData.user2;

typingIndicator.style.display = "flex";

typingIndicator.innerHTML = `
<img class="typing-avatar" src="${user.avatar_url}">
<span class="typing-name">${user.full_name}</span>
<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
`;

}else{

typingIndicator.style.display = "none";

}

}
).subscribe();

/* INIT */

await loadUser();
await loadMessages();

</script>
</body>
</html>
