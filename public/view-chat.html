<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  height: 100vh;
  display: flex;
  justify-content: center;
}

.chat-container {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: white;
  position: relative;
}

.chat-header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid #ddd;
  background: white;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 2;
}

.back-btn {
  cursor: pointer;
  font-size: 22px;
  margin-right: 10px;
}

.chat-header img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin-right: 10px;
  object-fit: cover;
}

.chat-header h3 {
  margin: 0;
  font-size: 16px;
}

.typing-indicator {
  font-size: 12px;
  color: #65676b;
  margin-left: 10px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #f0f2f5;
  scroll-behavior: smooth;
}

.message {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  word-wrap: break-word;
  position: relative;
  display: inline-block;
}

.sent { align-self: flex-end; background: #1877f2; color: white; }
.received { align-self: flex-start; background: #e4e6eb; color: black; }

.message img { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
.message video { display: none; } /* Hide default video element */

.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 100%;
  margin-top: 6px;
  cursor: pointer;
}

.video-wrapper img {
  width: 100%;
  border-radius: 12px;
  display: block;
}

.play-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.6);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-overlay::before {
  content: '';
  border-style: solid;
  border-width: 12px 0 12px 20px;
  border-color: transparent transparent transparent white;
  margin-left: 3px;
}

.message .timestamp {
  display: block;
  font-size: 10px;
  margin-top: 4px;
  opacity: 0.7;
  text-align: right;
}

.message.sent .read-tick {
  color: #4fc3f7;
  font-size: 12px;
  margin-left: 4px;
  vertical-align: middle;
}

.chat-input {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 8px 12px;
  border-top: 1px solid #ddd;
  background: white;
  flex-shrink: 0;
  position: sticky;
  bottom: 0;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  border: none;
  background: #f0f2f5;
  padding: 12px 16px;
  border-radius: 25px;
  outline: none;
  font-size: 14px;
}

.chat-input button#sendBtn {
  border: none;
  background: #1877f2;
  color: white;
  padding: 10px 18px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 500;
}

.chat-input button#sendBtn:hover { background: #166fe5; }

.chat-input .icon-btn {
  background: #1877f2;
  border: none;
  padding: 8px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chat-input .icon-btn svg { width: 20px; height: 20px; fill: white; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="back-btn" onclick="history.back()">←</div>
    <img id="avatar" src="https://via.placeholder.com/40">
    <h3 id="username">Loading...</h3>
    <span class="typing-indicator" id="typingIndicator"></span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="chat-input">
    <input id="messageInput" placeholder="Message...">
    <button class="icon-btn" id="attachBtn" title="Send Media">
      <svg viewBox="0 0 24 24">
        <path d="M16.5 6.5l-7.79 7.79a3 3 0 104.24 4.24l8.49-8.49a5 5 0 10-7.07-7.07L5.88 12.46"/>
      </svg>
    </button>
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const supabase = createClient("https://eimecuiixwgmpfpedxpr.supabase.co","sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou");

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const typingIndicator = document.getElementById("typingIndicator");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");
if(!conversationId) alert("Conversation not found");

const { data:{session} } = await supabase.auth.getSession();
if(!session) window.location.href="login.html";
const userId = session.user.id;

let conversationData;
let typingTimeout;

async function loadUser(){
  const { data } = await supabase
    .from("conversations")
    .select(`user1_id,user2_id,typing,user1:profile!user1_id(full_name,avatar_url),user2:profile!user2_id(full_name,avatar_url)`)
    .eq("id",conversationId)
    .single();
  conversationData = data;
  const other = data.user1_id===userId?data.user2:data.user1;
  username.textContent = other.full_name || "User";
  avatar.src = other.avatar_url || "https://via.placeholder.com/40";
}

async function loadMessages(){
  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true});
  if(error){ console.error(error); return; }

  const unread = data.filter(msg=>msg.sender_id!==userId&&!msg.read);
  if(unread.length>0){
    const ids = unread.map(msg=>msg.id);
    await supabase.from('messages').update({ read:true }).in('id', ids);
    unread.forEach(msg=>msg.read=true);
  }

  data.forEach(addMessage);
  scrollBottom(false);
}

function addMessage(msg){
  const div = document.createElement("div");
  div.classList.add("message");
  div.classList.add(msg.sender_id===userId?"sent":"received");

  let contentHTML = msg.content || '';
  if(msg.media_url){
    const isVideo = /\.(mp4|webm|ogg)$/i.test(msg.media_url);
    if(isVideo){
      // video wrapper with overlay
      contentHTML += `
      <div class="video-wrapper" onclick="window.location.href='see-video.html?url=${encodeURIComponent(msg.media_url)}'">
        <img src="https://via.placeholder.com/400x250/000000/ffffff?text=Video" alt="Video">
        <div class="play-overlay"></div>
      </div>`;
    } else {
      contentHTML += `<br><img src="${msg.media_url}">`;
    }
  }

  div.innerHTML = `${contentHTML}
    <span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
    ${msg.sender_id===userId?`<span class="read-tick">${msg.read?'✔✔':'✔'}</span>`:''}`;
  messagesDiv.appendChild(div);
}

function scrollBottom(smooth=false){
  messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: smooth?"smooth":"auto"});
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  const { data, error } = await supabase
    .from("messages")
    .insert({ conversation_id:conversationId,sender_id:userId,content:text,read:false });
  if(error) console.error(error);
  else input.value="";
  scrollBottom(true);
}

input.addEventListener('input', async ()=>{
  const newTyping = {...(conversationData.typing||{})};
  newTyping[userId]=true;
  await supabase.from('conversations').update({typing:newTyping}).eq('id',conversationId);

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async ()=>{
    const resetTyping = {...(conversationData.typing||{})};
    resetTyping[userId]=false;
    await supabase.from('conversations').update({typing:resetTyping}).eq('id',conversationId);
  },1000);
});

sendBtn.onclick=sendMessage;
input.addEventListener("keypress", e=>{if(e.key==="Enter") sendMessage();});
attachBtn.onclick=()=>window.location.href=`media-preview.html?conversationId=${conversationId}`;

supabase.channel("chat-"+conversationId)
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${conversationId}`},
      payload=>{addMessage(payload.new);scrollBottom(true);}
  ).subscribe();

supabase.channel("conversations")
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:`id=eq.${conversationId}`},
      payload=>{conversationData.typing=payload.new.typing||{};
      const otherId=conversationData.user1_id===userId?conversationData.user2_id:conversationData.user1_id;
      typingIndicator.textContent=conversationData.typing[otherId]?'Typing...':'';}
  ).subscribe();

await loadUser();
await loadMessages();
</script>
</body>
  </html>
