<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Chat with Last Seen</title>  
<style>  
body{  
  margin:0;  
  font-family:Segoe UI,Arial,sans-serif;  
  background:#f0f2f5;  
  height:100vh;  
  display:flex;  
  justify-content:center;  
}  
.chat-container{  
  width:100%;  
  max-width:500px;  
  height:100vh;  
  display:flex;  
  flex-direction:column;  
  background:white;  
  position:relative;  
}  
.chat-header{  
  height:60px;  
  display:flex;  
  align-items:center;  
  padding:0 12px;  
  border-bottom:1px solid #ddd;  
  background:white;  
  position:relative;  
}  
.back-btn{  
  font-size:22px;  
  margin-right:10px;  
  cursor:pointer;  
}  
.profile-wrapper{  
  position:relative;  
}  
.chat-header img{  
  width:40px;  
  height:40px;  
  border-radius:50%;  
  margin-right:10px;  
  object-fit:cover;  
  position:relative;  
}  
.status-dot{  
  position:absolute;  
  bottom:0;  
  right:0;  
  width:10px;  
  height:10px;  
  border-radius:50%;  
  border:2px solid white;  
  background:grey; /* offline default */  
}  
#lastSeen{  
  position:absolute;  
  top:-4px;  
  left:50px;  
  font-size:10px;  
  color:grey;  
  font-weight:500;  
  white-space:nowrap;  
}  
.chat-header h3{  
  margin:0;  
  font-size:16px;  
}  
.typing-indicator{  
  position:absolute;  
  bottom:75px;  
  left:12px;  
  display:none;  
  align-items:center;  
  gap:8px;  
  padding:6px 10px;  
  border-radius:18px;  
  background:#f1f5f9;  
  font-size:13px;  
  z-index:1001;  
}  
.typing-avatar{  
  width:24px;  
  height:24px;  
  border-radius:50%;  
  object-fit:cover;  
}  
.typing-name{  
  font-weight:600;  
}  
.typing-dots span{  
  animation:blink 1.4s infinite;  
}  
.typing-dots span:nth-child(2){animation-delay:.2s}  
.typing-dots span:nth-child(3){animation-delay:.4s}  
@keyframes blink{0%{opacity:0}50%{opacity:1}100%{opacity:0}}  
.messages{  
  flex:1;  
  overflow-y:auto;  
  padding:12px;  
  display:flex;  
  flex-direction:column;  
  gap:8px;  
  background:#f0f2f5;  
}  
.message{  
  max-width:70%;  
  padding:10px 14px;  
  border-radius:18px;  
  font-size:14px;  
  word-wrap:break-word;  
  position:relative;  
  user-select:none;  
}  
.sent{align-self:flex-end;background:#1877f2;color:white;}  
.received{align-self:flex-start;background:#e4e6eb;color:black;}  
.message img{  
  max-width:100%;  
  border-radius:12px;  
  margin-top:6px;  
  cursor:pointer;  
}  
.video-wrapper{  
  position:relative;  
  width:100%;  
  margin-top:6px;  
  cursor:pointer;  
}  
.video-wrapper video{  
  width:100%;  
  border-radius:12px;  
  pointer-events:none;  
}  
.play-overlay{  
  position:absolute;  
  top:50%;  
  left:50%;  
  transform:translate(-50%,-50%);  
  background:rgba(0,0,0,0.6);  
  width:50px;  
  height:50px;  
  border-radius:50%;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
}  
.play-overlay:before{  
  content:'';  
  border-style:solid;  
  border-width:12px 0 12px 20px;  
  border-color:transparent transparent transparent white;  
}  
.timestamp{  
  display:block;  
  font-size:10px;  
  margin-top:4px;  
  opacity:0.7;  
  text-align:right;  
}  
.read-tick{  
  font-size:12px;  
  margin-left:4px;  
  color:#4fc3f7;  
}  
.chat-input{  
  height:65px;  
  display:flex;  
  align-items:center;  
  padding:8px 12px;  
  border-top:1px solid #ddd;  
  background:white;  
  gap:8px;  
}  
.chat-input input{  
  flex:1;  
  border:none;  
  background:#f0f2f5;  
  padding:12px 16px;  
  border-radius:25px;  
  outline:none;  
}  
#sendBtn{  
  background:#1877f2;  
  color:white;  
  padding:10px 18px;  
  border:none;  
  border-radius:25px;  
  cursor:pointer;  
}  
.icon-btn{  
  background:#1877f2;  
  padding:8px;  
  border-radius:50%;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
  border:none;  
  cursor:pointer;  
}  
.icon-btn svg{  
  width:20px;  
  height:20px;  
  fill:white;  
}  
.longpress-menu {  
  position: absolute;  
  display: flex;  
  gap: 5px;  
  background: white;  
  border: 1px solid #ccc;  
  border-radius: 8px;  
  padding: 4px 6px;  
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);  
  z-index: 1000;  
  font-size: 14px;  
  max-width: 180px;  
  word-wrap: break-word;  
}  
.longpress-menu button {  
  background: none;  
  border: none;  
  cursor: pointer;  
  padding: 4px 8px;  
  border-radius: 4px;  
}  
.longpress-menu button:hover {  
  background: #f0f0f0;  
}  
.time-divider{  
  display:flex;  
  align-items:center;  
  text-align:center;  
  font-size:12px;  
  color:#666;  
  margin:12px 0;  
}  
.time-divider::before,  
.time-divider::after{  
  content:'';  
  flex:1;  
  border-bottom:1px solid #ccc;  
}  
.time-divider span{  
  padding:0 10px;  
}  
.hover-time{  
  position:absolute;  
  top:-16px;  
  font-size:10px;  
  opacity:0;  
  transition:opacity .2s;  
}  
.message:hover .hover-time{opacity:1;}  
.sent .hover-time{right:0;color:white;}  
.received .hover-time{left:0;color:#555;}  
.scroll-down-btn{  
  position:absolute;  
  bottom:90px;  
  right:15px;  
  width:40px;  
  height:40px;  
  border-radius:50%;  
  background:#1877f2;  
  color:white;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
  cursor:pointer;  
  font-size:20px;  
  display:none;  
}  
</style>  
</head>  
<body>  
<div class="chat-container">  
  <div class="chat-header">  
    <div class="back-btn" onclick="history.back()">←</div>  
    <div class="profile-wrapper">  
      <img id="avatar">  
      <div class="status-dot" id="statusDot"></div>  
      <div id="lastSeen"></div>  
    </div>  
    <h3 id="username">Loading...</h3>  
  </div>  
  <div id="typingIndicator" class="typing-indicator"></div>  
  <div id="messages" class="messages"></div>  
  <div id="scrollDownBtn" class="scroll-down-btn">↓</div>  
  <div class="chat-input">  
    <input id="messageInput" placeholder="Message...">  
    <button class="icon-btn" id="attachBtn">  
      <svg viewBox="0 0 24 24">  
        <path d="M16.5 6.5l-7.79 7.79a3 3 0 104.24 4.24l8.49-8.49a5 5 0 10-7.07-7.07L5.88 12.46"/>  
      </svg>  
    </button>  
    <button id="sendBtn">Send</button>  
  </div>  
</div>  

<script type="module">  
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";  
  
const supabase = createClient(  
  "https://eimecuiixwgmpfpedxpr.supabase.co",  
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"  
);  
  
const messagesDiv=document.getElementById("messages");  
const input=document.getElementById("messageInput");  
const sendBtn=document.getElementById("sendBtn");  
const attachBtn=document.getElementById("attachBtn");  
const username=document.getElementById("username");  
const avatar=document.getElementById("avatar");  
const lastSeenDiv=document.getElementById("lastSeen");  
const statusDot=document.getElementById("statusDot");  
const typingIndicator=document.getElementById("typingIndicator");  
const scrollBtn=document.getElementById("scrollDownBtn");  
  
const params=new URLSearchParams(window.location.search);  
const conversationId=params.get("conversationId");  
  
const {data:{session}}=await supabase.auth.getSession();  
const userId=session.user.id;  
  
let conversationData;  
let typingTimeout;  
let lastDateDivider=null;  
  
// ---------------- Helper: Lusaka time as UTC ----------------  
function nowLusakaUTC() {  
  const nowLocal = new Date();  
  const offsetMinutes = -120;  
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);  
}  
  
// ---------------- Update own last_seen ----------------  
async function updateLastSeen() {  
  const lusakaUTC = nowLusakaUTC().toISOString();  
  const { error } = await supabase  
    .from("profile")  
    .update({ last_seen: lusakaUTC })  
    .eq("id", userId);  
  if(error) console.error("Failed to update last_seen:", error);  
}  
updateLastSeen();  
setInterval(updateLastSeen, 30000); // repeat every 30s  
  
// ---------------- Check if other user is active ----------------  
function isActive(lastSeenUTC){  
  if(!lastSeenUTC) return false;  
  const nowUTC = nowLusakaUTC();  
  const diffMs = nowUTC.getTime() - new Date(lastSeenUTC).getTime();  
  const diffMinutes = diffMs / 1000 / 60;  
  return diffMinutes < 2;  
}  
  
// ---------------- Load user ----------------  
async function loadUser(){  
  const {data} = await supabase  
  .from("conversations")  
  .select(`  
    user1_id,  
    user2_id,  
    typing,  
    user1:profile!user1_id(full_name,avatar_url,last_seen),  
    user2:profile!user2_id(full_name,avatar_url,last_seen)  
  `)  
  .eq("id",conversationId)  
  .single();  
  
  conversationData=data;  
  const other=data.user1_id===userId?data.user2:data.user1;  
  
  username.textContent=other.full_name;  
  avatar.src=other.avatar_url;  
  
  // Show online/offline dot & last seen  
  if(isActive(other.last_seen)){  
    statusDot.style.background="limegreen";  
    lastSeenDiv.textContent="";  
  } else {  
    statusDot.style.background="grey";  
    lastSeenDiv.textContent=other.last_seen ? "Last seen: "+new Date(other.last_seen).toLocaleString() : "Never";  
  }  
}  
  
// ---------------- Messages ----------------  
function scrollBottom(){messagesDiv.scrollTop=messagesDiv.scrollHeight;}  
function formatDivider(dateStr){  
  const msgDate=new Date(dateStr);  
  const today=new Date();  
  const startToday=new Date(today.getFullYear(),today.getMonth(),today.getDate());  
  const startMsg=new Date(msgDate.getFullYear(),msgDate.getMonth(),msgDate.getDate());  
  const diff=(startToday-startMsg)/(1000*60*60*24);  
  if(diff===0){return msgDate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}  
  if(diff===1){return "Yesterday";}  
  return msgDate.toDateString();  
}  
function addMessage(msg){  
  const msgDate=new Date(msg.created_at).toDateString();  
  if(lastDateDivider!==msgDate){  
    const divider=document.createElement("div");  
    divider.className="time-divider";  
    divider.innerHTML="<span>"+formatDivider(msg.created_at)+"</span>";  
    messagesDiv.appendChild(divider);  
    lastDateDivider=msgDate;  
  }  
  const div=document.createElement("div");  
  div.classList.add("message");  
  if(msg.sender_id===userId){div.classList.add("sent");}  
  else{div.classList.add("received");}  
  
  const hoverTime=document.createElement("div");  
  hoverTime.className="hover-time";  
  hoverTime.textContent=new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});  
  div.appendChild(hoverTime);  
  
  let content=msg.content||"";  
  if(msg.media_url){  
    const isVideo=/\.(mp4|webm|ogg)$/i.test(msg.media_url);  
    if(isVideo){  
      content+=`<div class="video-wrapper"><video muted preload="metadata"><source src="${msg.media_url}"></video><div class="play-overlay"></div></div>`;  
    }else{  
      content+=`<img src="${msg.media_url}">`;  
    }  
  }  
  
  div.innerHTML+=content+`<span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>${msg.sender_id===userId?`<span class="read-tick">${msg.read?'✔✔':'✔'}</span>`:''}`;  
  div.querySelectorAll("img").forEach(img=>{img.onclick=()=>window.location.href=`see-image.html?url=${encodeURIComponent(img.src)}`;});  
  div.querySelectorAll(".video-wrapper").forEach(v=>{v.onclick=()=>window.location.href=`see-video.html?url=${encodeURIComponent(v.querySelector("source").src)}`;});  
  messagesDiv.appendChild(div);  
  scrollBottom();  
}  
  
async function loadMessages(){  
  const { data: messages, error } = await supabase.rpc("get_conversation_messages", {
    p_conversation_id: conversationId
  });
  
  if (error) console.error("Error fetching messages:", error);

  messagesDiv.innerHTML="";  
  lastDateDivider=null;  
  
  const data = messages || [];
  data.forEach(addMessage);  
  
  // Keep standard update logic for unread if you don't have an RPC for read statuses
  const unreadIds=data.filter(m=>m.sender_id!==userId&&!m.read).map(m=>m.id);  
  if(unreadIds.length){  
    await supabase.from("messages").update({read:true}).in("id",unreadIds);  
  }  
}  
  
async function sendMessage(){  
  const text=input.value.trim();  
  if(!text) return;  
  
  const { data, error } = await supabase.rpc("send_message", {
    p_conversation_id: conversationId,
    p_content: text,
    p_media_url: null,
    p_media_id: null
  });

  if (error) {
    console.error("Error sending message:", error);
    return;
  }

  input.value="";  

  // Clear typing indicator via RPC
  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: false
  });
}  
  
input.addEventListener('input',async()=>{  
  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: true
  });

  clearTimeout(typingTimeout);  
  typingTimeout=setTimeout(async()=>{  
    await supabase.rpc("set_conversation_typing", {
      p_conversation_id: conversationId,
      p_is_typing: false
    }); 
  },1000);  
});  
  
messagesDiv.addEventListener("scroll",()=>{  
  const distance=messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight;  
  scrollBtn.style.display=distance>300?"flex":"none";  
});  
  
scrollBtn.onclick=()=>scrollBottom();  
  
supabase.channel("chat-"+conversationId)  
.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${conversationId}`},payload=>{addMessage(payload.new);})  
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:`id=eq.${conversationId}`},payload=>{  
  conversationData.typing=payload.new.typing||{};  
  const typingUsers=Object.keys(conversationData.typing).filter(uid=>conversationData.typing[uid]);  
  if(typingUsers.length){  
    const uid=typingUsers.find(id=>id!==userId)||typingUsers[0];  
    const user=uid===conversationData.user1_id?conversationData.user1:conversationData.user2;  
    typingIndicator.style.display="flex";  
    typingIndicator.innerHTML=`  
      <img class="typing-avatar" src="${user.avatar_url}">  
      <span class="typing-name">${user.full_name}</span>  
      <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>  
    `;  
  } else {  
    typingIndicator.style.display="none";  
  }  
}).subscribe();  
  
sendBtn.onclick=sendMessage;  
input.addEventListener("keypress",e=>{if(e.key==="Enter")sendMessage();});  
attachBtn.onclick=()=>{location.href=`media-preview.html?conversationId=${conversationId}`;};  
  
await loadUser();  
await loadMessages();  
</script>  
</body>  
</html>
