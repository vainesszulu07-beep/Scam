<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>

body{
  font-family: Arial, Helvetica, sans-serif;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-container{
  width:420px;
  background:white;
  border-radius:12px;
  padding:20px;
  position:relative;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

/* typing indicator */

.typing-indicator{

  position:absolute;
  bottom:60px;
  left:20px;

  display:none;
  align-items:center;
  gap:10px;

  padding:8px 12px;
  border-radius:20px;

  background:#f1f5f9;

  font-size:14px;
  color:#333;

}

/* avatar */

.typing-avatar{

  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;

}

/* name */

.typing-name{

  font-weight:600;

}

/* animated dots */

.typing-dots span{

  animation: blink 1.4s infinite;
}

.typing-dots span:nth-child(2){
  animation-delay:0.2s;
}

.typing-dots span:nth-child(3){
  animation-delay:0.4s;
}

@keyframes blink{

  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}

}

/* input */

input{

  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;

}

</style>
</head>

<body>

<div class="chat-container">

<div class="typing-indicator" id="typingIndicator"></div>

<input id="messageInput" placeholder="Type something...">

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const input = document.getElementById("messageInput");
const typingIndicator = document.getElementById("typingIndicator");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data: { session } } = await supabase.auth.getSession();

if(!session){
  window.location.href = "login.html";
}

const userId = session.user.id;

let typingTimeout;

/* load profiles */

let profiles = {};

const { data: profileData } = await supabase
.from("profile")
.select("id, full_name, avatar_url");

profileData.forEach(p=>{
  profiles[p.id] = p;
});

/* typing update */

async function setTyping(isTyping){

const { data: conv } = await supabase
.from('conversations')
.select('typing')
.eq('id', conversationId)
.single();

const currentTyping = conv.typing || {};
currentTyping[userId] = isTyping;

await supabase
.from('conversations')
.update({ typing: currentTyping })
.eq('id', conversationId);

}

/* input event */

input.addEventListener('input', async () => {

await setTyping(true);

clearTimeout(typingTimeout);
typingTimeout = setTimeout(()=> setTyping(false),500);

});

/* realtime */

supabase.channel("conversations")
.on('postgres_changes',
{ event:'UPDATE', schema:'public', table:'conversations', filter:`id=eq.${conversationId}` },
payload => {

const typingData = payload.new.typing || {};

const typingUsers = Object.entries(typingData)
.filter(([uid,t]) => t)
.map(([uid]) => profiles[uid]);

if(typingUsers.length){

typingIndicator.style.display = "flex";

typingIndicator.innerHTML = typingUsers.map(user=>`
<img class="typing-avatar" src="${user?.avatar_url || ''}">
<span class="typing-name">${user?.full_name || 'User'}</span>
<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
`).join("");

}else{

typingIndicator.style.display = "none";

}

})
.subscribe();

</script>

</body>
</html>
