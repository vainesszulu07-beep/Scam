<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;height:100vh;}
.chat-container{width:100%;max-width:500px;height:100vh;display:flex;flex-direction:column;background:white;position:relative;}
.chat-header{height:60px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #ddd;background:white;position:sticky;top:0;z-index:2;}
.back-btn{font-size:22px;margin-right:10px;cursor:pointer;}
.chat-header h3{margin:0;font-size:16px;}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f0f2f5;}
.message{max-width:70%;padding:10px 14px;border-radius:18px;font-size:14px;position:relative;}
.sent{align-self:flex-end;background:#1877f2;color:white;}
.received{align-self:flex-start;background:#e4e6eb;color:black;}
.timestamp{display:block;font-size:10px;margin-top:4px;opacity:0.7;text-align:right;}
.status-tick{font-size:12px;margin-left:4px;color:#999;}
.status-tick.read{color:#4fc3f7;}
.chat-input{height:65px;display:flex;align-items:center;padding:8px 12px;border-top:1px solid #ddd;background:white;gap:8px;position:sticky;bottom:0;}
.chat-input input{flex:1;border:none;background:#f0f2f5;padding:12px 16px;border-radius:25px;outline:none;}
#sendBtn{background:#1877f2;color:white;padding:10px 18px;border-radius:25px;border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="back-btn" onclick="history.back()">←</div>
    <h3 id="username">Chat</h3>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-input">
    <input id="messageInput" placeholder="Message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();
if(!session) window.location.href="login.html";
const userId = session.user.id;

// Render messages
function addMessage(msg){
  if(document.getElementById("msg-"+msg.id)) return; // avoid duplicates
  const div = document.createElement("div");
  div.classList.add("message", msg.sender_id===userId ? "sent" : "received");
  div.id = "msg-"+msg.id;

  let tick = "";
  if(msg.sender_id===userId){
    if(msg.read){ tick='<span class="status-tick read">✔✔</span>'; }
    else if(msg.delivered){ tick='<span class="status-tick">✔✔</span>'; }
    else{ tick='<span class="status-tick">✔</span>'; }
  }

  div.innerHTML = `
    ${msg.content}
    <span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
    ${tick}
  `;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// Load all messages & mark delivered
async function loadMessages(){
  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("conversation_id", conversationId)
    .order("created_at",{ascending:true});
  messagesDiv.innerHTML="";
  data.forEach(addMessage);

  // mark delivered messages that are not yours
  await supabase.from("messages")
    .update({ delivered:true })
    .eq("conversation_id", conversationId)
    .neq("sender_id", userId)
    .eq("delivered", false);
}

// Send new message
async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  const { data } = await supabase.from("messages").insert({
    conversation_id: conversationId,
    sender_id: userId,
    content: text,
    delivered:false,
    read:false
  }).select().single();
  addMessage(data);
  input.value="";
}

// Mark messages as read when window focused
async function markRead(){
  await supabase.from("messages")
    .update({ read:true })
    .eq("conversation_id", conversationId)
    .neq("sender_id", userId)
    .eq("read", false);
}
window.addEventListener('focus', markRead);

// Realtime updates for new and updated messages
supabase.channel("public:messages")
  .on("postgres_changes",
      {event:"INSERT", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}`},
      payload => addMessage(payload.new)
  )
  .on("postgres_changes",
      {event:"UPDATE", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}`},
      payload => addMessage(payload.new)
  )
  .subscribe();

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e=>{if(e.key==="Enter") sendMessage();});

await loadMessages();
</script>
</body>
  </html>
