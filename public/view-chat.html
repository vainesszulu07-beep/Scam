<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#e5ddd5;
  height:100vh;
  display:flex;
  justify-content:center;
}

.chat-container{
  width:100%;
  max-width:500px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:white;
}

/* HEADER */
.chat-header{
  height:60px;
  display:flex;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #ddd;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
}

.back-btn{
  font-size:22px;
  margin-right:10px;
  cursor:pointer;
}

.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}

.chat-header h3{
  margin:0;
  font-size:16px;
}

.typing-indicator{
  font-size:12px;
  color:#777;
  margin-left:10px;
}

/* MESSAGES */
.messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:#e5ddd5;
  scroll-behavior:smooth;
}

.message{
  max-width:75%;
  padding:10px 14px;
  border-radius:16px;
  font-size:14px;
  word-wrap:break-word;
  position:relative;
}

.sent{
  align-self:flex-end;
  background:#1877f2;
  color:white;
}

.received{
  align-self:flex-start;
  background:white;
  border:1px solid #ddd;
}

.message img,
.message video{
  max-width:220px;
  border-radius:10px;
  margin-top:5px;
}

.timestamp{
  display:block;
  font-size:10px;
  opacity:0.7;
  margin-top:3px;
  text-align:right;
}

/* READ TICKS */
.read-tick{
  font-size:12px;
  vertical-align:middle;
  margin-left:4px;
  color:#4fc3f7;
}

/* INPUT */
.chat-input{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

.chat-input input{
  flex:1;
  border:none;
  background:#f0f2f5;
  padding:12px;
  border-radius:20px;
  font-size:14px;
  outline:none;
}

.icon-btn{
  border:none;
  background:none;
  cursor:pointer;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#sendBtn{
  background:#1877f2;
  color:white;
  padding:10px 18px;
  border-radius:18px;
  font-weight:600;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="back-btn" onclick="history.back()">←</div>
    <img id="avatar" src="https://via.placeholder.com/40">
    <h3 id="username">Loading...</h3>
    <span class="typing-indicator" id="typingIndicator"></span>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- INPUT -->
  <div class="chat-input">

    <button id="cameraBtn" class="icon-btn" title="Camera">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 5c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5
                 5 2.24 5 5-2.24 5-5 5zm6-11h-3.17l-1.83-2h-4l-1.83 2h-3.17c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-12c0-1.1-.9-2-2-2z"/>
      </svg>
    </button>

    <button id="attachBtn" class="icon-btn" title="Attach File">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path d="M16.5 6.5l-8.49 8.49c-1.17 1.17-3.07 1.17-4.24 0s-1.17-3.07 0-4.24l8.49-8.49
                 c1.17-1.17 3.07-1.17 4.24 0 1.17 1.17 1.17 3.07 0 4.24zM14.79 5.21c-.39-.39-1.02-.39-1.41 0l-8.49 8.49
                 c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l8.49-8.49c.39-.39.39-1.02 0-1.41z"/>
      </svg>
    </button>

    <input type="file" id="fileInput" style="display:none" accept="image/*,video/*">

    <input id="messageInput" placeholder="Message..." type="text">

    <button id="sendBtn">Send</button>

  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const typingIndicator = document.getElementById("typingIndicator");

const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");
const cameraBtn = document.getElementById("cameraBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();
if(!session) window.location.href="login.html";

const userId = session.user.id;
let conversationData;
let typingTimeout;

/* ----------------- LOAD USER ----------------- */
async function loadUser(){
  const { data } = await supabase
    .from("conversations")
    .select(`user1_id,user2_id,typing,
      user1:profile!user1_id(full_name,avatar_url),
      user2:profile!user2_id(full_name,avatar_url)`)
    .eq("id",conversationId)
    .single();
  
  conversationData = data;
  const other = data.user1_id === userId ? data.user2 : data.user1;
  username.textContent = other.full_name || "User";
  avatar.src = other.avatar_url || "https://via.placeholder.com/40";
}

/* ----------------- LOAD MESSAGES ----------------- */
async function loadMessages(){
  messagesDiv.innerHTML="";
  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true});
  
  data.forEach(addMessage);
  scrollBottom();
}

/* ----------------- ADD MESSAGE ----------------- */
function addMessage(msg){
  const div = document.createElement("div");
  div.classList.add("message");
  if(msg.sender_id===userId) div.classList.add("sent");
  else div.classList.add("received");

  const time = new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  if(msg.media_url){
    if(msg.media_url.includes("video")||msg.media_url.includes(".mp4")){
      div.innerHTML = `<video src="${msg.media_url}" controls></video>
                       <span class="timestamp">${time}</span>
                       ${msg.read?'✔✔':''}`;
    } else {
      div.innerHTML = `<img src="${msg.media_url}">
                       <span class="timestamp">${time}</span>
                       ${msg.read?'✔✔':''}`;
    }
  } else {
    div.innerHTML = `${msg.content || ""}
                     <span class="timestamp">${time}</span>
                     ${msg.read?'✔✔':''}`;
  }

  messagesDiv.appendChild(div);
}

/* ----------------- SCROLL ----------------- */
function scrollBottom(){
  messagesDiv.scrollTo({top:messagesDiv.scrollHeight,behavior:"smooth"});
}

/* ----------------- SEND MESSAGE ----------------- */
async function sendMessage(){
  const content = input.value.trim();
  if(!content) return;

  await supabase.from("messages").insert({
    conversation_id:conversationId,
    sender_id:userId,
    content,
    created_at:new Date().toISOString()
  });

  input.value="";
}

/* ----------------- TYPING INDICATOR ----------------- */
input.addEventListener("input", async ()=>{
  const newTyping = { ...(conversationData.typing||{}) };
  newTyping[userId]=true;
  await supabase.from('conversations').update({typing:newTyping}).eq('id',conversationId);
  
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async ()=>{
    const resetTyping = { ...(conversationData.typing||{}) };
    resetTyping[userId]=false;
    await supabase.from('conversations').update({typing:resetTyping}).eq('id',conversationId);
  },1000);
});

/* ----------------- REALTIME ----------------- */
supabase.channel("chat-"+conversationId)
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:`conversation_id=eq.${conversationId}`},
     payload=>{ addMessage(payload.new); scrollBottom(); })
  .subscribe();

supabase.channel("conversations")
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"conversations",filter:`id=eq.${conversationId}`},
     payload=>{
       conversationData.typing = payload.new.typing||{};
       const otherId = conversationData.user1_id===userId?conversationData.user2_id:conversationData.user1_id;
       typingIndicator.textContent = conversationData.typing[otherId]?'Typing...':'';
     })
  .subscribe();

/* ----------------- FILE UPLOAD ----------------- */
attachBtn.onclick = ()=> fileInput.click();
cameraBtn.onclick = async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const track = stream.getVideoTracks()[0];
    const imageCapture = new ImageCapture(track);
    const blob = await imageCapture.takePhoto();
    localStorage.setItem("chat-media-file", JSON.stringify({name:"camera.jpg",type:blob.type,data:await blob.arrayBuffer()}));
    localStorage.setItem("chat-conversationId",conversationId);
    window.location.href="media-preview.html";
  }catch(e){alert("Camera access denied");}
};

fileInput.onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;

  // store in localStorage
  const arrayBuffer = await file.arrayBuffer();
  localStorage.setItem("chat-media-file", JSON.stringify({name:file.name,type:file.type,data:arrayBuffer}));
  localStorage.setItem("chat-conversationId",conversationId);
  window.location.href="media-preview.html";
};

/* ----------------- INIT ----------------- */
sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e=>{if(e.key==="Enter") sendMessage();});
await loadUser();
await loadMessages();

</script>
</body>
  </html>
