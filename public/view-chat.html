<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#e5ddd5;
height:100vh;
display:flex;
justify-content:center;
}

.chat-container{
width:100%;
max-width:500px;
height:100vh;
display:flex;
flex-direction:column;
background:white;
}

/* HEADER */

.chat-header{
height:60px;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid #ddd;
background:white;
}

.back-btn{
font-size:22px;
margin-right:10px;
cursor:pointer;
}

.chat-header img{
width:40px;
height:40px;
border-radius:50%;
margin-right:10px;
object-fit:cover;
}

.chat-header h3{
margin:0;
font-size:16px;
}

.typing-indicator{
font-size:12px;
color:#777;
margin-left:10px;
}

/* MESSAGES */

.messages{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
background:#e5ddd5;
scroll-behavior:smooth;
}

.message{
max-width:75%;
padding:10px 14px;
border-radius:16px;
font-size:14px;
word-wrap:break-word;
}

.sent{
align-self:flex-end;
background:#1877f2;
color:white;
}

.received{
align-self:flex-start;
background:white;
border:1px solid #ddd;
}

.message img,
.message video{
max-width:220px;
border-radius:10px;
margin-top:5px;
}

.timestamp{
display:block;
font-size:10px;
opacity:0.7;
margin-top:3px;
text-align:right;
}

/* INPUT */

.chat-input{
display:flex;
align-items:center;
gap:8px;
padding:10px;
background:white;
border-top:1px solid #ddd;
}

.chat-input input{
flex:1;
border:none;
background:#f0f2f5;
padding:12px;
border-radius:20px;
font-size:14px;
outline:none;
}

.icon-btn{
border:none;
background:none;
cursor:pointer;
font-size:20px;
}

#sendBtn{
background:#1877f2;
color:white;
padding:10px 18px;
border-radius:18px;
font-weight:600;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<div class="chat-container">

<!-- HEADER -->

<div class="chat-header">
<div class="back-btn" onclick="history.back()">←</div>
<img id="avatar">
<h3 id="username">Loading...</h3>
<span class="typing-indicator" id="typingIndicator"></span>
</div>

<!-- MESSAGES -->

<div class="messages" id="messages"></div>

<!-- INPUT -->

<div class="chat-input">

<button id="cameraBtn" class="icon-btn">📷</button>

<button id="attachBtn" class="icon-btn">📎</button>

<input type="file" id="fileInput" style="display:none" accept="image/*,video/*">

<input id="messageInput" placeholder="Message..." type="text">

<button id="sendBtn">Send</button>

</div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const typingIndicator = document.getElementById("typingIndicator");

const fileInput = document.getElementById("fileInput");
const attachBtn = document.getElementById("attachBtn");
const cameraBtn = document.getElementById("cameraBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();

if(!session) window.location.href="login.html";

const userId = session.user.id;

let conversationData;
let typingTimeout;

/* LOAD USER */

async function loadUser(){

const { data } = await supabase
.from("conversations")
.select(`user1_id,user2_id,typing,
user1:profile!user1_id(full_name,avatar_url),
user2:profile!user2_id(full_name,avatar_url)
`)
.eq("id",conversationId)
.single();

conversationData = data;

const other = data.user1_id === userId ? data.user2 : data.user1;

username.textContent = other.full_name || "User";

avatar.src = other.avatar_url || "https://via.placeholder.com/40";

}

/* LOAD MESSAGES */

async function loadMessages(){

messagesDiv.innerHTML="";

const { data } = await supabase
.from("messages")
.select("*")
.eq("conversation_id",conversationId)
.order("created_at",{ascending:true});

data.forEach(addMessage);

scrollBottom();

}

/* ADD MESSAGE */

function addMessage(msg){

const div = document.createElement("div");

div.classList.add("message");

if(msg.sender_id===userId) div.classList.add("sent");
else div.classList.add("received");

const time = new Date(msg.created_at)
.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

if(msg.media_url){

if(msg.media_url.includes("video") || msg.media_url.includes(".mp4")){

div.innerHTML =
`<video src="${msg.media_url}" controls></video>
<span class="timestamp">${time}</span>`;

}else{

div.innerHTML =
`<img src="${msg.media_url}">
<span class="timestamp">${time}</span>`;

}

}else{

div.innerHTML =
`${msg.content || ""}
<span class="timestamp">${time}</span>`;

}

messagesDiv.appendChild(div);

}

/* SCROLL */

function scrollBottom(){

messagesDiv.scrollTo({
top:messagesDiv.scrollHeight,
behavior:"smooth"
});

}

/* SEND MESSAGE */

async function sendMessage(){

const content = input.value.trim();

if(!content) return;

await supabase.from("messages").insert({

conversation_id:conversationId,
sender_id:userId,
content,
created_at:new Date().toISOString()

});

input.value="";

}

sendBtn.onclick = sendMessage;

input.addEventListener("keypress", e=>{

if(e.key==="Enter") sendMessage();

});

/* REALTIME */

supabase.channel("chat-"+conversationId)

.on("postgres_changes",
{event:"INSERT",schema:"public",table:"messages",
filter:`conversation_id=eq.${conversationId}`},

payload=>{

addMessage(payload.new);

scrollBottom();

})

.subscribe();

/* FILE UPLOAD */

attachBtn.onclick=()=>fileInput.click();

fileInput.onchange=(e)=>{

const file=e.target.files[0];

if(!file) return;

window.chatMediaFile=file;

sessionStorage.setItem("chat-conversationId",conversationId);

window.location.href="media-preview.html";

};

/* CAMERA */

cameraBtn.onclick=()=>fileInput.click();

/* INIT */

await loadUser();

await loadMessages();

</script>

</body>
  </html>
