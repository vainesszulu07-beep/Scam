<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
body{
  margin:0;
  font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
  background:#f0f2f5;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
}
.chat-container{
  width:100%;
  max-width:500px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:white;
}
.chat-header{
  height:60px;
  display:flex;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #ddd;
  background:white;
}
.back-btn{
  margin-right:10px;
  cursor:pointer;
  font-size:22px;
}
.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}
.chat-header h3{
  margin:0;
  font-size:16px;
}
.typing-indicator{
  font-size:12px;
  color:#65676b;
  margin-left:10px;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:#f0f2f5;
}
.message{
  max-width:70%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;
  word-wrap:break-word;
}
.sent{
  align-self:flex-end;
  background:#1877f2;
  color:white;
}
.received{
  align-self:flex-start;
  background:#e4e6eb;
  color:black;
}
.message img,
.message video{
  max-width:100%;
  border-radius:12px;
}
.timestamp{
  display:block;
  font-size:10px;
  margin-top:4px;
  opacity:0.7;
  text-align:right;
}
.chat-input{
  height:65px;
  display:flex;
  align-items:center;
  padding:10px;
  border-top:1px solid #ddd;
  background:white;
}
.chat-input input{
  flex:1;
  border:none;
  background:#f0f2f5;
  padding:12px 16px;
  border-radius:20px;
  outline:none;
  font-size:14px;
}
.icon-btn{
  background:none;
  border:none;
  cursor:pointer;
  margin-left:6px;
}
.icon-btn svg{
  width:22px;
  height:22px;
  fill:#65676b;
}
.send-btn{
  margin-left:8px;
  border:none;
  background:#1877f2;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:500;
}
</style>
</head>
<body>

<div class="chat-container">

<!-- HEADER -->
<div class="chat-header">
  <div class="back-btn" onclick="history.back()">←</div>
  <img id="avatar" src="">
  <h3 id="username">Loading...</h3>
  <span class="typing-indicator" id="typingIndicator"></span>
</div>

<!-- MESSAGES -->
<div class="messages" id="messages"></div>

<!-- INPUT -->
<div class="chat-input">

<!-- SINGLE ATTACHMENT BUTTON -->
<button class="icon-btn" id="attachBtn" title="Attach file">
<svg viewBox="0 0 24 24">
<path d="M16.5 6.5l-7.79 7.79a3 3 0 104.24 
4.24l8.49-8.49a5 5 0 
10-7.07-7.07L5.88 
12.46"/>
</svg>
</button>

<input id="messageInput" placeholder="Message...">

<button class="send-btn" id="sendBtn">Send</button>

</div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();
const userId = session.user.id;

// SEND TEXT MESSAGE
async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  await supabase.from("messages").insert({
    conversation_id:conversationId,
    sender_id:userId,
    content:text
  });
  input.value="";
}

// LOAD MESSAGES
async function loadMessages(){
  const { data } = await supabase
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true});

  messagesDiv.innerHTML="";
  data.forEach(msg => {
    const div = document.createElement("div");
    div.classList.add("message");
    if(msg.sender_id===userId) div.classList.add("sent");
    else div.classList.add("received");

    let html = msg.content || "";
    if(msg.content.startsWith("image:")){
      html = `<img src="${msg.content.replace("image:","")}">`;
    }
    if(msg.content.startsWith("video:")){
      html = `<video controls src="${msg.content.replace("video:","")}"></video>`;
    }

    div.innerHTML = `
      ${html}
      <span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
    `;
    messagesDiv.appendChild(div);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// BUTTON EVENTS
sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => { if(e.key==="Enter") sendMessage(); });

// SINGLE ATTACHMENT REDIRECT
attachBtn.onclick = () => {
  window.location.href = `media-preview.html?conversationId=${conversationId}`;
};

// REALTIME MESSAGES
supabase.channel("chat-"+conversationId)
.on("postgres_changes",
  {event:"INSERT", schema:"public", table:"messages", filter:`conversation_id=eq.${conversationId}`},
  payload => { loadMessages(); }
).subscribe();

// INIT
await loadMessages();

</script>
</body>
</html>I
