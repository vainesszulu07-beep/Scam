<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  color: #050505;
}

/* MAIN LAYOUT */
.chat-container {
  display: flex;
  height: 100vh;
  max-width: 960px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* LEFT PANEL: CONVERSATIONS LIST */
.left-panel {
  width: 30%;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.left-panel h3 {
  margin: 0;
  padding: 12px;
  background: #f7f7f7;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}
.conversation-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.conversation-card:hover {
  background: #f0f2f5;
}
.conversation-card img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  object-fit: cover;
}
.conversation-card .name {
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.conversation-card.active {
  background: #e4e6eb;
}

/* RIGHT PANEL: CHAT AREA */
.right-panel {
  width: 70%;
  display: flex;
  flex-direction: column;
}
.chat-header {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
  background: #f7f7f7;
}
.chat-messages {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #f0f2f5;
}
.message {
  max-width: 70%;
  padding: 8px 12px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  word-wrap: break-word;
}
.message.sent {
  background: #1877f2;
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.message.received {
  background: #e4e6eb;
  color: #050505;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

/* INPUT BOX */
.chat-input-container {
  display: flex;
  padding: 8px;
  border-top: 1px solid #ddd;
  background: #fff;
}
.chat-input-container input {
  flex: 1;
  padding: 10px 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
  font-size: 14px;
  outline: none;
}
.chat-input-container button {
  margin-left: 8px;
  padding: 10px 16px;
  background: #1877f2;
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="chat-container">

  <!-- LEFT PANEL: Conversations -->
  <div class="left-panel">
    <h3>Chats</h3>
    <div id="conversationsList">
      <div style="text-align:center;color:#777;">No chats yet</div>
    </div>
  </div>

  <!-- RIGHT PANEL: Chat -->
  <div class="right-panel">
    <div class="chat-header" id="chatHeader">Select a chat</div>
    <div class="chat-messages" id="chatMessages">
      <div style="text-align:center;color:#777;">No messages</div>
    </div>
    <div class="chat-input-container">
      <input type="text" id="messageInput" placeholder="Type a message..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const { data: { session } } = await supabase.auth.getSession();
const currentUserId = session.user.id;

const conversationsList = document.getElementById("conversationsList");
const chatHeader = document.getElementById("chatHeader");
const chatMessages = document.getElementById("chatMessages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let activeConversationId = null;
let messageSubscription = null;

// Load conversations
async function loadConversations() {
  const { data: convs } = await supabase
    .from('conversations')
    .select('*, messages(*)')
    .or(`user1_id.eq.${currentUserId},user2_id.eq.${currentUserId}`);

  conversationsList.innerHTML = "";
  if(!convs || convs.length === 0){
    conversationsList.innerHTML = '<div style="text-align:center;color:#777;">No chats yet</div>';
    return;
  }

  for (const conv of convs) {
    const otherUserId = conv.user1_id === currentUserId ? conv.user2_id : conv.user1_id;
    const { data: otherUser } = await supabase.from('profile').select('*').eq('id', otherUserId).single();

    const card = document.createElement('div');
    card.className = 'conversation-card';
    card.innerHTML = `
      <img src="${otherUser.avatar_url || 'https://via.placeholder.com/50'}" alt="avatar">
      <div class="name">${otherUser.full_name}</div>
    `;
    card.addEventListener('click', () => openChat(conv.id, otherUser, card));
    conversationsList.appendChild(card);
  }
}

// Open a conversation
async function openChat(conversationId, otherUser, cardElement){
  activeConversationId = conversationId;
  chatHeader.textContent = otherUser.full_name;
  messageInput.disabled = false;
  sendBtn.disabled = false;

  // Highlight active conversation
  document.querySelectorAll('.conversation-card').forEach(c => c.classList.remove('active'));
  cardElement.classList.add('active');

  // Load messages
  const { data: messages } = await supabase
    .from('messages')
    .select('*')
    .eq('conversation_id', conversationId)
    .order('created_at', { ascending: true });

  renderMessages(messages || []);

  // Subscribe to new messages
  if(messageSubscription) supabase.removeSubscription(messageSubscription);
  messageSubscription = supabase
    .channel(`conversation-${conversationId}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${conversationId}` }, payload => {
      const msg = payload.new;
      const div = document.createElement('div');
      div.className = 'message ' + (msg.sender_id === currentUserId ? 'sent' : 'received');
      div.textContent = msg.content;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    })
    .subscribe();
}

// Render messages
function renderMessages(messages){
  chatMessages.innerHTML = "";
  if(messages.length === 0){
    chatMessages.innerHTML = '<div style="text-align:center;color:#777;">No messages</div>';
    return;
  }

  messages.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'message ' + (msg.sender_id === currentUserId ? 'sent' : 'received');
    div.textContent = msg.content;
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Send message
sendBtn.addEventListener('click', async () => {
  const content = messageInput.value.trim();
  if(!content || !activeConversationId) return;

  await supabase.from('messages').insert({
    conversation_id: activeConversationId,
    sender_id: currentUserId,
    content
  });

  messageInput.value = '';
});

// Load everything
loadConversations();
</script>

</body>
  </html>
