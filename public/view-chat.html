<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test</title>

<style>

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#eef2f7,#e3e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-container{
  width:420px;
  background:white;
  border-radius:14px;
  padding:22px;
  position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,0.12);
}

/* typing indicator */

.typing-indicator{
  position:absolute;
  left:20px;
  bottom:65px;

  display:none;
  align-items:center;
  gap:10px;

  font-size:14px;
  color:#2e7d32;

  padding:8px 14px;
  border-radius:20px;

  background:rgba(76,175,80,0.08);
  border:2px solid rgba(76,175,80,0.5);

  box-shadow:
  0 0 8px rgba(76,175,80,0.4),
  inset 0 0 6px rgba(76,175,80,0.2);

  animation: glowWave 1.2s ease-in-out infinite alternate;
}

.typing-avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

.typing-text{
  display:flex;
  align-items:center;
}

/* glow animation */

@keyframes glowWave{
  0%{
    box-shadow:
    0 0 6px rgba(76,175,80,0.4),
    inset 0 0 4px rgba(76,175,80,0.2);
  }

  100%{
    box-shadow:
    0 0 16px rgba(76,175,80,0.8),
    inset 0 0 10px rgba(76,175,80,0.3);
  }
}

/* typing dots */

.typing-text::after{
  content:"";
  display:inline-block;
  width:24px;
  animation:dots 1.2s steps(4,end) infinite;
}

@keyframes dots{
  0%{content:"";}
  25%{content:".";}
  50%{content:"..";}
  75%{content:"...";}
  100%{content:"";}
}

/* input */

input{
  width:100%;
  padding:12px 14px;
  font-size:15px;
  border-radius:8px;
  border:1px solid #d4d9e2;
  outline:none;
  transition:all .2s ease;
}

input:focus{
  border-color:#4caf50;
  box-shadow:0 0 0 2px rgba(76,175,80,0.15);
}

</style>
</head>

<body>

<div class="chat-container">

  <div class="typing-indicator" id="typingIndicator">
      <img id="typingAvatar" class="typing-avatar">
      <div class="typing-text" id="typingText"></div>
  </div>

  <input id="messageInput" placeholder="Type something...">

</div>


<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const input = document.getElementById("messageInput");
const typingIndicator = document.getElementById("typingIndicator");
const typingAvatar = document.getElementById("typingAvatar");
const typingText = document.getElementById("typingText");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = "login.html";
}
const userId = session.user.id;

let typingTimeout;

/* get user profiles */

let profiles = {};

async function loadProfiles(){

  const { data } = await supabase
    .from("profiles")
    .select("id,name,avatar_url");

  data.forEach(p => profiles[p.id] = p);

}

await loadProfiles();

/* typing update */

async function setTyping(isTyping) {

  const { data: conv } = await supabase
    .from('conversations')
    .select('typing')
    .eq('id', conversationId)
    .single();

  const currentTyping = conv.typing || {};
  currentTyping[userId] = isTyping;

  await supabase
    .from('conversations')
    .update({ typing: currentTyping })
    .eq('id', conversationId);
}

/* input event */

input.addEventListener('input', async () => {

  await setTyping(true);

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => setTyping(false), 1000);

});

/* realtime */

supabase.channel("conversations")
  .on('postgres_changes',
    { event:'UPDATE', schema:'public', table:'conversations', filter:`id=eq.${conversationId}` },
    payload => {

      const typingData = payload.new.typing || {};

      const typingUsers = Object.entries(typingData)
        .filter(([uid, t]) => t);

      if(typingUsers.length){

        const uid = typingUsers[0][0];
        const profile = profiles[uid];

        typingIndicator.style.display = "flex";

        typingAvatar.src = profile?.avatar_url || "https://via.placeholder.com/30";
        typingText.textContent = (uid === userId ? "You" : profile?.full_name || "User") + " typing";

      }else{

        typingIndicator.style.display = "none";

      }

  }).subscribe();

</script>

</body>
</html>
