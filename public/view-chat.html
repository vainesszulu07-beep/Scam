<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title><style>

body{
margin:0;
font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
background:#f0f2f5;
height:100dvh;
overflow:hidden;
display:flex;
justify-content:center;
}

.chat-container{
width:100%;
max-width:500px;
height:100dvh;
display:flex;
flex-direction:column;
background:white;
}

/* HEADER */

.chat-header{
height:60px;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid #ddd;
background:white;
position:sticky;
top:0;
z-index:2;
}

.back-btn{
margin-right:10px;
cursor:pointer;
font-size:22px;
}

.chat-header img{
width:40px;
height:40px;
border-radius:50%;
margin-right:10px;
object-fit:cover;
}

.chat-header h3{
margin:0;
font-size:16px;
}

/* MESSAGES */

.messages{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:8px;
background:#f0f2f5;
scroll-behavior:smooth;
}

/* MESSAGE BUBBLE */

.message{
max-width:70%;
display:flex;
flex-direction:column;
}

.bubble{
padding:10px 14px;
border-radius:18px;
font-size:14px;
word-wrap:break-word;
}

.sent .bubble{
background:#1877f2;
color:white;
}

.received .bubble{
background:#e4e6eb;
color:black;
}

.sent{
align-self:flex-end;
}

.received{
align-self:flex-start;
}

.meta{
font-size:11px;
margin-top:2px;
display:flex;
align-items:center;
gap:4px;
opacity:0.7;
}

.sent .meta{
justify-content:flex-end;
}

.tick{
font-size:12px;
}

/* INPUT */

.chat-input{
height:65px;
display:flex;
align-items:center;
padding:10px;
border-top:1px solid #ddd;
background:white;
position:sticky;
bottom:0;
}

.chat-input input{
flex:1;
border:none;
background:#f0f2f5;
padding:12px 16px;
border-radius:20px;
outline:none;
font-size:14px;
}

.chat-input button{
margin-left:8px;
border:none;
background:#1877f2;
color:white;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
}

.chat-input button:hover{
background:#166fe5;
}

</style></head><body><div class="chat-container"><div class="chat-header"><div class="back-btn" onclick="history.back()">←</div><img id="avatar" src="https://via.placeholder.com/40"><h3 id="username">Loading...</h3></div><div class="messages" id="messages"></div><div class="chat-input">
<input id="messageInput" placeholder="Message...">
<button id="sendBtn">Send</button>
</div></div><script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data:{session} } = await supabase.auth.getSession();

if(!session){
window.location.href="login.html";
}

const userId = session.user.id;

/* LOAD OTHER USER */

async function loadUser(){

const { data } = await supabase
.from("conversations")
.select(`
user1_id,
user2_id,
user1:profile!user1_id(full_name,avatar_url),
user2:profile!user2_id(full_name,avatar_url)
`)
.eq("id",conversationId)
.single();

let other;

if(data.user1_id === userId){
other = data.user2;
}else{
other = data.user1;
}

username.textContent = other.full_name || "User";
avatar.src = other.avatar_url || "https://via.placeholder.com/40";

}

/* FORMAT TIME */

function formatTime(date){

const d = new Date(date);

return d.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

/* ADD MESSAGE */

function addMessage(msg){

const div=document.createElement("div");

div.classList.add("message");

if(msg.sender_id===userId){
div.classList.add("sent");
}else{
div.classList.add("received");
}

const tick = msg.sender_id===userId
? (msg.read ? "✓✓" : "✓")
: "";

div.innerHTML=`
<div class="bubble">${msg.content}</div>
<div class="meta">
<span>${formatTime(msg.created_at)}</span>
<span class="tick">${tick}</span>
</div>
`;

messagesDiv.appendChild(div);

}

/* SCROLL */

function scrollBottom(){
messagesDiv.scrollTop=messagesDiv.scrollHeight;
}

/* LOAD MESSAGES */

async function loadMessages(){

const { data } = await supabase
.from("messages")
.select("*")
.eq("conversation_id",conversationId)
.order("created_at",{ascending:true});

data.forEach(addMessage);

scrollBottom();

markAsRead();

}

/* SEND MESSAGE */

async function sendMessage(){

const text=input.value.trim();

if(!text) return;

await supabase
.from("messages")
.insert({
conversation_id:conversationId,
sender_id:userId,
content:text
});

input.value="";

}

/* MARK MESSAGES READ */

async function markAsRead(){

await supabase
.from("messages")
.update({read:true})
.eq("conversation_id",conversationId)
.neq("sender_id",userId)
.eq("read",false);

}

/* BUTTONS */

sendBtn.onclick=sendMessage;

input.addEventListener("keypress",e=>{
if(e.key==="Enter"){
sendMessage();
}
});

/* REALTIME */

supabase
.channel("chat-"+conversationId)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages",
filter:`conversation_id=eq.${conversationId}`
},
payload=>{
addMessage(payload.new);
scrollBottom();
markAsRead();
}
)
.subscribe();

/* INIT */

loadUser();
loadMessages();

</script></body>
  </html>
