<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test Fancy</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  background:#f0f2f5; 
  display:flex; 
  justify-content:center; 
  padding-top:50px; 
}

.chat-container { 
  width:400px; 
  background:white; 
  border-radius:12px; 
  padding:20px; 
  position:relative; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* Typing indicator container */
.typing-indicator {
  position:absolute;
  left:20px;
  bottom:60px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-radius:25px;
  background:rgba(0,255,0,0.1);
  border:2px solid #4caf50;
  box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
  opacity:0;
  pointer-events:none;
  transform: translateY(10px);
  animation: waveGlow 0.5s ease-in-out infinite alternate;
}

/* Pulse glow animation */
@keyframes waveGlow {
  0% { box-shadow: 0 0 8px rgba(76, 175, 80, 0.6); transform: translateY(10px); }
  50% { box-shadow: 0 0 16px rgba(76, 175, 80, 0.9); transform: translateY(0px); }
  100% { box-shadow: 0 0 8px rgba(76, 175, 80, 0.6); transform: translateY(10px); }
}

/* Profile pic inside typing */
.typing-indicator img {
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid #4caf50;
  object-fit:cover;
}

/* Typing text animation dots */
.typing-indicator span {
  font-weight:600;
  color:#4caf50;
  display:flex;
  gap:3px;
}

.typing-indicator span .dot {
  width:6px;
  height:6px;
  background:#4caf50;
  border-radius:50%;
  animation: blink 1s infinite;
}

.typing-indicator span .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity:0.2; }
  40% { opacity:1; }
}

input { 
  width:100%; 
  padding:10px; 
  font-size:14px; 
  border-radius:5px; 
  border:1px solid #ccc; 
}

</style>
</head>
<body>

<div class="chat-container">
  <div class="typing-indicator" id="typingIndicator">
    <img id="typingAvatar" src="https://via.placeholder.com/28">
    <div>
      <strong id="typingName">User</strong>
      <span>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </span>
    </div>
  </div>
  <input id="messageInput" placeholder="Type something...">
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const input = document.getElementById("messageInput");
const typingIndicator = document.getElementById("typingIndicator");
const typingName = document.getElementById("typingName");
const typingAvatar = document.getElementById("typingAvatar");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data: { session } } = await supabase.auth.getSession();
if (!session) window.location.href = "login.html";
const userId = session.user.id;

let typingTimeout;

async function setTyping(isTyping) {
  const { data: conv } = await supabase
    .from('conversations')
    .select('typing, user1_id, user2_id, user1:profile!user1_id(full_name, avatar_url), user2:profile!user2_id(full_name, avatar_url)')
    .eq('id', conversationId)
    .single();

  const currentTyping = conv.typing || {};
  currentTyping[userId] = isTyping;

  await supabase
    .from('conversations')
    .update({ typing: currentTyping })
    .eq('id', conversationId);
}

/* Input typing event */
input.addEventListener('input', async () => {
  await setTyping(true);

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => setTyping(false), 1000);
});

/* Real-time subscription */
supabase.channel("conversations")
  .on('postgres_changes', { event:'UPDATE', schema:'public', table:'conversations', filter:`id=eq.${conversationId}` },
    payload => {
      const typingData = payload.new.typing || {};
      const users = [payload.new.user1, payload.new.user2].filter(Boolean);
      const typingUsers = Object.entries(typingData)
        .filter(([uid, t]) => t)
        .map(([uid]) => {
          const u = users.find(u => u.id === uid);
          return u ? { name: u.full_name || "User", avatar: u.avatar_url || "https://via.placeholder.com/28"} : null;
        })
        .filter(Boolean);

      if (typingUsers.length) {
        typingIndicator.style.display = "flex";
        typingName.textContent = typingUsers[0].name;
        typingAvatar.src = typingUsers[0].avatar;
      } else {
        typingIndicator.style.display = "none";
      }
    }
  ).subscribe();
</script>

</body>
  </html>
