<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat with Last Seen</title>
<style>
  body {
    margin: 0;
    font-family: Segoe UI, Arial, sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    justify-content: center;
  }

  .chat-container {
    width: 100%;
    max-width: 500px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: white;
    position: relative;
  }

  .chat-header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #ddd;
    background: white;
    position: relative;
    gap: 10px;
  }

  .back-btn {
    font-size: 22px;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .profile-wrapper {
    position: relative;
    margin-right: 10px;
    flex: 0 0 auto;
  }

  .chat-header img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  .status-dot {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid white;
    background: grey;
  }

  .user-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    flex: 1;
  }

  .chat-header h3 {
    margin: 0;
    font-size: 16px;
    line-height: 1.1;
  }

  #lastSeen {
    font-size: 12px;
    color: #666;
    font-weight: 500;
    white-space: nowrap;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }

  .mini-btn {
    border: none;
    background: #eff6ff;
    color: #1d4ed8;
    padding: 9px 12px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }

  .mini-btn:hover {
    background: #dbeafe;
  }

  .mini-btn:active {
    transform: scale(0.97);
  }

  .typing-indicator {
    position: absolute;
    bottom: 75px;
    left: 12px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 18px;
    background: #f1f5f9;
    font-size: 13px;
    z-index: 1001;
  }

  .typing-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
  }

  .typing-name {
    font-weight: 600;
  }

  .typing-dots span {
    animation: blink 1.4s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes blink {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #f0f2f5;
  }

  .message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    word-wrap: break-word;
    position: relative;
    user-select: none;
  }

  .sent { align-self: flex-end; background: #1877f2; color: white; }
  .received { align-self: flex-start; background: #e4e6eb; color: black; }

  .message img {
    max-width: 100%;
    border-radius: 12px;
    margin-top: 6px;
    cursor: pointer;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    margin-top: 6px;
    cursor: pointer;
  }

  .video-wrapper video {
    width: 100%;
    border-radius: 12px;
    pointer-events: none;
  }

  .play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.6);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-overlay:before {
    content: '';
    border-style: solid;
    border-width: 12px 0 12px 20px;
    border-color: transparent transparent transparent white;
  }

  .timestamp {
    display: block;
    font-size: 10px;
    margin-top: 4px;
    opacity: 0.7;
    text-align: right;
  }

  .read-tick {
    font-size: 12px;
    margin-left: 4px;
    color: #4fc3f7;
  }

  .chat-input {
    height: 65px;
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-top: 1px solid #ddd;
    background: white;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    border: none;
    background: #f0f2f5;
    padding: 12px 16px;
    border-radius: 25px;
    outline: none;
  }

  #sendBtn {
    background: #1877f2;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
  }

  .icon-btn {
    background: #1877f2;
    padding: 8px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
    fill: white;
  }

  .time-divider {
    display: flex;
    align-items: center;
    text-align: center;
    font-size: 12px;
    color: #666;
    margin: 12px 0;
  }

  .time-divider::before,
  .time-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #ccc;
  }

  .time-divider span {
    padding: 0 10px;
  }

  .hover-time {
    position: absolute;
    top: -16px;
    font-size: 10px;
    opacity: 0;
    transition: opacity .2s;
  }

  .message:hover .hover-time { opacity: 1; }
  .sent .hover-time { right: 0; color: white; }
  .received .hover-time { left: 0; color: #555; }

  .scroll-down-btn {
    position: absolute;
    bottom: 90px;
    right: 15px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #1877f2;
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    z-index: 20;
  }

  /* Private games drawer */
  .games-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 2000;
  }

  .games-drawer-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .games-drawer {
    position: absolute;
    top: 0;
    right: 0;
    width: min(420px, 92vw);
    height: 100%;
    background: #fff;
    box-shadow: -20px 0 50px rgba(0,0,0,.18);
    transform: translateX(100%);
    transition: transform .28s ease;
    display: flex;
    flex-direction: column;
  }

  .games-drawer-overlay.open .games-drawer {
    transform: translateX(0);
  }

  .drawer-head {
    padding: 16px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .drawer-head h3 {
    margin: 0;
    font-size: 17px;
  }

  .drawer-close {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: #f3f4f6;
    cursor: pointer;
    font-size: 18px;
  }

  .drawer-body {
    padding: 14px;
    overflow: auto;
    display: grid;
    gap: 12px;
  }

  .private-card {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    background: #fafafa;
  }

  .private-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: #e5e7eb;
  }

  .private-main {
    min-width: 0;
  }

  .private-name {
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .private-meta {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.4;
  }

  .join-private-btn {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    background: #0d6efd;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  .join-private-btn:active {
    transform: scale(.98);
  }

  .empty-private {
    padding: 16px;
    text-align: center;
    color: #6b7280;
    border: 1px dashed #d1d5db;
    border-radius: 16px;
    background: #fafafa;
  }

  @media (max-width: 640px) {
    .games-drawer {
      width: 100vw;
    }
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="back-btn" onclick="history.back()">←</div>
    <div class="profile-wrapper">
      <img id="avatar" src="" alt="Avatar">
      <div id="statusDot" class="status-dot"></div>
    </div>
    <div class="user-info">
      <h3 id="username">Loading...</h3>
      <div id="lastSeen"></div>
    </div>
    <div class="header-actions">
      <button id="privateGamesBtn" class="mini-btn" type="button">Private games</button>
    </div>
  </div>

  <div id="messages" class="messages"></div>
  <div id="typingIndicator" class="typing-indicator"></div>
  <div id="scrollDownBtn" class="scroll-down-btn">↓</div>

  <div class="chat-input">
    <button id="attachBtn" class="icon-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v11.5c0 3.31 2.69 6 6 6s6-2.69 6-6V6h-1.5z"/></svg>
    </button>
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<div id="gamesDrawerOverlay" class="games-drawer-overlay" aria-hidden="true">
  <aside class="games-drawer" aria-label="Private games drawer">
    <div class="drawer-head">
      <h3 id="drawerTitle">Private games</h3>
      <button id="drawerCloseBtn" class="drawer-close" type="button">✕</button>
    </div>
    <div class="drawer-body">
      <div id="privateGamesList">
        <div class="empty-private">Open the drawer to load private games.</div>
      </div>
    </div>
  </aside>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const lastSeenDiv = document.getElementById("lastSeen");
const statusDot = document.getElementById("statusDot");
const typingIndicator = document.getElementById("typingIndicator");
const scrollBtn = document.getElementById("scrollDownBtn");
const privateGamesBtn = document.getElementById("privateGamesBtn");
const gamesDrawerOverlay = document.getElementById("gamesDrawerOverlay");
const drawerCloseBtn = document.getElementById("drawerCloseBtn");
const privateGamesList = document.getElementById("privateGamesList");
const drawerTitle = document.getElementById("drawerTitle");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = "login.html";
  throw new Error("No session");
}
const userId = session.user.id;

let conversationData;
let typingTimeout;
let lastDateDivider = null;
let otherUserId = null;

function nowLusakaUTC() {
  const nowLocal = new Date();
  const offsetMinutes = -120;
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);
}

async function updateLastSeen() {
  const lusakaUTC = nowLusakaUTC().toISOString();
  const { error } = await supabase
    .from("profile")
    .update({ last_seen: lusakaUTC })
    .eq("id", userId);
  if (error) console.error("Failed to update last_seen:", error);
}
updateLastSeen();
setInterval(updateLastSeen, 30000);

function isActive(lastSeenUTC) {
  if (!lastSeenUTC) return false;
  const diffMs = nowLusakaUTC().getTime() - new Date(lastSeenUTC).getTime();
  return diffMs / 1000 / 60 < 2;
}

function formatLastSeen(lastSeen) {
  if (!lastSeen) return "Never";
  const seenDate = new Date(lastSeen);
  if (Number.isNaN(seenDate.getTime())) return "Never";

  const diffMs = nowLusakaUTC() - seenDate;
  const diffMinutes = diffMs / 1000 / 60;
  const diffHours = diffMs / 1000 / 60 / 60;

  if (diffMinutes < 2) return "Online";
  if (diffHours < 24) return "Last seen today at " + seenDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  const daysOffline = Math.floor(diffHours / 24);
  return daysOffline === 1 ? "Last seen 1 day offline" : `Last seen ${daysOffline} days offline`;
}

function openPrivateDrawer() {
  gamesDrawerOverlay.classList.add("open");
  gamesDrawerOverlay.setAttribute("aria-hidden", "false");
  loadPrivateGames();
}

function closePrivateDrawer() {
  gamesDrawerOverlay.classList.remove("open");
  gamesDrawerOverlay.setAttribute("aria-hidden", "true");
}

async function loadUser() {
  const { data, error } = await supabase.rpc("get_conversation_details", {
    p_conversation_id: conversationId
  });

  if (error) {
    console.error("Error fetching conversation details:", error);
    return;
  }

  const row = data?.[0];
  if (!row) return;

  conversationData = {
    user1_id: row.user1_id,
    user2_id: row.user2_id,
    typing: row.typing,
    user1: {
      full_name: row.user1_full_name,
      avatar_url: row.user1_avatar_url,
      last_seen: row.user1_last_seen
    },
    user2: {
      full_name: row.user2_full_name,
      avatar_url: row.user2_avatar_url,
      last_seen: row.user2_last_seen
    }
  };

  otherUserId = row.user1_id === userId ? row.user2_id : row.user1_id;

  const other = row.user1_id === userId ? conversationData.user2 : conversationData.user1;
  username.textContent = other.full_name || "Chat";
  avatar.src = other.avatar_url || "";

  if (isActive(other.last_seen)) {
    statusDot.style.background = "limegreen";
    lastSeenDiv.textContent = "";
  } else {
    statusDot.style.background = "grey";
    lastSeenDiv.textContent = other.last_seen ? formatLastSeen(other.last_seen) : "Never";
  }

  drawerTitle.textContent = `${other.full_name || "Private"}'s private games`;
}

function scrollBottom() {
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function formatDivider(dateStr) {
  const msgDate = new Date(dateStr);
  const today = new Date();
  const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const startMsg = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
  const diff = (startToday - startMsg) / (1000 * 60 * 60 * 24);
  if (diff === 0) return msgDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (diff === 1) return "Yesterday";
  return msgDate.toDateString();
}

function addMessage(msg) {
  const msgDate = new Date(msg.created_at).toDateString();

  if (lastDateDivider !== msgDate) {
    const divider = document.createElement("div");
    divider.className = "time-divider";
    divider.innerHTML = "<span>" + formatDivider(msg.created_at) + "</span>";
    messagesDiv.appendChild(divider);
    lastDateDivider = msgDate;
  }

  const div = document.createElement("div");
  div.classList.add("message");
  if (msg.sender_id === userId) div.classList.add("sent");
  else div.classList.add("received");

  const hoverTime = document.createElement("div");
  hoverTime.className = "hover-time";
  hoverTime.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  div.appendChild(hoverTime);

  let content = msg.content || "";
  if (msg.media_url) {
    const isVideo = /\.(mp4|webm|ogg)$/i.test(msg.media_url);
    if (isVideo) {
      content += `<div class="video-wrapper"><video muted preload="metadata"><source src="${msg.media_url}"></video><div class="play-overlay"></div></div>`;
    } else {
      content += `<img src="${msg.media_url}">`;
    }
  }

  div.innerHTML += content + `<span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>${msg.sender_id===userId ? `<span class="read-tick">${msg.read ? '✔✔' : '✔'}</span>` : ''}`;
  div.querySelectorAll("img").forEach(img => {
    img.onclick = () => window.location.href = `see-image.html?url=${encodeURIComponent(img.src)}`;
  });
  div.querySelectorAll(".video-wrapper").forEach(v => {
    v.onclick = () => window.location.href = `see-video.html?url=${encodeURIComponent(v.querySelector("source").src)}`;
  });

  messagesDiv.appendChild(div);
  scrollBottom();
}

async function loadMessages() {
  const { data: messages, error } = await supabase.rpc("get_conversation_messages", {
    p_conversation_id: conversationId
  });
  if (error) console.error("Error fetching messages:", error);

  messagesDiv.innerHTML = "";
  lastDateDivider = null;

  const data = messages || [];
  data.forEach(addMessage);

  const unreadIds = data.filter(m => m.sender_id !== userId && !m.read).map(m => m.id);
  if (unreadIds.length) {
    await supabase.from("messages").update({ read: true }).in("id", unreadIds);
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const { error } = await supabase.rpc("send_message", {
    p_conversation_id: conversationId,
    p_content: text,
    p_media_url: null,
    p_media_id: null
  });

  if (error) {
    console.error("Error sending message:", error);
    return;
  }

  input.value = "";
  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: false
  });
}

input.addEventListener("input", async () => {
  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: true
  });

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async () => {
    await supabase.rpc("set_conversation_typing", {
      p_conversation_id: conversationId,
      p_is_typing: false
    });
  }, 1000);
});

messagesDiv.addEventListener("scroll", () => {
  const distance = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight;
  scrollBtn.style.display = distance > 300 ? "flex" : "none";
});

scrollBtn.onclick = () => scrollBottom();

async function redirectToGame(game) {
  if (!game || !game.game_type_id) return;

  const { data: gt, error } = await supabase
    .from("game_types")
    .select("file_type")
    .eq("id", game.game_type_id)
    .single();

  if (error) throw error;
  if (!gt?.file_type) return;

  const fileName = gt.file_type.endsWith(".html")
    ? gt.file_type
    : `${gt.file_type}.html`;

  window.location.href = `/games/${fileName}?gameId=${encodeURIComponent(game.id || game.game_id)}`;
}

async function loadPrivateGames() {
  if (!otherUserId) {
    privateGamesList.innerHTML = `<div class="empty-private">Conversation not loaded yet.</div>`;
    return;
  }

  privateGamesList.innerHTML = `<div class="empty-private">Loading private games...</div>`;

  const { data, error } = await supabase.rpc("list_private_waiting_games", {
    p_conversation_id: conversationId
  });

  if (error) {
    console.error(error);
    privateGamesList.innerHTML = `<div class="empty-private">Could not load private games.</div>`;
    return;
  }

  const games = data || [];
  if (!games.length) {
    privateGamesList.innerHTML = `<div class="empty-private">No private waiting games found for this chat.</div>`;
    return;
  }

  privateGamesList.innerHTML = "";
  games.forEach((game) => {
    const card = document.createElement("div");
    card.className = "private-card";
    card.innerHTML = `
      <img class="private-avatar" src="${game.host_avatar_url || 'https://via.placeholder.com/50'}" alt="${game.host_name || 'User'}">
      <div class="private-main">
        <div class="private-name">${game.game_name || "Private game"}</div>
        <div class="private-meta">
          Bid: ${Number(game.bid_amount || 0)} · Time: ${Number(game.time_left || 0)} min
        </div>
        <div class="private-meta">Host: ${game.host_name || "Unknown"}</div>
      </div>
      <button class="join-private-btn" type="button">Join</button>
    `;

    card.querySelector(".join-private-btn").onclick = async () => {
      try {
        const { data: joined, error } = await supabase.rpc("join_waiting_game", {
          p_game_id: game.game_id
        });

        if (error) throw error;

        closePrivateDrawer();

        if (joined?.status === "playing") {
          await redirectToGame(joined);
        }
      } catch (err) {
        console.error(err);
        alert(err.message || String(err));
      }
    };

    privateGamesList.appendChild(card);
  });
}

privateGamesBtn.onclick = openPrivateDrawer;
drawerCloseBtn.onclick = closePrivateDrawer;
gamesDrawerOverlay.addEventListener("click", (e) => {
  if (e.target === gamesDrawerOverlay) closePrivateDrawer();
});

supabase.channel("chat-" + conversationId)
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `conversation_id=eq.${conversationId}` }, payload => {
    addMessage(payload.new);
  })
  .on("postgres_changes", { event: "UPDATE", schema: "public", table: "conversations", filter: `id=eq.${conversationId}` }, payload => {
    conversationData.typing = payload.new.typing || {};
    const typingUsers = Object.keys(conversationData.typing).filter(uid => conversationData.typing[uid]);
    if (typingUsers.length) {
      const uid = typingUsers.find(id => id !== userId) || typingUsers[0];
      const user = uid === conversationData.user1_id ? conversationData.user1 : conversationData.user2;
      typingIndicator.style.display = "flex";
      typingIndicator.innerHTML = `
        <img class="typing-avatar" src="${user.avatar_url || ''}">
        <span class="typing-name">${user.full_name || 'Someone'}</span>
        <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
      `;
    } else {
      typingIndicator.style.display = "none";
    }
  })
  .subscribe();

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
attachBtn.onclick = () => {
  location.href = `media-preview.html?conversationId=${conversationId}`;
};

await loadUser();
await loadMessages();
</script>
</body>
