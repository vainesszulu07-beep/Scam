<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Video</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: sans-serif;
}

.video-container {
  position: relative;
  width: 100%;
  max-width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
}

video {
  width: 100%;
  height: auto;
  max-height: 100%;
  background: black;
}

.play-pause-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 10;
  opacity: 0.8;
  width: 80px;
  height: 80px;
}

.play-pause-btn svg {
  width: 100%;
  height: 100%;
  fill: white;
}

.back-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 20;
  background: rgba(0,0,0,0.5);
  border: none;
  padding: 8px 12px;
  color: white;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="video-container">
  <video id="video" autoplay muted loop></video>
  <div class="play-pause-btn" id="toggleBtn">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="32" fill="rgba(0,0,0,0.5)"/>
      <polygon points="26,20 26,44 46,32" fill="white"/>
    </svg>
  </div>
  <button class="back-btn" onclick="history.back()">Back</button>
</div>

<script>
function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

const videoURL = getQueryParam('video');
const video = document.getElementById('video');
const toggleBtn = document.getElementById('toggleBtn');

if(videoURL){
  video.src = decodeURIComponent(videoURL);
  video.play();
}

// Toggle play/pause
toggleBtn.addEventListener('click', () => {
  if(video.paused){
    video.play();
    // Change icon to pause
    toggleBtn.innerHTML = `<svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="32" fill="rgba(0,0,0,0.5)"/>
      <rect x="24" y="20" width="6" height="24" fill="white"/>
      <rect x="34" y="20" width="6" height="24" fill="white"/>
    </svg>`;
  } else {
    video.pause();
    // Change icon to play
    toggleBtn.innerHTML = `<svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="32" fill="rgba(0,0,0,0.5)"/>
      <polygon points="26,20 26,44 46,32" fill="white"/>
    </svg>`;
  }
});

// Hide overlay on video click to give fullscreen view
video.addEventListener('click', ()=>{
  toggleBtn.style.display = toggleBtn.style.display === 'none' ? 'flex' : 'none';
});
</script>

</body>
        </html>
