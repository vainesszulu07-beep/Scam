
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertising Network Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f6f9;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 600px;
  padding: 25px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
  color: #17202a;
}

p {
  color: #667085;
  font-size: 14px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #1769ff;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.success {
  display: block !important;
  background: #e9f9ef;
  color: #137333;
}

.error {
  display: block !important;
  background: #fff0f0;
  color: #c62828;
}

#adSection {
  display: none;
  margin-top: 25px;
}

#ad-container {
  width: 100%;
  min-height: 250px;
  overflow: hidden;
  border-radius: 8px;
  background: #f4f6f8;
}

#ad-container iframe {
  display: block;
  width: 100%;
  min-height: 250px;
  border: none;
}
</style>
</head>

<body>

<div class="container">

  <h2>Advertising Network</h2>

  <p>
    Verify your registered application and
    load advertising content.
  </p>

  <button id="verifyBtn" type="button">
    Connect to Advertising Network
  </button>

  <div id="result"></div>

  <div id="adSection">

    <h3>Advertising Content</h3>

    <div id="ad-container"></div>

  </div>

</div>


<!-- LOAD YOUR ADVERTISING SDK -->
<script src="https://scam-gamma.vercel.app/advertising-sdk.js"></script>


<script>
"use strict";

const button = document.getElementById("verifyBtn");
const resultBox = document.getElementById("result");
const adSection = document.getElementById("adSection");
const adContainer = document.getElementById("ad-container");

function showResult(type, message) {
  resultBox.className = type;
  resultBox.textContent = message;
  resultBox.style.display = "block";
}

async function verifyNetwork() {

  button.disabled = true;
  button.textContent = "Connecting...";

  resultBox.style.display = "none";
  adSection.style.display = "none";
  adContainer.replaceChildren();

  try {

    // STEP 1: Verify the registered publisher
    showResult(
      "success",
      "Connecting to advertising network..."
    );

    const response = await fetch(
      "/api/check-ad-network.js",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({}),
        cache: "no-store"
      }
    );

    const data = await response.json().catch(() => ({}));

    if (
      !response.ok ||
      data.success !== true ||
      data.authorized !== true
    ) {
      throw new Error(
        data.message ||
        "Publisher verification failed."
      );
    }


    // STEP 2: Check returned credentials
    if (
      typeof data.token_id !== "string" ||
      !/^[a-f0-9]{64}$/i.test(data.token_id) ||
      typeof data.subid !== "string" ||
      !/^[A-F0-9]{8}$/.test(data.subid)
    ) {
      throw new Error(
        "Invalid authentication credentials returned by the server."
      );
    }


    // STEP 3: Confirm the SDK is available
    if (
      !window.AdvertisingSDK ||
      typeof window.AdvertisingSDK.init !== "function"
    ) {
      throw new Error(
        "Advertising SDK could not be loaded."
      );
    }


    // STEP 4: Display advertising container
    adSection.style.display = "block";

    showResult(
      "success",
      "Publisher verified. Connecting to advertising GUI..."
    );

    button.textContent = "Loading Advertisement...";


    // STEP 5: Initialize the SDK
    // The SDK sends credentials to ad-gui.html.
    // The GUI calls /api/verify-token and /api/get-ad.
    const sdkResult = await window.AdvertisingSDK.init({

      token_id: data.token_id,

      subid: data.subid,

      container: "#ad-container"

    });


    // STEP 6: Handle SDK response
    if (!sdkResult || sdkResult.success !== true) {
      throw new Error(
        sdkResult?.message ||
        "Advertising initialization failed."
      );
    }

    if (sdkResult.noAd === true) {

      showResult(
        "success",
        "Application verified. No advertisements are currently available."
      );

    } else {

      showResult(
        "success",
        "Application verified and advertisement loaded successfully."
      );

    }

  } catch (error) {

    console.error(
      "ADVERTISING NETWORK ERROR:",
      error
    );

    adSection.style.display = "none";
    adContainer.replaceChildren();

    showResult(
      "error",
      error.message || "Unable to connect to advertising network."
    );

  } finally {

    button.disabled = false;
    button.textContent = "Connect to Advertising Network";

  }
}

button.addEventListener("click", verifyNetwork);

</script>

</body>
</html>
