<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Game</title>
  <style>
    :root {
      --bg: #111;
      --panel: #0b0b0b;
      --line: #333;
      --text: #f3f3f3;
      --muted: #aaa;
      --light: #f0d9b5;
      --dark: #b58863;
      --accent: #00ff7f;
      --danger: #ff5c5c;
      --select: #4aa3ff;
      --target: #ffd24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: min(100%, 1100px);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta div {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f0f0f;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 14px;
      word-break: break-all;
    }

    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 72px);
      grid-template-rows: repeat(8, 72px);
      border: 4px solid #2a2a2a;
      width: fit-content;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
    }

    @media (max-width: 620px) {
      #board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
      }
    }

    .square {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      user-select: none;
      position: relative;
      cursor: pointer;
    }

    @media (max-width: 620px) {
      .square {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }

    .light { background: var(--light); }
    .dark { background: var(--dark); }

    .coord {
      position: absolute;
      left: 4px;
      bottom: 2px;
      font-size: 10px;
      color: rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .selected {
      outline: 4px solid var(--select);
      outline-offset: -4px;
    }

    .target {
      outline: 4px solid var(--target);
      outline-offset: -4px;
    }

    .lastMoveFrom {
      box-shadow: inset 0 0 0 4px rgba(0, 255, 127, 0.35);
    }

    .lastMoveTo {
      box-shadow: inset 0 0 0 4px rgba(0, 255, 127, 0.65);
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 140px;
    }

    .good { color: var(--accent); }
    .bad { color: var(--danger); }

    button {
      background: var(--accent);
      color: #000;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    select {
      background: #222;
      border: 1px solid #444;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>My Chess Game</h1>
      <div class="controls">
        <select id="orientationSelect">
          <option value="white">White at bottom</option>
          <option value="black">Black at bottom</option>
        </select>
        <button id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div class="meta card">
      <div>
        <div class="label">Logged-in user</div>
        <div id="userInfo" class="value">Loading...</div>
      </div>
      <div>
        <div class="label">Game ID</div>
        <div id="gameIdInfo" class="value">-</div>
      </div>
      <div>
        <div class="label">Turn</div>
        <div id="turnInfo" class="value">-</div>
      </div>
      <div>
        <div class="label">Status</div>
        <div id="statusInfo" class="value">Loading...</div>
      </div>
      <div>
        <div class="label">Your side</div>
        <div id="sideInfo" class="value">-</div>
      </div>
      <div>
        <div class="label">Selected squares</div>
        <div id="selectionInfo" class="value">-</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div id="board"></div>
        <div class="hint">Tap one square to select a piece, then tap a destination square to move.</div>
      </div>

      <div class="card">
        <div class="label">Viewer log</div>
        <div id="status">Loading board...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";
    const SUPABASE_ANON = "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";
    const INIT_EDGE_URL = `${SUPABASE_URL}/functions/v1/clever-processor`;
    const MOVE_EDGE_URL = `${SUPABASE_URL}/functions/v1/quick-responder`;

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const userInfoEl = document.getElementById("userInfo");
    const gameIdInfoEl = document.getElementById("gameIdInfo");
    const turnInfoEl = document.getElementById("turnInfo");
    const statusInfoEl = document.getElementById("statusInfo");
    const sideInfoEl = document.getElementById("sideInfo");
    const selectionInfoEl = document.getElementById("selectionInfo");
    const refreshBtn = document.getElementById("refreshBtn");
    const orientationSelect = document.getElementById("orientationSelect");

    const pieceMap = {
      P: "♙", R: "♖", N: "♘", B: "♗", Q: "♕", K: "♔",
      p: "♟", r: "♜", n: "♞", b: "♝", q: "♛", k: "♚",
    };

    let currentUser = null;
    let currentGame = null;
    let currentGrid = new Array(64).fill("");
    let selectedFromIndex = null;
    let selectedToIndex = null;
    let loading = false;
    let lastMove = { from: null, to: null };
    let orientationTouched = false;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "bad" : "";
    }

    function safeParseBoardState(boardState) {
      if (!boardState) return null;

      let parsed = boardState;
      let safetyLoop = 0;

      while (typeof parsed === "string" && safetyLoop < 5) {
        try {
          parsed = JSON.parse(parsed);
        } catch {
          try {
            parsed = JSON.parse(parsed.replace(/'/g, '"'));
          } catch {
            break;
          }
        }
        safetyLoop++;
      }

      return parsed;
    }

    function fenToGrid(fen) {
      if (!fen || typeof fen !== "string") return null;

      const placement = fen.split(" ")[0];
      const rows = placement.split("/");
      if (rows.length !== 8) return null;

      const grid = [];

      for (const row of rows) {
        for (const ch of row) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < Number(ch); i++) grid.push("");
          } else {
            grid.push(ch);
          }
        }
      }

      return grid.length === 64 ? grid : null;
    }

    function objectMapToGrid(obj) {
      const grid = new Array(64).fill("");
      for (let i = 0; i < 64; i++) {
        if (Object.prototype.hasOwnProperty.call(obj, String(i))) {
          grid[i] = obj[String(i)] ?? "";
        }
      }
      return grid;
    }

    function extractGrid(boardState) {
      const parsed = safeParseBoardState(boardState);
      if (!parsed) return null;

      if (typeof parsed === "string" && parsed.includes("/")) {
        return fenToGrid(parsed);
      }

      if (Array.isArray(parsed) && parsed.length >= 64) {
        return parsed.slice(0, 64);
      }

      if (parsed && typeof parsed === "object") {
        if (Array.isArray(parsed.grid) && parsed.grid.length >= 64) {
          return parsed.grid.slice(0, 64);
        }

        if (Array.isArray(parsed.board) && parsed.board.length >= 64) {
          return parsed.board.slice(0, 64);
        }

        if (parsed.fen) {
          const gridFromFen = fenToGrid(parsed.fen);
          if (gridFromFen) return gridFromFen;
        }

        const keys = Object.keys(parsed);
        if (keys.some((k) => /^\d+$/.test(k))) {
          return objectMapToGrid(parsed);
        }
      }

      return null;
    }

    function getBoardIndexFromVisualIndex(visualIndex) {
      const isBlackBottom = orientationSelect.value === "black";
      return isBlackBottom ? 63 - visualIndex : visualIndex;
    }

    function getVisualIndexFromBoardIndex(boardIndex) {
      const isBlackBottom = orientationSelect.value === "black";
      return isBlackBottom ? 63 - boardIndex : boardIndex;
    }

    function isOwnPiece(piece) {
      if (!piece || !currentGame || !currentUser) return false;

      const userIsPlayerX = currentGame.player_x === currentUser.id;
      const mySide = userIsPlayerX ? "w" : "b";

      if (mySide === "w") {
        return piece === piece.toUpperCase();
      }
      return piece === piece.toLowerCase();
    }

    function renderBoard(grid) {
      currentGrid = Array.isArray(grid) ? grid.slice(0, 64) : new Array(64).fill("");
      boardEl.innerHTML = "";

      for (let visualIndex = 0; visualIndex < 64; visualIndex++) {
        const boardIndex = getBoardIndexFromVisualIndex(visualIndex);
        const row = Math.floor(visualIndex / 8);
        const col = visualIndex % 8;

        const square = document.createElement("div");
        square.className = "square " + ((row + col) % 2 === 0 ? "light" : "dark");
        square.dataset.boardIndex = String(boardIndex);

        const piece = currentGrid[boardIndex] || "";
        square.textContent = pieceMap[piece] || "";

        if (selectedFromIndex === boardIndex) {
          square.classList.add("selected");
        }
        if (selectedToIndex === boardIndex) {
          square.classList.add("target");
        }
        if (lastMove.from === boardIndex) {
          square.classList.add("lastMoveFrom");
        }
        if (lastMove.to === boardIndex) {
          square.classList.add("lastMoveTo");
        }

        const coord = document.createElement("div");
        coord.className = "coord";
        coord.textContent = boardIndex;

        square.appendChild(coord);
        square.addEventListener("click", () => onSquareClick(boardIndex));

        boardEl.appendChild(square);
      }

      updateSelectionInfo();
    }

    function updateSelectionInfo() {
      const fromText = selectedFromIndex === null ? "-" : String(selectedFromIndex);
      const toText = selectedToIndex === null ? "-" : String(selectedToIndex);
      selectionInfoEl.textContent = `From: ${fromText} | To: ${toText}`;
    }

    function makeStartingFen(turn) {
      return `rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR ${turn} KQkq - 0 1`;
    }

    function isEmptyValue(value) {
      if (value === null || value === undefined) return true;
      if (value === "") return true;
      if (typeof value === "object") {
        if (Array.isArray(value)) return value.length === 0;
        return Object.keys(value).length === 0;
      }
      return false;
    }

    function shouldInitializeBoard(game) {
      return (
        game &&
        game.status === "playing" &&
        isEmptyValue(game.board_state) &&
        isEmptyValue(game.turn)
      );
    }

    async function getSessionUser() {
      const { data, error } = await supabase.auth.getUser();
      if (error) throw error;
      return data?.user || null;
    }

    async function callEdgeFunction(url, body) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("No active session found");

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
          "apikey": SUPABASE_ANON
        },
        body: JSON.stringify(body),
      });

      const result = await response.json().catch(() => ({}));
      return { response, result };
    }

    async function loadLatestGameForUser() {
      const user = await getSessionUser();
      currentUser = user;

      if (!user) {
        currentGame = null;
        currentGrid = new Array(64).fill("");
        userInfoEl.textContent = "Not signed in";
        gameIdInfoEl.textContent = "-";
        turnInfoEl.textContent = "-";
        statusInfoEl.textContent = "Not signed in";
        sideInfoEl.textContent = "-";
        renderBoard(currentGrid);
        setStatus("No active session found. Sign in first.", true);
        return null;
      }

      userInfoEl.textContent = user.email || user.id;

      const { data: games, error } = await supabase
        .from("games")
        .select("id, status, turn, board_state, player_x, player_o, last_move_at, winner, game_type_id")
        .or(`player_x.eq.${user.id},player_o.eq.${user.id}`)
        .order("last_move_at", { ascending: false })
        .limit(1);

      if (error) throw error;

      const game = games?.[0] || null;
      currentGame = game;

      if (!game) {
        gameIdInfoEl.textContent = "-";
        turnInfoEl.textContent = "-";
        statusInfoEl.textContent = "No game found";
        sideInfoEl.textContent = "-";
        currentGrid = new Array(64).fill("");
        renderBoard(currentGrid);
        setStatus("No game found for this user.", true);
        return null;
      }

      gameIdInfoEl.textContent = game.id;
      turnInfoEl.textContent = game.turn ?? "-";
      statusInfoEl.textContent = game.status ?? "-";
      sideInfoEl.textContent = game.player_x === user.id ? "white" : "black";

      const grid = extractGrid(game.board_state);

      if (grid) {
        renderBoard(grid);
      } else {
        currentGrid = new Array(64).fill("");
        renderBoard(currentGrid);
      }

      return game;
    }

    async function maybeInitializeBoard(game) {
      if (!shouldInitializeBoard(game)) {
        return game;
      }

      const startTurn = game.turn === "b" ? "b" : "w";

      setStatus("Board is empty. Initializing now...");

      const { response, result } = await callEdgeFunction(INIT_EDGE_URL, {
        gameId: game.id,
        startTurn
      });

      if (!response.ok) {
        throw new Error(result?.error || `Initialization failed (${response.status})`);
      }

      const refreshed = await loadLatestGameForUser();
      return refreshed || game;
    }

    function clearSelection() {
      selectedFromIndex = null;
      selectedToIndex = null;
      updateSelectionInfo();
      renderBoard(currentGrid);
    }

    function getPromotionIfNeeded(fromIndex, toIndex) {
      const piece = currentGrid[fromIndex];
      if (!piece) return "q";

      const isPawn = piece === "P" || piece === "p";
      if (!isPawn) return "q";

      const toRow = Math.floor(toIndex / 8);
      if (piece === "P" && toRow === 0) return "q";
      if (piece === "p" && toRow === 7) return "q";

      return "q";
    }

    async function makeMove(fromIndex, toIndex) {
      if (!currentGame) throw new Error("No game loaded");
      if (currentGame.status !== "playing") throw new Error("Game is not active");

      const promotion = getPromotionIfNeeded(fromIndex, toIndex);

      setStatus(`Sending move: ${fromIndex} -> ${toIndex} ...`);

      const { response, result } = await callEdgeFunction(MOVE_EDGE_URL, {
        gameId: currentGame.id,
        fromIndex,
        toIndex,
        promotion,
      });

      if (!response.ok) {
        throw new Error(result?.error || `Move failed (${response.status})`);
      }

      lastMove = { from: fromIndex, to: toIndex };
      selectedFromIndex = null;
      selectedToIndex = null;
      updateSelectionInfo();

      await loadLatestGameForUser();
      renderBoard(currentGrid);

      setStatus(
        `Move success!\n\nGame ID: ${currentGame.id}\nStatus: ${result.status ?? currentGame.status}\nWinner: ${result.winner ?? "-"}\nDraw: ${result.draw ? "yes" : "no"}`
      );
    }

    async function onSquareClick(boardIndex) {
      if (loading) return;
      if (!currentGame || !currentUser) return;
      if (currentGame.status !== "playing") {
        setStatus("This game is finished or inactive.", true);
        return;
      }

      const clickedPiece = currentGrid[boardIndex] || "";

      if (selectedFromIndex === null) {
        if (!clickedPiece) {
          setStatus("Tap one of your pieces first.", true);
          return;
        }

        if (!isOwnPiece(clickedPiece)) {
          setStatus("That is not one of your pieces.", true);
          return;
        }

        selectedFromIndex = boardIndex;
        selectedToIndex = null;
        updateSelectionInfo();
        renderBoard(currentGrid);
        return;
      }

      if (selectedFromIndex === boardIndex) {
        clearSelection();
        setStatus("Selection cleared.");
        return;
      }

      if (clickedPiece && isOwnPiece(clickedPiece)) {
        selectedFromIndex = boardIndex;
        selectedToIndex = null;
        updateSelectionInfo();
        renderBoard(currentGrid);
        return;
      }

      selectedToIndex = boardIndex;
      updateSelectionInfo();
      renderBoard(currentGrid);

      try {
        loading = true;
        await makeMove(selectedFromIndex, selectedToIndex);
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        loading = false;
        renderBoard(currentGrid);
      }
    }

    async function refreshAll() {
      try {
        loading = true;
        setStatus("Loading your game...");

        const game = await loadLatestGameForUser();
        if (!game) return;

        const updatedGame = await maybeInitializeBoard(game);
        if (updatedGame) {
          currentGame = updatedGame;
        }

        const side = currentGame?.player_x === currentUser?.id ? "white" : "black";
        if (!orientationTouched) {
          orientationSelect.value = side === "white" ? "white" : "black";
        }

        const latestGrid = extractGrid(currentGame?.board_state);
        if (latestGrid) {
          currentGrid = latestGrid;
          renderBoard(currentGrid);
        } else {
          renderBoard(new Array(64).fill(""));
        }

        const displayTurn = currentGame?.turn ?? "-";
        const displayStatus = currentGame?.status ?? "-";
        const displayWinner = currentGame?.winner ?? "-";

        setStatus(
          `Loaded successfully

Game ID: ${currentGame?.id ?? "-"}
Turn: ${displayTurn}
Status: ${displayStatus}
Winner: ${displayWinner}`
        );
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
        renderBoard(new Array(64).fill(""));
      } finally {
        loading = false;
      }
    }

    orientationSelect.addEventListener("change", () => {
      orientationTouched = true;
      renderBoard(currentGrid);
    });

    refreshBtn.addEventListener("click", refreshAll);

    await refreshAll();
    setInterval(refreshAll, 5000);
  </script>
</body>
  </html>
