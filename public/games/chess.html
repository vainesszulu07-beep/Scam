<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chess Viewer</title>

<style>
  body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h2 {
    margin-bottom: 10px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 70px);
    grid-template-rows: repeat(8, 70px);
    border: 4px solid #333;
  }

  .square {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    user-select: none;
  }

  .light {
    background: #f0d9b5;
  }

  .dark {
    background: #b58863;
  }

  #status {
    margin-top: 20px;
    background: #000;
    padding: 12px;
    border: 1px solid #333;
    width: 560px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h2>My Chess Game</h2>
<div id="board"></div>
<div id="status">Loading...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";
const SUPABASE_ANON =
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

const pieceMap = {
  "P": "♙",
  "R": "♖",
  "N": "♘",
  "B": "♗",
  "Q": "♕",
  "K": "♔",

  "p": "♟",
  "r": "♜",
  "n": "♞",
  "b": "♝",
  "q": "♛",
  "k": "♚",
};

function renderBoard(grid) {
  boardEl.innerHTML = "";

  for (let i = 0; i < 64; i++) {
    const square = document.createElement("div");

    const row = Math.floor(i / 8);
    const col = i % 8;

    square.className =
      "square " + ((row + col) % 2 === 0 ? "light" : "dark");

    const piece = grid[i] || "";
    square.textContent = pieceMap[piece] || "";

    boardEl.appendChild(square);
  }
}

async function loadGame() {
  try {
    const {
      data: { session },
    } = await supabase.auth.getSession();

    if (!session) {
      statusEl.textContent =
        "Not logged in. Open your app and login first.";
      return;
    }

    const userId = session.user.id;

    statusEl.textContent = "Searching for your active game...";

    const { data: games, error } = await supabase
      .from("games")
      .select("*")
      .or(`player_x.eq.${userId},player_o.eq.${userId}`)
      .eq("status", "playing")
      .limit(1);

    if (error) throw error;

    if (!games || games.length === 0) {
      statusEl.textContent = "No active chess game found.";
      return;
    }

    const game = games[0];

    if (!game.board_state?.grid) {
      statusEl.textContent =
        "Game found, but board_state.grid is missing.";
      return;
    }

    renderBoard(game.board_state.grid);

    statusEl.textContent =
`Loaded successfully

Game ID: ${game.id}
Turn: ${game.turn}
Status: ${game.status}`;
  } catch (err) {
    statusEl.textContent = "Error:\n" + err.message;
  }
}

loadGame();
</script>
</body>
</html>
