<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chess Viewer</title>
  <style>
    :root {
      --bg: #111;
      --panel: #0b0b0b;
      --line: #333;
      --text: #f3f3f3;
      --muted: #aaa;
      --light: #f0d9b5;
      --dark: #b58863;
      --accent: #00ff7f;
      --danger: #ff5c5c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: min(100%, 920px);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta div {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f0f0f;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .value {
      font-size: 14px;
      word-break: break-all;
    }

    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 72px);
      grid-template-rows: repeat(8, 72px);
      border: 4px solid #2a2a2a;
      width: fit-content;
      border-radius: 8px;
      overflow: hidden;
    }

    @media (max-width: 620px) {
      #board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
      }
    }

    .square {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      user-select: none;
      position: relative;
    }

    @media (max-width: 620px) {
      .square {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }

    .light { background: var(--light); }
    .dark { background: var(--dark); }

    .coord {
      position: absolute;
      left: 4px;
      bottom: 2px;
      font-size: 10px;
      color: rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 120px;
    }

    .good { color: var(--accent); }
    .bad { color: var(--danger); }

    button {
      background: var(--accent);
      color: #000;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>My Chess Game</h1>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div class="meta card">
      <div>
        <div class="label">Logged-in user</div>
        <div id="userInfo" class="value">Loading...</div>
      </div>
      <div>
        <div class="label">Game ID</div>
        <div id="gameIdInfo" class="value">-</div>
      </div>
      <div>
        <div class="label">Turn</div>
        <div id="turnInfo" class="value">-</div>
      </div>
      <div>
        <div class="label">Status</div>
        <div id="statusInfo" class="value">Loading...</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div id="board"></div>
      </div>

      <div class="card">
        <div class="label">Viewer log</div>
        <div id="status">Loading board...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";
    const SUPABASE_ANON = "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const userInfoEl = document.getElementById("userInfo");
    const gameIdInfoEl = document.getElementById("gameIdInfo");
    const turnInfoEl = document.getElementById("turnInfo");
    const statusInfoEl = document.getElementById("statusInfo");
    const refreshBtn = document.getElementById("refreshBtn");

    const pieceMap = {
      P: "♙",
      R: "♖",
      N: "♘",
      B: "♗",
      Q: "♕",
      K: "♔",
      p: "♟",
      r: "♜",
      n: "♞",
      b: "♝",
      q: "♛",
      k: "♚",
    };

    function renderBoard(grid) {
      boardEl.innerHTML = "";

      for (let i = 0; i < 64; i++) {
        const square = document.createElement("div");
        const row = Math.floor(i / 8);
        const col = i % 8;

        square.className = "square " + ((row + col) % 2 === 0 ? "light" : "dark");

        const piece = grid?.[i] ?? "";
        square.textContent = pieceMap[piece] || "";

        const coord = document.createElement("div");
        coord.className = "coord";
        coord.textContent = i;

        square.appendChild(coord);
        boardEl.appendChild(square);
      }
    }

    // 1. Upgraded Parser: Recursively parses double-stringified data
    function safeParseBoardState(boardState) {
      if (!boardState) return null;
      
      let parsed = boardState;
      let safetyLoop = 0;

      // Keep parsing as long as it's a string (up to 5 times to prevent infinite loops)
      while (typeof parsed === "string" && safetyLoop < 5) {
        try {
          parsed = JSON.parse(parsed);
        } catch (err) {
          // Fallback: If it fails due to single quotes, try swapping them to double quotes
          try {
            parsed = JSON.parse(parsed.replace(/'/g, '"'));
          } catch (e) {
            break; // Completely unparsable, exit loop
          }
        }
        safetyLoop++;
      }
      
      return parsed;
    }

    function fenToGrid(fen) {
      if (!fen || typeof fen !== "string") return null;

      const placement = fen.split(" ")[0];
      const rows = placement.split("/");
      if (rows.length !== 8) return null;

      const grid = [];

      for (const row of rows) {
        for (const ch of row) {
          if (/\d/.test(ch)) {
            const count = Number(ch);
            for (let i = 0; i < count; i++) grid.push("");
          } else {
            grid.push(ch);
          }
        }
      }

      return grid.length === 64 ? grid : null;
    }

    // 2. Upgraded Extractor: More forgiving with array lengths
    function extractGrid(boardState) {
      const parsed = safeParseBoardState(boardState);
      if (!parsed) return null;

      // Scenario A: It's a direct array
      if (Array.isArray(parsed)) return parsed;

      // Scenario B: It has a grid array (removed the strict === 64 check)
      if (parsed.grid && Array.isArray(parsed.grid)) {
        return parsed.grid;
      }

      // Scenario C: It was saved under 'board' instead of 'grid'
      if (parsed.board && Array.isArray(parsed.board)) {
        return parsed.board;
      }

      // Scenario D: Fallback to generating the grid from the FEN string
      if (parsed.fen) {
        const generated = fenToGrid(parsed.fen);
        if (generated) return generated;
      }

      return null;
    }

    function showMessage(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "bad" : "";
    }

    async function loadMyGame() {
      try {
        showMessage("Loading your game...");

        const { data: userRes, error: userError } = await supabase.auth.getUser();
        if (userError) throw userError;

        const user = userRes?.user;
        if (!user) {
          userInfoEl.textContent = "Not signed in";
          gameIdInfoEl.textContent = "-";
          turnInfoEl.textContent = "-";
          statusInfoEl.textContent = "Not signed in";
          renderBoard(new Array(64).fill(""));
          showMessage("No active session found. Sign in first.", true);
          return;
        }

        userInfoEl.textContent = user.email || user.id;

        const { data: games, error } = await supabase
          .from("games")
          .select("id, status, turn, board_state, player_x, player_o, last_move_at, winner")
          .or(`player_x.eq.${user.id},player_o.eq.${user.id}`)
          .order("last_move_at", { ascending: false })
          .limit(1);

        if (error) throw error;

        const game = games?.[0];
        if (!game) {
          gameIdInfoEl.textContent = "-";
          turnInfoEl.textContent = "-";
          statusInfoEl.textContent = "No game found";
          renderBoard(new Array(64).fill(""));
          showMessage("No game found for this user.", true);
          return;
        }

        gameIdInfoEl.textContent = game.id;
        turnInfoEl.textContent = game.turn ?? "-";
        statusInfoEl.textContent = game.status ?? "-";

        const grid = extractGrid(game.board_state);

        if (!grid) {
          renderBoard(new Array(64).fill(""));
          showMessage(
            "Game found, but board_state could not be read. Check that board_state has grid or fen.",
            true
          );
          return;
        }

        renderBoard(grid);

        showMessage(
          `Loaded successfully\n\nGame ID: ${game.id}\nTurn: ${game.turn}\nStatus: ${game.status}\nWinner: ${game.winner ?? "-"}`
        );
      } catch (err) {
        renderBoard(new Array(64).fill(""));
        showMessage(`Error: ${err.message}`, true);
      }
    }

    refreshBtn.addEventListener("click", loadMyGame);

    loadMyGame();
    setInterval(loadMyGame, 5000);
  </script>
</body>
</html>
