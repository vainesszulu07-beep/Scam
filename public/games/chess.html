<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2D Chess App</title>
  <style>
    :root {
      --bg-dark: #0b1320;
      --card-top: #1d3c63;
      --card-bottom: #1a2536;
      --light-square: #ecc591;
      --dark-square: #b88645;
      --highlight: rgba(245, 214, 72, 0.8);
      --text: #f8fbff;
    }

    body {
      margin: 0;
      background: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 20px;
      font-weight: bold;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .board-wrapper {
      width: 100%;
      padding: 0;
      margin: 0;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #000;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .cell.light { background: var(--light-square); }
    .cell.dark { background: var(--dark-square); }

    .cell.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--highlight);
      z-index: 1;
    }

    .piece {
      font-size: 2.2rem;
      z-index: 2;
      filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.6));
      transition: transform 0.1s ease;
    }

    .piece:active { transform: scale(1.1); }

    .white-piece {
      color: #f9f9f9;
      -webkit-text-stroke: 1.5px #222;
    }

    .black-piece {
      color: #222222;
      -webkit-text-stroke: 1px #fff;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <span id="status">CHECKMATE!</span>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    let state = { game: null, userId: null, selectedIdx: null, timerInterval: null };

    const PIECE_SYMBOLS = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚', 'P': '♟'
    };

    function initBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      for (let i = 0; i < 64; i++) {
        const row = Math.floor(i / 8);
        const col = i % 8;
        const cell = document.createElement('div');
        const isLight = (row + col) % 2 === 0;

        cell.className = `cell ${isLight ? 'light' : 'dark'}`;
        cell.dataset.index = i;
        cell.addEventListener('click', () => onCellClick(i));
        boardEl.appendChild(cell);
      }
    }

    function renderPieces() {
      if (!state.game || !state.game.board_state) return;

      document.querySelectorAll('.cell').forEach(cell => {
        cell.innerHTML = '';
        cell.classList.remove('selected');
      });

      const board = state.game.board_state;

      Object.keys(board).forEach(idx => {
        const p = board[idx];
        if (!p || p === "") return;

        const cell = document.querySelector(`.cell[data-index="${idx}"]`);
        if (!cell) return;

        const isWhite = (p === p.toUpperCase());
        const colorClass = isWhite ? 'white-piece' : 'black-piece';

        const pieceSpan = document.createElement('span');
        pieceSpan.className = `piece ${colorClass}`;
        pieceSpan.textContent = PIECE_SYMBOLS[p] || p;

        cell.appendChild(pieceSpan);
      });

      if (state.selectedIdx !== null) {
        const selectedCell = document.querySelector(`.cell[data-index="${state.selectedIdx}"]`);
        if (selectedCell) selectedCell.classList.add('selected');
      }
    }

    async function onCellClick(index) {
      if (!state.game) return;

      const clickedPiece = state.game.board_state[index.toString()];

      if (state.selectedIdx === null) {
        if (clickedPiece) {
          const isWhiteTurn = state.game.turn === 'W';
          const isPieceWhite = clickedPiece === clickedPiece.toUpperCase();

          if (isWhiteTurn === isPieceWhite) {
            state.selectedIdx = index;
            renderPieces();
          }
        }
      } else {
        if (state.selectedIdx !== index) {
          await executeMove(state.selectedIdx, index);
        }
        state.selectedIdx = null;
        renderPieces();
      }
    }

    async function executeMove(from, to) {
      const { error } = await supabase.rpc('make_move', {
        p_game_id: state.game.id,
        p_cell_index: to,
        p_from_index: from
      });

      if (error) alert(error.message);
    }

    function startTimer() {
      if (state.timerInterval) clearInterval(state.timerInterval);

      state.timerInterval = setInterval(() => {
        if (!state.game) return;

        const now = new Date();
        const lastMove = new Date(state.game.last_move_at);
        const diffSeconds = Math.floor((now - lastMove) / 1000);
        const remaining = Math.max(0, (state.game.time_left * 60) - diffSeconds);

        if (remaining <= 0) {
          supabase.rpc('handle_timeout', { p_game_id: state.game.id });
        }
      }, 1000);
    }

    async function syncGame() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get("gameId");
      if (!gameId) return;

      const { data: { user } } = await supabase.auth.getUser();
      state.userId = user?.id;

      const { data: game } = await supabase.from("games").select("*").eq("id", gameId).single();
      state.game = game;

      renderPieces();
      startTimer();
      updateUI();

      supabase.channel(`chess_${gameId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games' }, payload => {
          state.game = payload.new;
          state.selectedIdx = null;
          renderPieces();
          startTimer();
          updateUI();
        })
        .subscribe();
    }

    function updateUI() {
      if (!state.game) return;
      const isMyTurn = (state.game.turn === 'W' && state.game.player_x === state.userId) ||
                       (state.game.turn === 'B' && state.game.player_o === state.userId);
      document.getElementById('status').textContent = isMyTurn ? "Your Turn" : "Opponent Thinking...";
    }

    initBoard();
    syncGame();
  </script>
</body>
  </html>
