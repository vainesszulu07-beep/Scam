<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat-Bet Chess Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1320;
      --light-square: #ecc591;
      --dark-square: #b88645;
      --highlight: rgba(245, 214, 72, 0.8);
      --text: #f8fbff;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --modal-bg: #1e293b;
    }

    body {
      margin: 0;
      background: #f0f4f8;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
      color: white;
      background: #334155;
    }
    
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    .board-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #000;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .cell.light { background: var(--light-square); }
    .cell.dark { background: var(--dark-square); }

    .cell.selected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--highlight);
      z-index: 1;
    }

    .piece {
      font-size: 2.5rem;
      z-index: 2;
      filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.4));
    }

    .white-piece { color: #ffffff; -webkit-text-stroke: 1px #000; }
    .black-piece { color: #000000; -webkit-text-stroke: 0.5px #fff; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.open { display: flex; }

    .modal-card {
      background: var(--modal-bg);
      padding: 24px;
      text-align: center;
      width: 80%;
      border: 1px solid white;
    }

    #status { font-size: 14px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="overlay" id="quitOverlay">    
      <div class="modal-card">    
        <h2>FORFEIT?</h2>    
        <p>Leaving now will result in an immediate loss of your stake.</p>    
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="cancelQuitBtn" class="btn" style="flex:1">Cancel</button>
          <button id="confirmQuitBtn" class="btn btn-danger" style="flex:1">Quit</button>    
        </div>
      </div>    
    </div>

    <div class="header">
      <button id="quitBtn" class="btn btn-danger">Quit</button>
      <span id="status">SYNCING...</span>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const LOBBY_URL = "/lobby.html";

    let state = {
      game: null,
      userId: null,
      selectedIdx: null,
      channel: null
    };

    const PIECE_SYMBOLS = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♜', 'N': '♞', 'B': '♝', 'Q': '♛', 'K': '♚', 'P': '♟'
    };

    const quitBtn = document.getElementById('quitBtn');
    const quitOverlay = document.getElementById('quitOverlay');
    const cancelQuitBtn = document.getElementById('cancelQuitBtn');
    const confirmQuitBtn = document.getElementById('confirmQuitBtn');

    quitBtn.addEventListener('click', () => quitOverlay.classList.add('open'));
    cancelQuitBtn.addEventListener('click', () => quitOverlay.classList.remove('open'));
    confirmQuitBtn.addEventListener('click', async () => {
      await supabase.rpc('leave_game', { p_game_id: state.game.id });
      window.location.replace(LOBBY_URL);
    });

    function initBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let i = 0; i < 64; i++) {
        const cell = document.createElement('div');
        const row = Math.floor(i / 8);
        const col = i % 8;
        cell.className = `cell ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
        cell.dataset.index = i;
        cell.addEventListener('click', () => onCellClick(i));
        boardEl.appendChild(cell);
      }
    }

    function renderPieces() {
      if (!state.game || !state.game.board_state) return;
      document.querySelectorAll('.cell').forEach(c => {
        c.innerHTML = '';
        c.classList.remove('selected');
      });

      const board = state.game.board_state;
      Object.entries(board).forEach(([idx, p]) => {
        if (!p) return;
        const cell = document.querySelector(`.cell[data-index="${idx}"]`);
        if (!cell) return;

        const isWhite = p === p.toUpperCase();
        const span = document.createElement('span');
        span.className = `piece ${isWhite ? 'white-piece' : 'black-piece'}`;
        span.textContent = PIECE_SYMBOLS[p] || p;
        cell.appendChild(span);
      });

      if (state.selectedIdx !== null) {
        document.querySelector(`.cell[data-index="${state.selectedIdx}"]`)?.classList.add('selected');
      }
    }

    function updateUI() {
      if (!state.game) return;
      const turn = state.game.turn;
      const isMyTurn = (turn === 'W' && state.game.player_x === state.userId) || 
                       (turn === 'B' && state.game.player_o === state.userId);
      
      document.getElementById('status').textContent = isMyTurn ? "YOUR TURN" : "WAITING...";
    }

    async function onCellClick(index) {
      if (!state.game || state.game.status !== 'playing') return;

      const board = state.game.board_state;
      const clickedPiece = board[index.toString()];
      const turn = state.game.turn;

      if (state.selectedIdx === null) {
        if (clickedPiece) {
          // Verify if piece belongs to the active turn
          const isPieceWhite = clickedPiece === clickedPiece.toUpperCase();
          if ((turn === 'W' && isPieceWhite) || (turn === 'B' && !isPieceWhite)) {
            state.selectedIdx = index;
            renderPieces();
          }
        }
      } else {
        if (state.selectedIdx !== index) {
          await executeMove(state.selectedIdx, index);
        }
        state.selectedIdx = null;
        renderPieces();
      }
    }

    async function executeMove(from, to) {
      const { error } = await supabase.rpc('make_move', {
        p_game_id: state.game.id,
        p_from_index: from,
        p_cell_index: to
      });

      if (error) {
        console.error(error.message);
        // Clear selection on error
        state.selectedIdx = null;
        renderPieces();
      }
    }

    async function syncGame() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get("gameId");
      if (!gameId) return window.location.replace(LOBBY_URL);

      const { data: { user } } = await supabase.auth.getUser();
      state.userId = user?.id;
      if (!state.userId) return window.location.replace(LOBBY_URL);

      const { data: game, error } = await supabase
        .from("games")
        .select("*")
        .eq("id", gameId)
        .single();

      if (error || !game || game.status === 'finished') {
        return window.location.replace(LOBBY_URL);
      }

      state.game = game;
      renderPieces();
      updateUI();

      // Listen for moves and game updates
      state.channel = supabase
        .channel(`game_${gameId}`)
        .on('postgres_changes', { 
          event: 'UPDATE', 
          schema: 'public', 
          table: 'games', 
          filter: `id=eq.${gameId}` 
        }, payload => {
          const updated = payload.new;
          if (updated.status === 'finished') {
            alert(updated.winner_user === state.userId ? "VICTORY!" : "DEFEAT!");
            window.location.replace(LOBBY_URL);
            return;
          }
          state.game = updated;
          renderPieces();
          updateUI();
        })
        .subscribe();
    }

    initBoard();
    syncGame();
  </script>
</body>
</html>
