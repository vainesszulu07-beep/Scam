<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Game</title>
  <style>
    :root {
      --bg: #111;
      --panel: #0b0b0b;
      --line: #333;
      --text: #f3f3f3;
      --muted: #aaa;
      --light: #f0d9b5;
      --dark: #b58863;
      --accent: #00ff7f;
      --danger: #ff5c5c;
      --select: #4aa3ff;
      --target: #ffd24a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: min(100%, 1100px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .turn-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #0f0f0f;
      border: 1px solid var(--line);
      font-weight: bold;
    }

    .turn-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 72px);
      grid-template-rows: repeat(8, 72px);
      border: 4px solid #2a2a2a;
      width: fit-content;
      border-radius: 8px;
      overflow: hidden;
    }

    @media (max-width: 620px) {
      #board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
      }
    }

    .square {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      user-select: none;
      position: relative;
      cursor: pointer;
    }

    @media (max-width: 620px) {
      .square {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }

    .light { background: var(--light); }
    .dark { background: var(--dark); }

    .coord {
      position: absolute;
      left: 4px;
      bottom: 2px;
      font-size: 10px;
      color: rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .selected {
      outline: 4px solid var(--select);
      outline-offset: -4px;
    }

    .target {
      outline: 4px solid var(--target);
      outline-offset: -4px;
    }

    .lastMoveFrom {
      box-shadow: inset 0 0 0 4px rgba(0, 255, 127, 0.35);
    }

    .lastMoveTo {
      box-shadow: inset 0 0 0 4px rgba(0, 255, 127, 0.65);
    }

    .rightPanel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .buttonRow {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: var(--accent);
      color: #000;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: #222;
      color: var(--text);
      border: 1px solid #444;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    #status {
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 120px;
    }

    .bad { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="turn-pill" id="turnPill">
        <span class="turn-dot"></span>
        <span id="turnText">Loading...</span>
      </div>

      <div class="buttonRow">
        <button id="refreshBtn" class="secondary">Refresh</button>
        <button id="quitBtn">Quit</button>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div id="board"></div>
        <div class="hint">Tap one square to select a piece, then tap a destination square to move.</div>
      </div>

      <div class="card rightPanel">
        <div id="status">Loading board...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";
    const SUPABASE_ANON = "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";
    const INIT_EDGE_URL = `${SUPABASE_URL}/functions/v1/clever-processor`;
    const MOVE_EDGE_URL = `${SUPABASE_URL}/functions/v1/quick-responder`;

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const turnTextEl = document.getElementById("turnText");
    const refreshBtn = document.getElementById("refreshBtn");
    const quitBtn = document.getElementById("quitBtn");

    const pieceMap = {
      P: "♙", R: "♖", N: "♘", B: "♗", Q: "♕", K: "♔",
      p: "♟", r: "♜", n: "♞", b: "♝", q: "♛", k: "♚",
    };

    const state = {
      currentUser: null,
      currentGame: null,
      currentGrid: new Array(64).fill(""),
      selectedFromIndex: null,
      selectedToIndex: null,
      loading: false,
      lastMove: { from: null, to: null },
    };

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "bad" : "";
    }

    function safeParseBoardState(boardState) {
      if (!boardState) return null;

      let parsed = boardState;
      let safetyLoop = 0;

      while (typeof parsed === "string" && safetyLoop < 5) {
        try {
          parsed = JSON.parse(parsed);
        } catch {
          try {
            parsed = JSON.parse(parsed.replace(/'/g, '"'));
          } catch {
            break;
          }
        }
        safetyLoop++;
      }

      return parsed;
    }

    function fenToGrid(fen) {
      if (!fen || typeof fen !== "string") return null;

      const placement = fen.split(" ")[0];
      const rows = placement.split("/");
      if (rows.length !== 8) return null;

      const grid = [];

      for (const row of rows) {
        for (const ch of row) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < Number(ch); i++) grid.push("");
          } else {
            grid.push(ch);
          }
        }
      }

      return grid.length === 64 ? grid : null;
    }

    function objectMapToGrid(obj) {
      const grid = new Array(64).fill("");
      for (let i = 0; i < 64; i++) {
        if (Object.prototype.hasOwnProperty.call(obj, String(i))) {
          grid[i] = obj[String(i)] ?? "";
        }
      }
      return grid;
    }

    function extractGrid(boardState) {
      const parsed = safeParseBoardState(boardState);
      if (!parsed) return null;

      if (typeof parsed === "string" && parsed.includes("/")) {
        return fenToGrid(parsed);
      }

      if (Array.isArray(parsed) && parsed.length >= 64) {
        return parsed.slice(0, 64);
      }

      if (parsed && typeof parsed === "object") {
        if (Array.isArray(parsed.grid) && parsed.grid.length >= 64) {
          return parsed.grid.slice(0, 64);
        }

        if (Array.isArray(parsed.board) && parsed.board.length >= 64) {
          return parsed.board.slice(0, 64);
        }

        if (parsed.fen) {
          const gridFromFen = fenToGrid(parsed.fen);
          if (gridFromFen) return gridFromFen;
        }

        const keys = Object.keys(parsed);
        if (keys.some((k) => /^\d+$/.test(k))) {
          return objectMapToGrid(parsed);
        }
      }

      return null;
    }

    function getBoardIndexFromVisualIndex(visualIndex) {
      const side = orientationForCurrentUser();
      return side === "black" ? 63 - visualIndex : visualIndex;
    }

    function orientationForCurrentUser() {
      if (!state.currentGame || !state.currentUser) return "white";
      return state.currentGame.player_x === state.currentUser.id ? "white" : "black";
    }

    function isOwnPiece(piece) {
      if (!piece || !state.currentGame || !state.currentUser) return false;

      const mySide = orientationForCurrentUser();

      if (mySide === "white") {
        return piece === piece.toUpperCase();
      }
      return piece === piece.toLowerCase();
    }

    function renderBoard(grid) {
      state.currentGrid = Array.isArray(grid) ? grid.slice(0, 64) : new Array(64).fill("");
      boardEl.innerHTML = "";

      for (let visualIndex = 0; visualIndex < 64; visualIndex++) {
        const boardIndex = getBoardIndexFromVisualIndex(visualIndex);
        const row = Math.floor(visualIndex / 8);
        const col = visualIndex % 8;

        const square = document.createElement("div");
        square.className = "square " + ((row + col) % 2 === 0 ? "light" : "dark");

        const piece = state.currentGrid[boardIndex] || "";
        square.textContent = pieceMap[piece] || "";

        if (state.selectedFromIndex === boardIndex) square.classList.add("selected");
        if (state.selectedToIndex === boardIndex) square.classList.add("target");
        if (state.lastMove.from === boardIndex) square.classList.add("lastMoveFrom");
        if (state.lastMove.to === boardIndex) square.classList.add("lastMoveTo");

        const coord = document.createElement("div");
        coord.className = "coord";
        coord.textContent = boardIndex;

        square.appendChild(coord);
        square.addEventListener("click", () => onSquareClick(boardIndex));

        boardEl.appendChild(square);
      }

      updateTurnText();
    }

    function updateTurnText() {
      if (!state.currentGame || !state.currentUser) {
        turnTextEl.textContent = "Loading...";
        return;
      }

      const mySide = orientationForCurrentUser();
      const turn = state.currentGame.turn;

      if (!turn) {
        turnTextEl.textContent = "Game over";
        return;
      }

      const turnSide = turn === "w" ? "white" : "black";
      turnTextEl.textContent = turnSide === mySide ? "Your turn" : "Opponent's turn";
    }

    function isEmptyValue(value) {
      if (value === null || value === undefined) return true;
      if (value === "") return true;
      if (typeof value === "object") {
        if (Array.isArray(value)) return value.length === 0;
        return Object.keys(value).length === 0;
      }
      return false;
    }

    function shouldInitializeBoard(game) {
      return (
        game &&
        game.status === "playing" &&
        isEmptyValue(game.board_state) &&
        isEmptyValue(game.turn)
      );
    }

    async function getSessionUser() {
      const { data, error } = await supabase.auth.getUser();
      if (error) throw error;
      return data?.user || null;
    }

    async function rpcSingle(name, params) {
      const { data, error } = await supabase.rpc(name, params);
      if (error) throw error;
      return data;
    }

    async function callEdgeFunction(url, body) {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("No active session found");

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
          "apikey": SUPABASE_ANON,
        },
        body: JSON.stringify(body),
      });

      const result = await response.json().catch(() => ({}));
      return { response, result };
    }

    async function loadLatestGameForUser() {
      const user = await getSessionUser();
      state.currentUser = user;

      if (!user) {
        state.currentGame = null;
        state.currentGrid = new Array(64).fill("");
        state.selectedFromIndex = null;
        state.selectedToIndex = null;
        state.lastMove = { from: null, to: null };
        renderBoard(state.currentGrid);
        turnTextEl.textContent = "Loading...";
        setStatus("No active session found. Sign in first.", true);
        return null;
      }

      const { data: games, error } = await supabase
        .from("games")
        .select("id, status, turn, board_state, player_x, player_o, last_move_at, winner, game_type_id")
        .or(`player_x.eq.${user.id},player_o.eq.${user.id}`)
        .order("last_move_at", { ascending: false })
        .limit(1);

      if (error) throw error;

      const game = games?.[0] || null;
      state.currentGame = game;

      if (!game) {
        state.currentGrid = new Array(64).fill("");
        state.selectedFromIndex = null;
        state.selectedToIndex = null;
        state.lastMove = { from: null, to: null };
        renderBoard(state.currentGrid);
        turnTextEl.textContent = "Loading...";
        setStatus("No game found for this user.", true);
        return null;
      }

      const grid = extractGrid(game.board_state);
      if (grid) {
        state.currentGrid = grid;
      } else {
        state.currentGrid = new Array(64).fill("");
      }

      renderBoard(state.currentGrid);
      return game;
    }

    async function maybeInitializeBoard(game) {
      if (!shouldInitializeBoard(game)) {
        return game;
      }

      const startTurn = "w";

      const { response, result } = await callEdgeFunction(INIT_EDGE_URL, {
        gameId: game.id,
        startTurn,
      });

      if (!response.ok) {
        throw new Error(result?.error || `Initialization failed (${response.status})`);
      }

      const refreshed = await loadLatestGameForUser();
      return refreshed || game;
    }

    function clearSelection() {
      state.selectedFromIndex = null;
      state.selectedToIndex = null;
      renderBoard(state.currentGrid);
    }

    function getPromotionIfNeeded(fromIndex, toIndex) {
      const piece = state.currentGrid[fromIndex];
      if (!piece) return "q";

      const isPawn = piece === "P" || piece === "p";
      if (!isPawn) return "q";

      const toRow = Math.floor(toIndex / 8);
      if (piece === "P" && toRow === 0) return "q";
      if (piece === "p" && toRow === 7) return "q";

      return "q";
    }

    async function makeMove(fromIndex, toIndex) {
      if (!state.currentGame) throw new Error("No game loaded");
      if (state.currentGame.status !== "playing") throw new Error("Game is not active");

      const promotion = getPromotionIfNeeded(fromIndex, toIndex);

      const { response, result } = await callEdgeFunction(MOVE_EDGE_URL, {
        gameId: state.currentGame.id,
        fromIndex,
        toIndex,
        promotion,
      });

      if (!response.ok) {
        throw new Error(result?.error || `Move failed (${response.status})`);
      }

      state.lastMove = { from: fromIndex, to: toIndex };
      state.selectedFromIndex = null;
      state.selectedToIndex = null;

      await loadLatestGameForUser();
      renderBoard(state.currentGrid);
    }

    async function onSquareClick(boardIndex) {
      if (state.loading) return;
      if (!state.currentGame || !state.currentUser) return;

      if (state.currentGame.status !== "playing") {
        setStatus("This game is finished or inactive.", true);
        return;
      }

      const clickedPiece = state.currentGrid[boardIndex] || "";

      if (state.selectedFromIndex === null) {
        if (!clickedPiece) return;

        if (!isOwnPiece(clickedPiece)) {
          setStatus("That is not one of your pieces.", true);
          return;
        }

        state.selectedFromIndex = boardIndex;
        state.selectedToIndex = null;
        renderBoard(state.currentGrid);
        return;
      }

      if (state.selectedFromIndex === boardIndex) {
        clearSelection();
        return;
      }

      if (clickedPiece && isOwnPiece(clickedPiece)) {
        state.selectedFromIndex = boardIndex;
        state.selectedToIndex = null;
        renderBoard(state.currentGrid);
        return;
      }

      state.selectedToIndex = boardIndex;
      renderBoard(state.currentGrid);

      try {
        state.loading = true;
        await makeMove(state.selectedFromIndex, state.selectedToIndex);
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        state.loading = false;
        renderBoard(state.currentGrid);
        updateTurnText();
      }
    }

    async function refreshAll() {
      try {
        state.loading = true;

        const game = await loadLatestGameForUser();
        if (!game) return;

        const updatedGame = await maybeInitializeBoard(game);
        if (updatedGame) {
          state.currentGame = updatedGame;
        }

        const latestGrid = extractGrid(state.currentGame?.board_state);
        if (latestGrid) {
          state.currentGrid = latestGrid;
        }

        renderBoard(state.currentGrid);
        updateTurnText();
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
        renderBoard(new Array(64).fill(""));
        turnTextEl.textContent = "Loading...";
      } finally {
        state.loading = false;
      }
    }

    refreshBtn.addEventListener("click", refreshAll);

    quitBtn.addEventListener("click", async () => {
      try {
        if (!state.currentGame?.id) {
          setStatus("No game loaded.", true);
          return;
        }

        quitBtn.disabled = true;
        turnTextEl.textContent = "Leaving game...";

        await rpcSingle("leave_game", {
          p_game_id: state.currentGame.id
        });

        state.currentGame = null;
        state.currentGrid = new Array(64).fill("");
        state.selectedFromIndex = null;
        state.selectedToIndex = null;
        state.lastMove = { from: null, to: null };
        renderBoard(state.currentGrid);
        turnTextEl.textContent = "Loading...";
        setStatus("You left the game.");
      } catch (err) {
        setStatus(`Error: ${err.message}`, true);
      } finally {
        quitBtn.disabled = false;
        await refreshAll();
      }
    });

    await refreshAll();
    setInterval(refreshAll, 5000);
  </script>
</body>
  </html>
