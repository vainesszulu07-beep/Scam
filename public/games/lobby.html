<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Lobby</title>
  <style>
    :root{
      --bg:#f4f4f4;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#0d6efd;
      --success:#16a34a;
      --danger:#dc3545;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --sheet-shadow:0 -18px 50px rgba(0,0,0,.22);
      --radius:18px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 18px;
      text-align: center;
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    h2, h3 {
      margin: 8px 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      text-align: left;
    }

    #gameTypesList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .type-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .type-card:active {
      transform: scale(.98);
    }

    .type-card:hover {
      box-shadow: 0 14px 35px rgba(0,0,0,.12);
    }

    .type-image {
      width: 100%;
      aspect-ratio: 1.15 / 1;
      object-fit: cover;
      background: #e5e7eb;
      display: block;
    }

    .type-body {
      padding: 12px;
    }

    .type-name {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .type-meta {
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }

    #status {
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      white-space: pre-line;
      min-height: 56px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 999;
    }

    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(88vh, 860px);
      background: #fff;
      border-radius: 24px 24px 0 0;
      box-shadow: var(--sheet-shadow);
      transform: translateY(100%);
      transition: transform .32s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .sheet-overlay.open .sheet {
      transform: translateY(0);
    }

    .sheet-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: relative;
    }

    .sheet-thumb {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: cover;
      background: #eef2f7;
      flex: 0 0 auto;
    }

    .sheet-title {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .sheet-title h3 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.2;
    }

    .sheet-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .sheet-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .sheet-inner {
      width: 200%;
      height: 100%;
      display: flex;
      transition: transform .35s ease;
    }

    .sheet-inner.code-mode {
      transform: translateX(-50%);
    }

    .sheet-view {
      width: 50%;
      height: 100%;
      overflow-y: auto;
      padding: 14px;
      text-align: left;
      background: #fff;
    }

    .panel {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .row-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 15px;
      margin: 8px 0;
    }

    #sheetPlayBtn {
      background: var(--success);
      color: #fff;
    }

    #sheetExitBtn {
      background: var(--danger);
      color: #fff;
      display: none;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin: 4px 0 10px;
    }

    .game-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,.04);
    }

    .game-item strong {
      display: block;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      word-break: break-all;
    }

    .join-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .code-card {
      background: #0f172a;
      color: #fff;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 30px rgba(15,23,42,.18);
      margin-top: 12px;
    }

    .code-card h4 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .code-card p {
      margin: 0 0 14px;
      color: rgba(255,255,255,.76);
      font-size: 14px;
    }

    .code-input {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 16px;
      margin-bottom: 12px;
      background: #fff;
      color: #111827;
    }

    .code-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #22c55e;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .code-hint {
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,.76);
      min-height: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .selected-info {
      margin-top: 10px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px;
    }

    .selected-info .line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .selected-info .big {
      font-size: 16px;
      font-weight: 800;
      margin: 4px 0 6px;
    }

    .players-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      object-fit: cover;
      background: #e5e7eb;
      flex: 0 0 auto;
    }

    .player-main {
      flex: 1;
      min-width: 0;
    }

    .player-main .name {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .player-main .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #d1d5db;
      border-radius: 16px;
      background: #fafafa;
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      #gameTypesList { grid-template-columns: 1fr; }
      .sheet { height: 90vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🎮 Game Lobby</h2>
    <div class="card">
      <div id="status">Loading...</div>
    </div>

    <div class="card">
      <h3>Available Game Types</h3>
      <div id="gameTypesList"></div>
    </div>
  </div>

  <div id="sheetOverlay" class="sheet-overlay" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-top">
        <button id="sheetCloseBtn" class="icon-btn" aria-label="Close sheet">✕</button>
        <img id="sheetThumb" class="sheet-thumb" alt="">
        <div class="sheet-title">
          <h3 id="sheetName">Game</h3>
          <p id="sheetMeta">Board type</p>
        </div>
        <div class="sheet-actions">
          <button id="sheetModeBtn" class="icon-btn" aria-label="Switch view">🔑</button>
        </div>
      </div>

      <div id="sheetInner" class="sheet-inner">
        <section class="sheet-view">
          <div class="panel">
            <button id="sheetPlayBtn" class="row-btn">Play This Game</button>
            <button id="sheetExitBtn" class="row-btn">Exit Game</button>
          </div>

          <div class="selected-info" id="selectedInfo">
            <div class="line">Selected game</div>
            <div class="big" id="selectedInfoTitle">—</div>
            <div class="line" id="selectedInfoMeta">Tap a game type to start.</div>
          </div>

          <div class="section-title" style="margin-top:14px;">Waiting sessions for this type</div>
          <div id="waitingSessions" class="players-list"></div>
        </section>

        <section class="sheet-view">
          <div class="code-card">
            <h4>Join by game code</h4>
            <p>Enter the code from a waiting game of this same type.</p>
            <input id="gameCodeInput" class="code-input" type="text" placeholder="Enter game code" />
            <button id="joinByCodeBtn" class="code-submit">Join Game</button>
            <div id="joinCodeStatus" class="code-hint"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
    import { createGameIfNeeded, ensureIdleGame, getUserId } from "./js/create_game.js";
    import { loadAndRenderGameTypes } from "./js/list_games.js";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const statusEl = document.getElementById("status");
    const gameTypesListEl = document.getElementById("gameTypesList");

    const sheetOverlay = document.getElementById("sheetOverlay");
    const sheetInner = document.getElementById("sheetInner");
    const sheetCloseBtn = document.getElementById("sheetCloseBtn");
    const sheetModeBtn = document.getElementById("sheetModeBtn");
    const sheetThumb = document.getElementById("sheetThumb");
    const sheetName = document.getElementById("sheetName");
    const sheetMeta = document.getElementById("sheetMeta");
    const selectedInfoTitle = document.getElementById("selectedInfoTitle");
    const selectedInfoMeta = document.getElementById("selectedInfoMeta");
    const waitingSessionsEl = document.getElementById("waitingSessions");
    const sheetPlayBtn = document.getElementById("sheetPlayBtn");
    const sheetExitBtn = document.getElementById("sheetExitBtn");
    const gameCodeInput = document.getElementById("gameCodeInput");
    const joinByCodeBtn = document.getElementById("joinByCodeBtn");
    const joinCodeStatus = document.getElementById("joinCodeStatus");

    const PLACEHOLDER_IMAGE = "https://via.placeholder.com/600x400?text=Game";

    let userId = null;
    let myGame = null;
    let channel = null;
    let gameTypesChannel = null;

    let selectedGameType = null;
    let selectedGameTypeId = null;
    let selectedSheetMode = "players";
    let selectedTypeGamesChannel = null;
    let bootInProgress = false;
    let bootSessionUserId = null;

    function resetLobbyState() {
      if (gameTypesChannel) {
        supabase.removeChannel(gameTypesChannel);
        gameTypesChannel = null;
      }

      if (selectedTypeGamesChannel) {
        supabase.removeChannel(selectedTypeGamesChannel);
        selectedTypeGamesChannel = null;
      }

      if (channel) {
        supabase.removeChannel(channel);
        channel = null;
      }

      myGame = null;
      selectedGameType = null;
      selectedGameTypeId = null;
      selectedSheetMode = "players";

      gameCodeInput.value = "";
      joinCodeStatus.textContent = "";
      waitingSessionsEl.innerHTML = "";
      sheetOverlay.classList.remove("open");
      sheetOverlay.setAttribute("aria-hidden", "true");
      setStatus("Loading...");
    }

    function setStatus(text, mode = "") {
      statusEl.innerText = text;
      statusEl.className = mode ? mode : "";
    }

    function showRawError(context, err) {
      const raw = err && typeof err === "object"
        ? JSON.stringify(err, Object.getOwnPropertyNames(err), 2)
        : String(err);

      const message = err?.message ? err.message : String(err);
      const output = `${context}\n${message}\n\nRAW ERROR:\n${raw}`;

      statusEl.innerText = output;
      console.error(context, err);
    }

    async function getActivePlayingGame() {
      const { data, error } = await supabase
        .from("games")
        .select("*")
        .or(`player_x.eq.${userId},player_o.eq.${userId}`)
        .eq("status", "playing")
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error || !data) return null;
      return data;
    }

    function getInitialBoard(boardType) {
      if (boardType === "tictactoe") {
        return ["", "", "", "", "", "", "", "", ""];
      }
      return null;
    }

    async function getGameTypeById(gameTypeId) {
      const { data, error } = await supabase
        .from("game_types")
        .select("*")
        .eq("id", gameTypeId)
        .maybeSingle();

      if (error) throw error;
      return data;
    }

    async function loadProfilesByIds(ids) {
      const uniqueIds = [...new Set((ids || []).filter(Boolean))];
      if (uniqueIds.length === 0) return {};

      const { data, error } = await supabase
        .from("profile")
        .select("id, full_name, avatar_url")
        .in("id", uniqueIds);

      if (error) throw error;

      const map = {};
      (data || []).forEach((row) => {
        map[row.id] = row;
      });
      return map;
    }

    async function cleanOldGames() {
      await supabase
        .from("games")
        .update({
          status: "idle"
        })
        .eq("player_x", userId)
        .in("status", ["waiting", "playing"]);

      await supabase
        .from("games")
        .update({
          player_o: null,
          status: "waiting"
        })
        .eq("player_o", userId)
        .eq("status", "playing");
    }

    async function setOldPlayerXGameIdle(userId, keepGameId = null) {
      const { data: oldGames, error } = await supabase
        .from("games")
        .select("*")
        .eq("player_x", userId)
        .in("status", ["waiting", "playing"])
        .order("created_at", { ascending: false });

      if (error) throw error;
      if (!oldGames || oldGames.length === 0) return;

      for (const game of oldGames) {
        if (keepGameId && game.id === keepGameId) continue;

        await supabase
          .from("games")
          .update({
            status: "idle",
            player_o: null
          })
          .eq("id", game.id);
      }
    }

    function setSheetMode(mode) {
      selectedSheetMode = mode;
      sheetInner.classList.toggle("code-mode", mode === "code");
      sheetModeBtn.textContent = mode === "code" ? "👥" : "🔑";
    }

    function updateExitButtonVisibility(game) {
      const shouldShow =
        !!game &&
        game.status === "playing" &&
        (game.player_x === userId || game.player_o === userId);

      sheetExitBtn.style.display = shouldShow ? "block" : "none";
    }

    function updateSelectedInfo(gameType, game) {
      if (!gameType) {
        selectedInfoTitle.textContent = "—";
        selectedInfoMeta.textContent = "Tap a game type to start.";
        return;
      }

      selectedInfoTitle.textContent = gameType.name || "Selected game";

      if (game) {
        const lines = [];
        lines.push(`Your game: ${game.id}`);
        lines.push(`Status: ${game.status}`);
        lines.push(`Game type ID: ${game.game_type_id || "none"}`);
        if (game.player_x) lines.push(`Player X: ${game.player_x}`);
        if (game.player_o) lines.push(`Player O: ${game.player_o || "empty"}`);
        selectedInfoMeta.textContent = lines.join(" · ");
      } else {
        selectedInfoMeta.textContent = `Board type: ${gameType.board_type || "unknown"} · Game type ID: ${gameType.id}`;
      }
    }

    function updateMyGameUI(game) {
      if (!game) {
        sheetPlayBtn.textContent = "Play This Game";
        sheetPlayBtn.disabled = false;
        updateExitButtonVisibility(null);
        return;
      }

      if (game.status === "idle") {
        sheetPlayBtn.textContent = "Play This Game";
        sheetPlayBtn.disabled = false;
      } else if (game.status === "waiting") {
        sheetPlayBtn.textContent = "Waiting...";
        sheetPlayBtn.disabled = false;
      } else if (game.status === "playing") {
        sheetPlayBtn.textContent = "Playing...";
        sheetPlayBtn.disabled = true;
      } else {
        sheetPlayBtn.textContent = "Play This Game";
        sheetPlayBtn.disabled = true;
      }

      updateExitButtonVisibility(game);
    }

    async function loadWaitingGamesForType(gameTypeId) {
      const { data, error } = await supabase
        .from("games")
        .select("*")
        .eq("game_type_id", gameTypeId)
        .eq("status", "waiting")
        .is("player_o", null)
        .order("created_at", { ascending: false });

      if (error) throw error;

      const waitingGames = data || [];
      const hostIds = waitingGames.map(g => g.player_x);
      const profiles = await loadProfilesByIds(hostIds);

      waitingSessionsEl.innerHTML = "";

      if (waitingGames.length === 0) {
        waitingSessionsEl.innerHTML = `<div class="empty-state">No waiting sessions for this game type yet.</div>`;
        return;
      }

      waitingGames.forEach((game) => {
        const hostProfile = profiles[game.player_x] || {};
        const hostName = hostProfile.full_name || game.player_x || "Host";
        const avatar = hostProfile.avatar_url || PLACEHOLDER_IMAGE;

        const item = document.createElement("div");
        item.className = "game-item";
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;">
            <img class="avatar" src="${avatar}" alt="">
            <div style="flex:1;min-width:0;">
              <strong>${hostName}</strong>
              <div class="small">Game ID: ${game.id}</div>
              <div class="small">Status: ${game.status}</div>
            </div>
          </div>
          <div class="small" style="margin-top:8px;">Tap to paste code and join.</div>
          <button class="join-btn" type="button">Use Code</button>
        `;

        item.querySelector(".join-btn").onclick = () => {
          gameCodeInput.value = game.id;
          setSheetMode("code");
        };

        item.onclick = (e) => {
          if (e.target && e.target.classList && e.target.classList.contains("join-btn")) return;
          gameCodeInput.value = game.id;
          setSheetMode("code");
        };

        waitingSessionsEl.appendChild(item);
      });
    }

    async function subscribeToGameTypes() {
      if (gameTypesChannel) {
        await supabase.removeChannel(gameTypesChannel);
      }

      gameTypesChannel = supabase
        .channel("game-types-live")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "game_types" },
          () => {
            loadAndRenderGameTypes(
              supabase,
              gameTypesListEl,
              openGameTypeSheet,
              PLACEHOLDER_IMAGE
            ).catch((err) => showRawError("Failed to reload game types", err));
          }
        )
        .subscribe();
    }

    async function subscribeToSelectedTypeGames(gameTypeId) {
      if (selectedTypeGamesChannel) {
        await supabase.removeChannel(selectedTypeGamesChannel);
      }

      selectedTypeGamesChannel = supabase
        .channel(`games-${gameTypeId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "games",
            filter: `game_type_id=eq.${gameTypeId}`
          },
          async () => {
            if (!selectedGameType) return;
            await refreshSelectedTypeState();
          }
        )
        .subscribe();
    }

    async function refreshSelectedTypeState() {
      if (!selectedGameTypeId || !selectedGameType) return;

      const { data: refreshed, error } = await supabase
        .from("games")
        .select("*")
        .eq("id", myGame?.id || "")
        .maybeSingle();

      if (error) throw error;

      if (refreshed) myGame = refreshed;
      updateSelectedInfo(selectedGameType, myGame);
      updateMyGameUI(myGame);
      await loadWaitingGamesForType(selectedGameTypeId);
    }

    async function syncMyGameToSelectedType(gameType) {
      if (!myGame) throw new Error("No game available to sync");

      const typeChanged = myGame.game_type_id !== gameType.id;

      const updatePayload = {
        game_type_id: gameType.id,
        status: "waiting"
      };

      if (typeChanged) {
        updatePayload.player_o = null;
        updatePayload.turn = "X";
        updatePayload.winner = null;
        updatePayload.board_state = getInitialBoard(gameType.board_type);
      }

      const { data, error } = await supabase
        .from("games")
        .update(updatePayload)
        .eq("id", myGame.id)
        .select()
        .single();

      if (error) throw error;
      myGame = data;
      return myGame;
    }

    async function openGameTypeSheet(gameType, existingGame = null) {
      selectedGameType = gameType;
      selectedGameTypeId = gameType.id;

      sheetThumb.src = gameType.image_url || PLACEHOLDER_IMAGE;
      sheetName.textContent = gameType.name || "Game";
      sheetMeta.textContent = `Board type: ${gameType.board_type || "unknown"}`;

      joinCodeStatus.textContent = "";
      gameCodeInput.value = "";

      sheetOverlay.classList.add("open");
      sheetOverlay.setAttribute("aria-hidden", "false");
      setSheetMode("players");

      setStatus(`Loading ${gameType.name || "game"}...`);

      try {
        if (existingGame) {
          myGame = existingGame;
        } else {
          if (!myGame) {
            myGame = await createGameIfNeeded(supabase, userId);
          }
          myGame = await syncMyGameToSelectedType(gameType);
        }

        updateSelectedInfo(selectedGameType, myGame);
        updateMyGameUI(myGame);

        await loadWaitingGamesForType(gameType.id);
        await subscribeToSelectedTypeGames(gameType.id);

        setStatus(`Selected: ${gameType.name || "Game"}\nID: ${gameType.id}`);
      } catch (err) {
        showRawError("Could not open selected game type", err);
      }
    }

    function closeSheet() {
      sheetOverlay.classList.remove("open");
      sheetOverlay.setAttribute("aria-hidden", "true");
      selectedGameType = null;
      selectedGameTypeId = null;
      myGame = null;
      waitingSessionsEl.innerHTML = "";
      joinCodeStatus.textContent = "";

      if (selectedTypeGamesChannel) {
        supabase.removeChannel(selectedTypeGamesChannel);
        selectedTypeGamesChannel = null;
      }
    }

    async function joinWaitingGame(gameId, hostId) {
      try {
        await getUserId(supabase);

        if (!selectedGameType) {
          setStatus("⚠️ Select a game type first.");
          return;
        }

        if (hostId === userId) {
          setStatus("⚠️ You cannot join your own game.");
          return;
        }

        await cleanOldGames();

        if (myGame && myGame.status === "playing") {
          setStatus(`⚠️ You are already in a playing game.\nID: ${myGame.id}`);
          return;
        }

        if (myGame && myGame.status === "waiting" && myGame.player_x !== userId) {
          setStatus(`⚠️ You already have a waiting game.\nID: ${myGame.id}`);
          return;
        }

        await setOldPlayerXGameIdle(userId, gameId);

        const { error } = await supabase
          .from("games")
          .update({
            player_o: userId,
            status: "playing"
          })
          .eq("id", gameId)
          .eq("game_type_id", selectedGameTypeId)
          .is("player_o", null)
          .eq("status", "waiting");

        if (error) throw error;

        const { data: joinedGame, error: joinedError } = await supabase
          .from("games")
          .select("*")
          .eq("id", gameId)
          .maybeSingle();

        if (joinedError) throw joinedError;
        if (!joinedGame) throw new Error("Joined game not found after update");

        myGame = joinedGame;
        updateSelectedInfo(selectedGameType, myGame);
        updateMyGameUI(myGame);

        setStatus(`🎮 Joined game\nID: ${gameId}`);
        await loadWaitingGamesForType(selectedGameTypeId);
      } catch (err) {
        showRawError("Could not join that game", err);
      }
    }

    async function joinByCode() {
      try {
        await getUserId(supabase);

        if (!selectedGameType) {
          joinCodeStatus.textContent = "Select a game type first.";
          return;
        }

        const code = gameCodeInput.value.trim();
        if (!code) {
          joinCodeStatus.textContent = "Enter a game code first.";
          return;
        }

        joinCodeStatus.textContent = "Checking code...";

        const { data: targetGame, error } = await supabase
          .from("games")
          .select("*")
          .eq("id", code)
          .maybeSingle();

        if (error) throw error;
        if (!targetGame) {
          joinCodeStatus.textContent = "Game code not found.";
          return;
        }

        const targetGameType = await getGameTypeById(targetGame.game_type_id);

        if (!targetGameType) {
          joinCodeStatus.textContent = "Game type not found.";
          return;
        }

        selectedGameType = targetGameType;
        selectedGameTypeId = targetGameType.id;
        sheetThumb.src = targetGameType.image_url || PLACEHOLDER_IMAGE;
        sheetName.textContent = targetGameType.name || "Game";
        sheetMeta.textContent = `Board type: ${targetGameType.board_type || "unknown"}`;
        updateSelectedInfo(selectedGameType, myGame);

        if (targetGame.status !== "waiting" || targetGame.player_o) {
          joinCodeStatus.textContent = "That game is not available.";
          return;
        }

        await joinWaitingGame(targetGame.id, targetGame.player_x);
        joinCodeStatus.textContent = "Joined.";
        setSheetMode("players");
      } catch (err) {
        showRawError("Could not join by code", err);
        joinCodeStatus.textContent = `Could not join by code.\n${err?.message || String(err)}`;
      }
    }

    async function playCurrentType() {
      try {
        await getUserId(supabase);

        if (!selectedGameType) return;

        if (!myGame) {
          myGame = await createGameIfNeeded(supabase, userId);
        }

        myGame = await syncMyGameToSelectedType(selectedGameType);

        setStatus(`⏳ Your game is now waiting\nID: ${myGame.id}`);
        updateSelectedInfo(selectedGameType, myGame);
        updateMyGameUI(myGame);
        await loadWaitingGamesForType(selectedGameTypeId);
      } catch (err) {
        showRawError("Could not update your game", err);
      }
    }

    async function exitCurrentGame() {
      try {
        await getUserId(supabase);

        if (!myGame || myGame.status !== "playing") {
          sheetExitBtn.style.display = "none";
          return;
        }

        const isHost = myGame.player_x === userId;

        const update = isHost
          ? { status: "idle", player_o: null, game_type_id: null, turn: null, board_state: null, winner: null }
          : { status: "waiting", player_o: null };

        const { data, error } = await supabase
          .from("games")
          .update(update)
          .eq("id", myGame.id)
          .select()
          .single();

        if (error) throw error;

        myGame = data;
        updateSelectedInfo(selectedGameType, myGame);
        updateMyGameUI(myGame);

        if (isHost) {
          setStatus(`🚪 Game exited and reset to idle\nID: ${myGame.id}`);
        } else {
          setStatus(`🚪 You left the game\nID: ${myGame.id}`);
        }

        await loadWaitingGamesForType(selectedGameTypeId);
      } catch (err) {
        showRawError("Could not exit game", err);
      }
    }

    async function loadLobbyAfterGameExists() {
      try {
        await loadAndRenderGameTypes(
          supabase,
          gameTypesListEl,
          openGameTypeSheet,
          PLACEHOLDER_IMAGE
        );

        await subscribeToGameTypes();

        const activePlayingGame = await getActivePlayingGame();
        if (activePlayingGame) {
          myGame = activePlayingGame;
          const activeGameType = await getGameTypeById(activePlayingGame.game_type_id);

          if (activeGameType) {
            await openGameTypeSheet(activeGameType, activePlayingGame);
            setStatus(`Selected: ${activeGameType.name || "Game"}\nID: ${activeGameType.id}`);
            return;
          }
        }

        updateSelectedInfo(null, null);
        updateMyGameUI(myGame);

        if (myGame && myGame.status !== "idle") {
          const { data: resetGame, error } = await supabase
            .from("games")
            .update({ status: "idle" })
            .eq("id", myGame.id)
            .select()
            .single();

          if (error) throw error;
          if (resetGame) myGame = resetGame;
        }

        setStatus("Idle");
        statusEl.innerText = "Tap a game type to open it.";
      } catch (err) {
        showRawError("Failed to load lobby", err);
      }
    }

    async function boot(session) {
      if (!session?.user) {
        resetLobbyState();
        statusEl.innerText = "❌ Not logged in";
        return;
      }

      const nextUserId = session.user.id;
      if (bootInProgress && bootSessionUserId === nextUserId) return;

      bootInProgress = true;
      bootSessionUserId = nextUserId;

      try {
        resetLobbyState();
        userId = nextUserId;

        await createGameIfNeeded(supabase, userId);
        await loadLobbyAfterGameExists();
      } catch (err) {
        showRawError("Failed to load lobby", err);
      } finally {
        bootInProgress = false;
      }
    }

    sheetCloseBtn.onclick = closeSheet;
    sheetModeBtn.onclick = () => {
      setSheetMode(selectedSheetMode === "players" ? "code" : "players");
    };

    sheetPlayBtn.onclick = playCurrentType;
    sheetExitBtn.onclick = exitCurrentGame;
    joinByCodeBtn.onclick = joinByCode;

    gameCodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinByCode();
    });

    window.joinGame = joinWaitingGame;

    supabase.auth.onAuthStateChange(async (_event, session) => {
      await boot(session);
    });
  </script>
</body>
