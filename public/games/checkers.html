<!DOCTYPE html>    
<html lang="en">    
<head>    
  <meta charset="UTF-8" />    
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>    
  <title>Neon Checkers - Zambian Rules</title>    
  <style>    
    :root {    
      --bg: #050816;    
      --card: rgba(10, 14, 28, 0.88);    
      --text: #f8fbff;    
      --muted: #9aa4c1;    
      --line: rgba(255,255,255,0.08);    
      --accent: #7c3aed;    
      --accent2: #22d3ee;    
      --danger: #ef4444;    
      --success: #22c55e;    
      --dark-square: #1b2237;    
      --light-square: #d8deea;    
      --board-shadow: 0 0 0 1px rgba(124,58,237,.25), 0 20px 60px rgba(0,0,0,.45);    
      --shadow: 0 0 20px rgba(124, 58, 237, 0.22), 0 0 40px rgba(34, 211, 238, 0.12);    
    }    
    
    * { box-sizing: border-box; }    
    
    body {    
      margin: 0;    
      min-height: 100vh;    
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;    
      color: var(--text);    
      background:    
        radial-gradient(circle at top, rgba(124,58,237,.22), transparent 32%),    
        radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 28%),    
        linear-gradient(180deg, #04050d 0%, #070b18 100%);    
      display: flex;    
      align-items: center;    
      justify-content: center;    
      padding: 18px;    
    }    
    
    .app {    
      width: 100%;    
      max-width: 980px;    
      background: var(--card);    
      border: 1px solid var(--line);    
      border-radius: 28px;    
      box-shadow: var(--shadow);    
      overflow: hidden;    
      backdrop-filter: blur(14px);    
    }    
    
    .topbar {    
      padding: 14px 20px;    
      display: flex;    
      align-items: center;    
      justify-content: space-between;    
      border-bottom: 1px solid var(--line);    
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);    
    }    
    
    .exit-btn {    
      padding: 8px 16px;    
      border: none;    
      border-radius: 12px;    
      background: rgba(239,68,68,.15);    
      color: #fca5a5;    
      font-size: 14px;    
      font-weight: 700;    
      cursor: pointer;    
      border: 1px solid rgba(239,68,68,.2);    
      transition: all 0.2s;    
    }    
    
    .exit-btn:hover { background: rgba(239,68,68,.25); }    
    
    .status-pill {    
      padding: 8px 16px;    
      border-radius: 999px;    
      background: rgba(255,255,255,.06);    
      border: 1px solid rgba(255,255,255,.08);    
      font-size: 13px;    
      font-weight: 700;    
    }    
    
    .status-pill.live { background: rgba(34,197,94,.14); color: #a7f3d0; border-color: rgba(34,197,94,.25); }    
    
    .content { padding: 20px; }    
    
    .board-shell {    
      background: rgba(5, 10, 24, 0.9);    
      border: 1px solid rgba(124,58,237,.24);    
      border-radius: 24px;    
      padding: 12px;    
      box-shadow: var(--board-shadow);    
    }    
    
    .board {    
      display: grid;    
      grid-template-columns: repeat(8, 1fr);    
      gap: 4px;    
      aspect-ratio: 1 / 1;    
      width: 100%;    
      max-width: 600px;    
      margin: 0 auto;    
    }    
    
    .cell {    
      position: relative;    
      aspect-ratio: 1 / 1;    
      display: flex;    
      align-items: center;    
      justify-content: center;    
      border-radius: 4px;    
      cursor: pointer;    
    }    
    
    .cell.dark { background: #1a1f35; }    
    .cell.light { background: #2e3552; cursor: default; }    
    
    .cell.selected { box-shadow: inset 0 0 0 3px var(--accent2); }    
    .cell.valid-target::after {    
      content: '';    
      width: 20%;    
      height: 20%;    
      background: var(--success);    
      border-radius: 50%;    
      opacity: 0.6;    
    }    
    
    .piece {    
      width: 80%;    
      height: 80%;    
      border-radius: 50%;    
      position: relative;    
      transition: transform 0.2s;    
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);    
    }    
    
    .piece.black { background: radial-gradient(circle at 30% 30%, #444, #000); border: 2px solid #222; }    
    .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 2px solid #999; }    
    
    .piece.king::before {    
      content: '★';    
      position: absolute;    
      inset: 0;    
      display: grid;    
      place-items: center;    
      color: #fbbf24;    
      font-size: 24px;    
      text-shadow: 0 0 8px rgba(0,0,0,0.5);    
    }    
    
    .winner-overlay {    
      position: fixed;    
      inset: 0;    
      background: rgba(0,0,0,.8);    
      backdrop-filter: blur(10px);    
      display: none;    
      align-items: center;    
      justify-content: center;    
      z-index: 100;    
    }    
    
    .winner-overlay.open { display: flex; }    
    
    .winner-card {    
      background: var(--card);    
      padding: 40px;    
      border-radius: 32px;    
      text-align: center;    
      border: 1px solid var(--line);    
    }    

    .legend {    
      text-align: center;    
      margin-top: 20px;    
      font-size: 14px;    
      color: var(--muted);    
    }    
  </style>    
</head>    
<body>    
  <div class="winner-overlay" id="winnerOverlay">    
    <div class="winner-card">    
      <h1 id="winnerTitle">Winner!</h1>    
      <p id="winnerSub"></p>    
      <button onclick="location.reload()" class="exit-btn" style="background: var(--accent); color: white; margin-top: 20px;">Play Again</button>    
    </div>    
  </div>    
    
  <div class="app">    
    <div class="topbar">    
      <button id="exitBtn" class="exit-btn">Exit Game</button>    
      <div id="status" class="status-pill">Initializing...</div>    
    </div>    
    
    <div class="content">    
      <div class="board-shell">    
        <div id="board" class="board"></div>    
      </div>    
      <div class="legend">Zambian Rules: Flying Kings & Mandatory Double Jumps enabled.</div>    
    </div>    
  </div>    
    
  <script type="module">    
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";    
    
    const supabase = createClient(    
      "https://eimecuiixwgmpfpedxpr.supabase.co",    
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"    
    );    
    
    const els = {    
      statusEl: document.getElementById("status"),    
      boardEl: document.getElementById("board"),    
      winnerOverlay: document.getElementById("winnerOverlay"),    
      winnerTitle: document.getElementById("winnerTitle"),    
      winnerSub: document.getElementById("winnerSub")    
    };    
    
    const state = {    
      userId: null,    
      currentGame: null,    
      selectedIndex: null,    
      legalTargets: new Set()    
    };    
    
    // --- PATH SCANNING LOGIC (Matches SQL) ---
    function getLegalTargetsFromSelected(board, selectedIndex) {    
      const targets = new Set();    
      const piece = String(board[selectedIndex] || "").trim().toLowerCase();    
      if (!piece) return targets;    
    
      const row = Math.floor(selectedIndex / 8);    
      const col = selectedIndex % 8;    
      const isKing = piece.length === 2;    
      const color = piece[0]; // 'b' or 'w'    
      const enemyColor = color === 'b' ? 'w' : 'b';    
    
      const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];    
    
      for (const [dr, dc] of directions) {    
        // 1. Regular Piece Logic
        if (!isKing) {    
          // Check simple move (forward only)
          const forward = color === 'b' ? 1 : -1;    
          if (dr === forward) {    
            const r1 = row + dr, c1 = col + dc;    
            if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {    
              if (!board[r1 * 8 + c1]) targets.add(r1 * 8 + c1);    
            }    
          }    
          // Check standard jump (any diagonal direction in some variations, but usually forward)
          const r1 = row + dr, c1 = col + dc;    
          const r2 = row + dr * 2, c2 = col + dc * 2;    
          if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {    
            const midPiece = String(board[r1 * 8 + c1] || "").trim().toLowerCase();    
            if (midPiece && midPiece[0] === enemyColor && !board[r2 * 8 + c2]) {    
              targets.add(r2 * 8 + c2);    
            }    
          }    
        }     
        // 2. Flying King Logic (Zambian Rules)
        else {    
          let r = row + dr, c = col + dc;    
          let foundEnemy = false;    
    
          while (r >= 0 && r < 8 && c >= 0 && c < 8) {    
            const idx = r * 8 + c;    
            const currentPiece = String(board[idx] || "").trim().toLowerCase();    
    
            if (!foundEnemy) {    
              if (!currentPiece) {    
                targets.add(idx); // Sliding move    
              } else if (currentPiece[0] === color) {    
                break; // Blocked by own piece    
              } else {    
                foundEnemy = true; // Potentially jumping this enemy    
                var enemyIdx = idx;    
              }    
            } else {    
              if (!currentPiece) {    
                targets.add(idx); // Can land on any empty square after the enemy    
              } else {    
                break; // Blocked by another piece behind the enemy    
              }    
            }    
            r += dr; c += dc;    
          }    
        }    
      }    
      return targets;    
    }    
    
    async function handleCellClick(index) {    
      if (!state.currentGame || state.currentGame.status !== 'playing') return;    
    
      const board = state.currentGame.board_state;    
      const piece = String(board[index] || "").trim().toLowerCase();    
      const turn = state.currentGame.turn; // 'B' or 'W'    
    
      // Clicked own piece? Select it.
      if (piece && piece[0].toUpperCase() === turn) {    
        state.selectedIndex = index;    
        state.legalTargets = getLegalTargetsFromSelected(board, index);    
        renderBoard();    
        return;    
      }    
    
      // Clicked a valid target? Move.
      if (state.selectedIndex !== null && state.legalTargets.has(index)) {    
        try {    
          const { data, error } = await supabase.rpc('make_move', {    
            p_game_id: state.currentGame.id,    
            p_cell_index: index,    
            p_from_index: state.selectedIndex    
          });    
          if (error) throw error;    
          
          state.selectedIndex = null;    
          state.legalTargets = new Set();    
          // Refresh will happen via Realtime    
        } catch (err) {    
          alert(err.message);    
        }    
      }    
    }    
    
    function renderBoard() {    
      els.boardEl.innerHTML = "";    
      const board = state.currentGame?.board_state || Array(64).fill(null);    
    
      board.forEach((cellData, i) => {    
        const row = Math.floor(i / 8), col = i % 8;    
        const isDark = (row + col) % 2 === 1;    
        const cell = document.createElement("div");    
        cell.className = `cell ${isDark ? 'dark' : 'light'}`;    
        if (state.selectedIndex === i) cell.classList.add("selected");    
        if (state.legalTargets.has(i)) cell.classList.add("valid-target");    
    
        if (cellData) {    
          const p = document.createElement("div");    
          const pieceInfo = cellData.toLowerCase();    
          p.className = `piece ${pieceInfo[0] === 'b' ? 'black' : 'white'} ${pieceInfo.length > 1 ? 'king' : ''}`;    
          cell.appendChild(p);    
        }    
    
        cell.onclick = () => handleCellClick(i);    
        els.boardEl.appendChild(cell);    
      });    
    }    
    
    async function init() {    
      const { data: { user } } = await supabase.auth.getUser();    
      state.userId = user?.id;    
    
      const urlParams = new URLSearchParams(window.location.search);    
      const gameId = urlParams.get("gameId");    
    
      if (!gameId) {    
        els.statusEl.textContent = "No Game ID found";    
        return;    
      }    
    
      // 1. Initial Load    
      const { data: game } = await supabase.from("games").select("*").eq("id", gameId).single();    
      state.currentGame = game;    
      renderBoard();    
      updateStatus();    
    
      // 2. Realtime subscription    
      supabase.channel(`game:${gameId}`)    
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${gameId}` },     
        payload => {    
          state.currentGame = payload.new;    
          // If turn is still same player, keep selection for double jump? 
          // Database handles this, so we just clear selection on turn change.
          renderBoard();    
          updateStatus();    
          if (state.currentGame.status === 'finished') showWinner();    
        }).subscribe();    
    }    
    
    function updateStatus() {    
      const g = state.currentGame;    
      if (!g) return;    
      els.statusEl.className = `status-pill ${g.status === 'playing' ? 'live' : ''}`;    
      els.statusEl.textContent = g.status === 'playing' ? `Turn: ${g.turn}` : `Status: ${g.status}`;    
    }    
    
    function showWinner() {    
      els.winnerTitle.textContent = `${state.currentGame.winner} Wins!`;    
      els.winnerSub.textContent = "The game has concluded.";    
      els.winnerOverlay.classList.add("open");    
    }    
    
    init();    
  </script>    
</body>    
</html>
