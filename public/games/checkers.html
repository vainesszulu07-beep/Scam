<!DOCTYPE html>    
<html lang="en">    
<head>    
  <meta charset="UTF-8" />    
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>    
  <title>Elite Checkers Mobile</title>    
  <style>    
    :root {    
      --bg: #0a0c14;    
      --wood-dark: #2d1a12;    
      --wood-light: #6b4433;    
      --accent: #f59e0b;    
      --panel-bg: rgba(15, 20, 35, 0.95);    
    }    
    
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }    
    
    body {    
      background: var(--bg);    
      color: #fff;    
      font-family: system-ui, -apple-system, sans-serif;    
      height: 100vh;    
      overflow: hidden;    
      display: flex;    
      justify-content: center;    
      align-items: center;    
    }    
    
    .app-container {    
      display: flex;    
      flex-direction: row;    
      width: 100vw;    
      height: 100vh;    
      background: radial-gradient(circle at center, #1a1e30 0%, #0a0c14 100%);    
    }    
    
    .side-panel {    
      display: flex;    
      flex-direction: column;    
      justify-content: space-between;    
      align-items: center;    
      padding: 15px 10px;    
      background: var(--panel-bg);    
      border-right: 1px solid rgba(255,255,255,0.1);    
      backdrop-filter: blur(10px);    
      z-index: 10;    
      width: 80px;    
    }    
    
    .side-panel:last-child {     
      border-right: none;     
      border-left: 1px solid rgba(255,255,255,0.1);     
    }    
    
    .pieces-stack {    
      display: flex;    
      flex-direction: column;    
      gap: 12px;    
      align-items: center;    
    }    
    
    @media (orientation: portrait) {    
      .app-container { flex-direction: column; }    
      .side-panel {    
        flex-direction: row;    
        width: 100%;    
        height: 70px;    
        padding: 10px 20px;    
        border-right: none;    
        border-bottom: 1px solid rgba(255,255,255,0.1);    
      }    
      .side-panel:last-child {    
        border-left: none;    
        border-bottom: none;    
        border-top: 1px solid rgba(255,255,255,0.1);    
      }    
      .pieces-stack { flex-direction: row; }    
    }    
    
    .btn {    
      border: none;    
      border-radius: 10px;    
      font-weight: bold;    
      cursor: pointer;    
      display: flex;    
      align-items: center;    
      justify-content: center;    
    }    
    
    .exit-btn {    
      width: 45px;    
      height: 45px;    
      background: #ef4444;    
      color: white;    
      font-size: 20px;    
      box-shadow: 0 4px 0 #991b1b;    
    }    
    
    .timer-box {    
      background: #000;    
      padding: 6px;    
      border-radius: 10px;    
      border: 1.5px solid var(--accent);    
      min-width: 70px;    
      text-align: center;    
    }    
    .timer-box span { display: block; font-size: 9px; color: var(--accent); text-transform: uppercase; }    
    .timer-val { font-family: monospace; font-size: 15px; font-weight: bold; color: #fff; }    
    .timer-val.danger { color: #ff4444; animation: blink 1s infinite; }    
    @keyframes blink { 50% { opacity: 0.5; } }    
    
    .status-area {    
      position: absolute;    
      top: 2%;    
      left: 50%;    
      transform: translateX(-50%);    
      font-size: 13px;    
      font-weight: 900;    
      color: var(--accent);    
      text-transform: uppercase;    
      letter-spacing: 2px;    
      z-index: 5;    
      background: rgba(0,0,0,0.6);    
      padding: 6px 16px;    
      border-radius: 20px;    
      white-space: nowrap;    
    }    
    
    .board-container {    
      flex: 1;    
      display: flex;    
      justify-content: center;    
      align-items: center;    
      position: relative;    
      padding: 10px;    
    }    
    
    .wooden-frame {    
      background: #1a0f0a;    
      padding: clamp(8px, 2vmin, 16px);    
      border-radius: 8px;    
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);    
      display: flex;    
      justify-content: center;    
      align-items: center;    
    }    
    
    .board {    
      display: grid;    
      grid-template-columns: repeat(8, 1fr);    
      grid-template-rows: repeat(8, 1fr);    
      width: 90vmin;     
      height: 90vmin;    
      max-width: 800px;    
      max-height: 800px;    
      border: 3px solid #000;    
    }    
    
    .cell {    
      width: 100%;    
      height: 100%;    
      display: flex;    
      align-items: center;    
      justify-content: center;    
    }    
    
    .cell.light {    
      background: #d2b48c;    
      background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), linear-gradient(to bottom right, #e6ccb2, #b08968);    
    }    
    
    .cell.dark {    
      background: #3e2723;    
      background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), linear-gradient(to bottom right, #3e2723, #1b100e);    
    }    
    
    .cell.selected { box-shadow: inset 0 0 0 4px #22d3ee; z-index: 2; }    
    .cell.valid-target::after {    
      content: '';    
      width: 35%;    
      height: 35%;    
      background: rgba(34, 211, 238, 0.7);    
      border-radius: 50%;    
    }    
    
    .piece {    
      width: 85%;    
      height: 85%;    
      border-radius: 50%;    
      position: relative;    
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);    
    }    
    
    .piece.black {    
      background: radial-gradient(circle at 35% 35%, #444, #000 75%);    
      box-shadow: 0 4px 0 #000, 0 6px 10px rgba(0,0,0,0.8);    
      border: 1px solid #333;    
    }    
    
    .piece.white {    
      background: radial-gradient(circle at 35% 35%, #fff, #ccc 75%);    
      box-shadow: 0 4px 0 #999, 0 6px 10px rgba(0,0,0,0.4);    
      border: 1px solid #eee;    
    }    
    
    .piece.king::before {    
      content: '★';    
      position: absolute;    
      inset: 0;    
      display: flex;    
      align-items: center;    
      justify-content: center;    
      font-size: clamp(16px, 4vmin, 26px);    
      color: #f59e0b;    
      text-shadow: 0 1px 2px #000;    
    }    
    
    .overlay {    
      position: fixed;    
      inset: 0;    
      background: rgba(0,0,0,0.9);    
      display: none;    
      align-items: center;    
      justify-content: center;    
      z-index: 1000;    
      backdrop-filter: blur(5px);    
    }    
    .overlay.open { display: flex; }    
        
    .modal-card {    
      background: #1a1e30;    
      padding: 25px;    
      border-radius: 20px;    
      border: 2px solid var(--accent);    
      text-align: center;    
      width: 90%;    
      max-width: 320px;    
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);    
    }    
    
    .btn.primary { background: var(--accent); color: #000; padding: 12px 20px; width: 100%; font-size: 16px; margin-top: 10px; }    
    .btn.danger-text { background: #ef4444; color: white; padding: 12px; flex: 1; }    
    .btn.secondary { background: #444; color: white; padding: 12px; flex: 1; }    
  </style>    
</head>    
<body>    
  <div class="app-container">    
    <div class="side-panel">    
      <button id="exitBtn" class="btn exit-btn">✕</button>    
      <div style="font-size: 10px; color: #666; font-weight: bold;">v1.3.1</div>    
    </div>    
    
    <div class="board-container">    
      <div id="status" class="status-area">SYNCING...</div>    
      <div class="wooden-frame">    
        <div id="board" class="board"></div>    
      </div>    
    </div>    
    
    <div class="side-panel">    
      <div class="timer-box">    
        <span>Time Left</span>    
        <div id="timer" class="timer-val">30:00</div>    
      </div>    
      <div class="pieces-stack">    
        <div class="piece black" style="width: 30px; height: 30px; box-shadow: none;"></div>    
        <div class="piece white" style="width: 30px; height: 30px; box-shadow: none;"></div>    
      </div>    
    </div>    
  </div>    
    
  <div class="overlay" id="exitOverlay">    
    <div class="modal-card">    
      <h2 style="color: #ef4444; margin-bottom: 10px;">Forfeit Game?</h2>    
      <p style="font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.4;">    
        If you leave now, you will lose the game and your opponent will claim all the winnings.    
      </p>    
      <div style="display: flex; gap: 10px; width: 100%;">    
        <button id="cancelExitBtn" class="btn secondary">Cancel</button>    
        <button id="confirmExitBtn" class="btn danger-text">Leave</button>    
      </div>    
    </div>    
  </div>    
    
  <div class="overlay" id="winnerOverlay">    
    <div class="modal-card">    
      <h2 id="winnerTitle" style="color:var(--accent); margin-bottom:5px; font-size: 24px;">Winner!</h2>    
      <div id="winnerBadge" style="font-weight:bold; font-size: 18px; color:#22c55e; margin-bottom:20px;"></div>    
      <button onclick="location.reload()" class="btn primary">Back to Lobby</button>    
    </div>    
  </div>    
    
  <script type="module">    
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";    
    
    const supabase = createClient(    
      "https://eimecuiixwgmpfpedxpr.supabase.co",    
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"    
    );    
    
    const INITIAL_CHECKERS_BOARD = [    
      null, "b", null, "b", null, "b", null, "b",    
      "b", null, "b", null, "b", null, "b", null,    
      null, "b", null, "b", null, "b", null, "b",    
      null, null, null, null, null, null, null, null,    
      null, null, null, null, null, null, null, null,    
      "w", null, "w", null, "w", null, "w", null,    
      null, "w", null, "w", null, "w", null, "w",    
      "w", null, "w", null, "w", null, "w", null    
    ];    
    
    const els = {    
      statusEl: document.getElementById("status"),    
      timerEl: document.getElementById("timer"),    
      boardEl: document.getElementById("board"),    
      exitBtn: document.getElementById("exitBtn"),    
      exitOverlay: document.getElementById("exitOverlay"),    
      cancelExitBtn: document.getElementById("cancelExitBtn"),    
      confirmExitBtn: document.getElementById("confirmExitBtn"),    
      winnerOverlay: document.getElementById("winnerOverlay"),    
      winnerTitle: document.getElementById("winnerTitle"),    
      winnerBadge: document.getElementById("winnerBadge")    
    };    
    
    const BOARD_SIZE = 64;    
    const urlParams = new URLSearchParams(window.location.search);    
    const urlGameId = urlParams.get("gameId");    
    
    const state = {    
      userId: null,    
      currentGame: null,    
      boardTemplate: INITIAL_CHECKERS_BOARD.slice(),    
      realtimeChannel: null,    
      winnerPopupOpen: false,    
      selectedIndex: null,    
      gameType: null,    
      gameTypeId: null,    
      legalTargets: new Set()    
    };    
    
    function isArray64(value) {    
      return Array.isArray(value) && value.length === 64;    
    }    
    
    function normalizeBoard(board) {    
      if (!Array.isArray(board)) return board;    
      return board.map((value) => (value === "" ? null : value));    
    }    
    
    function normalizeRow(data) {    
      if (!data) return null;    
      if (Array.isArray(data)) return data[0] || null;    
      return data;    
    }    
    
    async function rpcSingle(name, args = {}) {    
      const { data, error } = await supabase.rpc(name, args);    
      if (error) throw error;    
      return normalizeRow(data);    
    }    
    
    function setStatus(text, mode = "") {    
      els.statusEl.textContent = text;    
      els.statusEl.className = "status-pill" + (mode ? ` ${mode}` : "");    
    }    
    
    function formatAmount(value) {    
      const n = Number(value ?? 0);    
      return Number.isFinite(n) ? new Intl.NumberFormat().format(n) : "0";    
    }    
    
    function showRawError(context, err) {    
      const raw = err && typeof err === "object"    
        ? JSON.stringify(err, Object.getOwnPropertyNames(err), 2)    
        : String(err);    
      const message = err?.message ? err.message : String(err);    
      setStatus(`${context}\n${message}\n\nRAW ERROR:\n${raw}`, "finished");    
      console.error(context, err);    
    }    
    
    async function getUser() {    
      const { data: { session }, error } = await supabase.auth.getSession();    
      if (error || !session || !session.user) throw new Error("Not logged in");    
      state.userId = session.user.id;    
      return state.userId;    
    }    
    
    async function loadGameType(gameTypeId) {    
      if (!gameTypeId) return null;    
      const { data, error } = await supabase    
        .from("game_types")    
        .select("id, name, file_type, board_template")    
        .eq("id", gameTypeId)    
        .maybeSingle();    
      if (error) throw error;    
      state.gameType = data || null;    
      state.gameTypeId = gameTypeId;    
    
      if (data?.board_template && isArray64(data.board_template)) {    
        state.boardTemplate = normalizeBoard(data.board_template);    
      } else {    
        state.boardTemplate = INITIAL_CHECKERS_BOARD.slice();    
      }    
    
      return state.gameType;    
    }    
    
    function getSquareKind(index) {    
      const row = Math.floor(index / 8);    
      const col = index % 8;    
      return (row + col) % 2 === 1 ? "dark" : "light";    
    }    
    
    function getTurnSymbol() {    
      return String(state.currentGame?.turn || "").trim().toUpperCase();    
    }    
    
    function parsePiece(piece) {    
      const raw = String(piece || "").trim().toLowerCase();    
      if (!raw) return null;    
      if (raw === "b") return { side: "black", king: false, label: "B" };    
      if (raw === "bk") return { side: "black", king: true, label: "B" };    
      if (raw === "w") return { side: "white", king: false, label: "W" };    
      if (raw === "wk") return { side: "white", king: true, label: "W" };    
      return { side: "unknown", king: false, label: piece };    
    }    
    
    function createBoard() {    
      els.boardEl.innerHTML = "";    
      for (let i = 0; i < BOARD_SIZE; i++) {    
        const cell = document.createElement("div");    
        cell.className = `cell ${getSquareKind(i)}`;    
        cell.id = `cell${i}`;    
        cell.dataset.index = String(i);    
        els.boardEl.appendChild(cell);    
      }    
    }    
    
    function clearBoardMarks() {    
      for (let i = 0; i < BOARD_SIZE; i++) {    
        const el = document.getElementById(`cell${i}`);    
        if (!el) continue;    
        el.classList.remove("selected", "valid-target");    
      }    
    }    
    
    function renderBoard(board) {    
      const safeBoard = isArray64(board) ? normalizeBoard(board) : state.boardTemplate;    
      clearBoardMarks();    
    
      for (let i = 0; i < BOARD_SIZE; i++) {    
        const el = document.getElementById(`cell${i}`);    
        if (!el) continue;    
    
        const piece = parsePiece(safeBoard[i]);    
        el.innerHTML = "";    
        el.classList.toggle("selected", state.selectedIndex === i);    
        el.classList.toggle("valid-target", state.legalTargets.has(i));    
    
        if (getSquareKind(i) === "dark") {    
          el.classList.add("dark");    
          el.classList.remove("light");    
          el.onclick = () => handleCellClick(i);    
        } else {    
          el.classList.add("light");    
          el.classList.remove("dark");    
          el.onclick = null;    
        }    
    
        if (piece) {    
          const pieceEl = document.createElement("div");    
          pieceEl.className = `piece ${piece.side}${piece.king ? " king" : ""}`;    
          pieceEl.textContent = piece.label;    
          el.appendChild(pieceEl);    
        }    
      }    
    }    
    
    function syncMeta(game) {    
      if (!game) {    
        setStatus("No active game", "");    
        return;    
      }    
    
      const turn = getTurnSymbol();    
    
      if (game.status === "playing") {    
        setStatus(turn ? `Live game · Turn: ${turn}` : "Live game", "live");    
      } else if (game.status === "waiting") {    
        setStatus("Waiting for opponent", "waiting");    
      } else if (game.status === "finished") {    
        const amount = formatAmount(game.winnings || 0);    
        if (game.winner) {    
          setStatus(`Game finished · Winner: ${game.winner} · Won: ${amount}`, "finished");    
        } else {    
          setStatus("Game finished · Draw", "finished");    
        }    
      } else {    
        setStatus("Idle", "");    
      }    
    }    
    
    async function loadWinnerProfile(userId) {    
      if (!userId) return null;    
      const { data, error } = await supabase    
        .from("profile")    
        .select("id, full_name, avatar_url")    
        .eq("id", userId)    
        .maybeSingle();    
      if (error) throw error;    
      return data || null;    
    }    
    
    function openWinnerPopup({ winnerUser, winnerSymbol, winnings = 0, isDraw = false }) {    
      if (isDraw) {    
        els.winnerTitle.textContent = "DRAW!";    
        els.winnerBadge.textContent = "🤝 Match ended in a draw";    
      } else {    
        const name = winnerUser?.full_name || "Winner";    
        els.winnerTitle.textContent = name;    
        els.winnerBadge.textContent = `🏆 Won ${formatAmount(winnings)}`;    
      }    
    
      els.winnerOverlay.classList.add("open");    
      els.winnerOverlay.setAttribute("aria-hidden", "false");    
      state.winnerPopupOpen = true;    
    }    
    
    function closeWinnerPopup() {    
      els.winnerOverlay.classList.remove("open");    
      els.winnerOverlay.setAttribute("aria-hidden", "true");    
      state.winnerPopupOpen = false;    
    }    
    
    function getMySide() {    
      if (!state.currentGame) return null;    
      if (state.currentGame.player_x === state.userId) return "B";    
      if (state.currentGame.player_o === state.userId) return "W";    
      return null;    
    }    
    
    function isPlayersPiece(piece) {    
      const low = String(piece || "").trim().toLowerCase();    
      if (!state.currentGame) return false;    
    
      const turn = getTurnSymbol();    
      if (turn === "B") return low === "b" || low === "bk";    
      if (turn === "W") return low === "w" || low === "wk";    
      return false;    
    }    
    
    function getLegalTargetsFromSelected(board, selectedIndex) {    
      const targets = new Set();    
      const piece = String(board?.[selectedIndex] || "").trim().toLowerCase();    
      if (!piece) return targets;    
    
      const row = Math.floor(selectedIndex / 8);    
      const col = selectedIndex % 8;    
      const isBlack = piece === "b" || piece === "bk";    
      const isWhite = piece === "w" || piece === "wk";    
      const isKing = piece === "bk" || piece === "wk";    
    
      const directions = [];    
      if (isBlack || isKing) directions.push([1, -1], [1, 1]);    
      if (isWhite || isKing) directions.push([-1, -1], [-1, 1]);    
    
      const enemyPieces = isBlack ? ["w", "wk"] : ["b", "bk"];    
    
      for (const [dr, dc] of directions) {    
        const r1 = row + dr;    
        const c1 = col + dc;    
        if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {    
          const idx1 = r1 * 8 + c1;    
          const sq1 = String(board?.[idx1] || "").trim().toLowerCase();    
          if (!sq1) {    
            targets.add(idx1);    
          } else if (enemyPieces.includes(sq1)) {    
            const r2 = row + dr * 2;    
            const c2 = col + dc * 2;    
            if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {    
              const idx2 = r2 * 8 + c2;    
              const sq2 = String(board?.[idx2] || "").trim().toLowerCase();    
              if (!sq2) targets.add(idx2);    
            }    
          }    
        }    
      }    
    
      return targets;    
    }    
    
    async function showWinnerIfFinished(game) {    
      if (!game || game.status !== "finished") return;    
    
      if (game.winner_user) {    
        try {    
          const profile = await loadWinnerProfile(game.winner_user);    
          openWinnerPopup({    
            winnerUser: profile || { id: game.winner_user, full_name: "Winner", avatar_url: null },    
            winnerSymbol: game.winner || null,    
            winnings: game.winnings || 0,    
            isDraw: false    
          });    
        } catch (err) {    
          showRawError("Could not load winner profile", err);    
          openWinnerPopup({    
            winnerUser: { id: game.winner_user, full_name: "Winner", avatar_url: null },    
            winnerSymbol: game.winner || null,    
            winnings: game.winnings || 0,    
            isDraw: false    
          });    
        }    
      } else {    
        openWinnerPopup({ winnerUser: null, winnerSymbol: null, winnings: 0, isDraw: true });    
      }    
    }    
    
    async function syncCurrentGame(game) {    
      state.currentGame = game || null;    
    
      if (game?.game_type_id) {    
        const gt = await loadGameType(game.game_type_id).catch(() => null);    
        if (gt?.board_template && isArray64(gt.board_template)) {    
          state.boardTemplate = normalizeBoard(gt.board_template);    
        }    
      }    
    
      if (state.currentGame?.status === "playing" && isArray64(state.currentGame.board_state) && state.selectedIndex !== null) {    
        state.legalTargets = getLegalTargetsFromSelected(state.currentGame.board_state, state.selectedIndex);    
      } else {    
        state.legalTargets = new Set();    
      }    
    
      renderBoard(game?.board_state || state.boardTemplate);    
      syncMeta(game);    
    
      if (game?.status === "finished") {    
        await showWinnerIfFinished(game);    
      }    
    }    
    
    function subscribeToGame(gameId) {    
      if (state.realtimeChannel) {    
        supabase.removeChannel(state.realtimeChannel);    
        state.realtimeChannel = null;    
      }    
    
      if (!gameId) return;    
    
      state.realtimeChannel = supabase    
        .channel(`checkers-${gameId}`)    
        .on(    
          "postgres_changes",    
          {    
            event: "*",    
            schema: "public",    
            table: "games",    
            filter: `id=eq.${gameId}`    
          },    
          async (payload) => {    
            const updated = payload.new;    
            if (!updated) return;    
            await syncCurrentGame(updated);    
          }    
        )    
        .subscribe();    
    }    
    
    async function loadGame() {    
      try {    
        await getUser();    
    
        let game = null;    
    
        if (urlGameId) {    
          const { data, error } = await supabase    
            .from("games")    
            .select("*")    
            .eq("id", urlGameId)    
            .maybeSingle();    
    
          if (error) throw error;    
          if (data && (data.player_x === state.userId || data.player_o === state.userId)) {    
            game = data;    
          }    
        }    
    
        if (!game) {    
          game = await rpcSingle("get_active_playing_game");    
        }    
    
        if (!game) {    
          state.currentGame = null;    
          renderBoard(state.boardTemplate);    
          syncMeta(null);    
          return;    
        }    
    
        await syncCurrentGame(game);    
        subscribeToGame(game.id);    
    
        if (game.status === "finished") {    
          await showWinnerIfFinished(game);    
        }    
      } catch (err) {    
        showRawError("Failed to load game", err);    
      }    
    }    
    
    async function handleCellClick(index) {    
      if (!state.currentGame || state.currentGame.status !== "playing") return;    
    
      const board = state.currentGame.board_state || state.boardTemplate;    
      const piece = String(board?.[index] || "").trim().toLowerCase();    
      const clickedIsOwnPiece = isPlayersPiece(piece);    
    
      if (state.selectedIndex === null) {    
        if (clickedIsOwnPiece) {    
          state.selectedIndex = index;    
          state.legalTargets = getLegalTargetsFromSelected(board, index);    
          renderBoard(board);    
        }    
        return;    
      }    
    
      if (index === state.selectedIndex) {    
        state.selectedIndex = null;    
        state.legalTargets = new Set();    
        renderBoard(board);    
        return;    
      }    
    
      if (!state.legalTargets.has(index)) {    
        if (clickedIsOwnPiece) {    
          state.selectedIndex = index;    
          state.legalTargets = getLegalTargetsFromSelected(board, index);    
          renderBoard(board);    
        }    
        return;    
      }    
    
      try {    
        const updated = await rpcSingle("make_move", {    
          p_game_id: state.currentGame.id,    
          p_cell_index: index,    
          p_from_index: state.selectedIndex    
        });    
    
        state.selectedIndex = null;    
        state.legalTargets = new Set();    
    
        if (updated) {    
          await syncCurrentGame(updated);    
        }    
      } catch (err) {    
        showRawError("Could not make move", err);    
      }    
    }    
    
    function startTimer(game) {    
      if (!game || game.status !== "playing") {    
        els.timerEl.textContent = "00:00";    
        els.timerEl.classList.remove("danger");    
        return;    
      }    
    
      const minsLeft = game.time_left !== undefined && game.time_left !== null    
        ? game.time_left    
        : 30;    
    
      els.timerEl.textContent = `${String(minsLeft).padStart(2, "0")}:00`;    
      els.timerEl.classList.toggle("danger", minsLeft <= 1);    
    }    
    
    async function showWinner(game) {    
      els.timerEl.textContent = "00:00";    
    
      const mySide = getMySide();    
      if (game.winner === mySide) {    
        els.winnerTitle.textContent = "YOU WON!";    
        els.winnerTitle.style.color = "#22c55e";    
        els.winnerBadge.textContent = game.winnings ? `+${game.winnings} COINS` : "";    
      } else if (game.winner) {    
        els.winnerTitle.textContent = "YOU LOST!";    
        els.winnerTitle.style.color = "#ef4444";    
        els.winnerBadge.textContent = "Better luck next time.";    
      } else {    
        els.winnerTitle.textContent = "DRAW!";    
        els.winnerTitle.style.color = "var(--accent)";    
        els.winnerBadge.textContent = "";    
      }    
    
      els.winnerOverlay.classList.add("open");    
    }    
    
    async function leaveGame() {    
      if (!state.currentGame) return;    
      try {    
        const updated = await rpcSingle("leave_game", {    
          p_game_id: state.currentGame.id    
        });    
        closeWinnerPopup();    
        await syncCurrentGame(updated);    
        if (updated?.status === "idle" || updated?.status === "waiting") {    
          window.location.href = "lobby.html";    
        }    
      } catch (err) {    
        showRawError("Could not exit game", err);    
      }    
    }    
    
    els.exitBtn.onclick = () => {    
      if (state.currentGame && state.currentGame.status === "playing") {    
        els.exitOverlay.classList.add("open");    
      } else {    
        window.location.href = "lobby.html";    
      }    
    };    
    
    els.cancelExitBtn.onclick = () => {    
      els.exitOverlay.classList.remove("open");    
    };    
    
    els.confirmExitBtn.onclick = async () => {    
      if (state.currentGame) {    
        await rpcSingle("leave_game", { p_game_id: state.currentGame.id });    
      }    
      window.location.href = "lobby.html";    
    };    
    
    els.winnerCloseBtn.onclick = closeWinnerPopup;    
    els.winnerOverlay.addEventListener("click", (e) => {    
      if (e.target === els.winnerOverlay) closeWinnerPopup();    
    });    
    
    async function init() {    
      createBoard();    
      const { data: { session } } = await supabase.auth.getSession();    
      if (!session) return;    
      state.userId = session.user.id;    
          
      const game = await rpcSingle("get_active_playing_game");    
      await syncCurrentGame(game);    
      startTimer(game);    
          
      if (game) {    
        supabase.channel(`game-${game.id}`)    
          .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: `id=eq.${game.id}` },     
          p => syncCurrentGame(p.new)).subscribe();    
      }    
    }    
    
    init();    
  </script>    
</body>    
  </html>
