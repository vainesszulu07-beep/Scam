<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Elite Checkers Mobile</title>
  <style>
    :root {
      --bg: #0a0c14;
      --wood-dark: #2d1a12;
      --wood-light: #6b4433;
      --accent: #f59e0b;
      --panel-bg: rgba(15, 20, 35, 0.95);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1e30 0%, #0a0c14 100%);
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px 10px;
      background: var(--panel-bg);
      border-right: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      z-index: 10;
      width: 80px;
    }

    .side-panel:last-child { 
      border-right: none; 
      border-left: 1px solid rgba(255,255,255,0.1); 
    }

    .pieces-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    @media (orientation: portrait) {
      .app-container { flex-direction: column; }
      .side-panel {
        flex-direction: row;
        width: 100%;
        height: 70px;
        padding: 10px 20px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .side-panel:last-child {
        border-left: none;
        border-bottom: none;
        border-top: 1px solid rgba(255,255,255,0.1);
      }
      .pieces-stack { flex-direction: row; }
    }

    .btn {
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .exit-btn {
      width: 45px;
      height: 45px;
      background: #ef4444;
      color: white;
      font-size: 20px;
      box-shadow: 0 4px 0 #991b1b;
    }

    .timer-box {
      background: #000;
      padding: 6px;
      border-radius: 10px;
      border: 1.5px solid var(--accent);
      min-width: 70px;
      text-align: center;
    }
    .timer-box span { display: block; font-size: 9px; color: var(--accent); text-transform: uppercase; }
    .timer-val { font-family: monospace; font-size: 15px; font-weight: bold; color: #fff; }
    .timer-val.danger { color: #ff4444; animation: blink 1s infinite; }
    
    @keyframes blink { 50% { opacity: 0.5; } }

    .status-area {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 5;
      background: rgba(0,0,0,0.6);
      padding: 6px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .board-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 10px;
    }

    .wooden-frame {
      background: #1a0f0a;
      padding: clamp(8px, 2vmin, 16px);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 90vmin; 
      height: 90vmin;
      max-width: 800px;
      max-height: 800px;
      border: 3px solid #000;
    }

    .cell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell.light {
      background: #d2b48c;
      background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), linear-gradient(to bottom right, #e6ccb2, #b08968);
    }

    .cell.dark {
      background: #3e2723;
      background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), linear-gradient(to bottom right, #3e2723, #1b100e);
    }

    .cell.selected { box-shadow: inset 0 0 0 4px #22d3ee; z-index: 2; }
    .cell.valid-target::after {
      content: '';
      width: 35%;
      height: 35%;
      background: rgba(34, 211, 238, 0.7);
      border-radius: 50%;
    }

    .piece {
      width: 85%;
      height: 85%;
      border-radius: 50%;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .piece.black {
      background: radial-gradient(circle at 35% 35%, #444, #000 75%);
      box-shadow: 0 4px 0 #000, 0 6px 10px rgba(0,0,0,0.8);
      border: 1px solid #333;
    }

    .piece.white {
      background: radial-gradient(circle at 35% 35%, #fff, #ccc 75%);
      box-shadow: 0 4px 0 #999, 0 6px 10px rgba(0,0,0,0.4);
      border: 1px solid #eee;
    }

    .piece.king::before {
      content: '★';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px, 4vmin, 26px);
      color: #f59e0b;
      text-shadow: 0 1px 2px #000;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }
    .overlay.open { display: flex; }
    
    .modal-card {
      background: #1a1e30;
      padding: 25px;
      border-radius: 20px;
      border: 2px solid var(--accent);
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .btn.primary { background: var(--accent); color: #000; padding: 12px 20px; width: 100%; font-size: 16px; margin-top: 10px; }
    .btn.danger-text { background: #ef4444; color: white; padding: 12px; flex: 1; }
    .btn.secondary { background: #444; color: white; padding: 12px; flex: 1; }

  </style>
</head>
<body>

  <div class="app-container">
    <div class="side-panel">
      <button id="exitBtn" class="btn exit-btn">✕</button>
      <div style="font-size: 10px; color: #666; font-weight: bold;">v1.3.1</div>
    </div>

    <div class="board-container">
      <div id="status" class="status-area">SYNCING...</div>
      <div class="wooden-frame">
        <div id="board" class="board"></div>
      </div>
    </div>

    <div class="side-panel">
      <div class="timer-box">
        <span>Time Left</span>
        <div id="timer" class="timer-val">30:00</div>
      </div>
      <div class="pieces-stack">
        <div class="piece black" style="width: 30px; height: 30px; box-shadow: none;"></div>
        <div class="piece white" style="width: 30px; height: 30px; box-shadow: none;"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="exitOverlay">
    <div class="modal-card">
      <h2 style="color: #ef4444; margin-bottom: 10px;">Forfeit Game?</h2>
      <p style="font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.4;">
        If you leave now, you will lose the game and your opponent will claim all the winnings.
      </p>
      <div style="display: flex; gap: 10px; width: 100%;">
        <button id="cancelExitBtn" class="btn secondary">Cancel</button>
        <button id="confirmExitBtn" class="btn danger-text">Leave</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="winnerOverlay">
    <div class="modal-card">
      <h2 id="winnerTitle" style="color:var(--accent); margin-bottom:5px; font-size: 24px;">Winner!</h2>
      <div id="winnerBadge" style="font-weight:bold; font-size: 18px; color:#22c55e; margin-bottom:20px;"></div>
      <button onclick="location.reload()" class="btn primary">Back to Lobby</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const INITIAL_CHECKERS_BOARD = Array(64).fill(null); 

    const els = {
      statusEl: document.getElementById("status"),
      timerEl: document.getElementById("timer"),
      boardEl: document.getElementById("board"),
      exitBtn: document.getElementById("exitBtn"),
      exitOverlay: document.getElementById("exitOverlay"),
      cancelExitBtn: document.getElementById("cancelExitBtn"),
      confirmExitBtn: document.getElementById("confirmExitBtn"),
      winnerOverlay: document.getElementById("winnerOverlay"),
      winnerTitle: document.getElementById("winnerTitle"),
      winnerBadge: document.getElementById("winnerBadge")
    };

    const state = {
      userId: null,
      currentGame: null,
      boardTemplate: INITIAL_CHECKERS_BOARD,
      selectedIndex: null,
      legalTargets: new Set()
    };

    function getMySide() {
      if (!state.currentGame) return null;
      if (state.currentGame.player_x === state.userId) return "B";
      if (state.currentGame.player_o === state.userId) return "W";
      return null;
    }

    // Helper to read from board regardless of if it's an array or object
    function getBoardCell(board, index) {
        if (!board) return null;
        return board[index] || board[index.toString()] || null;
    }

    async function rpcSingle(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return Array.isArray(data) ? data[0] : data;
    }

    function parsePiece(piece) {
      const raw = String(piece || "").trim().toLowerCase();
      if (raw === "b") return { side: "black", king: false };
      if (raw === "bk") return { side: "black", king: true };
      if (raw === "w") return { side: "white", king: false };
      if (raw === "wk") return { side: "white", king: true };
      return null;
    }

    function getLegalTargetsFromSelected(board, selectedIndex) {
      const targets = new Set();
      const pieceVal = getBoardCell(board, selectedIndex);
      const pieceStr = String(pieceVal || "").trim().toLowerCase();
      if (!pieceStr) return targets;

      const row = Math.floor(selectedIndex / 8), col = selectedIndex % 8;
      const isBlack = pieceStr.startsWith("b"), isWhite = pieceStr.startsWith("w"), isKing = pieceStr.endsWith("k");
      const directions = [];
      if (isBlack || isKing) directions.push([1, -1], [1, 1]);
      if (isWhite || isKing) directions.push([-1, -1], [-1, 1]);

      const enemyPieces = isBlack ? ["w", "wk"] : ["b", "bk"];

      for (const [dr, dc] of directions) {
        const r1 = row + dr, c1 = col + dc;
        if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
          const idx1 = r1 * 8 + c1;
          const sq1Val = getBoardCell(board, idx1);
          const sq1Str = String(sq1Val || "").trim().toLowerCase();
          
          if (!sq1Str) {
            targets.add(idx1);
          } else if (enemyPieces.includes(sq1Str)) {
            const r2 = row + dr * 2, c2 = col + dc * 2;
            if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
              const idx2 = r2 * 8 + c2;
              const sq2Val = getBoardCell(board, idx2);
              const sq2Str = String(sq2Val || "").trim().toLowerCase();
              if (!sq2Str) targets.add(idx2);
            }
          }
        }
      }
      return targets;
    }

    function createBoard() {
      els.boardEl.innerHTML = "";
      for (let i = 0; i < 64; i++) {
        const row = Math.floor(i / 8), col = i % 8;
        const cell = document.createElement("div");
        cell.className = `cell ${(row + col) % 2 === 1 ? "dark" : "light"}`;
        cell.onclick = () => handleCellClick(i);
        cell.id = `c${i}`;
        els.boardEl.appendChild(cell);
      }
    }

    function renderBoard(board) {
      for (let i = 0; i < 64; i++) {
        const el = document.getElementById(`c${i}`);
        el.innerHTML = "";
        el.className = el.className.replace(/selected|valid-target/g, "").trim();
        if (state.selectedIndex === i) el.classList.add("selected");
        if (state.legalTargets.has(i)) el.classList.add("valid-target");

        const pieceData = parsePiece(getBoardCell(board, i));
        if (pieceData) {
          const p = document.createElement("div");
          p.className = `piece ${pieceData.side}${pieceData.king ? " king" : ""}`;
          el.appendChild(p);
        }
      }
    }

    async function syncCurrentGame(game) {
      state.currentGame = game || null;
      if (game?.status === "playing" && state.selectedIndex !== null) {
        state.legalTargets = getLegalTargetsFromSelected(game.board_state, state.selectedIndex);
      } else {
        state.legalTargets = new Set();
      }
      renderBoard(game?.board_state);

      const mySide = getMySide();
      if (game?.status === "playing") {
        if (game.turn === mySide) {
          els.statusEl.textContent = "YOUR TURN";
          els.statusEl.style.color = "#22c55e";
        } else {
          els.statusEl.textContent = "OPPONENT'S TURN";
          els.statusEl.style.color = "var(--accent)";
        }
      } else {
        els.statusEl.textContent = "WAITING...";
      }

      updateTimerDisplay(game);
      if (game?.status === "finished") showWinner(game);
    }

    function updateTimerDisplay(game) {
      if (!game || game.status !== "playing") {
        els.timerEl.textContent = "00:00";
        return;
      }
      const minsLeft = game.time_left ?? 30;
      els.timerEl.textContent = `${String(minsLeft).padStart(2, '0')}:00`;
      els.timerEl.classList.toggle("danger", minsLeft <= 1);
    }

    async function showWinner(game) {
      els.timerEl.textContent = "00:00";
      const mySide = getMySide();
      if (game.winner === mySide) {
        els.winnerTitle.textContent = "YOU WON!";
        els.winnerTitle.style.color = "#22c55e";
        els.winnerBadge.textContent = game.winnings ? `+${game.winnings} COINS` : "";
      } else if (game.winner) {
        els.winnerTitle.textContent = "YOU LOST!";
        els.winnerTitle.style.color = "#ef4444";
        els.winnerBadge.textContent = "Better luck next time.";
      } else {
        els.winnerTitle.textContent = "DRAW!";
        els.winnerTitle.style.color = "var(--accent)";
        els.winnerBadge.textContent = "";
      }
      els.winnerOverlay.classList.add("open");
    }

    async function handleCellClick(i) {
      if (!state.currentGame || state.currentGame.status !== "playing") return;
      const board = state.currentGame.board_state;
      const pieceVal = getBoardCell(board, i);
      const piece = parsePiece(pieceVal);
      const turn = state.currentGame.turn;
      const mySide = getMySide();

      if (turn !== mySide) return; 

      const isMyPiece = piece && (
        (turn === "B" && piece.side === "black") || 
        (turn === "W" && piece.side === "white")
      );

      if (state.selectedIndex === null) {
        if (isMyPiece) {
          state.selectedIndex = i;
          state.legalTargets = getLegalTargetsFromSelected(board, i);
          renderBoard(board);
        }
      } else {
        if (state.legalTargets.has(i)) {
          // Perform Move via RPC
          const fromIdx = state.selectedIndex;
          state.selectedIndex = null; 
          state.legalTargets = new Set();
          
          try {
              const updated = await rpcSingle("make_move", {
                p_game_id: state.currentGame.id,
                p_cell_index: i,
                p_from_index: fromIdx
              });
              await syncCurrentGame(updated);
          } catch (e) {
              console.error("Move failed:", e);
              await syncCurrentGame(state.currentGame); 
          }
        } else {
          state.selectedIndex = isMyPiece ? i : null;
          state.legalTargets = isMyPiece ? getLegalTargetsFromSelected(board, i) : new Set();
          renderBoard(board);
        }
      }
    }

    els.exitBtn.onclick = () => {
      if (state.currentGame && state.currentGame.status === "playing") {
        els.exitOverlay.classList.add("open");
      } else {
        window.location.href = "lobby.html";
      }
    };

    els.cancelExitBtn.onclick = () => {
      els.exitOverlay.classList.remove("open");
    };

    els.confirmExitBtn.onclick = async () => {
      if (state.currentGame) {
        await rpcSingle("leave_game", { p_game_id: state.currentGame.id });
      }
      window.location.href = "lobby.html";
    };

    async function init() {
      createBoard();
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      state.userId = session.user.id;
      
      const game = await rpcSingle("get_active_playing_game");
      await syncCurrentGame(game);
      
      if (game) {
        supabase.channel(`game-${game.id}`)
          .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: `id=eq.${game.id}` }, 
          p => syncCurrentGame(p.new)).subscribe();
      }
    }

    init();
  </script>
</body>
</html>
