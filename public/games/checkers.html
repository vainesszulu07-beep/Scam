<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Checkers</title>
  <style>
    :root {
      --bg: #050816;
      --card: rgba(10, 14, 28, 0.88);
      --text: #f8fbff;
      --muted: #9aa4c1;
      --line: rgba(255,255,255,0.08);
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --danger: #ef4444;
      --success: #22c55e;
      --board-shadow: 0 0 0 1px rgba(124,58,237,.25), 0 20px 60px rgba(0,0,0,.45);
      --shadow: 0 0 20px rgba(124, 58, 237, 0.22), 0 0 40px rgba(34, 211, 238, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Arial, sans-serif;
      color: var(--text); padding: 18px; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, rgba(124,58,237,.22), transparent 32%),
                  radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 28%),
                  linear-gradient(180deg, #04050d 0%, #070b18 100%);
    }
    .app {
      width: 100%; max-width: 980px; background: var(--card); border: 1px solid var(--line);
      border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(14px); overflow: hidden;
    }
    .topbar {
      padding: 14px 14px 10px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    }
    .exit-btn {
      width: 42px; height: 42px; border: none; border-radius: 12px; background: rgba(239,68,68,.92);
      color: #fff; font-size: 18px; font-weight: 800; cursor: pointer; display: grid; place-items: center;
    }
    .status-pill {
      padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08); font-size: 13px; font-weight: 700; text-align: center;
    }
    .status-pill.live { background: rgba(34,197,94,.14); color: #a7f3d0; border-color: rgba(34,197,94,.25); }
    .status-pill.waiting { background: rgba(245,158,11,.14); color: #fde68a; border-color: rgba(245,158,11,.25); }
    .content { padding: 16px; }
    .board-shell {
      background: rgba(5, 10, 24, 0.9); border: 1px solid rgba(124,58,237,.24);
      border-radius: 24px; padding: 14px; box-shadow: var(--board-shadow);
    }
    .board {
      display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px;
      aspect-ratio: 16 / 10; width: 100%; max-width: 920px; margin: 0 auto;
    }
    .cell {
      position: relative; border: 1px solid rgba(255,255,255,.06); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; user-select: none;
      transition: transform .14s ease, box-shadow .14s ease; min-height: 72px;
    }
    .cell.dark { background: linear-gradient(180deg, #28324f, #151a2b); cursor: pointer; }
    .cell.light { background: linear-gradient(180deg, #d9dfec, #b8c0d2); cursor: default; }
    .cell.dark:hover { transform: translateY(-1px) scale(1.01); box-shadow: inset 0 0 24px rgba(34,211,238,.12); }
    .cell.selected { outline: 2px solid rgba(34, 211, 238, 0.9); box-shadow: 0 0 22px rgba(34, 211, 238, 0.22); }
    .cell.valid-target { box-shadow: inset 0 0 0 2px rgba(34,197,94,.9); }
    .piece {
      width: min(78%, 52px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
      font-weight: 900; font-size: clamp(16px, 2vw, 22px); border: 2px solid rgba(255,255,255,.2);
      box-shadow: 0 10px 16px rgba(0,0,0,.28); position: relative;
    }
    .piece.black { background: radial-gradient(circle at 30% 30%, #4b5563, #06070c 70%); color: #f8fbff; }
    .piece.white { background: radial-gradient(circle at 30% 30%, #ffffff, #cfd8e6 70%); color: #111827; }
    .piece.king::after {
      content: '★'; position: absolute; top: -7px; right: -6px; width: 18px; height: 18px;
      border-radius: 50%; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #111827;
      display: grid; place-items: center; font-size: 11px;
    }
    .legend { display: flex; gap: 10px; justify-content: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="app">
    <div class="topbar">
      <button id="exitBtn" class="exit-btn">⟲</button>
      <div id="status" class="status-pill">Loading...</div>
    </div>
    <div class="content">
      <div class="board-shell">
        <div id="board" class="board"></div>
        <div class="legend">
          <span>Black moves Down | White moves Up</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const els = {
      statusEl: document.getElementById("status"),
      boardEl: document.getElementById("board"),
      exitBtn: document.getElementById("exitBtn")
    };

    const state = {
      userId: null,
      currentGame: null,
      boardTemplate: Array.from({ length: 64 }, (_, i) => ((i % 8) + Math.floor(i / 8)) % 2 === 1 ? "" : null),
      selectedIndex: null,
      legalTargets: new Set()
    };

    async function rpcSingle(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return Array.isArray(data) ? data[0] : data;
    }

    function parsePiece(piece) {
      const raw = String(piece || "").trim().toUpperCase();
      if (raw === "B") return { side: "black", king: false, label: "B" };
      if (raw === "BK") return { side: "black", king: true, label: "B" };
      if (raw === "W") return { side: "white", king: false, label: "W" };
      if (raw === "WK") return { side: "white", king: true, label: "W" };
      return null;
    }

    function createBoard() {
      els.boardEl.innerHTML = "";
      for (let i = 0; i < 64; i++) {
        const cell = document.createElement("div");
        const isDark = ((Math.floor(i / 8) + (i % 8)) % 2 === 1);
        cell.className = `cell ${isDark ? "dark" : "light"}`;
        cell.id = `cell${i}`;
        els.boardEl.appendChild(cell);
      }
    }

    function renderBoard(board) {
      const safeBoard = board && board.length === 64 ? board : state.boardTemplate;
      
      for (let i = 0; i < 64; i++) {
        const el = document.getElementById(`cell${i}`);
        if (!el) continue;

        el.innerHTML = "";
        el.classList.remove("selected", "valid-target");
        
        if (state.selectedIndex === i) el.classList.add("selected");
        if (state.legalTargets.has(i)) el.classList.add("valid-target");

        if (el.classList.contains("dark")) {
          el.onclick = () => handleCellClick(i);
        }

        const piece = parsePiece(safeBoard[i]);
        if (piece) {
          const pieceEl = document.createElement("div");
          pieceEl.className = `piece ${piece.side}${piece.king ? " king" : ""}`;
          pieceEl.textContent = piece.label;
          el.appendChild(pieceEl);
        }
      }
    }

    function getLegalTargets(board, index) {
      const targets = new Set();
      const piece = String(board[index] || "").toUpperCase();
      if (!piece) return targets;

      const row = Math.floor(index / 8);
      const col = index % 8;
      const isBlack = piece.startsWith("B");
      const isKing = piece.endsWith("K");

      const dirs = [];
      if (isBlack || isKing) dirs.push([1, -1], [1, 1]); // Move Down
      if (!isBlack || isKing) dirs.push([-1, -1], [-1, 1]); // Move Up

      for (const [dr, dc] of dirs) {
        const r1 = row + dr, c1 = col + dc;
        if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
          const idx1 = r1 * 8 + c1;
          const sq1 = String(board[idx1] || "").toUpperCase();
          
          if (!sq1) {
            targets.add(idx1); // Regular move
          } else if ((isBlack && sq1.startsWith("W")) || (!isBlack && sq1.startsWith("B"))) {
            const r2 = row + dr * 2, c2 = col + dc * 2;
            if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
              const idx2 = r2 * 8 + c2;
              if (!String(board[idx2] || "")) targets.add(idx2); // Jump move
            }
          }
        }
      }
      return targets;
    }

    async function handleCellClick(index) {
      if (!state.currentGame || state.currentGame.status !== "playing") return;

      const board = state.currentGame.board_state || state.boardTemplate;
      const piece = String(board[index] || "").toUpperCase();
      
      const isMyTurn = state.currentGame.turn === (piece.startsWith("B") ? "B" : "W");

      // Select a piece
      if (piece && isMyTurn) {
        state.selectedIndex = index;
        state.legalTargets = getLegalTargets(board, index);
        renderBoard(board);
        return;
      }

      // Move a piece
      if (state.selectedIndex !== null && state.legalTargets.has(index)) {
        try {
          const updatedGame = await rpcSingle("make_move", {
            p_game_id: state.currentGame.id,
            p_cell_index: index,
            p_from_index: state.selectedIndex
          });
          
          // Immediately update state
          state.currentGame = updatedGame;
          state.selectedIndex = null;
          state.legalTargets = new Set();
          renderBoard(updatedGame.board_state);
          els.statusEl.textContent = `Turn: ${updatedGame.turn}`;

        } catch (err) {
          console.error("Move failed:", err);
          alert(err.message);
        }
      }
    }

    async function init() {
      createBoard();
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return alert("Please log in");
      state.userId = session.user.id;

      try {
        state.currentGame = await rpcSingle("get_active_playing_game");
        if (state.currentGame) {
          els.statusEl.textContent = `Turn: ${state.currentGame.turn}`;
          renderBoard(state.currentGame.board_state);
          
          // Subscribe to real-time updates
          supabase.channel(`game-${state.currentGame.id}`)
            .on("postgres_changes", { event: "*", schema: "public", table: "games", filter: `id=eq.${state.currentGame.id}` }, 
              (payload) => {
                state.currentGame = payload.new;
                renderBoard(state.currentGame.board_state);
                els.statusEl.textContent = `Turn: ${state.currentGame.turn}`;
              }
            ).subscribe();
        } else {
          els.statusEl.textContent = "No active game found.";
        }
      } catch (err) {
        console.error("Init Error:", err);
      }
    }

    init();
  </script>
</body>
</html>
