<!DOCTYPE html>    
<html lang="en">    
<head>    
  <meta charset="UTF-8" />    
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>    
  <title>Neon Checkers - Zambian Rules</title>    
  <style>    
    :root {    
      --bg: #050816;    
      --card: rgba(10, 14, 28, 0.88);    
      --text: #f8fbff;    
      --muted: #9aa4c1;    
      --line: rgba(255,255,255,0.08);    
      --accent: #7c3aed;    
      --accent2: #22d3ee;    
      --danger: #ef4444;    
      --success: #22c55e;    
      --dark-square: #1b2237;    
      --light-square: #d8deea;    
      --board-shadow: 0 0 0 1px rgba(124,58,237,.25), 0 20px 60px rgba(0,0,0,.45);    
      --shadow: 0 0 20px rgba(124, 58, 237, 0.22), 0 0 40px rgba(34, 211, 238, 0.12);    
    }    
    
    * { box-sizing: border-box; }    
    
    body {    
      margin: 0;    
      min-height: 100vh;    
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;    
      color: var(--text);    
      background:    
        radial-gradient(circle at top, rgba(124,58,237,.22), transparent 32%),    
        radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 28%),    
        linear-gradient(180deg, #04050d 0%, #070b18 100%);    
      display: flex;    
      align-items: center;    
      justify-content: center;    
      padding: 18px;    
    }    
    
    .app {    
      width: 100%;    
      max-width: 980px;    
      background: var(--card);    
      border: 1px solid var(--line);    
      border-radius: 28px;    
      box-shadow: var(--shadow);    
      overflow: hidden;    
      backdrop-filter: blur(14px);    
    }    
    
    .topbar {    
      padding: 14px 20px;    
      display: flex;    
      align-items: center;    
      justify-content: space-between;    
      border-bottom: 1px solid var(--line);    
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);    
    }    
    
    .exit-btn {    
      padding: 8px 16px;    
      border: none;    
      border-radius: 12px;    
      background: rgba(239,68,68,.15);    
      color: #fca5a5;    
      font-size: 14px;    
      font-weight: 700;    
      cursor: pointer;    
      border: 1px solid rgba(239,68,68,.2);    
    }    
    
    .status-pill {    
      padding: 8px 16px;    
      border-radius: 999px;    
      background: rgba(255,255,255,.06);    
      border: 1px solid rgba(255,255,255,.08);    
      font-size: 13px;    
      font-weight: 700;    
    }    
    
    .status-pill.live { background: rgba(34,197,94,.14); color: #a7f3d0; border-color: rgba(34,197,94,.25); }    
    .status-pill.warning { background: rgba(245,158,11,.14); color: #fde68a; border-color: rgba(245,158,11,.25); }
    
    .content { padding: 20px; }    
    
    .board-shell {    
      background: rgba(5, 10, 24, 0.9);    
      border: 1px solid rgba(124,58,237,.24);    
      border-radius: 24px;    
      padding: 12px;    
      box-shadow: var(--board-shadow);    
    }    
    
    .board {    
      display: grid;    
      grid-template-columns: repeat(8, 1fr);    
      gap: 4px;    
      aspect-ratio: 1 / 1;    
      width: 100%;    
      max-width: 600px;    
      margin: 0 auto;    
    }    
    
    .cell {    
      position: relative;    
      aspect-ratio: 1 / 1;    
      display: flex;    
      align-items: center;    
      justify-content: center;    
      border-radius: 4px;    
      cursor: pointer;    
    }    
    
    .cell.dark { background: #1a1f35; }    
    .cell.light { background: #2e3552; cursor: default; }    
    
    .cell.selected { box-shadow: inset 0 0 0 3px var(--accent2); background: rgba(34, 211, 238, 0.15); }    
    .cell.valid-target::after {    
      content: '';    
      width: 25%;    
      height: 25%;    
      background: var(--success);    
      border-radius: 50%;    
      box-shadow: 0 0 10px var(--success);    
    }    
    
    .piece {    
      width: 80%;    
      height: 80%;    
      border-radius: 50%;    
      position: relative;    
      transition: transform 0.2s;    
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);    
      z-index: 2;
    }    
    
    .piece.black { background: radial-gradient(circle at 30% 30%, #444, #000); border: 2px solid #222; }    
    .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 2px solid #999; }    
    
    .piece.king::before {    
      content: '★';    
      position: absolute;    
      inset: 0;    
      display: grid;    
      place-items: center;    
      color: #fbbf24;    
      font-size: 24px;    
      text-shadow: 0 0 8px rgba(0,0,0,0.5);    
    }    
    
    .winner-overlay {    
      position: fixed;    
      inset: 0;    
      background: rgba(0,0,0,.8);    
      backdrop-filter: blur(10px);    
      display: none;    
      align-items: center;    
      justify-content: center;    
      z-index: 100;    
    }    
    
    .winner-overlay.open { display: flex; }    
    
    .winner-card {    
      background: var(--card);    
      padding: 40px;    
      border-radius: 32px;    
      text-align: center;    
      border: 1px solid var(--line);    
    }    

    .legend {    
      text-align: center;    
      margin-top: 20px;    
      font-size: 14px;    
      color: var(--muted);    
    }    
  </style>    
</head>    
<body>    
  <div class="winner-overlay" id="winnerOverlay">    
    <div class="winner-card">    
      <h1 id="winnerTitle">Winner!</h1>    
      <p id="winnerSub"></p>    
      <button onclick="location.href='/lobby.html'" class="exit-btn" style="background: var(--accent); color: white; margin-top: 20px;">Back to Lobby</button>    
    </div>    
  </div>    
    
  <div class="app">    
    <div class="topbar">    
      <button id="exitBtn" class="exit-btn">Exit Game</button>    
      <div id="status" class="status-pill">Initializing...</div>    
    </div>    
    
    <div class="content">    
      <div class="board-shell">    
        <div id="board" class="board"></div>    
      </div>    
      <div class="legend">Zambian Rules: Flying Kings & Double Jumps Required.</div>    
    </div>    
  </div>    
    
  <script type="module">    
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";    
    
    const supabase = createClient(    
      "https://eimecuiixwgmpfpedxpr.supabase.co",    
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"    
    );    
    
    const els = {    
      statusEl: document.getElementById("status"),    
      boardEl: document.getElementById("board"),    
      winnerOverlay: document.getElementById("winnerOverlay"),    
      winnerTitle: document.getElementById("winnerTitle"),    
      winnerSub: document.getElementById("winnerSub")    
    };    
    
    const state = {    
      userId: null,    
      currentGame: null,    
      selectedIndex: null,    
      legalTargets: new Set(),
      isDoubleJumpPending: false
    };    
    
    // --- PATH SCANNING LOGIC (Matches SQL) ---
    function getLegalTargetsFromSelected(board, selectedIndex, jumpsOnly = false) {    
      const targets = new Set();    
      const piece = String(board[selectedIndex] || "").trim().toLowerCase();    
      if (!piece || piece === "") return targets;    
    
      const row = Math.floor(selectedIndex / 8);    
      const col = selectedIndex % 8;    
      const isKing = piece.length === 2;    
      const color = piece[0]; 
      const enemyColor = color === 'b' ? 'w' : 'b';    
      const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];    
    
      for (const [dr, dc] of directions) {    
        if (!isKing) {    
          // 1. Regular Piece Logic
          const forward = color === 'b' ? 1 : -1;    
          
          // Sliding move (only if not jumpsOnly and forward)
          if (!jumpsOnly && dr === forward) {    
            const r1 = row + dr, c1 = col + dc;    
            if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {    
              if (!board[r1 * 8 + c1] || board[r1 * 8 + c1] === "") targets.add(r1 * 8 + c1);    
            }    
          }    
          
          // Jump move (Matches SQL: normal pieces jump 2 steps)
          // Note: Your SQL allows normal pieces to jump in any diagonal if they capture
          const r1 = row + dr, c1 = col + dc;    
          const r2 = row + dr * 2, c2 = col + dc * 2;    
          if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {    
            const midPiece = String(board[r1 * 8 + c1] || "").trim().toLowerCase();    
            const destPiece = String(board[r2 * 8 + c2] || "").trim().toLowerCase();
            if (midPiece && midPiece !== "" && midPiece[0] === enemyColor && destPiece === "") {    
              targets.add(r2 * 8 + c2);    
            }    
          }    
        } else {    
          // 2. Flying King Logic (Zambian Rules)
          let r = row + dr, c = col + dc;    
          let foundEnemy = false;    
    
          while (r >= 0 && r < 8 && c >= 0 && c < 8) {    
            const idx = r * 8 + c;    
            const currentPiece = String(board[idx] || "").trim().toLowerCase();    
    
            if (!foundEnemy) {    
              if (!currentPiece || currentPiece === "") {    
                if (!jumpsOnly) targets.add(idx); // Slide
              } else if (currentPiece[0] === color) {    
                break; // Blocked by self
              } else {    
                foundEnemy = true; // Enemy found
              }    
            } else {    
              if (!currentPiece || currentPiece === "") {    
                targets.add(idx); // Landing square after capture
              } else {    
                break; // Blocked by piece behind enemy
              }    
            }    
            r += dr; c += dc;    
          }    
        }    
      }    
      return targets;    
    }    
    
    async function handleCellClick(index) {    
      if (!state.currentGame || state.currentGame.status !== 'playing') return;    
      if (state.currentGame.turn === 'B' && state.currentGame.player_x !== state.userId) return;
      if (state.currentGame.turn === 'W' && state.currentGame.player_o !== state.userId) return;

      const board = state.currentGame.board_state;    
      const piece = String(board[index] || "").trim().toLowerCase();    
      const turn = state.currentGame.turn;

      // If we are in the middle of a double jump, player CANNOT select another piece
      if (state.isDoubleJumpPending && index !== state.selectedIndex) {
          if (state.legalTargets.has(index)) {
              await executeMove(index);
          }
          return;
      }
    
      // Select own piece
      if (piece && piece[0].toUpperCase() === turn) {    
        state.selectedIndex = index;    
        state.legalTargets = getLegalTargetsFromSelected(board, index, false);    
        renderBoard();    
        return;    
      }    
    
      // Target square clicked
      if (state.selectedIndex !== null && state.legalTargets.has(index)) {    
        await executeMove(index);
      }    
    }    

    async function executeMove(toIndex) {
        const fromIndex = state.selectedIndex;
        const previousTurn = state.currentGame.turn;

        try {    
          const { data, error } = await supabase.rpc('make_move', {    
            p_game_id: state.currentGame.id,    
            p_cell_index: toIndex,    
            p_from_index: fromIndex    
          });    
          if (error) throw error;    
          
          const updatedGame = data[0] || data;
          
          // Logic: If the turn didn't change, it's a mandatory double jump
          if (updatedGame.turn === previousTurn) {
              state.isDoubleJumpPending = true;
              state.selectedIndex = toIndex; 
              state.legalTargets = getLegalTargetsFromSelected(updatedGame.board_state, toIndex, true); 
          } else {
              state.isDoubleJumpPending = false;
              state.selectedIndex = null;    
              state.legalTargets = new Set();    
          }

          state.currentGame = updatedGame;
          renderBoard();
          updateStatus();
        } catch (err) {    
          alert("Move failed: " + err.message);    
        }    
    }
    
    function renderBoard() {    
      els.boardEl.innerHTML = "";    
      const board = state.currentGame?.board_state || Array(64).fill(null);    
    
      board.forEach((cellData, i) => {    
        const row = Math.floor(i / 8), col = i % 8;    
        const isDark = (row + col) % 2 === 1;    
        const cell = document.createElement("div");    
        cell.className = `cell ${isDark ? 'dark' : 'light'}`;    
        
        if (state.selectedIndex === i) cell.classList.add("selected");    
        if (state.legalTargets.has(i)) cell.classList.add("valid-target");    
    
        if (cellData && cellData !== "") {    
          const p = document.createElement("div");    
          const pieceInfo = cellData.toLowerCase();    
          p.className = `piece ${pieceInfo[0] === 'b' ? 'black' : 'white'} ${pieceInfo.length > 1 ? 'king' : ''}`;    
          cell.appendChild(p);    
        }    
    
        cell.onclick = () => handleCellClick(i);    
        els.boardEl.appendChild(cell);    
      });    
    }    
    
    async function init() {    
      const { data: { user } } = await supabase.auth.getUser();    
      state.userId = user?.id;    
    
      const urlParams = new URLSearchParams(window.location.search);    
      const gameId = urlParams.get("gameId");    
    
      if (!gameId) {    
        els.statusEl.textContent = "URL Error: No gameId";    
        return;    
      }    
    
      const { data: game } = await supabase.from("games").select("*").eq("id", gameId).single();    
      state.currentGame = game;    
      renderBoard();    
      updateStatus();    
    
      supabase.channel(`game_updates_${gameId}`)    
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${gameId}` },     
        payload => {    
          // Only update if it's NOT our turn (to avoid overwriting local double-jump state)
          const isMyTurn = (payload.new.turn === 'B' && payload.new.player_x === state.userId) || 
                           (payload.new.turn === 'W' && payload.new.player_o === state.userId);
          
          if (!isMyTurn || !state.isDoubleJumpPending) {
              state.currentGame = payload.new;    
              renderBoard();    
              updateStatus();    
          }
          if (payload.new.status === 'finished') showWinner();    
        }).subscribe();    
    }    
    
    function updateStatus() {    
      const g = state.currentGame;    
      if (!g) return;    
      const isMyTurn = (g.turn === 'B' && g.player_x === state.userId) || (g.turn === 'W' && g.player_o === state.userId);

      if (state.isDoubleJumpPending) {
          els.statusEl.className = "status-pill warning";
          els.statusEl.textContent = "Double Jump Required!";
      } else {
          els.statusEl.className = `status-pill ${g.status === 'playing' ? 'live' : ''}`;    
          els.statusEl.textContent = g.status === 'playing' ? (isMyTurn ? "Your Turn" : `Waiting for ${g.turn}...`) : `Game Over`;    
      }
    }    
    
    function showWinner() {    
      els.winnerTitle.textContent = state.currentGame.winner === 'B' ? "Black Wins!" : "White Wins!";    
      els.winnerSub.textContent = `Total Winnings: ${state.currentGame.winnings || 0}`;    
      els.winnerOverlay.classList.add("open");    
    }    
    
    init();    
  </script>    
</body>    
</html>
