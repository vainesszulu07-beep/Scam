<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Checkers</title>
  <style>
    :root {
      --bg: #050816;
      --card: rgba(10, 14, 28, 0.88);
      --text: #f8fbff;
      --muted: #9aa4c1;
      --line: rgba(255,255,255,0.08);
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --danger: #ef4444;
      --success: #22c55e;
      --dark-square: #1b2237;
      --light-square: #d8deea;
      --board-shadow: 0 0 0 1px rgba(124,58,237,.25), 0 20px 60px rgba(0,0,0,.45);
      --shadow: 0 0 20px rgba(124, 58, 237, 0.22), 0 0 40px rgba(34, 211, 238, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(124,58,237,.22), transparent 32%),
        radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 28%),
        linear-gradient(180deg, #04050d 0%, #070b18 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .topbar {
      padding: 14px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    }

    .exit-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: rgba(239,68,68,.92);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .status-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      min-width: 120px;
      white-space: pre-line;
    }

    .status-pill.live {
      background: rgba(34,197,94,.14);
      color: #a7f3d0;
      border-color: rgba(34,197,94,.25);
    }

    .status-pill.waiting {
      background: rgba(245,158,11,.14);
      color: #fde68a;
      border-color: rgba(245,158,11,.25);
    }

    .status-pill.finished {
      background: rgba(239,68,68,.14);
      color: #fecaca;
      border-color: rgba(239,68,68,.25);
    }

    .content {
      padding: 16px;
    }

    .board-shell {
      background: rgba(5, 10, 24, 0.9);
      border: 1px solid rgba(124,58,237,.24);
      border-radius: 24px;
      padding: 14px;
      box-shadow: var(--board-shadow);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
      aspect-ratio: 16 / 10;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .cell {
      position: relative;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      min-height: 72px;
    }

    .cell.dark {
      background: linear-gradient(180deg, #28324f, #151a2b);
      cursor: pointer;
    }

    .cell.light {
      background: linear-gradient(180deg, #d9dfec, #b8c0d2);
      cursor: default;
    }

    .cell.dark:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow:
        inset 0 0 24px rgba(34,211,238,.12),
        0 0 0 1px rgba(34,211,238,.2),
        0 0 18px rgba(124,58,237,.15);
    }

    .cell.selected {
      outline: 2px solid rgba(34, 211, 238, 0.9);
      outline-offset: -2px;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.22);
    }

    .cell.valid-target {
      box-shadow: inset 0 0 0 2px rgba(34,197,94,.9);
    }

    .piece {
      width: min(78%, 52px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: clamp(16px, 2vw, 22px);
      border: 2px solid rgba(255,255,255,.2);
      box-shadow: 0 10px 16px rgba(0,0,0,.28), inset 0 0 14px rgba(255,255,255,.14);
      position: relative;
    }

    .piece.black {
      background: radial-gradient(circle at 30% 30%, #4b5563, #06070c 70%);
      color: #f8fbff;
      text-shadow: 0 0 10px rgba(255,255,255,.25);
    }

    .piece.white {
      background: radial-gradient(circle at 30% 30%, #ffffff, #cfd8e6 70%);
      color: #111827;
      text-shadow: none;
    }

    .piece.king::after {
      content: '★';
      position: absolute;
      top: -7px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      color: #111827;
      display: grid;
      place-items: center;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 0 10px rgba(251,191,36,.35);
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.black { background: radial-gradient(circle at 30% 30%, #4b5563, #06070c 70%); }
    .dot.white { background: radial-gradient(circle at 30% 30%, #ffffff, #cfd8e6 70%); }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .content { padding: 12px; }
      .board { gap: 4px; aspect-ratio: 1 / 1.2; }
      .cell { min-height: 0; border-radius: 8px; }
      .piece { width: 74%; }
    }

    .winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 18px;
    }

    .winner-overlay.open { display: flex; }

    .winner-card {
      width: min(420px, 100%);
      border-radius: 24px;
      background: rgba(10, 14, 28, 0.96);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      padding: 18px;
      transform: translateY(10px) scale(.98);
      animation: popIn .22s ease forwards;
    }

    @keyframes popIn {
      to { transform: translateY(0) scale(1); }
    }

    .winner-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .winner-avatar {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: cover;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.08);
      flex: 0 0 auto;
    }

    .winner-title {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .winner-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
      word-break: break-word;
      line-height: 1.45;
    }

    .winner-badge {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(34,197,94,.14);
      color: #a7f3d0;
      border: 1px solid rgba(34,197,94,.25);
      font-weight: 800;
      font-size: 13px;
    }

    .winner-actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .winner-close {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="winner-overlay" id="winnerOverlay" aria-hidden="true">
    <div class="winner-card" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
      <div class="winner-top">
        <img id="winnerAvatar" class="winner-avatar" alt="Winner avatar" />
        <div>
          <h2 class="winner-title" id="winnerTitle">Winner</h2>
          <div class="winner-sub" id="winnerSub">—</div>
        </div>
      </div>
      <div class="winner-badge" id="winnerBadge">🏆 Game finished</div>
      <div class="winner-actions">
        <button id="winnerCloseBtn" class="winner-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <button id="exitBtn" class="exit-btn" aria-label="Exit game">⟲</button>
      <div id="status" class="status-pill">Loading...</div>
    </div>

    <div class="content">
      <div class="board-shell">
        <div id="board" class="board"></div>
        <div class="legend">
          <span><i class="dot black"></i> Black pieces</span>
          <span><i class="dot white"></i> White pieces</span>
          <span>Select a piece, then tap a dark square</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const els = {
      statusEl: document.getElementById("status"),
      boardEl: document.getElementById("board"),
      exitBtn: document.getElementById("exitBtn"),
      winnerOverlay: document.getElementById("winnerOverlay"),
      winnerAvatar: document.getElementById("winnerAvatar"),
      winnerTitle: document.getElementById("winnerTitle"),
      winnerSub: document.getElementById("winnerSub"),
      winnerBadge: document.getElementById("winnerBadge"),
      winnerCloseBtn: document.getElementById("winnerCloseBtn")
    };

    const BOARD_SIZE = 64;
    const urlParams = new URLSearchParams(window.location.search);
    const urlGameId = urlParams.get("gameId");

    const state = {
      userId: null,
      currentGame: null,
      boardTemplate: Array.from({ length: BOARD_SIZE }, (_, i) =>
        ((i % 8) + Math.floor(i / 8)) % 2 === 1 ? "" : null
      ),
      realtimeChannel: null,
      winnerPopupOpen: false,
      selectedIndex: null,
      gameType: null,
      gameTypeId: null,
      legalTargets: new Set()
    };

    function isArray64(value) {
      return Array.isArray(value) && value.length === 64;
    }

    function normalizeRow(data) {
      if (!data) return null;
      if (Array.isArray(data)) return data[0] || null;
      return data;
    }

    async function rpcSingle(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return normalizeRow(data);
    }

    function setStatus(text, mode = "") {
      els.statusEl.textContent = text;
      els.statusEl.className = "status-pill" + (mode ? ` ${mode}` : "");
    }

    function formatAmount(value) {
      const n = Number(value ?? 0);
      return Number.isFinite(n) ? new Intl.NumberFormat().format(n) : "0";
    }

    function showRawError(context, err) {
      const raw = err && typeof err === "object"
        ? JSON.stringify(err, Object.getOwnPropertyNames(err), 2)
        : String(err);
      const message = err?.message ? err.message : String(err);
      setStatus(`${context}\n${message}\n\nRAW ERROR:\n${raw}`, "finished");
      console.error(context, err);
    }

    async function getUser() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session || !session.user) throw new Error("Not logged in");
      state.userId = session.user.id;
      return state.userId;
    }

    async function loadGameType(gameTypeId) {
      if (!gameTypeId) return null;
      const { data, error } = await supabase
        .from("game_types")
        .select("id, name, file_type, board_template")
        .eq("id", gameTypeId)
        .maybeSingle();
      if (error) throw error;
      state.gameType = data || null;
      state.gameTypeId = gameTypeId;
      return state.gameType;
    }

    function getSquareKind(index) {
      const row = Math.floor(index / 8);
      const col = index % 8;
      return (row + col) % 2 === 1 ? "dark" : "light";
    }

    function getTurnSymbol() {
      return String(state.currentGame?.turn || "").trim().toUpperCase();
    }

    function parsePiece(piece) {
      const raw = String(piece || "").trim().toLowerCase();
      if (!raw) return null;
      if (raw === "b") return { side: "black", king: false, label: "B" };
      if (raw === "bk") return { side: "black", king: true, label: "B" };
      if (raw === "w") return { side: "white", king: false, label: "W" };
      if (raw === "wk") return { side: "white", king: true, label: "W" };
      return { side: "unknown", king: false, label: piece };
    }

    function createBoard() {
      els.boardEl.innerHTML = "";
      for (let i = 0; i < BOARD_SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = `cell ${getSquareKind(i)}`;
        cell.id = `cell${i}`;
        cell.dataset.index = String(i);
        els.boardEl.appendChild(cell);
      }
    }

    function clearBoardMarks() {
      for (let i = 0; i < BOARD_SIZE; i++) {
        const el = document.getElementById(`cell${i}`);
        if (!el) continue;
        el.classList.remove("selected", "valid-target");
      }
    }

    function renderBoard(board) {
      const safeBoard = isArray64(board) ? board : state.boardTemplate;
      clearBoardMarks();

      for (let i = 0; i < BOARD_SIZE; i++) {
        const el = document.getElementById(`cell${i}`);
        if (!el) continue;

        const piece = parsePiece(safeBoard[i]);
        el.innerHTML = "";
        el.classList.toggle("selected", state.selectedIndex === i);
        el.classList.toggle("valid-target", state.legalTargets.has(i));

        if (getSquareKind(i) === "dark") {
          el.classList.add("dark");
          el.classList.remove("light");
          el.onclick = () => handleCellClick(i);
        } else {
          el.classList.add("light");
          el.classList.remove("dark");
          el.onclick = null;
        }

        if (piece) {
          const pieceEl = document.createElement("div");
          pieceEl.className = `piece ${piece.side}${piece.king ? " king" : ""}`;
          pieceEl.textContent = piece.label;
          el.appendChild(pieceEl);
        }
      }
    }

    function syncMeta(game) {
      if (!game) {
        setStatus("No active game", "");
        return;
      }

      const turn = getTurnSymbol();

      if (game.status === "playing") {
        setStatus(turn ? `Live game · Turn: ${turn}` : "Live game", "live");
      } else if (game.status === "waiting") {
        setStatus("Waiting for opponent", "waiting");
      } else if (game.status === "finished") {
        const amount = formatAmount(game.winnings || 0);
        if (game.winner) {
          setStatus(`Game finished · Winner: ${game.winner} · Won: ${amount}`, "finished");
        } else {
          setStatus("Game finished · Draw", "finished");
        }
      } else {
        setStatus("Idle", "");
      }
    }

    async function loadWinnerProfile(userId) {
      if (!userId) return null;
      const { data, error } = await supabase
        .from("profile")
        .select("id, full_name, avatar_url")
        .eq("id", userId)
        .maybeSingle();
      if (error) throw error;
      return data || null;
    }

    function openWinnerPopup({ winnerUser, winnerSymbol, winnings = 0, isDraw = false }) {
      if (isDraw) {
        els.winnerAvatar.src = "https://via.placeholder.com/128?text=%E2%80%94";
        els.winnerAvatar.alt = "Draw";
        els.winnerTitle.textContent = "Draw";
        els.winnerSub.textContent = "No winner this round.";
        els.winnerBadge.textContent = "🤝 Match ended in a draw";
      } else {
        const name = winnerUser?.full_name || "Winner";
        const avatar = winnerUser?.avatar_url || "https://via.placeholder.com/128?text=User";
        els.winnerAvatar.src = avatar;
        els.winnerAvatar.alt = `${name} avatar`;
        els.winnerTitle.textContent = name;
        els.winnerSub.textContent = `Winner ID: ${winnerUser?.id || "—"}${winnerSymbol ? ` · Symbol: ${winnerSymbol}` : ""}`;
        els.winnerBadge.textContent = `🏆 Won ${formatAmount(winnings)}`;
      }

      els.winnerOverlay.classList.add("open");
      els.winnerOverlay.setAttribute("aria-hidden", "false");
      state.winnerPopupOpen = true;
    }

    function closeWinnerPopup() {
      els.winnerOverlay.classList.remove("open");
      els.winnerOverlay.setAttribute("aria-hidden", "true");
      state.winnerPopupOpen = false;
    }

    function isPlayersPiece(piece) {
      const low = String(piece || "").trim().toLowerCase();
      if (!state.currentGame) return false;

      const turn = getTurnSymbol();

      if (turn === "B") return low === "b" || low === "bk";
      if (turn === "W") return low === "w" || low === "wk";
      return false;
    }

    function getLegalTargetsFromSelected(board, selectedIndex) {
      const targets = new Set();
      const piece = String(board?.[selectedIndex] || "").trim().toLowerCase();
      if (!piece) return targets;

      const row = Math.floor(selectedIndex / 8);
      const col = selectedIndex % 8;
      const isBlack = piece === "b" || piece === "bk";
      const isWhite = piece === "w" || piece === "wk";
      const isKing = piece === "bk" || piece === "wk";

      const directions = [];
      if (isBlack || isKing) directions.push([1, -1], [1, 1]);
      if (isWhite || isKing) directions.push([-1, -1], [-1, 1]);

      const enemyPieces = isBlack ? ["w", "wk"] : ["b", "bk"];

      for (const [dr, dc] of directions) {
        const r1 = row + dr;
        const c1 = col + dc;
        if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
          const idx1 = r1 * 8 + c1;
          const sq1 = String(board?.[idx1] || "").trim().toLowerCase();
          if (!sq1) {
            targets.add(idx1);
          } else if (enemyPieces.includes(sq1)) {
            const r2 = row + dr * 2;
            const c2 = col + dc * 2;
            if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
              const idx2 = r2 * 8 + c2;
              const sq2 = String(board?.[idx2] || "").trim().toLowerCase();
              if (!sq2) targets.add(idx2);
            }
          }
        }
      }

      return targets;
    }

    async function showWinnerIfFinished(game) {
      if (!game || game.status !== "finished") return;

      if (game.winner_user) {
        try {
          const profile = await loadWinnerProfile(game.winner_user);
          openWinnerPopup({
            winnerUser: profile || { id: game.winner_user, full_name: "Winner", avatar_url: null },
            winnerSymbol: game.winner || null,
            winnings: game.winnings || 0,
            isDraw: false
          });
        } catch (err) {
          showRawError("Could not load winner profile", err);
          openWinnerPopup({
            winnerUser: { id: game.winner_user, full_name: "Winner", avatar_url: null },
            winnerSymbol: game.winner || null,
            winnings: game.winnings || 0,
            isDraw: false
          });
        }
      } else {
        openWinnerPopup({ winnerUser: null, winnerSymbol: null, winnings: 0, isDraw: true });
      }
    }

    async function syncCurrentGame(game) {
      state.currentGame = game || null;

      if (game?.game_type_id) {
        const gt = await loadGameType(game.game_type_id).catch(() => null);
        if (gt?.board_template && isArray64(gt.board_template)) {
          state.boardTemplate = gt.board_template;
        }
      }

      if (state.currentGame?.status === "playing" && isArray64(state.currentGame.board_state) && state.selectedIndex !== null) {
        state.legalTargets = getLegalTargetsFromSelected(state.currentGame.board_state, state.selectedIndex);
      } else {
        state.legalTargets = new Set();
      }

      renderBoard(game?.board_state || state.boardTemplate);
      syncMeta(game);

      if (game?.status === "finished") {
        await showWinnerIfFinished(game);
      }
    }

    function subscribeToGame(gameId) {
      if (state.realtimeChannel) {
        supabase.removeChannel(state.realtimeChannel);
        state.realtimeChannel = null;
      }

      if (!gameId) return;

      state.realtimeChannel = supabase
        .channel(`checkers-${gameId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "games",
            filter: `id=eq.${gameId}`
          },
          async (payload) => {
            const updated = payload.new;
            if (!updated) return;
            await syncCurrentGame(updated);
          }
        )
        .subscribe();
    }

    async function loadGame() {
      try {
        await getUser();

        let game = null;

        if (urlGameId) {
          const { data, error } = await supabase
            .from("games")
            .select("*")
            .eq("id", urlGameId)
            .maybeSingle();

          if (error) throw error;
          if (data && (data.player_x === state.userId || data.player_o === state.userId)) {
            game = data;
          }
        }

        if (!game) {
          game = await rpcSingle("get_active_playing_game");
        }

        if (!game) {
          state.currentGame = null;
          renderBoard(state.boardTemplate);
          syncMeta(null);
          return;
        }

        await syncCurrentGame(game);
        subscribeToGame(game.id);

        if (game.status === "finished") {
          await showWinnerIfFinished(game);
        }
      } catch (err) {
        showRawError("Failed to load game", err);
      }
    }

    async function handleCellClick(index) {
      if (!state.currentGame || state.currentGame.status !== "playing") return;

      const board = state.currentGame.board_state || state.boardTemplate;
      const piece = String(board?.[index] || "").trim().toLowerCase();
      const clickedIsOwnPiece = isPlayersPiece(piece);

      if (state.selectedIndex === null) {
        if (clickedIsOwnPiece) {
          state.selectedIndex = index;
          state.legalTargets = getLegalTargetsFromSelected(board, index);
          renderBoard(board);
        }
        return;
      }

      if (index === state.selectedIndex) {
        state.selectedIndex = null;
        state.legalTargets = new Set();
        renderBoard(board);
        return;
      }

      if (!state.legalTargets.has(index)) {
        if (clickedIsOwnPiece) {
          state.selectedIndex = index;
          state.legalTargets = getLegalTargetsFromSelected(board, index);
          renderBoard(board);
        }
        return;
      }

      try {
        const updated = await rpcSingle("make_move", {
          p_game_id: state.currentGame.id,
          p_cell_index: index,
          p_from_index: state.selectedIndex
        });

        state.selectedIndex = null;
        state.legalTargets = new Set();

        if (updated) {
          await syncCurrentGame(updated);
        }
      } catch (err) {
        showRawError("Could not make move", err);
      }
    }

    async function leaveGame() {
      if (!state.currentGame) return;
      try {
        const updated = await rpcSingle("leave_game", {
          p_game_id: state.currentGame.id
        });
        closeWinnerPopup();
        await syncCurrentGame(updated);
        if (updated?.status === "idle" || updated?.status === "waiting") {
          window.location.href = "/lobby.html";
        }
      } catch (err) {
        showRawError("Could not exit game", err);
      }
    }

    els.exitBtn.onclick = leaveGame;
    els.winnerCloseBtn.onclick = closeWinnerPopup;
    els.winnerOverlay.addEventListener("click", (e) => {
      if (e.target === els.winnerOverlay) closeWinnerPopup();
    });

    async function init() {
      createBoard();
      await loadGame();
      renderBoard(state.currentGame?.board_state || state.boardTemplate);
      if (state.currentGame?.status === "finished") {
        await showWinnerIfFinished(state.currentGame);
      }
    }

    init();
  </script>
</body>
