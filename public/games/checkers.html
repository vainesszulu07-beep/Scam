<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Checkers - Zambian Rules</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: rgba(16, 22, 35, 0.95);
      --text: #f8fbff;
      --muted: #8b95a8;
      --line: rgba(255,255,255,0.08);
      --accent: #d97706;
      --accent-hover: #f59e0b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;

      --dark-square: #4a3018;
      --light-square: #d2a679;

      --board-border: #2a1608;
      --board-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .app {
      width: 100%;
      max-width: 800px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .topbar {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.05), transparent);
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger {
      background: rgba(239,68,68,.15);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,.3);
    }

    .btn-danger:hover { background: rgba(239,68,68,.25); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent-hover);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .status-pill {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      white-space: pre-line;
    }

    .status-pill.live { background: rgba(34,197,94,.1); color: #86efac; border-color: rgba(34,197,94,.3); }
    .status-pill.warning { background: rgba(245,158,11,.1); color: #fde68a; border-color: rgba(245,158,11,.3); }
    .status-pill.finished { background: rgba(239,68,68,.1); color: #fecaca; border-color: rgba(239,68,68,.3); }

    .content { padding: 20px; }

    .board-shell {
      background: var(--board-border);
      border: 4px solid #1a0b04;
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--board-shadow);
      margin: 0 auto;
      max-width: 600px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0;
      aspect-ratio: 1 / 1;
      width: 100%;
      border: 2px solid #000;
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(0,0,0,0.02) 10px,
        rgba(0,0,0,0.02) 20px
      );
    }

    .cell.dark {
      background-color: var(--dark-square);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
    }

    .cell.light {
      background-color: var(--light-square);
      cursor: default;
    }

    .cell.selected {
      box-shadow: inset 0 0 0 4px #fbbf24, inset 0 0 15px rgba(251, 191, 36, 0.5);
    }

    .cell.valid-target::after {
      content: '';
      width: 20%;
      height: 20%;
      background: rgba(34, 197, 94, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .piece {
      width: 85%;
      height: 85%;
      border-radius: 50%;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 2;
    }

    .piece:active { transform: scale(0.95); }

    .piece.black {
      background: radial-gradient(circle at 35% 35%, #555 0%, #222 40%, #000 80%);
      box-shadow:
        inset -2px -4px 6px rgba(0,0,0,0.8),
        inset 2px 4px 6px rgba(255,255,255,0.2),
        2px 6px 10px rgba(0,0,0,0.6);
      border: 1px solid #111;
    }

    .piece.white {
      background: radial-gradient(circle at 35% 35%, #fff 0%, #e0e0e0 40%, #a0a0a0 80%);
      box-shadow:
        inset -2px -4px 6px rgba(0,0,0,0.3),
        inset 2px 4px 6px rgba(255,255,255,0.9),
        2px 6px 10px rgba(0,0,0,0.5);
      border: 1px solid #999;
    }

    .piece::after {
      content: '';
      position: absolute;
      inset: 15%;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .piece.white::after { border-color: rgba(0,0,0,0.1); }

    .piece.king::before {
      content: '♛';
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fbbf24;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      z-index: 3;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .overlay.open { display: flex; }

    .modal-card {
      background: var(--card);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--line);
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-card h2 { margin-top: 0; color: #fff; }
    .modal-card p { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .topbar { padding: 14px 14px; }
      .content { padding: 14px; }
      .board-shell { padding: 12px; }
      .btn { width: 100%; }
      .topbar { justify-content: stretch; }
      .topbar > * { flex: 1 1 auto; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="winnerOverlay">
    <div class="modal-card">
      <h2 id="winnerTitle">Game Over</h2>
      <p id="winnerSub"></p>
      <button id="backLobbyBtn" class="btn btn-primary">Back to Lobby</button>
    </div>
  </div>

  <div class="overlay" id="quitOverlay">
    <div class="modal-card" style="border-color: rgba(239,68,68,.3);">
      <h2>Quit game?</h2>
      <p>If you continue and quit the game, you will leave the match.</p>
      <div class="modal-actions">
        <button id="cancelQuitBtn" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Cancel</button>
        <button id="confirmQuitBtn" class="btn btn-danger">Quit</button>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <button id="quitBtn" class="btn btn-danger">Quit</button>
      <div id="status" class="status-pill">Loading...</div>
    </div>

    <div class="content">
      <div class="board-shell">
        <div id="board" class="board"></div>
      </div>
      <div class="legend">Zambian Rules: Flying Kings & Double Jumps Required.</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const FALLBACK_URL = "/lobby.html";

    const els = {
      statusEl: document.getElementById("status"),
      boardEl: document.getElementById("board"),
      winnerOverlay: document.getElementById("winnerOverlay"),
      winnerTitle: document.getElementById("winnerTitle"),
      winnerSub: document.getElementById("winnerSub"),
      quitOverlay: document.getElementById("quitOverlay"),
      quitBtn: document.getElementById("quitBtn"),
      cancelQuitBtn: document.getElementById("cancelQuitBtn"),
      confirmQuitBtn: document.getElementById("confirmQuitBtn"),
      backLobbyBtn: document.getElementById("backLobbyBtn")
    };

    const state = {
      userId: null,
      currentGame: null,
      selectedIndex: null,
      legalTargets: new Set(),
      isDoubleJumpPending: false,
      channel: null,
      cleanupTimer: null
    };

    function normalizeRow(data) {
      if (!data) return null;
      if (Array.isArray(data)) return data[0] || null;
      return data;
    }

    async function rpcSingle(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return normalizeRow(data);
    }

    function cleanup() {
      if (state.channel) {
        supabase.removeChannel(state.channel);
        state.channel = null;
      }
      if (state.cleanupTimer) {
        clearTimeout(state.cleanupTimer);
        state.cleanupTimer = null;
      }
    }

    function leavePage() {
      cleanup();
      window.location.replace(FALLBACK_URL);
    }

    function isGameValid(game) {
      if (!game || !state.userId) return false;
      const isParticipant = game.player_x === state.userId || game.player_o === state.userId;
      return isParticipant && (game.status === "playing" || game.status === "finished");
    }

    function boardValue(board, index) {
      if (!board) return "";
      if (Array.isArray(board)) return board[index] || "";
      if (typeof board === "object") return board[index] || board[String(index)] || "";
      return "";
    }

    function boardToArray(board) {
      const arr = Array(64).fill("");
      for (let i = 0; i < 64; i++) arr[i] = boardValue(board, i);
      return arr;
    }

    function isMySideBlack(game) {
      return game?.player_x === state.userId;
    }

    function isMySideWhite(game) {
      return game?.player_o === state.userId;
    }

    function isMyPiece(piece) {
      if (!piece || !state.currentGame) return false;
      const p = String(piece).trim().toLowerCase();
      if (!p) return false;

      if (isMySideBlack(state.currentGame)) return p[0] === "b";
      if (isMySideWhite(state.currentGame)) return p[0] === "w";
      return false;
    }

    function isMyTurn(game) {
      if (!game || game.status !== "playing") return false;
      if (game.turn === "B") return game.player_x === state.userId;
      if (game.turn === "W") return game.player_o === state.userId;
      return false;
    }

    function turnLabel(game) {
      if (!game) return "Loading...";
      if (game.status === "finished") return "Game Over";
      if (state.isDoubleJumpPending) return "Double Jump Required";
      return isMyTurn(game) ? "Your Turn" : "Opponent's Turn";
    }

    function updateStatus() {
      const g = state.currentGame;
      if (!g) {
        els.statusEl.className = "status-pill";
        els.statusEl.textContent = "Loading...";
        return;
      }

      if (g.status === "finished") {
        els.statusEl.className = "status-pill finished";
        els.statusEl.textContent = "Game Over";
        return;
      }

      if (state.isDoubleJumpPending) {
        els.statusEl.className = "status-pill warning";
        els.statusEl.textContent = "Double Jump Required";
        return;
      }

      els.statusEl.className = `status-pill ${g.status === "playing" ? "live" : ""}`;
      els.statusEl.textContent = turnLabel(g);
    }

    function renderBoard() {
      const boardArr = boardToArray(state.currentGame?.board_state);

      els.boardEl.innerHTML = "";

      for (let i = 0; i < 64; i++) {
        const row = Math.floor(i / 8);
        const col = i % 8;
        const isDark = (row + col) % 2 === 1;

        const cell = document.createElement("div");
        cell.className = `cell ${isDark ? "dark" : "light"}`;
        cell.dataset.index = i;

        if (state.selectedIndex === i) cell.classList.add("selected");
        if (state.legalTargets.has(i)) cell.classList.add("valid-target");

        const pieceData = boardArr[i];
        if (pieceData && pieceData !== "") {
          const piece = document.createElement("div");
          const pieceInfo = String(pieceData).trim().toLowerCase();
          piece.className = `piece ${pieceInfo[0] === "b" ? "black" : "white"} ${pieceInfo.length > 1 ? "king" : ""}`;
          cell.appendChild(piece);
        }

        cell.onclick = () => handleCellClick(i);
        els.boardEl.appendChild(cell);
      }
    }

    function getLegalTargetsFromSelected(board, selectedIndex, jumpsOnly = false) {
      const targets = new Set();
      const piece = String(boardValue(board, selectedIndex) || "").trim().toLowerCase();
      if (!piece) return targets;

      const row = Math.floor(selectedIndex / 8);
      const col = selectedIndex % 8;
      const isKing = piece.length === 2;
      const color = piece[0];
      const enemyColor = color === "b" ? "w" : "b";
      const directions = [[1, 1], [1, -1], [-1, 1], [-1, -1]];

      for (const [dr, dc] of directions) {
        if (!isKing) {
          const forward = color === "b" ? 1 : -1;

          if (!jumpsOnly && dr === forward) {
            const r1 = row + dr;
            const c1 = col + dc;
            if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
              if (!boardValue(board, r1 * 8 + c1)) targets.add(r1 * 8 + c1);
            }
          }

          const r1 = row + dr, c1 = col + dc;
          const r2 = row + dr * 2, c2 = col + dc * 2;
          if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
            const midPiece = String(boardValue(board, r1 * 8 + c1) || "").trim().toLowerCase();
            const destPiece = String(boardValue(board, r2 * 8 + c2) || "").trim().toLowerCase();
            if (midPiece && midPiece[0] === enemyColor && destPiece === "") {
              targets.add(r2 * 8 + c2);
            }
          }
        } else {
          let r = row + dr, c = col + dc;
          let foundEnemy = false;

          while (r >= 0 && r < 8 && c >= 0 && c < 8) {
            const idx = r * 8 + c;
            const currentPiece = String(boardValue(board, idx) || "").trim().toLowerCase();

            if (!foundEnemy) {
              if (!currentPiece) {
                if (!jumpsOnly) targets.add(idx);
              } else if (currentPiece[0] === color) {
                break;
              } else {
                foundEnemy = true;
              }
            } else {
              if (!currentPiece) targets.add(idx);
              else break;
            }

            r += dr;
            c += dc;
          }
        }
      }

      return targets;
    }

    async function executeMove(toIndex) {
      const fromIndex = state.selectedIndex;
      if (fromIndex === null || !state.currentGame) return;

      const previousTurn = state.currentGame.turn;

      try {
        const updated = await rpcSingle("make_move", {
          p_game_id: state.currentGame.id,
          p_from_index: fromIndex,
          p_cell_index: toIndex
        });

        if (!updated) return;

        state.currentGame = updated;

        if (updated.status === "playing" && updated.turn === previousTurn) {
          state.isDoubleJumpPending = true;
          state.selectedIndex = toIndex;
          state.legalTargets = getLegalTargetsFromSelected(updated.board_state, toIndex, true);
        } else {
          state.isDoubleJumpPending = false;
          state.selectedIndex = null;
          state.legalTargets = new Set();
        }

        renderBoard();
        updateStatus();

        if (updated.status === "finished") {
          showWinner();
        }
      } catch (err) {
        alert("Move failed: " + (err?.message || err));
      }
    }

    async function handleCellClick(index) {
      if (!isGameValid(state.currentGame) || state.currentGame.status !== "playing") return;

      const board = state.currentGame.board_state;
      const clickedPiece = boardValue(board, index);

      if (state.isDoubleJumpPending) {
        if (state.legalTargets.has(index)) {
          await executeMove(index);
        }
        return;
      }

      if (state.selectedIndex === null) {
        if (!clickedPiece) return;
        if (!isMyPiece(clickedPiece)) return;

        state.selectedIndex = index;
        state.legalTargets = getLegalTargetsFromSelected(board, index, false);
        renderBoard();
        updateStatus();
        return;
      }

      if (state.selectedIndex === index) {
        state.selectedIndex = null;
        state.legalTargets = new Set();
        renderBoard();
        updateStatus();
        return;
      }

      if (isMyPiece(clickedPiece)) {
        state.selectedIndex = index;
        state.legalTargets = getLegalTargetsFromSelected(board, index, false);
        renderBoard();
        updateStatus();
        return;
      }

      if (state.legalTargets.has(index)) {
        await executeMove(index);
      }
    }

    function openWinnerPopup(isDraw = false) {
      if (isDraw) {
        els.winnerTitle.textContent = "Draw";
        els.winnerSub.textContent = "No winner this round.";
      } else {
        els.winnerTitle.textContent = "Game Over";
        els.winnerSub.textContent = `Winner symbol: ${state.currentGame?.winner || "—"}`;
      }

      els.winnerOverlay.classList.add("open");
    }

    function closeWinnerPopup() {
      els.winnerOverlay.classList.remove("open");
    }

    function showWinner() {
      openWinnerPopup(!state.currentGame?.winner_user);
    }

    function subscribeToGame(gameId) {
      if (state.channel) {
        supabase.removeChannel(state.channel);
        state.channel = null;
      }

      state.channel = supabase
        .channel(`game_updates_${gameId}`)
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "games", filter: `id=eq.${gameId}` },
          async (payload) => {
            const nextGame = payload.new || payload.old;
            if (!nextGame || !isGameValid(nextGame)) {
              leavePage();
              return;
            }

            state.currentGame = nextGame;

            if (nextGame.status === "finished") {
              state.selectedIndex = null;
              state.legalTargets = new Set();
              state.isDoubleJumpPending = false;
              renderBoard();
              updateStatus();
              showWinner();
              return;
            }

            renderBoard();
            updateStatus();
          }
        )
        .subscribe();
    }

    function scheduleFinishedCleanup() {
      if (!state.currentGame) return;

      if (state.cleanupTimer) clearTimeout(state.cleanupTimer);

      const gameId = state.currentGame.id;
      state.cleanupTimer = setTimeout(async () => {
        try {
          await rpcSingle("leave_game", { p_game_id: gameId });
        } catch (_) {}
        leavePage();
      }, 2200);
    }

    els.quitBtn.onclick = () => els.quitOverlay.classList.add("open");
    els.cancelQuitBtn.onclick = () => els.quitOverlay.classList.remove("open");
    els.backLobbyBtn.onclick = leavePage;

    els.confirmQuitBtn.onclick = async () => {
      els.confirmQuitBtn.textContent = "Leaving...";
      els.confirmQuitBtn.disabled = true;

      try {
        if (!state.currentGame) return leavePage();

        await rpcSingle("leave_game", {
          p_game_id: state.currentGame.id
        });

        leavePage();
      } catch (err) {
        alert("Failed to quit: " + (err?.message || err));
        els.confirmQuitBtn.textContent = "Quit";
        els.confirmQuitBtn.disabled = false;
      }
    };

    els.winnerOverlay.addEventListener("click", (e) => {
      if (e.target === els.winnerOverlay) closeWinnerPopup();
    });

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      state.userId = user?.id || null;

      if (!state.userId) {
        leavePage();
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get("gameId");

      if (!gameId) {
        leavePage();
        return;
      }

      const { data: game, error } = await supabase
        .from("games")
        .select("*")
        .eq("id", gameId)
        .maybeSingle();

      if (error || !game || !isGameValid(game)) {
        leavePage();
        return;
      }

      state.currentGame = game;
      renderBoard();
      updateStatus();
      subscribeToGame(gameId);

      if (game.status === "finished") {
        openWinnerPopup(!game.winner_user);
        scheduleFinishedCleanup();
      }
    }

    init();
  </script>
</body>
                                                        </html>
