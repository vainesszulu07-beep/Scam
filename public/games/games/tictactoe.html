<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Tic Tac Toe</title>
  <style>
    :root {
      --bg: #050816;
      --card: rgba(10, 14, 28, 0.88);
      --card2: rgba(14, 20, 42, 0.9);
      --text: #f8fbff;
      --muted: #9aa4c1;
      --line: rgba(255,255,255,0.08);
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 0 20px rgba(124, 58, 237, 0.22), 0 0 40px rgba(34, 211, 238, 0.12);
      --board-shadow: 0 0 0 1px rgba(124,58,237,.25), 0 20px 60px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(124,58,237,.22), transparent 32%),
        radial-gradient(circle at bottom right, rgba(34,211,238,.18), transparent 28%),
        linear-gradient(180deg, #04050d 0%, #070b18 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(14px);
    }

    .topbar {
      padding: 16px 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }

    .brand span {
      font-size: 13px;
      color: var(--muted);
    }

    .status-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      min-width: 120px;
      flex: 0 0 auto;
    }

    .status-pill.live {
      background: rgba(34,197,94,.14);
      color: #a7f3d0;
      border-color: rgba(34,197,94,.25);
    }

    .status-pill.waiting {
      background: rgba(245,158,11,.14);
      color: #fde68a;
      border-color: rgba(245,158,11,.25);
    }

    .status-pill.finished {
      background: rgba(239,68,68,.14);
      color: #fecaca;
      border-color: rgba(239,68,68,.25);
    }

    .exit-top-btn {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .content {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .info-card {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-height: 82px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .info-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .info-value {
      font-size: 16px;
      font-weight: 800;
      word-break: break-word;
    }

    .board-shell {
      position: relative;
      background: rgba(5, 10, 24, 0.9);
      border: 1px solid rgba(124,58,237,.24);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--board-shadow);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      aspect-ratio: 1 / 1;
    }

    .cell {
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(124,58,237,.16), rgba(34,211,238,.06)),
        rgba(255,255,255,.04);
      box-shadow:
        inset 0 0 20px rgba(124,58,237,.08),
        0 0 0 1px rgba(255,255,255,.03);
      color: var(--text);
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
      user-select: none;
      min-height: 90px;
    }

    .cell:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow:
        inset 0 0 24px rgba(34,211,238,.12),
        0 0 0 1px rgba(34,211,238,.2),
        0 0 22px rgba(124,58,237,.15);
    }

    .cell.filled {
      cursor: not-allowed;
    }

    .cell.x {
      color: #7dd3fc;
      text-shadow: 0 0 12px rgba(125,211,252,.9);
    }

    .cell.o {
      color: #fda4af;
      text-shadow: 0 0 12px rgba(253,164,175,.9);
    }

    .cell.winner {
      background:
        linear-gradient(180deg, rgba(34,197,94,.2), rgba(34,211,238,.1)),
        rgba(255,255,255,.05);
      box-shadow:
        0 0 0 1px rgba(34,197,94,.35),
        0 0 30px rgba(34,197,94,.18);
    }

    .footer {
      display: grid;
      gap: 12px;
    }

    .status-box {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      min-height: 70px;
      white-space: pre-line;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: transform .14s ease, opacity .14s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
    }

    .btn-main {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
    }

    .btn-ghost {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-left {
        width: 100%;
        justify-content: space-between;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .content {
        padding: 14px;
      }

      .board {
        gap: 10px;
      }

      .cell {
        min-height: 78px;
        border-radius: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .btn,
      .exit-top-btn {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-left">
        <button id="exitBtn" class="exit-top-btn">Exit</button>
        <div class="brand">
          <h1>Neon Tic Tac Toe</h1>
          <span>Live board synced with Supabase</span>
        </div>
      </div>
      <div id="status" class="status-pill">Loading...</div>
    </div>

    <div class="content">
      <div class="info-grid">
        <div class="info-card">
          <div class="info-label">You</div>
          <div class="info-value" id="meInfo">—</div>
        </div>
        <div class="info-card">
          <div class="info-label">Game</div>
          <div class="info-value" id="gameInfo">—</div>
        </div>
        <div class="info-card">
          <div class="info-label">Turn</div>
          <div class="info-value" id="turnInfo">—</div>
        </div>
        <div class="info-card">
          <div class="info-label">Winner</div>
          <div class="info-value" id="winnerInfo">—</div>
        </div>
      </div>

      <div class="board-shell">
        <div id="board" class="board">
          <div class="cell" id="cell0"></div>
          <div class="cell" id="cell1"></div>
          <div class="cell" id="cell2"></div>
          <div class="cell" id="cell3"></div>
          <div class="cell" id="cell4"></div>
          <div class="cell" id="cell5"></div>
          <div class="cell" id="cell6"></div>
          <div class="cell" id="cell7"></div>
          <div class="cell" id="cell8"></div>
        </div>
      </div>

      <div class="footer">
        <div class="status-box" id="statusBox">Waiting for game...</div>

        <div class="actions">
          <button id="refreshBtn" class="btn btn-main">Refresh Board</button>
          <button id="clearUiBtn" class="btn btn-ghost">Clear Highlight</button>
        </div>

        <div class="hint">
          X belongs to <strong>player_x</strong>. O belongs to <strong>player_o</strong>.
          The board state, turn handling, win detection, and leave/reset actions now come from your RPCs.
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const statusEl = document.getElementById("status");
    const statusBox = document.getElementById("statusBox");
    const meInfo = document.getElementById("meInfo");
    const gameInfo = document.getElementById("gameInfo");
    const turnInfo = document.getElementById("turnInfo");
    const winnerInfo = document.getElementById("winnerInfo");
    const boardEl = document.getElementById("board");
    const exitBtn = document.getElementById("exitBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearUiBtn = document.getElementById("clearUiBtn");

    const urlParams = new URLSearchParams(window.location.search);
    const urlGameId = urlParams.get("gameId");

    let userId = null;
    let currentGame = null;
    let boardTemplate = createEmptyBoard();
    let realtimeChannel = null;
    let autoCleanupDone = false;

    function createEmptyBoard() {
      return ["", "", "", "", "", "", "", "", ""];
    }

    function normalizeRow(data) {
      if (!data) return null;
      if (Array.isArray(data)) return data[0] || null;
      return data;
    }

    function isBoardArray(value) {
      return Array.isArray(value) && value.length === 9;
    }

    function setStatus(text, mode = "") {
      statusEl.textContent = text;
      statusEl.className = "status-pill" + (mode ? ` ${mode}` : "");
      statusBox.textContent = text;
    }

    function showRawError(context, err) {
      const raw =
        err && typeof err === "object"
          ? JSON.stringify(err, Object.getOwnPropertyNames(err), 2)
          : String(err);

      const message = err?.message ? err.message : String(err);
      setStatus(`${context}\n${message}\n\nRAW ERROR:\n${raw}`, "finished");
      console.error(context, err);
    }

    async function getUser() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session || !session.user) {
        throw new Error("Not logged in");
      }
      userId = session.user.id;
      return userId;
    }

    function getUserFromSymbol(symbol) {
      if (!currentGame) return null;
      if (symbol === "X") return currentGame.player_x;
      if (symbol === "O") return currentGame.player_o;
      return null;
    }

    function clearWinnerHighlight() {
      for (let i = 0; i < 9; i++) {
        const cell = document.getElementById("cell" + i);
        if (cell) cell.classList.remove("winner");
      }
    }

    function highlightWinnerLine(board, symbol) {
      clearWinnerHighlight();

      const lines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      for (const [a, b, c] of lines) {
        if (board[a] === symbol && board[b] === symbol && board[c] === symbol) {
          [a, b, c].forEach((index) => {
            const cell = document.getElementById("cell" + index);
            if (cell) cell.classList.add("winner");
          });
          break;
        }
      }
    }

    function renderBoard(board) {
      const safeBoard = isBoardArray(board) ? board : createEmptyBoard();

      for (let i = 0; i < 9; i++) {
        const el = document.getElementById("cell" + i);
        if (!el) continue;

        const value = safeBoard[i] || "";
        el.textContent = value;
        el.className = "cell";

        if (value === "X") el.classList.add("x", "filled");
        if (value === "O") el.classList.add("o", "filled");
        if (!value) el.classList.remove("filled");
      }

      if (currentGame?.winner) {
        highlightWinnerLine(safeBoard, currentGame.winner);
      } else {
        clearWinnerHighlight();
      }
    }

    function syncGameMeta(game) {
      if (!game) {
        meInfo.textContent = userId || "—";
        gameInfo.textContent = "—";
        turnInfo.textContent = "—";
        winnerInfo.textContent = "—";
        return;
      }

      meInfo.textContent = userId || "—";

      const role =
        game.player_x === userId ? "X" :
        game.player_o === userId ? "O" :
        "Viewer";

      const turnText = game.turn ? game.turn : "—";
      gameInfo.textContent = `${game.id} (${role})`;
      turnInfo.textContent = turnText;

      if (game.winner_user) {
        winnerInfo.textContent = game.winner_user;
      } else if (game.winner) {
        winnerInfo.textContent = `${game.winner} / ${getUserFromSymbol(game.winner) || "—"}`;
      } else {
        winnerInfo.textContent = "—";
      }

      if (game.status === "playing") {
        setStatus("Live game", "live");
      } else if (game.status === "waiting") {
        setStatus("Waiting for opponent", "waiting");
      } else if (game.status === "finished") {
        setStatus("Game finished", "finished");
      } else {
        setStatus("Idle", "");
      }
    }

    async function rpcSingle(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return normalizeRow(data);
    }

    async function rpcRows(name, args = {}) {
      const { data, error } = await supabase.rpc(name, args);
      if (error) throw error;
      return Array.isArray(data) ? data : data ? [data] : [];
    }

    async function getGameById(gameId) {
      const { data, error } = await supabase
        .from("games")
        .select("*")
        .eq("id", gameId)
        .maybeSingle();

      if (error) throw error;
      return data || null;
    }

    async function loadBoardInfo(gameId) {
      const rows = await rpcRows("get_game_board_info", { p_game_id: gameId });
      const info = rows[0] || null;

      if (info && isBoardArray(info.board_template)) {
        boardTemplate = info.board_template;
      } else {
        boardTemplate = createEmptyBoard();
      }

      return info;
    }

    function subscribeToGame(gameId) {
      if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }

      if (!gameId) return;

      realtimeChannel = supabase
        .channel(`tic-tac-toe-${gameId}`)
        .on(
          "postgres_changes",
          {
            event: "UPDATE",
            schema: "public",
            table: "games",
            filter: `id=eq.${gameId}`
          },
          async (payload) => {
            currentGame = payload.new;

            if (currentGame?.game_type_id) {
              const info = await loadBoardInfo(currentGame.id).catch(() => null);
              if (info && isBoardArray(info.board_template)) {
                boardTemplate = info.board_template;
              }
            } else {
              boardTemplate = createEmptyBoard();
            }

            renderBoard(currentGame?.board_state || boardTemplate);
            syncGameMeta(currentGame);

            if (currentGame?.status === "finished" && !autoCleanupDone) {
              await cleanupFinishedGame();
            }
          }
        )
        .subscribe();
    }

    async function loadCurrentGame() {
      try {
        autoCleanupDone = false;
        await getUser();

        let game = null;

        if (urlGameId) {
          game = await getGameById(urlGameId);

          if (game && game.player_x !== userId && game.player_o !== userId) {
            game = null;
            setStatus("You are not in this game", "finished");
          }
        }

        if (!game) {
          game = await rpcSingle("get_active_playing_game");
        }

        if (!game) {
          currentGame = null;
          boardTemplate = createEmptyBoard();
          renderBoard(boardTemplate);
          syncGameMeta(null);
          subscribeToGame(null);
          setStatus("No active game", "");
          return;
        }

        currentGame = game;

        const info = await loadBoardInfo(currentGame.id).catch(() => null);

        if (info && !isBoardArray(currentGame.board_state)) {
          currentGame.board_state = isBoardArray(info.board_state)
            ? info.board_state
            : boardTemplate;
        } else if (!isBoardArray(currentGame.board_state)) {
          currentGame.board_state = createEmptyBoard();
        }

        renderBoard(currentGame.board_state || boardTemplate);
        syncGameMeta(currentGame);
        subscribeToGame(currentGame.id);

        if (currentGame.status === "finished") {
          await cleanupFinishedGame();
        }
      } catch (err) {
        showRawError("Failed to load game", err);
      }
    }

    async function cleanupFinishedGame() {
      if (!currentGame || autoCleanupDone) return;
      autoCleanupDone = true;

      try {
        const updated = await rpcSingle("leave_game", {
          p_game_id: currentGame.id
        });

        currentGame = updated;

        if (!currentGame?.game_type_id) {
          boardTemplate = createEmptyBoard();
        } else {
          await loadBoardInfo(currentGame.id).catch(() => null);
        }

        renderBoard(currentGame.board_state || boardTemplate);
        syncGameMeta(currentGame);
        clearWinnerHighlight();
        subscribeToGame(currentGame.id);
      } catch (err) {
        showRawError("Could not auto-reset finished game", err);
      }
    }

    async function makeMove(index) {
      if (!currentGame) return;

      try {
        const updated = await rpcSingle("make_move", {
          p_game_id: currentGame.id,
          p_cell_index: index
        });

        currentGame = updated;

        if (currentGame?.game_type_id) {
          await loadBoardInfo(currentGame.id).catch(() => null);
        }

        renderBoard(currentGame.board_state || boardTemplate);
        syncGameMeta(currentGame);

        if (currentGame.status === "finished") {
          await cleanupFinishedGame();
        }
      } catch (err) {
        showRawError("Could not make move", err);
      }
    }

    async function exitGame() {
      if (!currentGame) return;

      try {
        const updated = await rpcSingle("leave_game", {
          p_game_id: currentGame.id
        });

        currentGame = updated;

        if (!currentGame?.game_type_id) {
          boardTemplate = createEmptyBoard();
        } else {
          await loadBoardInfo(currentGame.id).catch(() => null);
        }

        renderBoard(currentGame.board_state || boardTemplate);
        syncGameMeta(currentGame);
        clearWinnerHighlight();

        subscribeToGame(currentGame.id);
      } catch (err) {
        showRawError("Could not exit game", err);
      }
    }

    refreshBtn.onclick = loadCurrentGame;
    exitBtn.onclick = exitGame;
    clearUiBtn.onclick = () => {
      clearWinnerHighlight();
      if (currentGame?.winner) {
        winnerInfo.textContent = currentGame.winner_user || currentGame.winner;
      } else {
        winnerInfo.textContent = "—";
      }
    };

    boardEl.addEventListener("click", (e) => {
      const cell = e.target.closest(".cell");
      if (!cell) return;
      const index = Number(cell.id.replace("cell", ""));
      makeMove(index);
    });

    async function init() {
      await loadCurrentGame();
    }

    init();
  </script>
</body>
  </html>
