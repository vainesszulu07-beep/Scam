<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
  background:#f0f2f5;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
}

/* APP WRAPPER */
.app{
  width:100%;
  max-width:500px;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:white;
}

/* HEADER */
.header{
  height:60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 16px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
  flex-shrink:0;
}
.header #status{
  font-size:12px;
  color:gray;
  font-weight:normal;
  margin-top:2px;
}

/* USERS BAR */
.users-bar{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:10px;
  border-bottom:1px solid #eee;
  background:white;
}

.user{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:60px;
  cursor:pointer;
  position:relative;
}

.user img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1877f2;
}

.user .online-dot{
  width:10px;
  height:10px;
  background:green;
  border-radius:50%;
  position:absolute;
  top:4px;
  right:4px;
  border:2px solid white;
  display:none;
}

.user span{
  font-size:12px;
  margin-top:4px;
  text-align:center;
}

/* CONVERSATIONS */
.conversations{
  flex:1;
  overflow-y:auto;
  background:#f0f2f5;
}

.conversation{
  display:flex;
  align-items:center;
  padding:10px;
  background:white;
  border-bottom:1px solid #eee;
  cursor:pointer;
  transition:0.2s;
  position:relative;
}

.conversation:hover{
  background:#f5f5f5;
}

.conversation.unread{
  background:#d0e8ff;
  font-weight:bold;
}

.conversation img{
  width:45px;
  height:45px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}

.conv-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.conv-name{
  font-weight:600;
}

.conv-last{
  font-size:13px;
  color:#333;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.conv-last.typing{
  color:#1877f2;
  font-style:italic;
}

/* UNREAD BADGE */
.badge{
  background:#1877f2;
  color:white;
  font-size:12px;
  min-width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
  margin-left:auto;
}

.no-chats{
  padding:20px;
  text-align:center;
  color:#777;
}

/* HIGHLIGHT UNREAD MESSAGE */
.unread-msg{
  font-weight:bold;
  color:#000;
  background:#e1f3ff;
  padding:2px 4px;
  border-radius:4px;
}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div id="username">Messages</div>
    <div id="status">Loading...</div>
  </div>
  <div class="users-bar" id="usersBar"></div>
  <div class="conversations" id="conversations">
    <div class="no-chats">Loading chats...</div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersBar = document.getElementById("usersBar");
const conversationsDiv = document.getElementById("conversations");
const statusEl = document.getElementById("status");

let userId;
const { data:{session} } = await supabase.auth.getSession();
if(!session){ window.location.href="login.html"; }
userId = session.user.id;

// --- ONLINE/OFFLINE & LAST SEEN MANAGEMENT ---

async function goOnline(){
  if(!userId) return;
  await supabase.from("profile").update({
    is_online: true,
    last_seen: new Date()
  }).eq("id", userId);
}

async function goOffline(){
  if(!userId) return;
  await supabase.from("profile").update({
    is_online: false,
    last_seen: new Date()
  }).eq("id", userId);
}

// Update last_seen every 30s
setInterval(async ()=>{
  if(!userId) return;
  await supabase.from("profile").update({last_seen:new Date()}).eq("id", userId);
}, 30000);

// Automatically mark offline after 2 minutes of inactivity
setInterval(async ()=>{
  if(!userId) return;
  const { data } = await supabase.from("profile").select("last_seen").eq("id", userId).single();
  if(!data) return;
  const diff = (new Date() - new Date(data.last_seen))/1000/60;
  if(diff >= 2){
    await goOffline();
  } else {
    await goOnline();
  }
}, 60000);

window.addEventListener("beforeunload", goOffline);
goOnline();

// --- USER STATUS DISPLAY ---
function updateStatus(user){
  const userDots = document.querySelectorAll(`.user[data-id='${user.id}'] .online-dot`);
  userDots.forEach(dot=>{
    if(user.is_online || (user.last_seen && (new Date() - new Date(user.last_seen))/1000/60 < 2)){
      dot.style.display="block";
    } else {
      dot.style.display="none";
    }
  });

  if(user.id !== userId){
    const diff = (new Date() - new Date(user.last_seen))/1000/60;
    statusEl.textContent = (user.is_online || diff < 2) ? "Active now" : "Offline";
  }
}

// --- LOAD USERS ---
async function loadUsers(){
  const { data } = await supabase.from("profile").select("*").neq("id", userId).limit(20);
  usersBar.innerHTML = "";
  data.forEach(user=>{
    const div = document.createElement("div");
    div.className = "user";
    div.setAttribute("data-id", user.id);
    div.innerHTML = `<img src="${user.avatar_url || 'https://via.placeholder.com/50'}"><span>${user.full_name || 'User'}</span><div class="online-dot"></div>`;
    if(user.is_online || (user.last_seen && (new Date() - new Date(user.last_seen))/1000/60 < 2)){
      div.querySelector(".online-dot").style.display="block";
    }
    div.onclick = ()=> startConversation(user.id);
    usersBar.appendChild(div);
  });
}

// --- START CONVERSATION ---
async function startConversation(otherId){
  let { data } = await supabase.from("conversations").select("*").or(`and(user1_id.eq.${userId},user2_id.eq.${otherId}),and(user1_id.eq.${otherId},user2_id.eq.${userId})`).single();
  if(!data){
    const { data:newConv } = await supabase.from("conversations").insert({user1_id:userId,user2_id:otherId}).select().single();
    data=newConv;
  }
  window.location.href = `view-chat.html?conversationId=${data.id}`;
}

// --- LOAD CONVERSATIONS ---
async function loadConversations(){
  const { data:convs } = await supabase.from("conversations").select(`
    id,user1_id,user2_id,created_at,
    user1:profile!user1_id(full_name,avatar_url,is_online,last_seen),
    user2:profile!user2_id(full_name,avatar_url,is_online,last_seen)
  `).or(`user1_id.eq.${userId},user2_id.eq.${userId}`).order("created_at",{ascending:false});

  if(!convs || convs.length===0){
    conversationsDiv.innerHTML=`<div class="no-chats">No chats yet</div>`;
    return;
  }

  conversationsDiv.innerHTML="";
  for(const conv of convs){
    const other = conv.user1_id===userId ? conv.user2 : conv.user1;
    const { data:msgs } = await supabase.from("messages").select("*").eq("conversation_id", conv.id).order("created_at",{ascending:false}).limit(1);
    const lastMsg = msgs?.[0] || null;
    const lastText = lastMsg ? lastMsg.content || "Media" : "Open chat";
    const unread = lastMsg && !lastMsg.read && lastMsg.sender_id!==userId;
    const badgeCount = await getUnreadCount(conv.id);

    const diff = (new Date() - new Date(other.last_seen))/1000/60;
    let statusText = (other.is_online || diff < 2) ? "Active now" : "Offline";

    const div = document.createElement("div");
    div.className="conversation";
    if(unread) div.classList.add("unread");
    div.innerHTML=`
      <img src="${other.avatar_url || 'https://via.placeholder.com/45'}">
      <div class="conv-info">
        <div class="conv-name">${other.full_name || 'User'}</div>
        <div class="conv-last" id="last-${conv.id}">${unread ? `<span class="unread-msg">${lastText}</span>` : lastText} - ${statusText}</div>
      </div>
      <div class="badge" id="badge-${conv.id}" style="display:${badgeCount? 'flex':'none'}">${badgeCount}</div>
    `;
    div.onclick = ()=>{
      div.classList.remove("unread");
      const badge=document.getElementById("badge-"+conv.id);
      if(badge) badge.style.display="none";
      window.location.href=`view-chat.html?conversationId=${conv.id}`;
    };
    conversationsDiv.appendChild(div);
  }
}

// --- UNREAD COUNT ---
async function getUnreadCount(convId){
  const { data } = await supabase.from("messages").select("id").eq("conversation_id", convId).eq("read", false).neq("sender_id", userId);
  return data?.length || 0;
}

// --- REALTIME UPDATES ---
supabase.channel("user-status")
.on("postgres_changes",{event:"UPDATE",schema:"public",table:"profile"},payload=>{
  updateStatus(payload.new);
}).subscribe();

supabase.channel("messages-listener")
.on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async payload=>{
  const msg = payload.new;
  const last=document.getElementById("last-"+msg.conversation_id);
  const badge=document.getElementById("badge-"+msg.conversation_id);
  if(last){
    let displayText = msg.content || "Media";
    if(msg.sender_id!==userId && !msg.read){ displayText = `<span class="unread-msg">${displayText}</span>`; }
    last.innerHTML = `${displayText}<span style="font-size:10px; opacity:0.6; margin-left:5px">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>${msg.sender_id===userId ? `<span style="font-size:10px; margin-left:4px; color:${msg.read ? '#4fc3f7' : '#aaa'}">${msg.read ? '✔✔' : '✔'}</span>` : ''}`;
    last.closest(".conversation").classList.add("unread");
    if(badge){ const count = await getUnreadCount(msg.conversation_id); badge.textContent = count; badge.style.display = count ? 'flex' : 'none'; }
  }
}).subscribe(); 

  

// --- INIT ---
loadUsers();
loadConversations();
</script>
</body>
  </html>
