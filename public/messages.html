<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users Presence (Lusaka)</title>
<style>
  body {
    font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
    background:#f0f2f5;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
  }

  .app {
    width:100%;
    max-width:500px;
    display:flex;
    flex-direction:column;
  }

  .user {
    display:flex;
    align-items:center;
    padding:10px;
    background:white;
    margin-bottom:8px;
    border-radius:6px;
    cursor:pointer;
    position:relative;
  }

  .user img {
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #1877f2;
  }

  .user-info {
    margin-left:10px;
    flex:1;
  }

  .user-name {
    font-weight:600;
  }

  .last-seen {
    font-size:12px;
    color:#555;
  }

  .online-dot {
    width:12px;
    height:12px;
    background:green;
    border-radius:50%;
    border:2px solid white;
    position:absolute;
    top:10px;
    right:10px;
    display:none;
  }
</style>
</head>
<body>

<h2>Users Online Status</h2>
<div class="app" id="usersContainer"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const container = document.getElementById("usersContainer");

// ---------------- Session ----------------
const { data: { session } } = await supabase.auth.getSession();
if(!session){
  alert("Not logged in");
  throw new Error("No session");
}
const userId = session.user.id;

// ---------------- Lusaka time helper ----------------
function nowLusakaUTC() {
  const nowLocal = new Date();
  const offsetMinutes = -120; // UTC+2 Lusaka
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);
}

// ---------------- Update logged-in user last_seen ----------------
async function updateLastSeen() {
  const lusakaUTC = nowLusakaUTC().toISOString();
  const { error } = await supabase
    .from("profile")
    .update({ last_seen: lusakaUTC, is_online: true })
    .eq("id", userId);
  if(error) console.error("Failed to update last_seen:", error);
}

// Go offline on page unload
window.addEventListener("beforeunload", async () => {
  await supabase.from("profile")
    .update({ is_online: false, last_seen: new Date() })
    .eq("id", userId);
});

// Initial update + every 30s
updateLastSeen();
setInterval(updateLastSeen, 30000);

// ---------------- Check if user is active ----------------
function isActive(lastSeenUTC) {
  if(!lastSeenUTC) return false;
  const nowUTC = nowLusakaUTC();
  const diffMs = nowUTC.getTime() - new Date(lastSeenUTC).getTime();
  const diffMinutes = diffMs / 1000 / 60;
  return diffMinutes < 2;
}

// Format last seen nicely
function formatLastSeen(lastSeenUTC) {
  const d = new Date(lastSeenUTC);
  return `Last seen: ${d.toLocaleString([], {hour:'2-digit',minute:'2-digit', day:'numeric', month:'short'})}`;
}

// ---------------- Load users ----------------
async function loadUsers() {
  const { data, error } = await supabase
    .from("profile")
    .select("id, full_name, avatar_url, last_seen")
    .neq("id", userId);

  if(error){
    container.innerHTML = "Error loading users";
    console.error(error);
    return;
  }

  container.innerHTML = "";

  data.forEach(user => {
    const active = isActive(user.last_seen);

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <img src="${user.avatar_url || 'https://via.placeholder.com/50'}">
      <div class="user-info">
        <div class="user-name">${user.full_name || user.id}</div>
        <div class="last-seen">${active ? '' : formatLastSeen(user.last_seen)}</div>
      </div>
      <div class="online-dot" style="display:${active ? 'block':'none'}"></div>
    `;

    container.appendChild(div);
  });
}

// Initial load + refresh every 30s
loadUsers();
setInterval(loadUsers, 30000);
</script>

</body>
                         </html>
