<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Users Status</title>
<style>
body{
  font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
  background:#f0f2f5;
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
h2{ margin-bottom:20px; }
.user{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.avatar-wrapper{ position:relative; }
.user img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1877f2;
}
.online-dot{
  width:12px;
  height:12px;
  background:green;
  border-radius:50%;
  border:2px solid white;
  position:absolute;
  top:0;
  right:0;
  display:none;
}
.status-text{ font-weight:bold; }
</style>
</head>
<body>

<h2>Realtime Users Status</h2>
<div id="usersContainer"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ---------------- Supabase Setup ----------------
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// ---------------- Session ----------------
const { data:{session} } = await supabase.auth.getSession();
if(!session){ 
  alert("Not logged in"); 
  throw new Error("No session");
}
const userId = session.user.id;
const usersContainer = document.getElementById("usersContainer");

// ---------------- Presence ----------------
let lastActivity = Date.now();

// Update last_activity on user events
['mousemove','keydown','scroll','touchstart'].forEach(evt => {
  window.addEventListener(evt, ()=> lastActivity = Date.now());
});

// Function to update `last_seen` in Supabase
async function updatePresence(forceOffline=false){
  const lastSeen = forceOffline ? new Date(Date.now() - 2*60*1000) : new Date();
  await supabase.from("profile")
    .update({ last_seen: lastSeen })
    .eq("id", userId);
}

// Initial presence update
updatePresence();

// Update every 15 seconds
setInterval(async ()=>{
  // Auto offline if idle > 2 min
  if(Date.now() - lastActivity > 2*60*1000){
    await updatePresence(true); // force last_seen 2 min ago → offline
  } else {
    await updatePresence(); // online
  }
}, 15000);

// Before leaving page → mark offline immediately
window.addEventListener("beforeunload", async ()=>{
  await updatePresence(true);
});

// ---------------- Active Check ----------------
function isActive(lastSeen){
  if(!lastSeen) return false;
  const diff = (new Date() - new Date(lastSeen)) / 1000 / 60; // minutes
  return diff < 2;
}

// ---------------- Load Users ----------------
async function loadUsers(){
  const {data,error} = await supabase.from("profile").select("*").neq("id",userId);
  if(error){ console.log(error); return; }

  usersContainer.innerHTML="";
  data.forEach(user=>{
    const active = isActive(user.last_seen);
    const div = document.createElement("div");
    div.className = "user";
    div.dataset.id = user.id;
    div.innerHTML = `
      <div class="avatar-wrapper">
        <img src="${user.avatar_url || 'https://via.placeholder.com/50'}">
        <div class="online-dot" style="display:${active?'block':'none'}"></div>
      </div>
      <div class="status-text" id="status-${user.id}">
        ${active ? "Active now":"Offline"}
      </div>
    `;
    usersContainer.appendChild(div);
  });
}

// Initial load
loadUsers();

// ---------------- Realtime Updates ----------------
supabase.channel("presence")
  .on("postgres_changes", 
    { event:"UPDATE", schema:"public", table:"profile" }, 
    payload=>{
      const user = payload.new;
      const statusEl = document.getElementById(`status-${user.id}`);
      const dotEl = document.querySelector(`.user[data-id='${user.id}'] .online-dot`);
      const active = isActive(user.last_seen);
      if(statusEl) statusEl.textContent = active ? "Active now" : "Offline";
      if(dotEl) dotEl.style.display = active ? "block":"none";
    }
  ).subscribe();

</script>
</body>
</html>
