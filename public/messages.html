<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#f0f2f5;
}

.container{
max-width:650px;
margin:auto;
}

.header{
font-size:22px;
font-weight:700;
padding:15px;
}

.users-top{
display:flex;
overflow-x:auto;
gap:14px;
padding:10px 15px;
border-bottom:1px solid #ddd;
background:white;
}

.user{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
cursor:pointer;
position:relative;
}

.user img{
width:56px;
height:56px;
border-radius:50%;
object-fit:cover;
}

.online-dot{
position:absolute;
bottom:2px;
right:2px;
width:14px;
height:14px;
border-radius:50%;
border:2px solid white;
}

.conversation-list{
display:flex;
flex-direction:column;
background:white;
}

.conversation{
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.conversation:hover{
background:#f7f7f7;
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
}

.conv-info{
flex:1;
}

.name-row{
display:flex;
justify-content:space-between;
font-weight:600;
}

.last-msg{
font-size:13px;
color:#666;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:250px;
}

.unread{
font-weight:700;
color:black;
}

.badge{
background:#1877f2;
color:white;
border-radius:20px;
font-size:11px;
padding:2px 6px;
margin-left:6px;
}

.status{
font-size:11px;
color:#888;
}

.typing{
color:#1877f2;
font-size:13px;
font-style:italic;
}

</style>
</head>

<body>

<div class="container">

<div class="header">Messages</div>

<div id="usersTop" class="users-top"></div>

<div id="conversationList" class="conversation-list"></div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase=createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
)

const usersTop=document.getElementById("usersTop")
const conversationList=document.getElementById("conversationList")

const {data:{session}}=await supabase.auth.getSession()
const userId=session.user.id

function timeAgo(date){
if(!date)return ""
const diff=(Date.now()-new Date(date))/1000
if(diff<60) return "now"
if(diff<3600) return Math.floor(diff/60)+"m"
if(diff<86400) return Math.floor(diff/3600)+"h"
return Math.floor(diff/86400)+"d"
}

function isOnline(last){
if(!last) return false
const diff=(Date.now()-new Date(last))/1000/60
return diff<2
}

async function updateLastSeen(){
await supabase
.from("profile")
.update({last_seen:new Date().toISOString()})
.eq("id",userId)
}

setInterval(updateLastSeen,30000)
updateLastSeen()

async function loadUsers(){

const {data}=await supabase
.from("profile")
.select("id,full_name,avatar_url,last_seen")
.neq("id",userId)

usersTop.innerHTML=""

data.forEach(u=>{

const online=isOnline(u.last_seen)

const el=document.createElement("div")
el.className="user"

el.innerHTML=`
<img src="${u.avatar_url||'https://via.placeholder.com/60'}">
<div>${u.full_name||"User"}</div>
<span class="online-dot" style="background:${online?'#2ecc71':'#bbb'}"></span>
`

el.onclick=()=>openConversation(u.id)

usersTop.appendChild(el)

})

}

async function loadConversations(){

const {data}=await supabase
.from("conversations")
.select(`
id,
user1_id,
user2_id,
typing,
user1:profile!user1_id(full_name,avatar_url,last_seen),
user2:profile!user2_id(full_name,avatar_url,last_seen)
`)
.or(`user1_id.eq.${userId},user2_id.eq.${userId}`)
.order("updated_at",{ascending:false})

conversationList.innerHTML=""

for(const c of data){

const other=c.user1_id===userId?c.user2:c.user1

const {data:messages}=await supabase
.from("messages")
.select("content,read")
.eq("conversation_id",c.id)
.order("created_at",{ascending:false})
.limit(1)

const lastMsg=messages?.[0]?.content||""

const unreadCount=messages?.filter(m=>!m.read).length||0

const online=isOnline(other.last_seen)

let typingText=""

if(c.typing){
const typingUsers=Object.keys(c.typing).filter(id=>c.typing[id])
if(typingUsers.includes(other.id)){
typingText="typing..."
}
}

const el=document.createElement("div")
el.className="conversation"
el.dataset.conversation=c.id
el.dataset.lastmsg=lastMsg

el.innerHTML=`

<img class="avatar" src="${other.avatar_url||'https://via.placeholder.com/50'}">

<div class="conv-info">

<div class="name-row">

<div>${other.full_name||"User"}</div>

<div class="status">${online?"online":timeAgo(other.last_seen)}</div>

</div>

<div class="last-msg ${unreadCount?'unread':''}">

${typingText?`<span class="typing">${typingText}</span>`:lastMsg}

${unreadCount?`<span class="badge">${unreadCount}</span>`:""}

</div>

</div>

`

el.onclick=()=>openConversation(c.id)

conversationList.appendChild(el)

}

}

function updateConversationTyping(conv){

const el=document.querySelector(`[data-conversation="${conv.id}"]`)
if(!el)return

const lastMsgEl=el.querySelector(".last-msg")
const typing=conv.typing||{}

const typingUsers=Object.keys(typing).filter(uid=>typing[uid])

if(typingUsers.length){

const uid=typingUsers.find(id=>id!==userId)||typingUsers[0]

lastMsgEl.innerHTML=`<span class="typing">typing...</span>`

}else{

const saved=el.dataset.lastmsg
lastMsgEl.textContent=saved

}

}

function openConversation(id){
window.location.href=`view-chat.html?conversationId=${id}`
}

loadUsers()
loadConversations()

setInterval(()=>{
loadUsers()
loadConversations()
},20000)

supabase.channel("chat-listener")
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"conversations",
filter:`user1_id=eq.${userId}`
},
payload=>{
updateConversationTyping(payload.new)
}
)
.subscribe()

</script>

</body>
  </html>
