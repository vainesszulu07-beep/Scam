<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Status Test</title>
<style>
body {
  font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
  background:#f0f2f5;
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
.user {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}
.user img {
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #1877f2;
  position:relative;
}
.online-dot {
  width:10px;
  height:10px;
  background:green;
  border-radius:50%;
  border:2px solid white;
  position:absolute;
  top:0;
  right:0;
  display:none;
}
.status-text {
  font-weight:bold;
}
</style>
</head>
<body>

<h2>Users Status Test</h2>
<div id="usersContainer"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

let userId;
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  alert("Not logged in");
} else {
  userId = session.user.id;
}

// --- Online / Offline Functions ---
async function goOnline() {
  if (!userId) return;
  await supabase.from("profile").update({ is_online: true, last_seen: new Date() }).eq("id", userId);
}
async function goOffline() {
  if (!userId) return;
  await supabase.from("profile").update({ is_online: false, last_seen: new Date() }).eq("id", userId);
}

// Initial online
goOnline();
window.addEventListener("beforeunload", goOffline);

// Update last_seen every 30s
setInterval(async () => {
  if (!userId) return;
  await supabase.from("profile").update({ last_seen: new Date() }).eq("id", userId);
}, 30000);

// Auto offline if inactive for 2 min
setInterval(async () => {
  if (!userId) return;
  const { data } = await supabase.from("profile").select("last_seen").eq("id", userId).single();
  if (!data) return;
  const diff = (new Date() - new Date(data.last_seen)) / 1000 / 60;
  if (diff >= 2) {
    await goOffline();
  } else {
    await goOnline();
  }
}, 60000);

// Load all users
async function loadUsers() {
  const { data } = await supabase.from("profile").select("*").neq("id", userId).limit(20);
  const container = document.getElementById("usersContainer");
  container.innerHTML = "";
  data.forEach(user => {
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = `
      <div style="position:relative;">
        <img src="${user.avatar_url || 'https://via.placeholder.com/50'}">
        <div class="online-dot"></div>
      </div>
      <div class="status-text" id="status-${user.id}">${user.is_online ? "Active now" : "Offline"}</div>
    `;
    div.setAttribute("data-id", user.id);
    container.appendChild(div);

    const dot = div.querySelector(".online-dot");
    if (user.is_online || (user.last_seen && (new Date() - new Date(user.last_seen))/1000/60 < 2)) {
      dot.style.display = "block";
    }
  });
}

// --- Real-time updates ---
supabase.channel("user-status")
.on("postgres_changes", { event:"UPDATE", schema:"public", table:"profile" }, payload => {
  const user = payload.new;
  const statusEl = document.getElementById(`status-${user.id}`);
  const dotEl = document.querySelector(`.user[data-id='${user.id}'] .online-dot`);
  if(statusEl) statusEl.textContent = (user.is_online || (user.last_seen && (new Date() - new Date(user.last_seen))/1000/60 < 2)) ? "Active now" : "Offline";
  if(dotEl) dotEl.style.display = (user.is_online || (user.last_seen && (new Date() - new Date(user.last_seen))/1000/60 < 2)) ? "block" : "none";
}).subscribe();

// --- Init ---
loadUsers();
</script>
</body>
  </html>
