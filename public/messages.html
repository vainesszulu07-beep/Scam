<!DOCTYPE html>
<html lang="en">              
<head>              
<meta charset="UTF-8">              
<meta name="viewport" content="width=device-width, initial-scale=1.0">              
<title>Realtime Users Presence (Lusaka)</title>              
<style>              
  body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }              
  .user { background:white; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; }              
  .status { font-weight:bold; display:flex; align-items:center; gap:6px; }              
  .online-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }              
  .online { color:green; }              
  .offline { color:red; }              
  .user img { width:40px; height:40px; border-radius:50%; margin-right:10px; }              
  .user-info { display:flex; align-items:center; gap:10px; }              
</style>              
</head>              
<body>            
<h2>Users Online Status</h2>              
<div id="users"></div>            

<script type="module">              
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";              

// ---------------- Supabase Setup ----------------              
const supabase = createClient(              
  "https://eimecuiixwgmpfpedxpr.supabase.co",              
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"              
);              

const container = document.getElementById("users");              

// ---------------- Session ----------------              
const { data: { session } } = await supabase.auth.getSession();              
if(!session){              
  alert("Not logged in");              
  throw new Error("No session");              
}              
const userId = session.user.id;              

// ---------------- Helper: Lusaka time as UTC ----------------              
function nowLusakaUTC() {              
  const nowLocal = new Date();              
  const offsetMinutes = -120;              
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);              
}              

// ---------------- Update logged-in user last_seen ----------------              
async function updateLastSeen() {              
  const lusakaUTC = nowLusakaUTC().toISOString();              
  const { error } = await supabase              
    .from("profile")              
    .update({ last_seen: lusakaUTC })              
    .eq("id", userId);              
  if(error) console.error("Failed to update last_seen:", error);              
}              

updateLastSeen();              
setInterval(updateLastSeen, 30000);              

// ---------------- Calculate if user is active ----------------              
function isActive(lastSeenUTC) {              
  if(!lastSeenUTC) return false;              
  const nowUTC = nowLusakaUTC();              
  const diffMs = nowUTC.getTime() - new Date(lastSeenUTC).getTime();              
  const diffMinutes = diffMs / 1000 / 60;              
  return diffMinutes < 2;              
}              

// ---------------- Load all users ----------------              
async function loadUsers() {              
  const { data, error } = await supabase              
    .from("profile")              
    .select("id, full_name, last_seen, avatar_url")              
    .neq("id", userId);              

  if(error){              
    container.innerHTML = "Error loading users";              
    console.error(error);              
    return;              
  }              

  container.innerHTML = "";              

  data.forEach(user => {              
    const active = isActive(user.last_seen);              
    const dotColor = active ? "green" : "grey";              
    const lastSeenText = user.last_seen ? new Date(user.last_seen).toUTCString() : "Never";              

    const div = document.createElement("div");              
    div.className = "user";              
    div.innerHTML = `              
      <div class="user-info">
        <img src="${user.avatar_url || 'https://via.placeholder.com/40'}">
        <span>${user.full_name || user.id}</span>
      </div>
      <span class="status ${active ? "online" : "offline"}">
        <span class="online-dot" style="background:${dotColor}"></span>
        ${active ? "Active now" : "Offline"} - Last seen: ${lastSeenText}
      </span>              
    `;              
    container.appendChild(div);              
  });              
}              

loadUsers();              
setInterval(loadUsers, 30000);              

</script>            
</body>              
  </html>
