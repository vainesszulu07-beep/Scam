<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger - Messages</title>
<style>
body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:#f0f2f5; }
.container { max-width:800px; margin:auto; padding:10px; }
h2 { margin-bottom:10px; font-size:18px; color:#333; display:flex; justify-content:space-between; align-items:center; }
.search-input { padding:6px 12px; border-radius:20px; border:1px solid #ccc; width:200px; outline:none; font-size:14px; }
.users-top { display:flex; overflow-x:auto; padding-bottom:10px; gap:12px; }
.user-card { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer; flex:0 0 auto; transition:transform .2s; }
.user-card:hover { transform:scale(1.05); }
.user-card img { width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid transparent; }
.online-dot { position:absolute; bottom:4px; right:4px; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow:0 0 2px rgba(0,0,0,0.3); }
.conversation-list { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.conversation { display:flex; align-items:center; gap:12px; padding:10px 12px; background:white; border-radius:12px; cursor:pointer; position:relative; transition:background 0.2s; }
.conversation:hover { background:#e8f0fe; }
.conversation img { width:50px; height:50px; border-radius:50%; object-fit:cover; }
.conv-info { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.conv-name { font-weight:600; font-size:15px; color:#111; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; display:flex; justify-content:space-between; align-items:center; }
.conv-last { font-size:13px; color:#555; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; display:flex; align-items:center; justify-content:space-between; }
.conv-dot { position:absolute; top:14px; right:12px; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 2px rgba(0,0,0,0.3); }
.unread-count { background:#1877f2; color:white; font-size:12px; border-radius:12px; padding:0 6px; margin-left:6px; }
.last-message-time { font-size:11px; color:#888; margin-left:4px; white-space:nowrap; }
.unread-message { background:#e7f3ff; font-weight:600; color:#000; }
.typing-indicator { font-size:12px; color:#1877f2; font-style:italic; }
</style>
</head>
<body>
<div class="container">
  <h2>Users <input type="text" id="searchUsers" class="search-input" placeholder="Search..."></h2>
  <div id="usersTop" class="users-top"></div>
  <h2>Conversations</h2>
  <div id="conversationList" class="conversation-list"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersTop = document.getElementById("usersTop");
const conversationList = document.getElementById("conversationList");
const searchUsers = document.getElementById("searchUsers");

const { data:{ session } } = await supabase.auth.getSession();
if(!session) { alert("Not logged in"); throw new Error("No session"); }
const userId = session.user.id;

// ---------------- Helper ----------------
function nowLusakaUTC() { 
  const now = new Date(); 
  const offset = -120; 
  return new Date(now.getTime() - offset*60*1000); 
}

function isActive(lastSeen) { 
  if(!lastSeen) return false; 
  const diff=(nowLusakaUTC() - new Date(lastSeen))/1000/60; 
  return diff<2; 
}

function formatDate(lastSeen) { 
  if(!lastSeen) return "Never"; 
  const d=new Date(lastSeen); 
  return d.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'}); 
}

// ---------------- Message preview with media ----------------
function getMessagePreview(msg) {
  if(msg.media_url) {
    const ext = msg.media_url.split('.').pop().toLowerCase();
    if(['png','jpg','jpeg','gif','webp'].includes(ext)) return `${msg.sender_name} sent an image`;
    if(['mp4','mov','webm','avi','mkv'].includes(ext)) return `${msg.sender_name} sent a video`;
    return `${msg.sender_name} sent a file`;
  }
  return msg.content || '';
}

// ---------------- Update own last_seen ----------------
async function updateLastSeen() { 
  await supabase.from("profile").update({last_seen:nowLusakaUTC().toISOString()}).eq("id",userId); 
}
updateLastSeen(); 
setInterval(updateLastSeen,30000);

// ---------------- Load users ----------------
let allUsers = [];
async function loadUsers() {  
  const {data:users,error} = await supabase.from("profile").select("id,full_name,avatar_url,last_seen").neq("id",userId);
  if(error){ console.error(error); return; }  
  allUsers = users;  
  renderUsers();
}

function renderUsers(filter="") {
  usersTop.innerHTML = "";
  allUsers.filter(u => u.full_name.toLowerCase().includes(filter.toLowerCase())).forEach(u => {
    const active = isActive(u.last_seen);
    const card = document.createElement("div"); card.className="user-card";
    card.innerHTML = `
      <img src="${u.avatar_url||'https://via.placeholder.com/60'}">
      <span class="online-dot" style="background:${active?'green':'grey'}"></span>
      <div>${u.full_name||u.id}</div>
      <div class="typing-indicator" style="display:none"></div>
      <div class="last-seen" style="display:${active?'none':'block'}">${formatDate(u.last_seen)}</div>`;
    card.onclick = () => openConversation(u.id);
    usersTop.appendChild(card);
  });
}
searchUsers.addEventListener("input", e => renderUsers(e.target.value));

// ---------------- Load conversations ----------------
let convElements = {};

async function loadConversations() {
  const {data:convs,error} = await supabase.from("conversations").select(`
    id,
    user1_id,
    user2_id,
    typing,
    user1:profile!user1_id(full_name,avatar_url,last_seen),
    user2:profile!user2_id(full_name,avatar_url,last_seen)
  `).or(`user1_id.eq.${userId},user2_id.eq.${userId}`).order('updated_at',{ascending:false});
  if(error){ console.error(error); return; }

  for(const c of convs) {
    const other = c.user1_id===userId ? c.user2 : c.user1;
    const active = isActive(other.last_seen);

    const {data:messages} = await supabase.from("messages").select("*").eq("conversation_id",c.id).order("created_at",{ascending:false}).limit(1);
    const lastMsgData = messages.length ? messages[0] : null;
    const lastMsg = lastMsgData ? getMessagePreview({
      content: lastMsgData.content,
      media_url: lastMsgData.media_url,
      sender_name: lastMsgData.sender_id === userId ? "You" : other.full_name
    }) : "";
    const lastMsgSender = lastMsgData ? lastMsgData.sender_id : null;
    const lastMsgRead = lastMsgData ? lastMsgData.read : false;

    const {data:unread} = await supabase.from("messages").select("id").eq("conversation_id",c.id).eq("read",false).neq("sender_id",userId);
    const unreadCount = unread.length;

    let conv = convElements[c.id];
    if(!conv){
      conv = document.createElement("div"); conv.className="conversation"; convElements[c.id]=conv;
      conv.onclick = () => openConversation(c.id);
      conversationList.appendChild(conv);
    }

    conv.className="conversation";  
    if(unreadCount>0) conv.classList.add("unread-message");

    conv.innerHTML = `
      <img src="${other.avatar_url||'https://via.placeholder.com/50'}">
      <span class="online-dot" style="position:absolute;top:6px;left:44px;width:12px;height:12px;background:${active?'green':'grey'}"></span>
      <div class="conv-info">
        <div class="conv-name">
          ${other.full_name || other.id} ${unreadCount>0?`<span class="unread-count">${unreadCount}</span>`:''}
        </div>
        <div class="conv-last">
          ${lastMsg}
          <span class="last-message-time">${lastMsgData ? new Date(lastMsgData.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span>
          ${lastMsgSender===userId ? `<span class="last-message-time">${lastMsgRead ? '✔✔':'✔'}</span>` : ''}
        </div>
        <div class="typing-indicator" style="display:none">typing...</div>
      </div>
    `;

    // subscribe to typing & new messages per conversation
    supabase.channel("chat-"+c.id)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:`id=eq.${c.id}`},payload=>{
        const typingUsers=Object.keys(payload.new.typing||{}).filter(uid=>payload.new.typing[uid] && uid!==userId);
        const typingDiv=conv.querySelector(".typing-indicator");
        typingDiv.style.display=typingUsers.length ? "block" : "none";
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${c.id}`},payload=>{
        const lastMsgDiv = conv.querySelector(".conv-last");
        const tick = payload.new.sender_id===userId ? (payload.new.read?'✔✔':'✔') : '';
        const preview = getMessagePreview({
          content: payload.new.content,
          media_url: payload.new.media_url,
          sender_name: payload.new.sender_id === userId ? "You" : other.full_name
        });

        if(payload.new.sender_id!==userId){
          conv.classList.add("unread-message");
          const countSpan=conv.querySelector(".unread-count");
          if(countSpan){ countSpan.textContent=parseInt(countSpan.textContent)+1; }
          else { const span=document.createElement("span"); span.className="unread-count"; span.textContent="1"; conv.querySelector(".conv-name").appendChild(span); }
        } else {
          conv.classList.remove("unread-message");
        }

        lastMsgDiv.textContent = preview + " ";
        const timeSpan=document.createElement("span");
        timeSpan.className="last-message-time";
        timeSpan.textContent = new Date(payload.new.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        lastMsgDiv.appendChild(timeSpan);

        if(tick) lastMsgDiv.appendChild(document.createTextNode(' ' + tick));
      })
      .subscribe();
  }
}

// ---------------- Open conversation ----------------
function openConversation(convId){ window.location.href=`view-chat.html?conversationId=${convId}`; }

// ---------------- Initial ----------------
await loadUsers();
await loadConversations();
setInterval(()=>{ loadUsers(); loadConversations(); },30000);
</script>
</body>
  </html>
