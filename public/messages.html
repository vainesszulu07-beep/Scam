<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Users Last Seen (Lusaka → UTC)</title>
<style>
  body { font-family:Arial; background:#f4f4f4; padding:20px; }
  .user { background:white; padding:10px; margin-bottom:8px; border-radius:6px; }
</style>
</head>
<body>

<h2>Users Last Seen</h2>
<div id="users"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const container = document.getElementById("users");

// Get current Lusaka time as UTC
function nowLusakaUTC() {
  const nowLocal = new Date();
  // Lusaka is UTC+2
  const offsetMinutes = -120; // UTC - localOffset (negative because JS offset is opposite)
  const lusakaUTC = new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);
  return lusakaUTC;
}

// Calculate difference in minutes between last_seen (UTC) and Lusaka local converted to UTC
function minutesAgoLusakaUTC(lastSeenUTC) {
  const nowUTC = nowLusakaUTC(); // current Lusaka time as UTC
  const lastSeenDate = new Date(lastSeenUTC); // DB timestamp is UTC
  const diffMs = nowUTC.getTime() - lastSeenDate.getTime();
  return (diffMs / 1000 / 60).toFixed(2);
}

async function loadUsers() {
  const { data, error } = await supabase
    .from("profile")
    .select("id, full_name, last_seen");

  if(error) {
    container.innerHTML = "Error loading users";
    console.error(error);
    return;
  }

  container.innerHTML = "";

  data.forEach(user => {
    let text = "No last_seen info";
    if(user.last_seen) {
      text = minutesAgoLusakaUTC(user.last_seen) + " minutes ago";
    }

    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = `<b>${user.full_name || user.id}</b><br>${text}`;
    container.appendChild(div);
  });
}

// Initial load
loadUsers();
setInterval(loadUsers, 1000); // refresh every 30s

</script>
</body>
</html>
