<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Last Seen</title>
</head>
<body>

<h2>Updating Last Seen...</h2>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ---------------- Supabase Setup ----------------
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// ---------------- Session ----------------
const { data: { session } } = await supabase.auth.getSession();
if(!session){
  alert("Not logged in");
  throw new Error("No session");
}

const userId = session.user.id;

// ---------------- Update function ----------------
async function updateLastSeen() {
  // current time in UTC
  const nowUTC = new Date().toISOString();
  
  const { error } = await supabase
    .from("profile")
    .update({ last_seen: nowUTC })
    .eq("id", userId);
  
  if(error) console.error("Failed to update last_seen:", error);
  else console.log("last_seen updated:", nowUTC);
}

// Update immediately on login
updateLastSeen();

// ---------------- Auto-update every 30 seconds ----------------
setInterval(updateLastSeen, 30000);

</script>
</body>
</html>
