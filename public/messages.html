<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Messages | Chat-Bet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --text: #000000;
  --border: #e5e5e5;
  --accent: #000000;
  --muted: #666666;
  --online: #00ff00;
  --playing: #6366f1; /* Arena Purple for active games */
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #fafafa;
  color: var(--text);
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  min-height: 100vh;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* ===== ARENA HEADER ===== */
.header {
  padding: 24px 20px;
  background: var(--bg);
  border-bottom: 2px solid var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin: 0;
  font-size: 20px;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 800;
}

.search-btn {
  cursor: pointer;
  padding: 8px;
  border: 1px solid var(--text);
  display: flex;
  transition: 0.2s;
}

.search-btn:hover { background: var(--text); color: white; }

/* ===== TOP ACTIVE USERS ===== */
.users-top {
  display: flex;
  overflow-x: auto;
  gap: 20px;
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.user-card {
  flex: 0 0 auto;
  text-align: center;
  position: relative;
  cursor: pointer;
}

.user-card img {
  width: 56px;
  height: 56px;
  border: 1px solid var(--text);
  padding: 2px;
  object-fit: cover;
}

.status-ring {
  position: absolute;
  bottom: 18px;
  right: 2px;
  width: 12px;
  height: 12px;
  border: 2px solid white;
  border-radius: 50%;
}

.user-card span {
  display: block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  margin-top: 5px;
}

/* ===== CONVERSATION LIST ===== */
.conversation {
  display: flex;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
}

.conversation:hover { background: #f9f9f9; }

.conv-avatar-wrap {
  position: relative;
  margin-right: 15px;
}

.conv-avatar-wrap img {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border: 1px solid var(--border);
}

.conv-info { flex: 1; }

.conv-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.conv-name {
  font-weight: 700;
  font-size: 14px;
  text-transform: uppercase;
}

.conv-time {
  font-size: 11px;
  color: var(--muted);
}

.conv-preview {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}

/* Status Badges */
.badge {
  font-size: 9px;
  padding: 2px 6px;
  font-weight: 800;
  text-transform: uppercase;
  margin-left: 8px;
}

.badge-playing {
  background: var(--playing);
  color: white;
}

.badge-offline {
  color: var(--muted);
  font-weight: 400;
}

.unread-dot {
  width: 8px;
  height: 8px;
  background: var(--text);
  border-radius: 50%;
}

</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Arena Comms</h1>
    <div id="searchUsers" class="search-btn">
       <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <div id="usersTop" class="users-top"></div>
  <div id="conversationList"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const { data:{ session } } = await supabase.auth.getSession();
if(!session) window.location.href = "login.html";
const userId = session.user.id;

/* ===== IMPROVED TIME CALCULATOR ===== */
function getTimeAgo(date) {
  if(!date) return "Long ago";
  const seconds = Math.floor((new Date() - new Date(date)) / 1000);
  
  let interval = seconds / 31536000;
  if (interval > 1) return Math.floor(interval) + "yr ago";
  interval = seconds / 2592000;
  if (interval > 1) return Math.floor(interval) + "mo ago";
  interval = seconds / 86400;
  if (interval > 1) return Math.floor(interval) + "d ago";
  interval = seconds / 3600;
  if (interval > 1) return Math.floor(interval) + "h ago";
  interval = seconds / 60;
  if (interval > 1) return Math.floor(interval) + "m ago";
  return "Just now";
}

/* ===== CHECK GAME STATUS ===== */
async function getGameStatus(otherId) {
  const { data } = await supabase.from("game")
    .select("player_x, player_o, status")
    .or(`player_x.eq.${otherId},player_o.eq.${otherId}`)
    .eq("status", "playing")
    .limit(1);

  if (data && data.length > 0) {
    const role = data[0].player_x === otherId ? "Player X" : "Player O";
    return `<span class="badge badge-playing">In Arena: ${role}</span>`;
  }
  return "";
}

/* ===== RENDER LOGIC ===== */
async function loadConversations() {
  const { data: convs } = await supabase.from("conversations")
    .select(`id, user1_id, user2_id, user1:profile!user1_id(full_name, avatar_url, last_seen), user2:profile!user2_id(full_name, avatar_url, last_seen)`)
    .or(`user1_id.eq.${userId},user2_id.eq.${userId}`);

  const listDiv = document.getElementById("conversationList");
  listDiv.innerHTML = "";

  for (const c of convs) {
    const other = c.user1_id === userId ? c.user2 : c.user1;
    const otherId = c.user1_id === userId ? c.user2_id : c.user1_id;
    
    // Get Last Message
    const { data: msgs } = await supabase.from("messages")
      .select("content, created_at, read, sender_id")
      .eq("conversation_id", c.id)
      .order("created_at", { ascending: false })
      .limit(1);

    const lastMsg = msgs?.[0];
    const gameStatus = await getGameStatus(otherId);
    const timeDisplay = lastMsg ? getTimeAgo(lastMsg.created_at) : "";
    const isOnline = (new Date() - new Date(other.last_seen)) / 1000 / 60 < 2;

    const convEl = document.createElement("div");
    convEl.className = "conversation";
    convEl.onclick = () => window.location.href = `view-chat.html?conversationId=${c.id}`;
    
    convEl.innerHTML = `
      <div class="conv-avatar-wrap">
        <img src="${other.avatar_url || 'https://via.placeholder.com/100'}">
        <div class="status-ring" style="background:${isOnline ? 'var(--online)' : '#ccc'}"></div>
      </div>
      <div class="conv-info">
        <div class="conv-header">
          <span class="conv-name">${other.full_name || 'Competitor'} ${gameStatus}</span>
          <span class="conv-time">${timeDisplay}</span>
        </div>
        <div class="conv-preview">
          <span>${lastMsg ? lastMsg.content.substring(0, 30) : "No transmissions..."}</span>
          ${(!lastMsg?.read && lastMsg?.sender_id !== userId) ? '<div class="unread-dot"></div>' : ''}
        </div>
        <div class="badge badge-offline">${isOnline ? 'Online Now' : 'Away: ' + getTimeAgo(other.last_seen)}</div>
      </div>
    `;
    listDiv.appendChild(convEl);
  }
}

// Initial Load
loadConversations();
// Refresh every 30 seconds
setInterval(loadConversations, 30000);

// Search Button
document.getElementById("searchUsers").onclick = () => window.location.href = "search.html";
</script>

</body>
</html>
