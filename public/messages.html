<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Users Presence (Lusaka)</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }
  .user { background:white; padding:10px; margin-bottom:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; }
  .status { font-weight:bold; }
  .online { color:green; }
  .offline { color:red; }
</style>
</head>
<body>

<h2>Users Online Status</h2>
<div id="users"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ---------------- Supabase Setup ----------------
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const container = document.getElementById("users");

// ---------------- Session ----------------
const { data: { session } } = await supabase.auth.getSession();
if(!session){
  alert("Not logged in");
  throw new Error("No session");
}
const userId = session.user.id;

// ---------------- Helper: Lusaka time as UTC ----------------
function nowLusakaUTC() {
  const nowLocal = new Date();
  // Lusaka is UTC+2
  const offsetMinutes = -120; // JS offset is opposite
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);
}

// ---------------- Update logged-in user last_seen ----------------
async function updateLastSeen() {
  const lusakaUTC = nowLusakaUTC().toISOString();
  const { error } = await supabase
    .from("profile")
    .update({ last_seen: lusakaUTC })
    .eq("id", userId);
  if(error) console.error("Failed to update last_seen:", error);
}

// Update immediately and every 30s
updateLastSeen();
setInterval(updateLastSeen, 30000);

// ---------------- Calculate if user is active ----------------
function isActive(lastSeenUTC) {
  if(!lastSeenUTC) return false;
  const nowUTC = nowLusakaUTC();
  const diffMs = nowUTC.getTime() - new Date(lastSeenUTC).getTime();
  const diffMinutes = diffMs / 1000 / 60;
  return diffMinutes < 2; // active if last seen < 2 minutes
}

// ---------------- Load all users ----------------
async function loadUsers() {
  const { data, error } = await supabase
    .from("profile")
    .select("id, full_name, last_seen")
    .neq("id", userId);

  if(error){
    container.innerHTML = "Error loading users";
    console.error(error);
    return;
  }

  container.innerHTML = "";

  data.forEach(user => {
    const active = isActive(user.last_seen);
    const div = document.createElement("div");
    div.className = "user";
    div.innerHTML = `
      <span>${user.full_name || user.id}</span>
      <span class="status ${active ? "online":"offline"}">
        ${active ? "Active now":"Offline"}
      </span>
    `;
    container.appendChild(div);
  });
}

// Initial load + refresh every 30s
loadUsers();
setInterval(loadUsers, 30000);

</script>
</body>
  </html>
