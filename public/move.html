<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Permission Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding-top: 50px; }
        .box { background: #2a2a2a; margin: 20px auto; padding: 20px; width: 80%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        #status { font-size: 1.8rem; font-weight: bold; color: #00ffcc; margin: 15px 0; }
        #debug { color: #888; font-family: monospace; font-size: 0.8rem; line-height: 1.5; }
        button { background: #007bff; color: white; border: none; padding: 20px 40px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Sensor Authorization</h1>
    
    <div class="box">
        <button id="askButton">Click to Request Permission</button>
        
        <div id="ui" class="hidden">
            <div id="status">Scanning...</div>
            <div id="debug">
                Beta: <span id="valB">0</span> | Gamma: <span id="valG">0</span>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('askButton');
        const ui = document.getElementById('ui');
        const statusDiv = document.getElementById('status');
        
        btn.addEventListener('click', function() {
            // CRITICAL: iOS 13+ requires this specific check
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startMotion();
                        } else {
                            alert("Permission was denied. You may need to clear website data or check iOS settings.");
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Error: You must use HTTPS to access sensors.");
                    });
            } else {
                // Android/Desktop or older iOS - No formal 'request' needed
                // It will just start if the hardware is available
                startMotion();
            }
        });

        function startMotion() {
            btn.classList.add('hidden');
            ui.classList.remove('hidden');

            window.addEventListener('deviceorientation', (event) => {
                const b = event.beta;  // Front/Back
                const g = event.gamma; // Left/Right

                document.getElementById('valB').innerText = b.toFixed(1);
                document.getElementById('valG').innerText = g.toFixed(1);

                let mode = (Math.abs(g) > 45) ? "Landscape" : "Portrait";
                let tilt = "";

                if (g < -25) tilt = "Tilted Left";
                else if (g > 25) tilt = "Tilted Right";
                else if (b > 105) tilt = "Tilted Up";
                else if (b < 75 && b > 10) tilt = "Tilted Down";
                else tilt = "Level";

                statusDiv.innerHTML = `${mode}<br><span style="font-size: 1rem; color: #aaa;">${tilt}</span>`;
            });
        }
    </script>
</body>
</html>
