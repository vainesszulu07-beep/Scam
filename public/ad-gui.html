
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">

<title>Advertisement</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
  background: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0;
}

body {
  display: flex;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
  overscroll-behavior: none;
  background: transparent;
  color: #202124;
  -webkit-font-smoothing: antialiased;
}

/* =====================================
   MAIN ADVERTISEMENT CARD
===================================== */

.ad-card {
  position: relative;

  display: flex;
  flex-direction: column;

  gap: 8px;

  width: 100%;
  max-width: 680px;
  height: 100%;

  min-width: 0;
  min-height: 0;

  padding: 9px;

  background: #ffffff;
  border: 1px solid #e2e5e9;
  border-radius: 11px;

  overflow: hidden;
}

/* =====================================
   HEADER
===================================== */

.ad-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  flex: 0 0 auto;

  min-width: 0;
  min-height: 25px;

  gap: 8px;
}

.ad-label {
  display: flex;
  align-items: center;

  gap: 8px;

  min-width: 0;

  font-size: 13px;
  font-weight: 600;
  color: #3c4043;
}

.ad-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 27px;

  padding: 3px 7px;

  border: 1px solid #dadce0;
  border-radius: 4px;

  background: #f8f9fa;

  font-size: 11px;
  font-weight: 600;
  color: #5f6368;
}

.ad-header-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 9px;

  flex: 0 0 auto;
}

.ad-timer {
  padding: 4px 7px;

  border: 1px solid #e0e3e7;
  border-radius: 5px;

  background: #ffffff;

  color: #5f6368;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sponsored {
  font-size: 11px;
  color: #777d84;
  white-space: nowrap;
}

/* =====================================
   AD CONTENT AREA
===================================== */

.ad-stage {
  position: relative;

  width: 100%;

  flex: 1 1 auto;

  min-width: 0;
  min-height: 0;

  overflow: hidden;
}

/* =====================================
   VIDEO
===================================== */

.video-frame {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  overflow: hidden;

  border-radius: 8px;
  background: #111111;
}

.video-click {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  cursor: pointer;
}

.ad-video {
  display: block;

  width: 100%;
  height: 100%;

  max-width: 100%;
  max-height: 100%;

  aspect-ratio: 16 / 9;

  object-fit: contain;

  background: #111111;
}

/* =====================================
   SOUND BUTTON
===================================== */

.sound-button {
  position: absolute;

  right: 11px;
  bottom: 11px;

  z-index: 4;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-height: 35px;
  min-width: 88px;

  padding: 8px 13px;

  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 20px;

  background: rgba(32,33,36,0.92);
  color: #ffffff;

  font-size: 12px;
  font-weight: 600;

  cursor: pointer;

  box-shadow: 0 2px 7px rgba(0,0,0,0.2);
}

.sound-button:hover {
  background: #303134;
}

.sound-button:focus-visible {
  outline: 2px solid #ffffff;
  outline-offset: 3px;
}

/* =====================================
   END CARD - ORIGINAL APPEARANCE
===================================== */

.end-card {
  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 7px;

  width: 100%;
  height: 100%;

  min-width: 0;
  min-height: 0;

  /*
    Space is reserved for the original
    bottom-positioned Visit Now button.
  */

  padding: 0 2px 46px;

  text-align: center;
  overflow: hidden;

  transition:
    padding 550ms cubic-bezier(0.22, 1, 0.36, 1);
}

/* =====================================
   ADVERTISER PICTURE
===================================== */

.picture-click {
  display: flex;
  align-items: center;
  justify-content: center;

  flex: 0 0 165px;

  width: 100%;
  height: 165px;

  min-width: 0;
  min-height: 0;

  max-height: 165px;

  overflow: hidden;

  text-decoration: none;

  transition:
    height 550ms cubic-bezier(0.22, 1, 0.36, 1),
    flex-basis 550ms cubic-bezier(0.22, 1, 0.36, 1),
    max-height 550ms cubic-bezier(0.22, 1, 0.36, 1);
}

.end-card img {
  display: block;

  width: 100%;
  height: 100%;

  max-width: 100%;
  max-height: 165px;

  object-fit: contain;
  object-position: center;

  border-radius: 8px;
  background: #f8f9fa;

  transition:
    max-height 550ms cubic-bezier(0.22, 1, 0.36, 1);
}

/* =====================================
   ADVERTISER TEXT
===================================== */

.end-card h3 {
  flex: 0 0 auto;

  width: 100%;

  margin: 0;

  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;

  color: #202124;

  overflow-wrap: anywhere;
}

.end-card p {
  flex: 0 0 auto;

  width: 100%;

  margin: 0;

  font-size: 12px;
  line-height: 1.4;

  color: #5f6368;
}

/* =====================================
   VISIT NOW BUTTON
   ORIGINAL POSITION: BOTTOM
===================================== */

.visit-button {
  position: absolute;

  left: 2px;
  right: 2px;
  bottom: 2px;

  display: flex;
  align-items: center;
  justify-content: center;

  width: calc(100% - 4px);

  min-height: 40px;
  max-width: 100%;

  padding: 10px 14px;

  border: 0;
  border-radius: 6px;

  background: #1a73e8;
  color: #ffffff;

  text-align: center;
  text-decoration: none;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition:
    top 550ms cubic-bezier(0.22, 1, 0.36, 1),
    bottom 550ms cubic-bezier(0.22, 1, 0.36, 1),
    left 550ms cubic-bezier(0.22, 1, 0.36, 1),
    right 550ms cubic-bezier(0.22, 1, 0.36, 1),
    width 550ms cubic-bezier(0.22, 1, 0.36, 1),
    background 150ms ease;
}

.visit-button:hover {
  background: #1765cc;
}

.visit-button:focus-visible {
  outline: 2px solid #1a73e8;
  outline-offset: 3px;
}

/* =====================================
   COMPACT END CARD
   VISIT BUTTON MOVES TO TOP
   PICTURE BECOMES SMALLER
===================================== */

.end-card.compact {
  /*
    Reserve space at the top for Visit Now.
    Remove the original bottom reservation.
  */

  padding: 46px 2px 2px;
}

/* Shrink the picture smoothly */

.end-card.compact .picture-click {
  flex-basis: 86px;

  height: 86px;
  max-height: 86px;
}

.end-card.compact .end-card-picture {
  max-height: 86px;
}

.end-card.compact img {
  max-height: 86px;
}

/* Move Visit Now to the top */

.end-card.compact .visit-button {
  top: 2px;

  left: 2px;
  right: 42px;
  bottom: auto;

  width: auto;
  min-height: 40px;
}

/* =====================================
   CLOSE BUTTON
===================================== */

.close-ad-button {
  position: absolute;

  top: 7px;
  right: 7px;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 32px;
  height: 32px;

  padding: 0;

  border: 0;
  border-radius: 50%;

  background: rgba(32,33,36,0.9);
  color: #ffffff;

  font-size: 23px;
  line-height: 1;

  cursor: pointer;
}

.close-ad-button:hover {
  background: #303134;
}

/* =====================================
   STATUS MESSAGE
===================================== */

.message {
  position: absolute;

  inset: 0;

  z-index: 2;

  display: grid;
  place-items: center;

  padding: 18px;

  background: rgba(255,255,255,0.96);

  text-align: center;

  font-size: 12px;
  line-height: 1.5;

  color: #5f6368;

  pointer-events: none;
}

[hidden] {
  display: none !important;
}

/* =====================================
   TOP AND BOTTOM PLACEMENTS
===================================== */

.ad-card[data-placement="top"],
.ad-card[data-placement="bottom"] {
  width: 100%;
  height: 100%;

  max-width: none;

  padding: 7px 9px;

  border: 0;
  border-radius: 0;

  gap: 6px;
}

.ad-card[data-placement="top"] .ad-stage,
.ad-card[data-placement="bottom"] .ad-stage {
  border-radius: 7px;
}

.ad-card[data-placement="top"] .end-card,
.ad-card[data-placement="bottom"] .end-card {
  gap: 6px;
}

/* =====================================
   STATIC PLACEMENT
===================================== */

.ad-card[data-placement="static"] {
  width: 100%;
  height: 100%;

  max-width: 680px;
}

/* =====================================
   FULLSCREEN PLACEMENT
===================================== */

.ad-card[data-placement="fullscreen"] {
  width: 100%;
  height: 100%;

  max-width: none;

  padding: clamp(12px, 2vw, 28px);

  gap: clamp(10px, 1.8vh, 18px);

  border: 0;
  border-radius: 0;
}

.ad-card[data-placement="fullscreen"] .ad-header {
  width: 100%;
  max-width: 1180px;

  min-height: 30px;

  margin: 0 auto;
}

.ad-card[data-placement="fullscreen"] .ad-label {
  font-size: 15px;
}

.ad-card[data-placement="fullscreen"] .ad-badge {
  font-size: 12px;
}

.ad-card[data-placement="fullscreen"] .ad-timer,
.ad-card[data-placement="fullscreen"] .sponsored {
  font-size: 12px;
}

.ad-card[data-placement="fullscreen"] .ad-stage {
  width: 100%;
  max-width: 1180px;

  margin: 0 auto;
}

.ad-card[data-placement="fullscreen"] .video-frame {
  border-radius: 14px;
}

.ad-card[data-placement="fullscreen"] .end-card {
  max-width: 900px;

  margin: 0 auto;

  gap: 12px;
  padding-bottom: 50px;
}

.ad-card[data-placement="fullscreen"] .picture-click {
  flex-basis: 220px;
  height: 220px;
  max-height: 220px;
}

.ad-card[data-placement="fullscreen"] .end-card img {
  max-height: 220px;
  border-radius: 12px;
}

.ad-card[data-placement="fullscreen"] .end-card h3 {
  font-size: clamp(19px, 2.5vw, 26px);
}

.ad-card[data-placement="fullscreen"] .end-card p {
  font-size: 14px;
}

.ad-card[data-placement="fullscreen"] .visit-button {
  min-height: 44px;
  font-size: 15px;
}

/* Fullscreen compact state */

.ad-card[data-placement="fullscreen"] .end-card.compact {
  padding-top: 52px;
  padding-bottom: 2px;
}

.ad-card[data-placement="fullscreen"] .end-card.compact .picture-click {
  flex-basis: 120px;
  height: 120px;
  max-height: 120px;
}

.ad-card[data-placement="fullscreen"] .end-card.compact img {
  max-height: 120px;
}

.ad-card[data-placement="fullscreen"] .end-card.compact .visit-button {
  top: 2px;
  right: 48px;
  min-height: 44px;
}

/* =====================================
   SMALL SCREENS
===================================== */

@media (max-width: 380px) {

  .ad-card {
    padding: 6px;
    gap: 5px;
  }

  .ad-header {
    gap: 5px;
  }

  .ad-label {
    font-size: 12px;
  }

  .ad-header-right {
    gap: 5px;
  }

  .sponsored {
    display: none;
  }

  .end-card {
    gap: 5px;
  }

  .end-card h3 {
    font-size: 14px;
  }

  .end-card p {
    font-size: 11px;
  }

  .end-card.compact .picture-click {
    flex-basis: 72px;
    height: 72px;
    max-height: 72px;
  }

  .end-card.compact img {
    max-height: 72px;
  }

  .visit-button {
    min-height: 39px;
    padding: 9px;
  }

}

/* =====================================
   SHORT AD CONTAINERS
===================================== */

@media (max-height: 500px) {

  .ad-card {
    gap: 4px;
  }

  .ad-header {
    min-height: 22px;
  }

  .end-card {
    gap: 4px;
  }

  .picture-click {
    flex-basis: 115px;
    height: 115px;
    max-height: 115px;
  }

  .end-card img {
    max-height: 115px;
  }

  .end-card h3 {
    font-size: 13px;
  }

  .end-card p {
    font-size: 11px;
  }

  .end-card.compact {
    padding-top: 43px;
  }

  .end-card.compact .picture-click {
    flex-basis: 65px;
    height: 65px;
    max-height: 65px;
  }

  .end-card.compact img {
    max-height: 65px;
  }

  .visit-button {
    min-height: 36px;
    padding: 7px 12px;
  }

  .ad-card[data-placement="fullscreen"] {
    padding: 7px;
    gap: 6px;
  }

  .ad-card[data-placement="fullscreen"] .ad-header {
    min-height: 24px;
  }

  .ad-card[data-placement="fullscreen"] .end-card {
    gap: 5px;
    padding-bottom: 43px;
  }

  .ad-card[data-placement="fullscreen"] .picture-click {
    flex-basis: 110px;
    height: 110px;
    max-height: 110px;
  }

  .ad-card[data-placement="fullscreen"] .end-card img {
    max-height: 110px;
  }

  .ad-card[data-placement="fullscreen"] .end-card.compact {
    padding-top: 43px;
    padding-bottom: 2px;
  }

  .ad-card[data-placement="fullscreen"] .end-card.compact .picture-click {
    flex-basis: 65px;
    height: 65px;
    max-height: 65px;
  }

  .ad-card[data-placement="fullscreen"] .end-card.compact img {
    max-height: 65px;
  }

  .ad-card[data-placement="fullscreen"] .end-card h3 {
    font-size: 17px;
  }

  .ad-card[data-placement="fullscreen"] .end-card p {
    font-size: 11px;
  }

  .ad-card[data-placement="fullscreen"] .visit-button {
    min-height: 38px;
    padding: 8px 15px;
  }

}

/* =====================================
   FULLSCREEN MOBILE
===================================== */

@media (max-width: 600px) {

  .ad-card[data-placement="fullscreen"] {
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }

  .ad-card[data-placement="fullscreen"] .end-card {
    gap: 9px;
  }

  .ad-card[data-placement="fullscreen"] .picture-click {
    flex-basis: 165px;
    height: 165px;
    max-height: 165px;
  }

  .ad-card[data-placement="fullscreen"] .end-card img {
    max-height: 165px;
  }

  .ad-card[data-placement="fullscreen"] .end-card.compact .picture-click {
    flex-basis: 95px;
    height: 95px;
    max-height: 95px;
  }

  .ad-card[data-placement="fullscreen"] .end-card.compact img {
    max-height: 95px;
  }

  .ad-card[data-placement="fullscreen"] .visit-button {
    width: auto;
  }

}

/* =====================================
   REDUCED MOTION
===================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }

}
</style>
</head>

<body>

<div class="ad-card" id="adCard" data-placement="static">

  <!-- HEADER -->

  <div class="ad-header">

    <div class="ad-label">
      <span class="ad-badge">Ad</span>
      <span>Advertisement</span>
    </div>

    <div class="ad-header-right">
      <span class="ad-timer" id="adTimer">00:00</span>
      <span class="sponsored">Sponsored</span>
    </div>

  </div>

  <!-- AD CONTENT -->

  <div class="ad-stage">

    <!-- VIDEO -->

    <div class="video-frame" id="videoWrap" hidden>

      <a
        id="videoClick"
        class="video-click"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit advertiser"
      >

        <video
          id="adVideo"
          class="ad-video"
          playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload noplaybackrate"
        ></video>

      </a>

      <button
        id="soundButton"
        class="sound-button"
        type="button"
        aria-label="Toggle advertisement sound"
        hidden
      >
        Enable sound
      </button>

    </div>

    <!-- END CARD -->

    <div class="end-card" id="endCard" hidden>

      <button
        class="close-ad-button"
        id="closeAdButton"
        type="button"
        aria-label="Close advertisement"
        hidden
      >
        &times;
      </button>

      <a
        id="pictureClick"
        class="picture-click"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit advertiser"
      >

        <img
          id="adPicture"
          class="end-card-picture"
          alt="Advertised product"
        >

      </a>

      <h3 id="advertiserTitle">Visit Advertiser</h3>

      <p>Learn more about this offer.</p>

      <a
        id="visitButton"
        class="visit-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Now
      </a>

    </div>

    <!-- STATUS -->

    <div class="message" id="statusMessage">
      Connecting to advertising network...
    </div>

  </div>

</div>

<script>
(function () {

  "use strict";

  // =====================================
  // CONFIGURATION
  // =====================================

  const VALID_PLACEMENTS = [
    "bottom",
    "top",
    "static",
    "fullscreen"
  ];

  // Time the original end card remains visible
  // before the compact transition starts.

  const END_CARD_TRANSITION_DELAY = 850;


  // =====================================
  // STATE
  // =====================================

  let initialized = false;

  let parentOrigin = null;

  let placement = "static";

  let imageReady = false;
  let imageFailed = false;

  let waitingForImage = false;

  let adClosed = false;
  let errorReported = false;

  let endCardTransitionTimer = null;


  // =====================================
  // ELEMENTS
  // =====================================

  const adCard =
    document.getElementById("adCard");

  const adTimer =
    document.getElementById("adTimer");

  const statusMessage =
    document.getElementById("statusMessage");

  const video =
    document.getElementById("adVideo");

  const videoWrap =
    document.getElementById("videoWrap");

  const videoClick =
    document.getElementById("videoClick");

  const soundButton =
    document.getElementById("soundButton");

  const endCard =
    document.getElementById("endCard");

  const adPicture =
    document.getElementById("adPicture");

  const pictureClick =
    document.getElementById("pictureClick");

  const visitButton =
    document.getElementById("visitButton");

  const advertiserTitle =
    document.getElementById("advertiserTitle");

  const closeAdButton =
    document.getElementById("closeAdButton");


  // =====================================
  // END CARD TRANSITION TIMER
  // =====================================

  function clearEndCardTransition() {

    if (endCardTransitionTimer !== null) {

      clearTimeout(endCardTransitionTimer);

      endCardTransitionTimer = null;

    }

  }


  function startEndCardTransition() {

    clearEndCardTransition();

    // Always begin with the original large-picture layout.

    endCard.classList.remove("compact");

    // Allow the initial layout to render first.

    requestAnimationFrame(function () {

      requestAnimationFrame(function () {

        endCardTransitionTimer = setTimeout(function () {

          if (
            adClosed ||
            endCard.hidden
          ) {
            return;
          }

          // This activates the CSS transitions:
          // 1. Visit Now moves to the top.
          // 2. The advertiser picture becomes smaller.

          endCard.classList.add("compact");

          endCardTransitionTimer = null;

        }, END_CARD_TRANSITION_DELAY);

      });

    });

  }


  // =====================================
  // PARENT ORIGIN VALIDATION
  // =====================================

  function isAllowedParentOrigin(origin) {

    if (
      typeof origin !== "string" ||
      origin === "null"
    ) {
      return false;
    }

    try {

      const parsed = new URL(origin);

      const isHttps =
        parsed.protocol === "https:";

      const isLocalHttp =
        parsed.protocol === "http:" &&
        (
          parsed.hostname === "localhost" ||
          parsed.hostname === "127.0.0.1"
        );

      return (
        parsed.origin === origin &&
        (isHttps || isLocalHttp)
      );

    } catch {

      return false;

    }

  }


  // =====================================
  // SEND STATUS TO SDK
  // =====================================

  function sendStatus(status, message) {

    if (!parentOrigin) return;

    window.parent.postMessage(
      {
        type: "AD_NETWORK_STATUS",
        status,
        message,
        placement
      },
      parentOrigin
    );

  }


  // =====================================
  // URL VALIDATION
  // =====================================

  function safeHttpsUrl(value) {

    if (
      typeof value !== "string" ||
      !value.trim()
    ) {
      return null;
    }

    try {

      const url = new URL(value);

      if (
        url.protocol !== "https:" ||
        !url.hostname ||
        url.username ||
        url.password
      ) {
        return null;
      }

      return url.href;

    } catch {

      return null;

    }

  }


  // =====================================
  // TIMER
  // =====================================

  function formatElapsedTime(seconds) {

    const total =
      Math.max(0, Math.floor(seconds));

    const hours =
      Math.floor(total / 3600);

    const minutes =
      Math.floor((total % 3600) / 60);

    const remainingSeconds =
      total % 60;

    if (hours > 0) {

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0")
      );

    }

    return (
      String(minutes).padStart(2, "0") + ":" +
      String(remainingSeconds).padStart(2, "0")
    );

  }


  function updateAdTimer() {

    adTimer.textContent =
      formatElapsedTime(video.currentTime || 0);

  }


  video.addEventListener(
    "timeupdate",
    updateAdTimer
  );


  // =====================================
  // ERROR HANDLING
  // =====================================

  function showError(message) {

    if (adClosed) return;

    clearEndCardTransition();

    waitingForImage = false;

    video.pause();

    videoWrap.hidden = true;
    endCard.hidden = true;

    endCard.classList.remove("compact");

    soundButton.hidden = true;
    closeAdButton.hidden = true;

    statusMessage.hidden = false;
    statusMessage.textContent = message;

    if (!errorReported) {

      errorReported = true;

      sendStatus("error", message);

    }

  }


  // =====================================
  // VIDEO PLAYBACK
  // =====================================

  async function startPlayback() {

    if (adClosed) return;

    video.muted = false;
    video.volume = 1;

    try {

      await video.play();

      soundButton.textContent = "Mute";
      soundButton.hidden = false;

      statusMessage.hidden = true;

    } catch (firstError) {

      console.warn(
        "Audible autoplay was blocked:",
        firstError.message
      );

      video.muted = true;

      try {

        await video.play();

        soundButton.textContent = "Enable sound";
        soundButton.hidden = false;

        statusMessage.hidden = true;

      } catch (secondError) {

        console.warn(
          "Muted autoplay was blocked:",
          secondError.message
        );

        soundButton.textContent = "Tap to play";
        soundButton.hidden = false;

        statusMessage.hidden = false;

        statusMessage.textContent =
          "Tap the button to start this advertisement.";

      }

    }

  }


  // =====================================
  // SOUND AND PLAY BUTTON
  // =====================================

  soundButton.addEventListener(
    "click",
    async function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (adClosed) return;

      // Start playback if it has not started.

      if (video.paused) {

        video.muted = true;

        try {

          await video.play();

          soundButton.textContent = "Enable sound";
          statusMessage.hidden = true;

        } catch (error) {

          statusMessage.hidden = false;

          statusMessage.textContent =
            "The video could not be started. Please try again.";

          console.warn(
            "Video playback could not start:",
            error.message
          );

        }

        return;

      }

      // Enable sound.

      if (video.muted) {

        video.muted = false;
        video.volume = 1;

        soundButton.textContent = "Mute";

      }

      // Mute sound.

      else {

        video.muted = true;

        soundButton.textContent = "Enable sound";

      }

    }
  );


  // =====================================
  // CLOSE ADVERTISEMENT
  // =====================================

  closeAdButton.addEventListener(
    "click",
    function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (adClosed) return;

      adClosed = true;

      clearEndCardTransition();

      video.pause();

      video.removeAttribute("src");
      video.load();

      adCard.hidden = true;

      sendStatus(
        "closed",
        "Advertisement closed by viewer."
      );

    }
  );


  // =====================================
  // GET ADVERTISER NAME
  // =====================================

  async function getAdvertiserName(
    token_id,
    subid,
    ad_id
  ) {

    const response = await fetch(
      "/api/get-ad-name",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          token_id,
          subid,
          ad_id
        }),

        cache: "no-store",
        credentials: "same-origin"
      }
    );

    const data =
      await response.json().catch(() => ({}));

    if (
      !response.ok ||
      data.success !== true ||
      data.authorized !== true ||
      typeof data.app_name !== "string" ||
      !data.app_name.trim()
    ) {

      throw new Error(
        data.message ||
        "Could not retrieve advertiser name."
      );

    }

    return data.app_name.trim();

  }


  // =====================================
  // DISPLAY END CARD
  // =====================================

  function displayEndCard() {

    if (adClosed) return;

    if (
      !imageReady &&
      !(
        adPicture.complete &&
        adPicture.naturalWidth > 0
      )
    ) {
      return;
    }

    waitingForImage = false;

    videoWrap.hidden = true;
    soundButton.hidden = true;

    // Display the original large-picture version first.

    endCard.classList.remove("compact");

    endCard.hidden = false;

    closeAdButton.hidden = false;

    statusMessage.hidden = true;

    // Then smoothly move the button and shrink the picture.

    startEndCardTransition();

  }


  // =====================================
  // IMAGE EVENTS
  // =====================================

  adPicture.addEventListener(
    "load",
    function () {

      imageReady = true;
      imageFailed = false;

      if (waitingForImage) {

        displayEndCard();

      }

    }
  );


  adPicture.addEventListener(
    "error",
    function () {

      imageReady = false;
      imageFailed = true;

      if (waitingForImage) {

        showError(
          "The advertisement image could not be loaded."
        );

      }

    }
  );


  // =====================================
  // VERIFY AND LOAD ADVERTISEMENT
  // =====================================

  async function verifyAndLoad(token_id, subid) {

    try {

      clearEndCardTransition();

      adClosed = false;

      errorReported = false;

      imageReady = false;
      imageFailed = false;

      waitingForImage = false;

      endCard.classList.remove("compact");

      adCard.hidden = false;

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Verifying advertising session...";


      // STEP 1: VERIFY SESSION

      const verifyResponse = await fetch(
        "/api/verify-token",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );


      const verification =
        await verifyResponse.json().catch(() => ({}));


      if (
        !verifyResponse.ok ||
        verification.authorized !== true ||
        verification.success === false
      ) {

        throw new Error(
          verification.message ||
          "Advertising session verification failed."
        );

      }


      // STEP 2: GET ADVERTISEMENT

      statusMessage.textContent =
        "Finding an advertisement...";


      const adResponse = await fetch(
        "/api/get-ad",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );


      const result =
        await adResponse.json().catch(() => ({}));


      if (
        !adResponse.ok ||
        result.success !== true ||
        result.authorized !== true
      ) {

        throw new Error(
          result.message ||
          "Could not retrieve advertisement."
        );

      }


      // STEP 3: HANDLE NO ADVERTISEMENT

      if (!result.ad) {

        statusMessage.hidden = false;

        statusMessage.textContent =
          "No advertisements are currently available.";

        sendStatus(
          "no_ad",
          "No advertisements are currently available."
        );

        return;

      }


      const ad = result.ad;


      // STEP 4: GET ADVERTISEMENT ID

      const ad_id =
        typeof ad.id === "string"
          ? ad.id.trim()
          : "";


      if (!ad_id) {

        throw new Error(
          "Advertisement ID was not returned by the server."
        );

      }


      // STEP 5: GET ADVERTISER NAME

      statusMessage.textContent =
        "Verifying advertiser information...";


      const appName = await getAdvertiserName(
        token_id,
        subid,
        ad_id
      );


      advertiserTitle.textContent =
        "Visit " + appName;


      // STEP 6: VALIDATE ADVERTISEMENT URLS

      const videoUrl =
        safeHttpsUrl(ad.ad_url);

      const imageUrl =
        safeHttpsUrl(ad.app_pic_url);

      const appLink =
        safeHttpsUrl(ad.app_link);


      if (
        !videoUrl ||
        !imageUrl ||
        !appLink
      ) {

        throw new Error(
          "The advertisement contains an invalid URL."
        );

      }


      // STEP 7: SET ADVERTISER DESTINATIONS

      videoClick.href = appLink;
      pictureClick.href = appLink;
      visitButton.href = appLink;


      // STEP 8: RESET AND LOAD IMAGE

      adPicture.removeAttribute("src");

      imageReady = false;
      imageFailed = false;

      adPicture.src = imageUrl;


      // STEP 9: PREPARE VIDEO DISPLAY

      videoWrap.hidden = false;

      endCard.hidden = true;

      endCard.classList.remove("compact");

      soundButton.hidden = true;
      closeAdButton.hidden = true;

      adTimer.textContent = "00:00";

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Loading advertisement...";


      video.pause();

      video.removeAttribute("src");

      video.load();

      video.muted = false;
      video.volume = 1;


      let reportedLoaded = false;


      // STEP 10: VIDEO READY

      video.addEventListener(
        "canplay",
        function () {

          if (reportedLoaded || adClosed) return;

          reportedLoaded = true;

          statusMessage.hidden = true;

          // Make the sound control visible immediately.

          soundButton.hidden = false;
          soundButton.textContent = "Enable sound";

          sendStatus(
            "loaded",
            "Advertisement loaded successfully."
          );

          startPlayback();

        },
        { once: true }
      );


      // STEP 11: VIDEO ENDED

      video.addEventListener(
        "ended",
        function () {

          if (adClosed) return;

          updateAdTimer();


          // Image is already loaded.

          if (
            imageReady ||
            (
              adPicture.complete &&
              adPicture.naturalWidth > 0
            )
          ) {

            imageReady = true;

            displayEndCard();

            return;

          }


          // Image has failed.

          if (
            imageFailed ||
            adPicture.complete
          ) {

            showError(
              "The advertisement image could not be loaded."
            );

            return;

          }


          // Wait for image loading.

          waitingForImage = true;

          statusMessage.hidden = false;

          statusMessage.textContent =
            "Preparing advertiser information...";

        },
        { once: true }
      );


      // STEP 12: VIDEO ERROR

      video.addEventListener(
        "error",
        function () {

          showError(
            "The advertisement video could not be loaded or played."
          );

        },
        { once: true }
      );


      // STEP 13: START LOADING VIDEO

      video.src = videoUrl;

      video.load();


    } catch (error) {

      console.error(
        "AD GUI ERROR:",
        error.message
      );

      showError(
        error.message ||
        "An advertising error occurred."
      );

    }

  }


  // =====================================
  // RECEIVE SDK INITIALIZATION
  // =====================================

  window.addEventListener(
    "message",
    function (event) {

      // Only accept messages from the parent window.

      if (event.source !== window.parent) return;

      if (!isAllowedParentOrigin(event.origin)) return;

      if (
        parentOrigin &&
        event.origin !== parentOrigin
      ) {
        return;
      }

      const data = event.data;

      if (
        !data ||
        typeof data !== "object" ||
        data.type !== "AD_NETWORK_INIT"
      ) {
        return;
      }

      if (initialized) return;

      parentOrigin = event.origin;

      initialized = true;


      // STEP 1: READ PLACEMENT

      placement =
        typeof data.placement === "string" &&
        VALID_PLACEMENTS.includes(data.placement)
          ? data.placement
          : "static";

      adCard.dataset.placement = placement;


      // STEP 2: READ CREDENTIALS

      const token_id =
        typeof data.token_id === "string"
          ? data.token_id.trim()
          : "";

      const subid =
        typeof data.subid === "string"
          ? data.subid.trim()
          : "";


      // STEP 3: VALIDATE CREDENTIALS

      if (
        !/^[a-f0-9]{64}$/i.test(token_id) ||
        !/^[A-F0-9]{8}$/.test(subid)
      ) {

        showError(
          "Invalid advertising credentials."
        );

        return;

      }


      // STEP 4: VERIFY AND LOAD

      verifyAndLoad(token_id, subid);

    }
  );


  // =====================================
  // TELL SDK THAT GUI IS READY
  // =====================================

  window.parent.postMessage(
    {
      type: "AD_NETWORK_READY"
    },
    "*"
  );

})();
</script>
