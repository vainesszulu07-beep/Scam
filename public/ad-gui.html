
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertisement</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 8px;
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #202124;
}

.ad-card {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 12px;
  background: #fff;
  border: 1px solid #dadce0;
  border-radius: 10px;
}

.ad-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  min-height: 24px;
}

.ad-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: #3c4043;
}

.ad-badge {
  display: inline-block;
  padding: 3px 6px;
  border: 1px solid #dadce0;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: #5f6368;
}

.ad-header-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.ad-timer {
  padding: 4px 7px;
  border: 1px solid #dadce0;
  border-radius: 5px;
  color: #5f6368;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sponsored {
  font-size: 11px;
  color: #5f6368;
}

.video-frame {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 8px;
  background: #111;
}

.video-click {
  display: block;
  width: 100%;
  cursor: pointer;
}

video {
  display: block;
  width: 100%;
  height: auto;
  max-height: 230px;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #111;
}

.sound-button {
  position: absolute;
  top: 9px;
  right: 9px;
  z-index: 2;
  padding: 7px 10px;
  border: 0;
  border-radius: 20px;
  background: rgba(32, 33, 36, 0.85);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.end-card {
  position: relative;
  text-align: left;
}

.picture-click {
  display: block;
  width: 100%;
  text-decoration: none;
}

.end-card img {
  display: block;
  width: 100%;
  height: 165px;
  object-fit: contain;
  object-position: center;
  background: #f8f9fa;
  border-radius: 8px;
}

.close-ad-button {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 5;
  width: 31px;
  height: 31px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(32, 33, 36, 0.85);
  color: white;
  font-size: 23px;
  line-height: 30px;
  cursor: pointer;
}

.end-card h3 {
  margin: 12px 0 5px;
  font-size: 16px;
  font-weight: 600;
  color: #202124;
}

.end-card p {
  margin: 0 0 12px;
  font-size: 13px;
  line-height: 1.5;
  color: #5f6368;
}

.visit-button {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  background: #1a73e8;
  color: #fff;
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.visit-button:hover {
  background: #1765cc;
}

.message {
  padding: 18px 8px;
  text-align: center;
  font-size: 12px;
  color: #5f6368;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<div class="ad-card" id="adCard">

  <div class="ad-header">

    <div class="ad-label">
      <span class="ad-badge">Ad</span>
      <span>Advertisement</span>
    </div>

    <div class="ad-header-right">
      <span class="ad-timer" id="adTimer">00:00</span>
      <span class="sponsored">Sponsored</span>
    </div>

  </div>


  <!-- VIDEO -->

  <div class="video-frame" id="videoWrap" hidden>

    <a
      id="videoClick"
      class="video-click"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit advertiser"
    >

      <video
        id="adVideo"
        playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate"
      ></video>

    </a>

    <button
      id="soundButton"
      class="sound-button"
      type="button"
      hidden
    >
      Enable sound
    </button>

  </div>


  <!-- END CARD -->

  <div class="end-card" id="endCard" hidden>

    <button
      class="close-ad-button"
      id="closeAdButton"
      type="button"
      aria-label="Close advertisement"
      hidden
    >
      &times;
    </button>

    <a
      id="pictureClick"
      class="picture-click"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit advertiser"
    >

      <img
        id="adPicture"
        alt="Advertised product"
      >

    </a>

    <h3 id="advertiserTitle">Visit Advertiser</h3>

    <p>Learn more about this offer.</p>

    <a
      id="visitButton"
      class="visit-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      Visit Now
    </a>

  </div>


  <div class="message" id="statusMessage">
    Connecting to advertising network...
  </div>

</div>


<script>
(function () {

  "use strict";

  let initialized = false;
  let parentOrigin = null;

  let imageReady = false;
  let imageFailed = false;

  let adClosed = false;


  const adCard =
    document.getElementById("adCard");

  const adTimer =
    document.getElementById("adTimer");

  const statusMessage =
    document.getElementById("statusMessage");

  const video =
    document.getElementById("adVideo");

  const videoWrap =
    document.getElementById("videoWrap");

  const videoClick =
    document.getElementById("videoClick");

  const soundButton =
    document.getElementById("soundButton");

  const endCard =
    document.getElementById("endCard");

  const adPicture =
    document.getElementById("adPicture");

  const pictureClick =
    document.getElementById("pictureClick");

  const visitButton =
    document.getElementById("visitButton");

  const advertiserTitle =
    document.getElementById("advertiserTitle");

  const closeAdButton =
    document.getElementById("closeAdButton");


  // =====================================
  // PARENT ORIGIN VALIDATION
  // =====================================

  function isAllowedParentOrigin(origin) {

    if (
      typeof origin !== "string" ||
      origin === "null"
    ) {
      return false;
    }

    try {

      const parsed = new URL(origin);

      const isHttps =
        parsed.protocol === "https:";

      const isLocalHttp =
        parsed.protocol === "http:" &&
        (
          parsed.hostname === "localhost" ||
          parsed.hostname === "127.0.0.1"
        );

      return (
        parsed.origin === origin &&
        (isHttps || isLocalHttp)
      );

    } catch {

      return false;

    }
  }


  // =====================================
  // SEND STATUS TO SDK
  // =====================================

  function sendStatus(status, message) {

    if (!parentOrigin) return;

    window.parent.postMessage(
      {
        type: "AD_NETWORK_STATUS",
        status,
        message
      },
      parentOrigin
    );

  }


  // =====================================
  // URL VALIDATION
  // =====================================

  function safeHttpsUrl(value) {

    if (
      typeof value !== "string" ||
      !value.trim()
    ) {
      return null;
    }

    try {

      const url = new URL(value);

      if (
        url.protocol !== "https:" ||
        !url.hostname ||
        url.username ||
        url.password
      ) {
        return null;
      }

      return url.href;

    } catch {

      return null;

    }
  }


  // =====================================
  // TIMER
  // =====================================

  function formatElapsedTime(seconds) {

    const total =
      Math.max(0, Math.floor(seconds));

    const hours =
      Math.floor(total / 3600);

    const minutes =
      Math.floor((total % 3600) / 60);

    const remainingSeconds =
      total % 60;

    if (hours > 0) {

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0")
      );

    }

    return (
      String(minutes).padStart(2, "0") + ":" +
      String(remainingSeconds).padStart(2, "0")
    );

  }


  function updateAdTimer() {

    adTimer.textContent =
      formatElapsedTime(video.currentTime || 0);

  }


  video.addEventListener(
    "timeupdate",
    updateAdTimer
  );


  // =====================================
  // ERROR HANDLING
  // =====================================

  function showError(message) {

    if (adClosed) return;

    video.pause();

    videoWrap.hidden = true;
    endCard.hidden = true;
    soundButton.hidden = true;
    closeAdButton.hidden = true;

    statusMessage.hidden = false;
    statusMessage.textContent = message;

    sendStatus("error", message);

  }


  // =====================================
  // VIDEO PLAYBACK
  // =====================================

  async function startPlayback() {

    if (adClosed) return;

    video.muted = false;
    video.volume = 1;

    try {

      await video.play();

      soundButton.textContent = "Mute";
      soundButton.hidden = false;

    } catch (firstError) {

      console.warn(
        "Audible autoplay was blocked:",
        firstError.message
      );

      video.muted = true;

      try {

        await video.play();

        soundButton.textContent = "Enable sound";
        soundButton.hidden = false;

      } catch (secondError) {

        console.error(
          "Video playback failed:",
          secondError.message
        );

        statusMessage.hidden = false;

        statusMessage.textContent =
          "Video playback is unavailable in this browser.";

      }

    }

  }


  // =====================================
  // SOUND BUTTON
  // =====================================

  soundButton.addEventListener(
    "click",
    async function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (video.muted) {

        video.muted = false;
        video.volume = 1;

        try {

          await video.play();

          soundButton.textContent = "Mute";

        } catch (error) {

          video.muted = true;

          soundButton.textContent = "Enable sound";

          console.warn(
            "Could not enable sound:",
            error.message
          );

        }

      } else {

        video.muted = true;

        soundButton.textContent = "Enable sound";

      }

    }
  );


  // =====================================
  // CLOSE AD BUTTON
  // =====================================

  closeAdButton.addEventListener(
    "click",
    function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (adClosed) return;

      adClosed = true;

      video.pause();

      video.removeAttribute("src");
      video.load();

      adCard.hidden = true;

      sendStatus(
        "closed",
        "Advertisement closed by viewer."
      );

    }
  );


  // =====================================
  // LOAD ADVERTISER NAME
  // =====================================

  async function getAdvertiserName(
    token_id,
    subid,
    ad_id
  ) {

    const response = await fetch(
      "/api/get-ad-name",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          token_id,
          subid,
          ad_id
        }),

        cache: "no-store",
        credentials: "same-origin"
      }
    );

    const data =
      await response.json().catch(() => ({}));

    if (
      !response.ok ||
      data.success !== true ||
      data.authorized !== true ||
      typeof data.app_name !== "string" ||
      !data.app_name.trim()
    ) {

      throw new Error(
        data.message ||
        "Could not retrieve advertiser name."
      );

    }

    return data.app_name.trim();

  }


  // =====================================
  // DISPLAY END CARD
  // =====================================

  function displayEndCard() {

    if (adClosed) return;

    videoWrap.hidden = true;
    soundButton.hidden = true;

    endCard.hidden = false;

    // X appears only after the image has loaded.
    closeAdButton.hidden = false;

    statusMessage.hidden = true;

  }


  // =====================================
  // LOAD IMAGE
  // =====================================

  adPicture.addEventListener(
    "load",
    function () {

      imageReady = true;

    }
  );

  adPicture.addEventListener(
    "error",
    function () {

      imageFailed = true;

    }
  );


  // =====================================
  // VERIFY AND LOAD ADVERTISEMENT
  // =====================================

  async function verifyAndLoad(token_id, subid) {

    try {

      adClosed = false;

      imageReady = false;
      imageFailed = false;

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Verifying advertising session...";


      // STEP 1: Verify session.

      const verifyResponse = await fetch(
        "/api/verify-token",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );


      const verification =
        await verifyResponse.json().catch(() => ({}));


      if (
        !verifyResponse.ok ||
        verification.authorized !== true ||
        verification.success === false
      ) {

        throw new Error(
          verification.message ||
          "Advertising session verification failed."
        );

      }


      // STEP 2: Retrieve advertisement.

      statusMessage.textContent =
        "Finding an advertisement...";


      const adResponse = await fetch(
        "/api/get-ad",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );


      const result =
        await adResponse.json().catch(() => ({}));


      if (
        !adResponse.ok ||
        result.success !== true ||
        result.authorized !== true
      ) {

        throw new Error(
          result.message ||
          "Could not retrieve advertisement."
        );

      }


      // STEP 3: Handle no advertisement.

      if (!result.ad) {

        statusMessage.hidden = false;

        statusMessage.textContent =
          "No advertisements are currently available.";

        sendStatus(
          "no_ad",
          "No advertisements are currently available."
        );

        return;

      }


      const ad = result.ad;


      // STEP 4: Obtain advertisement ID.

      const ad_id =
        typeof ad.id === "string"
          ? ad.id.trim()
          : "";


      if (!ad_id) {

        throw new Error(
          "Advertisement ID was not returned by the server."
        );

      }


      // STEP 5: Request advertiser name.

      statusMessage.textContent =
        "Verifying advertiser information...";


      const appName = await getAdvertiserName(
        token_id,
        subid,
        ad_id
      );


      // Display the name returned by the backend.

      advertiserTitle.textContent =
        "Visit " + appName;


      // STEP 6: Validate advertisement URLs.

      const videoUrl =
        safeHttpsUrl(ad.ad_url);

      const imageUrl =
        safeHttpsUrl(ad.app_pic_url);

      const appLink =
        safeHttpsUrl(ad.app_link);


      if (
        !videoUrl ||
        !imageUrl ||
        !appLink
      ) {

        throw new Error(
          "The advertisement contains an invalid URL."
        );

      }


      // STEP 7: Set advertiser destinations.

      videoClick.href = appLink;
      pictureClick.href = appLink;
      visitButton.href = appLink;


      // STEP 8: Prepare end-card image.

      adPicture.src = imageUrl;


      // STEP 9: Prepare video.

      videoWrap.hidden = false;

      endCard.hidden = true;

      soundButton.hidden = true;

      closeAdButton.hidden = true;

      adTimer.textContent = "00:00";

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Loading advertisement...";


      video.pause();

      video.removeAttribute("src");

      video.load();

      video.muted = false;

      video.volume = 1;


      let reportedLoaded = false;


      // STEP 10: Video ready.

      video.addEventListener(
        "canplay",
        function () {

          if (reportedLoaded || adClosed) return;

          reportedLoaded = true;

          statusMessage.hidden = true;

          sendStatus(
            "loaded",
            "Advertisement loaded successfully."
          );

          startPlayback();

        },
        { once: true }
      );


      // STEP 11: Show end card after video ends.

      video.addEventListener(
        "ended",
        function () {

          if (adClosed) return;

          updateAdTimer();

          // The end card must wait for the image.

          if (
            imageReady ||
            (
              adPicture.complete &&
              adPicture.naturalWidth > 0
            )
          ) {

            displayEndCard();

          } else if (imageFailed || adPicture.complete) {

            showError(
              "The advertisement image could not be loaded."
            );

          } else {

            adPicture.addEventListener(
              "load",
              displayEndCard,
              { once: true }
            );

            adPicture.addEventListener(
              "error",
              function () {

                showError(
                  "The advertisement image could not be loaded."
                );

              },
              { once: true }
            );

          }

        },
        { once: true }
      );


      // STEP 12: Handle video errors.

      video.addEventListener(
        "error",
        function () {

          showError(
            "The advertisement video could not be loaded or played."
          );

        },
        { once: true }
      );


      video.src = videoUrl;

      video.load();


    } catch (error) {

      console.error(
        "AD GUI ERROR:",
        error.message
      );

      showError(
        error.message ||
        "An advertising error occurred."
      );

    }

  }


  // =====================================
  // RECEIVE SDK INITIALIZATION
  // =====================================

  window.addEventListener(
    "message",
    function (event) {

      if (event.source !== window.parent) return;

      if (!isAllowedParentOrigin(event.origin)) return;

      if (
        parentOrigin &&
        event.origin !== parentOrigin
      ) {
        return;
      }

      const data = event.data;

      if (
        !data ||
        typeof data !== "object" ||
        data.type !== "AD_NETWORK_INIT"
      ) {
        return;
      }

      if (initialized) return;

      parentOrigin = event.origin;

      initialized = true;


      const token_id =
        typeof data.token_id === "string"
          ? data.token_id.trim()
          : "";

      const subid =
        typeof data.subid === "string"
          ? data.subid.trim()
          : "";


      if (
        !/^[a-f0-9]{64}$/i.test(token_id) ||
        !/^[A-F0-9]{8}$/.test(subid)
      ) {

        showError(
          "Invalid advertising credentials."
        );

        return;

      }


      verifyAndLoad(token_id, subid);

    }
  );


  // Tell SDK that GUI is ready.

  window.parent.postMessage(
    {
      type: "AD_NETWORK_READY"
    },
    "*"
  );

})();
</script>

</body>
</html>
