<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertising Platform</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 10px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #202124;
}
.ad-card {
  width: 100%;
  max-width: 500px;
  margin: auto;
  padding: 12px;
  background: #fff;
  border: 1px solid #e3e5e8;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.ad-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.ad-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: bold;
}
.ad-logo {
  width: 30px;
  height: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: #1769ff;
  color: white;
  font-weight: bold;
}
.sponsored {
  color: #777;
  font-size: 11px;
  border: 1px solid #ddd;
  padding: 4px 7px;
  border-radius: 4px;
}
.video-wrap {
  width: 100%;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
}
video {
  display: block;
  width: 100%;
  max-height: 230px;
  aspect-ratio: 16 / 9;
  object-fit: contain;
}
.end-card { text-align: center; }
.end-card img {
  display: block;
  width: 100%;
  max-height: 175px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 12px;
}
.end-card h3 { margin: 8px 0; font-size: 17px; }
.end-card p { margin: 5px 0 12px; font-size: 13px; color: #777; }
.visit-button {
  display: block;
  width: 100%;
  padding: 13px;
  background: #1769ff;
  color: white;
  border-radius: 7px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}
.visit-button:hover { background: #1254cc; }
.message {
  padding: 20px 10px;
  text-align: center;
  font-size: 13px;
  color: #777;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="ad-card">
  <div class="ad-header">
    <div class="ad-brand">
      <div class="ad-logo">A</div>
      <span>Advertisement</span>
    </div>
    <span class="sponsored">Sponsored</span>
  </div>

  <div class="video-wrap" id="videoWrap" hidden>
    <video id="adVideo" controls muted playsinline preload="auto"></video>
  </div>

  <div class="end-card" id="endCard" hidden>
    <img id="adPicture" alt="Advertised product">
    <h3>Discover More</h3>
    <p>Learn more about this offer.</p>
    <a id="visitButton" class="visit-button" href="#" target="_blank" rel="noopener noreferrer">Visit Now</a>
  </div>

  <div class="message" id="statusMessage">Connecting to advertising network...</div>
</div>

<script>
(function () {
  "use strict";

  let initialized = false;
  let parentOrigin = null;

  const statusMessage = document.getElementById("statusMessage");
  const video = document.getElementById("adVideo");
  const videoWrap = document.getElementById("videoWrap");
  const endCard = document.getElementById("endCard");
  const adPicture = document.getElementById("adPicture");
  const visitButton = document.getElementById("visitButton");

  function isAllowedParentOrigin(origin) {
    if (typeof origin !== "string" || origin === "null") return false;

    try {
      const parsed = new URL(origin);
      const isHttps = parsed.protocol === "https:";
      const isLocalHttp = parsed.protocol === "http:" &&
        (parsed.hostname === "localhost" || parsed.hostname === "127.0.0.1");
      return parsed.origin === origin && (isHttps || isLocalHttp);
    } catch {
      return false;
    }
  }

  function sendStatus(status, message) {
    if (!parentOrigin) return;

    window.parent.postMessage(
      { type: "AD_NETWORK_STATUS", status, message },
      parentOrigin
    );
  }

  function safeHttpsUrl(value) {
    if (typeof value !== "string" || !value.trim()) return null;

    try {
      const url = new URL(value);
      if (url.protocol !== "https:" || !url.hostname || url.username || url.password) {
        return null;
      }
      return url.href;
    } catch {
      return null;
    }
  }

  function showError(message) {
    video.pause();
    videoWrap.hidden = true;
    endCard.hidden = true;
    statusMessage.hidden = false;
    statusMessage.textContent = message;
    sendStatus("error", message);
  }

  async function verifyAndLoad(token_id, subid) {
    try {
      statusMessage.hidden = false;
      statusMessage.textContent = "Verifying advertising session...";

      // This request is same-origin because this page is hosted on the ad network.
      const verifyResponse = await fetch("/api/verify-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token_id, subid }),
        cache: "no-store",
        credentials: "same-origin"
      });

      const verification = await verifyResponse.json().catch(() => ({}));

      if (
        !verifyResponse.ok ||
        verification.authorized !== true ||
        verification.success === false
      ) {
        throw new Error(verification.message || "Advertising session verification failed.");
      }

      statusMessage.textContent = "Finding an advertisement...";

      // The get-ad endpoint/RPC must independently verify token_id + subid + expiry.
      const adResponse = await fetch("/api/get-ad", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token_id, subid }),
        cache: "no-store",
        credentials: "same-origin"
      });

      const result = await adResponse.json().catch(() => ({}));

      if (
        !adResponse.ok ||
        result.success !== true ||
        result.authorized !== true
      ) {
        throw new Error(result.message || "Could not retrieve advertisement.");
      }

      if (!result.ad) {
        statusMessage.hidden = false;
        statusMessage.textContent = "No advertisements are currently available.";
        sendStatus("no_ad", "No advertisements are currently available.");
        return;
      }

      const ad = result.ad;
      const videoUrl = safeHttpsUrl(ad.ad_url);
      const imageUrl = safeHttpsUrl(ad.app_pic_url);
      const appLink = safeHttpsUrl(ad.app_link);

      if (!videoUrl || !imageUrl || !appLink) {
        throw new Error("The advertisement contains an invalid URL.");
      }

      adPicture.src = imageUrl;
      visitButton.href = appLink;

      videoWrap.hidden = false;
      endCard.hidden = true;
      statusMessage.hidden = false;
      statusMessage.textContent = "Loading advertisement...";

      let reportedLoaded = false;

      video.addEventListener("canplay", function () {
        if (reportedLoaded) return;
        reportedLoaded = true;

        statusMessage.hidden = true;
        sendStatus("loaded", "Advertisement loaded successfully.");

        const playAttempt = video.play();
        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(function () {
            statusMessage.hidden = false;
            statusMessage.textContent = "Press play to watch this advertisement.";
          });
        }
      }, { once: true });

      video.addEventListener("ended", function () {
        videoWrap.hidden = true;
        endCard.hidden = false;
        statusMessage.hidden = true;
      }, { once: true });

      video.addEventListener("error", function () {
        showError("The advertisement video could not be loaded or played.");
      }, { once: true });

      video.src = videoUrl;
      video.load();

    } catch (error) {
      console.error("AD GUI ERROR:", error.message);
      showError(error.message || "An advertising error occurred.");
    }
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    if (!isAllowedParentOrigin(event.origin)) return;
    if (parentOrigin && event.origin !== parentOrigin) return;

    const data = event.data;
    if (!data || typeof data !== "object" || data.type !== "AD_NETWORK_INIT") return;
    if (initialized) return;

    parentOrigin = event.origin;
    initialized = true;

    const token_id = typeof data.token_id === "string" ? data.token_id.trim() : "";
    const subid = typeof data.subid === "string" ? data.subid.trim() : "";

    if (!/^[a-f0-9]{64}$/i.test(token_id) || !/^[A-F0-9]{8}$/.test(subid)) {
      showError("Invalid advertising credentials.");
      return;
    }

    verifyAndLoad(token_id, subid);
  });

  // This READY message contains no credentials. The SDK checks its origin and source.
  window.parent.postMessage({ type: "AD_NETWORK_READY" }, "*");
})();
</script>
</body>
</html>
