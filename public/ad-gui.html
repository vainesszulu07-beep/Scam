
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Advertisement</title>

<style>
/* =====================================
   GLOBAL
===================================== */

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0;
}

body {
  display: flex;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
  overscroll-behavior: none;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
  -webkit-font-smoothing: antialiased;
}

button,
a {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

/* =====================================
   MAIN ADVERTISEMENT CARD
===================================== */

.ad-card {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 680px;
  height: 100%;
  min-width: 0;
  min-height: 0;
  gap: 8px;
  padding: 9px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid #dadce0;
  border-radius: 12px;
}

/* =====================================
   HEADER
===================================== */

.ad-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 0 0 auto;
  min-width: 0;
  min-height: 24px;
  gap: 8px;
}

.ad-label {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
  color: #3c4043;
  font-size: 13px;
  font-weight: 600;
}

.ad-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  padding: 3px 6px;
  border: 1px solid #dadce0;
  border-radius: 4px;
  color: #5f6368;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
}

.ad-header-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex: 0 0 auto;
  gap: 8px;
}

.ad-timer {
  padding: 4px 7px;
  border: 1px solid #dadce0;
  border-radius: 5px;
  color: #5f6368;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.sponsored {
  color: #5f6368;
  font-size: 11px;
  white-space: nowrap;
}

/* =====================================
   AD CONTENT AREA
===================================== */

.ad-stage {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* =====================================
   VIDEO FRAME
===================================== */

.video-frame {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border-radius: 8px;
  background: #111111;
}

.video-click {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  cursor: pointer;
}

.ad-video {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #111111;
}

/* =====================================
   SOUND BUTTON
===================================== */

.sound-button {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 3;
  min-height: 34px;
  padding: 8px 12px;
  border: 0;
  border-radius: 20px;
  background: rgba(32, 33, 36, 0.9);
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.sound-button:active {
  transform: scale(0.97);
}

/* =====================================
   END CARD
===================================== */

.end-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows:
    minmax(0, 1fr)
    auto
    auto
    auto
    minmax(0, 0fr);
  align-items: center;
  justify-items: stretch;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  gap: 7px;
  padding: 2px;
  overflow: hidden;
  text-align: center;

  --end-image-fr: 0.62fr;
  --end-spacer-fr: 0.38fr;

  transition:
    grid-template-rows 900ms cubic-bezier(
      0.22,
      0.72,
      0.25,
      1
    );
}

/* =====================================
   END CARD IMAGE
===================================== */

.picture-click {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  text-decoration: none;
}

.end-card img {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: contain;
  object-position: center;
  border-radius: 9px;
  background: #f8f9fa;
}

/* =====================================
   ADVERTISER TITLE
===================================== */

.end-card h3 {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0 4px;
  color: #202124;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

/* =====================================
   ADVERTISER DESCRIPTION
===================================== */

.end-card p {
  width: 100%;
  margin: 0;
  padding: 0 4px;
  color: #5f6368;
  font-size: 12px;
  line-height: 1.45;
}

/* =====================================
   VISIT NOW BUTTON
===================================== */

.visit-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 420px;
  min-height: 44px;
  justify-self: center;
  padding: 11px 18px;
  border: 0;
  border-radius: 7px;
  background: #1a73e8;
  color: #ffffff;
  text-align: center;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  transform: translateY(12px);

  transition:
    transform 900ms cubic-bezier(
      0.22,
      0.72,
      0.25,
      1
    ),
    background-color 180ms ease,
    box-shadow 180ms ease;

  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.visit-button:hover {
  background: #1765cc;
  box-shadow: 0 2px 7px rgba(26, 115, 232, 0.2);
}

.visit-button:active {
  background: #1558b0;
  transform: translateY(0) scale(0.985);
}

/* =====================================
   END CARD ANIMATION
===================================== */

.end-card.is-entering {
  grid-template-rows:
    minmax(0, var(--end-image-fr))
    auto
    auto
    auto
    minmax(0, var(--end-spacer-fr));
}

.end-card.is-entering .visit-button {
  transform: translateY(0);
}

.end-card::after {
  content: "";
  min-width: 0;
  min-height: 0;
}

/* =====================================
   CLOSE BUTTON
===================================== */

.close-ad-button {
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(32, 33, 36, 0.88);
  color: #ffffff;
  font-size: 23px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.close-ad-button:hover {
  background: rgba(32, 33, 36, 1);
}

.close-ad-button:active {
  transform: scale(0.94);
}

/* =====================================
   STATUS MESSAGE
===================================== */

.message {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(255, 255, 255, 0.96);
  color: #5f6368;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  pointer-events: none;
}

/* =====================================
   TOP AND BOTTOM PLACEMENTS
===================================== */

.ad-card[data-placement="top"],
.ad-card[data-placement="bottom"] {
  width: 100%;
  height: 100%;
  max-width: none;
  padding: 7px 9px;
  border: 0;
  border-radius: 0;
  gap: 5px;
}

.ad-card[data-placement="top"] .ad-stage,
.ad-card[data-placement="bottom"] .ad-stage {
  border-radius: 7px;
}

.ad-card[data-placement="top"] .end-card,
.ad-card[data-placement="bottom"] .end-card {
  gap: 6px;
  --end-image-fr: 0.58fr;
  --end-spacer-fr: 0.42fr;
}

.ad-card[data-placement="top"] .end-card img,
.ad-card[data-placement="bottom"] .end-card img {
  border-radius: 7px;
}

/* =====================================
   STATIC PLACEMENT
===================================== */

.ad-card[data-placement="static"] {
  width: 100%;
  height: 100%;
  max-width: 680px;
}

/* =====================================
   FULLSCREEN PLACEMENT
===================================== */

.ad-card[data-placement="fullscreen"] {
  width: 100%;
  height: 100%;
  max-width: none;
  padding: clamp(12px, 2vw, 28px);
  gap: clamp(10px, 1.8vh, 18px);
  border: 0;
  border-radius: 0;
}

.ad-card[data-placement="fullscreen"] .ad-header {
  width: 100%;
  max-width: 1180px;
  min-height: 30px;
  margin: 0 auto;
}

.ad-card[data-placement="fullscreen"] .ad-label {
  font-size: 15px;
}

.ad-card[data-placement="fullscreen"] .ad-badge {
  font-size: 12px;
}

.ad-card[data-placement="fullscreen"] .ad-timer {
  font-size: 12px;
}

.ad-card[data-placement="fullscreen"] .sponsored {
  font-size: 12px;
}

.ad-card[data-placement="fullscreen"] .ad-stage {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
}

.ad-card[data-placement="fullscreen"] .video-frame {
  border-radius: 14px;
}

.ad-card[data-placement="fullscreen"] .end-card {
  max-width: 900px;
  margin: 0 auto;
  gap: 12px;
  --end-image-fr: 0.70fr;
  --end-spacer-fr: 0.30fr;
}

.ad-card[data-placement="fullscreen"] .end-card img {
  border-radius: 12px;
}

.ad-card[data-placement="fullscreen"] .end-card h3 {
  font-size: clamp(19px, 2.5vw, 26px);
}

.ad-card[data-placement="fullscreen"] .end-card p {
  font-size: 14px;
}

.ad-card[data-placement="fullscreen"] .visit-button {
  width: auto;
  min-width: 220px;
  min-height: 48px;
  padding: 13px 24px;
  font-size: 15px;
}

/* =====================================
   SMALL SCREENS
===================================== */

@media (max-width: 380px) {
  .ad-card {
    padding: 6px;
    gap: 5px;
  }

  .ad-header {
    gap: 5px;
  }

  .ad-label {
    font-size: 12px;
  }

  .ad-header-right {
    gap: 5px;
  }

  .sponsored {
    display: none;
  }

  .end-card {
    gap: 5px;
    --end-image-fr: 0.55fr;
    --end-spacer-fr: 0.45fr;
  }

  .end-card h3 {
    font-size: 14px;
  }

  .end-card p {
    font-size: 11px;
  }

  .visit-button {
    min-height: 42px;
    padding: 10px 12px;
    font-size: 12px;
  }

  .close-ad-button {
    width: 29px;
    height: 29px;
  }
}

/* =====================================
   FULLSCREEN MOBILE
===================================== */

@media (max-width: 600px) {
  .ad-card[data-placement="fullscreen"] {
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }

  .ad-card[data-placement="fullscreen"] .end-card {
    gap: 9px;
    --end-image-fr: 0.60fr;
    --end-spacer-fr: 0.40fr;
  }

  .ad-card[data-placement="fullscreen"] .visit-button {
    width: 100%;
    min-width: 0;
  }
}

/* =====================================
   SHORT SCREENS
===================================== */

@media (max-height: 500px) {
  .ad-card[data-placement="fullscreen"] {
    padding: 7px;
    gap: 6px;
  }

  .ad-card[data-placement="fullscreen"] .ad-header {
    min-height: 24px;
  }

  .ad-card[data-placement="fullscreen"] .end-card {
    gap: 5px;
    --end-image-fr: 0.52fr;
    --end-spacer-fr: 0.48fr;
  }

  .ad-card[data-placement="fullscreen"] .end-card h3 {
    font-size: 17px;
  }

  .ad-card[data-placement="fullscreen"] .end-card p {
    font-size: 11px;
  }

  .ad-card[data-placement="fullscreen"] .visit-button {
    min-height: 40px;
    padding: 8px 15px;
  }
}

/* =====================================
   REDUCED MOTION ACCESSIBILITY
===================================== */

@media (prefers-reduced-motion: reduce) {
  .end-card {
    transition: none;
  }

  .visit-button {
    transform: none;
    transition: none;
  }

  .end-card.is-entering .visit-button {
    transform: none;
  }
}
</style>
</head>

<body>

<div
  class="ad-card"
  id="adCard"
  data-placement="static"
>

  <div class="ad-header">

    <div class="ad-label">
      <span class="ad-badge">Ad</span>
      <span>Advertisement</span>
    </div>

    <div class="ad-header-right">
      <span class="ad-timer" id="adTimer">00:00</span>
      <span class="sponsored">Sponsored</span>
    </div>

  </div>

  <div class="ad-stage">

    <div
      class="video-frame"
      id="videoWrap"
      hidden
    >

      <a
        id="videoClick"
        class="video-click"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit advertiser"
      >

        <video
          id="adVideo"
          class="ad-video"
          playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload noplaybackrate"
        ></video>

      </a>

      <button
        id="soundButton"
        class="sound-button"
        type="button"
        hidden
      >
        Enable sound
      </button>

    </div>

    <div
      class="end-card"
      id="endCard"
      hidden
    >

      <button
        class="close-ad-button"
        id="closeAdButton"
        type="button"
        aria-label="Close advertisement"
        hidden
      >
        &times;
      </button>

      <a
        id="pictureClick"
        class="picture-click"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit advertiser"
      >

        <img
          id="adPicture"
          alt="Advertised product"
        >

      </a>

      <h3 id="advertiserTitle">
        Visit Advertiser
      </h3>

      <p>
        Learn more about this offer.
      </p>

      <a
        id="visitButton"
        class="visit-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Visit Now
      </a>

    </div>

    <div
      class="message"
      id="statusMessage"
    >
      Connecting to advertising network...
    </div>

  </div>

</div>

<script>
(function () {

  "use strict";

  // =====================================
  // CONFIGURATION
  // =====================================

  const VALID_PLACEMENTS = [
    "bottom",
    "top",
    "static",
    "fullscreen"
  ];

  const IMPRESSION_ID_PATTERN =
    /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  // =====================================
  // STATE
  // =====================================

  let initialized = false;
  let parentOrigin = null;
  let placement = "static";

  let imageReady = false;
  let imageFailed = false;
  let waitingForImage = false;

  let adClosed = false;
  let errorReported = false;

  // Visibility verification state

  let impressionId = null;

  let visibilityObserver = null;

  let currentVisibleRatio = 0;

  let hasVisibilityObservation = false;

  let videoHasStarted = false;

  let visibilityProofPassed = false;

  let visibilityRequestInProgress = false;

  let lastVisibilitySignature = "";

  let lastVisibilityCallAt = 0;

  // =====================================
  // ELEMENTS
  // =====================================

  const adCard =
    document.getElementById("adCard");

  const adTimer =
    document.getElementById("adTimer");

  const statusMessage =
    document.getElementById("statusMessage");

  const video =
    document.getElementById("adVideo");

  const videoWrap =
    document.getElementById("videoWrap");

  const videoClick =
    document.getElementById("videoClick");

  const soundButton =
    document.getElementById("soundButton");

  const endCard =
    document.getElementById("endCard");

  const adPicture =
    document.getElementById("adPicture");

  const pictureClick =
    document.getElementById("pictureClick");

  const visitButton =
    document.getElementById("visitButton");

  const advertiserTitle =
    document.getElementById("advertiserTitle");

  const closeAdButton =
    document.getElementById("closeAdButton");

  // =====================================
  // PARENT ORIGIN VALIDATION
  // =====================================

  function isAllowedParentOrigin(origin) {

    if (
      typeof origin !== "string" ||
      origin === "null"
    ) {
      return false;
    }

    try {

      const parsed = new URL(origin);

      const isHttps =
        parsed.protocol === "https:";

      const isLocalHttp =
        parsed.protocol === "http:" &&
        (
          parsed.hostname === "localhost" ||
          parsed.hostname === "127.0.0.1"
        );

      return (
        parsed.origin === origin &&
        (isHttps || isLocalHttp)
      );

    } catch {

      return false;

    }

  }

  // =====================================
  // SEND STATUS TO SDK
  // =====================================

  function sendStatus(status, message) {

    if (!parentOrigin) return;

    window.parent.postMessage(
      {
        type: "AD_NETWORK_STATUS",
        status,
        message,
        placement
      },
      parentOrigin
    );

  }

  // =====================================
  // URL VALIDATION
  // =====================================

  function safeHttpsUrl(value) {

    if (
      typeof value !== "string" ||
      !value.trim()
    ) {
      return null;
    }

    try {

      const url = new URL(value);

      if (
        url.protocol !== "https:" ||
        !url.hostname ||
        url.username ||
        url.password
      ) {
        return null;
      }

      return url.href;

    } catch {

      return null;

    }

  }

  // =====================================
  // TIMER
  // =====================================

  function formatElapsedTime(seconds) {

    const validSeconds =
      Number.isFinite(seconds)
        ? seconds
        : 0;

    const total =
      Math.max(0, Math.floor(validSeconds));

    const hours =
      Math.floor(total / 3600);

    const minutes =
      Math.floor((total % 3600) / 60);

    const remainingSeconds =
      total % 60;

    if (hours > 0) {

      return (
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(remainingSeconds).padStart(2, "0")
      );

    }

    return (
      String(minutes).padStart(2, "0") + ":" +
      String(remainingSeconds).padStart(2, "0")
    );

  }

  function updateAdTimer() {

    adTimer.textContent =
      formatElapsedTime(video.currentTime);

  }

  video.addEventListener(
    "timeupdate",
    updateAdTimer
  );

  // =====================================
  // VISIBILITY TRACKING
  // =====================================

  /*
    Calculate the visible proportion of an
    element inside this document's viewport.

    IntersectionObserver supplies the more
    accurate ratio when its first observation
    has arrived.
  */

  function calculateVisibleRatio(element) {

    if (!element) return 0;

    const rect =
      element.getBoundingClientRect();

    const elementArea =
      rect.width * rect.height;

    if (
      elementArea <= 0 ||
      window.innerWidth <= 0 ||
      window.innerHeight <= 0
    ) {
      return 0;
    }

    const visibleWidth = Math.max(
      0,
      Math.min(rect.right, window.innerWidth) -
      Math.max(rect.left, 0)
    );

    const visibleHeight = Math.max(
      0,
      Math.min(rect.bottom, window.innerHeight) -
      Math.max(rect.top, 0)
    );

    const visibleArea =
      visibleWidth * visibleHeight;

    return Math.max(
      0,
      Math.min(1, visibleArea / elementArea)
    );

  }

  // =====================================
  // RESET VISIBILITY TRACKING
  // =====================================

  function resetVisibilityTracking() {

    if (visibilityObserver) {

      visibilityObserver.disconnect();

      visibilityObserver = null;

    }

    impressionId = null;

    currentVisibleRatio = 0;

    hasVisibilityObservation = false;

    videoHasStarted = false;

    visibilityProofPassed = false;

    visibilityRequestInProgress = false;

    lastVisibilitySignature = "";

    lastVisibilityCallAt = 0;

  }

  // =====================================
  // START VISIBILITY OBSERVER
  // =====================================

  function startVisibilityObserver() {

    if (visibilityObserver) {

      visibilityObserver.disconnect();

      visibilityObserver = null;

    }

    currentVisibleRatio =
      calculateVisibleRatio(videoWrap);

    hasVisibilityObservation = false;

    if (!("IntersectionObserver" in window)) {

      console.warn(
        "IntersectionObserver is not supported. Using viewport measurements."
      );

      return;

    }

    visibilityObserver =
      new IntersectionObserver(
        function (entries) {

          for (const entry of entries) {

            if (entry.target !== videoWrap) continue;

            currentVisibleRatio =
              Math.max(
                0,
                Math.min(1, entry.intersectionRatio)
              );

            hasVisibilityObservation = true;

            /*
              If playback has already started,
              retry verification when visibility
              changes.
            */

            if (videoHasStarted) {

              attemptVisibilityProof(false);

            }

          }

        },
        {
          root: null,
          threshold: [0, 0.25, 0.5, 0.75, 1]
        }
      );

    visibilityObserver.observe(videoWrap);

  }

  // =====================================
  // CALL VISIBILITY BACKEND
  // =====================================

  async function attemptVisibilityProof(force) {

    if (adClosed) return;

    if (!videoHasStarted) return;

    if (visibilityProofPassed) return;

    if (visibilityRequestInProgress) return;

    if (!impressionId) {

      console.warn(
        "Visibility verification skipped: no impression ID was returned by /api/get-ad."
      );

      return;

    }

    const visibilityState =
      document.visibilityState;

    const measuredRatio =
      hasVisibilityObservation
        ? currentVisibleRatio
        : calculateVisibleRatio(videoWrap);

    const visibleRatio = Math.max(
      0,
      Math.min(1, Number(measuredRatio))
    );

    const signature =
      visibilityState + ":" + visibleRatio.toFixed(3);

    const now = Date.now();

    /*
      Avoid repeatedly sending identical
      visibility information.
    */

    if (
      !force &&
      signature === lastVisibilitySignature
    ) {
      return;
    }

    /*
      Avoid rapid repeated requests when the
      intersection changes several times.
    */

    if (
      !force &&
      now - lastVisibilityCallAt < 750
    ) {
      return;
    }

    lastVisibilitySignature = signature;

    lastVisibilityCallAt = now;

    visibilityRequestInProgress = true;

    try {

      const response = await fetch(
        "/api/prove_visibility",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            impression_id: impressionId,
            visibility_state: visibilityState,
            visible_ratio: Number(visibleRatio.toFixed(3))
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );

      const result =
        await response.json().catch(() => ({}));

      if (!response.ok || result.success !== true) {

        console.warn(
          "Visibility verification failed:",
          result.message || result
        );

        return;

      }

      if (result.ad_request === true) {

        visibilityProofPassed = true;

        console.log(
          "Visibility verification successful.",
          {
            impression_id: impressionId,
            visibility_state: visibilityState,
            visible_ratio: visibleRatio,
            ad_request: true
          }
        );

      } else {

        console.info(
          "Ad is not currently sufficiently visible.",
          {
            impression_id: impressionId,
            visibility_state: visibilityState,
            visible_ratio: visibleRatio
          }
        );

      }

    } catch (error) {

      console.warn(
        "Could not contact visibility backend:",
        error.message
      );

    } finally {

      visibilityRequestInProgress = false;

    }

  }

  // =====================================
  // VIDEO ACTUALLY STARTED PLAYING
  // =====================================

  /*
    The playing event fires when the video
    has actually begun playback.

    This is where the first visibility request
    is made, not when video.play() is merely
    attempted.
  */

  video.addEventListener(
    "playing",
    function () {

      if (adClosed) return;

      videoHasStarted = true;

      console.log(
        "Advertisement video has started playing."
      );

      attemptVisibilityProof(true);

    }
  );

  // =====================================
  // TAB VISIBILITY CHANGES
  // =====================================

  /*
    If the video starts while the tab is hidden,
    or becomes visible later, attempt verification
    again with the updated browser information.
  */

  document.addEventListener(
    "visibilitychange",
    function () {

      if (!videoHasStarted) return;

      attemptVisibilityProof(true);

    }
  );

  // =====================================
  // ERROR HANDLING
  // =====================================

  function showError(message) {

    if (adClosed) return;

    waitingForImage = false;

    videoHasStarted = false;

    resetVisibilityTracking();

    video.pause();

    videoWrap.hidden = true;
    endCard.hidden = true;

    soundButton.hidden = true;
    closeAdButton.hidden = true;

    statusMessage.hidden = false;
    statusMessage.textContent = message;

    if (!errorReported) {

      errorReported = true;

      sendStatus("error", message);

    }

  }

  // =====================================
  // VIDEO PLAYBACK
  // =====================================

  async function startPlayback() {

    if (adClosed) return;

    video.muted = false;
    video.volume = 1;

    try {

      await video.play();

      soundButton.textContent = "Mute";
      soundButton.hidden = false;

      statusMessage.hidden = true;

    } catch (firstError) {

      console.warn(
        "Audible autoplay was blocked:",
        firstError.message
      );

      video.muted = true;

      try {

        await video.play();

        soundButton.textContent = "Enable sound";
        soundButton.hidden = false;

        statusMessage.hidden = true;

      } catch (secondError) {

        console.warn(
          "Muted autoplay was blocked:",
          secondError.message
        );

        soundButton.textContent = "Tap to play";
        soundButton.hidden = false;

        statusMessage.hidden = false;

        statusMessage.textContent =
          "Tap the play button to start this advertisement.";

      }

    }

  }

  // =====================================
  // SOUND AND PLAY BUTTON
  // =====================================

  soundButton.addEventListener(
    "click",
    async function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (adClosed) return;

      if (video.paused) {

        video.muted = true;

        try {

          await video.play();

          soundButton.textContent = "Enable sound";
          statusMessage.hidden = true;

        } catch (error) {

          statusMessage.hidden = false;

          statusMessage.textContent =
            "The video could not be started. Please try again.";

          console.warn(
            "Video playback could not start:",
            error.message
          );

        }

        return;

      }

      if (video.muted) {

        video.muted = false;
        video.volume = 1;

        soundButton.textContent = "Mute";

      } else {

        video.muted = true;

        soundButton.textContent = "Enable sound";

      }

    }
  );

  // =====================================
  // CLOSE ADVERTISEMENT
  // =====================================

  closeAdButton.addEventListener(
    "click",
    function (event) {

      event.preventDefault();
      event.stopPropagation();

      if (adClosed) return;

      adClosed = true;

      video.pause();

      resetVisibilityTracking();

      video.removeAttribute("src");
      video.load();

      adCard.hidden = true;

      sendStatus(
        "closed",
        "Advertisement closed by viewer."
      );

    }
  );

  // =====================================
  // GET ADVERTISER NAME
  // =====================================

  async function getAdvertiserName(
    token_id,
    subid,
    ad_id
  ) {

    const response = await fetch(
      "/api/get-ad-name",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          token_id,
          subid,
          ad_id
        }),

        cache: "no-store",
        credentials: "same-origin"
      }
    );

    const data =
      await response.json().catch(() => ({}));

    if (
      !response.ok ||
      data.success !== true ||
      data.authorized !== true ||
      typeof data.app_name !== "string" ||
      !data.app_name.trim()
    ) {

      throw new Error(
        data.message ||
        "Could not retrieve advertiser name."
      );

    }

    return data.app_name.trim();

  }

  // =====================================
  // DISPLAY END CARD
  // =====================================

  function displayEndCard() {

    if (adClosed) return;

    if (
      !imageReady &&
      !(
        adPicture.complete &&
        adPicture.naturalWidth > 0
      )
    ) {
      return;
    }

    waitingForImage = false;

    videoHasStarted = false;

    resetVisibilityTracking();

    videoWrap.hidden = true;
    soundButton.hidden = true;

    endCard.classList.remove("is-entering");

    endCard.hidden = false;

    closeAdButton.hidden = false;

    statusMessage.hidden = true;

    void endCard.offsetHeight;

    requestAnimationFrame(function () {

      if (
        adClosed ||
        endCard.hidden
      ) {
        return;
      }

      endCard.classList.add("is-entering");

    });

  }

  // =====================================
  // IMAGE EVENTS
  // =====================================

  adPicture.addEventListener(
    "load",
    function () {

      imageReady = true;
      imageFailed = false;

      if (waitingForImage) {

        displayEndCard();

      }

    }
  );

  adPicture.addEventListener(
    "error",
    function () {

      imageReady = false;
      imageFailed = true;

      if (waitingForImage) {

        showError(
          "The advertisement image could not be loaded."
        );

      }

    }
  );

  // =====================================
  // VERIFY AND LOAD ADVERTISEMENT
  // =====================================

  async function verifyAndLoad(token_id, subid) {

    try {

      adClosed = false;

      errorReported = false;

      imageReady = false;
      imageFailed = false;

      waitingForImage = false;

      resetVisibilityTracking();

      adCard.hidden = false;

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Verifying advertising session...";

      // STEP 1: VERIFY SESSION

      const verifyResponse = await fetch(
        "/api/verify-token",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );

      const verification =
        await verifyResponse.json().catch(() => ({}));

      if (
        !verifyResponse.ok ||
        verification.authorized !== true ||
        verification.success === false
      ) {

        throw new Error(
          verification.message ||
          "Advertising session verification failed."
        );

      }

      // STEP 2: GET ADVERTISEMENT

      statusMessage.textContent =
        "Finding an advertisement...";

      const adResponse = await fetch(
        "/api/get-ad",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            token_id,
            subid
          }),

          cache: "no-store",
          credentials: "same-origin"
        }
      );

      const result =
        await adResponse.json().catch(() => ({}));

      if (
        !adResponse.ok ||
        result.success !== true ||
        result.authorized !== true
      ) {

        throw new Error(
          result.message ||
          "Could not retrieve advertisement."
        );

      }

      /*
        STEP 3: STORE IMPRESSION ID

        This ID must be returned by your
        /api/get-ad backend.
      */

      const returnedImpressionId =
        typeof result.impression_id === "string"
          ? result.impression_id.trim()
          : "";

      impressionId =
        IMPRESSION_ID_PATTERN.test(returnedImpressionId)
          ? returnedImpressionId
          : null;

      if (!impressionId) {

        console.warn(
          "No valid impression ID was returned. Visibility verification cannot be recorded for this ad."
        );

      }

      // STEP 4: HANDLE NO ADVERTISEMENT

      if (!result.ad) {

        statusMessage.hidden = false;

        statusMessage.textContent =
          "No advertisements are currently available.";

        sendStatus(
          "no_ad",
          "No advertisements are currently available."
        );

        return;

      }

      if (
        typeof result.ad !== "object" ||
        Array.isArray(result.ad)
      ) {

        throw new Error(
          "Invalid advertisement response."
        );

      }

      const ad = result.ad;

      // STEP 5: GET ADVERTISEMENT ID

      const ad_id =
        typeof ad.id === "string"
          ? ad.id.trim()
          : "";

      if (!ad_id) {

        throw new Error(
          "Advertisement ID was not returned by the server."
        );

      }

      // STEP 6: GET ADVERTISER NAME

      statusMessage.textContent =
        "Verifying advertiser information...";

      const appName = await getAdvertiserName(
        token_id,
        subid,
        ad_id
      );

      advertiserTitle.textContent =
        "Visit " + appName;

      // STEP 7: VALIDATE ADVERTISEMENT URLS

      const videoUrl =
        safeHttpsUrl(ad.ad_url);

      const imageUrl =
        safeHttpsUrl(ad.app_pic_url);

      const appLink =
        safeHttpsUrl(ad.app_link);

      if (
        !videoUrl ||
        !imageUrl ||
        !appLink
      ) {

        throw new Error(
          "The advertisement contains an invalid URL."
        );

      }

      // STEP 8: SET ADVERTISER DESTINATIONS

      videoClick.href = appLink;
      pictureClick.href = appLink;
      visitButton.href = appLink;

      // STEP 9: RESET AND LOAD IMAGE

      adPicture.removeAttribute("src");

      imageReady = false;
      imageFailed = false;

      adPicture.src = imageUrl;

      // STEP 10: PREPARE VIDEO DISPLAY

      videoWrap.hidden = false;

      endCard.hidden = true;

      endCard.classList.remove("is-entering");

      soundButton.hidden = true;
      closeAdButton.hidden = true;

      adTimer.textContent = "00:00";

      statusMessage.hidden = false;

      statusMessage.textContent =
        "Loading advertisement...";

      video.pause();

      video.removeAttribute("src");

      video.load();

      video.muted = false;
      video.volume = 1;

      /*
        Start observing visibility before
        playback begins, so the first ratio
        is available as early as possible.
      */

      startVisibilityObserver();

      let reportedLoaded = false;

      // STEP 11: VIDEO READY

      video.addEventListener(
        "canplay",
        function () {

          if (reportedLoaded || adClosed) return;

          reportedLoaded = true;

          statusMessage.hidden = true;

          sendStatus(
            "loaded",
            "Advertisement loaded successfully."
          );

          startPlayback();

        },
        { once: true }
      );

      // STEP 12: VIDEO ENDED

      video.addEventListener(
        "ended",
        function () {

          if (adClosed) return;

          updateAdTimer();

          if (
            imageReady ||
            (
              adPicture.complete &&
              adPicture.naturalWidth > 0
            )
          ) {

            imageReady = true;

            displayEndCard();

            return;

          }

          if (
            imageFailed ||
            adPicture.complete
          ) {

            showError(
              "The advertisement image could not be loaded."
            );

            return;

          }

          waitingForImage = true;

          statusMessage.hidden = false;

          statusMessage.textContent =
            "Preparing advertiser information...";

        },
        { once: true }
      );

      // STEP 13: VIDEO ERROR

      video.addEventListener(
        "error",
        function () {

          showError(
            "The advertisement video could not be loaded or played."
          );

        },
        { once: true }
      );

      // STEP 14: START LOADING VIDEO

      video.src = videoUrl;

      video.load();

    } catch (error) {

      console.error(
        "AD GUI ERROR:",
        error.message
      );

      showError(
        error.message ||
        "An advertising error occurred."
      );

    }

  }

  // =====================================
  // RECEIVE SDK INITIALIZATION
  // =====================================

  window.addEventListener(
    "message",
    function (event) {

      if (event.source !== window.parent) return;

      if (!isAllowedParentOrigin(event.origin)) return;

      if (
        parentOrigin &&
        event.origin !== parentOrigin
      ) {
        return;
      }

      const data = event.data;

      if (
        !data ||
        typeof data !== "object" ||
        data.type !== "AD_NETWORK_INIT"
      ) {
        return;
      }

      if (initialized) return;

      parentOrigin = event.origin;

      initialized = true;

      // STEP 1: READ PLACEMENT

      placement =
        typeof data.placement === "string" &&
        VALID_PLACEMENTS.includes(data.placement)
          ? data.placement
          : "static";

      adCard.dataset.placement = placement;

      // STEP 2: READ CREDENTIALS

      const token_id =
        typeof data.token_id === "string"
          ? data.token_id.trim()
          : "";

      const subid =
        typeof data.subid === "string"
          ? data.subid.trim()
          : "";

      // STEP 3: VALIDATE CREDENTIALS

      if (
        !/^[a-f0-9]{64}$/i.test(token_id) ||
        !/^[A-F0-9]{8}$/.test(subid)
      ) {

        showError(
          "Invalid advertising credentials."
        );

        return;

      }

      // STEP 4: VERIFY AND LOAD

      verifyAndLoad(token_id, subid);

    }
  );

  // =====================================
  // TELL SDK THAT GUI IS READY
  // =====================================

  window.parent.postMessage(
    {
      type: "AD_NETWORK_READY"
    },
    "*"
  );

})();
</script>

</body>
</html>
