
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Network Verification Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f6f9;
  font-family: Arial, sans-serif;
  color: #202938;
}

.container {
  max-width: 480px;
  margin: 50px auto;
  padding: 22px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 20px #0000000d;
}

h2 {
  margin-top: 0;
}

.description {
  color: #6b7280;
  font-size: 14px;
  line-height: 1.5;
}

.variable {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
  gap: 10px;
  font-size: 13px;
}

.status {
  font-weight: bold;
}

.configured {
  color: #16803c;
}

.missing {
  color: #dc2626;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 7px;
  background: #1769ff;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  margin-top: 15px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  font-size: 13px;
  line-height: 1.5;
}

.ok {
  display: block !important;
  background: #e8f8ed;
  color: #137333;
}

.error {
  display: block !important;
  background: #fff0f0;
  color: #b42318;
}

#networkResult {
  margin-top: 15px;
  overflow-wrap: anywhere;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Advertising Network</h2>

  <p class="description">
    Check your server configuration before
    connecting to the advertising network.
  </p>

  <div id="variables">
    <p>Checking configuration...</p>
  </div>

  <button id="checkBtn" onclick="checkConfiguration()">
    Check Configuration
  </button>

  <button id="verifyBtn" onclick="verifyNetwork()" disabled>
    Verify Advertising Network
  </button>

  <div id="message"></div>
  <div id="networkResult"></div>

</div>

<script>

let configurationReady = false;

async function checkConfiguration() {

  const checkBtn = document.getElementById("checkBtn");
  const verifyBtn = document.getElementById("verifyBtn");
  const variablesBox = document.getElementById("variables");
  const message = document.getElementById("message");

  configurationReady = false;
  verifyBtn.disabled = true;

  checkBtn.disabled = true;
  checkBtn.textContent = "Checking...";

  message.className = "";
  message.textContent = "";

  try {

    const response = await fetch("/api/check-config.js", {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Configuration check failed");
    }

    variablesBox.innerHTML = "";

    data.variables.forEach(variable => {

      const row = document.createElement("div");
      row.className = "variable";

      const name = document.createElement("span");
      name.textContent = variable.name;

      const status = document.createElement("span");
      status.className = "status " +
        (variable.configured ? "configured" : "missing");

      status.textContent = variable.configured
        ? "Configured"
        : "Missing";

      row.append(name, status);
      variablesBox.appendChild(row);

    });

    configurationReady = data.success === true;

    if (configurationReady) {

      message.className = "ok";
      message.textContent =
        "All environment variables are configured. Verification is available.";

      verifyBtn.disabled = false;

    } else {

      message.className = "error";
      message.textContent =
        "Some environment variables are missing. Add them in Vercel and redeploy.";

    }

  } catch (error) {

    message.className = "error";
    message.textContent = error.message;

  } finally {

    checkBtn.disabled = false;
    checkBtn.textContent = "Check Configuration";

  }
}

async function verifyNetwork() {

  if (!configurationReady) {
    return;
  }

  const verifyBtn = document.getElementById("verifyBtn");
  const message = document.getElementById("message");
  const resultBox = document.getElementById("networkResult");

  verifyBtn.disabled = true;
  verifyBtn.textContent = "Verifying...";

  resultBox.textContent = "";

  try {

    const response = await fetch("/api/check-ad-network.js", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok || !data.success || !data.authorized) {
      throw new Error(data.message || "Network verification failed");
    }

    message.className = "ok";
    message.textContent = "Advertising network verified successfully!";

    resultBox.textContent =
      "Partner verification completed successfully.";

  } catch (error) {

    message.className = "error";
    message.textContent = error.message;

  } finally {

    verifyBtn.disabled = false;
    verifyBtn.textContent = "Verify Advertising Network";

  }
}

// Check configuration when the page opens
checkConfiguration();

</script>

</body>
</html>
