<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See Video</title>
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:#000; display:flex; flex-direction:column; height:100vh; }
.header { height:50px; display:flex; align-items:center; padding:0 12px; background:#111; color:white; }
.header button { background:none; border:none; color:white; font-size:18px; cursor:pointer; margin-right:10px; }
.video-container { flex:1; display:flex; align-items:center; justify-content:center; background:black; }
video { max-width:100%; max-height:100%; }
</style>
</head>
<body>
<div class="header">
  <button onclick="history.back()">← Back</button>
  <span>Video</span>
</div>
<div class="video-container">
  <video id="video" controls autoplay>
    <source id="videoSource" src="" type="video/mp4">
    Your browser does not support video.
  </video>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const url = params.get("url");
const video = document.getElementById("video");
if(url){
  document.getElementById("videoSource").src = url;
  video.load();
}
</script>
</body>
</html>
