<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Type Image Test</title>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: rgba(255, 255, 255, 0.95);
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe3ee;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --dark: #111827;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 25%),
        var(--bg);
      color: var(--text);
    }

    .shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title-block h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.10);
      color: var(--primary);
      border: 1px solid rgba(37, 99, 235, 0.18);
      font-weight: 700;
      font-size: 13px;
    }

    .panel {
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(219, 227, 238, 0.9);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    input[type="file"] {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin: 4px 4px 4px 0;
      font-weight: 700;
    }

    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-hover); }

    .danger { background: var(--danger); color: white; }
    .danger:hover { background: var(--danger-hover); }

    .dark { background: #334155; color: white; }
    .dark:hover { background: #1f2937; }

    #previewContainer {
      margin-top: 15px;
      text-align: center;
      min-height: 240px;
      border: 1px dashed #cfd6dd;
      border-radius: 14px;
      padding: 14px;
      background: linear-gradient(180deg, #fafbfc, #f7fafc);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #previewContainer img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      display: none;
      object-fit: contain;
      background: #fff;
    }

    .preview-placeholder {
      color: var(--muted);
      font-size: 14px;
    }

    .info-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      color: var(--text);
    }

    .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .status {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 14px;
      white-space: pre-line;
      min-height: 46px;
    }

    #processingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      z-index: 999;
      flex-direction: column;
      backdrop-filter: blur(4px);
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.25);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="title-block">
        <h2>Image Upload Test</h2>
        <p>Upload an image and see the returned URL and public ID on the page.</p>
      </div>
      <div class="badge">Upload Debug</div>
    </div>

    <div id="processingOverlay">
      <div class="spinner"></div>
      Uploading...
    </div>

    <div class="panel">
      <input type="file" id="imageInput" accept="image/*" />

      <div id="previewContainer">
        <img id="imagePreview" alt="Preview">
        <div id="previewPlaceholder" class="preview-placeholder">No image selected yet</div>
      </div>

      <button id="uploadBtn" class="primary" style="width:100%; margin-top:15px;">
        Upload Image
      </button>

      <div id="discardRow" style="display:none;">
        <button id="discardBtn" class="danger" style="width:100%;">
          Discard Image
        </button>
      </div>

      <div class="status" id="statusBox">Choose an image to begin.</div>

      <div class="info-box">
        <span class="label">Image URL</span>
        <div id="urlBox" class="muted">—</div>
      </div>

      <div class="info-box">
        <span class="label">Public ID</span>
        <div id="publicIdBox" class="muted">—</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const overlay = document.getElementById("processingOverlay");
    const imageInput = document.getElementById("imageInput");
    const imagePreview = document.getElementById("imagePreview");
    const previewPlaceholder = document.getElementById("previewPlaceholder");
    const uploadBtn = document.getElementById("uploadBtn");
    const discardBtn = document.getElementById("discardBtn");
    const discardRow = document.getElementById("discardRow");
    const statusBox = document.getElementById("statusBox");
    const urlBox = document.getElementById("urlBox");
    const publicIdBox = document.getElementById("publicIdBox");

    let currentUserId = null;
    let uploadedImageUrl = null;
    let uploadedPublicId = null;
    let selectedFile = null;

    async function getSessionUser() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = "index.html";
        return null;
      }

      currentUserId = session.user.id;
      return currentUserId;
    }

    function showPreview(url) {
      if (!url) {
        imagePreview.src = "";
        imagePreview.style.display = "none";
        previewPlaceholder.style.display = "block";
        discardRow.style.display = "none";
        return;
      }

      imagePreview.src = url;
      imagePreview.style.display = "block";
      previewPlaceholder.style.display = "none";
      discardRow.style.display = "block";
    }

    async function uploadFileToServer(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("userId", currentUserId);

      const res = await fetch("/api/upload-post.js", {
        method: "POST",
        body: formData
      });

      const result = await res.json();

      if (!res.ok) {
        throw new Error(result?.error || "Upload failed");
      }

      return result;
    }

    async function deleteRemoteImage(publicId) {
      if (!publicId) return;

      await fetch("/api/delete-image.js", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ publicId })
      });
    }

    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      statusBox.textContent = `Selected: ${file.name}`;
    });

    uploadBtn.onclick = async () => {
      if (!selectedFile) {
        statusBox.textContent = "Please choose an image first.";
        return;
      }

      overlay.style.display = "flex";

      try {
        await getSessionUser();

        const result = await uploadFileToServer(selectedFile);

        uploadedImageUrl = result.url;
        uploadedPublicId = result.publicId;

        showPreview(uploadedImageUrl);
        urlBox.textContent = uploadedImageUrl || "—";
        publicIdBox.textContent = uploadedPublicId || "—";
        statusBox.textContent = "Upload successful.";
      } catch (err) {
        console.error(err);
        statusBox.textContent = "Upload failed.";
        alert("Upload failed");
      } finally {
        overlay.style.display = "none";
      }
    };

    discardBtn.onclick = async () => {
      if (!uploadedPublicId) return;

      overlay.style.display = "flex";

      try {
        await deleteRemoteImage(uploadedPublicId);
      } catch (err) {
        console.error(err);
      } finally {
        overlay.style.display = "none";
      }

      uploadedImageUrl = null;
      uploadedPublicId = null;
      selectedFile = null;

      imageInput.value = "";
      imagePreview.src = "";
      urlBox.textContent = "—";
      publicIdBox.textContent = "—";
      showPreview("");
      statusBox.textContent = "Image discarded.";
    };

    (async function init() {
      await getSessionUser();
    })();
  </script>
</body>
  </html>
