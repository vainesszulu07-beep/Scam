<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertising SDK Tester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000010;
        }

        h2 {
            margin-top: 0;
        }

        #advertising-container {
            width: 100%;
            min-height: 250px;
            margin-top: 20px;
            border: 1px dashed #aaa;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Advertising SDK Tester</h2>

    <p>This page loads the external advertising SDK.</p>

    <div id="advertising-container"></div>

</div>

<script src="https://scam-gamma.vercel.app/advertising-sdk.js"></script>

<script>
    AdvertisingSDK.init({
        container: "#advertising-container"
    });
</script>

</body>
</html>
