<!DOCTYPE html>
<html>
<head>
  <title>Upload Test</title>
</head>
<body style="font-family: Arial; padding: 20px;">

  <h2>Upload Test</h2>

  <input type="file" id="fileInput">
  <button id="uploadBtn">Upload</button>

  <h3>Result:</h3>
  <p><strong>URL:</strong></p>
  <div id="url"></div>

  <p><strong>Public ID:</strong></p>
  <div id="publicId"></div>

  <img id="preview" style="max-width:300px; margin-top:10px;" />

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    const urlBox = document.getElementById("url");
    const publicIdBox = document.getElementById("publicId");
    const preview = document.getElementById("preview");

    uploadBtn.onclick = async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Select a file first");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/api/upload-post.js", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        console.log("SERVER RESPONSE:", data);

        urlBox.textContent = data.url || "No URL returned";
        publicIdBox.textContent = data.publicId || "No publicId returned";

        if (data.url) {
          preview.src = data.url;
        }

      } catch (err) {
        console.error(err);
        alert("Upload failed");
      }
    };
  </script>

</body>
</html>
