<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>

<!-- Cropper.js CSS -->
<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

<style>
body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
h2 { margin-bottom: 10px; text-align: center; }
.post-header { display: flex; align-items: center; margin-bottom: 10px; }
.post-header img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; }
#postImage { margin-top: 10px; }
#postBtn { margin-top: 10px; padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
#previewContainer { margin-top: 10px; max-width: 100%; max-height: 400px; text-align: center; }
#previewContainer img { max-width: 100%; max-height: 400px; display: block; margin: 0 auto; border-radius: 8px; }
button.rotate-btn { margin: 5px; padding: 6px 10px; border: none; border-radius: 4px; background: #555; color: white; cursor: pointer; }
button.rotate-btn:hover { background: #333; }
</style>
</head>
<body>

<h2>Create a Post</h2>

<!-- User header -->
<div class="post-header">
  <img id="userAvatar" src="https://via.placeholder.com/50" alt="Your Avatar">
  <span id="userName">User Name</span>
</div>

<!-- Post content -->
<textarea id="postContent" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">

<div id="previewContainer">
  <img id="imagePreview" src="" alt="Preview">
</div>

<div>
  <button class="rotate-btn" id="rotateLeft">⟲ Rotate Left</button>
  <button class="rotate-btn" id="rotateRight">⟳ Rotate Right</button>
  <button class="rotate-btn" id="cropBtn">Crop</button>
</div>

<button id="postBtn">Post</button>

<!-- Cropper.js -->
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Initialize Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const postBtn = document.getElementById("postBtn");
const postContentEl = document.getElementById("postContent");
const postImageEl = document.getElementById("postImage");
const imagePreviewEl = document.getElementById("imagePreview");
const userAvatarEl = document.getElementById("userAvatar");
const userNameEl = document.getElementById("userName");

const rotateLeftBtn = document.getElementById("rotateLeft");
const rotateRightBtn = document.getElementById("rotateRight");
const cropBtn = document.getElementById("cropBtn");

let currentUserId;
let cropper;

// 🔹 Get current user session
async function getCurrentUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    alert("Login required");
    window.location.href = "index.html";
    return null;
  }
  return session.user.id;
}

// 🔹 Load user profile (avatar & name)
async function loadUserProfile() {
  const { data: profile } = await supabase
    .from("profile")
    .select("avatar_url, full_name")
    .eq("id", currentUserId)
    .single();

  if (profile) {
    if (profile.avatar_url) userAvatarEl.src = profile.avatar_url;
    if (profile.full_name) userNameEl.textContent = profile.full_name;
  }
}

// 🔹 Handle image selection
postImageEl.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  imagePreviewEl.src = url;

  // Destroy previous cropper if exists
  if (cropper) cropper.destroy();

  cropper = new Cropper(imagePreviewEl, {
    aspectRatio: 1,
    viewMode: 1,
    autoCropArea: 1,
  });
});

// 🔹 Rotate
rotateLeftBtn.addEventListener("click", () => { if (cropper) cropper.rotate(-90); });
rotateRightBtn.addEventListener("click", () => { if (cropper) cropper.rotate(90); });

// 🔹 Crop (replace preview with cropped version)
cropBtn.addEventListener("click", () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
  imagePreviewEl.src = canvas.toDataURL();
  cropper.destroy();
  cropper = null;
});

// 🔹 Create Post
postBtn.addEventListener("click", async () => {
  const content = postContentEl.value.trim();
  if (!content && !imagePreviewEl.src) {
    alert("Post cannot be empty");
    return;
  }

  let image_url = null;
  let image_public_id = null;

  // Upload image if exists
  if (imagePreviewEl.src && imagePreviewEl.src.startsWith("data:")) {
    const blob = await (await fetch(imagePreviewEl.src)).blob();
    const formData = new FormData();
    formData.append("file", blob);
    formData.append("userId", currentUserId);
    formData.append("type", "post");

    const res = await fetch("/api/upload-post.js", { method: "POST", body: formData });
    const result = await res.json();
    if (!res.ok) {
      alert("Failed to upload image");
      return;
    }
    image_url = result.url;
    image_public_id = result.publicId;
  }

  // Insert post
  const { error } = await supabase.from("posts").insert([
    { user_id: currentUserId, content, image_url, image_public_id }
  ]);

  if (error) {
    console.error("Failed to create post:", error);
    alert("Failed to create post");
    return;
  }

  // Redirect to profile
  window.location.href = "profile.html";
});

// 🔹 Initialize
(async () => {
  currentUserId = await getCurrentUser();
  if (currentUserId) await loadUserProfile();
})();
</script>
</body>
  </html>
