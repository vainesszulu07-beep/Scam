<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>

<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

<style>
body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
h2 { text-align: center; }

.post-header {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}
.post-header img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 10px;
}

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}

#postBtn {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #1877f2;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#previewContainer {
  margin-top: 15px;
  text-align: center;
}

#previewContainer img {
  max-width: 100%;
  border-radius: 10px;
}

.rotate-btn {
  margin: 5px;
  padding: 6px 10px;
  background: #444;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* Processing overlay */
#processingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  z-index: 999;
}
.spinner {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin-bottom: 10px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<h2>Create Post</h2>

<div class="post-header">
  <img id="userAvatar" src="https://via.placeholder.com/50">
  <span id="userName">Loading...</span>
</div>

<textarea id="postContent" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">

<div id="previewContainer">
  <img id="imagePreview">
</div>

<div>
  <button class="rotate-btn" id="rotateLeft">⟲ Rotate</button>
  <button class="rotate-btn" id="rotateRight">⟳ Rotate</button>
  <button class="rotate-btn" id="cropBtn">Crop</button>
</div>

<button id="postBtn">Post</button>

<div id="processingOverlay">
  <div>
    <div class="spinner"></div>
    Processing Image...
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const postImageEl = document.getElementById("postImage");
const imagePreviewEl = document.getElementById("imagePreview");
const postBtn = document.getElementById("postBtn");
const postContentEl = document.getElementById("postContent");
const overlay = document.getElementById("processingOverlay");

const rotateLeftBtn = document.getElementById("rotateLeft");
const rotateRightBtn = document.getElementById("rotateRight");
const cropBtn = document.getElementById("cropBtn");

const userAvatarEl = document.getElementById("userAvatar");
const userNameEl = document.getElementById("userName");

let currentUserId;
let cropper;
let uploadedImageUrl = null;
let uploadedPublicId = null;

/* 🔹 Get User */
async function initUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "index.html";
    return;
  }

  currentUserId = session.user.id;

  const { data } = await supabase
    .from("profile")
    .select("avatar_url, full_name")
    .eq("id", currentUserId)
    .single();

  if (data) {
    if (data.avatar_url) userAvatarEl.src = data.avatar_url;
    if (data.full_name) userNameEl.textContent = data.full_name;
  }
}

/* 🔹 Auto Upload On Select */
postImageEl.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  overlay.style.display = "flex";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("userId", currentUserId);

  try {
    const res = await fetch("/api/upload-post.js", {
      method: "POST",
      body: formData
    });

    const result = await res.json();

    if (!res.ok) {
      alert("Upload failed");
      overlay.style.display = "none";
      return;
    }

    uploadedImageUrl = result.url;
    uploadedPublicId = result.publicId;

    imagePreviewEl.src = uploadedImageUrl;

    if (cropper) cropper.destroy();
    cropper = new Cropper(imagePreviewEl, {
      aspectRatio: 1,
      viewMode: 1,
    });

  } catch (err) {
    alert("Upload error");
  }

  overlay.style.display = "none";
});

/* 🔹 Rotate */
rotateLeftBtn.onclick = () => cropper && cropper.rotate(-90);
rotateRightBtn.onclick = () => cropper && cropper.rotate(90);

/* 🔹 Crop */
cropBtn.onclick = () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
  imagePreviewEl.src = canvas.toDataURL();
  cropper.destroy();
  cropper = null;
};

/* 🔹 Save Post (No Upload Here) */
postBtn.addEventListener("click", async () => {
  const content = postContentEl.value.trim();

  if (!content && !uploadedImageUrl) {
    alert("Post cannot be empty");
    return;
  }

  const { error } = await supabase.from("posts").insert([
    {
      user_id: currentUserId,
      content,
      image_url: uploadedImageUrl,
      image_public_id: uploadedPublicId
    }
  ]);

  if (error) {
    alert("Failed to create post");
    return;
  }

  window.location.href = "profile.html";
});

initUser();
</script>
</body>
  </html>
