<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>

<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

<style>
body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
h2 { text-align: center; }

.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.user-info {
  display: flex;
  align-items: center;
}

.user-info img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  margin-right: 10px;
}

.discard-btn {
  background: crimson;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: none;
}

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}

#postBtn {
  margin-top: 15px;
  padding: 10px;
  width: 100%;
  background: #1877f2;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#previewContainer {
  margin-top: 15px;
  text-align: center;
  position: relative;
}

#previewContainer img {
  max-width: 100%;
  border-radius: 10px;
}

/* Crop Controls */
.crop-controls {
  margin-top: 10px;
  text-align: center;
  display: none;
}

.crop-controls button {
  margin: 5px;
  padding: 6px 10px;
  background: #444;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* Processing overlay */
#processingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  z-index: 999;
}
.spinner {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin-bottom: 10px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<h2>Create Post</h2>

<div class="post-header">
  <div class="user-info">
    <img id="userAvatar" src="https://via.placeholder.com/50">
    <span id="userName">Loading...</span>
  </div>
  <button id="discardBtn" class="discard-btn">Discard</button>
</div>

<textarea id="postContent" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">

<div id="previewContainer">
  <img id="imagePreview">
</div>

<div class="crop-controls" id="cropControls">
  <button id="rotateLeft">⟲</button>
  <button id="rotateRight">⟳</button>
  <button id="applyCrop">Apply Crop</button>
</div>

<button id="cropToggle">Edit Image</button>
<button id="postBtn">Post</button>

<div id="processingOverlay">
  <div>
    <div class="spinner"></div>
    Processing Image...
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const overlay = document.getElementById("processingOverlay");
const postImageEl = document.getElementById("postImage");
const imagePreviewEl = document.getElementById("imagePreview");
const postBtn = document.getElementById("postBtn");
const postContentEl = document.getElementById("postContent");
const discardBtn = document.getElementById("discardBtn");

const cropToggle = document.getElementById("cropToggle");
const cropControls = document.getElementById("cropControls");

const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const applyCrop = document.getElementById("applyCrop");

let currentUserId;
let cropper;
let uploadedImageUrl = null;
let uploadedPublicId = null;

/* USER INIT */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  currentUserId = session.user.id;
})();

/* AUTO UPLOAD */
postImageEl.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  overlay.style.display = "flex";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("userId", currentUserId);

  const res = await fetch("/api/upload-post.js", {
    method: "POST",
    body: formData
  });

  const result = await res.json();

  overlay.style.display = "none";

  if (!res.ok) {
    alert("Upload failed");
    return;
  }

  uploadedImageUrl = result.url;
  uploadedPublicId = result.publicId;

  imagePreviewEl.src = uploadedImageUrl;
  discardBtn.style.display = "inline-block";
});

/* ENABLE CROP ONLY WHEN CLICKED */
cropToggle.onclick = () => {
  if (!uploadedImageUrl) return;

  cropControls.style.display = "block";

  if (cropper) cropper.destroy();

  cropper = new Cropper(imagePreviewEl, {
    aspectRatio: 1,
    viewMode: 2,
    dragMode: "move",
    responsive: true,
    autoCropArea: 0.8,
    cropBoxMovable: true,
    cropBoxResizable: true,
  });
};

rotateLeft.onclick = () => cropper && cropper.rotate(-90);
rotateRight.onclick = () => cropper && cropper.rotate(90);

applyCrop.onclick = () => {
  if (!cropper) return;

  const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
  imagePreviewEl.src = canvas.toDataURL();

  cropper.destroy();
  cropper = null;
  cropControls.style.display = "none";
};

/* DISCARD IMAGE */
discardBtn.onclick = async () => {
  if (!uploadedPublicId) return;

  await fetch("/api/delete-image.js", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ publicId: uploadedPublicId })
  });

  uploadedImageUrl = null;
  uploadedPublicId = null;
  imagePreviewEl.src = "";
  discardBtn.style.display = "none";
};

/* SAVE POST */
postBtn.onclick = async () => {
  const content = postContentEl.value.trim();

  if (!content && !uploadedImageUrl) {
    alert("Post cannot be empty");
    return;
  }

  const { error } = await supabase.from("posts").insert([
    {
      user_id: currentUserId,
      content,
      image_url: uploadedImageUrl,
      image_public_id: uploadedPublicId
    }
  ]);

  if (error) {
    alert("Failed to create post");
    return;
  }

  window.location.href = "profile.html";
};
</script>
</body>
  </html>
