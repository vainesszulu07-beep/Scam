<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>

<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  background: #f0f2f5;
  max-width: 600px;
  margin: auto;
}

h2 { text-align: center; }

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
  resize: none;
}

button {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  margin: 4px 2px;
}

.primary { background: #1877f2; color: white; }
.danger { background: crimson; color: white; }
.dark { background: #444; color: white; }
.light { background: #e4e6eb; }

#previewContainer {
  margin-top: 15px;
  text-align: center;
}

#previewContainer img {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin: auto;
}

.crop-controls {
  margin-top: 10px;
  text-align: center;
  display: none;
}

.aspect-buttons {
  margin-top: 8px;
}

#processingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  z-index: 999;
}

.spinner {
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin-bottom: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<h2>Create Post</h2>

<textarea id="postContent" placeholder="What's on your mind?"></textarea>
<input type="file" id="postImage" accept="image/*">

<div id="previewContainer">
  <img id="imagePreview">
</div>

<div>
  <button id="editBtn" class="dark">Edit Image</button>
  <button id="discardBtn" class="danger" style="display:none;">Discard</button>
</div>

<div class="crop-controls" id="cropControls">
  <div>
    <button id="rotateLeft" class="dark">⟲</button>
    <button id="rotateRight" class="dark">⟳</button>
    <button id="applyCrop" class="primary">Apply Crop</button>
  </div>

  <div class="aspect-buttons">
    <button data-ratio="free" class="light">Free</button>
    <button data-ratio="1" class="light">1:1</button>
    <button data-ratio="1.777" class="light">16:9</button>
    <button data-ratio="0.8" class="light">4:5</button>
  </div>
</div>

<button id="postBtn" class="primary" style="width:100%; margin-top:15px;">
  Post
</button>

<div id="processingOverlay">
  <div>
    <div class="spinner"></div>
    Processing Image...
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_PUBLIC_ANON_KEY"
);

const overlay = document.getElementById("processingOverlay");
const postImageEl = document.getElementById("postImage");
const imagePreviewEl = document.getElementById("imagePreview");
const postBtn = document.getElementById("postBtn");
const postContentEl = document.getElementById("postContent");
const discardBtn = document.getElementById("discardBtn");
const editBtn = document.getElementById("editBtn");
const cropControls = document.getElementById("cropControls");

const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const applyCrop = document.getElementById("applyCrop");

let currentUserId;
let cropper;
let uploadedImageUrl = null;
let uploadedPublicId = null;

/* AUTH */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  currentUserId = session.user.id;
})();

/* IMAGE SELECT */
postImageEl.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  overlay.style.display = "flex";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("userId", currentUserId);

  const res = await fetch("/api/upload-post.js", {
    method: "POST",
    body: formData
  });

  const result = await res.json();
  overlay.style.display = "none";

  if (!res.ok) {
    alert("Upload failed");
    return;
  }

  uploadedImageUrl = result.url;
  uploadedPublicId = result.publicId;

  imagePreviewEl.src = uploadedImageUrl;
  discardBtn.style.display = "inline-block";
});

/* ENABLE CROP */
editBtn.onclick = () => {
  if (!uploadedImageUrl) return;

  cropControls.style.display = "block";

  if (cropper) cropper.destroy();

  cropper = new Cropper(imagePreviewEl, {
    aspectRatio: NaN, // FREE BY DEFAULT
    viewMode: 1,
    dragMode: "move",
    autoCropArea: 1,
    responsive: true
  });
};

/* ROTATE */
rotateLeft.onclick = () => cropper && cropper.rotate(-90);
rotateRight.onclick = () => cropper && cropper.rotate(90);

/* ASPECT RATIO SWITCH */
document.querySelectorAll("[data-ratio]").forEach(btn => {
  btn.onclick = () => {
    if (!cropper) return;

    const ratio = btn.dataset.ratio;
    if (ratio === "free") {
      cropper.setAspectRatio(NaN);
    } else {
      cropper.setAspectRatio(parseFloat(ratio));
    }
  };
});

/* APPLY CROP */
applyCrop.onclick = () => {
  if (!cropper) return;

  const canvas = cropper.getCroppedCanvas({
    maxWidth: 1200,
    maxHeight: 1200
  });

  imagePreviewEl.src = canvas.toDataURL("image/jpeg", 0.9);

  cropper.destroy();
  cropper = null;
  cropControls.style.display = "none";
};

/* DISCARD */
discardBtn.onclick = async () => {
  if (!uploadedPublicId) return;

  await fetch("/api/delete-image.js", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ publicId: uploadedPublicId })
  });

  uploadedImageUrl = null;
  uploadedPublicId = null;
  imagePreviewEl.src = "";
  discardBtn.style.display = "none";
};

/* SAVE POST */
postBtn.onclick = async () => {
  const content = postContentEl.value.trim();

  if (!content && !uploadedImageUrl) {
    alert("Post cannot be empty");
    return;
  }

  const { error } = await supabase.from("posts").insert([
    {
      user_id: currentUserId,
      content,
      image_url: imagePreviewEl.src,
      image_public_id: uploadedPublicId
    }
  ]);

  if (error) {
    alert("Failed to create post");
    return;
  }

  window.location.href = "profile.html";
};
</script>
</body>
                                                </html>
