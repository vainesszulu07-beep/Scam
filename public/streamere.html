<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live - HD + Controls</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; text-align: center; }
  
  /* Video Container */
  #video-container { position: relative; width: 100%; height: 55vh; background: black; }
  video { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
  
  /* BRB Overlay */
  #brb-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #333; display: none; color: white; 
    flex-direction: column; justify-content: center; align-items: center;
  }

  /* Controls Grid */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; max-width: 600px; margin: auto; }

  button {
    padding: 12px; width: 100%;
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
  }
  
  #start { background: #28a745; color: white; grid-column: span 2; } /* Full width */
  #stop { background: #dc3545; color: white; grid-column: span 2; }
  
  #switch { background: #007bff; color: white; }
  
  /* Toggle Button States */
  .btn-active { background: #e0e0e0; color: #333; border: 2px solid #ccc; }
  .btn-off { background: #ffc107; color: #000; } /* Orange for active mute/brb */

  #status { padding: 20px; border-radius: 8px; display: inline-block; font-weight: bold; margin-top: 10px; }
  .loading { background: #fff3cd; color: #856404; }
  .success { background: #d4edda; color: #155724; }
  
  /* Camera List Modal */
  #camListOverlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
  }
  #camListContent {
    background: white; width: 80%; max-width: 400px; padding: 20px; border-radius: 12px;
  }
  .cam-item {
    padding: 15px; margin: 5px 0; background: #eee; border-radius: 5px; cursor: pointer; font-weight: bold; text-align: left;
  }
</style>
</head>
<body>

<h2>🎥 Host Controls</h2>

<div id="video-container">
  <video id="video" autoplay muted playsinline></video>
  <div id="brb-overlay">
    <h1>☕ BRB</h1>
    <p>Stream Paused</p>
  </div>
</div>

<br>
<div id="status" class="loading">⏳ Loading SDK...</div>
<br>

<!-- Control Panel -->
<div class="controls">
  <button id="start" disabled>🚀 Start Stream</button>
  
  <!-- Secondary Controls (Hidden until live) -->
  <button id="mute" style="display:none;">🎤 Mute Mic</button>
  <button id="brb" style="display:none;">👁️ Go BRB</button>
  <button id="switch" style="display:none;">🔄 Flip Cam</button>
  
  <button id="stop" disabled>🛑 End Stream</button>
</div>

<!-- Camera Selection Overlay -->
<div id="camListOverlay">
  <div id="camListContent">
    <h3>Select Camera</h3>
    <div id="camItemsContainer"></div>
    <button onclick="document.getElementById('camListOverlay').style.display='none'" style="background:#666; color:white; width: 100%; margin: 10px 0 0 0;">Cancel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@videosdk.live/js-sdk@0.7.0/videosdk.min.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// UI Elements
const video = document.getElementById("video");
const brbOverlay = document.getElementById("brb-overlay");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const switchBtn = document.getElementById("switch");
const muteBtn = document.getElementById("mute");
const brbBtn = document.getElementById("brb");
const camListOverlay = document.getElementById("camListOverlay");
const camItemsContainer = document.getElementById("camItemsContainer");

// State
let meeting = null;
let currentUserId = null;
let videoTrack = null; 
let audioTrack = null;
let currentCameraId = null; // Stores the ID to restore correct camera after BRB
let isMicMuted = false;
let isVideoHidden = false; // BRB State

window.onload = function() {
    if (window.VideoSDK) {
        statusEl.textContent = "✅ SDK Ready";
        statusEl.className = "success";
        startBtn.disabled = false;
    }
};

async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Login required");
  return session.user.id;
}

function applySmartMirror(stream) {
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  const settings = track.getSettings();
  if (settings.facingMode === 'environment') {
    video.style.transform = "scaleX(1)"; 
  } else {
    video.style.transform = "scaleX(-1)"; 
  }
}

startBtn.onclick = async () => {
  try {
    startBtn.disabled = true;
    statusEl.textContent = "Connecting...";
    const userId = await getUser();
    currentUserId = userId;

    const res = await fetch("https://scamming-lg3v.onrender.com/api/create-room", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    
    window.VideoSDK.config(data.hostToken);

    // 1. Create HD Video
    videoTrack = await window.VideoSDK.createCameraVideoTrack({
      optimizationMode: "motion",
      encoderConfig: "h1080p_w1920p",
      facingMode: "user",
      multiStream: true
    });

    // Store initial camera ID
    const settings = videoTrack.getVideoTracks()[0].getSettings();
    currentCameraId = settings.deviceId;

    // 2. Create HD Audio
    audioTrack = await window.VideoSDK.createMicrophoneAudioTrack({
      encoderConfig: "high_quality", 
      noiseConfig: { noiseSuppression: true, echoCancellation: true, autoGainControl: true }
    });

    meeting = window.VideoSDK.initMeeting({
      meetingId: data.roomId,
      name: "Host",
      participantId: userId,
      micEnabled: true,
      webcamEnabled: true,
      customCameraVideoTrack: videoTrack,
      customMicrophoneAudioTrack: audioTrack
    });

    meeting.join();

    meeting.on("meeting-joined", async () => {
      statusEl.textContent = "🔴 LIVE";
      stopBtn.disabled = false;
      
      // Show Controls
      switchBtn.style.display = "inline-block";
      muteBtn.style.display = "inline-block";
      brbBtn.style.display = "inline-block";

      video.srcObject = videoTrack;
      applySmartMirror(videoTrack);

      // DB Update
      await supabase.from("profile").update({
          is_live: true,
          stream_started_at: new Date().toISOString(),
          videosdk_room_id: data.roomId,
          videosdk_host_token: data.hostToken,
          videosdk_viewer_token: data.viewerToken, 
          stream_camera_on: true,
          stream_mic_on: true
      }).eq("id", userId);
    });

  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
    startBtn.disabled = false;
  }
};

// --- CONTROL 1: MUTE / UNMUTE ---
muteBtn.onclick = async () => {
    if (isMicMuted) {
        // Unmute
        await meeting.unmuteMic();
        isMicMuted = false;
        muteBtn.textContent = "🎤 Mute Mic";
        muteBtn.className = ""; // Remove active class
    } else {
        // Mute
        await meeting.muteMic();
        isMicMuted = true;
        muteBtn.textContent = "🔇 Unmute";
        muteBtn.className = "btn-off"; // Add active warning class
    }
};

// --- CONTROL 2: BRB (TOGGLE VIDEO) ---
brbBtn.onclick = async () => {
    if (isVideoHidden) {
        // === RESUME STREAM ===
        statusEl.textContent = "Resuming...";
        brbOverlay.style.display = "none"; // Hide BRB screen
        
        // We must RE-CREATE the HD track because disableWebcam() destroyed the old one.
        // We use 'currentCameraId' to ensure we don't accidentally flip to the wrong camera.
        const newStream = await window.VideoSDK.createCameraVideoTrack({
            cameraId: currentCameraId,
            optimizationMode: "motion",
            encoderConfig: "h1080p_w1920p",
            multiStream: true
        });

        await meeting.enableWebcam(newStream);
        
        video.srcObject = newStream;
        applySmartMirror(newStream);
        videoTrack = newStream;
        
        isVideoHidden = false;
        brbBtn.textContent = "👁️ Go BRB";
        brbBtn.className = "";
        statusEl.textContent = "🔴 LIVE";
        
    } else {
        // === GO BRB ===
        await meeting.disableWebcam(); // Stops data transmission
        
        if (videoTrack) {
             videoTrack.getTracks().forEach(t => t.stop()); // Turn off camera light
        }
        
        video.srcObject = null;
        brbOverlay.style.display = "flex"; // Show BRB screen locally
        
        isVideoHidden = true;
        brbBtn.textContent = "▶️ Resume";
        brbBtn.className = "btn-off";
        statusEl.textContent = "⏸️ PAUSED (BRB)";
    }
};

// --- CONTROL 3: CAMERA SWITCH ---
switchBtn.onclick = async () => {
  try {
    const cameras = await window.VideoSDK.getCameras();
    camItemsContainer.innerHTML = ""; 

    cameras.forEach((cam) => {
      const btn = document.createElement("div");
      btn.className = "cam-item";
      btn.textContent = cam.label || `Camera ${cam.deviceId.substring(0, 5)}`;
      btn.onclick = () => changeCamera(cam.deviceId);
      camItemsContainer.appendChild(btn);
    });
    camListOverlay.style.display = "flex";
  } catch (err) {
    console.error(err);
  }
};

async function changeCamera(selectedDeviceId) {
  camListOverlay.style.display = "none";
  
  // If currently in BRB, just update the ID so it applies when we resume
  currentCameraId = selectedDeviceId;
  if (isVideoHidden) return; 

  statusEl.textContent = "Switching...";

  try {
    if (videoTrack) videoTrack.getTracks().forEach(track => track.stop());

    const newStream = await window.VideoSDK.createCameraVideoTrack({
      cameraId: selectedDeviceId, 
      optimizationMode: "motion",
      encoderConfig: "h1080p_w1920p",
      multiStream: true
    });

    await meeting.changeWebcam(newStream);

    video.srcObject = newStream;
    applySmartMirror(newStream); 
    videoTrack = newStream;

    statusEl.textContent = "🔴 LIVE";
  } catch (err) {
    statusEl.textContent = "❌ Switch Failed";
  }
}

stopBtn.onclick = async () => {
  if (meeting) meeting.leave();
  if (videoTrack) videoTrack.getTracks().forEach(t => t.stop());
  if (audioTrack) audioTrack.getTracks().forEach(t => t.stop());
  
  video.srcObject = null;
  statusEl.textContent = "🛑 Ended";
  
  startBtn.disabled = false;
  stopBtn.disabled = true;
  switchBtn.style.display = "none";
  muteBtn.style.display = "none";
  brbBtn.style.display = "none";
  brbOverlay.style.display = "none";

  if (currentUserId) {
      await supabase.from("profile").update({
          is_live: false,
          stream_ended_at: new Date().toISOString(),
          videosdk_room_id: null
      }).eq("id", currentUserId);
  }
};
</script>
</body>
  </html>
