<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Chat-Bet Arena</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #e0e0e0;
      --accent: #000000;
      --muted: #666666;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .description {
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 30px;
      text-align: justify;
    }

    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 0;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn-black {
      background: var(--accent);
      color: white;
      border: none;
    }

    .btn-black:hover { opacity: 0.8; }

    .btn-white {
      background: white;
      color: black;
      border: 1px solid black;
    }

    .btn-white:hover { background: #f5f5f5; }

    .divider {
      margin: 20px 0;
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 10px;
    }

    #message {
      margin-top: 20px;
      font-size: 12px;
      min-height: 18px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
    }

    .footer a {
      color: black;
      text-decoration: none;
      font-weight: 700;
    }
    
    #otpSection {
      display: none; 
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed var(--border);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Chat-Bet</h1>
  <p class="description">
    Welcome to Chat-Bet, the premier arena for skill-based monetization. 
    Participants engage in a competitive bidding process; 
    the victor demonstrating superior skill secures the total stake. 
  </p>

  <div class="input-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">
  </div>

  <div class="input-group">
    <label>Security Key (Password)</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>

  <button class="btn btn-black" id="loginBtn">Authenticate via Email</button>
  
  <div class="divider">OR ZAMBIAN SMS</div>

  <div class="input-group">
    <label>Zambian Phone Number</label>
    <input type="tel" id="phone" value="+260" placeholder="+260 97XXXXXXX">
  </div>
  
  <button class="btn btn-white" id="sendOtpBtn">Request Access Code</button>

  <div id="otpSection">
    <div class="input-group">
      <label>Verification Code</label>
      <input type="text" id="otp" placeholder="6-digit code">
    </div>
    <button class="btn btn-black" id="verifyOtpBtn">Verify & Authenticate</button>
  </div>

  <div class="divider">OR</div>

  <button class="btn btn-white" id="googleBtn">Continue with Google</button>

  <div id="message"></div>

  <div class="footer">
    No credentials? <a href="signup.html">Request Access</a>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://eimecuiixwgmpfpedxpr.supabase.co",
    "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
  );

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const phoneInput = document.getElementById("phone");
  const sendOtpBtn = document.getElementById("sendOtpBtn");
  const otpSection = document.getElementById("otpSection");
  const otpInput = document.getElementById("otp");
  const verifyOtpBtn = document.getElementById("verifyOtpBtn");
  const googleBtn = document.getElementById("googleBtn");
  const message = document.getElementById("message");

  const log = (txt, color = "black") => {
    message.innerText = txt;
    message.style.color = color;
  };

  async function routeUser(user) {
    if (!user) return;
    log("Verifying credentials...", "black");
    try {
      const { data: profile, error } = await supabase
        .from("profile")
        .select("*")
        .eq("id", user.id)
        .single();

      if (error || !profile) {
        window.location.href = "manage.html";
        return;
      }

      if (profile.full_name && profile.bio && profile.contact) {
        window.location.href = "lobby.html";
      } else {
        window.location.href = "manage.html";
      }
    } catch (err) {
      window.location.href = "manage.html";
    }
  }

  // Handle automatic redirect after Google login
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) routeUser(session.user);
  });

  // Email Login
  loginBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if (!email || !password) return log("Credentials required.", "red");

    log("Authenticating...");
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) log(error.message, "red");
    else routeUser(data.user);
  });

  // Request Phone OTP (Zambia Specific)
  sendOtpBtn.addEventListener("click", async () => {
    let phone = phoneInput.value.trim();

    // Basic Validation: Check if it starts with +260 and has 9 digits after it
    if (!phone.startsWith("+260") || phone.length < 13) {
      log("Please enter a valid Zambian number (e.g., +260 97...)", "red");
      return;
    }

    log("Dispatching security code...");
    const { error } = await supabase.auth.signInWithOtp({ phone });

    if (error) {
      log(error.message, "red");
    } else {
      log("Code dispatched to " + phone, "green");
      sendOtpBtn.style.display = "none";
      otpSection.style.display = "block";
    }
  });

  // Verify Phone OTP
  verifyOtpBtn.addEventListener("click", async () => {
    const phone = phoneInput.value.trim();
    const token = otpInput.value.trim();

    if (!token) return log("Verification code required.", "red");

    log("Verifying token...");
    const { data, error } = await supabase.auth.verifyOtp({
      phone,
      token,
      type: 'sms'
    });

    if (error) log(error.message, "red");
    else routeUser(data.user);
  });

  // Google Login
  googleBtn.addEventListener("click", async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) log(error.message, "red");
  });

  // Page Load Session Check
  const checkInitialSession = async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) routeUser(session.user);
  };
  checkInitialSession();

</script>
</body>
</html>
