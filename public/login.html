<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: white;
    padding: 30px 25px;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  h2 { margin-bottom: 20px; }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    cursor: pointer;
  }

  button:hover { background: #4f46e5; }

  .google-btn {
    background: #DB4437;
    margin-top: 10px;
  }

  .google-btn:hover { background: #c33d2f; }

  .message {
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
  }

  .signup-link {
    display: block;
    margin-top: 12px;
    color: #6366f1;
    text-decoration: none;
    font-size: 14px;
  }

  .signup-link:hover { text-decoration: underline; }
</style>
</head>

<body>
  <div class="card">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="loginBtn">Login</button>
    <button id="googleBtn" class="google-btn">Login with Google</button>

    <div class="message" id="message"></div>

    <a href="signup.html" class="signup-link">Don't have an account? Sign up</a>
  </div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleBtn");
const message = document.getElementById("message");

// ============================
// Check profile for nulls (except avatar_public_id)
// ============================
async function handleProfile(user) {
  const { data: profile } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (!profile) {
    window.location.href = "/manage.html";
    return;
  }

  const requiredFields = ["full_name", "bio", "contact", "created_at", "avatar_url"];
  const hasNull = requiredFields.some(field => profile[field] === null || profile[field] === undefined);

  if (hasNull) {
    window.location.href = "/manage.html";
  } else {
    // Profile complete → redirect to manage or dashboard
    window.location.href = "/manage.html"; 
  }
}

// ============================
// Auto redirect if session exists
// ============================
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  await handleProfile(session.user);
}

// ============================
// Login Button
// ============================
loginBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    message.style.color = "red";
    message.textContent = "Enter email and password.";
    return;
  }

  message.textContent = "Logging in...";

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    message.style.color = "red";
    message.textContent = error.message;
    return;
  }

  await handleProfile(data.user);
});

// ============================
// Google Login Button
// ============================
googleBtn.addEventListener("click", async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin + "/login.html" }
  });

  if (error) {
    message.style.color = "red";
    message.textContent = error.message;
  }
});
</script>

</body>
</html>
