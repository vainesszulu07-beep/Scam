<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f5f7fa;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: white;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
}

h2 { margin-bottom: 20px; font-weight: 600; }

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 15px;
}

input:focus {
  border-color: #6366f1;
  outline: none;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #6366f1;
  color: white;
  font-weight: 500;
  cursor: pointer;
  margin-top: 10px;
}

button:hover { background: #4f46e5; }

.divider {
  margin: 20px 0;
  color: #888;
  font-size: 14px;
}

.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  background: #fff;
  color: #444;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 15px;
}

.google-btn img {
  width: 18px;
  margin-right: 8px;
}

.google-btn:hover {
  background: #f3f4f6;
}

.message {
  margin-top: 10px;
  font-size: 14px;
  color: #dc2626;
  min-height: 20px;
}

.signup-link {
  display: block;
  margin-top: 15px;
  font-size: 14px;
  color: #6366f1;
  text-decoration: none;
}

.signup-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email Address" />
  <input type="password" id="password" placeholder="Password" />
  <button id="loginBtn">Login</button>

  <div class="divider">— or —</div>

  <button class="google-btn" id="googleLogin">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    Sign in with Google
  </button>

  <a href="/signup.html" class="signup-link">
    Don't have an account? Sign up
  </a>

  <div id="message" class="message"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const messageDiv = document.getElementById("message");


// 🔥 LOGIN WITH EMAIL
document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = emailInput.value;
  const password = passwordInput.value;
  messageDiv.innerText = "";

  if (!email || !password) {
    messageDiv.innerText = "Please enter email and password.";
    return;
  }

  messageDiv.innerText = "Logging in...";

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    messageDiv.innerText = error.message;
    return;
  }

  await ensureProfile(data.user.id, data.user.email);
  await redirectBasedOnProfile(data.user.id);
});


// 🔥 GOOGLE LOGIN
document.getElementById("googleLogin").addEventListener("click", async () => {

  await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin + "/login.html"
    }
  });

});


// 🔥 ENSURE PROFILE EXISTS
async function ensureProfile(userId, email) {

  const { data, error } = await supabase
    .from("profile")
    .select("id")
    .eq("id", userId)
    .single();

  if (error && error.code === "PGRST116") {

    await supabase.from("profile").insert([{
      id: userId,
      full_name: null,
      bio: null,
      avatar_url: null,
      contact: email
    }]);

  }
}


// 🔥 REDIRECT BASED ON PROFILE COMPLETION
async function redirectBasedOnProfile(userId) {

  const { data: profile, error } = await supabase
    .from("profile")
    .select("full_name, bio, avatar_url, contact")
    .eq("id", userId)
    .single();

  if (error || !profile) {
    window.location.href = "/manage.html";
    return;
  }

  const isComplete =
    profile.full_name &&
    profile.bio &&
    profile.avatar_url &&
    profile.contact;

  if (isComplete) {
    window.location.href = "/profile.html";
  } else {
    window.location.href = "/manage.html";
  }
}


// 🔥 AUTO HANDLE GOOGLE REDIRECT OR EXISTING SESSION
(async () => {

  const { data: { session } } = await supabase.auth.getSession();

  if (session?.user) {
    await ensureProfile(session.user.id, session.user.email);
    await redirectBasedOnProfile(session.user.id);
  }

})();
</script>

</body>
  </html>
