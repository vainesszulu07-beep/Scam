<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp-Style Video Trimmer</title>
<style>
body { font-family: sans-serif; max-width:600px; margin:auto; padding:20px; background:#f0f2f5; }
h2 { text-align:center; margin-bottom:15px; }
input[type=file], button { width:100%; margin:8px 0; }
#previewContainer { position:relative; text-align:center; margin-top:10px; }
#previewContainer video { max-width:100%; border-radius:10px; }
#uploadProgressOverlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; color:white; font-size:22px; border-radius:10px; }
#uploadProgressOverlay span { margin-top:10px; }
#timelineContainer { position:relative; margin-top:15px; height:60px; }
#timelineCanvas { width:100%; height:60px; background:#ccc; border-radius:8px; }
.handle { position:absolute; top:0; width:10px; height:60px; background:#1877f2; cursor:pointer; border-radius:3px; }
#startHandle { left:0; }
#endHandle { right:0; }
.slider-labels { display:flex; justify-content:space-between; font-size:12px; margin-top:4px; }
</style>
</head>
<body>

<h2>WhatsApp-Style Video Trimmer</h2>
<input type="file" id="videoFile" accept="video/*">

<div id="previewContainer">
  <video id="videoPreview" controls></video>
  <div id="uploadProgressOverlay"><span id="progressPercent">0%</span></div>
</div>

<div id="timelineContainer">
  <canvas id="timelineCanvas"></canvas>
  <div id="startHandle" class="handle"></div>
  <div id="endHandle" class="handle"></div>
</div>
<div class="slider-labels">
  <span id="startTimeLabel">0:00</span>
  <span id="endTimeLabel">0:00</span>
</div>

<button id="trimBtn" class="primary">Trim Video</button>
<button id="uploadBtn" class="primary">Upload Video</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.0/dist/ffmpeg.min.js';

// Initialize Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

// Elements
const videoFileEl = document.getElementById("videoFile");
const videoPreview = document.getElementById("videoPreview");
const trimBtn = document.getElementById("trimBtn");
const uploadBtn = document.getElementById("uploadBtn");
const uploadOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

const timelineCanvas = document.getElementById("timelineCanvas");
const startHandle = document.getElementById("startHandle");
const endHandle = document.getElementById("endHandle");
const startTimeLabel = document.getElementById("startTimeLabel");
const endTimeLabel = document.getElementById("endTimeLabel");

const ctx = timelineCanvas.getContext('2d');

let selectedFile = null;
let trimmedBlob = null;
let currentUserId = null;
let ffmpeg = null;

// Auth
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ window.location.href="index.html"; return; }
  currentUserId = session.user.id;
})();

// Load FFmpeg
ffmpeg = createFFmpeg({ log:true });
await ffmpeg.load();

// Video select
videoFileEl.addEventListener("change", async (e)=>{
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  videoPreview.src = URL.createObjectURL(selectedFile);

  videoPreview.onloadedmetadata = () => {
    timelineCanvas.width = timelineCanvas.clientWidth;
    drawTimelineFrames(videoPreview, ctx, timelineCanvas.width, 10);
    endHandle.style.left = timelineCanvas.width + 'px';
    updateLabels(0, videoPreview.duration);
  };
});

// Generate timeline frames
async function drawTimelineFrames(video, ctx, width, frameCount){
  const interval = video.duration / frameCount;
  const tempVideo = document.createElement('video');
  tempVideo.src = video.src;

  for(let i=0;i<frameCount;i++){
    tempVideo.currentTime = i*interval;
    await new Promise(r => tempVideo.onseeked = r);
    ctx.drawImage(tempVideo, (i*width/frameCount), 0, width/frameCount, timelineCanvas.height);
  }
}

// Handle dragging
let dragging = null;
startHandle.onmousedown = (e)=> dragging='start';
endHandle.onmousedown = (e)=> dragging='end';
document.onmouseup = ()=> dragging=null;
document.onmousemove = (e)=>{
  if(!dragging) return;
  const rect = timelineCanvas.getBoundingClientRect();
  let x = e.clientX - rect.left;
  x = Math.max(0, Math.min(x, timelineCanvas.width));
  if(dragging==='start'){
    startHandle.style.left = x+'px';
    if(x>=parseFloat(endHandle.style.left)) startHandle.style.left = endHandle.style.left;
  } else {
    endHandle.style.left = x+'px';
    if(x<=parseFloat(startHandle.style.left)) endHandle.style.left = startHandle.style.left;
  }
  const startTime = (parseFloat(startHandle.style.left)/timelineCanvas.width)*videoPreview.duration;
  const endTime = (parseFloat(endHandle.style.left)/timelineCanvas.width)*videoPreview.duration;
  updateLabels(startTime,endTime);
  videoPreview.currentTime = startTime;
};

function updateLabels(start,end){
  startTimeLabel.textContent = formatTime(start);
  endTimeLabel.textContent = formatTime(end);
}

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return `${m}:${s<10?'0'+s:s}`;
}

// Trim
trimBtn.onclick = async () => {
  if(!selectedFile) return alert("Select a video first");

  const start = (parseFloat(startHandle.style.left)/timelineCanvas.width)*videoPreview.duration;
  const end = (parseFloat(endHandle.style.left)/timelineCanvas.width)*videoPreview.duration;
  if(start>=end) return alert("Invalid range");

  uploadOverlay.style.display='flex';
  progressPercent.textContent='Trimming...';

  ffmpeg.FS('writeFile','input.mp4', await fetchFile(selectedFile));
  await ffmpeg.run(
    '-i','input.mp4',
    '-ss', start.toString(),
    '-to', end.toString(),
    '-c','copy',
    'output.mp4'
  );
  const data = ffmpeg.FS('readFile','output.mp4');
  trimmedBlob = new Blob([data.buffer],{type:'video/mp4'});
  videoPreview.src = URL.createObjectURL(trimmedBlob);
  uploadOverlay.style.display='none';
  alert("Video trimmed! You can now upload.");
};

// Upload
uploadBtn.onclick = async () => {
  if(!trimmedBlob) return alert("Trim video first");

  uploadOverlay.style.display='flex';
  progressPercent.textContent='0%';

  try{
    // Get signed payload
    const { signature,timestamp,apiKey,cloudName } = await fetch("/api/video.js").then(r=>r.json());

    const formData = new FormData();
    formData.append("file", trimmedBlob);
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder", "videos");

    const xhr = new XMLHttpRequest();
    xhr.open("POST",`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable){
        const percent = Math.round((e.loaded/e.total)*100);
        progressPercent.textContent = percent+'%';
      }
    };

    const uploadPromise = new Promise((resolve,reject)=>{
      xhr.onload = ()=> { if(xhr.status>=200 && xhr.status<300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error("Upload failed")); };
      xhr.onerror = ()=> reject(new Error("Upload error"));
      xhr.send(formData);
    });

    const videoData = await uploadPromise;

    // Save to Supabase
    const { error } = await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);
    if(error) throw error;

    alert("Video uploaded successfully!");
    window.location.href="profile.html";

  } catch(err){
    console.error(err);
    alert("Error uploading video: "+err.message);
  } finally {
    uploadOverlay.style.display='none';
  }
};
</script>

</body>
  </html>
