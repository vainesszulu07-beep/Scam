<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Video</title>
<style>
body {
  font-family: sans-serif;
  max-width:500px;
  margin:auto;
  padding:20px;
  background:#f0f2f5;
  text-align:center;
}

h2 {
  margin-bottom:20px;
  color:#1877f2;
}

#videoPreview {
  width:100%;
  max-height:300px;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.button {
  display:inline-block;
  padding:12px 20px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#1877f2;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition: background 0.3s;
}

.button:hover {
  background:#155bb5;
}

#uploadProgressOverlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  color:white;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

#uploadProgressOverlay span {
  margin-top:10px;
  font-size:18px;
}
</style>
</head>
<body>

<h2>Upload Your Video</h2>

<label for="videoFile" class="button">Select Video</label>
<input type="file" id="videoFile" accept="video/*" style="display:none">

<video id="videoPreview" controls></video>

<button id="uploadBtn" class="button">Upload Video</button>

<div id="uploadProgressOverlay">
  <span id="progressPercent">0%</span>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const videoFileEl = document.getElementById("videoFile");
const videoPreview = document.getElementById("videoPreview");
const uploadBtn = document.getElementById("uploadBtn");
const uploadOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");

let selectedFile = null;
let currentUserId = null;

/* Auth */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;
})();

/* Video preview */
videoFileEl.addEventListener("change", e => {
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  videoPreview.src = URL.createObjectURL(selectedFile);
  videoPreview.style.display = "block";
});

/* Upload video */
uploadBtn.addEventListener("click", async () => {
  if(!selectedFile) return alert("Please select a video first!");

  uploadOverlay.style.display = "flex";
  progressPercent.textContent = "0%";

  try {
    const { signature, timestamp, apiKey, cloudName } = await fetch("/api/video.js").then(r=>r.json());

    const formData = new FormData();
    formData.append("file", selectedFile);
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder","videos");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`);

    xhr.upload.onprogress = e => {
      if(e.lengthComputable){
        const percent = Math.round((e.loaded / e.total) * 100);
        progressPercent.textContent = percent + "%";
      }
    };

    const uploadPromise = new Promise((resolve,reject)=>{
      xhr.onload = ()=> {
        if(xhr.status>=200 && xhr.status<300) resolve(JSON.parse(xhr.responseText));
        else reject(new Error("Upload failed"));
      };
      xhr.onerror = ()=>reject(new Error("Upload error"));
      xhr.send(formData);
    });

    const videoData = await uploadPromise;

    const { error } = await supabase.from("posts").insert([{
      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id
    }]);
    if(error) throw error;

    alert("Video uploaded successfully!");
    window.location.href="profile.html";

  } catch(err){
    console.error(err);
    alert("Upload failed: " + err.message);
  } finally {
    uploadOverlay.style.display="none";
  }
});
</script>

</body>
</html>
