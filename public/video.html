<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Video</title>

<style>

body{
  font-family: Arial;
  text-align:center;
  background:#111;
  color:white;
}

video{
  width:300px;
  margin-top:20px;
  border-radius:10px;
}

button{
  padding:10px 20px;
  margin-top:20px;
  font-size:16px;
  cursor:pointer;
}

/* upload overlay */

#uploadProgressOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:24px;
}

</style>

</head>

<body>

<h2>Upload Video</h2>

<input type="file" id="videoFile" accept="video/*">

<br>

<video id="videoPreview" controls></video>

<br>

<button id="uploadBtn">Upload Video</button>

<!-- Upload progress -->

<div id="uploadProgressOverlay">
  
  <div>Uploading...</div>
  <div id="progressPercent">0%</div>
  
  <button id="cancelUploadBtn">Cancel</button>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* SUPABASE */

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

/* ELEMENTS */

const videoFileEl = document.getElementById("videoFile");
const videoPreviewEl = document.getElementById("videoPreview");
const uploadBtn = document.getElementById("uploadBtn");

const uploadProgressOverlay = document.getElementById("uploadProgressOverlay");
const progressPercent = document.getElementById("progressPercent");
const cancelUploadBtn = document.getElementById("cancelUploadBtn");

let currentUserId;
let selectedFile = null;
let currentXHR = null;


/* CHECK AUTH */

(async () => {

  const { data:{ session } } = await supabase.auth.getSession();

  if(!session){
    window.location.href = "index.html";
    return;
  }

  currentUserId = session.user.id;

})();


/* SELECT VIDEO */

videoFileEl.addEventListener("change",(e)=>{

  selectedFile = e.target.files[0];

  if(!selectedFile) return;

  /* limit 60mb */

  if(selectedFile.size > 60 * 1024 * 1024){

    alert("Video too large. Max 60MB.");
    selectedFile = null;
    videoPreviewEl.src="";
    return;

  }

  videoPreviewEl.src = URL.createObjectURL(selectedFile);

});


/* CANCEL UPLOAD */

cancelUploadBtn.onclick = ()=>{

  if(currentXHR){

    currentXHR.abort();

    uploadProgressOverlay.style.display="none";

    alert("Upload canceled");

    currentXHR = null;

  }

};


/* UPLOAD */

uploadBtn.onclick = async ()=>{

  if(!selectedFile){

    alert("Select a video first");
    return;

  }

  uploadProgressOverlay.style.display="flex";
  progressPercent.textContent="0%";

  try{

    /* GET SIGNATURE FROM BACKEND */

    const response = await fetch("/api/video.js");

    const data = await response.json();

    const signature = data.signature;
    const timestamp = data.timestamp;
    const apiKey = data.apiKey;
    const cloudName = data.cloudName;

    /* PREPARE FORM */

    const formData = new FormData();

    formData.append("file", selectedFile);
    formData.append("api_key", apiKey);
    formData.append("timestamp", timestamp);
    formData.append("signature", signature);
    formData.append("folder","videos");


    currentXHR = new XMLHttpRequest();

    currentXHR.open(
      "POST",
      `https://api.cloudinary.com/v1_1/${cloudName}/video/upload`
    );


    /* PROGRESS */

    currentXHR.upload.onprogress = (event)=>{

      if(event.lengthComputable){

        const percent = Math.round((event.loaded/event.total)*100);

        progressPercent.textContent = percent+"%";

      }

    };


    /* WAIT FOR UPLOAD */

    const uploadPromise = new Promise((resolve,reject)=>{

      currentXHR.onload = ()=>{

        if(currentXHR.status>=200 && currentXHR.status<300){

          resolve(JSON.parse(currentXHR.responseText));

        }else{

          reject(new Error("Upload failed"));

        }

      };

      currentXHR.onerror = ()=> reject(new Error("Upload error"));

      currentXHR.send(formData);

    });


    const videoData = await uploadPromise;


    /* SAVE TO DATABASE */

    const { error } = await supabase
    .from("posts")
    .insert([{

      user_id: currentUserId,
      video_url: videoData.secure_url,
      video_public_id: videoData.public_id

    }]);


    if(error) throw error;


    alert("Video uploaded successfully!");

    window.location.href="profile.html";


  }catch(err){

    console.error(err);

    alert("Error uploading video: "+err.message);

  }finally{

    uploadProgressOverlay.style.display="none";

    currentXHR = null;

  }

};

</script>

</body>
  </html>
