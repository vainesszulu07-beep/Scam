<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity Setup | Chat-Bet</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #e0e0e0;
      --accent: #000000;
      --muted: #666666;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Sleek Back Navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: opacity 0.2s;
    }

    .back-btn:hover { opacity: 0.6; }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border: 1px solid var(--border);
      text-align: center;
      margin-top: 60px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    /* Avatar Styling */
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 30px auto;
    }

    .avatar-display {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #fafafa;
    }

    .edit-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 18px;
      border: 2px solid white;
    }

    /* Form Styling */
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 0;
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    textarea {
      height: 100px;
      resize: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      border: none;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.8; }

    #message {
      margin-top: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-height: 18px;
    }
  </style>
</head>
<body>

<div class="nav-header">
  <a href="profile.html" class="back-btn">&#8592; Back to Profile</a>
</div>

<div class="container">
  <h1>Identity Details</h1>

  <div class="avatar-wrapper" id="changeAvatar">
    <img id="avatarPreview" src="https://via.placeholder.com/150" class="avatar-display" alt="User Avatar">
    <div class="edit-overlay">+</div>
  </div>

  <div class="input-group">
    <label>Legal Name / Alias</label>
    <input type="text" id="fullName" placeholder="Enter your identification name">
  </div>

  <div class="input-group">
    <label>Professional Biography</label>
    <textarea id="bio" placeholder="Describe your skills and expertise..."></textarea>
  </div>

  <button class="btn" id="saveProfileBtn">Update Identity</button>
  
  <div id="message"></div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  const supabase = createClient(
    "https://eimecuiixwgmpfpedxpr.supabase.co",
    "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
  );

  const avatarPreview = document.getElementById("avatarPreview");
  const fullNameInput = document.getElementById("fullName");
  const bioInput = document.getElementById("bio");
  const saveBtn = document.getElementById("saveProfileBtn");
  const message = document.getElementById("message");
  const changeAvatarArea = document.getElementById("changeAvatar");

  const setStatus = (txt, color = "black") => {
    message.innerText = txt;
    message.style.color = color;
  };

  // 1. Initial Data Load
  window.addEventListener("DOMContentLoaded", async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data: profile } = await supabase
      .from("profile")
      .select("avatar_url, full_name, bio")
      .eq("id", session.user.id)
      .single();

    if (profile) {
      if (profile.avatar_url) avatarPreview.src = profile.avatar_url;
      if (profile.full_name) fullNameInput.value = profile.full_name;
      if (profile.bio) bioInput.value = profile.bio;
      
      // Automatic check: If profile is already complete, just send them to lobby
      checkCompletionAndRedirect(profile);
    }

    // Check if user just came back from edit.html with a new avatar
    const tempAvatar = localStorage.getItem("finalAvatar");
    if (tempAvatar) {
      avatarPreview.src = tempAvatar;
      localStorage.removeItem("finalAvatar");
    }
  });

  // 2. Click Avatar -> Edit Page
  changeAvatarArea.addEventListener("click", () => {
    window.location.href = "edit.html";
  });

  // 3. Save Logic
  saveBtn.addEventListener("click", async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    setStatus("Synchronizing data...", "black");

    const profileUpdates = {
      id: session.user.id,
      full_name: fullNameInput.value.trim(),
      bio: bioInput.value.trim(),
      avatar_url: avatarPreview.src
    };

    try {
      const { error } = await supabase.from("profile").upsert(profileUpdates);
      if (error) throw error;

      setStatus("Data Secured.", "green");

      // Check if all fields are full, if so, redirect
      checkCompletionAndRedirect(profileUpdates);

    } catch (err) {
      setStatus(err.message, "red");
    }
  });

  // 4. THE REDIRECT LOGIC
  function checkCompletionAndRedirect(data) {
    const hasName = data.full_name && data.full_name.length > 1;
    const hasBio = data.bio && data.bio.length > 5;
    // Ensure it's not the default placeholder
    const hasAvatar = data.avatar_url && !data.avatar_url.includes("placeholder");

    if (hasName && hasBio && hasAvatar) {
      setStatus("Identity Verified. Redirecting to Arena...", "black");
      setTimeout(() => {
        window.location.href = "lobby.html";
      }, 1500);
    }
  }

</script>
</body>
</html>
