<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Profile</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.profile-container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.avatar-drop-zone {
  width: 200px;
  height: 200px;
  margin: 20px auto;
  border-radius: 50%;
  overflow: hidden;
  border: 2px dashed #ccc;
  cursor: pointer;
}

.avatar-drop-zone img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  margin-top: 15px;
  padding: 10px;
  width: 100%;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

#message {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="profile-container">

  <h2>Manage Profile</h2>

  <!-- Avatar (Click to go to Edit page) -->
  <div id="dropZone" class="avatar-drop-zone">
    <img id="avatarPreview" src="https://via.placeholder.com/400" alt="Avatar">
  </div>

  <input type="text" id="fullName" placeholder="Full Name">
  <textarea id="bio" placeholder="Bio"></textarea>

  <button id="saveProfileBtn">Save Profile</button>
  <p id="message"></p>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const dropZone = document.getElementById("dropZone");
const avatarPreview = document.getElementById("avatarPreview");
const saveBtn = document.getElementById("saveProfileBtn");
const message = document.getElementById("message");

/* --------------------------
   LOAD LAST AVATAR AND PROFILE
---------------------------*/
window.addEventListener("DOMContentLoaded", async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;

  const userId = session.user.id;

  // Load avatar URL from Supabase profile table
  const { data: profile } = await supabase
    .from("profile")
    .select("avatar_url, full_name, bio")
    .eq("id", userId)
    .single();

  if (profile) {
    if (profile.avatar_url) avatarPreview.src = profile.avatar_url;
    if (profile.full_name) document.getElementById("fullName").value = profile.full_name;
    if (profile.bio) document.getElementById("bio").value = profile.bio;
  }

  // Check if there's a temp/final avatar from edit.html
  const tempAvatar = localStorage.getItem("finalAvatar");
  if (tempAvatar) {
    avatarPreview.src = tempAvatar;
    localStorage.removeItem("finalAvatar"); // clear after use
  }
});

/* --------------------------
   CLICK AVATAR → GO TO EDIT.HTML
---------------------------*/
dropZone.addEventListener("click", () => {
  // Directly go to edit page (no file selection here)
  window.location.href = "edit.html";
});

/* --------------------------
   SAVE PROFILE
---------------------------*/
saveBtn.addEventListener("click", async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  if (!session) {
    message.textContent = "You must be logged in.";
    return;
  }

  const userId = session.user.id;
  const avatarUrl = avatarPreview.src; // final avatar URL

  try {
    const profileData = {
      id: userId,
      full_name: document.getElementById("fullName").value,
      bio: document.getElementById("bio").value,
      avatar_url: avatarUrl
    };

    const { error } = await supabase.from("profile").upsert(profileData);
    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Profile saved successfully!";

  } catch (err) {
    message.style.color = "red";
    message.textContent = err.message;
  }
});
</script>

</body>
</html>
