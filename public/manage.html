<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Upload Ingredient Avatar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 30px 25px;
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}
h2 { margin-bottom: 20px; color: #111827; }
input { width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid #ccc; }
button { width:100%; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:500; font-size:15px; background:#6366f1; color:white; }
button:hover { background:#4f46e5; }
img { width:100px; height:100px; border-radius:50%; object-fit:cover; margin-bottom:15px; display:none; }
#message { margin-top:12px; font-size:14px; min-height:20px; color: red; }
#uploadOverlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(255,255,255,0.85);
  display:flex; justify-content:center; align-items:center; flex-direction:column;
  font-family:'Inter',sans-serif; font-size:18px; color:#4f46e5; z-index:9999; display:none;
}
#uploadOverlay .spinner {
  width:40px; height:40px; border:4px solid rgba(0,0,0,0.2);
  border-top-color:#4f46e5; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:12px;
}
@keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
</style>
</head>
<body>

<div class="card">
  <h2>Upload Ingredient Avatar</h2>
  <img id="avatarPreview" />
  <input type="file" id="avatar_file" accept="image/*" />
  <button id="uploadBtn">Upload Avatar</button>
  <p id="message"></p>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Uploading your avatar...
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatarInput = document.getElementById("avatar_file");
const avatarPreview = document.getElementById("avatarPreview");
const uploadBtn = document.getElementById("uploadBtn");
const message = document.getElementById("message");
const uploadOverlay = document.getElementById("uploadOverlay");

// Preview avatar locally
avatarInput.addEventListener("change", () => {
  const file = avatarInput.files[0];
  if (file) {
    avatarPreview.src = URL.createObjectURL(file);
    avatarPreview.style.display = "block";
    message.textContent = "";
  }
});

// Upload avatar
uploadBtn.addEventListener("click", async () => {
  const file = avatarInput.files[0];
  if (!file) {
    message.textContent = "Select a file first!";
    return;
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    message.textContent = "You must be logged in.";
    return;
  }

  uploadOverlay.style.display = "flex";
  message.textContent = "";

  const userId = session.user.id;

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("userId", userId);

    const res = await fetch("/api/upload-avatar.js", {
      method: "POST",
      body: formData
    });

    // Always read as text to see raw errors
    const text = await res.text();
    if (!res.ok) throw new Error(text);

    avatarPreview.src = text;
    avatarPreview.style.display = "block";
    message.style.color = "green";
    message.textContent = "Avatar uploaded successfully!";
  } catch (err) {
    message.style.color = "red";
    message.textContent = "Failed to upload avatar: " + err.message;
  } finally {
    uploadOverlay.style.display = "none";
  }
});
</script>

</body>
  </html>
