<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 50px;
    margin: 0;
  }
  .card {
    background: white;
    padding: 30px 25px;
    width: 100%;
    max-width: 500px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }
  h2 { margin-bottom: 20px; }
  input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ccc; }
  input:focus, textarea:focus { border-color: #6366f1; outline: none; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    font-size: 15px;
    background: #6366f1;
    color: white;
  }
  button:hover { background: #4f46e5; }
  img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
  #message { margin-top: 12px; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h2>Manage Profile</h2>
  <img id="avatarPreview" src="" alt="Avatar" style="display:none;">
  <input type="text" id="full_name" placeholder="Full Name">
  <textarea id="bio" placeholder="Bio"></textarea>
  <input type="text" id="contact" placeholder="Contact">
  <input type="file" id="avatar_file" accept="image/*">
  <button id="saveBtn">Save</button>
  <p id="message"></p>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import { uploadAvatar } from "../api/avatar-upload.js";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const fullNameInput = document.getElementById("full_name");
const bioInput = document.getElementById("bio");
const contactInput = document.getElementById("contact");
const avatarInput = document.getElementById("avatar_file");
const avatarPreview = document.getElementById("avatarPreview");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");

// ==========================
// Load user profile
// ==========================
async function loadProfile() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "/login.html";
    return;
  }

  const userId = session.user.id;
  const { data: profile, error } = await supabase.from("profile").select("*").eq("id", userId).single();

  if (error && error.code !== "PGRST116") {
    message.style.color = "red";
    message.textContent = "Failed to load profile.";
    console.error(error);
    return;
  }

  if (profile) {
    fullNameInput.value = profile.full_name || "";
    bioInput.value = profile.bio || "";
    contactInput.value = profile.contact || ""; // prefill from contact column
    if (profile.avatar_url) {
      avatarPreview.src = profile.avatar_url;
      avatarPreview.style.display = "block";
    }
  }
}

// ==========================
// Preview avatar locally
// ==========================
avatarInput.addEventListener("change", () => {
  const file = avatarInput.files[0];
  if (file) {
    avatarPreview.src = URL.createObjectURL(file);
    avatarPreview.style.display = "block";
  }
});

// ==========================
// Save button
// ==========================
saveBtn.addEventListener("click", async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return;

  const userId = session.user.id;
  let newAvatarUrl = null;

  // Upload avatar if selected
  if (avatarInput.files.length > 0) {
    const file = avatarInput.files[0];
    try {
      const result = await uploadAvatar(file, userId);
      newAvatarUrl = result.url;
    } catch (err) {
      message.style.color = "red";
      message.textContent = "Failed to upload avatar.";
      console.error(err);
      return;
    }
  }

  // Update Supabase profile
  const updates = {
    full_name: fullNameInput.value || null,
    bio: bioInput.value || null,
    contact: contactInput.value || null
  };
  if (newAvatarUrl) updates.avatar_url = newAvatarUrl;

  const { error } = await supabase.from("profile").update(updates).eq("id", userId);

  if (error) {
    message.style.color = "red";
    message.textContent = "Failed to save profile.";
    console.error(error);
  } else {
    message.style.color = "green";
    message.textContent = "Profile updated successfully!";
  }
});

// Load profile on page load
loadProfile();
</script>
</body>
  </html>
