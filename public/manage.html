<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Profile</title>

<!-- Cropper CSS -->
<link href="https://unpkg.com/cropperjs/dist/cropper.css" rel="stylesheet"/>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.profile-container {
  max-width: 420px;
  margin: 40px auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.avatar-drop-zone {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 20px auto;
  border-radius: 50%;
  overflow: hidden;
  border: 2px dashed #ccc;
  cursor: pointer;
}

.avatar-drop-zone.dragover {
  border-color: #007bff;
}

.avatar-drop-zone img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.5);
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #fff;
  border-top: 4px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.controls button {
  margin: 5px;
  padding: 8px 12px;
  cursor: pointer;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button#saveProfileBtn {
  margin-top: 15px;
  padding: 10px;
  width: 100%;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button#saveProfileBtn:hover {
  background: #0056b3;
}

#message {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="profile-container">

  <h2>Manage Profile</h2>

  <!-- Avatar -->
  <div id="dropZone" class="avatar-drop-zone">
    <img id="avatarPreview" src="https://via.placeholder.com/400" alt="Avatar Preview">
    <div id="uploadOverlay" class="overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <input type="file" id="avatar_file" accept="image/*" hidden>

  <div class="controls">
    <button type="button" id="rotateLeft">Rotate Left</button>
    <button type="button" id="rotateRight">Rotate Right</button>
  </div>

  <!-- Hidden Avatar Fields -->
  <input type="hidden" id="avatarUrl">
  <input type="hidden" id="avatarId">

  <!-- Profile Fields -->
  <input type="text" id="fullName" placeholder="Full Name">
  <textarea id="bio" placeholder="Bio"></textarea>

  <button id="saveProfileBtn">Save Profile</button>

  <p id="message"></p>

</div>

<!-- Cropper JS -->
<script src="https://unpkg.com/cropperjs/dist/cropper.js"></script>

<!-- Your Exact Script (Unchanged Logic) -->
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("avatar_file");
const avatarPreview = document.getElementById("avatarPreview");
const saveBtn = document.getElementById("saveProfileBtn");
const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const message = document.getElementById("message");
const overlay = document.getElementById("uploadOverlay");

let cropper;
let croppedBlob = null;
let editMode = false;

async function resizeImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxSize = 1200;

      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {
        height *= maxSize / width;
        width = maxSize;
      } else if (height > maxSize) {
        width *= maxSize / height;
        height = maxSize;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.9);
    };

    reader.readAsDataURL(file);
  });
}

async function loadImage(file) {
  if (!file) return;

  overlay.style.display = "flex";
  const processedFile = await resizeImage(file);

  const reader = new FileReader();
  reader.onload = () => {
    avatarPreview.src = reader.result;

    avatarPreview.onload = () => {
      overlay.style.display = "none";
      if (cropper) cropper.destroy();

      cropper = new Cropper(avatarPreview, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
      });

      editMode = true;
    };
  };

  reader.readAsDataURL(processedFile);
}

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  loadImage(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  loadImage(fileInput.files[0]);
});

rotateLeft.onclick = () => cropper?.rotate(-90);
rotateRight.onclick = () => cropper?.rotate(90);

saveBtn.addEventListener("click", async () => {
  const { data:{session} } = await supabase.auth.getSession();
  if (!session) {
    message.textContent = "You must be logged in.";
    return;
  }

  overlay.style.display = "flex";
  const userId = session.user.id;

  try {
    if (cropper && editMode) {
      const canvas = cropper.getCroppedCanvas({ width:400, height:400 });

      croppedBlob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/jpeg", 0.9)
      );

      const formData = new FormData();
      formData.append("file", croppedBlob);
      formData.append("userId", userId);

      const res = await fetch("/api/upload-avatar.js", {
        method: "POST",
        body: formData
      });

      const avatarUrl = await res.text();
      if (!res.ok) throw new Error(avatarUrl);

      document.getElementById("avatarUrl").value = avatarUrl;
      document.getElementById("avatarId").value = `avatar_${userId}`;

      editMode = false;
    }

    const profileData = {
      id: userId,
      full_name: document.getElementById("fullName").value,
      bio: document.getElementById("bio").value,
      avatar_url: document.getElementById("avatarUrl").value,
      avatar_public_id: document.getElementById("avatarId").value
    };

    const { error } = await supabase.from("profile").upsert(profileData);
    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Profile saved successfully!";

  } catch (err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>

</body>
  </html>
