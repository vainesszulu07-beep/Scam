<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/cropperjs/dist/cropper.css" rel="stylesheet"/>
<script src="https://unpkg.com/cropperjs/dist/cropper.js"></script>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: white;
  padding: 30px 25px;
  width: 100%;
  max-width: 420px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}

h2 { margin-bottom: 20px; color: #111827; }

.drop-zone {
  border: 2px dashed #6366f1;
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  margin-bottom: 15px;
  transition: 0.2s;
}

.drop-zone.dragover {
  background: #eef2ff;
}

input[type="file"] { display: none; }

img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 15px;
  background: #e5e7eb;
}

input, textarea {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:500;
  font-size:15px;
  background:#6366f1;
  color:white;
}

button:hover { background:#4f46e5; }

.rotate-btn {
  background:#e5e7eb;
  color:#111;
  margin-bottom:8px;
}

#message { margin-top:12px; font-size:14px; min-height:20px; }

#uploadOverlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(255,255,255,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:18px;
  color:#4f46e5;
  z-index:9999;
  display:none;
}

.spinner {
  width:40px;
  height:40px;
  border:4px solid rgba(0,0,0,0.2);
  border-top-color:#4f46e5;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:12px;
}

@keyframes spin {
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="card">
  <h2>Manage Profile</h2>

  <img id="avatarPreview" />

  <div class="drop-zone" id="dropZone">
    Drag & Drop or Click to Upload Avatar
  </div>

  <input type="file" id="avatar_file" accept="image/*" />

  <button class="rotate-btn" type="button" id="rotateLeft">Rotate Left</button>
  <button class="rotate-btn" type="button" id="rotateRight">Rotate Right</button>

  <input type="text" id="fullName" placeholder="Full Name" />
  <textarea id="bio" placeholder="Bio"></textarea>

  <input type="text" id="avatarUrl" hidden />
  <input type="text" id="avatarId" hidden />

  <button id="saveProfileBtn">Save Profile</button>

  <p id="message"></p>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Processing...
</div>


<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("avatar_file");
const avatarPreview = document.getElementById("avatarPreview");
const saveBtn = document.getElementById("saveProfileBtn");
const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const message = document.getElementById("message");
const overlay = document.getElementById("uploadOverlay");

let cropper;
let croppedBlob = null;
let editMode = false;

/* --------------------------
   IMAGE LOADING + RESIZING
---------------------------*/

async function resizeImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => {
      img.src = reader.result;
    };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxSize = 1200; // Prevent huge image freeze

      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {
        height *= maxSize / width;
        width = maxSize;
      } else if (height > maxSize) {
        width *= maxSize / height;
        height = maxSize;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.9);
    };

    reader.readAsDataURL(file);
  });
}

/* --------------------------
   LOAD IMAGE INTO CROPPER
---------------------------*/

async function loadImage(file) {
  if (!file) return;

  overlay.style.display = "flex";

  const processedFile = await resizeImage(file);

  const reader = new FileReader();
  reader.onload = () => {
    avatarPreview.src = reader.result;

    avatarPreview.onload = () => {
      overlay.style.display = "none";

      if (cropper) cropper.destroy();

      cropper = new Cropper(avatarPreview, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
      });

      editMode = true;
    };
  };

  reader.readAsDataURL(processedFile);
}

/* --------------------------
   DRAG & DROP
---------------------------*/

dropZone.addEventListener("click", () => fileInput.click());

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  loadImage(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", () => {
  loadImage(fileInput.files[0]);
});

/* --------------------------
   ROTATION
---------------------------*/

rotateLeft.onclick = () => cropper?.rotate(-90);
rotateRight.onclick = () => cropper?.rotate(90);

/* --------------------------
   SAVE PROFILE (UNCHANGED LOGIC)
---------------------------*/

saveBtn.addEventListener("click", async () => {
  const { data:{session} } = await supabase.auth.getSession();
  if (!session) {
    message.textContent = "You must be logged in.";
    return;
  }

  overlay.style.display = "flex";
  const userId = session.user.id;

  try {

    if (cropper && editMode) {
      const canvas = cropper.getCroppedCanvas({ width:400, height:400 });

      croppedBlob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/jpeg", 0.9)
      );

      const formData = new FormData();
      formData.append("file", croppedBlob);
      formData.append("userId", userId);

      const res = await fetch("/api/upload-avatar.js", {
        method: "POST",
        body: formData
      });

      const avatarUrl = await res.text();
      if (!res.ok) throw new Error(avatarUrl);

      document.getElementById("avatarUrl").value = avatarUrl;
      document.getElementById("avatarId").value = `avatar_${userId}`;

      editMode = false;
    }

    const profileData = {
      id: userId,
      full_name: document.getElementById("fullName").value,
      bio: document.getElementById("bio").value,
      avatar_url: document.getElementById("avatarUrl").value,
      avatar_public_id: document.getElementById("avatarId").value
    };

    const { error } = await supabase.from("profile").upsert(profileData);
    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Profile saved successfully!";

  } catch (err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>
</body>
  </html>
