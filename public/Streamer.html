<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Minimal</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; margin-top: 10px; }
  button { padding: 10px 16px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<h2>Streamer Minimal</h2>
<button id="startBtn">Start / Update Stream</button>
<div id="msg">Press button to start/update your stream...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// --- Supabase client (frontend publishable key) ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('msg');
const startBtn = document.getElementById('startBtn');
let userId = null;

// --- Get current logged-in user ---
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    msgEl.textContent = "Login required";
    return false;
  }
  userId = session.user.id;
  return true;
}

// --- Start / Update stream ---
async function startStream() {
  if (!userId) {
    msgEl.textContent = "Fetching user session...";
    const ok = await getUser();
    if (!ok) return;
  }

  try {
    const res = await fetch('/api/start-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });

    let data;
    try { 
      data = await res.json(); 
    } catch(e) {
      const text = await res.text();
      msgEl.textContent = "Non-JSON response:\n" + text;
      return;
    }

    if (data.success) {
      msgEl.textContent = "Success:\n" + JSON.stringify(data, null, 2);
    } else {
      msgEl.textContent = "Error:\n" + JSON.stringify(data.error, null, 2);
    }
  } catch(err) {
    msgEl.textContent = "Network / JS error:\n" + err.message;
  }
}

startBtn.onclick = startStream;

// --- Initialize ---
getUser();
</script>

</body>
</html>
