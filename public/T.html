<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Tournament Test</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }
    .status {
      margin: 12px 0;
      padding: 12px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      white-space: pre-wrap;
      word-break: break-word;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>get_active_tournament Test</h1>
    <button id="runBtn">Call RPC</button>

    <div class="status">
      <strong>Status:</strong>
      <div id="statusText">Idle</div>
    </div>

    <div class="status">
      <strong>Raw data:</strong>
      <pre id="rawData">—</pre>
    </div>

    <div class="status">
      <strong>Error:</strong>
      <pre id="errorText">—</pre>
    </div>

    <div class="status">
      <strong>Parsed result:</strong>
      <pre id="parsedText">—</pre>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const runBtn = document.getElementById("runBtn");
    const statusText = document.getElementById("statusText");
    const rawData = document.getElementById("rawData");
    const errorText = document.getElementById("errorText");
    const parsedText = document.getElementById("parsedText");

    function safeParse(value) {
      if (typeof value === "string") {
        try {
          return JSON.parse(value);
        } catch {
          return { parse_error: "Could not parse JSON string", value };
        }
      }
      return value;
    }

    function goToGame(fileType, matchId) {
      const safeFileType = String(fileType || "").trim().replace(/\s+/g, "").replace(/_tournament$/i, "");
      window.location.href = `/games/${safeFileType}.html?match_id=${matchId}`;
    }

    async function checkActiveGame() {
      statusText.textContent = "Calling get_active_tournament()...";
      rawData.textContent = "—";
      errorText.textContent = "—";
      parsedText.textContent = "—";

      const { data, error } = await supabase.rpc("get_active_tournament");

      console.log("RPC response:", { data, error });

      if (error) {
        statusText.textContent = "RPC returned an error";
        errorText.textContent = JSON.stringify(error, null, 2);
        return;
      }

      rawData.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);

      const res = safeParse(data);
      parsedText.textContent = JSON.stringify(res, null, 2);

      if (res?.status === "active_match_found") {
        statusText.textContent = "Match found, redirecting...";
        goToGame(res.file_type, res.match_id);
        return;
      }

      if (res?.status === "waiting_for_opponent") {
        statusText.textContent = "Waiting for opponent";
        return;
      }

      if (res?.status === "none") {
        statusText.textContent = "No active match found";
        return;
      }

      statusText.textContent = "Finished with response";
    }

    runBtn.addEventListener("click", checkActiveGame);

    checkActiveGame();
  </script>
</body>
      </html>
