<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Edge Function Debugger</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      line-height: 1.6;
    }

    .box {
      border: 1px solid #333;
      padding: 15px;
      margin-top: 10px;
      background: #000;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .hidden {
      display: none;
    }

    .locked {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(1);
    }

    .status-item {
      margin: 5px 0;
      padding: 5px;
      border-radius: 4px;
    }

    .pass {
      color: #00ff00;
    }

    .fail {
      color: #ff4444;
      border: 1px solid #ff4444;
    }

    input {
      background: #222;
      border: 1px solid #444;
      color: #00ff00;
      padding: 10px;
      width: 350px;
      outline: none;
      margin: 6px 0;
      display: block;
    }

    button {
      padding: 10px 25px;
      cursor: pointer;
      background: #00ff00;
      border: none;
      font-weight: bold;
      color: #000;
      transition: 0.3s;
      margin-top: 8px;
      margin-right: 8px;
    }

    button:hover {
      background: #00cc00;
      transform: scale(1.03);
    }

    h3 {
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-top: 30px;
    }

    .section {
      border: 1px solid #222;
      padding: 15px;
      margin-top: 12px;
      background: #101010;
    }

    .label {
      display: block;
      margin-top: 10px;
      color: #7dff7d;
    }

    .small {
      color: #9a9a9a;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Chess Logic Debugger</h2>

  <div id="checklist">
    <div id="check-config" class="status-item">⌛ Checking Configuration...</div>
    <div id="check-auth" class="status-item">⌛ Checking Authentication...</div>
  </div>

  <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;" />

  <div id="mainUI" class="locked">
    <div class="section">
      <label class="label">Game ID</label>
      <input type="text" id="gameId" placeholder="Paste UUID here..." />
      <button id="initBtn">Initialize Chess Board</button>
    </div>

    <div id="afterInitUI" class="section hidden">
      <div class="label">Initialized Game UUID</div>
      <div id="gameUuidDisplay" class="box" style="margin-top: 6px;">-</div>

      <div class="label">Move From Index</div>
      <input type="number" id="fromIndex" placeholder="Example: 52" />

      <div class="label">Move To Index</div>
      <input type="number" id="toIndex" placeholder="Example: 36" />

      <div class="label">Promotion (optional)</div>
      <input type="text" id="promotion" value="q" maxlength="1" />

      <button id="moveBtn">Make Move (quick-responder)</button>
    </div>
  </div>

  <h3>Output Log:</h3>
  <div id="output" class="box">System initializing...</div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co";
    const ANON_KEY = "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou";

    // Change this if your init function has a different name
    const INIT_EDGE_URL = `${SUPABASE_URL}/functions/v1/clever-processor`;
    const MOVE_EDGE_URL = `${SUPABASE_URL}/functions/v1/quick-responder`;

    const supabase = createClient(SUPABASE_URL, ANON_KEY);

    const mainUI = document.getElementById("mainUI");
    const output = document.getElementById("output");
    const checkConfig = document.getElementById("check-config");
    const checkAuth = document.getElementById("check-auth");
    const afterInitUI = document.getElementById("afterInitUI");
    const gameUuidDisplay = document.getElementById("gameUuidDisplay");

    const gameIdInput = document.getElementById("gameId");
    const fromIndexInput = document.getElementById("fromIndex");
    const toIndexInput = document.getElementById("toIndex");
    const promotionInput = document.getElementById("promotion");

    let currentGameId = "";

    async function runPreCheck() {
      let configReady = false;
      let authReady = false;

      if (SUPABASE_URL && ANON_KEY && !ANON_KEY.includes("your-")) {
        checkConfig.innerHTML = "✔ Config: Loaded Successfully";
        checkConfig.className = "status-item pass";
        configReady = true;
      } else {
        checkConfig.innerHTML = "✘ Config: Missing URL or Anon Key!";
        checkConfig.className = "status-item fail";
      }

      const { data: { session } } = await supabase.auth.getSession();

      if (session) {
        checkAuth.innerHTML = `✔ Auth: Logged in as ${session.user.email}`;
        checkAuth.className = "status-item pass";
        authReady = true;
      } else {
        checkAuth.innerHTML = "✘ Auth: No active session. Please log in to your app first.";
        checkAuth.className = "status-item fail";
        output.textContent = "Error: Authentication required. Open your main application, log in, then refresh this page.";
      }

      if (configReady && authReady) {
        mainUI.classList.remove("locked");
        output.textContent = "All systems green. Ready for input.";
      }
    }

    async function getSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error("No active session found");
      return session;
    }

    async function callEdgeFunction(url, body) {
      const session = await getSession();

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
          "apikey": ANON_KEY
        },
        body: JSON.stringify(body),
      });

      const result = await response.json().catch(() => ({}));
      return { response, result };
    }

    document.getElementById("initBtn").onclick = async () => {
      const gameId = gameIdInput.value.trim();

      if (!gameId) {
        output.textContent = "Wait! You forgot to enter the Game ID.";
        return;
      }

      output.textContent = "Initializing board...";
      try {
        const { response, result } = await callEdgeFunction(INIT_EDGE_URL, {
          gameId,
          startTurn: "w"
        });

        if (!response.ok) {
          output.className = "box fail";
          output.textContent = `HTTP ERROR ${response.status}\n${JSON.stringify(result, null, 2)}`;
          return;
        }

        currentGameId = gameId;
        gameUuidDisplay.textContent = gameId;
        afterInitUI.classList.remove("hidden");
        output.className = "box";
        output.textContent = `Board initialized successfully.\n${JSON.stringify(result, null, 2)}`;

      } catch (err) {
        output.className = "box fail";
        output.textContent = `CRASH: ${err.message}`;
      }
    };

    document.getElementById("moveBtn").onclick = async () => {
      const fromIndex = fromIndexInput.value.trim();
      const toIndex = toIndexInput.value.trim();
      const promotion = promotionInput.value.trim() || "q";

      if (!currentGameId) {
        output.textContent = "No game has been initialized yet.";
        return;
      }

      if (fromIndex === "" || toIndex === "") {
        output.textContent = "Enter both fromIndex and toIndex.";
        return;
      }

      output.textContent = "Sending move to quick-responder...";

      try {
        const { response, result } = await callEdgeFunction(MOVE_EDGE_URL, {
          gameId: currentGameId,
          fromIndex: Number(fromIndex),
          toIndex: Number(toIndex),
          promotion
        });

        if (!response.ok) {
          output.className = "box fail";
          output.textContent = `HTTP ERROR ${response.status}\n${JSON.stringify(result, null, 2)}`;
        } else {
          output.className = "box";
          output.textContent = `SUCCESS!\n${JSON.stringify(result, null, 2)}`;
        }
      } catch (err) {
        output.className = "box fail";
        output.textContent = `CRASH: ${err.message}`;
      }
    };

    runPreCheck();
  </script>
</body>
</html>
