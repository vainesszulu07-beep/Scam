<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge Function Debugger</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; }
        .box { border: 1px solid #333; padding: 15px; margin-top: 10px; background: #000; overflow-x: auto; }
        button { padding: 10px 20px; cursor: pointer; background: #00ff00; border: none; font-weight: bold; }
        .error { color: #ff4444; }
    </style>
</head>
<body>

    <h2>Chess Logic Debugger</h2>
    <input type="text" id="gameId" placeholder="Enter Game UUID">
    <button id="startBtn">Trigger action: "start"</button>

    <h3>Raw Response/Error:</h3>
    <div id="output" class="box">Waiting for action...</div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient(
            "https://eimecuiixwgmpfpedxpr.supabase.co",
            "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
        );

        const EDGE_URL = "https://eimecuiixwgmpfpedxpr.supabase.co/functions/v1/clever-processor";

        document.getElementById('startBtn').onclick = async () => {
            const gameId = document.getElementById('gameId').value;
            const output = document.getElementById('output');
            
            output.textContent = "Processing...";
            output.className = "box";

            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) throw new Error("Please log in first!");

                const response = await fetch(EDGE_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify({ 
                        gameId: gameId, 
                        action: "start" 
                    })
                });

                // Get the raw text first to avoid JSON.parse errors
                const rawText = await response.text();
                let result;
                
                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    result = rawText; // Fallback if it's not JSON
                }

                if (!response.ok) {
                    output.className = "box error";
                    output.textContent = "HTTP STATUS " + response.status + "\n\n" + JSON.stringify(result, null, 2);
                } else {
                    output.textContent = "SUCCESS:\n" + JSON.stringify(result, null, 2);
                }

            } catch (err) {
                output.className = "box error";
                output.textContent = "CLIENT SIDE ERROR:\n" + err.stack;
            }
        };
    </script>
</body>
</html>
