<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>File Type Test</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      margin-top: 0;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #10b981;
      word-break: break-word;
    }

    #status {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tournament Redirect Test</h2>
    <div id="result">Loading...</div>
    <div id="status"></div>
    <button onclick="testFunction()">Run Again</button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    async function testFunction() {
      document.getElementById("result").innerText = "Loading...";
      document.getElementById("status").innerText = "";

      const { data, error } = await supabase.rpc("get_active_tournament_redirect");

      console.log("RAW RESPONSE:", data, error);

      if (error) {
        document.getElementById("result").innerText = "ERROR";
        document.getElementById("status").innerText = error.message;
        return;
      }

      const res = typeof data === "string" ? JSON.parse(data) : data;

      console.log("PARSED:", res);

      document.getElementById("status").innerText = "Status: " + res.status;

      if (res.file_type) {
        document.getElementById("result").innerText = res.file_type;
      } else {
        document.getElementById("result").innerText = "No file_type returned";
      }
    }

    window.testFunction = testFunction;
    testFunction();
  </script>
</body>
</html>
