<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Active Tournament Redirect Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 24px;
    }

    .box {
      margin-top: 14px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #3b82f6;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tournament Redirect Test</h1>
    <button id="runBtn">Check Active Tournament</button>

    <div class="box"><strong>Status</strong><div id="statusText">Idle</div></div>
    <div class="box"><strong>Error</strong><div id="errorText">—</div></div>
    <div class="box"><strong>Raw Data</strong><pre id="rawText">—</pre></div>
    <div class="box"><strong>Parsed</strong><pre id="parsedText">—</pre></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const runBtn = document.getElementById("runBtn");
    const statusText = document.getElementById("statusText");
    const errorText = document.getElementById("errorText");
    const rawText = document.getElementById("rawText");
    const parsedText = document.getElementById("parsedText");

    function safeParse(value) {
      if (typeof value !== "string") return value;
      try {
        return JSON.parse(value);
      } catch {
        return { parse_error: "Could not parse JSON", value };
      }
    }

    function goToGame(fileType, matchId) {
      const safeFileType = String(fileType || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/_tournament$/i, "");

      window.location.href = `/games/${safeFileType}.html?match_id=${matchId}`;
    }

    async function checkTournament() {
      statusText.textContent = "Calling get_active_tournament()...";
      errorText.textContent = "—";
      rawText.textContent = "—";
      parsedText.textContent = "—";

      const { data, error } = await supabase.rpc("get_active_tournament");

      console.log("RPC result:", { data, error });

      if (error) {
        statusText.textContent = "RPC error";
        errorText.textContent = JSON.stringify(error, null, 2);
        return;
      }

      rawText.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);

      const res = safeParse(data);
      parsedText.textContent = JSON.stringify(res, null, 2);

      if (res?.match_id && res?.file_type) {
        statusText.textContent = "Redirecting to game...";
        goToGame(res.file_type, res.match_id);
        return;
      }

      if (res?.status === "waiting_for_opponent") {
        statusText.textContent = "Waiting for opponent...";
        return;
      }

      if (res?.status === "none") {
        statusText.textContent = "No active tournament match found";
        return;
      }

      statusText.textContent = "Finished";
    }

    runBtn.addEventListener("click", checkTournament);
    checkTournament();
  </script>
</body>
</html>
