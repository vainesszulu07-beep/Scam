<!DOCTYPE html>    
<html lang="en">    
<head>    
  <meta charset="UTF-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    
  <title>Tournament Lobby | PlayArena</title>    
  <style>    
    :root {    
      --bg: #0f172a;    
      --card-bg: #1e293b;    
      --card-hover: #334155;    
      --primary: #3b82f6;    
      --success: #10b981;    
      --warning: #f59e0b;    
      --text-main: #f8fafc;    
      --text-muted: #94a3b8;    
      --border: #334155;    
      --radius: 20px;    
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;    
    }    
    
    body {    
      margin: 0;    
      font-family: var(--font);    
      background-color: var(--bg);    
      color: var(--text-main);    
      min-height: 100vh;    
      display: flex;    
      flex-direction: column;    
      overflow-x: hidden;    
    }    
    
    /* Navbar & Status Banner */    
    .navbar {    
      background: rgba(15, 23, 42, 0.9);    
      backdrop-filter: blur(12px);    
      border-bottom: 1px solid var(--border);    
      padding: 16px 24px;    
      display: flex;    
      justify-content: space-between;    
      align-items: center;    
      position: sticky;    
      top: 0;    
      z-index: 50;    
    }    
    
    .brand {    
      font-size: 22px;    
      font-weight: 800;    
      background: linear-gradient(to right, #3b82f6, #8b5cf6);    
      -webkit-background-clip: text;    
      -webkit-text-fill-color: transparent;    
    }    
    
    .wallet-pill {    
      background: var(--card-bg);    
      border: 1px solid var(--border);    
      padding: 8px 16px;    
      border-radius: 99px;    
      font-weight: 700;    
      font-size: 14px;    
    }    
    .wallet-pill span { color: var(--success); }    
    
    #waitingBanner {    
      background: var(--warning);    
      color: #000;    
      text-align: center;    
      padding: 10px;    
      font-weight: 700;    
      font-size: 14px;    
      display: none;    
      animation: pulse 2s infinite;    
    }    
    @keyframes pulse {    
      0%, 100% { opacity: 1; }    
      50% { opacity: 0.8; }    
    }    
    
    /* Main Container (YouTube Style Feed) */    
    .container {    
      max-width: 800px;    
      margin: 0 auto;    
      padding: 24px 16px;    
      width: 100%;    
      box-sizing: border-box;    
      display: flex;    
      flex-direction: column;    
      gap: 24px;    
    }    
    
    /* Big Template Cards */    
    .game-card-large {    
      position: relative;    
      width: 100%;    
      aspect-ratio: 16 / 9;    
      border-radius: var(--radius);    
      overflow: hidden;    
      cursor: pointer;    
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);    
      transition: transform 0.2s ease, box-shadow 0.2s ease;    
      background-color: var(--card-bg);    
    }    
        
    .game-card-large:hover {    
      transform: translateY(-4px);    
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);    
    }    
    
    .game-card-image {    
      width: 100%;    
      height: 100%;    
      object-fit: cover;    
      transition: transform 0.5s ease;    
    }    
    
    .game-card-large:hover .game-card-image {    
      transform: scale(1.05);    
    }    
    
    .game-card-overlay {    
      position: absolute;    
      inset: 0;    
      background: linear-gradient(to top, rgba(15,23,42,1) 0%, rgba(15,23,42,0.6) 40%, transparent 100%);    
      display: flex;    
      flex-direction: column;    
      justify-content: flex-end;    
      padding: 24px;    
    }    
    
    .game-card-title { font-size: 28px; font-weight: 800; margin-bottom: 4px; }    
    .game-card-subtitle { font-size: 14px; color: var(--text-muted); font-weight: 600; }    
    
    /* Bottom Sheet (Drawer) */    
    .sheet-backdrop {    
      position: fixed;    
      inset: 0;    
      background: rgba(0, 0, 0, 0.6);    
      backdrop-filter: blur(2px);    
      z-index: 100;    
      opacity: 0;    
      pointer-events: none;    
      transition: opacity 0.3s ease;    
    }    
    .sheet-backdrop.open {    
      opacity: 1;    
      pointer-events: auto;    
    }    
    
    .bottom-sheet {    
      position: fixed;    
      bottom: 0;    
      left: 0;    
      right: 0;    
      background: var(--card-bg);    
      border-radius: 30px 30px 0 0;    
      padding: 24px 24px 40px 24px;    
      z-index: 101;    
      transform: translateY(100%);    
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);    
      max-height: 85vh;    
      overflow-y: auto;    
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);    
    }    
    .bottom-sheet.open {    
      transform: translateY(0);    
    }    
    
    .sheet-handle {    
      width: 40px;    
      height: 5px;    
      background: var(--border);    
      border-radius: 10px;    
      margin: 0 auto 20px auto;    
    }    
    
    .sheet-header {    
      display: flex;    
      justify-content: space-between;    
      align-items: center;    
      margin-bottom: 24px;    
    }    
    
    .lobbies-list {    
      display: flex;    
      flex-direction: column;    
      gap: 16px;    
    }    
    
    .lobby-row {    
      background: var(--bg);    
      border: 1px solid var(--border);    
      border-radius: 16px;    
      padding: 16px;    
      display: flex;    
      justify-content: space-between;    
      align-items: center;    
    }    
    
    /* Buttons */    
    .btn {    
      padding: 12px 20px;    
      border-radius: 12px;    
      font-weight: 700;    
      border: none;    
      cursor: pointer;    
      transition: 0.2s;    
      font-family: inherit;    
    }    
    .btn-primary { background: var(--primary); color: white; }    
    .btn-primary:hover { background: #2563eb; }    
    .btn-success { background: var(--success); color: white; }    
    .btn-success:hover { background: #059669; }    
    .btn-disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }    
    
    #syncOverlay {    
      position: fixed; inset: 0; background: var(--bg); z-index: 999;    
      display: flex; align-items: center; justify-content: center;    
      font-size: 20px; font-weight: bold; color: var(--text-muted);    
    }    
    .hidden { display: none !important; }    
  </style>    
</head>    
<body>    
    
  <div id="syncOverlay">Connecting to PlayArena...</div>    
  <div id="waitingBanner">Waiting for opponent to join... Do not close this page.</div>    
    
  <nav class="navbar">    
    <div class="brand">PlayArena</div>    
    <div class="wallet-pill">    
      $<span id="userBalance">0.00</span>    
    </div>    
  </nav>    
    
  <div class="container" id="templatesContainer">    
  </div>    
    
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeDrawer()"></div>    
  <div class="bottom-sheet" id="bottomSheet">    
    <div class="sheet-handle"></div>    
    <div class="sheet-header">    
      <h2 style="margin: 0;" id="drawerTitle">Available Lobbies</h2>    
      <button class="btn btn-primary" onclick="openCreateModal()">+ Create</button>    
    </div>    
    <div class="lobbies-list" id="lobbiesContainer">    
    </div>    
  </div>    
    
  <script type="module">    
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";    
    
    const supabase = createClient("https://eimecuiixwgmpfpedxpr.supabase.co", "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou");    
    
    let currentUserId = null;    
    let activeTemplateId = null;    
    let activePolling = null;    
    
    async function init() {    
      const { data: { user } } = await supabase.auth.getUser();    
      if (!user) { window.location.href = "/login.html"; return; }    
      currentUserId = user.id;    
          
      // Perform initial check    
      await checkActiveGame();    
          
      document.getElementById('syncOverlay').classList.add('hidden');    
      refreshBalance();    
      loadTemplates();    
    }    
    
    // --- GAME SYNC & POLLING LOGIC ---    
    
    async function checkActiveGame() {    
      const { data, error } = await supabase.rpc('get_active_tournament');    
      if (error) return;    
    
      const res = typeof data === 'string' ? JSON.parse(data) : data;    
    
      if (res.status === 'active_match_found') {    
        // Opponent found! Go to game immediately.    
        window.location.href = `/games/${res.file_type}.html?match_id=${res.match_id}`;    
        return;    
      }     
      else if (res.status === 'waiting_for_opponent') {    
        // User is queued. Show banner and start polling.    
        document.getElementById('waitingBanner').style.display = 'block';    
        if (!activePolling) {    
          activePolling = setInterval(checkActiveGame, 3000); // Check every 3 secs    
        }    
      }     
      else {    
        // No match. Clear banner and stop polling if active.    
        document.getElementById('waitingBanner').style.display = 'none';    
        if (activePolling) {    
          clearInterval(activePolling);    
          activePolling = null;    
        }    
      }    
    }    
    
    // --- YOUTUBE FEED LOGIC ---    
    
    // A helper to assign cool images if you don't have an image_url column yet    
    function getGameImage(name) {    
      const lower = name.toLowerCase();    
      if(lower.includes('chess')) return 'https://images.unsplash.com/photo-1529699211952-734e80c4d42b?auto=format&fit=crop&w=800&q=80';    
      if(lower.includes('checker')) return 'https://images.unsplash.com/photo-1610630877607-88eb7e31d361?auto=format&fit=crop&w=800&q=80';    
      if(lower.includes('tic')) return 'https://images.unsplash.com/photo-1660551772352-0855c10256ea?auto=format&fit=crop&w=800&q=80';    
      return 'https://images.unsplash.com/photo-1611996575749-79a3a250f5b1?auto=format&fit=crop&w=800&q=80'; // Default abstract board    
    }    
    
    async function loadTemplates() {    
      const { data } = await supabase.rpc('list_tournament_templates');    
      const container = document.getElementById('templatesContainer');    
          
      container.innerHTML = (data || []).map(t => {    
        // Use t.image_url if you add it to the database, otherwise use the helper    
        const imgUrl = t.image_url || getGameImage(t.name);    
        return `    
        <div class="game-card-large" onclick="openDrawer('${t.id}', '${t.name}')">    
          <img src="${imgUrl}" class="game-card-image" alt="${t.name}">    
          <div class="game-card-overlay">    
            <div class="game-card-title">${t.name}</div>    
            <div class="game-card-subtitle">Rake: ${t.rake || 0}% • Tap to view lobbies</div>    
          </div>    
        </div>    
      `}).join('');    
    }    
    
    // --- DRAWER & LOBBY LOGIC ---    
    
    window.openDrawer = function(id, name) {    
      activeTemplateId = id;    
      document.getElementById('drawerTitle').innerText = name;    
      document.getElementById('sheetBackdrop').classList.add('open');    
      document.getElementById('bottomSheet').classList.add('open');    
      document.body.style.overflow = 'hidden'; // Prevent background scroll    
      loadLobbies(id);    
    };    
    
    window.closeDrawer = function() {    
      document.getElementById('sheetBackdrop').classList.remove('open');    
      document.getElementById('bottomSheet').classList.remove('open');    
      document.body.style.overflow = 'auto';    
    };    
    
    async function loadLobbies(templateId) {    
      const container = document.getElementById('lobbiesContainer');    
      container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Fetching lobbies...</div>';    
          
      const { data: rooms, error } = await supabase.rpc('list_available_tournaments', { p_template_id: templateId });    
          
      if (error || !rooms || rooms.length === 0) {    
        container.innerHTML = '<div style="text-align:center; padding:30px; background:var(--bg); border-radius:16px; color:var(--text-muted);">No open lobbies. Be the first to create one!</div>';    
        return;    
      }    
    
      container.innerHTML = rooms.map(room => {    
        const isJoined = room.user_id === currentUserId || room.already_joined === true;    
        return `    
          <div class="lobby-row">    
            <div>    
              <div style="font-size: 20px; font-weight: 800; color: var(--success);">$${Number(room.prize_pool).toFixed(2)} Prize</div>    
              <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Entry: $${Number(room.entry_fee).toFixed(2)} • ${room.max_players} Max Players</div>    
            </div>    
            ${isJoined     
              ? `<button class="btn btn-disabled">Joined</button>`    
              : `<button class="btn btn-success" onclick="joinTournament('${room.id}')">Join</button>`    
            }    
          </div>    
        `;    
      }).join('');    
    }    
    
    // --- ACTION LOGIC ---    
    
    window.joinTournament = async function(tournamentId) {    
      if (!confirm("Pay entry fee and join tournament?")) return;    
    
      const { data, error } = await supabase.rpc('join_tournament', { p_tournament_id: tournamentId });    
    
      if (error) {    
        alert(error.message);    
        return;    
      }    
    
      const res = typeof data === 'string' ? JSON.parse(data) : data;    
    
      closeDrawer();    
      refreshBalance();    
    
      if (res && res.state === 'starting') {    
        window.location.href = `/games/${res.file_type}.html?match_id=${res.match_id}`;    
        return;    
      }    
    
      // Immediately check the game state.     
      // If it returns 'starting', it will redirect.    
      // If it returns 'waiting', it will trigger the polling banner.    
      await checkActiveGame();    
    };    
    
    async function refreshBalance() {    
      const { data } = await supabase.from('profile').select('money').eq('id', currentUserId).single();    
      if (data) document.getElementById('userBalance').innerText = Number(data.money).toFixed(2);    
    }    
    
    init();    
  </script>    
</body>    
</html>
