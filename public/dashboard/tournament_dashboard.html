<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Templates Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

  <style>
    :root {
      --bg: #f3f6fb;
      --card: rgba(255, 255, 255, 0.9);
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe3ee;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --dark: #111827;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 25%),
        var(--bg);
      min-height: 100vh;
      padding: 28px 16px 40px;
    }

    .shell { max-width: 1180px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .title-block h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.10);
      color: var(--primary);
      border: 1px solid rgba(37, 99, 235, 0.18);
      font-weight: 700;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(219, 227, 238, 0.9);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .admin-status {
      margin: 10px 0 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 14px;
      white-space: pre-line;
      color: var(--text);
      min-height: 46px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .input-grid { grid-template-columns: 1fr; }
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      margin-bottom: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: monospace;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(37, 99, 235, 0.6);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    input[type="file"] {
      padding: 11px;
      background: #fff;
    }

    button {
      padding: 10px 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin: 4px 4px 4px 0;
      font-weight: 700;
      transition: transform 0.06s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:active { transform: translateY(1px); }

    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-hover); }

    .danger { background: var(--danger); color: white; }
    .danger:hover { background: var(--danger-hover); }

    .dark { background: #334155; color: white; }
    .dark:hover { background: #1f2937; }

    .light {
      background: #eef2f7;
      color: #111827;
      border: 1px solid #dbe3ee;
    }

    .light:hover { background: #e5ebf3; }

    #previewContainer {
      margin-top: 15px;
      text-align: center;
      height: 260px;
      border: 1px dashed #cfd6dd;
      border-radius: 14px;
      padding: 14px;
      background: linear-gradient(180deg, #fafbfc, #f7fafc);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #previewContainer img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: auto;
      object-fit: contain;
      background: #fff;
    }

    .preview-placeholder {
      color: var(--muted);
      font-size: 14px;
    }

    .crop-controls {
      margin-top: 12px;
      text-align: center;
      display: none;
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .aspect-buttons { margin-top: 8px; }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .game-type-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.95);
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
      align-items: start;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .game-type-card img {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 12px;
      background: #eef2f7;
      border: 1px solid #e5e7eb;
    }

    .game-type-meta {
      font-size: 14px;
      color: #374151;
      word-break: break-word;
    }

    .game-type-meta strong {
      display: block;
      font-size: 16px;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    #processingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      z-index: 999;
      flex-direction: column;
      backdrop-filter: blur(4px);
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.25);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .unauthorized {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(220, 38, 38, 0.18);
      background: rgba(220, 38, 38, 0.08);
      color: #991b1b;
      font-weight: 700;
      text-align: center;
    }

    .crop-stage {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: absolute;
      inset: 0;
      padding: 14px;
    }

    .crop-stage img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
    }

    .field-label {
      display: block;
      margin: 6px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="shell">
    <div class="header">
      <div class="title-block">
        <h2>Tournament Templates Admin</h2>
        <p>Manage your tournament catalogue, payouts, and image assets.</p>
      </div>
      <div class="badge">Admin Access</div>
    </div>

    <div id="processingOverlay">
      <div class="spinner"></div>
      Processing Image...
    </div>

    <div id="unauthorizedBox" class="unauthorized">Unauthorized</div>

    <div id="appContent" class="grid">
      <div class="panel">
        <h3 id="formTitle">Create Template</h3>

        <div class="admin-status" id="adminStatus">Loading...</div>

        <div class="input-grid">
          <div>
            <label class="field-label">Template Name</label>
            <input id="gameName" type="text" placeholder="e.g. Pro Blitz Series">
          </div>
          <div>
            <label class="field-label">Game Type (UUID)</label>
            <input id="gameType" type="text" placeholder="Enter valid UUID">
          </div>
        </div>

        <label class="field-label">File Type</label>
        <select id="fileType">
          <option value="tictactoe">tictactoe</option>
          <option value="checkers">checkers</option>
          <option value="chess">chess</option>
        </select>

        <label class="field-label">Default Rake (%)</label>
        <input id="rake" type="number" step="0.01" placeholder="e.g. 10.00">

        <label class="field-label">Banner Image</label>
        <input type="file" id="gameImage" accept="image/*">

        <div id="previewContainer">
          <img id="imagePreview" alt="Preview">
          <div id="previewPlaceholder" class="preview-placeholder">No image selected yet</div>
          <div id="cropStage" class="crop-stage">
            <img id="cropImage" alt="Crop Preview">
          </div>
        </div>

        <div class="top-actions">
          <button id="editBtn" class="dark">Edit Image</button>
          <button id="discardBtn" class="danger" style="display:none;">Discard Image</button>
          <button id="resetBtn" class="light">Reset Form</button>
        </div>

        <div class="crop-controls" id="cropControls">
          <div>
            <button id="rotateLeft" class="dark">⟲</button>
            <button id="rotateRight" class="dark">⟳</button>
            <button id="applyCrop" class="primary">Apply Crop</button>
          </div>

          <div class="aspect-buttons">
            <button data-ratio="free" class="light">Free</button>
            <button data-ratio="1" class="light">1:1</button>
            <button data-ratio="1.777" class="light">16:9</button>
            <button data-ratio="0.8" class="light">4:5</button>
          </div>
        </div>

        <button id="saveBtn" class="primary" style="width:100%; margin-top:15px;">
          Save Template
        </button>
      </div>

      <div class="panel">
        <h3>Existing Templates</h3>
        <div id="gameTypesList" class="list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    const ADMIN_USER_ID = "077c64ed-3e42-421a-92be-f8fff271d3a6";

    const overlay = document.getElementById("processingOverlay");
    const adminStatus = document.getElementById("adminStatus");
    const unauthorizedBox = document.getElementById("unauthorizedBox");
    const appContent = document.getElementById("appContent");

    const gameNameEl = document.getElementById("gameName");
    const gameTypeEl = document.getElementById("gameType");
    const fileTypeEl = document.getElementById("fileType");
    const rakeEl = document.getElementById("rake");

    const gameImageEl = document.getElementById("gameImage");
    const imagePreviewEl = document.getElementById("imagePreview");
    const cropImageEl = document.getElementById("cropImage");
    const cropStageEl = document.getElementById("cropStage");
    const previewPlaceholderEl = document.getElementById("previewPlaceholder");

    const saveBtn = document.getElementById("saveBtn");
    const discardBtn = document.getElementById("discardBtn");
    const editBtn = document.getElementById("editBtn");
    const resetBtn = document.getElementById("resetBtn");
    const cropControls = document.getElementById("cropControls");
    const rotateLeft = document.getElementById("rotateLeft");
    const rotateRight = document.getElementById("rotateRight");
    const applyCrop = document.getElementById("applyCrop");
    const formTitle = document.getElementById("formTitle");
    const gameTypesList = document.getElementById("gameTypesList");

    let currentUserId = null;
    let cropper = null;
    let editingGameTypeId = null;

    let uploadedImageUrl = null;
    let uploadedPublicId = null;
    let currentAspectRatio = NaN;

    function setStatus(message) {
      adminStatus.textContent = message;
    }

    function showUnauthorized() {
      unauthorizedBox.style.display = "block";
      appContent.style.display = "none";
      setStatus("Unauthorized");
    }

    function waitForImageLoad(img) {
      return new Promise((resolve, reject) => {
        if (img.complete && img.naturalWidth > 0) {
          resolve();
          return;
        }
        const onLoad = () => { cleanup(); resolve(); };
        const onError = () => { cleanup(); reject(new Error("Image failed to load")); };
        const cleanup = () => {
          img.removeEventListener("load", onLoad);
          img.removeEventListener("error", onError);
        };
        img.addEventListener("load", onLoad);
        img.addEventListener("error", onError);
      });
    }

    async function getSessionUser() {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session?.user) {
        showUnauthorized();
        throw new Error("Unauthorized");
      }
      currentUserId = session.user.id;
      if (currentUserId !== ADMIN_USER_ID) {
        showUnauthorized();
        throw new Error("Unauthorized");
      }
      return currentUserId;
    }

    async function uploadFileToServer(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("userId", currentUserId);
      const res = await fetch("/api/upload-post.js", { method: "POST", body: formData });
      const result = await res.json();
      if (!res.ok) throw new Error(result?.error || "Upload failed");
      return result;
    }

    async function deleteRemoteImage(publicId) {
      if (!publicId) return;
      await fetch("/api/delete-image.js", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ publicId: `posts/${publicId}` })
      });
    }

    function clearCropper() {
      if (cropper) { cropper.destroy(); cropper = null; }
      cropControls.style.display = "none";
      cropStageEl.style.display = "none";
      imagePreviewEl.style.display = "block";
    }

    function showPreview(url) {
      if (!url) {
        imagePreviewEl.src = "";
        imagePreviewEl.style.display = "none";
        previewPlaceholderEl.style.display = "block";
        discardBtn.style.display = "none";
        return;
      }
      imagePreviewEl.src = url;
      imagePreviewEl.style.display = "block";
      previewPlaceholderEl.style.display = "none";
      discardBtn.style.display = "inline-block";
    }

    function resetForm() {
      editingGameTypeId = null;
      formTitle.textContent = "Create Template";
      gameNameEl.value = "";
      gameTypeEl.value = "";
      fileTypeEl.value = "tictactoe";
      rakeEl.value = "";
      gameImageEl.value = "";
      uploadedImageUrl = null;
      uploadedPublicId = null;
      clearCropper();
      showPreview("");
      saveBtn.textContent = "Save Template";
    }

    async function loadGameTypes() {
      const { data, error } = await supabase
        .from("tournament_templates")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        gameTypesList.innerHTML = `<div class="muted">Error loading templates.</div>`;
        return;
      }

      gameTypesList.innerHTML = data.length ? "" : `<div class="muted">No templates yet.</div>`;
      data.forEach(t => {
        const card = document.createElement("div");
        card.className = "game-type-card";
        card.innerHTML = `
          <img src="${t.image_url || 'https://via.placeholder.com/90'}" alt="">
          <div class="game-type-meta">
            <strong>${t.name}</strong>
            <div>Game UUID: ${t.game_type}</div>
            <div>File Type: ${t.file_type}</div>
            <div>Rake: ${t.rake ?? 0}%</div>
            <div class="muted" style="margin-top:6px;">Created: ${t.created_at ? new Date(t.created_at).toLocaleString() : '—'}</div>
          </div>
          <div style="grid-column: 1/-1; display:flex; gap:8px; margin-top:8px;">
            <button class="dark btn-edit">Edit</button>
            <button class="danger btn-del">Delete</button>
          </div>
        `;
        card.querySelector(".btn-edit").onclick = () => loadGameTypeForEdit(t);
        card.querySelector(".btn-del").onclick = () => deleteGameType(t);
        gameTypesList.appendChild(card);
      });
    }

    async function loadGameTypeForEdit(t) {
      editingGameTypeId = t.id;
      formTitle.textContent = "Edit Template";
      saveBtn.textContent = "Update Template";
      gameNameEl.value = t.name;
      gameTypeEl.value = t.game_type;
      fileTypeEl.value = t.file_type || "tictactoe";
      rakeEl.value = t.rake;
      uploadedImageUrl = t.image_url;
      uploadedPublicId = t.image_public_id;
      showPreview(uploadedImageUrl);
    }

    async function deleteGameType(t) {
      if (!confirm(`Delete template "${t.name}"?`)) return;
      if (t.image_public_id) await deleteRemoteImage(t.image_public_id);
      await supabase.from("tournament_templates").delete().eq("id", t.id);
      if (editingGameTypeId === t.id) resetForm();
      loadGameTypes();
    }

    gameImageEl.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      overlay.style.display = "flex";

      try {
        // If editing an existing template image, remove the old one first
        if (editingGameTypeId && uploadedPublicId) {
          await deleteRemoteImage(uploadedPublicId);
          uploadedImageUrl = null;
          uploadedPublicId = null;
        }

        const res = await uploadFileToServer(file);
        uploadedImageUrl = res.url;
        uploadedPublicId = res.publicId;
        showPreview(uploadedImageUrl);
      } catch (err) {
        alert("Upload failed");
      } finally {
        overlay.style.display = "none";
      }
    };

    editBtn.onclick = async () => {
      if (!uploadedImageUrl) return;
      clearCropper();
      cropControls.style.display = "block";
      cropStageEl.style.display = "flex";
      imagePreviewEl.style.display = "none";
      cropImageEl.src = imagePreviewEl.src;
      await waitForImageLoad(cropImageEl);
      cropper = new Cropper(cropImageEl, { aspectRatio: currentAspectRatio, viewMode: 1 });
    };

    applyCrop.onclick = () => {
      if (!cropper) return;
      const canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
      imagePreviewEl.src = canvas.toDataURL("image/jpeg", 0.9);
      clearCropper();
    };

    rotateLeft.onclick = () => {
      if (cropper) cropper.rotate(-90);
    };

    rotateRight.onclick = () => {
      if (cropper) cropper.rotate(90);
    };

    document.querySelectorAll(".aspect-buttons button").forEach(btn => {
      btn.onclick = () => {
        if (!cropper) return;
        const ratio = btn.dataset.ratio;
        currentAspectRatio = ratio === "free" ? NaN : Number(ratio);
        cropper.setAspectRatio(currentAspectRatio);
      };
    });

    discardBtn.onclick = () => {
      uploadedImageUrl = null;
      uploadedPublicId = null;
      gameImageEl.value = "";
      clearCropper();
      showPreview("");
    };

    saveBtn.onclick = async () => {
      let payload;
      try {
        payload = {
          name: gameNameEl.value.trim(),
          game_type: gameTypeEl.value.trim(),
          file_type: fileTypeEl.value.trim(),
          rake: parseFloat(rakeEl.value),
          image_url: uploadedImageUrl,
          image_public_id: uploadedPublicId
        };
      } catch {
        alert("Invalid form data.");
        return;
      }

      if (!payload.name || !payload.game_type || !payload.file_type || isNaN(payload.rake)) {
        alert("Fill all fields");
        return;
      }

      const { error } = editingGameTypeId
        ? await supabase.from("tournament_templates").update(payload).eq("id", editingGameTypeId)
        : await supabase.from("tournament_templates").insert(payload);

      if (error) alert("Save failed: " + error.message);
      else {
        resetForm();
        loadGameTypes();
      }
    };

    resetBtn.onclick = resetForm;

    (async function() {
      try {
        await getSessionUser();
        setStatus("Admin active.");
        await loadGameTypes();
      } catch (e) {
        setStatus("Unauthorized");
      }
    })();
  </script>
</body>
  </html>
