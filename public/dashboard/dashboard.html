<!DOCTYPE html>        
<html lang="en">        
<head>        
  <meta charset="UTF-8">        
  <meta name="viewport" content="width=device-width, initial-scale=1.0">        
  <title>Game Types Admin</title>        

  <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>        

  <style>        
    :root {        
      --bg: #f3f6fb;        
      --card: rgba(255, 255, 255, 0.9);        
      --text: #1f2937;        
      --muted: #6b7280;        
      --line: #dbe3ee;        
      --primary: #2563eb;        
      --primary-hover: #1d4ed8;        
      --danger: #dc2626;        
      --danger-hover: #b91c1c;        
      --dark: #111827;        
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.10);        
      --radius: 18px;        
    }        

    * { box-sizing: border-box; }        

    body {        
      margin: 0;        
      font-family: Arial, Helvetica, sans-serif;        
      color: var(--text);        
      background:        
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 28%),        
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 25%),        
        var(--bg);        
      min-height: 100vh;        
      padding: 28px 16px 40px;        
    }        

    .shell { max-width: 1180px; margin: 0 auto; }        

    .header {        
      display: flex;        
      align-items: end;        
      justify-content: space-between;        
      gap: 16px;        
      flex-wrap: wrap;        
      margin-bottom: 20px;        
    }        

    .title-block h2 {        
      margin: 0;        
      font-size: 28px;        
      letter-spacing: -0.02em;        
    }        

    .title-block p {        
      margin: 8px 0 0;        
      color: var(--muted);        
      font-size: 14px;        
    }        

    .badge {        
      padding: 10px 14px;        
      border-radius: 999px;        
      background: rgba(37, 99, 235, 0.10);        
      color: var(--primary);        
      border: 1px solid rgba(37, 99, 235, 0.18);        
      font-weight: 700;        
      font-size: 13px;        
    }        

    .grid {        
      display: grid;        
      grid-template-columns: 1.05fr 0.95fr;        
      gap: 18px;        
      align-items: start;        
    }        

    @media (max-width: 960px) {        
      .grid { grid-template-columns: 1fr; }        
    }        

    .panel {        
      background: var(--card);        
      backdrop-filter: blur(14px);        
      border: 1px solid rgba(219, 227, 238, 0.9);        
      border-radius: var(--radius);        
      padding: 18px;        
      box-shadow: var(--shadow);        
    }        

    .panel h3 {        
      margin: 0 0 14px;        
      font-size: 18px;        
      letter-spacing: -0.01em;        
    }        

    .admin-status {        
      margin: 10px 0 16px;        
      padding: 12px 14px;        
      border-radius: 14px;        
      background: #f8fafc;        
      border: 1px solid var(--line);        
      font-size: 14px;        
      white-space: pre-line;        
      color: var(--text);        
      min-height: 46px;        
    }        

    .input-grid {        
      display: grid;        
      grid-template-columns: 1fr 1fr;        
      gap: 12px;        
    }        

    @media (max-width: 640px) {        
      .input-grid { grid-template-columns: 1fr; }        
    }        

    input {        
      width: 100%;        
      box-sizing: border-box;        
      padding: 12px 14px;        
      border-radius: 12px;        
      border: 1px solid var(--line);        
      background: #fff;        
      color: var(--text);        
      margin-bottom: 10px;        
      font-size: 15px;        
      outline: none;        
      transition: border-color 0.15s ease, box-shadow 0.15s ease;        
    }        

    input:focus {        
      border-color: rgba(37, 99, 235, 0.6);        
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);        
    }        

    input[type="file"] {        
      padding: 11px;        
      background: #fff;        
    }        

    button {        
      padding: 10px 14px;        
      border-radius: 12px;        
      border: none;        
      cursor: pointer;        
      margin: 4px 4px 4px 0;        
      font-weight: 700;        
      transition: transform 0.06s ease, background 0.15s ease, opacity 0.15s ease;        
    }        

    button:active { transform: translateY(1px); }        

    .primary { background: var(--primary); color: white; }        
    .primary:hover { background: var(--primary-hover); }        

    .danger { background: var(--danger); color: white; }        
    .danger:hover { background: var(--danger-hover); }        

    .dark { background: #334155; color: white; }        
    .dark:hover { background: #1f2937; }        

    .light {        
      background: #eef2f7;        
      color: #111827;        
      border: 1px solid #dbe3ee;        
    }        

    .light:hover { background: #e5ebf3; }        

    #previewContainer {        
      margin-top: 15px;        
      text-align: center;        
      height: 260px;        
      border: 1px dashed #cfd6dd;        
      border-radius: 14px;        
      padding: 14px;        
      background: linear-gradient(180deg, #fafbfc, #f7fafc);        
      display: flex;        
      align-items: center;        
      justify-content: center;        
      overflow: hidden;        
      position: relative;        
    }        

    #previewContainer img {        
      max-width: 100%;        
      max-height: 100%;        
      width: auto;        
      height: auto;        
      border-radius: 12px;        
      display: block;        
      margin: auto;        
      object-fit: contain;        
      background: #fff;        
    }        

    .preview-placeholder {        
      color: var(--muted);        
      font-size: 14px;        
    }        

    .crop-controls {        
      margin-top: 12px;        
      text-align: center;        
      display: none;        
      padding: 12px;        
      border-radius: 14px;        
      background: #f8fafc;        
      border: 1px solid var(--line);        
    }        

    .aspect-buttons { margin-top: 8px; }        

    .top-actions {        
      display: flex;        
      gap: 8px;        
      flex-wrap: wrap;        
      margin-bottom: 10px;        
    }        

    .list {        
      display: grid;        
      gap: 12px;        
    }        

    .game-type-card {        
      border: 1px solid var(--line);        
      border-radius: 16px;        
      padding: 12px;        
      background: rgba(255,255,255,0.95);        
      display: grid;        
      grid-template-columns: 88px 1fr;        
      gap: 12px;        
      align-items: start;        
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);        
    }        

    .game-type-card img {        
      width: 88px;        
      height: 88px;        
      object-fit: cover;        
      border-radius: 12px;        
      background: #eef2f7;        
      border: 1px solid #e5e7eb;        
    }        

    .game-type-meta {        
      font-size: 14px;        
      color: #374151;        
      word-break: break-word;        
    }        

    .game-type-meta strong {        
      display: block;        
      font-size: 16px;        
      margin-bottom: 6px;        
      color: #0f172a;        
    }        

    .muted {        
      color: var(--muted);        
      font-size: 13px;        
    }        

    #processingOverlay {        
      position: fixed;        
      inset: 0;        
      background: rgba(15, 23, 42, 0.58);        
      display: none;        
      align-items: center;        
      justify-content: center;        
      color: white;        
      font-size: 18px;        
      z-index: 999;        
      flex-direction: column;        
      backdrop-filter: blur(4px);        
    }        

    .spinner {        
      border: 4px solid rgba(255,255,255,0.25);        
      border-top: 4px solid white;        
      border-radius: 50%;        
      width: 42px;        
      height: 42px;        
      animation: spin 1s linear infinite;        
      margin-bottom: 10px;        
    }        

    @keyframes spin {        
      to { transform: rotate(360deg); }        
    }        

    .unauthorized {        
      display: none;        
      margin-top: 18px;        
      padding: 18px;        
      border-radius: 16px;        
      border: 1px solid rgba(220, 38, 38, 0.18);        
      background: rgba(220, 38, 38, 0.08);        
      color: #991b1b;        
      font-weight: 700;        
      text-align: center;        
    }        

    .crop-stage {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }

    .crop-stage img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
    }
  </style>        
</head>        
<body>        
        
  <div class="shell">        
    <div class="header">        
      <div class="title-block">        
        <h2>Game Types Admin Dashboard</h2>        
        <p>Manage your game catalogue, upload cover art, and update board rules.</p>        
      </div>        
      <div class="badge">Admin Access</div>        
    </div>        
        
    <div id="processingOverlay">        
      <div class="spinner"></div>        
      Processing Image...        
    </div>        
        
    <div id="unauthorizedBox" class="unauthorized">Unauthorized</div>        
        
    <div id="appContent" class="grid">        
      <div class="panel">        
        <h3 id="formTitle">Create Game Type</h3>        
        
        <div class="admin-status" id="adminStatus">Loading...</div>        
        
        <div class="input-grid">        
          <div>        
            <input id="gameName" type="text" placeholder="Game name (e.g. Tic Tac Toe)">        
          </div>        
          <div>        
            <input id="boardType" type="text" placeholder="Board type (e.g. tictactoe, chess)">        
          </div>        
        </div>        
        
        <input type="file" id="gameImage" accept="image/*">        
        
        <div id="previewContainer">        
          <img id="imagePreview" alt="Preview">        
          <div id="previewPlaceholder" class="preview-placeholder">No image selected yet</div>
          <div id="cropStage" class="crop-stage">
            <img id="cropImage" alt="Crop Preview">
          </div>
        </div>        
        
        <div class="top-actions">        
          <button id="editBtn" class="dark">Edit Image</button>        
          <button id="discardBtn" class="danger" style="display:none;">Discard Image</button>        
          <button id="resetBtn" class="light">Reset Form</button>        
        </div>        
        
        <div class="crop-controls" id="cropControls">        
          <div>        
            <button id="rotateLeft" class="dark">⟲</button>        
            <button id="rotateRight" class="dark">⟳</button>        
            <button id="applyCrop" class="primary">Apply Crop</button>        
          </div>        
        
          <div class="aspect-buttons">        
            <button data-ratio="free" class="light">Free</button>        
            <button data-ratio="1" class="light">1:1</button>        
            <button data-ratio="1.777" class="light">16:9</button>        
            <button data-ratio="0.8" class="light">4:5</button>        
          </div>        
        </div>        
        
        <button id="saveBtn" class="primary" style="width:100%; margin-top:15px;">        
          Save Game Type        
        </button>        
      </div>        
        
      <div class="panel">        
        <h3>Existing Game Types</h3>        
        <div id="gameTypesList" class="list"></div>        
      </div>        
    </div>        
  </div>        
        
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>        
        
  <script type="module">        
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";        
        
    const supabase = createClient(        
      "https://eimecuiixwgmpfpedxpr.supabase.co",        
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"        
    );        
        
    const ADMIN_USER_ID = "077c64ed-3e42-421a-92be-f8fff271d3a6";        
        
    const overlay = document.getElementById("processingOverlay");        
    const adminStatus = document.getElementById("adminStatus");        
    const unauthorizedBox = document.getElementById("unauthorizedBox");        
    const appContent = document.getElementById("appContent");        
        
    const gameNameEl = document.getElementById("gameName");        
    const boardTypeEl = document.getElementById("boardType");        
    const gameImageEl = document.getElementById("gameImage");        
    const imagePreviewEl = document.getElementById("imagePreview");        
    const cropImageEl = document.getElementById("cropImage");        
    const cropStageEl = document.getElementById("cropStage");        
    const previewPlaceholderEl = document.getElementById("previewPlaceholder");        
    const saveBtn = document.getElementById("saveBtn");        
    const discardBtn = document.getElementById("discardBtn");        
    const editBtn = document.getElementById("editBtn");        
    const resetBtn = document.getElementById("resetBtn");        
    const cropControls = document.getElementById("cropControls");        
    const rotateLeft = document.getElementById("rotateLeft");        
    const rotateRight = document.getElementById("rotateRight");        
    const applyCrop = document.getElementById("applyCrop");        
    const formTitle = document.getElementById("formTitle");        
    const gameTypesList = document.getElementById("gameTypesList");        
        
    let currentUserId = null;        
    let cropper = null;        
    let editingGameTypeId = null;        
        
    let uploadedImageUrl = null;        
    let uploadedPublicId = null;        

    function setStatus(message) {        
      adminStatus.textContent = message;        
    }        
        
    function showUnauthorized() {        
      unauthorizedBox.style.display = "block";        
      appContent.style.display = "none";        
      setStatus("Unauthorized");        
    }        
        
    function waitForImageLoad(img) {        
      return new Promise((resolve, reject) => {        
        if (img.complete && img.naturalWidth > 0) {        
          resolve();        
          return;        
        }        
        
        const onLoad = () => {        
          cleanup();        
          resolve();        
        };        
        
        const onError = () => {        
          cleanup();        
          reject(new Error("Image failed to load"));        
        };        
        
        const cleanup = () => {        
          img.removeEventListener("load", onLoad);        
          img.removeEventListener("error", onError);        
        };        
        
        img.addEventListener("load", onLoad);        
        img.addEventListener("error", onError);        
      });        
    }        
        
    async function getSessionUser() {        
      const { data: { session }, error } = await supabase.auth.getSession();        
      if (error) throw error;        
      if (!session?.user) throw new Error("No active session");        
        
      currentUserId = session.user.id;        
        
      if (currentUserId !== ADMIN_USER_ID) {        
        showUnauthorized();        
        throw new Error("Unauthorized");        
      }        
        
      return currentUserId;        
    }        
        
    async function uploadFileToServer(file) {        
      const formData = new FormData();        
      formData.append("file", file);        
      formData.append("userId", currentUserId);        
        
      const res = await fetch("/api/upload-post.js", {        
        method: "POST",        
        body: formData        
      });        
        
      const result = await res.json();        
        
      if (!res.ok) {        
        throw new Error(result?.error || "Upload failed");        
      }        
        
      return result;        
    }        
        
    async function deleteRemoteImage(publicId) {        
      if (!publicId) return;        
        
      await fetch("/api/delete-image.js", {        
        method: "POST",        
        headers: { "Content-Type": "application/json" },        
        body: JSON.stringify({ publicId })        
      });        
    }        
        
    function clearCropper() {        
      if (cropper) {        
        cropper.destroy();        
        cropper = null;        
      }        
      cropControls.style.display = "none";        
      cropStageEl.style.display = "none";
      imagePreviewEl.style.display = "block";
    }        
        
    function showPreview(url) {        
      if (!url) {        
        imagePreviewEl.src = "";        
        imagePreviewEl.style.display = "none";        
        previewPlaceholderEl.style.display = "block";        
        discardBtn.style.display = "none";        
        cropStageEl.style.display = "none";
        return;        
      }        
        
      imagePreviewEl.src = url;        
      imagePreviewEl.style.display = "block";        
      previewPlaceholderEl.style.display = "none";        
      discardBtn.style.display = "inline-block";        
    }        
        
    function resetForm() {        
      editingGameTypeId = null;        
      formTitle.textContent = "Create Game Type";        
      gameNameEl.value = "";        
      boardTypeEl.value = "";        
      gameImageEl.value = "";        
      uploadedImageUrl = null;        
      uploadedPublicId = null;        
      clearCropper();        
      cropImageEl.src = "";        
      showPreview("");        
      saveBtn.textContent = "Save Game Type";        
    }        
        
    async function loadGameTypes() {        
      const { data, error } = await supabase        
        .from("game_types")        
        .select("*")        
        .order("created_at", { ascending: false });        
        
      if (error) {        
        gameTypesList.innerHTML = `<div class="muted">Could not load game types.</div>`;        
        return;        
      }        
        
      const rows = data || [];        
      if (rows.length === 0) {        
        gameTypesList.innerHTML = `<div class="muted">No game types yet.</div>`;        
        return;        
      }        
        
      gameTypesList.innerHTML = "";        
        
      rows.forEach((gameType) => {        
        const card = document.createElement("div");        
        card.className = "game-type-card";        
        
        card.innerHTML = `        
          <img src="${gameType.image_url || 'https://via.placeholder.com/90'}" alt="">        
          <div class="game-type-meta">        
            <strong>${gameType.name || "No name"}</strong>        
            <div>Board type: ${gameType.board_type || "—"}</div>        
            <div class="muted">ID: ${gameType.id}</div>        
          </div>        
        `;        
        
        const actions = document.createElement("div");        
        actions.style.gridColumn = "1 / -1";        
        actions.style.display = "flex";        
        actions.style.gap = "8px";        
        actions.style.marginTop = "10px";        
        actions.style.flexWrap = "wrap";        
        
        const edit = document.createElement("button");        
        edit.className = "dark";        
        edit.textContent = "Edit";        
        edit.onclick = () => loadGameTypeForEdit(gameType);        
        
        const del = document.createElement("button");        
        del.className = "danger";        
        del.textContent = "Delete";        
        del.onclick = () => deleteGameType(gameType);        
        
        actions.appendChild(edit);        
        actions.appendChild(del);        
        
        card.appendChild(actions);        
        gameTypesList.appendChild(card);        
      });        
    }        
        
    async function loadGameTypeForEdit(gameType) {        
      editingGameTypeId = gameType.id;        
      formTitle.textContent = "Edit Game Type";        
      saveBtn.textContent = "Update Game Type";        
        
      gameNameEl.value = gameType.name || "";        
      boardTypeEl.value = gameType.board_type || "";        
        
      uploadedImageUrl = gameType.image_url || null;        
      uploadedPublicId = gameType.image_public_id || null;        
        
      clearCropper();        
      showPreview(uploadedImageUrl);        
        
      try {        
        if (uploadedImageUrl) {        
          await waitForImageLoad(imagePreviewEl);        
        }        
        setStatus(`Editing:        
${gameType.name || ""}        
${gameType.board_type || ""}`);        
      } catch (err) {        
        console.error(err);        
        showPreview(uploadedImageUrl);        
      }        
    }        
        
    async function deleteGameType(gameType) {        
      const ok = confirm(`Delete "${gameType.name}"?`);        
      if (!ok) return;        
        
      if (gameType.image_public_id) {        
        await deleteRemoteImage(gameType.image_public_id);        
      }        
        
      const { error } = await supabase        
        .from("game_types")        
        .delete()        
        .eq("id", gameType.id);        
        
      if (error) {        
        alert("Delete failed");        
        return;        
      }        
        
      if (editingGameTypeId === gameType.id) {        
        resetForm();        
      }        
        
      await loadGameTypes();        
      setStatus("Game type deleted.");        
    }        
        
    gameImageEl.addEventListener("change", async (e) => {        
      const file = e.target.files[0];        
      if (!file) return;        
        
      overlay.style.display = "flex";        
        
      try {        
        const result = await uploadFileToServer(file);        
        
        uploadedImageUrl = result.url;        
        uploadedPublicId = result.publicId;        
        
        showPreview(uploadedImageUrl);        
        clearCropper();        
        setStatus("Image uploaded. You can crop it now.");        
      } catch (err) {        
        alert("Upload failed");        
        console.error(err);        
      } finally {        
        overlay.style.display = "none";        
      }        
    });        
        
    editBtn.onclick = async () => {        
      if (!uploadedImageUrl) return;        
        
      cropControls.style.display = "block";        
      cropStageEl.style.display = "flex";        
      imagePreviewEl.style.display = "none";        
      previewPlaceholderEl.style.display = "none";        
        
      if (cropper) cropper.destroy();        
        
      try {        
        cropImageEl.src = imagePreviewEl.src || uploadedImageUrl;        
        await waitForImageLoad(cropImageEl);        
        
        cropper = new Cropper(cropImageEl, {        
          aspectRatio: NaN,        
          viewMode: 1,        
          dragMode: "move",        
          autoCropArea: 0.85,        
          responsive: true,        
          movable: false,        
          zoomable: false,        
          zoomOnWheel: false,        
          zoomOnTouch: false,        
          rotatable: true,        
          scalable: false,        
          cropBoxMovable: true,        
          cropBoxResizable: true,        
          toggleDragModeOnDblclick: false,        
          background: false        
        });        
      } catch (err) {        
        console.error(err);        
        setStatus("Could not open image editor.");        
      }        
    };        
        
    rotateLeft.onclick = () => cropper && cropper.rotate(-90);        
    rotateRight.onclick = () => cropper && cropper.rotate(90);        
        
    document.querySelectorAll("[data-ratio]").forEach(btn => {        
      btn.onclick = () => {        
        if (!cropper) return;        
        const ratio = btn.dataset.ratio;        
        cropper.setAspectRatio(ratio === "free" ? NaN : parseFloat(ratio));        
      };        
    });        
        
    applyCrop.onclick = () => {        
      if (!cropper) return;        
        
      const canvas = cropper.getCroppedCanvas({        
        maxWidth: 1200,        
        maxHeight: 1200        
      });        
        
      imagePreviewEl.src = canvas.toDataURL("image/jpeg", 0.9);        
      imagePreviewEl.style.display = "block";        
      previewPlaceholderEl.style.display = "none";        
      cropStageEl.style.display = "none";        
        
      cropper.destroy();        
      cropper = null;        
      cropControls.style.display = "none";        
    };        
        
    discardBtn.onclick = async () => {        
      if (!uploadedPublicId) {        
        resetForm();        
        return;        
      }        
        
      if (cropper) {        
        cropper.destroy();        
        cropper = null;        
      }        
        
      overlay.style.display = "flex";        
        
      try {        
        await deleteRemoteImage(uploadedPublicId);        
      } catch (err) {        
        console.error(err);        
      } finally {        
        overlay.style.display = "none";        
      }        
        
      uploadedImageUrl = null;        
      uploadedPublicId = null;        
      gameImageEl.value = "";        
      cropImageEl.src = "";        
      clearCropper();        
      imagePreviewEl.src = "";        
      showPreview("");        
      setStatus("Image discarded.");        
    };        
        
    saveBtn.onclick = async () => {        
      const name = gameNameEl.value.trim();        
      const boardType = boardTypeEl.value.trim().toLowerCase();        
        
      if (!name || !boardType) {        
        alert("Name and board type are required");        
        return;        
      }        
        
      if (!uploadedImageUrl || !uploadedPublicId) {        
        alert("Please upload an image");        
        return;        
      }        
        
      const payload = {        
        name,        
        board_type: boardType,        
        image_url: imagePreviewEl.src,        
        image_public_id: uploadedPublicId        
      };        
        
      try {        
        let error;        
        
        if (editingGameTypeId) {        
          ({ error } = await supabase        
            .from("game_types")        
            .update(payload)        
            .eq("id", editingGameTypeId));        
        } else {        
          ({ error } = await supabase        
            .from("game_types")        
            .insert(payload));        
        }        
        
        if (error) throw error;        
        
        setStatus(editingGameTypeId ? "Game type updated." : "Game type created.");        
        resetForm();        
        await loadGameTypes();        
      } catch (err) {        
        console.error(err);        
        alert("Save failed");        
      }        
    };        
        
    resetBtn.onclick = () => {        
      resetForm();        
      setStatus("Form reset.");        
    };        
        
    async function init() {        
      try {        
        await getSessionUser();        
        setStatus("Admin ready.");        
        await loadGameTypes();        
      } catch (err) {        
        console.error(err);        
        if (String(err?.message || "").toLowerCase().includes("unauthorized")) {        
          return;        
        }        
        showUnauthorized();        
        setStatus("Unauthorized");        
      }        
    }        
        
    init();        
  </script>        
</body>        
  </html>
