<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Lobby | PlayArena</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(to right, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .wallet-pill {
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wallet-pill span { color: var(--success); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .section-title {
      font-size: 24px;
      margin: 0 0 16px 0;
      font-weight: 700;
    }

    .templates-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 16px;
      scrollbar-width: none;
    }
    .templates-scroll::-webkit-scrollbar { display: none; }

    .game-card {
      min-width: 180px;
      background: var(--card-bg);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .game-card:hover { background: var(--card-hover); }
    .game-card.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
    }

    .game-image {
      width: 50px;
      height: 50px;
      background: var(--bg);
      border-radius: 12px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .game-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .game-rake { font-size: 13px; color: var(--text-muted); }

    .lobbies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .lobby-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .prize-pool { font-size: 24px; font-weight: 800; color: var(--success); }
    .prize-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}

    .btn {
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-disabled { 
      background: var(--border); 
      color: var(--text-muted); 
      cursor: not-allowed; 
      opacity: 0.7;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }
    
    /* Redirect Overlay for Reconnection */
    #reconnectOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="reconnectOverlay">
    <div class="brand" style="font-size: 32px; margin-bottom: 20px;">PlayArena</div>
    <div style="color: var(--text-muted);">Syncing game state...</div>
  </div>

  <nav class="navbar">
    <div class="brand">PlayArena</div>
    <div class="wallet-pill">
      Wallet: <span id="userBalance">$0.00</span>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-title">Select Game</h2>
    <div class="templates-scroll" id="templatesContainer"></div>

    <div id="lobbiesSection" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 40px;">
        <h2 class="section-title" id="selectedGameTitle">Lobbies</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ Create Tournament</button>
      </div>
      <div class="lobbies-grid" id="lobbiesContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h3 style="margin-top:0;">New Tournament</h3>
      <div style="margin-bottom: 15px;">
        <label style="display:block; color: var(--text-muted); font-size: 12px; margin-bottom: 5px;">Entry Fee ($)</label>
        <input type="number" id="createFee" style="width:100%; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:white; box-sizing:border-box;" value="5.00" step="1.00">
      </div>
      <div style="margin-bottom: 20px;">
        <label style="display:block; color: var(--text-muted); font-size: 12px; margin-bottom: 5px;">Max Players</label>
        <input type="number" id="createPlayers" style="width:100%; padding:12px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:white; box-sizing:border-box;" value="2" min="2" max="10">
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-disabled" style="flex:1" onclick="closeCreateModal()">Cancel</button>
        <button class="btn btn-success" style="flex:1" onclick="submitCreateTournament()">Create & Join</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://eimecuiixwgmpfpedxpr.supabase.co",
      "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
    );

    let currentUserId = null;
    let activeTemplateId = null;

    // --- INITIALIZATION ---

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      
      if (!user) {
        window.location.href = "/login.html"; // Redirect if not logged in
        return;
      }

      currentUserId = user.id;
      
      // 1. Check if user is already in a game
      await checkActiveGame();
      
      // 2. If no game, show lobby
      document.getElementById('reconnectOverlay').classList.add('hidden');
      refreshBalance();
      loadTemplates();
    }

    // --- RECONNECTION LOGIC ---

    async function checkActiveGame() {
      const { data, error } = await supabase.rpc('get_active_tournament');
      
      if (error) {
        console.error("Sync Error:", error);
        return;
      }

      const response = JSON.parse(data);

      if (response.status === 'active_match_found') {
        // User has an ongoing match, redirect to the game screen immediately
        const gameUrl = `/${response.file_type}.html?match_id=${response.match_id}`;
        window.location.href = gameUrl;
      }
    }

    // --- LOBBY LOGIC ---

    async function refreshBalance() {
      const { data } = await supabase.from('profile').select('money').eq('id', currentUserId).single();
      if (data) document.getElementById('userBalance').innerText = `$${Number(data.money).toFixed(2)}`;
    }

    async function loadTemplates() {
      const { data } = await supabase.rpc('list_tournament_templates');
      const container = document.getElementById('templatesContainer');
      
      container.innerHTML = (data || []).map(t => `
        <div class="game-card ${t.id === activeTemplateId ? 'active' : ''}" onclick="selectTemplate('${t.id}', '${t.name}')">
          <div class="game-image">🎮</div>
          <div class="game-title">${t.name}</div>
          <div class="game-rake">Rake: ${t.rake || 0}%</div>
        </div>
      `).join('');
    }

    window.selectTemplate = function(id, name) {
      activeTemplateId = id;
      document.getElementById('selectedGameTitle').innerText = `${name} Lobbies`;
      document.getElementById('lobbiesSection').classList.remove('hidden');
      loadTemplates(); // Re-render for 'active' border
      loadLobbies(id);
    };

    async function loadLobbies(templateId) {
      const container = document.getElementById('lobbiesContainer');
      container.innerHTML = '<div style="color:var(--text-muted);">Refreshing lobbies...</div>';
      
      const { data: rooms, error } = await supabase.rpc('list_available_tournaments', { p_template_id: templateId });
      
      if (error || !rooms || rooms.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted); border:1px dashed var(--border); border-radius:16px;">No open waiting rooms.</div>';
        return;
      }

      container.innerHTML = rooms.map(room => {
        // Condition: If user is the host OR already in the match, disable the button
        const isJoined = room.user_id === currentUserId || room.already_joined === true;

        return `
          <div class="lobby-card">
            <div>
              <div class="prize-label">Prize Pool</div>
              <div class="prize-pool">$${Number(room.prize_pool).toFixed(2)}</div>
            </div>
            <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px;">
              <div><div class="prize-label">Entry</div><div style="font-weight:600;">$${Number(room.entry_fee).toFixed(2)}</div></div>
              <div><div class="prize-label">Capacity</div><div style="font-weight:600;">${room.max_players} Max</div></div>
            </div>
            ${isJoined 
              ? `<button class="btn btn-disabled">Already Registered</button>`
              : `<button class="btn btn-success" onclick="joinTournament('${room.id}')">Join & Pay</button>`
            }
          </div>
        `;
      }).join('');
    }

    // --- ACTION LOGIC ---

    window.joinTournament = async function(tournamentId) {
      if (!confirm("Confirm entry fee payment to join this match?")) return;

      const { data, error } = await supabase.rpc('join_tournament', { p_tournament_id: tournamentId });

      if (error) {
        alert(error.message);
      } else {
        const response = JSON.parse(data);

        if (response.state === 'starting') {
          // Tournament full! Go to game
          window.location.href = `/${response.file_type}.html?tournament_id=${tournamentId}`;
        } else {
          alert(response.message);
          refreshBalance();
          loadLobbies(activeTemplateId);
        }
      }
    };

    window.submitCreateTournament = async function() {
      const fee = parseFloat(document.getElementById('createFee').value);
      const players = parseInt(document.getElementById('createPlayers').value);
      
      const { data, error } = await supabase.rpc('create_custom_tournament', {
        p_template_id: activeTemplateId,
        p_entry_fee: fee,
        p_max_players: players
      });

      if (error) {
        alert(error.message);
      } else {
        closeCreateModal();
        refreshBalance();
        loadLobbies(activeTemplateId);
      }
    };

    // --- MODAL UTILS ---
    window.openCreateModal = () => document.getElementById('createModal').style.display = 'flex';
    window.closeCreateModal = () => document.getElementById('createModal').style.display = 'none';

    // Start
    init();
  </script>
</body>
</html>
