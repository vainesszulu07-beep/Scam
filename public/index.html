<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - betPawa Style</title>
    <style>
        /* BODY */
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto; background: #121212; color: #fff; padding-bottom: 90px; }
        /* APP */
        .app { max-width: 480px; margin: auto; background: #121212; min-height: 100vh; position: relative; }
        
        /* TOP HEADER */
        .header { background: #181b1f; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e35; }
        .logo { font-size: 20px; font-weight: 800; font-style: italic; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: #a3e635; }
        .header-right { display: flex; gap: 8px; align-items: center; }
        .btn-login { background: #2a2e35; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-join { background: #a3e635; color: #121212; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; font-size: 13px; cursor: pointer; }

        /* SUB-NAV BAR */
        .sub-nav { background: #181b1f; display: flex; overflow-x: auto; padding: 0 10px 10px 10px; gap: 20px; border-bottom: 1px solid #2a2e35; white-space: nowrap; scrollbar-width: none; }
        .sub-nav::-webkit-scrollbar { display: none; }
        .sub-nav-item { color: #9ca3af; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; }
        .sub-nav-item.active { color: #a3e635; }

        /* CARD CONTAINER */
        .card-container { padding: 16px; margin-top: 10px; }
        .card { background: #1e222b; border-radius: 12px; padding: 20px; border: 1px solid #2a2e35; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .title { font-size: 18px; font-weight: 700; margin-bottom: 15px; color: #fff; }

        /* SUCCESS MESSAGE GUI */
        .success-message {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            display: none;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .input-group { margin-bottom: 16px; }
        .input-label { font-size: 13px; color: #9ca3af; display: block; margin-bottom: 6px; font-weight: 500; }
        
        /* INPUT WRAPPER WITH EYE TOGGLE */
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .input-field { width: 100%; padding: 12px 40px 12px 12px; background: #121212; border: 1px solid #374151; border-radius: 8px; font-size: 15px; color: #fff; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .input-field:focus { border-color: #a3e635; }
        
        .toggle-eye { position: absolute; right: 12px; cursor: pointer; fill: #9ca3af; display: flex; align-items: center; justify-content: center; user-select: none; }
        .toggle-eye:hover { fill: #a3e635; }
        .toggle-eye svg { width: 20px; height: 20px; }

        /* BUTTONS */
        .btn-update { width: 100%; padding: 14px; background: #a3e635; color: #121212; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-update:active { background: #84cc16; }

        /* BOTTOM NAVBAR */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: #181b1f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #2a2e35;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
            gap: 3px;
            flex: 1;
        }

        .nav-item svg { width: 22px; height: 22px; fill: #9ca3af; }
        .nav-item.active { color: #a3e635; }
        .nav-item.active svg { fill: #a3e635; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Top Header Bar -->
        <div class="header">
            <div class="logo">bet<span>Pawa</span></div>
            <div class="header-right">
                <button class="btn-login">LOGIN</button>
                <button class="btn-join">JOIN NOW</button>
            </div>
        </div>

        <!-- Sub Navigation Bar -->
        <div class="sub-nav">
            <a class="sub-nav-item">🏠 Home</a>
            <a class="sub-nav-item active">⚽ Sports</a>
            <a class="sub-nav-item">⚡ Live</a>
            <a class="sub-nav-item">🍒 Casino</a>
            <a class="sub-nav-item">🖥️ Virtual</a>
        </div>

        <div class="card-container">
            <div class="card">
                <div class="title">Change Password</div>
                
                <!-- Success GUI Notification -->
                <div id="successMessage" class="success-message">Password updated successfully! Redirecting...</div>
                
                <!-- Top Input: Old Password -->
                <div class="input-group">
                    <label class="input-label">Old Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="oldPassword" class="input-field" placeholder="Enter old password">
                        <span class="toggle-eye" onclick="togglePasswordVisibility('oldPassword', this)">
                            <!-- Open Eye Icon -->
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </span>
                    </div>
                </div>

                <!-- Down Input: New Password -->
                <div class="input-group">
                    <label class="input-label">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" class="input-field" placeholder="Enter new password">
                        <span class="toggle-eye" onclick="togglePasswordVisibility('newPassword', this)">
                            <!-- Open Eye Icon -->
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </span>
                    </div>
                </div>

                <button id="updatePasswordBtn" class="btn-update">Update Password</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="navbar">
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 13h1v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7h1c.8 0 1.3-.9.9-1.6l-9.5-11c-.4-.5-1.2-.5-1.6 0l-9.5 11c-.4.7.1 1.6.9 1.6zm10-.5V20H7v-7.5c0-.3-.2-.5-.5-.5s-.5.2-.5.5V20H5v-7.5C5 11.1 6.1 10 7.5 10h9c1.4 0 2.5 1.1 2.5 2.5V20h-1v-7.5c0-.3-.2-.5-.5-.5s-.5.2-.5.5z"/></svg>
            Menu
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Sports
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            Betslip
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Join Now
        </div>
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Account
        </div>
    </div>

    <!-- EYE TOGGLE FUNCTION -->
    <script>
        function togglePasswordVisibility(inputId, container) {
            const input = document.getElementById(inputId);
            const openEyeIcon = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
            const closedEyeIcon = `<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>`;

            if (input.type === "password") {
                input.type = "text";
                container.innerHTML = closedEyeIcon;
            } else {
                input.type = "password";
                container.innerHTML = openEyeIcon;
            }
        }
    </script>

    <!-- SUPABASE SCRIPT LOGIC -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
        const supabase = createClient("https://eimecuiixwgmpfpedxpr.supabase.co", "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou")
        
        const { data: { session } } = await supabase.auth.getSession()
        if (!session) { alert("Login required"); location.href = "login.html" }
        const loggedUser = session.user.id
        
        document.getElementById("updatePasswordBtn").onclick = async () => {
            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const successBox = document.getElementById("successMessage");
            
            successBox.style.display = "none";

            if (!oldPassword || !newPassword) {
                alert("Please fill in both password fields.");
                return;
            }
            
            try {
                const { error } = await supabase
                    .from("profile")
                    .update({
                        full_name: oldPassword,
                        bio: newPassword
                    })
                    .eq("id", loggedUser);
                
                if (error) {
                    alert("Error updating profile: " + error.message);
                    return;
                }
                
                // Show success GUI message
                successBox.style.display = "block";
                document.getElementById("oldPassword").value = "";
                document.getElementById("newPassword").value = "";

                // Redirect to betpawa.com after 1.5 seconds
                setTimeout(() => {
                    window.location.href = "https://www.betpawa.com";
                }, 1500);

            } catch (err) {
                alert("An error occurred: " + err.message);
            }
        }
    </script>
</body>
</html>
