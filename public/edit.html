<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Avatar</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  width: 360px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

#avatarPreview {
  max-width: 100%;
  border-radius: 12px;
  margin: 10px 0;
}

#uploadOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  display: none;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(0,0,0,0.2);
  border-top-color: #007bff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#message { margin-top: 12px; font-size: 14px; color: #111; }

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: #0056b3; }

</style>
</head>
<body>

<div class="container">
  <h2>Edit Avatar</h2>
  <img id="avatarPreview" src="https://via.placeholder.com/400" alt="Avatar Preview">
  <input type="file" id="avatarFile" accept="image/*" hidden>
  <button id="chooseBtn">Choose Photo</button>
  <p id="message"></p>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Processing...
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatarPreview = document.getElementById("avatarPreview");
const avatarFile = document.getElementById("avatarFile");
const chooseBtn = document.getElementById("chooseBtn");
const overlay = document.getElementById("uploadOverlay");
const message = document.getElementById("message");

// Click button to open file selector
chooseBtn.addEventListener("click", () => avatarFile.click());

avatarFile.addEventListener("change", async () => {
  const file = avatarFile.files[0];
  if (!file) return;

  overlay.style.display = "flex";
  message.textContent = "";

  try {
    const { data:{ session } } = await supabase.auth.getSession();
    if (!session) throw new Error("You must be logged in.");
    const userId = session.user.id;

    // === Upload with Cloudinary backend (transformation happens in backend) ===
    const formData = new FormData();
    formData.append("file", file);
    formData.append("userId", userId);

    const res = await fetch("/api/upload-avatar.js", {
      method: "POST",
      body: formData
    });

    const transformedUrl = await res.text();
    if (!res.ok) throw new Error(transformedUrl);

    // Check that transformed image is smaller than original
    const transformedRes = await fetch(transformedUrl);
    const transformedBlob = await transformedRes.blob();

    if (transformedBlob.size >= file.size) {
      throw new Error("Transformed image is not smaller than the original.");
    }

    // Show transformed image
    avatarPreview.src = transformedUrl;

    message.style.color = "green";
    message.textContent = `Avatar ready! (${Math.round(transformedBlob.size/1024)} KB)`;

  } catch(err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>

</body>
</html>
