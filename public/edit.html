<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Avatar</title>
<link href="https://unpkg.com/cropperjs/dist/cropper.css" rel="stylesheet"/>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.container {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  width: 360px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
#dropZone {
  width: 100%;
  height: 360px;
  border: 2px dashed #ccc;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
#dropZone.dragover { border-color: #007bff; background: #eef4ff; }
#avatarPreview { max-width: 100%; max-height: 100%; display: none; }
.controls { display: none; margin: 10px 0; }
.controls button { margin: 0 5px; padding: 6px 10px; cursor: pointer; }
#saveBtn { display: none; width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
#saveBtn:hover { background: #0056b3; }
#uploadOverlay {
  position: fixed; inset:0;
  background: rgba(255,255,255,0.85);
  display: flex; justify-content:center; align-items:center; flex-direction:column;
  z-index: 9999; display:none;
}
.spinner { width:40px; height:40px; border:4px solid rgba(0,0,0,0.2); border-top-color:#007bff; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:12px; }
@keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
#message { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <h2>Edit Avatar</h2>
  
  <div id="dropZone">Click or drag a file here</div>
  <img id="avatarPreview" alt="Avatar Preview">
  
  <div class="controls">
    <button type="button" id="rotateLeft">Rotate Left</button>
    <button type="button" id="rotateRight">Rotate Right</button>
  </div>
  
  <button id="saveBtn">Save Avatar</button>
  <p id="message"></p>
  
  <input type="file" id="avatarFile" accept="image/*" hidden>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Processing...
</div>

<script src="https://unpkg.com/cropperjs/dist/cropper.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("avatarFile");
const avatarPreview = document.getElementById("avatarPreview");
const controls = document.querySelector(".controls");
const saveBtn = document.getElementById("saveBtn");
const overlay = document.getElementById("uploadOverlay");
const message = document.getElementById("message");
const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");

let cropper;

// Open file selector when drop zone clicked
dropZone.addEventListener("click", () => fileInput.click());

// Drag & drop
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));

// Handle file selection
function handleFile(file) {
  if (!file) return;
  overlay.style.display = "flex";
  message.textContent = "";

  const reader = new FileReader();
  reader.onload = () => {
    avatarPreview.src = reader.result;
    avatarPreview.style.display = "block";
    controls.style.display = "block";
    saveBtn.style.display = "block";
    overlay.style.display = "none";

    if (cropper) cropper.destroy();
    cropper = new Cropper(avatarPreview, {
      aspectRatio: 1,
      viewMode: 1,
      autoCropArea: 1,
    });
  };
  reader.readAsDataURL(file);
}

// Rotate
rotateLeft.addEventListener("click", () => cropper?.rotate(-90));
rotateRight.addEventListener("click", () => cropper?.rotate(90));

// Save
saveBtn.addEventListener("click", async () => {
  overlay.style.display = "flex";
  message.textContent = "";
  try {
    const { data:{session} } = await supabase.auth.getSession();
    if (!session) throw new Error("You must be logged in.");
    const userId = session.user.id;

    const canvas = cropper.getCroppedCanvas({ width:400, height:400 });
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));

    const formData = new FormData();
    formData.append("file", blob);
    formData.append("userId", userId);

    const res = await fetch("/api/upload-avatar.js", { method:"POST", body: formData });
    const avatarUrl = await res.text();
    if (!res.ok) throw new Error(avatarUrl);

    const { error } = await supabase.from("profile").upsert({
      id: userId,
      avatar_url: avatarUrl,
      avatar_public_id: `avatar_${userId}`
    });

    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Avatar updated successfully!";
  } catch(err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>

</body>
</html>
