<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Post</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  width: 360px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

#postImagePreview {
  max-width: 100%;
  border-radius: 12px;
  margin: 10px 0;
  transition: transform 0.2s ease;
}

#uploadOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  display: none;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(0,0,0,0.2);
  border-top-color: #007bff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#message { margin-top: 12px; font-size: 14px; color: #111; }

textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
  resize: none;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: #0056b3; }

.rotate-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

.rotate-buttons button {
  width: auto;
  padding: 8px 12px;
}
</style>
</head>
<body>

<div class="container">
  <h2>Create Post</h2>

  <textarea id="postContent" placeholder="What's on your mind?"></textarea>
  <img id="postImagePreview" src="https://via.placeholder.com/400" alt="Post Preview">

  <input type="file" id="postFile" accept="image/*" hidden>
  <button id="chooseBtn">Choose Image</button>

  <div class="rotate-buttons">
    <button id="rotateLeftBtn">⟲ Rotate Left</button>
    <button id="rotateRightBtn">⟳ Rotate Right</button>
  </div>

  <button id="postBtn">Post</button>
  <p id="message"></p>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Processing...
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const postContentEl = document.getElementById("postContent");
const postImagePreview = document.getElementById("postImagePreview");
const postFile = document.getElementById("postFile");
const chooseBtn = document.getElementById("chooseBtn");
const rotateLeftBtn = document.getElementById("rotateLeftBtn");
const rotateRightBtn = document.getElementById("rotateRightBtn");
const postBtn = document.getElementById("postBtn");
const overlay = document.getElementById("uploadOverlay");
const message = document.getElementById("message");

let rotation = 0;
let currentImageUrl = "";
let currentUserId = null;

/* AUTH */
(async () => {
  const { data:{ session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  currentUserId = session.user.id;
})();

/* CHOOSE IMAGE */
chooseBtn.addEventListener("click", () => postFile.click());

/* ROTATE */
rotateLeftBtn.addEventListener("click", () => {
  rotation -= 90;
  postImagePreview.style.transform = `rotate(${rotation}deg)`;
});
rotateRightBtn.addEventListener("click", () => {
  rotation += 90;
  postImagePreview.style.transform = `rotate(${rotation}deg)`;
});

/* UPLOAD IMAGE WHEN SELECTED */
postFile.addEventListener("change", async () => {
  const file = postFile.files[0];
  if (!file) return;

  overlay.style.display = "flex";
  message.textContent = "";
  rotation = 0;
  postImagePreview.style.transform = "rotate(0deg)";

  try {
    const { data:{ session } } = await supabase.auth.getSession();
    if (!session) throw new Error("You must be logged in.");
    const userId = session.user.id;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("userId", userId);

    const res = await fetch("/api/upload-post.js", {
      method: "POST",
      body: formData
    });

    const uploadedUrl = await res.text();
    if (!res.ok) throw new Error(uploadedUrl);

    currentImageUrl = uploadedUrl;
    postImagePreview.src = uploadedUrl;

    message.style.color = "green";
    message.textContent = "Image ready!";
  } catch(err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});

/* POST */
postBtn.addEventListener("click", async () => {
  overlay.style.display = "flex";
  message.textContent = "";

  try {
    if (!currentImageUrl && !postContentEl.value.trim()) {
      throw new Error("Post cannot be empty");
    }

    // Draw rotated image to canvas if rotated
    let finalImage = currentImageUrl;
    if (rotation !== 0 && currentImageUrl) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = currentImageUrl;
      await new Promise(resolve => img.onload = resolve);

      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");

      ctx.translate(canvas.width/2, canvas.height/2);
      ctx.rotate(rotation * Math.PI / 180);
      ctx.drawImage(img, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));

      const formData = new FormData();
      formData.append("file", blob);
      formData.append("userId", currentUserId);

      const res = await fetch("/api/upload-post.js", {
        method: "POST",
        body: formData
      });

      finalImage = await res.text();
      if (!res.ok) throw new Error(finalImage);
    }

    const { error } = await supabase.from("posts").insert([
      {
        user_id: currentUserId,
        content: postContentEl.value.trim(),
        image_url: finalImage
      }
    ]);
    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Post created! Redirecting...";
    setTimeout(() => window.location.href = "profile.html", 1000);

  } catch(err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>
</body>
  </html>
