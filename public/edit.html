<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Avatar</title>

<!-- CropperJS CSS -->
<link href="https://unpkg.com/cropperjs/dist/cropper.css" rel="stylesheet"/>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  width: 360px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

#avatarPreview {
  max-width: 100%;
  max-height: 360px;
  display: block;
  margin: 10px auto;
}

.controls button {
  margin: 5px;
  padding: 8px 12px;
  cursor: pointer;
}

#saveBtn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#saveBtn:hover { background: #0056b3; }

#uploadOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
  display: none;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(0,0,0,0.2);
  border-top-color: #007bff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#message { margin-top: 12px; font-size: 14px; }
</style>
</head>

<body>

<div class="container">
  <h2>Edit Avatar</h2>
  <img id="avatarPreview" src="https://via.placeholder.com/400" alt="Avatar Preview">
  
  <div class="controls">
    <button type="button" id="rotateLeft">Rotate Left</button>
    <button type="button" id="rotateRight">Rotate Right</button>
  </div>

  <button id="saveBtn">Save Avatar</button>
  <p id="message"></p>
</div>

<div id="uploadOverlay">
  <div class="spinner"></div>
  Processing...
</div>

<!-- CropperJS -->
<script src="https://unpkg.com/cropperjs/dist/cropper.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatarPreview = document.getElementById("avatarPreview");
const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const saveBtn = document.getElementById("saveBtn");
const overlay = document.getElementById("uploadOverlay");
const message = document.getElementById("message");

let cropper;

window.addEventListener("DOMContentLoaded", () => {
  // Initialize cropper on page load
  cropper = new Cropper(avatarPreview, {
    aspectRatio: 1,
    viewMode: 1,
    autoCropArea: 1,
  });
});

rotateLeft.addEventListener("click", () => cropper.rotate(-90));
rotateRight.addEventListener("click", () => cropper.rotate(90));

saveBtn.addEventListener("click", async () => {
  overlay.style.display = "flex";
  message.textContent = "";

  try {
    const { data:{session} } = await supabase.auth.getSession();
    if (!session) throw new Error("You must be logged in.");

    const userId = session.user.id;

    // Export cropped image at 400x400
    const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));

    const formData = new FormData();
    formData.append("file", blob);
    formData.append("userId", userId);

    const res = await fetch("/api/upload-avatar.js", {
      method: "POST",
      body: formData
    });

    const avatarUrl = await res.text();
    if (!res.ok) throw new Error(avatarUrl);

    // Update Supabase profile
    const { error } = await supabase.from("profile").upsert({
      id: userId,
      avatar_url: avatarUrl,
      avatar_public_id: `avatar_${userId}`
    });

    if (error) throw error;

    message.style.color = "green";
    message.textContent = "Avatar updated successfully!";
  } catch(err) {
    message.style.color = "red";
    message.textContent = err.message;
  } finally {
    overlay.style.display = "none";
  }
});
</script>

</body>
</html>
