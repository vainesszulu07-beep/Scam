<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Preview</title>

<style>

body{
font-family:sans-serif;
padding:20px;
background:#f0f2f5;
max-width:600px;
margin:auto;
}

h2{
text-align:center;
}

#previewContainer{
margin-top:15px;
text-align:center;
}

#previewContainer img{
max-width:100%;
border-radius:10px;
display:block;
margin:auto;
}

textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-top:10px;
resize:none;
}

button{
padding:8px 12px;
border-radius:6px;
border:none;
cursor:pointer;
margin:4px 2px;
}

.primary{
background:#1877f2;
color:white;
}

.danger{
background:crimson;
color:white;
}

</style>
</head>

<body>

<h2>Send Image</h2>

<div id="previewContainer">
<img id="imagePreview">
</div>

<textarea id="messageText" placeholder="Add a message..."></textarea>

<div style="margin-top:10px;">
<button id="discardBtn" class="danger">Discard</button>
<button id="sendBtn" class="primary">Send</button>
</div>


<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const imagePreview = document.getElementById("imagePreview");
const messageText = document.getElementById("messageText");
const discardBtn = document.getElementById("discardBtn");
const sendBtn = document.getElementById("sendBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

let currentUserId;
let uploadedImageUrl = null;
let uploadedPublicId = null;


/* AUTH */

(async () => {

const { data:{ session } } = await supabase.auth.getSession();

if(!session){
window.location.href="index.html";
return;
}

currentUserId = session.user.id;

})();



/* LOAD IMAGE FROM LOCALSTORAGE */

const stored = JSON.parse(localStorage.getItem("chat-image"));

if(!stored){

alert("No image selected");
window.location.href = `view-chat.html?conversationId=${conversationId}`;
}

uploadedImageUrl = stored.url;
uploadedPublicId = stored.publicId;

imagePreview.src = uploadedImageUrl;



/* DISCARD IMAGE */

discardBtn.onclick = async ()=>{

if(!uploadedPublicId) return;

await fetch("/api/delete-image.js",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
publicId:uploadedPublicId
})

});

localStorage.removeItem("chat-image");

window.location.href = `view-chat.html?conversationId=${conversationId}`;

};



/* SEND MESSAGE */

sendBtn.onclick = async ()=>{

const text = messageText.value.trim();

const { error } = await supabase
.from("messages")
.insert([{

conversation_id:conversationId,
sender_id:currentUserId,
content:text,
media_url:uploadedImageUrl,
media_id:uploadedPublicId

}]);


if(error){

alert("Failed to send message");
return;

}

localStorage.removeItem("chat-image");

window.location.href = `view-chat.html?conversationId=${conversationId}`;

};


</script>

</body>
</html>
