<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send Image</title>

<link href="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>

<style>
  :root {
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --danger-color: #ef4444;
    --danger-hover: #dc2626;
    --dark-color: #374151;
    --dark-hover: #1f2937;
    --bg-color: #f3f4f6;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --soft-blue: #eff6ff;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }

  .app-container {
    background: var(--card-bg);
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    padding: 24px;
    position: relative;
    box-sizing: border-box;
  }

  .back-arrow {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 20px;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
    user-select: none;
  }
  .back-arrow:hover {
    color: var(--text-main);
  }

  h2 {
    text-align: center;
    margin-top: 0;
    color: var(--text-main);
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .info-text {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .switch-card {
    background: var(--soft-blue);
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    text-align: center;
  }

  .switch-card p {
    margin: 0 0 10px 0;
    font-size: 13px;
    color: #1e3a8a;
    line-height: 1.4;
  }

  textarea {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    margin-bottom: 16px;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--primary-color);
  }

  .file-upload-wrapper {
    margin-bottom: 16px;
  }

  .file-upload-label {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    background: #f8fafc;
    border: 2px dashed #cbd5e1;
    border-radius: 8px;
    color: var(--primary-color);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .file-upload-label:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
  }

  input[type="file"] {
    display: none;
  }

  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: background 0.2s;
  }

  .primary { background: var(--primary-color); color: white; }
  .primary:hover { background: var(--primary-hover); }

  .danger { background: var(--danger-color); color: white; }
  .danger:hover { background: var(--danger-hover); }

  .dark { background: var(--dark-color); color: white; }
  .dark:hover { background: var(--dark-hover); }

  .light {
    background: #f3f4f6;
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }
  .light:hover { background: #e5e7eb; }

  #previewContainer {
    margin-top: 15px;
    text-align: center;
  }

  #previewContainer img, #previewContainer video {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: auto;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .crop-controls {
    margin-top: 16px;
    background: #f8fafc;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    display: none;
  }

  .aspect-buttons {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  #sendBtn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    font-size: 16px;
  }

  #processingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    font-weight: 500;
    z-index: 999;
    flex-direction: column;
  }

  .spinner {
    border: 3px solid rgba(255,255,255,0.3);
    border-top: 3px solid white;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>

<body>

<div class="app-container">
  <div class="back-arrow" id="backArrow">←</div>

  <h2>Send an Image</h2>
  <p class="info-text">Attach a picture and an optional message before sending.</p>

  <div class="switch-card">
    <p>Want to send a video instead?</p>
    <button id="goVideoBtn" class="dark">Switch to Send Video</button>
  </div>

  <textarea id="messageContent" placeholder="Write a message to go with your image..."></textarea>

  <div class="file-upload-wrapper">
    <label for="mediaFile" class="file-upload-label">
      + Choose a Picture
    </label>
    <input type="file" id="mediaFile" accept="image/*">
  </div>

  <div id="previewContainer">
    <img id="imagePreview" style="display:none;">
    <video id="videoPreview" controls style="display:none;"></video>
  </div>

  <div class="action-buttons">
    <button id="editBtn" class="dark" style="display:none;">Crop Image</button>
    <button id="discardBtn" class="danger" style="display:none;">Discard</button>
  </div>

  <div class="crop-controls" id="cropControls">
    <div>
      <button id="rotateLeft" class="dark">⟲</button>
      <button id="rotateRight" class="dark">⟳</button>
      <button id="applyCrop" class="primary">Apply Crop</button>
    </div>
    <div class="aspect-buttons">
      <button data-ratio="free" class="light">Free</button>
      <button data-ratio="1" class="light">1:1</button>
      <button data-ratio="1.777" class="light">16:9</button>
      <button data-ratio="0.8" class="light">4:5</button>
    </div>
  </div>

  <button id="sendBtn" class="primary">Send</button>
</div>

<div id="processingOverlay">
  <div class="spinner"></div>
  Processing...
</div>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

if (!conversationId) {
  alert("Conversation ID missing!");
  throw new Error("Missing conversationId");
}

document.getElementById("backArrow").onclick = () => {
  window.location.href = `view-chat.html?conversationId=${conversationId}`;
};

document.getElementById("goVideoBtn").onclick = () => {
  window.location.href = `send-video.html?conversationId=${conversationId}`;
};

const overlay = document.getElementById("processingOverlay");
const mediaFileEl = document.getElementById("mediaFile");
const imagePreviewEl = document.getElementById("imagePreview");
const videoPreviewEl = document.getElementById("videoPreview");
const messageContentEl = document.getElementById("messageContent");
const sendBtn = document.getElementById("sendBtn");
const cropControls = document.getElementById("cropControls");
const rotateLeft = document.getElementById("rotateLeft");
const rotateRight = document.getElementById("rotateRight");
const applyCrop = document.getElementById("applyCrop");
const discardBtn = document.getElementById("discardBtn");
const editBtn = document.getElementById("editBtn");

let currentUserId = null;
let cropper = null;
let uploadedMediaUrl = null;
let uploadedMediaId = null;
let isVideo = false;

function serverPublicId(pubId) {
  if (!pubId) return pubId;
  if (pubId.startsWith("posts/")) return pubId;
  return `posts/${pubId}`;
}

async function deleteRemoteImage(publicId) {
  if (!publicId) return;

  await fetch("/api/delete-image.js", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ publicId: serverPublicId(publicId) })
  });
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "index.html";
    return;
  }
  currentUserId = session.user.id;
})();

mediaFileEl.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Only images are allowed on this page.");
    mediaFileEl.value = "";
    return;
  }

  overlay.style.display = "flex";

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("userId", currentUserId);

    const res = await fetch("/api/upload-post.js", {
      method: "POST",
      body: formData
    });

    const result = await res.json();

    if (!res.ok) {
      throw new Error(result?.error || "Upload failed");
    }

    uploadedMediaUrl = result.url;
    uploadedMediaId = result.publicId;
    isVideo = false;

    imagePreviewEl.src = uploadedMediaUrl;
    imagePreviewEl.style.display = "block";
    videoPreviewEl.style.display = "none";

    editBtn.style.display = "inline-block";
    discardBtn.style.display = "inline-block";
    cropControls.style.display = "none";
  } catch (err) {
    alert(err.message);
  } finally {
    overlay.style.display = "none";
  }
});

function enableCrop() {
  if (!uploadedMediaUrl || isVideo) return;

  cropControls.style.display = "block";

  if (cropper) cropper.destroy();
  cropper = new Cropper(imagePreviewEl, {
    aspectRatio: NaN,
    viewMode: 1,
    dragMode: "move",
    autoCropArea: 1,
    responsive: true
  });
}

editBtn.onclick = enableCrop;

applyCrop.onclick = () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 });
  imagePreviewEl.src = canvas.toDataURL("image/jpeg", 0.9);
  cropper.destroy();
  cropper = null;
  cropControls.style.display = "none";
};

rotateLeft.onclick = () => cropper && cropper.rotate(-90);
rotateRight.onclick = () => cropper && cropper.rotate(90);

document.querySelectorAll("[data-ratio]").forEach(btn => {
  btn.onclick = () => {
    if (!cropper) return;
    const ratio = btn.dataset.ratio;
    cropper.setAspectRatio(ratio === "free" ? NaN : parseFloat(ratio));
  };
});

discardBtn.onclick = async () => {
  try {
    if (uploadedMediaId) {
      await deleteRemoteImage(uploadedMediaId);
    }
  } catch (err) {
    console.error(err);
  }

  uploadedMediaUrl = null;
  uploadedMediaId = null;
  isVideo = false;
  imagePreviewEl.src = "";
  videoPreviewEl.src = "";
  imagePreviewEl.style.display = "none";
  videoPreviewEl.style.display = "none";
  cropControls.style.display = "none";
  discardBtn.style.display = "none";
  editBtn.style.display = "none";
  mediaFileEl.value = "";

  if (cropper) {
    cropper.destroy();
    cropper = null;
  }
};

sendBtn.onclick = async () => {
  const content = messageContentEl.value.trim();
  if (!content && !uploadedMediaUrl) {
    alert("Message cannot be empty");
    return;
  }

  overlay.style.display = "flex";

  try {
    const { error } = await supabase.from("messages").insert([{
      conversation_id: conversationId,
      sender_id: currentUserId,
      content,
      media_url: uploadedMediaUrl,
      media_id: uploadedMediaId
    }]);

    if (error) throw error;

    window.location.href = `view-chat.html?conversationId=${conversationId}`;
  } catch (err) {
    alert("Failed to send message: " + err.message);
  } finally {
    overlay.style.display = "none";
  }
};
</script>

</body>
  </html>
