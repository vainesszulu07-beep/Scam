<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat with Last Seen</title>
  <style>
    :root{
      --bg:#f0f2f5;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#0d6efd;
      --success:#16a34a;
      --danger:#dc3545;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --sheet-shadow:0 -18px 50px rgba(0,0,0,.22);
      --radius:18px;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      padding-bottom: 110px;
    }

    .chat-container{
      width:100%;
      max-width:500px;
      height:100vh;
      display:flex;
      flex-direction:column;
      background:white;
      position:relative;
      margin: 0 auto;
      box-shadow: var(--shadow);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .chat-header{
      height:60px;
      display:flex;
      align-items:center;
      padding:0 12px;
      border-bottom:1px solid #ddd;
      background:white;
      position:relative;
      flex-shrink: 0;
    }

    .back-btn{
      font-size:22px;
      margin-right:10px;
      cursor:pointer;
      user-select:none;
    }

    .profile-wrapper{
      position:relative;
      margin-right:10px;
      flex-shrink: 0;
    }

    .chat-header img{
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
      position:relative;
      display:block;
      background:#e5e7eb;
    }

    .status-dot{
      position:absolute;
      bottom:0;
      right:0;
      width:10px;
      height:10px;
      border-radius:50%;
      border:2px solid white;
      background:grey;
    }

    .user-info {
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-width: 0;
    }

    .chat-header h3{
      margin:0;
      font-size:16px;
      line-height:1.1;
      word-break: break-word;
    }

    #lastSeen{
      font-size:12px;
      color:#666;
      font-weight:500;
      white-space:nowrap;
      margin-top:3px;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 320px;
    }

    .typing-indicator{
      position:absolute;
      bottom:75px;
      left:12px;
      display:none;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:18px;
      background:#f1f5f9;
      font-size:13px;
      z-index:1001;
      max-width: calc(100% - 24px);
    }

    .typing-avatar{
      width:24px;
      height:24px;
      border-radius:50%;
      object-fit:cover;
      flex-shrink: 0;
    }

    .typing-name{
      font-weight:600;
      white-space: nowrap;
    }

    .typing-dots span{
      animation:blink 1.4s infinite;
    }
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}

    @keyframes blink{
      0%{opacity:0}
      50%{opacity:1}
      100%{opacity:0}
    }

    .messages{
      flex:1;
      overflow-y:auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      background:#f0f2f5;
    }

    .message{
      max-width:70%;
      padding:10px 14px;
      border-radius:18px;
      font-size:14px;
      word-wrap:break-word;
      position:relative;
      user-select:none;
    }

    .sent{align-self:flex-end;background:#1877f2;color:white;}
    .received{align-self:flex-start;background:#e4e6eb;color:black;}

    .message img{
      max-width:100%;
      border-radius:12px;
      margin-top:6px;
      cursor:pointer;
    }

    .video-wrapper{
      position:relative;
      width:100%;
      margin-top:6px;
      cursor:pointer;
    }

    .video-wrapper video{
      width:100%;
      border-radius:12px;
      pointer-events:none;
    }

    .play-overlay{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.6);
      width:50px;
      height:50px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .play-overlay:before{
      content:'';
      border-style:solid;
      border-width:12px 0 12px 20px;
      border-color:transparent transparent transparent white;
    }

    .timestamp{
      display:block;
      font-size:10px;
      margin-top:4px;
      opacity:0.7;
      text-align:right;
    }

    .read-tick{
      font-size:12px;
      margin-left:4px;
      color:#4fc3f7;
    }

    .chat-input{
      height:65px;
      display:flex;
      align-items:center;
      padding:8px 12px;
      border-top:1px solid #ddd;
      background:white;
      gap:8px;
      flex-shrink: 0;
    }

    .chat-input input{
      flex:1;
      border:none;
      background:#f0f2f5;
      padding:12px 16px;
      border-radius:25px;
      outline:none;
      min-width: 0;
    }

    #sendBtn{
      background:#1877f2;
      color:white;
      padding:10px 18px;
      border:none;
      border-radius:25px;
      cursor:pointer;
      flex-shrink: 0;
    }

    .icon-btn{
      background:#1877f2;
      padding:8px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      border:none;
      cursor:pointer;
      flex-shrink: 0;
    }

    .icon-btn svg{
      width:20px;
      height:20px;
      fill:white;
    }

    .time-divider{
      display:flex;
      align-items:center;
      text-align:center;
      font-size:12px;
      color:#666;
      margin:12px 0;
    }

    .time-divider::before,
    .time-divider::after{
      content:'';
      flex:1;
      border-bottom:1px solid #ccc;
    }

    .time-divider span{
      padding:0 10px;
    }

    .hover-time{
      position:absolute;
      top:-16px;
      font-size:10px;
      opacity:0;
      transition:opacity .2s;
    }

    .message:hover .hover-time{opacity:1;}
    .sent .hover-time{right:0;color:white;}
    .received .hover-time{left:0;color:#555;}

    .scroll-down-btn{
      position:absolute;
      bottom:90px;
      right:15px;
      width:40px;
      height:40px;
      border-radius:50%;
      background:#1877f2;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-size:20px;
      display:none;
      z-index: 20;
    }

    /* Floating Navigation Bar */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      border-radius: 999px;
    }

    .bottom-nav-wrapper::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853, #4285f4);
      background-size: 200% 100%;
      filter: blur(10px);
      animation: googleShine 3s linear infinite;
      z-index: -1;
      opacity: 0.85;
    }

    @keyframes googleShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .bottom-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .nav-item {
      color: var(--muted);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
      transition: all 0.3s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--primary);
      background: #eff6ff;
      transform: translateY(-4px);
    }

    @media (max-width: 640px){
      body{
        padding:12px;
        padding-bottom: 90px;
      }

      .chat-container{
        border-radius: 14px;
      }

      #lastSeen{
        max-width: 200px;
      }

      .chat-input{
        gap:6px;
        padding:8px 10px;
      }

      .chat-input input{
        padding:12px 14px;
      }

      .bottom-nav{
        gap: 12px;
        padding: 8px 16px;
      }

      .nav-item{
        width: 42px;
        height: 42px;
      }
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="back-btn" onclick="window.location.href='message.html'">←</div>
    <div class="profile-wrapper">
      <img id="avatar">
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="user-info">
      <h3 id="username">Loading...</h3>
      <div id="lastSeen"></div>
    </div>
  </div>

  <div id="typingIndicator" class="typing-indicator"></div>
  <div id="messages" class="messages"></div>
  <div id="scrollDownBtn" class="scroll-down-btn">↓</div>

  <div class="chat-input">
    <input id="messageInput" placeholder="Message...">
    <button class="icon-btn" id="attachBtn">
      <svg viewBox="0 0 24 24">
        <path d="M16.5 6.5l-7.79 7.79a3 3 0 104.24 4.24l8.49-8.49a5 5 0 10-7.07-7.07L5.88 12.46"/>
      </svg>
    </button>
    <button id="sendBtn">Send</button>
  </div>
</div>

<div class="bottom-nav-wrapper">
  <nav class="bottom-nav">
    <a href="message.html" class="nav-item active" aria-label="Messages">
      <svg viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/>
      </svg>
    </a>
    <a href="lobby.html" class="nav-item" aria-label="Lobby">
      <svg viewBox="0 0 24 24">
        <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
    </a>
    <a href="settings.html" class="nav-item" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
      </svg>
    </a>
  </nav>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const username = document.getElementById("username");
const avatar = document.getElementById("avatar");
const lastSeenDiv = document.getElementById("lastSeen");
const statusDot = document.getElementById("statusDot");
const typingIndicator = document.getElementById("typingIndicator");
const scrollBtn = document.getElementById("scrollDownBtn");

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("conversationId");

const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  window.location.href = "index.html";
  throw new Error("No session");
}
const userId = session.user.id;

let conversationData;
let typingTimeout;
let lastDateDivider = null;

// ---------------- Helper: Lusaka time as UTC ----------------
function nowLusakaUTC() {
  const nowLocal = new Date();
  const offsetMinutes = -120;
  return new Date(nowLocal.getTime() - offsetMinutes * 60 * 1000);
}

// ---------------- Update own last_seen ----------------
async function updateLastSeen() {
  const lusakaUTC = nowLusakaUTC().toISOString();
  const { error } = await supabase
    .from("profile")
    .update({ last_seen: lusakaUTC })
    .eq("id", userId);

  if (error) console.error("Failed to update last_seen:", error);
}
updateLastSeen();
setInterval(updateLastSeen, 30000);

// ---------------- Check if other user is active ----------------
function isActive(lastSeenUTC) {
  if (!lastSeenUTC) return false;
  const nowUTC = nowLusakaUTC();
  const diffMs = nowUTC.getTime() - new Date(lastSeenUTC).getTime();
  const diffMinutes = diffMs / 1000 / 60;
  return diffMinutes < 2;
}

// ---------------- Load user using RPC ----------------
async function loadUser() {
  const { data, error } = await supabase.rpc(
    "get_conversation_details",
    { p_conversation_id: conversationId }
  );

  if (error) {
    console.error(error);
    return;
  }

  const row = data?.[0];
  if (!row) return;

  conversationData = {
    user1_id: row.user1_id,
    user2_id: row.user2_id,
    typing: row.typing,
    user1: {
      full_name: row.user1_full_name,
      avatar_url: row.user1_avatar_url,
      last_seen: row.user1_last_seen
    },
    user2: {
      full_name: row.user2_full_name,
      avatar_url: row.user2_avatar_url,
      last_seen: row.user2_last_seen
    }
  };

  const other =
    row.user1_id === userId
      ? conversationData.user2
      : conversationData.user1;

  username.textContent = other.full_name || "Unknown";
  avatar.src = other.avatar_url || "https://via.placeholder.com/40";

  if (isActive(other.last_seen)) {
    statusDot.style.background = "limegreen";
    lastSeenDiv.textContent = "";
  } else {
    statusDot.style.background = "grey";
    lastSeenDiv.textContent = other.last_seen
      ? "Last seen: " + new Date(other.last_seen).toLocaleString()
      : "Never";
  }
}

// ---------------- Messages ----------------
function scrollBottom() {
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function formatDivider(dateStr) {
  const msgDate = new Date(dateStr);
  const today = new Date();
  const startToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const startMsg = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
  const diff = (startToday - startMsg) / (1000 * 60 * 60 * 24);
  if (diff === 0) return msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (diff === 1) return "Yesterday";
  return msgDate.toDateString();
}

function addMessage(msg) {
  const msgDate = new Date(msg.created_at).toDateString();
  if (lastDateDivider !== msgDate) {
    const divider = document.createElement("div");
    divider.className = "time-divider";
    divider.innerHTML = "<span>" + formatDivider(msg.created_at) + "</span>";
    messagesDiv.appendChild(divider);
    lastDateDivider = msgDate;
  }

  const div = document.createElement("div");
  div.classList.add("message");
  if (msg.sender_id === userId) div.classList.add("sent");
  else div.classList.add("received");

  const hoverTime = document.createElement("div");
  hoverTime.className = "hover-time";
  hoverTime.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.appendChild(hoverTime);

  let content = msg.content || "";
  if (msg.media_url) {
    const isVideo = /\.(mp4|webm|ogg)$/i.test(msg.media_url);
    if (isVideo) {
      content += `<div class="video-wrapper"><video muted preload="metadata"><source src="${msg.media_url}"></video><div class="play-overlay"></div></div>`;
    } else {
      content += `<img src="${msg.media_url}">`;
    }
  }

  div.innerHTML += content +
    `<span class="timestamp">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>${
      msg.sender_id === userId ? `<span class="read-tick">${msg.read ? '✔✔' : '✔'}</span>` : ''
    }`;

  div.querySelectorAll("img").forEach(img => {
    img.onclick = () => window.location.href = `see-image.html?url=${encodeURIComponent(img.src)}`;
  });

  div.querySelectorAll(".video-wrapper").forEach(v => {
    v.onclick = () => window.location.href = `see-video.html?url=${encodeURIComponent(v.querySelector("source").src)}`;
  });

  messagesDiv.appendChild(div);
  scrollBottom();
}

async function loadMessages() {
  const { data: messages, error } = await supabase.rpc("get_conversation_messages", {
    p_conversation_id: conversationId
  });

  if (error) console.error("Error fetching messages:", error);

  messagesDiv.innerHTML = "";
  lastDateDivider = null;

  const data = messages || [];
  data.forEach(addMessage);

  const unreadIds = data
    .filter(m => m.sender_id !== userId && !m.read)
    .map(m => m.id);

  if (unreadIds.length) {
    await supabase.from("messages").update({ read: true }).in("id", unreadIds);
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  const { error } = await supabase.rpc("send_message", {
    p_conversation_id: conversationId,
    p_content: text,
    p_media_url: null,
    p_media_id: null
  });

  if (error) {
    console.error("Error sending message:", error);
    return;
  }

  input.value = "";

  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: false
  });
}

input.addEventListener("input", async () => {
  await supabase.rpc("set_conversation_typing", {
    p_conversation_id: conversationId,
    p_is_typing: true
  });

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(async () => {
    await supabase.rpc("set_conversation_typing", {
      p_conversation_id: conversationId,
      p_is_typing: false
    });
  }, 1000);
});

messagesDiv.addEventListener("scroll", () => {
  const distance = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight;
  scrollBtn.style.display = distance > 300 ? "flex" : "none";
});

scrollBtn.onclick = () => scrollBottom();

supabase.channel("chat-" + conversationId)
  .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `conversation_id=eq.${conversationId}` }, payload => {
    addMessage(payload.new);
  })
  .on("postgres_changes", { event: "UPDATE", schema: "public", table: "conversations", filter: `id=eq.${conversationId}` }, payload => {
    conversationData.typing = payload.new.typing || {};
    const typingUsers = Object.keys(conversationData.typing).filter(uid => conversationData.typing[uid]);

    if (typingUsers.length) {
      const uid = typingUsers.find(id => id !== userId) || typingUsers[0];
      const user = uid === conversationData.user1_id ? conversationData.user1 : conversationData.user2;
      typingIndicator.style.display = "flex";
      typingIndicator.innerHTML = `
        <img class="typing-avatar" src="${user.avatar_url || 'https://via.placeholder.com/24'}">
        <span class="typing-name">${user.full_name || "Typing"}</span>
        <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>
      `;
    } else {
      typingIndicator.style.display = "none";
    }
  })
  .subscribe();

sendBtn.onclick = sendMessage;
input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
attachBtn.onclick = () => {
  location.href = `media-preview.html?conversationId=${conversationId}`;
};

await loadUser();
await loadMessages();
</script>
</body>
        </html>
