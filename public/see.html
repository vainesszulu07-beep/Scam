<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Image Test</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6fb;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #b91c1c;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #f1f5f9;
      text-align: left;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Delete Image</h2>

    <input 
      type="text" 
      id="publicIdInput" 
      placeholder="Enter publicId (e.g. abc123)"
    />

    <button id="deleteBtn">Delete Image</button>

    <div id="status" class="status">Waiting...</div>
  </div>

  <script>
    const deleteBtn = document.getElementById("deleteBtn");
    const input = document.getElementById("publicIdInput");
    const statusBox = document.getElementById("status");

    deleteBtn.onclick = async () => {
      const publicId = input.value.trim();

      if (!publicId) {
        statusBox.textContent = "Please enter a publicId.";
        return;
      }

      statusBox.textContent = "Sending request...";

      try {
        const res = await fetch("/api/delete-image.js", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ publicId })
        });

        const data = await res.json();

        statusBox.textContent = 
          "Status: " + res.status + "\n\n" +
          JSON.stringify(data, null, 2);

      } catch (err) {
        statusBox.textContent = "Request failed:\n" + err.message;
      }
    };
  </script>

</body>
</html>
