<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

/* BODY */
body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
background:#f0f2f5;
}

/* APP */
.app{
max-width:480px;
margin:auto;
background:white;
min-height:100vh;
position:relative;
}

/* COVER */
.cover{
height:200px;
background:#ddd;
position:relative;
overflow:hidden;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.8);
}

/* PROFILE PIC */
.profile-pic{
position:absolute;
bottom:-40px;
left:16px;
width:95px;
height:95px;
border-radius:50%;
border:4px solid white;
object-fit:cover;
background:#eee;
}

/* INFO */
.info{
margin-top:50px;
padding:0 16px;
}

.name{
font-size:20px;
font-weight:600;
}

.bio{
font-size:14px;
color:#65676b;
margin-top:4px;
}

/* BUTTONS */
.buttons{
display:flex;
gap:10px;
margin-top:12px;
}

.btn{
flex:1;
padding:10px;
border-radius:8px;
border:none;
font-weight:600;
font-size:14px;
cursor:pointer;
}

.add{
background:#1877f2;
color:white;
}

.chat{
background:#e4e6eb;
}

/* POSTS */
.posts{
margin-top:20px;
padding:10px;
}

/* OLD FLOATING NAV BAR */
.nav{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:460px;
background:white;
height:60px;
display:flex;
justify-content:space-around;
align-items:center;
border-radius:30px;
box-shadow:0 -1px 6px rgba(0,0,0,0.2);
}

.nav svg{
width:26px;
height:26px;
fill:#1877f2;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<!-- COVER -->
<div class="cover">
<img id="coverImg">
<img id="avatar" class="profile-pic">
</div>

<!-- INFO -->
<div class="info">

<div class="name" id="name">Loading...</div>
<div class="bio" id="bio"></div>

<div class="buttons">
<button id="addPostBtn" class="btn add">Add Post</button>
<button id="chatBtn" class="btn chat">Chat</button>
</div>

</div>

<div class="posts" id="posts">
Loading posts...
</div>

</div>

<!-- NAVBAR -->
<div class="nav">

<svg onclick="location.href='social.html'" viewBox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
</svg>

<svg onclick="location.href='profile.html'" viewBox="0 0 24 24">
<path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2c-3.3 0-9.9 1.7-9.9 5v3h19.8v-3c0-3.3-6.6-5-9.9-5z"/>
</svg>

<svg onclick="location.href='users.html'" viewBox="0 0 24 24">
<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/>
</svg>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabase=createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
)

/* SESSION */

const {data:{session}}=await supabase.auth.getSession()

if(!session){
alert("Login required")
location.href="login.html"
}

const loggedUser=session.user.id

/* GET PROFILE ID */

const params=new URLSearchParams(location.search)

/* SUPPORT BOTH id AND profileId */

const profileId=
params.get("id") ||
params.get("profileId") ||
loggedUser

const isOwner=profileId===loggedUser

/* ELEMENTS */

const avatar=document.getElementById("avatar")
const cover=document.getElementById("coverImg")
const name=document.getElementById("name")
const bio=document.getElementById("bio")

const addBtn=document.getElementById("addPostBtn")
const chatBtn=document.getElementById("chatBtn")

/* LOAD PROFILE */

const {data:profile}=await supabase
.from("profile")
.select("*")
.eq("id",profileId)
.single()

name.textContent=profile.full_name
bio.textContent=profile.bio || ""

const img=profile.avatar_url || "https://via.placeholder.com/200"

avatar.src=img
cover.src=img

/* BUTTON LOGIC */

if(isOwner){

chatBtn.style.display="none"

addBtn.onclick=()=>{
location.href="media-preview.html"
}

}else{

addBtn.style.display="none"

chatBtn.onclick=async()=>{

let {data:conv}=await supabase
.from("conversations")
.select("*")
.or(`user1.eq.${loggedUser},user2.eq.${loggedUser}`)
.limit(1)
.single()

if(!conv){

const {data:newConv}=await supabase
.from("conversations")
.insert({
user1:loggedUser,
user2:profileId
})
.select()
.single()

conv=newConv

}

location.href=`view-chat.html?id=${conv.id}`

}

}

</script>

</body>
  </html>
