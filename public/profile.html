<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
/* BODY */
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  color: #050505;
  min-height: 100vh;
  overflow-x: hidden;
}

/* APP CONTAINER */
.profile-container {
  max-width: 480px;
  margin: auto;
  background: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* BLACK COVER AREA */
.cover-img {
  width: 100%;
  height: 200px;
  background-color: #000; /* solid black */
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: relative;
}

/* PROFILE IMAGE */
.profile-pic-container {
  position: absolute;
  bottom: -50px;
  border-radius: 50%;
  border: 4px solid #fff;
  width: 100px;
  height: 100px;
  overflow: hidden;
  background: #eee;
}

.profile-pic-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* PLUS BUTTON */
#openNoteBtn {
  position: absolute;
  bottom: 0;
  right: -8px;
  background: #1877f2;
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  border: 2px solid white;
  z-index: 10;
}

/* PROFILE INFO */
.profile-info {
  text-align: center;
  padding: 60px 20px 20px 20px;
}

.username {
  font-size: 22px;
  font-weight: 700;
}

.bio {
  font-size: 14px;
  color: #65676b;
  margin-top: 4px;
  line-height: 1.4;
}

/* BUTTONS */
.buttons-container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 15px 20px 20px 20px;
}

.profile-btn {
  flex: 1;
  max-width: 160px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}

#addPostBtn { background: #1877f2; color: white; }
#addPostBtn:hover { background: #145db2; }

#startChatBtn { background: #42b72a; color: white; }
#startChatBtn:hover { background: #2c8c1d; }

/* THOUGHT CLOUD */
.thought-container {
  position: absolute;
  top: 180px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  flex-direction: column;
  align-items: center;
  z-index: 10;
}

.note-cloud {
  background: #fff;
  padding: 10px 14px;
  border-radius: 25px;
  font-size: 14px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 240px;
}

.note-action {
  cursor: pointer;
  font-weight: bold;
  color: #1877f2;
}

/* Bubbles under thought */
.bubble-mid { width: 10px; height: 10px; background: #fff; border-radius: 50%; margin-top: 3px; }
.bubble-small { width: 6px; height: 6px; background: #fff; border-radius: 50%; margin-top: 2px; }

/* POSTS */
.posts-container {
  padding: 15px;
  flex: 1;
}

/* NAVBAR */
.navbar {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  min-width: 300px;
  max-width: 480px;
  height: 60px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -1px 6px rgba(0,0,0,0.18);
  border-radius: 30px;
  padding: 0 10px;
  z-index: 1000;
}

.nav-icon {
  width: 50px;
  height: 50px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:50%;
  transition: background 0.2s;
}

.nav-icon:hover{ background:#e4e6eb; }
.nav-icon svg{ width:28px; height:28px; fill:#1877f2; }
.nav-icon.active svg{ fill:#050505; }
</style>
</head>
<body>

<div class="profile-container">
  <!-- BLACK COVER IMAGE -->
  <div class="cover-img"></div>

  <!-- PROFILE IMAGE + PLUS BUTTON -->
  <div class="profile-pic-container" id="profilePicContainer" style="left:50%; transform: translateX(-50%);">
    <img id="avatar" src="">
    <div id="openNoteBtn">+</div>
  </div>

  <!-- THOUGHT CLOUD -->
  <div class="thought-container" id="thoughtContainer">
    <div class="note-cloud">
      <span id="noteText">Write something</span>
      <span id="noteAction" class="note-action">+</span>
    </div>
    <div class="bubble-mid"></div>
    <div class="bubble-small"></div>
  </div>

  <!-- PROFILE INFO -->
  <div class="profile-info">
    <div class="username" id="username">Username</div>
    <div class="bio" id="bio">User bio</div>

    <div class="buttons-container">
      <button class="profile-btn" id="addPostBtn">Add Post</button>
      <button class="profile-btn" id="startChatBtn">Chat</button>
    </div>
  </div>

  <!-- POSTS -->
  <div class="posts-container" id="postsContainer">Loading posts...</div>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-icon" id="toHome">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </div>
  <div class="nav-icon active" id="toProfile">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2c-3.3 0-9.9 1.7-9.9 5v3h19.8v-3c0-3.3-6.6-5-9.9-5z"/></svg>
  </div>
  <div class="nav-icon" id="toUsers">
    <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 01-3.14.86 4.48 4.48 0 001.98-2.48 9.06 9.06 0 01-2.88 1.1A4.52 4.52 0 0016.5 2c-2.5 0-4.5 2-4.5 4.5 0 .35.04.7.11 1.03-3.74-.18-7.06-1.97-9.28-4.66a4.49 4.49 0 00-.61 2.27c0 1.57.8 2.95 2.03 3.77a4.49 4.49 0 01-2.04-.56v.06c0 2.2 1.57 4.03 3.65 4.44a4.52 4.52 0 01-2.03.08 4.5 4.5 0 004.2 3.13A9.04 9.04 0 010 19.54a12.73 12.73 0 006.92 2.03c8.3 0 12.84-6.87 12.84-12.84 0-.2 0-.39-.01-.58A9.22 9.22 0 0023 3z"/></svg>
  </div>
  <div class="nav-icon" id="toSettings">
    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.66.07-1s-.03-.68-.07-1l2.11-1.65a.5.5 0 00.12-.66l-2-3.46a.5.5 0 00-.61-.22l-2.49 1a6.992 6.992 0 00-1.7-.99l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.43l-.38 2.65c-.63.24-1.22.57-1.7.99l-2.49-1a.5.5 0 00-.61.22l-2 3.46a.5.5 0 00.12.66L4.57 11c-.04.32-.07.66-.07 1s.03.68.07 1l-2.11 1.65a.5.5 0 00-.12.66l2 3.46c.14.24.42.34.66.22l2.49-1c.48.42 1.07.75 1.7.99l.38 2.65c.05.28.27.49.5.49h4c.23 0 .45-.21.5-.49l.38-2.65c.63-.24 1.22-.57 1.7-.99l2.49 1c.24.12.52.02.66-.22l2-3.46a.5.5 0 00-.12-.66l-2.11-1.65zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

/* NAVIGATION */
toHome.onclick = () => location.href = "social.html";
toProfile.onclick = () => location.href = "profile.html";
toUsers.onclick = () => location.href = "users.html";
toSettings.onclick = () => location.href = "settings.html";

/* ELEMENTS */
const avatar = document.getElementById("avatar");
const username = document.getElementById("username");
const bio = document.getElementById("bio");
const noteText = document.getElementById("noteText");
const noteAction = document.getElementById("noteAction");
const addPostBtn = document.getElementById("addPostBtn");
const startChatBtn = document.getElementById("startChatBtn");
const thoughtContainer = document.getElementById("thoughtContainer");
const openNoteBtn = document.getElementById("openNoteBtn");

/* SESSION */
const { data:{ session } } = await supabase.auth.getSession();
if(!session){ alert("Not logged in"); throw new Error("No session"); }
const loggedUser = session.user.id;

const params = new URLSearchParams(location.search);
const profileId = params.get("profileId") || loggedUser;
const isOwner = loggedUser === profileId;

/* LOAD PROFILE */
const { data: profile } = await supabase
  .from("profile")
  .select("*")
  .eq("id", profileId)
  .single();

avatar.src = profile.avatar_url || "https://via.placeholder.com/100";
username.textContent = profile.full_name;
bio.textContent = profile.bio || "";
noteText.textContent = profile.notes || "Write something";

/* THOUGHT CLOUD LOGIC */
let editing = false;
const WORD_LIMIT = 20;
thoughtContainer.style.display = profile.notes ? "flex" : "none";
if(!isOwner){ openNoteBtn.style.display="none"; noteAction.style.display="none"; }

openNoteBtn.onclick = () => {
  thoughtContainer.style.display = "flex";
  noteText.contentEditable = true;
  noteText.focus();
  editing = true;
  noteAction.textContent = "✔";
};

noteAction.onclick = async () => {
  if(!editing) return;
  let text = noteText.textContent.trim();
  if(text.split(/\s+/).length > WORD_LIMIT){ alert("Note limit is 20 words."); return; }
  if(text === ""){
    thoughtContainer.style.display="none";
    await supabase.from("profile").update({notes:null}).eq("id",profileId);
  }else{
    await supabase.from("profile").update({notes:text}).eq("id",profileId);
  }
  noteText.contentEditable=false;
  noteAction.textContent="+";
  editing=false;
};

/* BUTTON LOGIC */
if(isOwner){
  startChatBtn.style.display="none";
  addPostBtn.onclick = ()=> location.href="media-preview.html";
}else{
  addPostBtn.style.display="none";
  startChatBtn.onclick = async()=>{
    let {data:conversation} = await supabase
      .from("conversations")
      .select("*")
      .or(`user1.eq.${loggedUser},user2.eq.${loggedUser}`)
      .limit(1)
      .single();
    if(!conversation){
      const {data:newConv} = await supabase
        .from("conversations")
        .insert({user1:loggedUser,user2:profileId})
        .select()
        .single();
      conversation = newConv;
    }
    location.href=`view-chat.html?conversationId=${conversation.id}`;
  };
}
</script>
</body>
  </html>
