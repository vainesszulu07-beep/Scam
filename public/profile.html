<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>

body{
font-family: Arial;
margin:0;
background:#0f0f0f;
color:white;
}

/* PROFILE HEADER */

.profile-header{
text-align:center;
padding:30px;
}

.profile-pic{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:3px solid #ff004f;
}

.username{
font-size:22px;
margin-top:10px;
}

.bio{
margin-top:10px;
opacity:0.8;
}

/* ADD POST BUTTON */

.add-post{
margin:20px auto;
width:60px;
height:60px;
background:#ff004f;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
cursor:pointer;
}

/* POSTS GRID */

.posts{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
padding:10px;
}

.post{
position:relative;
width:100%;
aspect-ratio:1/1;
overflow:hidden;
}

.post img,
.post video{
width:100%;
height:100%;
object-fit:cover;
}

video{
background:black;
}

</style>
</head>

<body>

<!-- PROFILE HEADER -->

<div class="profile-header">

<img id="profilePic" class="profile-pic" src="">

<div class="username" id="username"></div>

<!-- ADD POST BUTTON -->

<div class="add-post" onclick="openUpload()">+</div>

<div class="bio" id="bio"></div>

</div>

<!-- POSTS GRID -->

<div class="posts" id="posts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabase = supabase.createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
)

async function loadProfile(){

const { data: { user } } = await supabase.auth.getUser()

/* LOAD PROFILE */

const { data: profile } = await supabase
.from("profile")
.select("*")
.eq("id", user.id)
.single()

document.getElementById("profilePic").src = profile.avatar_url
document.getElementById("username").innerText = profile.username
document.getElementById("bio").innerText = profile.bio

/* LOAD POSTS */

const { data: posts } = await supabase
.from("posts")
.select("*")
.eq("user_id", user.id)
.order("created_at", { ascending:false })

const container = document.getElementById("posts")

posts.forEach(post => {

const div = document.createElement("div")
div.className = "post"

if(post.video_url){

div.innerHTML = `
<video muted autoplay loop playsinline>
<source src="${post.video_url}" type="video/mp4">
</video>
`

}

else if(post.image_url){

div.innerHTML = `
<img src="${post.image_url}">
`

}

container.appendChild(div)

})

}

function openUpload(){

window.location.href = "upload.html"

}

loadProfile()

</script>

</body>
</html>
