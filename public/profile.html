<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  width: 100%;
  max-width: 420px;
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.15);
  position: relative;
}

/* ✨ Avatar Animation */
.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #6366f1;
  margin-bottom: 20px;
  opacity: 0;
  transform: scale(0.8) rotate(-10deg);
  animation: avatarIntro 0.8s ease forwards;
  animation-delay: 0.3s;
}

@keyframes avatarIntro {
  to {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
}

.name {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #111827;
}

.bio {
  font-size: 15px;
  color: #6b7280;
  margin-bottom: 25px;
  line-height: 1.5;
}

.actions {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 500;
}

.edit-btn {
  background: #6366f1;
  color: white;
}

.edit-btn:hover {
  background: #4f46e5;
}

.logout-btn {
  background: #e5e7eb;
}

.logout-btn:hover {
  background: #d1d5db;
}

.loading {
  color: #6b7280;
}
</style>
</head>
<body>

<div class="card">
  <div id="loading" class="loading">Loading profile...</div>

  <img id="avatar" class="avatar" />
  <div id="name" class="name"></div>
  <div id="bio" class="bio"></div>

  <div class="actions">
    <button class="edit-btn" onclick="window.location.href='/manage.html'">
      Edit Profile
    </button>
    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatar = document.getElementById("avatar");
const nameDiv = document.getElementById("name");
const bioDiv = document.getElementById("bio");
const loading = document.getElementById("loading");

// 🔹 Load profile from Supabase table
async function loadProfile() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    window.location.href = "/login.html";
    return;
  }

  const userId = session.user.id;

  const { data: profile, error } = await supabase
    .from("profile")
    .select("full_name, bio, avatar_url")
    .eq("id", userId)
    .single();

  if (error || !profile) {
    window.location.href = "/manage.html";
    return;
  }

  // Display profile
  loading.style.display = "none";
  avatar.src = profile.avatar_url || "https://via.placeholder.com/120";
  nameDiv.innerText = profile.full_name || "No Name";
  bioDiv.innerText = profile.bio || "No bio added yet.";
}

// 🔹 Real-time updates for profile
function subscribeToProfile(userId) {
  supabase
    .channel('public:profile')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'profile', filter: `id=eq.${userId}` },
      (payload) => {
        if (payload.new) {
          avatar.src = payload.new.avatar_url || "https://via.placeholder.com/120";
          nameDiv.innerText = payload.new.full_name || "No Name";
          bioDiv.innerText = payload.new.bio || "No bio added yet.";
        }
      }
    )
    .subscribe();
}

// 🔹 Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  window.location.href = "/login.html";
});

// 🔹 Init
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = "/login.html";
    return;
  }

  const userId = session.user.id;

  await loadProfile();
  subscribeToProfile(userId);
})();
</script>

</body>
  </html>
