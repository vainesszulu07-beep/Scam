<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<style>
/* BASIC BODY */
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f2f5;
  color: #050505;
  padding-bottom: 80px; /* space for navbar */
}

/* PROFILE CONTAINER */
.profile-container {
  max-width: 480px;
  margin: 0 auto;
}

/* PROFILE HEADER */
.profile-header {
  padding: 20px;
  text-align: center;
  background: linear-gradient(135deg,#6a11cb,#2575fc);
  color: white;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}
.profile-header img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 4px solid white;
  object-fit: cover;
  margin-bottom: 10px;
  cursor: pointer;
}
.username {
  font-size: 20px;
  font-weight: bold;
}
.bio {
  font-size: 14px;
  opacity: 0.9;
  margin-top: 5px;
}
.add-post {
  margin-top: 15px;
  padding: 10px 16px;
  background: #1877f2;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  width: 90%;
}

/* POSTS FEED */
.posts-container {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.post-card {
  background: #fff;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  overflow: hidden;
  position: relative;
  transition: transform 0.15s ease;
}
.post-card:hover {
  transform: translateY(-2px);
}

/* POST HEADER */
.post-header {
  display: flex;
  align-items: center;
  padding: 12px;
  gap: 12px;
}
.post-header img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  object-fit: cover;
}
.post-header .name {
  font-weight: bold;
  font-size: 15px;
}
.post-options {
  margin-left: auto;
  cursor: pointer;
  font-size: 18px;
  user-select: none;
}

/* DELETE MENU */
.delete-menu {
  position: absolute;
  top: 10px;
  right: 10px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  padding: 5px 0;
  display: none;
  z-index: 10;
}
.delete-menu button {
  border: none;
  background: none;
  padding: 8px 16px;
  width: 100%;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}
.delete-menu button:hover {
  background: #f2f2f2;
}

/* POST CONTENT */
.post-content {
  padding: 10px 12px;
  font-size: 14px;
}

/* MEDIA (IMAGE/VIDEO) */
.post-media {
  position: relative;
  cursor: pointer;
}
.post-media img,
.post-media video {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-bottom-left-radius: 15px;
  border-bottom-right-radius: 15px;
}
.video-overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-overlay svg {
  width: 60px;
  height: 60px;
}

/* NAVBAR */
.navbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  min-width: 300px;
  max-width: 480px;
  height: 60px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -1px 5px rgba(0,0,0,0.15);
  border-radius: 30px;
  padding: 0 10px;
  z-index: 1000;
}
.nav-icon {
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 50%;
}
.nav-icon:hover {
  background: #e4e6eb;
}
.nav-icon svg {
  width: 28px;
  height: 28px;
  fill: #1877f2;
}
.nav-icon.active svg {
  fill: #050505;
}
</style>
</head>
<body>

<div class="profile-container">
  <div class="profile-header">
    <img id="avatar" src="https://via.placeholder.com/120">
    <div class="username" id="username">Username</div>
    <div class="bio" id="bio">User bio</div>
    <button class="add-post" id="addPostBtn">Add Post</button>
  </div>

  <div class="posts-container" id="postsContainer">
    <div style="text-align:center;color:#777;">No posts yet</div>
  </div>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-icon" id="toHome">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </div>
  <div class="nav-icon active" id="toProfile">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2c-3.3 0-9.9 1.7-9.9 5v3h19.8v-3c0-3.3-6.6-5-9.9-5z"/></svg>
  </div>
  <div class="nav-icon" id="toUsers">
    <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 01-3.14.86 4.48 4.48 0 001.98-2.48 9.06 9.06 0 01-2.88 1.1A4.52 4.52 0 0016.5 2c-2.5 0-4.5 2-4.5 4.5 0 .35.04.7.11 1.03-3.74-.18-7.06-1.97-9.28-4.66a4.49 4.49 0 00-.61 2.27c0 1.57.8 2.95 2.03 3.77a4.49 4.49 0 01-2.04-.56v.06c0 2.2 1.57 4.03 3.65 4.44a4.52 4.52 0 01-2.03.08 4.5 4.5 0 004.2 3.13A9.04 9.04 0 010 19.54a12.73 12.73 0 006.92 2.03c8.3 0 12.84-6.87 12.84-12.84 0-.2 0-.39-.01-.58A9.22 9.22 0 0023 3z"/></svg>
  </div>
  <div class="nav-icon" id="toSettings">
    <svg viewBox="0 0 24 24">      
      <path d="M19.43 12.98c.04-.32.07-.66.07-1s-.03-.68-.07-1l2.11-1.65a.5.5 0 00.12-.66l-2-3.46a.5.5 0 00-.61-.22l-2.49 1a6.992 6.992 0 00-1.7-.99l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.43l-.38 2.65c-.63.24-1.22.57-1.7.99l-2.49-1a.5.5 0 00-.61.22l-2 3.46a.5.5 0 00.12.66L4.57 11c-.04.32-.07.66-.07 1s.03.68.07 1l-2.11 1.65a.5.5 0 00-.12.66l2 3.46c.14.24.42.34.66.22l2.49-1c.48.42 1.07.75 1.7.99l.38 2.65c.05.28.27.49.5.49h4c.23 0 .45-.21.5-.49l.38-2.65c.63-.24 1.22-.57 1.7-.99l2.49 1c.24.12.52.02.66-.22l2-3.46a.5.5 0 00-.12-.66l-2.11-1.65zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/>      
    </svg>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatar = document.getElementById("avatar");
const username = document.getElementById("username");
const bio = document.getElementById("bio");
const postsContainer = document.getElementById("postsContainer");

avatar.addEventListener("click", ()=>{ window.location.href="manage.html"; });
document.getElementById("toUsers").onclick = ()=>location.href="users.html";
document.getElementById("toHome").onclick = ()=>location.href="social.html";
document.getElementById("toSettings").onclick = ()=>location.href="settings.html";
document.getElementById("addPostBtn").onclick = ()=>location.href="posting.html";

// Delete & Load profile functions
async function deletePost(publicId,type,postId){
  const api = type==="video"?"/api/delete-video.js":"/api/delete-image.js";
  try {
    const res = await fetch(api,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ publicId })
    });
    if(res.ok){
      await supabase.from("posts").delete().eq("id",postId);
      loadProfile();
    } else alert("Delete failed");
  } catch(e){ console.error(e); alert("Error deleting post"); }
}

async function loadProfile(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session) return;
  const userId = session.user.id;
  const { data: profile } = await supabase.from("profile").select("*").eq("id",userId).single();
  avatar.src = profile.avatar_url || "https://via.placeholder.com/120";
  username.textContent = profile.full_name;
  bio.textContent = profile.bio || "";

  const { data: posts } = await supabase.from("posts").select("*").eq("user_id",userId).order("created_at",{ascending:false});
  postsContainer.innerHTML="";
  if(!posts.length){ postsContainer.innerHTML=`<div style="text-align:center;color:#777;">No posts yet</div>`; return; }

  posts.forEach(post=>{
    const card = document.createElement("div");
    card.className="post-card";

    let media="", type="";
    if(post.image_url){ media=`<div class="post-media"><img src="${post.image_url}" alt="post image"></div>`; type="image"; }
    if(post.video_url){
      media=`<div class="post-media"><video src="${post.video_url}" muted loop></video>
             <div class="video-overlay">
               <svg width="60" height="60" viewBox="0 0 64 64">
                 <circle cx="32" cy="32" r="32" fill="rgba(0,0,0,0.5)"/>
                 <polygon points="26,20 26,44 46,32" fill="white"/>
               </svg>
             </div>
             </div>`;
      type="video";
    }

    card.innerHTML=`
      <div class="post-header">
        <img src="${avatar.src}" alt="avatar">
        <div class="name">${username.textContent}</div>
        <div class="post-options">⋮</div>
        <div class="delete-menu">
          <button class="delete-btn">Delete</button>
        </div>
      </div>
      ${post.content?`<div class="post-content">${post.content}</div>`:""}
      ${media}
    `;
    postsContainer.appendChild(card);

    const deleteBtn = card.querySelector(".delete-btn");
    const optionsBtn = card.querySelector(".post-options");
    optionsBtn.addEventListener("click",(e)=>{e.stopPropagation(); const menu=card.querySelector(".delete-menu"); menu.style.display=menu.style.display==="block"?"none":"block";});
    deleteBtn.addEventListener("click",()=>{const publicId=type==="video"?post.video_public_id:post.image_public_id; deletePost(publicId,type,post.id);});

    const videoEl=card.querySelector(".post-media video");
    if(videoEl) videoEl.parentElement.addEventListener("click",()=>window.location.href=`view-video.html?video=${encodeURIComponent(post.video_url)}`);
  });
}

loadProfile();
</script>

</body>
  </html>
