<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

/* ------------------ BASIC BODY ------------------ */

body{
margin:0;
font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
background:#f0f2f5;
color:#050505;
padding-bottom:80px;
}

body:not(.loaded) .profile-container{visibility:hidden;}

/* ------------------ PROFILE CONTAINER ------------------ */

.profile-container{
max-width:480px;
margin:auto;
position:relative;
padding-bottom:40px;
}

/* ------------------ HEADER ------------------ */

.profile-header{
padding:20px 10px 40px 10px;
text-align:center;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:white;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
position:relative;
}

/* ------------------ AVATAR ------------------ */

.profile-header img{
width:110px;
height:110px;
border-radius:50%;
border:4px solid white;
object-fit:cover;
margin-bottom:10px;
cursor:pointer;
}

/* ------------------ NOTE CLOUD ------------------ */

.note-wrapper{
position:absolute;
top:5px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:6px;
}

.note-cloud{
background:white;
color:#333;
padding:6px 10px;
font-size:12px;
border-radius:20px;
max-width:120px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
text-align:center;
}

.note-edit-btn{
width:22px;
height:22px;
border-radius:50%;
background:#1877f2;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
cursor:pointer;
}

/* ------------------ USERNAME ------------------ */

.username{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.bio{
font-size:14px;
opacity:0.9;
margin-top:5px;
}

/* ------------------ BUTTONS ------------------ */

.buttons-container{
margin-top:15px;
display:flex;
gap:10px;
justify-content:center;
}

.profile-btn{
flex:1;
padding:10px 0;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
color:white;
}

#addPostBtn{background:#1877f2;}
#startChatBtn{background:#4CAF50;}

/* ------------------ POSTS ------------------ */

.posts-container{
padding:10px;
display:flex;
flex-direction:column;
gap:15px;
}

.post-card{
background:white;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.12);
overflow:hidden;
}

.post-header{
display:flex;
align-items:center;
padding:12px;
gap:12px;
}

.post-header img{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
}

.post-header .name{
font-weight:bold;
}

.post-content{
padding:0 12px 10px;
font-size:14px;
}

/* MEDIA */

.post-media{
position:relative;
cursor:pointer;
}

.post-media img,
.post-media video{
width:100%;
height:auto;
max-height:280px;
object-fit:contain;
background:black;
}

/* play overlay */

.video-overlay{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,0.5);
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

.video-overlay svg{
width:30px;
height:30px;
fill:white;
}

/* ------------------ NAVBAR ------------------ */

.navbar{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:480px;
height:60px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -1px 5px rgba(0,0,0,0.2);
}

.nav-icon{
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.nav-icon svg{
width:26px;
height:26px;
fill:#1877f2;
}

</style>
</head>

<body>

<div class="profile-container">

<div class="profile-header">

<div class="note-wrapper">
<div class="note-cloud" id="noteCloud">Write something ☁️</div>
<div class="note-edit-btn" id="noteEditBtn">+</div>
</div>

<img id="avatar" src="https://via.placeholder.com/120">

<div class="username" id="username">Username</div>
<div class="bio" id="bio">User bio</div>

<div class="buttons-container">
<button class="profile-btn" id="addPostBtn">Add Post</button>
<button class="profile-btn" id="startChatBtn">Chat</button>
</div>

</div>

<div class="posts-container" id="postsContainer">
<div style="text-align:center;color:#777;">Loading posts...</div>
</div>

</div>

<!-- NAVBAR -->

<div class="navbar">

<div class="nav-icon" id="toHome">
<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
</div>

<div class="nav-icon" id="toProfile">
<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2c-3.3 0-9.9 1.7-9.9 5v3h19.8v-3c0-3.3-6.6-5-9.9-5z"/></svg>
</div>

<div class="nav-icon" id="toUsers">
<svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zM8 11c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3z"/></svg>
</div>

<div class="nav-icon" id="toSettings">
<svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.49 7.49 0 000-1.88l2.03-1.58-2-3.46-2.39.96a7.14 7.14 0 00-1.63-.95L14.5 2h-5l-.65 3.05a7.14 7.14 0 00-1.63.95l-2.39-.96-2 3.46 2.03 1.58a7.49 7.49 0 000 1.88L2.83 14.5l2 3.46 2.39-.96c.5.39 1.05.72 1.63.95L9.5 22h5l.65-3.05c.58-.23 1.13-.56 1.63-.95l2.39.96 2-3.46-2.03-1.56z"/></svg>
</div>

</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase=createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatar=document.getElementById("avatar");
const username=document.getElementById("username");
const bio=document.getElementById("bio");
const postsContainer=document.getElementById("postsContainer");
const addPostBtn=document.getElementById("addPostBtn");
const startChatBtn=document.getElementById("startChatBtn");
const noteCloud=document.getElementById("noteCloud");
const noteEditBtn=document.getElementById("noteEditBtn");

let editing=false;

document.getElementById("toUsers").onclick=()=>location.href="users.html";
document.getElementById("toHome").onclick=()=>location.href="social.html";
document.getElementById("toSettings").onclick=()=>location.href="settings.html";

const params=new URLSearchParams(window.location.search);
const profileIdFromURL=params.get("profileId");

async function loadProfile(){

const {data:{session}}=await supabase.auth.getSession();
if(!session) return alert("Please login");

const loggedInUserId=session.user.id;
const targetProfileId=profileIdFromURL||loggedInUserId;

const {data:profile}=await supabase
.from("profile")
.select("*")
.eq("id",targetProfileId)
.single();

avatar.src=profile.avatar_url||"https://via.placeholder.com/120";
username.textContent=profile.full_name;
bio.textContent=profile.bio||"";

const isOwnProfile=loggedInUserId===targetProfileId;

/* POSTS */

const {data:posts}=await supabase
.from("posts")
.select("*")
.eq("user_id",targetProfileId)
.order("created_at",{ascending:false});

postsContainer.innerHTML="";

if(!posts.length){
postsContainer.innerHTML=`<div style="text-align:center;color:#777;">No posts yet</div>`;
return;
}

posts.forEach(post=>{

const card=document.createElement("div");
card.className="post-card";

let media="";

if(post.image_url){

media=`
<div class="post-media">
<img src="${post.image_url}">
</div>
`;

}

if(post.video_url){

media=`
<div class="post-media" onclick="openVideo('${post.video_url}')">

<video src="${post.video_url}" muted></video>

<div class="video-overlay">
<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"></path>
</svg>
</div>

</div>
`;

}

card.innerHTML=`

<div class="post-header">
<img src="${avatar.src}">
<div class="name">${username.textContent}</div>
</div>

${post.content?`<div class="post-content">${post.content}</div>`:""}

${media}

`;

postsContainer.appendChild(card);

});

document.body.classList.add("loaded");

}

window.openVideo=(url)=>{
location.href=`see-video.html?videoUrl=${encodeURIComponent(url)}`;
};

loadProfile();

</script>

</body>
  </html>
