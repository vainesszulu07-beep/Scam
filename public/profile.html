<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        /* BODY */
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto; background: #f0f2f5; padding-bottom: 90px; }
        /* APP */
        .app { max-width: 480px; margin: auto; background: white; min-height: 100vh; position: relative; }
        /* COVER */
        .cover { height: 190px; position: relative; overflow: hidden; background: #ccc; }
        .cover-avatar { width: 100%; height: 100%; object-fit: cover; filter: brightness(.75); }
        
        /* PROFILE PIC - FULL CIRCLE */
        .profile-pic-wrapper { padding: 0 16px; margin-top: -40px; position: relative; z-index: 5; }
        .profile-pic { width: 95px; height: 95px; border-radius: 50%; border: 4px solid white; object-fit: cover; background: #eee; display: block; }
        
        /* INFO */
        .info { margin-top: 10px; padding: 0 16px; }
        .name { font-size: 20px; font-weight: 600; }
        .bio { font-size: 14px; color: #65676b; margin-top: 4px; }
        /* BUTTONS */
        .buttons { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
        .add { background: #1877f2; color: white; }
        .chat { background: #e4e6eb; }
        /* POSTS */
        .posts { margin-top: 20px; padding: 10px; }
        /* MODERN NAVBAR */
        .navbar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: auto; min-width: 300px; max-width: 480px; height: 60px; background: #fff; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -1px 5px rgba(0,0,0,0.15); border-radius: 30px; padding: 0 10px; z-index: 1000; }
        .nav-icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: background .2s; }
        .nav-icon:hover { background: #e4e6eb; }
        .nav-icon svg { width: 26px; height: 26px; fill: #1877f2; }
        .nav-icon.active svg { fill: #050505; }
    </style>
</head>
<body>
    <div class="app">
        <div class="cover">
            <img id="coverImg" class="cover-avatar">
        </div>
        
        <div class="profile-pic-wrapper">
            <img id="avatar" class="profile-pic">
        </div>

        <div class="info">
            <div class="name" id="name">Loading...</div>
            <div class="bio" id="bio"></div>
            <div class="buttons">
                <button id="addPostBtn" class="btn add">Add Post</button>
                <button id="chatBtn" class="btn chat">Chat</button>
            </div>
        </div>
        <div class="posts" id="posts">Loading posts...</div>
    </div>

    <div class="navbar">
        <div class="nav-icon" id="toHome"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
        <div class="nav-icon active" id="toProfile"><svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2c-3.3 0-9.9 1.7-9.9 5v3h19.8v-3c0-3.3-6.6-5-9.9-5z"/></svg></div>
        <div class="nav-icon" id="toUsers"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3z"/></svg></div>
        <div class="nav-icon" id="toSettings"><svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.66.07-1s-.03-.68-.07-1l2.11-1.65a.5.5 0 00.12-.66l-2-3.46a.5.5 0 00-.61-.22l-2.49 1a6.992 6.992 0 00-1.7-.99l-.38-2.65A.5.5 0 0014 2h-4a.5.5 0 00-.5.43l-.38 2.65c-.63.24-1.22.57-1.7.99l-2.49-1a.5.5 0 00-.61.22l-2 3.46a.5.5 0 00.12.66L4.57 11c-.04.32-.07.66-.07 1s.03.68.07 1l-2.11 1.65a.5.5 0 00-.12.66l2 3.46c.14.24.42.34.66.22l2.49-1c.48.42 1.07.75 1.7.99l.38 2.65c.05.28.27.49.5.49h4c.23 0 .45-.21.5-.49l.38-2.65c.63-.24 1.22-.57 1.7-.99l2.49 1c.24.12.52.02.66-.22l2-3.46a.5.5 0 00-.12-.66l-2.11-1.65zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg></div>
    </div>

    <script type="module">
        import { createClient } from "https://jsdelivr.net"
        const supabase = createClient("https://eimecuiixwgmpfpedxpr.supabase.co", "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou")
        
        const { data: { session } } = await supabase.auth.getSession()
        if (!session) { alert("Login required"); location.href = "login.html" }
        const loggedUser = session.user.id
        
        const params = new URLSearchParams(location.search)
        // Parse ID from URL: looks for 'id' or 'profileId', defaults to logged user
        const profileId = params.get("id") || params.get("profileId") || loggedUser
        const isOwner = profileId === loggedUser
        
        // Load target user profile from profile table
        const { data: profile } = await supabase.from("profile").select("*").eq("id", profileId).single()
        
        if (profile) {
            document.getElementById("name").textContent = profile.full_name
            document.getElementById("bio").textContent = profile.bio || ""
            const img = profile.avatar_url || "https://placeholder.com"
            document.getElementById("avatar").src = img
            document.getElementById("coverImg").src = img
        }
        
        if (isOwner) {
            document.getElementById("chatBtn").style.display = "none"
            document.getElementById("addPostBtn").onclick = () => { location.href = "posting.html" }
        } else {
            document.getElementById("addPostBtn").style.display = "none"
            document.getElementById("chatBtn").onclick = async () => {
                // Check if a conversation between these two IDs exists
                let { data: conv } = await supabase.from("conversations")
                    .select("id")
                    .or(`and(user1_id.eq.${loggedUser},user2_id.eq.${profileId}),and(user1_id.eq.${profileId},user2_id.eq.${loggedUser})`)
                    .maybeSingle()

                if (!conv) {
                    // Create conversation if it doesn't exist
                    const { data: newConv, error } = await supabase.from("conversations")
                        .insert({ user1_id: loggedUser, user2_id: profileId })
                        .select("id")
                        .single()
                    
                    if (error) { console.error("Error creating chat:", error); return; }
                    conv = newConv
                }
                
                // Redirect using 'conversationId' to match your chat code requirements
                location.href = `view-chat.html?conversationId=${conv.id}`
            }
        }
        
        document.getElementById("toHome").onclick = () => { location.href = "social.html" }
        document.getElementById("toProfile").onclick = () => { location.href = "profile.html" }
        document.getElementById("toUsers").onclick = () => { location.href = "users.html" }
        document.getElementById("toSettings").onclick = () => { location.href = "settings.html" }
    </script>
</body>
</html>
