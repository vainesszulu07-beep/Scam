<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

/* ------------------ BASIC BODY ------------------ */
body {
margin:0;
font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
background:#f0f2f5;
color:#050505;
padding-bottom:80px;
}

body:not(.loaded) .profile-container{visibility:hidden;}

/* ------------------ PROFILE CONTAINER ------------------ */

.profile-container{
max-width:480px;
margin:auto;
position:relative;
padding-bottom:40px;
}

/* ------------------ HEADER ------------------ */

.profile-header{
padding:20px 10px 40px 10px;
text-align:center;
background:linear-gradient(135deg,#6a11cb,#2575fc);
color:white;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
position:relative;
}

/* ------------------ AVATAR ------------------ */

.profile-header img{
width:110px;
height:110px;
border-radius:50%;
border:4px solid white;
object-fit:cover;
margin-bottom:10px;
cursor:pointer;
position:relative;
z-index:2;
}

/* ------------------ NOTE WRAPPER ------------------ */

.note-wrapper{
position:absolute;
top:5px;
left:50%;
transform:translateX(-50%);
display:flex;
align-items:center;
gap:6px;
z-index:3;
}

/* ------------------ THOUGHT CLOUD ------------------ */

.note-cloud{
background:white;
color:#333;
padding:6px 10px;
font-size:12px;
border-radius:20px;
max-width:120px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
position:relative;
text-align:center;
word-wrap:break-word;
}

/* bubble tail */

.note-cloud:after{
content:"";
position:absolute;
bottom:-6px;
left:40%;
width:8px;
height:8px;
background:white;
border-radius:50%;
}

.note-cloud:before{
content:"";
position:absolute;
bottom:-12px;
left:48%;
width:5px;
height:5px;
background:white;
border-radius:50%;
}

/* ------------------ EDIT BUTTON ------------------ */

.note-edit-btn{
width:22px;
height:22px;
border-radius:50%;
background:#1877f2;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
cursor:pointer;
}

.note-edit-btn:active{
transform:scale(0.9);
}

/* ------------------ USERNAME ------------------ */

.username{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.bio{
font-size:14px;
opacity:0.9;
margin-top:5px;
}

/* ------------------ BUTTONS ------------------ */

.buttons-container{
margin-top:15px;
display:flex;
gap:10px;
justify-content:center;
}

.profile-btn{
flex:1;
padding:10px 0;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
color:white;
}

#addPostBtn{background:#1877f2;}
#startChatBtn{background:#4CAF50;}

/* ------------------ POSTS ------------------ */

.posts-container{
padding:10px;
display:flex;
flex-direction:column;
gap:15px;
}

.post-card{
background:#fff;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.12);
overflow:hidden;
position:relative;
}

.post-header{
display:flex;
align-items:center;
padding:12px;
gap:12px;
}

.post-header img{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
}

.post-header .name{
font-weight:bold;
font-size:15px;
}

.post-options{
margin-left:auto;
cursor:pointer;
font-size:18px;
}

.delete-menu{
position:absolute;
top:10px;
right:10px;
background:white;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
padding:5px 0;
display:none;
}

.delete-menu button{
border:none;
background:none;
padding:8px 16px;
width:100%;
text-align:left;
cursor:pointer;
}

/* ------------------ NAVBAR ------------------ */

.navbar{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:auto;
min-width:300px;
max-width:480px;
height:60px;
background:#fff;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -1px 5px rgba(0,0,0,0.15);
border-radius:30px;
}

.nav-icon{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:50%;
}

.nav-icon svg{
width:28px;
height:28px;
fill:#1877f2;
}

.nav-icon.active svg{
fill:#050505;
}

</style>
</head>

<body>

<div class="profile-container">

<div class="profile-header">

<div class="note-wrapper">

<div class="note-cloud" id="noteCloud">Write something ☁️</div>

<div class="note-edit-btn" id="noteEditBtn">+</div>

</div>

<img id="avatar" src="https://via.placeholder.com/120">

<div class="username" id="username">Username</div>

<div class="bio" id="bio">User bio</div>

<div class="buttons-container">
<button class="profile-btn" id="addPostBtn">Add Post</button>
<button class="profile-btn" id="startChatBtn">Chat</button>
</div>

</div>

<div class="posts-container" id="postsContainer">
<div style="text-align:center;color:#777;">Loading posts...</div>
</div>

</div>

<div class="navbar">
<div class="nav-icon" id="toHome"></div>
<div class="nav-icon active" id="toProfile"></div>
<div class="nav-icon" id="toUsers"></div>
<div class="nav-icon" id="toSettings"></div>
</div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://eimecuiixwgmpfpedxpr.supabase.co",
"sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const avatar = document.getElementById("avatar");
const username = document.getElementById("username");
const bio = document.getElementById("bio");
const postsContainer = document.getElementById("postsContainer");
const addPostBtn = document.getElementById("addPostBtn");
const startChatBtn = document.getElementById("startChatBtn");
const noteCloud = document.getElementById("noteCloud");
const noteEditBtn = document.getElementById("noteEditBtn");

let editing = false;

/* NAVIGATION */

document.getElementById("toUsers").onclick=()=>location.href="users.html";
document.getElementById("toHome").onclick=()=>location.href="social.html";
document.getElementById("toSettings").onclick=()=>location.href="settings.html";

const params=new URLSearchParams(window.location.search);
const profileIdFromURL=params.get("profileId");

async function loadProfile(){

const {data:{session}}=await supabase.auth.getSession();
if(!session) return alert("Please login");

const loggedInUserId=session.user.id;
const targetProfileId=profileIdFromURL||loggedInUserId;

const {data:profile}=await supabase
.from("profile")
.select("*")
.eq("id",targetProfileId)
.single();

avatar.src=profile.avatar_url||"https://via.placeholder.com/120";
username.textContent=profile.full_name;
bio.textContent=profile.bio||"";

const isOwnProfile=loggedInUserId===targetProfileId;

/* AVATAR CLICK */

avatar.onclick=()=>{
if(isOwnProfile){
location.href="manage.html";
}
};

/* NOTE DISPLAY */

noteCloud.textContent=profile.notes||"Write something ☁️";

if(!isOwnProfile){
noteEditBtn.style.display="none";
}

/* NOTE EDIT BUTTON */

noteEditBtn.onclick=async()=>{

if(!editing){

editing=true;
noteCloud.contentEditable="true";
noteCloud.focus();
noteEditBtn.textContent="✓";

}else{

editing=false;
noteCloud.contentEditable="false";
noteEditBtn.textContent="+";

await supabase
.from("profile")
.update({
notes:noteCloud.textContent.trim(),
note_created_at:new Date()
})
.eq("id",targetProfileId);

}

};

/* BUTTONS */

if(isOwnProfile){
addPostBtn.onclick=()=>location.href="posting.html";
startChatBtn.style.display="none";
}else{

addPostBtn.style.display="none";

startChatBtn.onclick=async()=>{

const {data:existingConv}=await supabase
.from("conversations")
.select("*")
.or(`and(user1_id.eq.${loggedInUserId},user2_id.eq.${targetProfileId}),and(user1_id.eq.${targetProfileId},user2_id.eq.${loggedInUserId})`)
.single();

let conversationId;

if(existingConv) conversationId=existingConv.id;

else{

const {data:newConv}=await supabase
.from("conversations")
.insert([{user1_id:loggedInUserId,user2_id:targetProfileId}])
.select("id")
.single();

conversationId=newConv.id;

}

location.href=`view-chat.html?conversationId=${conversationId}`;

};

}

document.body.classList.add("loaded");

}

loadProfile();

</script>

</body>
  </html>
