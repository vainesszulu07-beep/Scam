<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - My Posts</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
h2 { text-align: center; }
.posts-container { margin-top: 20px; }
.post { background: #fff; padding: 12px; margin-bottom: 12px; border-radius: 8px; }
.post img { max-width: 100%; margin-top: 5px; border-radius: 8px; }
.no-posts { text-align: center; color: #65676b; padding: 20px; }
</style>
</head>
<body>

<h2>My Posts</h2>

<div class="posts-container" id="postsContainer">
  <div class="no-posts">Loading posts...</div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// Initialize Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const postsContainer = document.getElementById("postsContainer");
let currentUserId;

// 🔹 Get logged-in user
async function getCurrentUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    alert("Login required");
    return null;
  }
  return session.user.id;
}

// 🔹 Fetch and display user's posts
async function loadPosts() {
  if (!currentUserId) return;

  const { data: posts, error } = await supabase
    .from("posts")
    .select("id, content, image_url, created_at")
    .eq("user_id", currentUserId)
    .order("created_at", { ascending: false });

  postsContainer.innerHTML = "";

  if (error) {
    console.error("Error loading posts:", error);
    postsContainer.innerHTML = `<div class="no-posts">Failed to load posts</div>`;
    return;
  }

  if (!posts || posts.length === 0) {
    postsContainer.innerHTML = `<div class="no-posts">No posts yet</div>`;
    return;
  }

  posts.forEach(post => {
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <p>${post.content}</p>
      ${post.image_url ? `<img src="${post.image_url}">` : ""}
      <small style="color:#65676b;">${new Date(post.created_at).toLocaleString()}</small>
    `;
    postsContainer.appendChild(div);
  });
}

// 🔹 Initialize
(async () => {
  currentUserId = await getCurrentUser();
  if (currentUserId) loadPosts();
})();
</script>

</body>
</html>
