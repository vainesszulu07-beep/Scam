<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer Search & Join</title>
<style>
  body { font-family: system-ui; padding: 20px; background: #f0f2f5; }
  input, button { padding: 8px 12px; margin: 4px 0; }
  #results { margin-top: 10px; }
  .streamer { padding: 6px 10px; background: #fff; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  video { width: 100%; height: 60vh; background: black; margin-top: 10px; }
  #msg { white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 6px; margin-top: 10px; }
</style>
</head>
<body>

<h2>Viewer: Find Streamer</h2>
<label>Enter Streamer's full name:</label><br>
<input type="text" id="nameInput" placeholder="Streamer full name"><br>
<button id="searchBtn">Search</button>

<div id="results"></div>

<video id="remoteVideo" autoplay playsinline></video>
<div id="msg">Search for a streamer to watch.</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import { io } from "https://cdn.jsdelivr.net/npm/socket.io-client/dist/socket.io.esm.min.js";

// --- Supabase frontend client ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('msg');
const resultsEl = document.getElementById('results');
const nameInput = document.getElementById('nameInput');
const searchBtn = document.getElementById('searchBtn');
const remoteVideo = document.getElementById('remoteVideo');

let pc = null;
let socket = null;

// --- Search streamer by full name ---
searchBtn.onclick = async () => {
  const fullName = nameInput.value.trim();
  if (!fullName) { msgEl.textContent = "Enter a name."; return; }

  const { data: streamers, error } = await supabase
    .from('profile')
    .select('full_name,id,is_live,stream_room_id')
    .ilike('full_name', `%${fullName}%`) // case-insensitive search

  resultsEl.innerHTML = '';
  if (error) { msgEl.textContent = "Error:\n" + JSON.stringify(error); return; }
  if (!streamers.length) { msgEl.textContent = "No streamers found."; return; }

  msgEl.textContent = "Click a streamer to join their stream:";
  streamers.forEach(s => {
    const div = document.createElement('div');
    div.className = 'streamer';
    div.textContent = `${s.full_name} ${s.is_live ? '(LIVE)' : '(Offline)'}`;
    div.onclick = () => joinStream(s.stream_room_id || s.id);
    resultsEl.appendChild(div);
  });
}

// --- Join stream by roomId ---
async function joinStream(roomId) {
  msgEl.textContent = "Joining room: " + roomId;

  pc = new RTCPeerConnection();

  pc.ontrack = event => { remoteVideo.srcObject = event.streams[0]; };
  pc.onicecandidate = event => {
    if (event.candidate) {
      socket.emit('signal', { roomId, signalData: { candidate: event.candidate } });
    }
  };

  socket = io("https://scamming-lg3v.onrender.com"); // your backend URL
  socket.emit('join-room', roomId);

  socket.on('signal', async ({ from, signalData }) => {
    try {
      if (signalData.sdp) {
        await pc.setRemoteDescription(signalData.sdp);
        if (signalData.sdp.type === 'offer') {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit('signal', { roomId, to: from, signalData: pc.localDescription });
        }
      }
      if (signalData.candidate) {
        await pc.addIceCandidate(signalData.candidate);
      }
    } catch(e) { console.error("Signal error", e); }
  });

  msgEl.textContent = "Connected. Waiting for stream...";
}

</script>
</body>
</html>
