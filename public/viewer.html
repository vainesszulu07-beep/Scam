<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streams (v0.6.0)</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; }
  h2 { text-align: center; padding: 10px; }
  
  /* User List Grid */
  #users { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
  .card { background: white; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
  .card img { width: 80px; height: 80px; border-radius: 50%; }
  .live { color: green; font-weight: bold; }
  .offline { color: gray; }
  
  /* Player Overlay */
  #player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 100; }
  
  /* Video Element */
  video { width: 100%; height: 100%; object-fit: contain; }
  
  /* BRB Overlay (Hidden by default) */
  #viewer-brb {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(20, 20, 20, 0.95); color: white;
    display: none; 
    flex-direction: column; justify-content: center; align-items: center;
    z-index: 102;
  }
  #viewer-brb h1 { font-size: 50px; margin: 0 0 20px 0; }
  #viewer-brb h2 { font-family: sans-serif; font-weight: lighter; }

  #close { 
    position: absolute; top: 20px; right: 20px; padding: 10px 20px; 
    background: red; color: white; border: none; border-radius: 5px; 
    cursor: pointer; z-index: 103; font-weight: bold; 
  }
  
  /* Quality Selector */
  #quality {
    position: absolute; bottom: 15px; right: 15px; padding: 10px;
    background: rgba(255,255,255,0.9); border-radius: 5px; border: none; 
    font-weight: bold; z-index: 103; cursor: pointer;
  }
</style>
</head>
<body>

<h2>📡 Live Users</h2>
<div id="users"></div>

<div id="player">
  <button id="close">Close</button>
  
  <!-- The Video Feed -->
  <video id="video" autoplay muted playsinline></video>
  
  <!-- The BRB Message -->
  <div id="viewer-brb">
    <h1>☕</h1>
    <h2>Host is away</h2>
    <p>Stream will resume shortly...</p>
  </div>

  <!-- Resolution Selector -->
  <select id="quality">
    <option value="low">180p (Data Saver)</option>
    <option value="med">360p (Standard)</option>
    <option value="high" selected>720p/1080p (HD)</option>
  </select>
</div>

<!-- REVERTED TO SDK 0.6.0 -->
<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersDiv = document.getElementById("users");
const video = document.getElementById("video");
const player = document.getElementById("player");
const brbScreen = document.getElementById("viewer-brb"); 
const closeBtn = document.getElementById("close");
const qualitySelect = document.getElementById("quality");

let viewerId = "viewer-" + Math.random().toString(36).substr(2, 9);
let meeting = null;
let hostParticipant = null;

async function loadUsers() {
  const { data, error } = await supabase.from("profile").select("*");
  if (error) { console.error(error); return; }
  usersDiv.innerHTML = "";
  data.forEach(user => {
    const card = document.createElement("div");
    card.className = "card";
    const isLive = user.is_live;
    card.innerHTML = `
      <img src="${user.avatar_url || 'https://via.placeholder.com/80'}">
      <h4>${user.full_name || "No Name"}</h4>
      <p class="${isLive ? 'live' : 'offline'}">${isLive ? '🟢 LIVE' : '⚫ OFFLINE'}</p>
    `;
    if (isLive) card.onclick = () => joinStream(user);
    usersDiv.appendChild(card);
  });
}

function attachStream(track) {
  if (track.kind === "video") {
    brbScreen.style.display = "none"; // Hide BRB when video arrives
    const mediaStream = new MediaStream();
    mediaStream.addTrack(track);
    video.srcObject = mediaStream;
    video.play().catch(e => console.warn("Autoplay blocked"));
  } 
  else if (track.kind === "audio") {
    const audioId = `audio-${track.id}`;
    if (document.getElementById(audioId)) return;
    const audioEl = document.createElement("audio");
    audioEl.id = audioId;
    audioEl.className = "remote-audio";
    audioEl.autoplay = true;
    audioEl.playsinline = true;
    const mediaStream = new MediaStream();
    mediaStream.addTrack(track);
    audioEl.srcObject = mediaStream;
    document.body.appendChild(audioEl);
    audioEl.play().catch(e => console.warn("Audio autoplay blocked"));
  }
}

async function joinStream(user) {
  if (!user.is_live) return;
  try {
    player.style.display = "block";
    brbScreen.style.display = "none"; 

    // SDK 0.6.0 CONFIGURATION
    VideoSDK.config(user.videosdk_viewer_token);

    meeting = VideoSDK.initMeeting({
      meetingId: user.videosdk_room_id,
      name: "Viewer",
      participantId: viewerId,
      micEnabled: false,
      webcamEnabled: false,
      mode: "VIEWER"
    });

    await meeting.join();

    meeting.on("participant-joined", (participant) => {
        hostParticipant = participant;
        setupParticipant(participant);
    });

    meeting.on("meeting-joined", () => {
      meeting.participants.forEach((participant) => {
        hostParticipant = participant;
        setupParticipant(participant);
      });
    });

  } catch (err) {
    console.error("Join Error:", err);
  }
}

function setupParticipant(participant) {
  // 1. Apply currently selected quality
  participant.setQuality(qualitySelect.value);

  // 2. Handle Video On/Off (BRB Logic)
  participant.on("stream-enabled", (stream) => {
    attachStream(stream.track);
  });

  participant.on("stream-disabled", (stream) => {
    if (stream.kind === "video") {
        brbScreen.style.display = "flex"; // SHOW BRB
        video.srcObject = null; 
    }
  });

  participant.streams.forEach((stream) => {
    attachStream(stream.track);
  });
}

// 3. Handle Resolution Change by User
qualitySelect.onchange = () => {
  if (hostParticipant) {
    hostParticipant.setQuality(qualitySelect.value);
  }
};

document.body.addEventListener("click", () => {
  if (video.srcObject) video.play();
  document.querySelectorAll(".remote-audio").forEach(a => a.play());
}, { once: false });

closeBtn.onclick = () => {
  if (meeting) { meeting.leave(); meeting = null; hostParticipant = null; }
  video.srcObject = null;
  document.querySelectorAll(".remote-audio").forEach(el => el.remove());
  player.style.display = "none";
};

setInterval(loadUsers, 10000);
loadUsers();
</script>
</body>
</html>
