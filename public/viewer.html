<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streams with Chat</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; }
  h2 { text-align: center; padding: 10px; }
  #users { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
  .card { background: white; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
  .card img { width: 80px; height: 80px; border-radius: 50%; }
  .live { color: green; font-weight: bold; }
  .offline { color: gray; }
  #player { position: fixed; top: 0; left: 0; width: 100%; height: 60vh; background: black; display: none; }
  video { width: 100%; height: 100%; }
  #close { position: absolute; top: 10px; right: 10px; padding: 8px; background: red; color: white; border: none; }

  /* Chat Styles */
  #chat-container { 
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: #fff; border-top: 2px solid #ccc; 
    display: none; flex-direction: column; 
  }
  #chat-messages { max-height: 200px; overflow-y: auto; padding: 10px; }
  #chat-input { display: flex; }
  #chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
  #chat-input button { padding: 10px 15px; margin-left: 5px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<h2>📡 Live Users</h2>
<div id="users"></div>

<div id="player">
  <button id="close">Close</button>
  <video id="video" autoplay playsinline></video>
</div>

<!-- Chat -->
<div id="chat-container">
  <div id="chat-messages"></div>
  <div id="chat-input">
    <input type="text" id="message" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersDiv = document.getElementById("users");
const video = document.getElementById("video");
const player = document.getElementById("player");
const closeBtn = document.getElementById("close");

const chatContainer = document.getElementById("chat-container");
const chatMessages = document.getElementById("chat-messages");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("send-btn");

// 🔥 HARDCODED VIEWER INFO
let viewerId = "viewer_123";
let viewerName = "Hardcoded Viewer";

let meeting = null;
let currentRoomId = null;

// 📡 LOAD USERS
async function loadUsers() {
  const { data, error } = await supabase.from("profile").select("*");
  if (error) { console.error(error); return; }
  usersDiv.innerHTML = "";

  data.forEach(user => {
    const card = document.createElement("div");
    card.className = "card";
    const isLive = user.is_live;

    card.innerHTML = `
      <img src="${user.avatar_url || 'https://via.placeholder.com/80'}">
      <h4>${user.full_name || "No Name"}</h4>
      <p class="${isLive ? 'live' : 'offline'}">${isLive ? '🟢 LIVE' : '⚫ OFFLINE'}</p>
    `;

    card.onclick = () => joinStream(user);
    usersDiv.appendChild(card);
  });
}

// 🎥 JOIN STREAM
async function joinStream(user) {
  if (!user.is_live) { alert("User is offline"); return; }

  try {
    player.style.display = "block";
    chatContainer.style.display = "flex";

    const token = user.videosdk_viewer_token;
    const roomId = user.videosdk_room_id;
    currentRoomId = roomId;

    if (!token || !roomId) { alert("Stream not available"); return; }

    VideoSDK.config(token);

    meeting = VideoSDK.initMeeting({
      meetingId: roomId,
      name: "Viewer",
      participantId: viewerId,
      micEnabled: false,
      webcamEnabled: false
    });

    meeting.join();

    meeting.on("participant-joined", participant => {
      participant.on("stream-enabled", stream => {
        if (stream.kind === "video") {
          const mediaStream = new MediaStream();
          mediaStream.addTrack(stream.track);
          video.srcObject = mediaStream;
          video.play();
        }
      });
    });

    meeting.on("meeting-left", () => {
      video.srcObject = null;
      player.style.display = "none";
      chatContainer.style.display = "none";
    });

    // ✅ Load existing messages and subscribe to new
    loadMessages(roomId);
    subscribeMessages(roomId);

  } catch (err) {
    console.error(err);
    alert("Failed to join stream");
  }
}

// ❌ CLOSE PLAYER
closeBtn.onclick = () => {
  if (meeting) { meeting.leave(); meeting = null; }
  video.srcObject = null;
  player.style.display = "none";
  chatContainer.style.display = "none";
};

// ✉️ SEND MESSAGE
sendBtn.onclick = async () => {
  const msg = messageInput.value.trim();
  if (!msg) return;

  await supabase.from("chat_messages").insert({
    room_id: currentRoomId,
    user_id: viewerId,
    user_name: viewerName,
    message: msg
  });

  messageInput.value = "";
};

// 🔄 LOAD MESSAGES
async function loadMessages(roomId) {
  const { data } = await supabase.from("chat_messages")
    .select("*")
    .eq("room_id", roomId)
    .order("created_at", { ascending: true });

  chatMessages.innerHTML = "";
  data.forEach(msg => {
    const div = document.createElement("div");
    div.textContent = `${msg.user_name || "Anonymous"}: ${msg.message}`;
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// 🔄 SUBSCRIBE TO REALTIME MESSAGES
function subscribeMessages(roomId) {
  supabase.from(`chat_messages:room_id=eq.${roomId}`)
    .on("INSERT", payload => {
      const msg = payload.new;
      const div = document.createElement("div");
      div.textContent = `${msg.user_name || "Anonymous"}: ${msg.message}`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }).subscribe();
}

// 🔄 AUTO REFRESH USERS (LIVE STATUS)
setInterval(loadUsers, 5000);

// 🚀 INITIAL LOAD
loadUsers();
</script>

</body>
  </html>
