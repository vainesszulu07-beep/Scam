<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streams</title>
<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; }
  h2 { text-align: center; padding: 10px; }
  #users { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
  .card { background: white; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
  .card img { width: 80px; height: 80px; border-radius: 50%; }
  .live { color: green; font-weight: bold; }
  .offline { color: gray; }
  #player { position: fixed; top: 0; left: 0; width: 100%; height: 60vh; background: black; display: none; z-index: 100; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #close { position: absolute; top: 10px; right: 10px; padding: 8px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer; z-index: 101; }
  #quality { position: absolute; bottom: 15px; right: 15px; padding: 8px; background: white; border-radius: 5px; border: none; font-weight: bold; z-index: 101; }
  /* Audio Alert Style */
  #audio-notice { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; pointer-events: none; display: none; }
</style>
</head>
<body>

<h2>📡 Live Users</h2>
<div id="users"></div>

<div id="player">
  <button id="close">Close</button>
  <div id="audio-notice">🔈 Tap to enable sound</div>
  <!-- NOTE: No 'muted' attribute here -->
  <video id="video" autoplay playsinline></video>
  <select id="quality">
    <option value="low">180p (Data Saver)</option>
    <option value="med" selected>360p (Standard)</option>
    <option value="high">720p/1080p (HD)</option>
  </select>
</div>

<script src="https://videosdk.live"></script>

<script type="module">
import { createClient } from "https://jsdelivr.net";

const supabase = createClient(
  "https://supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersDiv = document.getElementById("users");
const video = document.getElementById("video");
const player = document.getElementById("player");
const closeBtn = document.getElementById("close");
const qualitySelect = document.getElementById("quality");
const audioNotice = document.getElementById("audio-notice");

let viewerId = "e0330e1d-4766-4bea-bed1-4c166a9104fa";
let meeting = null;
let hostParticipant = null;

async function loadUsers() {
  const { data, error } = await supabase.from("profile").select("*");
  if (error) return;
  usersDiv.innerHTML = "";
  data.forEach(user => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${user.avatar_url || 'https://placeholder.com'}">
      <h4>${user.full_name || "No Name"}</h4>
      <p class="${user.is_live ? 'live' : 'offline'}">${user.is_live ? '🟢 LIVE' : '⚫ OFFLINE'}</p>
    `;
    if (user.is_live) card.onclick = () => joinStream(user);
    usersDiv.appendChild(card);
  });
}

function attachStream(track) {
  if (track.kind === "video") {
    const mediaStream = new MediaStream();
    mediaStream.addTrack(track);
    video.srcObject = mediaStream;
    video.play().catch(() => {
        // Show notice if browser blocked autoplay
        audioNotice.style.display = "block";
    });
  } else if (track.kind === "audio") {
    const audioEl = document.createElement("audio");
    audioEl.autoplay = true;
    audioEl.className = "remote-audio";
    const mediaStream = new MediaStream();
    mediaStream.addTrack(track);
    audioEl.srcObject = mediaStream;
    document.body.appendChild(audioEl);
    audioEl.play().catch(() => {
        audioNotice.style.display = "block";
    });
  }
}

async function joinStream(user) {
  if (!user.is_live) return;
  player.style.display = "block";
  audioNotice.style.display = "none";
  
  await VideoSDK.config(user.videosdk_viewer_token);
  meeting = VideoSDK.initMeeting({
    meetingId: user.videosdk_room_id,
    name: "Viewer",
    participantId: viewerId,
    micEnabled: false,
    webcamEnabled: false
  });

  await meeting.join();

  meeting.on("participant-joined", (participant) => {
    if (participant.id !== viewerId) {
      hostParticipant = participant;
      setupParticipant(participant);
    }
  });

  meeting.participants.forEach((p) => {
    if (p.id !== viewerId) {
      hostParticipant = p;
      setupParticipant(p);
    }
  });
}

function setupParticipant(participant) {
  participant.setViewPort(video.offsetWidth, video.offsetHeight);
  participant.setQuality(qualitySelect.value);

  participant.on("stream-enabled", (stream) => attachStream(stream.track));
  participant.streams.forEach((stream) => attachStream(stream.track));
}

// Global click handler to resume audio if browser blocked it
document.addEventListener("click", () => {
    const audios = document.querySelectorAll(".remote-audio");
    audios.forEach(a => a.play());
    if(video.srcObject) video.play();
    audioNotice.style.display = "none";
}, true);

qualitySelect.onchange = () => {
  if (hostParticipant) hostParticipant.setQuality(qualitySelect.value);
};

closeBtn.onclick = () => {
  if (meeting) meeting.leave();
  video.srcObject = null;
  document.querySelectorAll(".remote-audio").forEach(el => el.remove());
  player.style.display = "none";
};

setInterval(loadUsers, 10000);
loadUsers();
</script>
</body>
</html>
