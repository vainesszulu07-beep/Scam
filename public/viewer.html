<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Streams</title>

<style>
  body { margin: 0; font-family: Arial; background: #f4f4f4; }
  h2 { text-align: center; padding: 10px; }

  #users {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
  }

  .card {
    background: white;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
  }

  .card img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
  }

  .live { color: green; font-weight: bold; }
  .offline { color: gray; }

  #player {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: none;
    z-index: 100;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #viewer-brb {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(20,20,20,0.95);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 102;
  }

  #close {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px;
    background: red;
    color: white;
    border: none;
    border-radius: 5px;
    z-index: 103;
  }

  #quality {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px;
    background: white;
    border-radius: 5px;
    z-index: 103;
  }
</style>
</head>

<body>

<h2>📡 Live Users</h2>
<div id="users"></div>

<div id="player">
  <button id="close">Close</button>

  <video id="video" autoplay playsinline muted></video>

  <div id="viewer-brb">
    <h1>☕</h1>
    <h2>Waiting for host...</h2>
  </div>

  <select id="quality">
    <option value="low">180p</option>
    <option value="med">360p</option>
    <option value="high">HD</option>
  </select>
</div>

<script src="https://sdk.videosdk.live/js-sdk/0.6.0/videosdk.js"></script>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const usersDiv = document.getElementById("users");
const video = document.getElementById("video");
const player = document.getElementById("player");
const brbScreen = document.getElementById("viewer-brb");
const closeBtn = document.getElementById("close");
const qualitySelect = document.getElementById("quality");

let viewerId = "e0330e1d-4766-4bea-bed1-4c166a9104fa";
let meeting = null;
let hostParticipant = null;
let activeVideoStreamId = null;

async function loadUsers() {
  const { data, error } = await supabase.from("profile").select("*");
  if (error) return console.error(error);

  usersDiv.innerHTML = "";

  data.forEach(user => {
    const card = document.createElement("div");
    card.className = "card";

    const isLive = !!user.is_live;

    card.innerHTML = `
      <img src="${user.avatar_url || 'https://via.placeholder.com/80'}">
      <h4>${user.full_name || "No Name"}</h4>
      <p class="${isLive ? 'live' : 'offline'}">
        ${isLive ? '🟢 LIVE' : '⚫ OFFLINE'}
      </p>
    `;

    if (isLive) card.onclick = () => joinStream(user);

    usersDiv.appendChild(card);
  });
}

function handleStream(stream, participant) {
  if (!stream || !stream.track) return;

  const mediaStream = new MediaStream([stream.track]);

  if (stream.kind === "video") {
    brbScreen.style.display = "none";
    video.srcObject = mediaStream;
    video.play().catch(() => {});
  }

  if (stream.kind === "audio") {
    const id = `audio-${participant.id}`;
    let audio = document.getElementById(id);

    if (!audio) {
      audio = document.createElement("audio");
      audio.id = id;
      audio.autoplay = true;
      document.body.appendChild(audio);
    }

    audio.srcObject = mediaStream;
  }
}

function setupParticipant(participant) {
  if (!participant) return;

  participant.on("stream-enabled", (stream) => {
    handleStream(stream, participant);
  });

  participant.on("stream-disabled", (stream) => {
    if (stream.kind === "video") {
      video.srcObject = null;
      brbScreen.style.display = "flex";
    }
  });

  participant.streams.forEach((stream) => {
    handleStream(stream, participant);
  });
}

async function joinStream(user) {
  if (!user?.is_live) return;

  try {
    cleanupRemoteMedia();

    player.style.display = "block";
    brbScreen.style.display = "flex";

    await VideoSDK.config(user.videosdk_viewer_token);

    meeting = VideoSDK.initMeeting({
      meetingId: user.videosdk_room_id,
      name: "Viewer",
      participantId: viewerId,
      micEnabled: false,
      webcamEnabled: false,
      mode: "VIEWER"
    });

    meeting.on("participant-joined", (p) => {
      hostParticipant = p;
      setupParticipant(p);
    });

    await meeting.join();

    meeting.participants.forEach((p) => {
      hostParticipant = p;
      setupParticipant(p);
    });

  } catch (err) {
    console.error(err);
    player.style.display = "none";
  }
}

function cleanupRemoteMedia() {
  document.querySelectorAll("audio").forEach(a => a.remove());
  video.srcObject = null;
}

closeBtn.onclick = () => {
  if (meeting) meeting.leave();

  meeting = null;
  hostParticipant = null;

  cleanupRemoteMedia();
  player.style.display = "none";
};

qualitySelect.onchange = () => {
  if (hostParticipant?.setQuality) {
    hostParticipant.setQuality(qualitySelect.value);
  }
};

document.body.addEventListener("click", () => {
  video.play().catch(() => {});
  document.querySelectorAll("audio").forEach(a => a.play().catch(() => {}));
});

setInterval(loadUsers, 10000);
loadUsers();
</script>

</body>
  </html>
