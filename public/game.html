<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Game Matchmaker</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  button {
    padding: 12px;
    width: 90%;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  #create { background: green; color: white; }
  #join { background: blue; color: white; }

  #status {
    margin-top: 20px;
    padding: 15px;
    background: #fff;
    border-radius: 10px;
    font-weight: bold;
    white-space: pre-line;
  }
</style>
</head>

<body>

<h2>🎮 Tic Tac Toe Matchmaker</h2>

<button id="create">Create Game</button>
<button id="join">Quick Match</button>

<div id="status">Waiting...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const statusEl = document.getElementById("status");

let userId = null;
let currentGame = null;
let channel = null;

// ---------------- USER ----------------
async function getUser() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    statusEl.innerText = "❌ Not logged in";
    throw new Error("No session");
  }
  userId = session.user.id;
  return userId;
}

// ---------------- REALTIME ----------------
function subscribeToGame(gameId) {
  if (channel) supabase.removeChannel(channel);

  channel = supabase
    .channel("game-room")
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "games",
        filter: `id=eq.${gameId}`
      },
      (payload) => {
        const game = payload.new;

        console.log("LIVE UPDATE:", game);

        if (game.status === "waiting") {
          statusEl.innerText = `⏳ Waiting for opponent...\nGame: ${game.id}`;
        }

        if (game.status === "playing") {
          statusEl.innerText =
            `🎮 GAME STARTED!\nYou are playing\nX: ${game.player_x}\nO: ${game.player_o}`;
        }

        if (game.status === "finished") {
          statusEl.innerText =
            `🏁 GAME OVER\nWinner: ${game.winner}`;
        }
      }
    )
    .subscribe();
}

// ---------------- CREATE GAME ----------------
document.getElementById("create").onclick = async () => {
  try {
    await getUser();

    const { data, error } = await supabase
      .from("games")
      .insert({
        player_x: userId,
        status: "waiting"
      })
      .select()
      .single();

    if (error) throw error;

    currentGame = data;

    statusEl.innerText = "🎮 Game Created\nID: " + data.id;

    subscribeToGame(data.id);

  } catch (err) {
    console.error(err);
    statusEl.innerText = "❌ Error creating game";
  }
};

// ---------------- QUICK MATCH ----------------
document.getElementById("join").onclick = async () => {
  try {
    await getUser();

    statusEl.innerText = "🔍 Searching game...";

    // find waiting game
    const { data: game } = await supabase
      .from("games")
      .select("*")
      .eq("status", "waiting")
      .is("player_o", null)
      .limit(1)
      .maybeSingle();

    if (game) {
      const { error } = await supabase
        .from("games")
        .update({
          player_o: userId,
          status: "playing"
        })
        .eq("id", game.id)
        .is("player_o", null);

      if (error) throw error;

      currentGame = game;

      statusEl.innerText = "🎮 Joined Game: " + game.id;

      subscribeToGame(game.id);

      return;
    }

    // create new waiting game
    const { data, error } = await supabase
      .from("games")
      .insert({
        player_x: userId,
        status: "waiting"
      })
      .select()
      .single();

    if (error) throw error;

    currentGame = data;

    statusEl.innerText =
      "⏳ Waiting for opponent...\nID: " + data.id;

    subscribeToGame(data.id);

  } catch (err) {
    console.error(err);
    statusEl.innerText = "❌ Matchmaking error";
  }
};
</script>

</body>
  </html>
