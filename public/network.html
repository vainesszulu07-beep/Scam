
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ad Network Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f6f9;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 25px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
  color: #17202a;
}

p {
  color: #667085;
  font-size: 14px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #1769ff;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

.success {
  display: block !important;
  background: #e9f9ef;
  color: #137333;
}

.error {
  display: block !important;
  background: #fff0f0;
  color: #c62828;
}

.token {
  margin-top: 12px;
  padding: 12px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  color: #333;
  font-size: 12px;
  word-break: break-all;
}

.copy {
  margin-top: 10px;
  background: #17202a;
}
</style>
</head>

<body>

<div class="container">

  <h2>Advertising Network</h2>

  <p>
    Verify your registered advertising network
    and retrieve your authentication token.
  </p>

  <button id="verifyBtn" onclick="verifyNetwork()">
    Verify Network
  </button>

  <div id="result"></div>

</div>

<script>

async function verifyNetwork() {

  const button = document.getElementById("verifyBtn");
  const resultBox = document.getElementById("result");

  button.disabled = true;
  button.textContent = "Verifying...";
  resultBox.className = "";
  resultBox.style.display = "none";

  try {

    const response = await fetch("/api/check-ad-network.js", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok || !data.success || !data.authorized) {
      throw new Error(data.message || "Network verification failed");
    }

    resultBox.className = "success";

    resultBox.innerHTML = `
      <strong>Network Verified Successfully!</strong>
      <p>${data.message || "Partner verified"}</p>

      <div class="token">
        <strong>Token ID:</strong>
        <div id="tokenValue"></div>
      </div>

      <button class="copy" onclick="copyToken()">
        Copy Token
      </button>
    `;

    document.getElementById("tokenValue").textContent = data.token_id;

  } catch (error) {

    resultBox.className = "error";
    resultBox.textContent = error.message;

  } finally {

    button.disabled = false;
    button.textContent = "Verify Network";

  }
}

function copyToken() {
  const token = document.getElementById("tokenValue").textContent;

  navigator.clipboard.writeText(token);
}

</script>

</body>
</html>
