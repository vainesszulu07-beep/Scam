<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Stream</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto; padding: 20px; }
  #message { margin-top: 20px; white-space: pre-wrap; color: #333; }
</style>
</head>
<body>

<h2>Start Stream</h2>
<button id="startBtn">Create / Get Stream</button>
<div id="message">Status messages will appear here...</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('message');
const startBtn = document.getElementById('startBtn');

let userId = null;

// Get session user
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    msgEl.textContent = "Login required: " + JSON.stringify(error || "No session");
    return false;
  }
  userId = session.user.id;
  return true;
}

// Create / get stream
async function createStream() {
  if (!userId) return;

  try {
    const res = await fetch('/api/create-daily-room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });

    const data = await res.json();

    if (data.success) {
      msgEl.textContent = "Stream URL saved!\n" + JSON.stringify(data, null, 2);
    } else {
      msgEl.textContent = "Error creating stream:\n" + JSON.stringify(data.error, null, 2);
    }
  } catch (err) {
    msgEl.textContent = "Network / JS error:\n" + err.message;
  }
}

// Button click
startBtn.onclick = async () => {
  const ok = await getUser();
  if (ok) await createStream();
};
</script>

</body>
</html>
