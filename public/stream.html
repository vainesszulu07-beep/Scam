<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Dashboard</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto; margin: 0; padding: 0; background: #f0f2f5; }
  #controls { display: flex; gap: 10px; margin: 10px; }
  button { padding: 10px 16px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; }
  button.primary { background: #1877f2; color: white; }
  button.secondary { background: #e4e6eb; color: #000; }
  #video { width: 100%; height: 70vh; background: black; }
</style>
</head>
<body>

<div id="controls">
  <button id="muteBtn" class="primary">Mute Audio</button>
  <button id="videoBtn" class="primary">Stop Video</button>
  <button id="endBtn" class="secondary">End Stream</button>
</div>

<div id="video"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import DailyIframe from "https://cdn.jsdelivr.net/npm/@daily-co/daily-js/+esm";

// --- Initialize Supabase ---
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou" // only publishable key for frontend
);

let userId = null;
let call = null;
let isMuted = false;
let videoOff = false;

// --- Get current session user ---
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session) {
    alert("Login required");
    window.location.href = "login.html";
    return;
  }
  userId = session.user.id;
}

// --- Start / join Daily room ---
async function startStream() {
  // Call backend to create/get persistent room
  const res = await fetch('/api/create-daily-room', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId })
  });
  const data = await res.json();
  if (!data.success) return alert("Error creating room: " + data.error);

  // Embed Daily iframe
  call = DailyIframe.createFrame(document.getElementById('video'), {
    showLeaveButton: true,
    iframeStyle: { width: '100%', height: '100%' }
  });
  await call.join({ url: data.roomUrl });
}

// --- Control buttons ---
document.getElementById('muteBtn').onclick = () => {
  if (!call) return;
  isMuted = !isMuted;
  call.setLocalAudio(!isMuted);
  document.getElementById('muteBtn').textContent = isMuted ? 'Unmute Audio' : 'Mute Audio';
};

document.getElementById('videoBtn').onclick = () => {
  if (!call) return;
  videoOff = !videoOff;
  call.setLocalVideo(!videoOff);
  document.getElementById('videoBtn').textContent = videoOff ? 'Start Video' : 'Stop Video';
};

document.getElementById('endBtn').onclick = async () => {
  if (!call) return;
  call.leave();
  // Update Supabase
  await supabase.from('profile')
    .update({ is_live: false, stream_ended_at: new Date() })
    .eq('id', userId);
  alert('Stream ended.');
  call = null;
};

// --- Initialize ---
await getUser();
await startStream();
</script>

</body>
  </html>
