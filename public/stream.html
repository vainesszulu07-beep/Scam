<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamer Dashboard</title>
<style>
  body { font-family: system-ui; background:#f0f2f5; margin:0; padding:20px; }
  #controls { margin-bottom:10px; display:flex; gap:10px; }
  button { padding:8px 14px; cursor:pointer; border-radius:6px; border:none; }
  button.primary { background:#1877f2; color:white; }
  button.secondary { background:#e4e6eb; color:#000; }
  #video { width:100%; height:60vh; background:black; margin-bottom:10px; }
  #msg { background:white; padding:10px; border-radius:6px; white-space:pre-wrap; }
</style>
</head>
<body>

<h2>Streamer Dashboard</h2>

<div id="controls">
  <button id="muteBtn" class="primary">Mute Audio</button>
  <button id="videoBtn" class="primary">Stop Video</button>
  <button id="endBtn" class="secondary">End Stream</button>
</div>

<div id="video"></div>
<div id="msg">Press "End Stream" to stop.</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import DailyIframe from "https://cdn.jsdelivr.net/npm/@daily-co/daily-js/+esm";

// Initialize Supabase
const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const msgEl = document.getElementById('msg');
let userId = null;
let call = null;
let muted = false;
let videoOff = false;

// --- Get current user session ---
async function getUser() {
  const { data: { session }, error } = await supabase.auth.getSession();
  if(error || !session){
    msgEl.textContent = "Login required";
    return;
  }
  userId = session.user.id;
}

// --- Start or get Daily room ---
async function startStream() {
  if(!userId) { msgEl.textContent="User not loaded"; return; }

  const res = await fetch('/api/create-daily-room', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ userId })
  });

  let data;
  try { data = await res.json(); }
  catch(e){
    const text = await res.text();
    msgEl.textContent = "Non-JSON response:\n" + text;
    return;
  }

  if(!data.success){
    msgEl.textContent = "Error:\n" + JSON.stringify(data.error, null, 2);
    return;
  }

  msgEl.textContent = "Room ready!\n" + data.roomUrl;

  call = DailyIframe.createFrame(document.getElementById('video'), {
    iframeStyle:{ width:'100%', height:'100%' }
  });
  await call.join({ url: data.roomUrl });
}

// --- Button controls ---
document.getElementById('muteBtn').onclick = () => {
  if(!call) return;
  muted = !muted;
  call.setLocalAudio(!muted);
  document.getElementById('muteBtn').textContent = muted ? "Unmute Audio" : "Mute Audio";
};

document.getElementById('videoBtn').onclick = () => {
  if(!call) return;
  videoOff = !videoOff;
  call.setLocalVideo(!videoOff);
  document.getElementById('videoBtn').textContent = videoOff ? "Start Video" : "Stop Video";
};

document.getElementById('endBtn').onclick = async () => {
  if(!userId) return;

  const res = await fetch('/api/end-daily-room', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ userId })
  });

  const data = await res.json();
  msgEl.textContent = data.success ? data.message : "Error:\n" + JSON.stringify(data.error, null, 2);

  if(call){
    call.leave();
    call = null;
  }
};

// --- Initialize ---
await getUser();
if(userId) await startStream();

</script>

</body>
</html>
