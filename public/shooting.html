<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scripted Shooting Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 1px 1px 3px black;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="instructions">CLICK ANYWHERE TO SHOOT</div>

    <script>
        // --- 1. SETUP THE 3D WORLD ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 4); // Position camera to look over the shoulder/side
        camera.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Flashlight source mounted at the gun tip (starts turned off)
        const muzzleFlashLight = new THREE.PointLight(0xffaa44, 0, 10);
        scene.add(muzzleFlashLight);

        // --- 3. CREATE THE CHARACTER & GUN ---
        const characterGroup = new THREE.Group();

        // Body (Capsule/Cylinder)
        const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3366ff });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        characterGroup.add(body);

        // Head
        const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.35;
        characterGroup.add(head);

        // Gun Arm Pivot (Crucial for proper rotation point at the shoulder)
        const armPivot = new THREE.Group();
        armPivot.position.set(0.4, 0.8, 0.2); // Position at the shoulder
        characterGroup.add(armPivot);

        // The Weapon Mesh
        const gunGeo = new THREE.BoxGeometry(0.15, 0.15, 0.7);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0, 0, -0.3); // Offset so pivot is at the back handle
        armPivot.add(gun);

        scene.add(characterGroup);

        // --- 4. VISUAL EFFECTS (Muzzle Flash & Tracer) ---
        // Muzzle Flash Mesh
        const flashGeo = new THREE.ConeGeometry(0.2, 0.4, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
        muzzleFlash.rotation.x = Math.PI / 2; // Point forward
        muzzleFlash.position.set(0, 0, -0.7); // Place at weapon tip
        muzzleFlash.visible = false;
        armPivot.add(muzzleFlash); // Attach to arm so it moves with recoil

        // Bullet Tracer Line
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
        const lineGeometry = new THREE.BufferGeometry();
        const tracerLine = new THREE.Line(lineGeometry, lineMaterial);
        tracerLine.visible = false;
        scene.add(tracerLine);

        // --- 5. ANIMATION VARIABLES & LOGIC ---
        let recoilAngle = 0;
        let targetRecoilAngle = 0;
        let flashTimer = 0;

        // Position where the gun barrel tip is in the world space
        const barrelTipWorldPosition = new THREE.Vector3();

        function shoot() {
            // 1. Trigger the immediate violent snap backward
            targetRecoilAngle = 0.4; // Max rotation tilt in radians

            // 2. Position the light and turn on visual effects
            muzzleFlash.visible = true;
            muzzleFlash.rotation.z = Math.random() * Math.PI; // Random rotation so it looks organic
            
            muzzleFlashLight.intensity = 3; // Turn on flash light cast
            
            // Calculate where the gun tip is right now to spawn the tracer line
            muzzleFlash.getWorldPosition(barrelTipWorldPosition);
            muzzleFlashLight.position.copy(barrelTipWorldPosition);

            // Set up target line points (from gun tip straight forward)
            const tracerPoints = [];
            tracerPoints.push(barrelTipWorldPosition.clone());
            tracerPoints.push(new THREE.Vector3(barrelTipWorldPosition.x, barrelTipWorldPosition.y, barrelTipWorldPosition.z - 50)); // Shoots far out
            
            lineGeometry.setFromPoints(tracerPoints);
            tracerLine.visible = true;

            // Set frame countdown timer to hide the flash/tracer quickly
            flashTimer = 2; 
        }

        // --- 6. THE MAIN GAME/RENDERING LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Handle Muzzle Flash & Tracer lifespan (Turn off after 2 frames / ~30ms)
            if (flashTimer > 0) {
                flashTimer--;
                if (flashTimer === 0) {
                    muzzleFlash.visible = false;
                    tracerLine.visible = false;
                    muzzleFlashLight.intensity = 0; // Turn off light cast
                }
            }

            // Math Engine for the Recoil:
            // Linear Interpolation (LERP) smooths out movements over frames.
            if (targetRecoilAngle > 0) {
                // Instantly snap to the recoil position
                recoilAngle = THREE.MathUtils.lerp(recoilAngle, targetRecoilAngle, 0.7);
                // Once it reaches close to the peak, reset the target back to 0
                if (targetRecoilAngle - recoilAngle < 0.05) {
                    targetRecoilAngle = 0;
                }
            } else {
                // Bouncy/Elastic recovery back to standard position
                recoilAngle = THREE.MathUtils.lerp(recoilAngle, 0, 0.1);
            }

            // Apply the calculated rotation variable directly to the shoulder pivot
            armPivot.rotation.x = -recoilAngle;

            renderer.render(scene, camera);
        }

        // --- 7. EVENT LISTENERS ---
        window.addEventListener('click', shoot);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the engine loop
        animate();
    </script>
</body>
</html>
