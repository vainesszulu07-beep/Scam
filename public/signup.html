<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Inter', sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: white;
    padding: 30px 25px;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  h2 { margin-bottom: 20px; }

  input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    cursor: pointer;
  }

  button:hover { background: #4f46e5; }

  .google-btn {
    background: #DB4437;
    margin-top: 10px;
  }

  .google-btn:hover { background: #c33d2f; }

  .message {
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
  }

  .login-link {
    margin-top: 12px;
    display: block;
    color: #6366f1;
    text-decoration: none;
    font-size: 14px;
  }

  .login-link:hover { text-decoration: underline; }
</style>
</head>

<body>
  <div class="card">
    <h2>Sign Up</h2>

    <input type="text" id="fullName" placeholder="Full Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="signupBtn">Sign Up</button>
    <button id="googleBtn" class="google-btn">Sign Up with Google</button>

    <div class="message" id="message"></div>
    <a href="login.html" class="login-link">Already have an account? Login</a>
  </div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://eimecuiixwgmpfpedxpr.supabase.co",
  "sb_publishable_yFjk-cShSqVzlQye7DqRdg_F3AJ39ou"
);

const fullNameInput = document.getElementById("fullName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const signupBtn = document.getElementById("signupBtn");
const googleBtn = document.getElementById("googleBtn");
const message = document.getElementById("message");

// ============================
// Handle profile after signup
// ============================
async function createProfile(user) {
  // Insert into profiles table if not exists
  await supabase.from("profiles").upsert({
    id: user.id,
    full_name: fullNameInput.value.trim() || null,
    contact: user.email,
    created_at: new Date(),
    bio: null,
    avatar_url: null,
    avatar_public_id: null
  });
  // Redirect to manage.html to complete profile
  window.location.href = "/manage.html";
}

// ============================
// Signup Button
// ============================
signupBtn.addEventListener("click", async () => {
  const fullName = fullNameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!fullName || !email || !password) {
    message.style.color = "red";
    message.textContent = "Please fill all fields.";
    return;
  }

  message.textContent = "Creating account...";

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (error) {
    message.style.color = "red";
    message.textContent = error.message;
    return;
  }

  await createProfile(data.user);
});

// ============================
// Google Signup
// ============================
googleBtn.addEventListener("click", async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin + "/signup.html" }
  });

  if (error) {
    message.style.color = "red";
    message.textContent = error.message;
  }
});
</script>

</body>
</html>
