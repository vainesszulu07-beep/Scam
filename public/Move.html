<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Detector Pro</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #121212; color: white; padding: 40px 20px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #status { font-size: 2rem; font-weight: bold; color: #00d1b2; margin: 20px 0; min-height: 1.2em; }
        #debug { font-family: monospace; color: #888; font-size: 0.9rem; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
        button { background: #007bff; color: white; border: none; padding: 20px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); background: #0056b3; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Device Position</h1>
        
        <button id="startBtn">Authorize Sensors</button>

        <div id="mainDisplay" class="hidden">
            <div id="status">Waiting...</div>
            
            <div id="debug">
                Beta (tilt): <span id="b">0</span><br>
                Gamma (roll): <span id="g">0</span>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const mainDisplay = document.getElementById('mainDisplay');
        const statusTxt = document.getElementById('status');
        const bTxt = document.getElementById('b');
        const gTxt = document.getElementById('g');

        startBtn.addEventListener('click', async () => {
            // iOS 13+ requires explicit permission via a click
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        init();
                    } else {
                        alert("Permission denied. Enable motion in settings.");
                    }
                } catch (err) {
                    alert("Error: Sensors require HTTPS to work.");
                }
            } else {
                // Android/Desktop usually doesn't need the requestPermission call
                init();
            }
        });

        function init() {
            startBtn.classList.add('hidden');
            mainDisplay.classList.remove('hidden');
            window.addEventListener('deviceorientation', handleOrientation);
        }

        function handleOrientation(event) {
            // Beta: -180 to 180 (Front-to-back tilt)
            // Gamma: -90 to 90 (Left-to-right tilt)
            const beta = event.beta; 
            const gamma = event.gamma;

            // Update Debug numbers
            bTxt.innerText = beta.toFixed(1);
            gTxt.innerText = gamma.toFixed(1);

            let orientation = "";
            let tilt = "";

            // 1. Detect Base Orientation
            // If phone is tilted sideways more than 45 degrees, it's Landscape
            if (Math.abs(gamma) > 45) {
                orientation = "Landscape";
            } else {
                orientation = "Portrait";
            }

            // 2. Detect Specific Tilts
            if (gamma < -25) {
                tilt = "Tilted Left";
            } else if (gamma > 25) {
                tilt = "Tilted Right";
            } else if (beta > 100) {
                tilt = "Tilted Up (Toward You)";
            } else if (beta < 60 && beta > 10) {
                tilt = "Tilted Down (Away)";
            } else {
                tilt = "Level";
            }

            statusTxt.innerHTML = `${orientation}<br><span style="font-size:1.2rem; color:#aaa">${tilt}</span>`;
        }
    </script>
</body>
</html>
